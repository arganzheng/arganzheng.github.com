<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">vLLM v0.27.1 包图：服务相关的子系统与依赖方向</title>
  <desc id="desc">entrypoints → v1.engine → v1.core / v1.executor → v1.worker → model_executor / attention / distributed / csrc 的依赖方向。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 19px; font-weight: 700; }
      .pkg { font-size: 14px; font-weight: 700; }
      .body { font-size: 12.5px; }
      .small { font-size: 11.5px; }
      .box { stroke-width: 1.7; rx: 10; }
      .note { fill: #6a7684; }
    </style>
  </defs>
  <rect width="760" height="560" fill="#fff"/>
  <text x="380" y="32" text-anchor="middle" class="title">包图：读源码先认这六个子系统（v0.27.1）</text>

  <rect x="60" y="58" width="300" height="74" class="box" fill="#eef5ff" stroke="#5880b4"/>
  <text x="80" y="82" class="pkg">vllm/entrypoints/</text>
  <text x="80" y="102" class="body">openai/：FastAPI 路由、协议对象、serve CLI</text>
  <text x="80" y="121" class="small">进程 A 的入口层</text>

  <rect x="430" y="58" width="290" height="74" class="box" fill="#eef5ff" stroke="#5880b4"/>
  <text x="450" y="82" class="pkg">vllm/v1/engine/</text>
  <text x="450" y="102" class="body">async_llm · input_processor · output_processor</text>
  <text x="450" y="121" class="small">core.py / core_client.py：A↔B 两侧都在这里</text>

  <rect x="60" y="178" width="300" height="74" class="box" fill="#fff6e9" stroke="#c6873d"/>
  <text x="80" y="202" class="pkg">vllm/v1/core/</text>
  <text x="80" y="222" class="body">sched/（Scheduler）· kv_cache_manager · block_pool</text>
  <text x="80" y="241" class="small">进程 B：调度与 KV 状态</text>

  <rect x="430" y="178" width="290" height="74" class="box" fill="#fff6e9" stroke="#c6873d"/>
  <text x="450" y="202" class="pkg">vllm/v1/executor/</text>
  <text x="450" y="222" class="body">abstract → uniproc / multiproc / ray</text>
  <text x="450" y="241" class="small">进程 B 内对象，负责拉起并驱动 C</text>

  <rect x="60" y="298" width="300" height="74" class="box" fill="#eff9f4" stroke="#4b9477"/>
  <text x="80" y="322" class="pkg">vllm/v1/worker/</text>
  <text x="80" y="342" class="body">gpu_worker · gpu_model_runner · gpu_input_batch</text>
  <text x="80" y="361" class="small">进程 C：每 rank 一个 WorkerProc</text>

  <rect x="430" y="298" width="290" height="74" class="box" fill="#eff9f4" stroke="#4b9477"/>
  <text x="450" y="322" class="pkg">vllm/model_executor/ + v1/attention/</text>
  <text x="450" y="342" class="body">models/：各模型定义；backends/：attention 实现</text>
  <text x="450" y="361" class="small">被 GPUModelRunner 调用</text>

  <rect x="60" y="418" width="300" height="66" class="box" fill="#f2eefb" stroke="#7a68a6"/>
  <text x="80" y="442" class="pkg">vllm/distributed/</text>
  <text x="80" y="462" class="body">parallel_state · pynccl · shm_broadcast</text>
  <text x="80" y="479" class="small">Worker 间 collective 与 B→C 共享内存通道</text>

  <rect x="430" y="418" width="290" height="66" class="box" fill="#f2eefb" stroke="#7a68a6"/>
  <text x="450" y="442" class="pkg">csrc/ → vllm._C / vllm._moe_C</text>
  <text x="450" y="462" class="body">CUDA/C++ kernel，setup.py + CMake 编译进 wheel</text>
  <text x="450" y="479" class="small">被 attention backend 与模型层调用</text>

  <line x1="360" y1="95" x2="428" y2="95" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M575 134 V160 H210 V176" fill="none" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M595 134 V176" fill="none" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="335" x2="428" y2="335" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="575" y1="252" x2="575" y2="296" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="210" y1="252" x2="210" y2="296" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="210" y1="372" x2="210" y2="416" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M575 372 V398 H565 V416" fill="none" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="380" y="512" text-anchor="middle" class="small note">依赖方向：entrypoints → engine（A 侧）→ core / executor（B 侧）→ worker（C 侧）→ model_executor、attention、distributed、csrc</text>
  <text x="380" y="534" text-anchor="middle" class="small note">箭头按 import 关系画；executor 调度 worker，worker 才碰模型与 kernel</text>
</svg>
