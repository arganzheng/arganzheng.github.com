name = "blog-annotations"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
REPO = "arganzheng/arganzheng.github.com"
CATEGORY = "Comments"
ALLOWED_ORIGINS = "https://arganzheng.life,https://arganzheng.github.io,http://localhost:4000"
ISSUE_LABEL = "划线评论"
# POST /issues files issues as our own GitHub App (Issues: read & write, installed
# on REPO). Fill in the App ID here; the private key is a secret, not a var:
#   wrangler secret put GITHUB_APP_PRIVATE_KEY < ~/Downloads/<app>.private-key.pem
# GITHUB_INSTALLATION_ID is optional (looked up via /repos/{REPO}/installation). 配置可以少一次 API 调用
GITHUB_INSTALLATION_ID = "160220353"
GITHUB_APP_ID = "4880637"

# GET/POST /views — page-view counter, one row per post in a D1 table (created on
# first use). Create the database once and paste its id here:
#   wrangler d1 create blog-views          # prints database_id
# Without this binding the route answers 501 and the client hides the counter.
[[d1_databases]]
binding = "DB"
database_name = "blog-views"
database_id = "REPLACE_WITH_DATABASE_ID"
