name = "blog-annotations"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
REPO = "arganzheng/arganzheng.github.com"
CATEGORY = "Comments"
ALLOWED_ORIGINS = "https://arganzheng.life,https://arganzheng.github.io,http://localhost:4000"
ISSUE_LABEL = "划线评论"
# POST /issues files issues as our own GitHub App (Issues: read & write, installed
# on REPO). Fill in the App ID here; the private key is a secret, not a var:
#   wrangler secret put GITHUB_APP_PRIVATE_KEY < ~/Downloads/<app>.private-key.pem
# GITHUB_INSTALLATION_ID is optional (looked up via /repos/{REPO}/installation).
GITHUB_APP_ID = ""
