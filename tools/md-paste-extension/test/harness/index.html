<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown paste extension test</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f5f8; color: #17212f; }
    header { padding: 18px 24px; background: #23364d; color: white; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 14px; min-height: calc(100vh - 88px); }
    section { min-width: 0; background: white; border: 1px solid #d6dde5; border-radius: 8px; overflow: hidden; }
    section h2 { margin: 0; padding: 10px 14px; border-bottom: 1px solid #d6dde5; font-size: 14px; }
    #textarea, #contenteditable { box-sizing: border-box; width: 100%; height: calc(100vh - 156px); padding: 14px; border: 0; outline: 0; resize: none; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow: auto; }
    #contenteditable { outline: none; }
    .cm-editor { height: calc(100vh - 156px); font-size: 13px; }
    .cm-scroller { overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #preview { height: calc(100vh - 156px); padding: 14px; overflow: auto; overflow-wrap: anywhere; }
    #preview h1, #preview h2, #preview h3 { color: #254c78; }
    #preview img { display: block; max-width: min(100%, 360px); max-height: 180px; margin: 8px 0; object-fit: contain; border: 1px solid #d8e0e8; }
    #preview pre { padding: 10px; overflow: auto; background: #f0f3f6; border-radius: 5px; }
    .uploading { color: #976100; background: #fff1c7; }
    .file-label { margin-top: 8px; color: #57697e; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="editor-title">编辑器测试</h1>
    <p>左侧编辑，右侧预览；图片由模拟的粘贴上传处理器接收。</p>
  </header>
  <main>
    <section>
      <h2>Markdown 编辑器</h2>
      <textarea id="textarea" aria-label="Markdown source" spellcheck="false"></textarea>
      <div id="cm-editor" hidden></div>
      <div id="contenteditable" contenteditable="true" role="textbox" aria-label="Rich editor" hidden></div>
      <div class="file-label" id="file-label"></div>
    </section>
    <section>
      <h2>预览</h2>
      <div id="preview"></div>
    </section>
  </main>
  <script type="module" src="/__md-paste-harness/editor.js"></script>
</body>
</html>
