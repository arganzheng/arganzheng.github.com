{% if site.giscus.repo %}
<!-- giscus 评论框（GitHub Discussions） start -->
<div class="comment">
    <div class="giscus"></div>
</div>
<script src="https://giscus.app/client.js"
        data-repo="{{ site.giscus.repo }}"
        data-repo-id="{{ site.giscus.repo_id }}"
        data-category="{{ site.giscus.category }}"
        data-category-id="{{ site.giscus.category_id }}"
        data-mapping="specific"
        data-term="{{ page.url }}"
        data-strict="0"
        data-reactions-enabled="{{ site.giscus.reactions_enabled | default: 1 }}"
        data-emit-metadata="0"
        data-input-position="{{ site.giscus.input_position | default: 'top' }}"
        data-theme="{{ site.giscus.theme | default: 'light' }}"
        data-lang="{{ site.giscus.lang | default: 'zh-CN' }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
<!-- giscus 评论框 end -->
{% endif %}
