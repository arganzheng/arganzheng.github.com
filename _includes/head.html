    <!-- Mermaid.js: renders ```mermaid fenced code blocks -->
    <script type="text/javascript">
      (function () {
        function initMermaid() {
          var blocks = document.querySelectorAll(
            '.post-container div.language-mermaid pre code, ' +
            '.post-container pre code.language-mermaid, ' +
            '.post-container code.language-mermaid'
          );
          if (!blocks.length) return;

          var s = document.createElement('script');
          s.type = 'text/javascript';
          s.async = true;
          s.src = '//cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
          s.onload = function () {
            if (typeof mermaid === 'undefined') return;
            mermaid.initialize({
              startOnLoad: false,
              theme: 'default',
              securityLevel: 'loose',
              flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
              sequence: { useMaxWidth: true, showSequenceNumbers: false },
              gantt: { useMaxWidth: true },
              mindmap: { useMaxWidth: true }
            });

            var containers = [];
            Array.prototype.forEach.call(blocks, function (code) {
              var pre = code.parentElement;
              if (!pre || pre.tagName.toLowerCase() !== 'pre') return;
              var container = document.createElement('div');
              container.className = 'mermaid';
              container.textContent = code.textContent;
              // Keep the source around: js/code-copy.js offers it as "copy" once
              // the diagram itself has been replaced by an <svg>.
              container.setAttribute('data-mermaid-source', code.textContent);
              pre.parentNode.replaceChild(container, pre);
              containers.push(container);
            });

            var renderQueue = Promise.resolve();
            containers.forEach(function (container, index) {
              renderQueue = renderQueue.then(function () {
                var source = container.textContent.trim();
                var id = 'mermaid-' + index + '-' + Date.now();
                return mermaid.render(id, source).then(function (result) {
                  container.innerHTML = result.svg;
                  if (result.bindFunctions) result.bindFunctions(container);
                }).catch(function (error) {
                  console.error('Mermaid render error (' + index + '):', error);
                  container.classList.add('mermaid-error');
                  container.textContent = source;
                });
              });
            });
          };
          document.head.appendChild(s);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initMermaid);
        } else {
          initMermaid();
        }
      })();
    </script>
</head>
