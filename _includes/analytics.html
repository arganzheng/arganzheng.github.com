<!-- Google Analytics 4 (gtag). `site.ga_track_id` is the G-… measurement id.
     Until 2026-09 this loaded the old analytics.js with a UA- id and relied on
     Google's UA->GA4 "connected site tag" to forward hits — one extra script,
     one dead /j/collect request per page view, and a compatibility layer Google
     may switch off unannounced. -->
{% if site.ga_track_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_track_id }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.ga_track_id }}');
</script>
{% endif %}


<!-- Baidu Tongji -->
{% if site.ba_track_id %}
<script>
    // dynamic User by Hux
    var _baId = '{{ site.ba_track_id }}';

    // Originial
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "//hm.baidu.com/hm.js?" + _baId;
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
</script>
{% endif %}
