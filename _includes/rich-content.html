<!-- Rich content renderers (Mermaid diagrams + KaTeX math).
     Shared by `_includes/head.html` (posts/pages) and `_layouts/slides.html`
     (reveal.js decks), so a deck renders diagrams and formulas exactly like a post. -->

<script type="text/javascript">
  // The containers holding kramdown output and generated outlines. Everything else
  // on the page (nav, footer) is skipped so we never touch markup we didn't render.
  // `.deck-thumbs` is the slide landing page's miniature rail (a copy of every slide).
  function richContentRoots() {
    return document.querySelectorAll('.post-container, .reveal .slides, .side-catalog, .deck-thumbs');
  }

  function richContentQuery(selectors) {
    var found = [];
    Array.prototype.forEach.call(richContentRoots(), function (root) {
      Array.prototype.push.apply(found, root.querySelectorAll(selectors));
    });
    return found;
  }
</script>

<!-- Mermaid.js: renders ```mermaid fenced code blocks -->
<script type="text/javascript">
  (function () {
    /*
     * An edge entering a subgraph from the top is drawn straight through the
     * subgraph title, because mermaid paints cluster labels before the edges.
     * The labels carry transforms relative to the nearest <g class="root">
     * (subgraphs with their own `direction` get a nested root), so re-appending
     * them at the end of that root puts them on top without moving them; the
     * cluster's own fill behind the text then hides the line underneath.
     */
    function liftClusterLabels(container) {
      var svg = container.querySelector('svg');
      var topRoot = svg && (svg.querySelector('g.root') || svg.querySelector('g'));
      if (!topRoot) return;
      Array.prototype.forEach.call(svg.querySelectorAll('g.cluster'), function (cluster) {
        var rect = cluster.querySelector('rect');
        var label = cluster.querySelector('.cluster-label');
        if (!rect || !label) return;
        var box = label.querySelector('foreignObject div');
        if (box) {
          // no padding: the <foreignObject> has a fixed width and clips, which
          // would cut off the last character of the title
          box.style.backgroundColor = rect.getAttribute('fill') || window.getComputedStyle(rect).fill;
        }
        var root = topRoot;
        for (var p = cluster.parentNode; p && p !== svg; p = p.parentNode) {
          if (p.classList && p.classList.contains('root')) { root = p; break; }
        }
        root.appendChild(label);
      });
    }

    function initMermaid() {
      var blocks = richContentQuery(
        'div.language-mermaid pre code, ' +
        'pre code.language-mermaid, ' +
        'code.language-mermaid'
      );
      if (!blocks.length) return;

      /*
       * $$…$$ in a Mermaid label is typeset by the page's KaTeX (the same 0.18.7
       * as the prose), not by Mermaid: Mermaid bundles KaTeX 0.16, whose class
       * names the 0.18 stylesheet no longer matches (superscripts stay full
       * size), and its math path drops <br/> and the spaces around a formula.
       * Before layout each formula becomes an empty inline-block of the size
       * KaTeX gives it (measured at the label font size, fonts loaded), so
       * Mermaid sizes the box for the real formula; after layout the
       * placeholder is filled with katex.render(). The source shown by the
       * copy button (data-mermaid-source) keeps the $$…$$.
       */
      var MATH_RE = /\$\$([\s\S]+?)\$\$/g;
      var KATEX = 'https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/';
      var labelPx = document.querySelector('.reveal .slides') ? 20 : 16;
      // Mermaid's default theme font (themeVariables.fontFamily), used by labels
      var MERMAID_FONT = '"trebuchet ms", verdana, arial, sans-serif';
      var hasMath = blocks.some(function (code) { return code.textContent.indexOf('$$') !== -1; });

      function loadOnce(tag, attrs, ready) {
        return new Promise(function (resolve) {
          if (ready()) return resolve();
          var sel = tag + '[' + (tag === 'link' ? 'href' : 'src') + '="' + (attrs.href || attrs.src) + '"]';
          var el = document.querySelector(sel);
          if (!el) {
            el = document.createElement(tag);
            for (var k in attrs) el.setAttribute(k, attrs[k]);
            document.head.appendChild(el);
          }
          el.addEventListener('load', function () { resolve(); });
          el.addEventListener('error', function () { resolve(); });
          setTimeout(resolve, 10000);
        });
      }
      function katexReady() {
        if (!hasMath) return Promise.resolve(false);
        return Promise.all([
          loadOnce('link', { rel: 'stylesheet', href: KATEX + 'katex.min.css' }, function () {
            return Array.prototype.some.call(document.styleSheets, function (s) { return s.href === KATEX + 'katex.min.css'; });
          }),
          loadOnce('script', { src: KATEX + 'katex.min.js' }, function () { return typeof katex !== 'undefined'; })
        ]).then(function () {
          if (typeof katex === 'undefined') return false;
          if (!document.fonts || !document.fonts.load) return true;
          var faces = ['16px KaTeX_Main', 'italic 16px KaTeX_Main', 'bold 16px KaTeX_Main',
                       'italic 16px KaTeX_Math', '16px KaTeX_Size1', '16px KaTeX_AMS'];
          return Promise.race([
            Promise.all(faces.map(function (f) { return document.fonts.load(f, 'aN1'); })),
            new Promise(function (r) { setTimeout(r, 8000); })
          ]).then(function () { return true; }, function () { return true; });
        });
      }

      // Replace every $$tex$$ by a placeholder span of the formula's size.
      // Two passes: render all formulas off-screen first so the browser fetches
      // whatever KaTeX faces they use (Size2 for \left( \right), AMS, …), wait
      // for document.fonts.ready, then measure — measuring with a fallback
      // face made a \left(…\right)V label 5px too narrow and clipped the V.
      // Only flowcharts get placeholders: their labels are HTML. In a
      // sequenceDiagram a message is SVG text, a span would show up as
      // literal markup, so the $$…$$ is left to Mermaid, which renders such
      // a message as HTML with MathML (browser math font, real sub- and
      // superscripts). Its flex label drops the spaces around a formula, so
      // they move inside the TeX as \  (control space), which Mermaid then
      // measures with the formula.
      function isFlowchart(source) {
        var first = source.split('\n').filter(function (l) {
          return l.trim() && l.trim().indexOf('%%') !== 0;
        })[0] || '';
        return /^\s*(flowchart|graph)\b/.test(first);
      }
      function keepMathSpaces(source) {
        return source.replace(/( ?)\$\$([\s\S]+?)\$\$( ?)/g, function (m, pre, tex, post) {
          return (pre ? ' ' : '') + '$$' + (pre ? '\\ ' : '') + tex + (post ? '\\ ' : '') + '$$' + (post ? ' ' : '');
        });
      }

      function mathPlaceholders(source, texts) {
        var probe = document.createElement('div');
        // line-height 1.5 = Mermaid's label div: the filled span inherits it,
        // so a placeholder measured at the default line-height came out taller
        // and lower, stretched every line, and left the box too tall
        // and the label's font: the line box (strut) depends on its ascent /
        // descent, so measuring in the article font shifted the baseline
        probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;line-height:1.5;' +
          'font-family:' + MERMAID_FONT + ';font-size:' + labelPx + 'px';
        document.body.appendChild(probe);
        var rows = [];
        source.replace(MATH_RE, function (m, tex) {
          var row = document.createElement('div');
          // the zero-size inline-block sits on the baseline
          row.innerHTML = '<span style="display:inline-block;width:0;height:0"></span>';
          // inline-block: an inline span's rect is one line of text tall,
          // whatever the fraction or root inside it
          var holder = document.createElement('span');
          holder.style.display = 'inline-block';
          row.appendChild(holder);
          probe.appendChild(row);
          var ok = true;
          try { katex.render(tex, holder, { throwOnError: false }); } catch (e) { ok = false; }
          rows.push({ row: row, holder: holder, ok: ok });
          return m;
        });
        var fontsReady = document.fonts && document.fonts.ready
          ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 8000); })])
          : Promise.resolve();
        return fontsReady.then(function () {
          var k = 0;
          var out = source.replace(MATH_RE, function (m, tex) {
            var it = rows[k++];
            if (!it.ok) return m;
            var base = it.row.firstChild.getBoundingClientRect().bottom;
            var r = it.holder.getBoundingClientRect();
            var i = texts.push(tex) - 1;
            return "<span class='mm-math' data-i='" + i + "' style='display:inline-block;" +
              // +4: 2px on every side — italic overhang (a final V, f) and the
              // tall glyphs of \sum / \lVert reach past the KaTeX box, and the
              // foreignObject clips at its edge; fillMath pads the same 2px
              'width:' + (Math.ceil(r.width) + 4) + 'px;height:' + (Math.ceil(r.height) + 4) + 'px;' +
              'vertical-align:' + (base - r.bottom - 2).toFixed(1) + "px'></span>";
          });
          probe.remove();
          return out;
        });
      }
      function fillMath(container, texts) {
        Array.prototype.forEach.call(container.querySelectorAll('.mm-math[data-i]'), function (el) {
          var tex = texts[+el.getAttribute('data-i')];
          // nowrap: inline KaTeX may break after = / − once the label is
          // narrower than the formula; the placeholder was measured unbroken
          el.setAttribute('style', 'display:inline-block;white-space:nowrap;padding:2px');
          try { katex.render(tex, el, { throwOnError: false }); } catch (e) { el.textContent = tex; }
        });
      }

      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.async = true;
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js';
      s.onload = function () {
        if (typeof mermaid === 'undefined') return;
        mermaid.initialize({
          startOnLoad: false,
          theme: 'default',
          securityLevel: 'loose',
          // reveal decks get a larger base font: the svg is then scaled to the
          // slide, and 16px mermaid labels land under ~10px rendered
          themeVariables: { fontSize: document.querySelector('.reveal .slides') ? '20px' : '16px' },
          // subGraphTitleMargin keeps cross-subgraph edges from being drawn
          // straight through the subgraph title text
          flowchart: {
            useMaxWidth: true,
            htmlLabels: true,
            curve: 'basis',
            wrappingWidth: 260,
            rankSpacing: 30,
            nodeSpacing: 24,
            subGraphTitleMargin: { top: 8, bottom: 16 }
          },
          sequence: { useMaxWidth: true, showSequenceNumbers: false },
          gantt: { useMaxWidth: true },
          mindmap: { useMaxWidth: true }
        });

        var containers = [];
        blocks.forEach(function (code) {
          var pre = code.parentElement;
          if (!pre || pre.tagName.toLowerCase() !== 'pre') return;
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.textContent = code.textContent;
          // Keep the source around: js/code-copy.js offers it as "copy" once
          // the diagram itself has been replaced by an <svg>.
          container.setAttribute('data-mermaid-source', code.textContent);
          pre.parentNode.replaceChild(container, pre);
          containers.push(container);
        });

        var useKatex = false;
        var renderQueue = katexReady().then(function (ok) { useKatex = ok; });
        containers.forEach(function (container, index) {
          renderQueue = renderQueue.then(function () {
            var source = container.textContent.trim();
            var id = 'mermaid-' + index + '-' + Date.now();
            var texts = [];
            var hasDollar = source.indexOf('$$') !== -1;
            var prep = !hasDollar ? Promise.resolve(source)
              : isFlowchart(source) ? (useKatex ? mathPlaceholders(source, texts) : Promise.resolve(source))
              : Promise.resolve(keepMathSpaces(source));
            return prep.then(function (input) { return mermaid.render(id, input); }).then(function (result) {
              container.innerHTML = result.svg;
              if (texts.length) fillMath(container, texts);
              if (result.bindFunctions) result.bindFunctions(container);
              liftClusterLabels(container);
            }).catch(function (error) {
              console.error('Mermaid render error (' + index + '):', error);
              container.classList.add('mermaid-error');
              container.textContent = source;
            });
          });
        });

        // Swapping the pre block for an svg changes the height of a slide, so reveal.js
        // has to re-measure. `_layouts/slides.html` listens for this.
        renderQueue.then(function () {
          document.dispatchEvent(new CustomEvent('richcontent:rendered'));
        });
      };
      document.head.appendChild(s);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
      initMermaid();
    }
  })();
</script>

<!-- KaTeX: renders LaTeX math. kramdown (math_engine: mathjax) turns
     $$...$$ into \(...\) inline / \[...\] display and keeps the source
     safe from the Markdown parser, so those are the delimiters we scan. -->
<script type="text/javascript">
  (function () {
    var KATEX = 'https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/';

    // Only prose counts: shell posts are full of `sed 's/\[//'` and
    // `Foo$$Lambda$613`, and those must not pull in the KaTeX bundle.
    function hasMath(root) {
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          return node.parentNode.closest('pre, code')
            ? NodeFilter.FILTER_REJECT
            : NodeFilter.FILTER_ACCEPT;
        }
      });
      while (walker.nextNode()) {
        var text = walker.currentNode.nodeValue;
        if (text.indexOf('\\(') !== -1 || text.indexOf('\\[') !== -1) return true;
      }
      // math that lives only in image alts becomes the caption's text node once
      // figures.js decorates it — but hasMath may run before that decoration
      var imgs = root.querySelectorAll ? root.querySelectorAll('img[alt]') : [];
      for (var i = 0; i < imgs.length; i++) {
        var alt = imgs[i].getAttribute('alt');
        if (alt.indexOf('\\(') !== -1 || alt.indexOf('\\[') !== -1) return true;
      }
      return false;
    }

    function load(tag, attrs, onload) {
      var el = document.createElement(tag);
      for (var key in attrs) el.setAttribute(key, attrs[key]);
      if (onload) el.onload = onload;
      document.head.appendChild(el);
    }

    function renderMath(root) {
      if (typeof renderMathInElement === 'undefined' || !root) return;
      renderMathInElement(root, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        // never touch code: `$PATH`, `Foo$$Lambda$613` and friends
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoredClasses: ['mermaid', 'highlight', 'highlighter-rouge'],
        throwOnError: false,
        errorColor: '#cf222e'
      });
    }
    window.renderRichMath = renderMath;

    function initMath() {
      var roots = Array.prototype.filter.call(richContentRoots(), hasMath);
      if (!roots.length) return;

      load('link', { rel: 'stylesheet', href: KATEX + 'katex.min.css' });
      load('script', { src: KATEX + 'katex.min.js' }, function () {
        load('script', { src: KATEX + 'contrib/auto-render.min.js' }, function () {
          if (typeof renderMathInElement === 'undefined') return;
          Array.prototype.forEach.call(richContentRoots(), function (root) {
            renderMath(root);
          });
          document.dispatchEvent(new CustomEvent('richcontent:rendered'));
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMath);
    } else {
      initMath();
    }
  })();
</script>
