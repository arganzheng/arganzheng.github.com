# Post series. A post joins one by putting `series: <key>` in its front matter;
# order within a series is by date. The overview post is *not* a member (it has
# no `series:` key) — it is linked from the nav as 系列总览. Rendering:
# _includes/series-nav.html (top quote), series-toc.html (bottom list), the
# post layouts' pager (series prev/next), series-badge.html on the list pages,
# and _plugins/series_pages.rb (/series/ index + /series/<key>/ pages).
#
# roadmap     which learning map the series belongs to: ai-algorithm | ai-infra |
#             ai-application (absent = not on any map)
# number      the series' ordinal inside that map (reading order; the Infra map's
#             posts call them 01 … 13)
# shared_with other maps that read the same series (listed there too, unnumbered)
# slides      the series' deck (slides/<key>.md → /slides/<key>.html), when there
#             is one: linked from series-nav.html and the /series.html tree
