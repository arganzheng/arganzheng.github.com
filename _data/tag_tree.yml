# 标签分层与合并（/tags/ 标签树 + 仪表盘「标签整理」）。文章 front matter 不用改。
#
# aliases: 别名 -> 主标签。构建时把文章里的别名换成主标签（site.tags、/tags/、归档、
#          搜索里都只剩主标签）；旧链接 /tags/#别名 会自动跳到主标签。
# similar: 疑似重复、暂不合并的标签对，只在仪表盘「标签整理」里提示，方便决定。
# distinct: 名字相近但确实不同的标签对，「标签整理」不再把它们当成疑似重复。
# tree:    分层。节点 name 和某个标签同名时，节点本身就是那个标签（如 AI-Infra）；
#          选中节点 = 它自己 + tags + children 里所有标签的文章。
#          每个标签只能出现一次；没放进来的标签自动归入「其他」。
#          未发布文章里的标签可以先写进来，没有公开文章的节点不显示。

aliases:
  Debug: Debugging
  Benchmarking: Benchmark
  Blog: 博客
  Security: 安全
  机器学习: Machine Learning
  Distributed: 分布式

similar:
  - [architecture, 架构]
  - [Storage, 存储]
  - [Inference, 大模型推理]
  - [Concurrency, 高并发]
  - [Distributed Training, Training]

distinct:
  - [LoRA, QLoRA]
  - [Tokenizer, tokenizers]
  - [Transformer, transformers]

