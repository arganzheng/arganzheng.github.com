---
- term: CLI
  full: command-line interface
  desc: 命令行界面
- term: JSONL
  full: JSON Lines
  desc: 每行一个 JSON 对象的文本格式，适合只追加写
- term: staging
  full: "—"
  desc: 上线前的预发布环境
- term: trace
  full: "—"
  desc: 一次任务每一步输入输出与决策的完整记录
- term: checkpoint
  full: "—"
  desc: 某一步之后的状态快照，崩溃后从这里续跑
- term: rollout
  full: "—"
  desc: 一次采样生成：给一组 prompt 跑完整前向
- term: hooks
  full: "—"
  desc: 在工具调用前后等节点运行的用户脚本
- term: RPC
  full: remote procedure call
  desc: 远程过程调用
- term: gRPC
  full: gRPC Remote Procedure Calls
  desc: Google 开源的 RPC 框架，用 Protobuf 编码
- term: logits
  full: "—"
  desc: 模型对每个候选 token 输出的未归一化分数
- term: KV
  full: key–value
  desc: 推理时缓存的注意力键值，即 KV cache
- term: OOM
  full: out of memory
  desc: 内存耗尽
- term: worker
  full: "—"
  desc: 执行子任务的 agent（或执行 workflow 的进程）
- term: fsync
  full: "—"
  desc: 把文件缓冲强制刷到磁盘的系统调用
- term: HF
  full: Hugging Face
  desc: 模型与数据集托管平台
- term: RL
  full: reinforcement learning
  desc: 强化学习
- term: AdamW
  full: Adam with decoupled weight decay
  desc: 带解耦权重衰减的 Adam 优化器，本篇训练循环默认用它
- term: bf16
  full: bfloat16
  desc: 16 位浮点，指数位与 fp32 一样多、尾数只有 7 位
- term: CUDA
  full: Compute Unified Device Architecture
  desc: NVIDIA 的 GPU 编程平台，conda 能连它的运行库一起装
- term: DDP
  full: Distributed Data Parallel
  desc: 数据并行：每卡一份完整模型，梯度做 all-reduce
- term: dtype
  full: data type
  desc: 数组元素的类型，如 float32、bfloat16
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，算力的计量单位
- term: fp16
  full: 16-bit floating point
  desc: 半精度浮点，混合精度训练里前向常用的格式
- term: fp32
  full: 32-bit floating point
  desc: 单精度浮点，每个数 4 字节
- term: FlashAttention
  full: "—"
  desc: 分块计算、不显式构造 T×T 矩阵的 attention kernel
- term: FSDP
  full: Fully Sharded Data Parallel
  desc: 把参数、梯度、优化器状态切到各卡的数据并行
- term: GiB
  full: gibibyte
  desc: 二进制 GB，1 GiB = 1024 MiB，显存账本里都用它
- term: GIL
  full: global interpreter lock
  desc: 全局解释器锁，同一时刻只有一个线程跑 Python 字节码
- term: H100
  full: "—"
  desc: NVIDIA 的 Hopper 架构训练卡，显存账本按它算
- term: hook
  full: "—"
  desc: 挂在 forward 前后、被自动调用的回调函数
- term: kernel
  full: "—"
  desc: 在 GPU 上执行的一个函数，通常对应一个算子
- term: LayerNorm
  full: layer normalization
  desc: 层归一化，每个 token 沿 hidden 维自己归一化
- term: mask
  full: "—"
  desc: 掩码，把不该看的位置加上 −∞ 或置零
- term: pickle
  full: "—"
  desc: Python 的对象序列化模块，进程间传数据靠它
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  desc: 只按均方根缩放、不减均值的归一化
- term: seed
  full: "—"
  desc: 随机数种子，换 seed 相当于换一次运气
- term: SFT
  full: supervised fine-tuning
  desc: 监督微调，用指令和回答对训练模型
- term: softmax
  full: "—"
  desc: 把一组分数归一化成概率分布的函数
- term: tokenize
  full: "—"
  desc: 把文本切成 token 的预处理步骤
- term: warmup
  full: "—"
  desc: 训练开头让学习率从小慢慢升到目标值
- term: batch
  full: "—"
  desc: 一次梯度更新用到的那一小批样本
- term: dropout
  full: "—"
  desc: 训练时随机把一部分神经元置零的正则化
- term: epoch
  full: "—"
  desc: 把训练集完整过一遍叫一个 epoch
- term: F1
  full: "—"
  desc: 精确率与召回率的调和平均，类别不平衡时比 accuracy 可靠
- term: logit
  full: "—"
  desc: 过 sigmoid / softmax 之前的原始分数
- term: NaN
  full: not a number
  desc: 浮点里的缺失值标记
- term: n-gram
  full: "—"
  desc: 连续 n 个词（或字符）组成的片段
- term: one-hot
  full: "—"
  desc: 只有一位是 1 的向量
- term: RLHF
  full: reinforcement learning from human feedback
  desc: 基于人类反馈的强化学习
- term: SGD
  full: stochastic gradient descent
  desc: 随机梯度下降，每步只用一小批样本
- term: weight decay
  full: "—"
  desc: 每步把权重往 0 拉一点，等价于 L2 正则
- term: NVL72
  full: "—"
  desc: 72 张 GPU 在一个 NVLink 域里的机柜
- term: PCI
  full: Peripheral Component Interconnect
  desc: PCIe 的前身，Linux 里仍沿用这个名字
- term: FP8
  full: 8-bit floating point
  desc: 8 位浮点数
- term: AG
  full: all-gather / all-to-all
  desc: Megatron dispatcher 名字里的两种通信
- term: EP
  full: expert parallelism
  desc: 专家并行，把 MoE 的专家分到不同卡上
- term: DP
  full: data parallelism
  desc: 数据并行，每张卡一份完整模型
- term: PP
  full: pipeline parallelism
  desc: 流水线并行，按层切到不同卡上
- term: IPC
  full: inter-process communication
  desc: 进程间通信，这里指跨进程共享显存
- term: GEMM
  full: general matrix multiply
  desc: 通用矩阵乘
- term: SM
  full: streaming multiprocessor
  desc: GPU 的计算单元，通信 kernel 也要占用
- term: TCPStore
  full: "—"
  desc: PyTorch 基于 TCP 的键值存储，用于 rendezvous
- term: LL / LL128
  full: low latency / low latency 128
  desc: NCCL 的两种低延迟协议，用 flag 代替内存屏障
- term: communicator
  full: "—"
  desc: NCCL 里一组 rank 的通信上下文
- term: NVML
  full: NVIDIA Management Library
