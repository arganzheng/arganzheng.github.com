---
- term: TFLOPS
  full: tera floating point operations per second
  zh: 每秒万亿次浮点运算
  say: "「T-FLOPS」"
  desc: 每秒 10^12 次浮点运算，卡的峰值算力单位
- term: HBM3
  full: High Bandwidth Memory 3
  zh: H100 用的第三代高带宽显存
  say: H-B-M 3
  desc: H100 用的第三代高带宽显存
- term: SXM
  full: Server PCI Express Module
  zh: NVIDIA 板载模组形态
  say: 逐字母 S-X-M
  desc: NVIDIA 的板载模组形态，功耗与带宽高于 PCIe 卡
- term: KL
  full: Kullback–Leibler divergence
  zh: KL 散度
  say: 逐字母 K-L
  desc: KL 散度，衡量两个分布差多远
- term: DP
  full: data parallelism
  zh: 数据并行
  say: 逐字母 D-P
  desc: 数据并行：每份副本处理不同数据
- term: CP
  full: context parallelism
  zh: 上下文并行
  say: 逐字母 C-P
  desc: 上下文并行：长序列按长度切到多张卡
- term: DAPO
  full: Decoupled Clip and Dynamic sAmpling Policy Optimization
  zh: clip-higher、过滤全对 / 全错组等
  say: D-A-P-O
  desc: 字节 Seed 的 GRPO 改进：非对称 clip 加动态采样
- term: TIS
  full: truncated importance sampling
  zh: 权重超过上限就截到上限
  say: T-I-S
  desc: 截断重要性采样：权重超过上限就截到上限
- term: MTP
  full: multi-token prediction
  zh: 多 token 预测
  say: 逐字母 M-T-P
  desc: 多 token 预测；推理时可当投机解码的草稿头
- term: MoE
  full: mixture of experts
  zh: 混合专家
  say: 逐字母 M-O-E
  desc: 混合专家：每个 token 只激活一部分专家
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 只训练低秩增量矩阵的参数高效微调
- term: RDMA
  full: remote direct memory access
  zh: 远程直接内存访问
  say: 逐字母 R-D-M-A
  desc: 远程直接内存访问，跨机传输不经过 CPU
- term: SPMD
  full: single program, multiple data
  zh: 每个进程跑同一份程序、处理不同数据
  say: S-P-M-D
  desc: 每张卡跑同一份程序、处理不同数据
- term: RM
  full: reward model
  zh: 奖励模型
  say: R-M
  desc: 奖励模型，给回答打分
- term: FLOP
  full: floating point operation
  zh: 一次浮点运算
  say: F-L-O-P
  desc: 一次浮点运算；文中算力账按 FLOP 记
- term: PPO
  full: Proximal Policy Optimization
  zh: 把新旧策略的概率比裁剪在 1±ε 内的策略梯度算…
  say: P-P-O
  desc: 近端策略优化：用 clip 限制每步更新幅度
- term: MFU
  full: model FLOPs utilization
  zh: 模型算力利用率
  say: 逐字母 M-F-U
  desc: 模型 FLOP 利用率：有效算力占峰值的比例
- term: EP
  full: expert parallelism
  zh: 专家并行
  say: 逐字母 E-P
  desc: 专家并行：MoE 的专家分到不同卡
- term: PP
  full: pipeline parallelism
  zh: 流水线并行
  say: 逐字母 P-P
  desc: 流水线并行：按层切到多张卡
- term: TP
  full: tensor parallelism
  zh: 张量并行
  say: 逐字母 T-P
  desc: 张量并行：一层的矩阵切到多张卡
- term: FLOPs
  full: floating-point operations
  zh: 浮点运算次数
  say: "/flɒps/「弗拉普斯」"
  desc: 浮点运算次数，算力开销单位
- term: GLM
  full: General Language Model
  zh: 智谱的大模型系列
  say: G-L-M
  desc: 智谱的大模型系列
- term: NIXL
  full: NVIDIA Inference Xfer Library
  zh: NVIDIA 推理传输库
  say: "「尼-克瑟」"
  desc: NVIDIA 面向推理的点对点数据传输库
- term: NCCL
  full: NVIDIA Collective Communications Library
  zh: NVIDIA 集合通信库
  say: "/ˈnɪkəl/「nickel」"
  desc: NVIDIA 的 GPU 集合通信库
- term: GEMM
  full: general matrix multiply
  zh: 通用矩阵乘
  say: "/dʒɛm/「jem」"
  desc: 通用矩阵乘，训练算力的主体
- term: SFT
  full: supervised fine-tuning
  zh: 监督微调
  say: 逐字母 S-F-T
  desc: 监督微调
- term: GRPO
  full: Group Relative Policy Optimization
  zh: 同一 prompt 采一组回答
  say: G-R-P-O
  desc: 组内回答互相比较算优势的 PPO 变体，不需要 critic
- term: RLHF
  full: reinforcement learning from human feedback
  zh: 基于人类反馈的强化学习
  say: R-L-H-F
  desc: 基于人类反馈的强化学习
- term: FSDP
  full: Fully Sharded Data Parallel
  zh: 把参数、梯度、优化器状态切到各卡的数据并行
  say: F-S-D-P
  desc: PyTorch 的全分片数据并行：参数、梯度、优化器状态按卡切分
- term: HBM
  full: high bandwidth memory
  zh: 高带宽显存
  say: 逐字母 H-B-M
  desc: GPU 上的高带宽显存
- term: DPO
  full: Direct Preference Optimization
  zh: 直接偏好优化
  say: 逐字母 D-P-O
  desc: 直接偏好优化：离线学偏好对，不需要 rollout
- term: MLA
  full: multi-head latent attention
  zh: 多头隐注意力
  say: 逐字母 M-L-A
  desc: DeepSeek 的注意力，把 KV 压成一个低秩向量
- term: EFLOP
  full: exa floating point operations
  zh: 10^18 次浮点运算
  say: E-F-L-O-P
  desc: 10^18 次浮点运算
- term: GQA
  full: grouped-query attention
  zh: 分组查询注意力
  say: 逐字母 G-Q-A
  desc: 多个 query 头共享一组 KV 头
- term: IB
  full: InfiniBand
  zh: InfiniBand
  say: 逐字母 I-B
  desc: 机间高速网络，支持 RDMA
- term: RoPE
  full: rotary position embedding
  zh: 旋转位置编码
  say: "/roʊp/「柔普」"
  desc: 旋转位置编码
- term: H2D
  full: host to device
  zh: 主机到设备
  say: 逐字母 H-2-D
  desc: 主机内存拷到显存
- term: D2H
  full: device to host
  zh: 设备到主机
  say: 逐字母 D-2-H
  desc: 显存拷回主机内存
- term: MIS
  full: masked importance sampling
  zh: 权重越界的 token 直接不算梯度
  say: M-I-S
  desc: 屏蔽式重要性采样：权重越界的 token 直接不算梯度
- term: IS
  full: importance sampling
  zh: 用两个分布的概率比修正样本
  say: I-S
  desc: 重要性采样：用两个分布的概率比修正样本
