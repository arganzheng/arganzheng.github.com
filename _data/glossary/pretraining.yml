---
- term: AdamW
  full: Adam with decoupled weight decay
  desc: 带解耦权重衰减的 Adam，预训练的默认优化器
- term: BPE
  full: byte-pair encoding
  desc: 字节对编码：反复合并最常见的相邻 pair 得到词表
- term: C4
  full: Colossal Clean Crawled Corpus
  desc: T5 用的 Common Crawl 清洗版语料，早期默认配方
- term: DCLM
  full: DataComp for Language Models
  desc: 开源数据配比实验基准与语料，验证「数据过滤比模型选择更值钱」
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，预训练预算的计量单位
- term: FP32
  full: 32-bit floating point
  desc: 单精度浮点，混精训练里权重与 master 副本的格式
- term: LSH
  full: locality-sensitive hashing
  desc: 局部敏感哈希，让相似的文本落进同一个桶
- term: MFU
  full: model FLOPs utilization
  desc: 模型算力利用率：实际吞吐 ÷ 理论峰值，预训练看它的健康度
- term: MoE
  full: mixture of experts
  desc: 混合专家：每层多个 FFN 专家、路由只激活其中几个
- term: WARC
  full: Web ARChive
  desc: Common Crawl 的存档文件格式，数据流水线从它开始
- term: WSD
  full: warmup–stable–decay
  desc: 预热—平稳—衰减三段式学习率调度，DeepSeek V3 用它
- term: WET
  full: "—"
  desc: WET 格式：Common Crawl 里已抽出的纯文本版本
