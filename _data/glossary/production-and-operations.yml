---
- term: GPAI
  full: general-purpose AI
  zh: 通用人工智能
  say: G-P-A-I
  desc: AI Act 里的通用模型，有单独的义务
- term: ZDR
  full: zero data retention
  zh: 零数据保留
  say: Z-D-R
  desc: 供应商不保存请求与响应内容的选项
- term: XPIA
  full: cross-prompt injection attack
  zh: 跨 prompt 注入攻击
  say: X-P-I-A
  desc: Microsoft 对间接 prompt injection 的叫法
- term: PTC
  full: programmatic tool calling
  zh: 程序化工具调用
  say: P-T-C
  desc: 让模型写代码一次调多个工具，把多轮变一轮
- term: TTFT
  full: time to first token
  zh: 首 token 时延
  say: 逐字母 T-T-F-T
  desc: 从发出请求到收到第一个输出 token 的时间
- term: MCP
  full: Model Context Protocol
  zh: 模型上下文协议
  say: M-C-P
  desc: 模型调用外部工具与数据的开放协议
- term: RAG
  full: retrieval-augmented generation
  zh: 检索增强生成
  say: "/ræɡ/「rag」"
  desc: 先检索资料、再让模型据此回答
