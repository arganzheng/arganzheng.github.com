---
- term: TTFT
  full: time to first token
  zh: 首 token 时延
  say: 逐字母 T-T-F-T
  desc: 从发出请求到收到第一个 token 的时间
- term: DDP
  full: Distributed Data Parallel
  zh: 每卡一份完整模型
  say: D-D-P
  desc: 数据并行：每卡一份完整模型，梯度做 all-reduce
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 冻结原权重、只训低秩矩阵的微调方法
- term: OOB
  full: out-of-bag
  zh: 随机森林里没被某棵树抽中的样本
  say: O-O-B
  desc: 袋外样本：随机森林里没被某棵树抽中的样本，可当验证集用
- term: EP
  full: expert parallelism
  zh: 专家并行
  say: 逐字母 E-P
  desc: 专家并行，把 MoE 的专家分到不同卡上
- term: DP
  full: data parallelism
  zh: 数据并行
  say: 逐字母 D-P
  desc: 数据并行，每张卡一份完整模型
- term: PP
  full: pipeline parallelism
  zh: 流水线并行
  say: 逐字母 P-P
  desc: 流水线并行，按层切到不同卡上
- term: GDR
  full: GPUDirect RDMA
  zh: 网卡直接读写显存的 RDMA
  say: G-D-R
  desc: 网卡直接读写显存的 RDMA
- term: SM
  full: streaming multiprocessor
  zh: GPU 流多处理器
  say: 逐字母 S-M
  desc: GPU 的计算单元，通信 kernel 也要占用
- term: NVML
  full: NVIDIA Management Library
  zh: 查询 GPU 状态与拓扑的管理库
  say: N-V-M-L
  desc: 查询 GPU 状态与拓扑的管理库
- term: GID
  full: local identifier / global identifier
  zh: InfiniBand 子网内地址 / 跨子网（R…
  say: G-I-D
  desc: InfiniBand 子网内地址 / 跨子网（RoCE 必用）地址
- term: TP
  full: tensor parallelism
  zh: 张量并行
  say: 逐字母 T-P
  desc: 张量并行，把一层的矩阵切到多张卡上
- term: IB
  full: InfiniBand
  zh: InfiniBand
  say: 逐字母 I-B
  desc: InfiniBand 的简称
- term: RoCE
  full: RDMA over Converged Ethernet
  zh: 以太网承载的 RDMA
  say: "/ˈrɒki/「rocky」"
  desc: 在以太网上承载 RDMA
- term: PD
  full: prefill–decode
  zh: prefill–decode 分离
  say: 逐字母 P-D
  desc: PD 分离：prefill 与 decode 放到不同节点上跑
- term: busbw
  full: bus bandwidth / algorithm bandwidth
  zh: 校正后的链路带宽与 S/T
  say: "「busbw」"
  desc: nccl-tests 报的两个带宽：校正后的链路带宽与 S/T
- term: RDMA
  full: remote direct memory access
  zh: 远程直接内存访问
  say: 逐字母 R-D-M-A
  desc: 网卡直接读写远端内存，绕开对端 CPU 和内核
- term: NCCL
  full: NVIDIA Collective Communications Library
  zh: NVIDIA 集合通信库
  say: "/ˈnɪkəl/「nickel」"
  desc: NVIDIA 的集合通信库，多卡通信的事实标准
- term: RAG
  full: retrieval-augmented generation
  zh: 检索增强生成
  say: "/ræɡ/「rag」"
  desc: 先检索资料，再让模型据此回答
- term: GDS
  full: GPUDirect Storage
  zh: GPU 显存和存储之间直接传数据的 NVIDIA…
  say: G-D-S
  desc: GPU 显存和存储之间直接传数据的 NVIDIA 技术
- term: SASS
  full: "—（NVIDIA 未给出官方全称）"
  zh: NVIDIA GPU 真正执行的机器指令
  say: S-A-S-S
  desc: NVIDIA GPU 真正执行的机器指令
- term: PTX
  full: Parallel Thread Execution
  zh: NVIDIA 的虚拟 GPU 指令集
  say: P-T-X
  desc: NVIDIA 的虚拟 GPU 指令集，由 ptxas 再编译
- term: MFU
  full: model FLOPs utilization
  zh: 模型算力利用率
  say: 逐字母 M-F-U
  desc: 模型算力利用率：实际吞吐 ÷ 理论峰值，预训练看它的健康度
- term: RPM / TPM
  full: requests per minute / tokens per minute
  zh: 每分钟请求数 / 每分钟 token 数的限额
  say: "「RPM / TPM」"
  desc: 每分钟请求数 / 每分钟 token 数的限额
- term: HBM
  full: high bandwidth memory
  zh: 高带宽显存
  say: 逐字母 H-B-M
  desc: GPU 上的高带宽显存
- term: D2H
  full: device to host
  zh: 设备到主机
  say: 逐字母 D-2-H
  desc: 显存拷回主机内存
- term: MIG
  full: multi-instance GPU
  zh: 把一张 GPU 切成多个互相隔离的实例
  say: M-I-G
  desc: 把一张 GPU 切成多个互相隔离的实例
- term: DRA
  full: dynamic resource allocation
  zh: K8s 的设备资源分配机制
  say: D-R-A
  desc: K8s 的设备资源分配机制
- term: DCGM
  full: Data Center GPU Manager
  zh: NVIDIA 的 GPU 监控套件
  say: D-C-G-M
  desc: NVIDIA 的 GPU 监控套件
- term: EPP
  full: Endpoint Picker
  zh: 推理网关里挑后端实例的组件
  say: E-P-P
  desc: 推理网关里挑后端实例的组件
