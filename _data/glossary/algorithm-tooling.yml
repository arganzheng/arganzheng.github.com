- term: "AdamW"
  full: "Adam with decoupled weight decay"
  desc: "带解耦权重衰减的 Adam 优化器，本篇训练循环默认用它"
- term: "bf16"
  full: "bfloat16"
  desc: "16 位浮点，指数位与 fp32 一样多、尾数只有 7 位"
- term: "causal"
  full: "—"
  desc: "causal attention：每个位置只看自己和前面"
- term: "CPython"
  full: "—"
  desc: "Python 的官方解释器，用 C 写成"
- term: "CUDA"
  full: "Compute Unified Device Architecture"
  desc: "NVIDIA 的 GPU 编程平台，conda 能连它的运行库一起装"
- term: "DDP"
  full: "Distributed Data Parallel"
  desc: "数据并行：每卡一份完整模型，梯度做 all-reduce"
- term: "dtype"
  full: "data type"
  desc: "数组元素的类型，如 float32、bfloat16"
- term: "einsum"
  full: "Einstein summation"
  desc: "用下标字符串写张量乘加的函数"
- term: "FLOPs"
  full: "floating-point operations"
  desc: "浮点运算次数，算力的计量单位"
- term: "fp16"
  full: "16-bit floating point"
  desc: "半精度浮点，混合精度训练里前向常用的格式"
- term: "fp32"
  full: "32-bit floating point"
  desc: "单精度浮点，每个数 4 字节"
- term: "FlashAttention"
  full: "—"
  desc: "分块计算、不显式构造 T×T 矩阵的 attention kernel"
- term: "FSDP"
  full: "Fully Sharded Data Parallel"
  desc: "把参数、梯度、优化器状态切到各卡的数据并行"
- term: "GiB"
  full: "gibibyte"
  desc: "二进制 GB，1 GiB = 1024 MiB，显存账本里都用它"
- term: "GIL"
  full: "global interpreter lock"
  desc: "全局解释器锁，同一时刻只有一个线程跑 Python 字节码"
- term: "H100"
  full: "—"
  desc: "NVIDIA 的 Hopper 架构训练卡，显存账本按它算"
- term: "head"
  full: "—"
  desc: "多头 attention 里的一个头，各用 d/h 维算一份"
- term: "hook"
  full: "—"
  desc: "挂在 forward 前后、被自动调用的回调函数"
- term: "IDE"
  full: "integrated development environment"
  desc: "集成开发环境，如 VS Code、PyCharm"
- term: "Infra"
  full: "infrastructure"
  desc: "训练与推理的底层系统：框架、算子、集群"
- term: "JDK"
  full: "Java Development Kit"
  desc: "Java 的开发工具包，含编译器与运行时"
- term: "JSONL"
  full: "JSON Lines"
  desc: "每行一个 JSON 对象的文本格式，适合逐行流式读"
- term: "kernel"
  full: "—"
  desc: "在 GPU 上执行的一个函数，通常对应一个算子"
- term: "KV"
  full: "key–value"
  desc: "attention 里被查的键与取值的值"
- term: "LayerNorm"
  full: "layer normalization"
  desc: "层归一化，每个 token 沿 hidden 维自己归一化"
- term: "logits"
  full: "—"
  desc: "softmax 之前的原始分数，每个词一个"
- term: "LoRA"
  full: "Low-Rank Adaptation"
  desc: "冻结原权重、只训低秩矩阵的微调方法"
- term: "LSH"
  full: "locality-sensitive hashing"
  desc: "局部敏感哈希，让相似的文本落进同一个桶"
- term: "mask"
  full: "—"
  desc: "掩码，把不该看的位置加上 −∞ 或置零"
- term: "Maven"
  full: "—"
  desc: "Java 的依赖管理与构建工具"
- term: "MinHash"
  full: "—"
  desc: "用哈希签名估计两段文本相似度的近似去重方法"
- term: "ndarray"
  full: "N-dimensional array"
  desc: "NumPy 的多维数组：一块内存加形状和 dtype"
- term: "OOM"
  full: "out of memory"
  desc: "显存或内存不足导致的报错，账本就是为了不算它"
- term: "pdb"
  full: "Python debugger"
  desc: "Python 自带的命令行调试器"
- term: "pickle"
  full: "—"
  desc: "Python 的对象序列化模块，进程间传数据靠它"
- term: "Polars"
  full: "—"
  desc: "Rust 写的 DataFrame 库，多线程、惰性执行"
- term: "PPL"
  full: "perplexity"
  desc: "困惑度，交叉熵的指数，越小越好"
- term: "RMSNorm"
  full: "Root Mean Square Layer Normalization"
  desc: "只按均方根缩放、不减均值的归一化"
- term: "RNN"
  full: "recurrent neural network"
  desc: "循环神经网络，按时间步逐个处理序列"
- term: "scaling law"
  full: "—"
  desc: "loss 随参数量、数据量按幂律下降的经验规律"
- term: "Seaborn"
  full: "—"
  desc: "建在 Matplotlib 上的统计绘图库"
- term: "seed"
  full: "—"
  desc: "随机数种子，换 seed 相当于换一次运气"
- term: "SFT"
  full: "supervised fine-tuning"
  desc: "监督微调，用指令和回答对训练模型"
- term: "softmax"
  full: "—"
  desc: "把一组分数归一化成概率分布的函数"
- term: "SQL"
  full: "Structured Query Language"
  desc: "关系数据库的查询语言，GROUP BY 就是分组聚合"
- term: "tokenize"
  full: "—"
  desc: "把文本切成 token 的预处理步骤"
- term: "warmup"
  full: "—"
  desc: "训练开头让学习率从小慢慢升到目标值"
- term: "worker"
  full: "—"
  desc: "进程池里实际干活的子进程"
