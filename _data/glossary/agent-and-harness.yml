  full: Language Server Protocol
  desc: 编辑器与语言服务器之间的协议，MCP 借鉴了它
- term: stdio
  full: standard input/output
  desc: 标准输入输出，本地 MCP server 的传输方式
- term: Streamable HTTP
  full: "—"
  desc: MCP 的远程传输：普通 HTTP，响应可流式返回
- term: MRTR
  full: multi round-trip request
  desc: server 需要输入时结束请求，由 client 带结果重发
- term: OAuth
  full: Open Authorization
  desc: 授权委托标准，远程 MCP server 用它鉴权
- term: DCR
  full: Dynamic Client Registration
  desc: OAuth 客户端运行时自动注册（RFC 7591）
- term: RPC
  full: remote procedure call
  desc: 远程过程调用
- term: gRPC
  full: gRPC Remote Procedure Calls
  desc: Google 开源的 RPC 框架，用 Protobuf 编码
- term: logits
  full: "—"
  desc: 模型对每个候选 token 输出的未归一化分数
- term: ZDR
  full: zero data retention
  desc: 零数据保留：供应商不存请求与响应数据
- term: KV
  full: key–value
  desc: 推理时缓存的注意力键值，即 KV cache
- term: OOM
  full: out of memory
  desc: 内存耗尽
- term: activity / signal
  full: "—"
  desc: Temporal 里可重试的一步执行 / 从外部送进工作流的事件
- term: worker
  full: "—"
  desc: 执行子任务的 agent（或执行 workflow 的进程）
- term: fsync
  full: "—"
  desc: 把文件缓冲强制刷到磁盘的系统调用
- term: webhook
  full: "—"
