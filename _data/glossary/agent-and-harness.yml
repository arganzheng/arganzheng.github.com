---
- term: p50 / p95
  full: 50th / 95th percentile
  desc: 中位数 / 第 95 百分位，用来看长尾
- term: GraphRAG
  full: "—"
  desc: 先建知识图谱再检索的 RAG（检索增强生成）方法
- term: AIP
  full: Artificial Intelligence Platform
  desc: Palantir 的 AI 平台，agent 在本体上做动作
- term: IDE
  full: integrated development environment
  desc: 集成开发环境，如 VS Code
- term: CLI
  full: command-line interface
  desc: 命令行界面
- term: TUI
  full: terminal user interface
  desc: 在终端里画出来的交互界面
- term: JSONL
  full: JSON Lines
  desc: 每行一个 JSON 对象的文本格式，适合只追加写
- term: staging
  full: "—"
  desc: 上线前的预发布环境
- term: microVM
  full: "—"
  desc: 轻量虚拟机，启动快、隔离强于容器
- term: ACL
  full: access control list
  desc: 访问控制列表，按用户 / 组列出允许的操作
- term: SBPL
  full: Sandbox Profile Language
  desc: macOS Seatbelt 沙箱的策略语言
- term: E2B
  full: "—"
  desc: 给 agent 提供隔离执行环境的云沙箱服务
- term: CIMD
  full: Client ID Metadata Document
  desc: 用一个 URL 上的元数据文档代替客户端注册
- term: RFC
  full: Request for Comments
  desc: IETF 发布互联网标准的文档系列
- term: crate
  full: "—"
  desc: Rust 的包，Codex 按 crate 拆模块
- term: trace
  full: "—"
  desc: 一次任务每一步输入输出与决策的完整记录
- term: elicitation
  full: "—"
  desc: MCP server 经 client 向用户要确认或参数
- term: A2A
  full: Agent2Agent
  desc: 不同厂商的 agent 之间互相委派任务的协议
- term: ultra
  full: "—"
  desc: GPT-5.6 的多 agent 并行模式
- term: handoff
  full: "—"
  desc: 把对话控制权整个交给另一个 agent
- term: agent teams
  full: "—"
  desc: Claude Code 的实验功能：多个 agent 互相通信协作
- term: subagent
  full: "—"
  desc: 主 agent 起的子 agent，独立上下文，只回传摘要
- term: seccomp
  full: secure computing mode
  desc: Linux 限制进程能用哪些系统调用的机制
- term: Landlock
  full: "—"
  desc: Linux 内核的无特权访问控制，限制可访问路径
- term: bubblewrap
  full: "—"
  desc: Linux 的无特权沙箱工具，用命名空间隔离进程
- term: Seatbelt
  full: "—"
  desc: macOS 内置的进程沙箱机制
- term: Guardian
  full: "—"
  desc: Codex 的审查机制：一个模型审另一个模型的高风险调用
- term: Starlark
  full: "—"
  desc: Python 方言的配置语言，Codex 用它写执行策略
- term: durable execution
  full: "—"
  desc: 每步结果持久化、崩溃后能从断点续跑的执行模型
- term: Temporal
  full: "—"
  desc: 开源的 durable execution 平台
- term: checkpoint
  full: "—"
  desc: 某一步之后的状态快照，崩溃后从这里续跑
- term: LangGraph
  full: "—"
  desc: LangChain 的 agent 编排框架，带 checkpoint
- term: rollout
  full: "—"
  desc: Codex 存会话事件的记录文件
- term: resume / fork / replay
  full: "—"
  desc: 续跑 / 从某一步分叉 / 按记录重放
- term: serving
  full: "—"
  desc: 把模型部署成在线推理服务
- term: Code Mode
  full: "—"
  desc: Cloudflare 的方案：让模型写代码调用 MCP 工具
- term: PTC
  full: programmatic tool calling
  desc: 模型写程序调多个工具，只把结果送回上下文
- term: tool search
  full: "—"
  desc: 工具定义按需检索加载，不一次塞进上下文
- term: PocketOS
  full: "—"
  desc: agent 用越权 token 9 秒删掉生产卷与备份的事故
- term: MCP
  full: Model Context Protocol
  desc: 模型客户端连接工具服务器的开放协议
- term: hooks
  full: "—"
  desc: 在工具调用前后等节点运行的用户脚本
- term: OpenHarness
  full: "—"
  desc: 港大 HKUDS 的开源 harness 实现，Python
- term: Cordis
  full: "—"
  desc: DeepSeek Harness 的插件框架，组件都是插件
- term: SDK
  full: software development kit
  desc: 软件开发工具包，这里指写 agent 的库
- term: Agents API
  full: "—"
  desc: OpenAI 托管 harness 与运行时的 agent 服务
- term: harness
  full: "—"
  desc: 模型之外的循环、工具、权限、沙箱、会话等运行设施
- term: L1
  full: "—"
  desc: "《AI 应用工程师学习地图》的第 1、2、3、4、5、6 层"
- term: L2
  full: "—"
  desc: "《AI 应用工程师学习地图》的第 1、2、3、4、5、6 层"
- term: L3
  full: "—"
  desc: "《AI 应用工程师学习地图》的第 1、2、3、4、5、6 层"
- term: L4
  full: "—"
  desc: "《AI 应用工程师学习地图》的第 1、2、3、4、5、6 层"
- term: effort
  full: "—"
  desc: 推理模型的思考力度档位，越高越慢越贵
- term: TTFT
  full: time to first token
  desc: 从发出请求到收到第一个 token 的时间
