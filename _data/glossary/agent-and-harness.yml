---
- term: p50 / p95
  full: 50th / 95th percentile
  desc: 中位数 / 第 95 百分位，用来看长尾
- term: AIP
  full: Artificial Intelligence Platform
  desc: Palantir 的 AI 平台，agent 在本体上做动作
- term: TUI
  full: terminal user interface
  desc: 在终端里画出来的交互界面
- term: JSONL
  full: JSON Lines
  desc: 每行一个 JSON 对象的文本格式，适合只追加写
- term: ACL
  full: access control list
  desc: 访问控制列表，按用户 / 组列出允许的操作
- term: SBPL
  full: Sandbox Profile Language
  desc: macOS Seatbelt 沙箱的策略语言
- term: CIMD
  full: Client ID Metadata Document
  desc: 用一个 URL 上的元数据文档代替客户端注册
- term: RFC
  full: Request for Comments
  desc: IETF 发布互联网标准的文档系列
- term: A2A
  full: Agent2Agent
  desc: 不同厂商的 agent 之间互相委派任务的协议
- term: seccomp
  full: secure computing mode
  desc: Linux 限制进程能用哪些系统调用的机制
- term: PTC
  full: programmatic tool calling
  desc: 模型写程序调多个工具，只把结果送回上下文
- term: MCP
  full: Model Context Protocol
  desc: 模型客户端连接工具服务器的开放协议
- term: TTFT
  full: time to first token
  desc: 从发出请求到收到第一个 token 的时间
- term: LSP
  full: Language Server Protocol
  desc: 编辑器与语言服务器之间的协议，MCP 借鉴了它
- term: stdio
  full: standard input/output
  desc: 标准输入输出，本地 MCP server 的传输方式
- term: MRTR
  full: multi round-trip request
  desc: server 需要输入时结束请求，由 client 带结果重发
- term: OAuth
  full: Open Authorization
  desc: 授权委托标准，远程 MCP server 用它鉴权
- term: DCR
  full: Dynamic Client Registration
  desc: OAuth 客户端运行时自动注册（RFC 7591）
- term: RPC
  full: remote procedure call
  desc: 远程过程调用
- term: gRPC
  full: gRPC Remote Procedure Calls
  desc: Google 开源的 RPC 框架，用 Protobuf 编码
- term: ZDR
  full: zero data retention
  desc: 零数据保留：供应商不存请求与响应数据
- term: OOM
  full: out of memory
  desc: 内存耗尽
- term: VPC
  full: virtual private cloud
  desc: 云上隔离出来的私有网络
- term: ACP
  full: Agent Client Protocol
  desc: 客户端驱动外部 agent 的协议，如拉起 Claude Code
- term: TS
  full: TypeScript
  desc: TypeScript 的简写
- term: E2E
  full: end-to-end
  desc: 端到端测试
- term: SAE
  full: Society of Automotive Engineers
  desc: 国际汽车工程师学会，自动驾驶 0–5 级出自它
- term: DDL
  full: data definition language
  desc: 建表、删表这类改数据库结构的语句
- term: AAIF
  full: Agentic AI Foundation
  desc: Linux 基金会下治理 MCP 等项目的基金会
- term: GenAI
  full: generative AI
  desc: 生成式 AI；OpenTelemetry 为它定了语义约定
