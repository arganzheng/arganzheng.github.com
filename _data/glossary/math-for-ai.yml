---
- term: DPO
  full: Direct Preference Optimization
  zh: 直接偏好优化
  say: 逐字母 D-P-O
  desc: 不用奖励模型、直接从偏好数据推 loss 的偏好训练方法
- term: SVD
  full: singular value decomposition
  zh: 奇异值分解
  say: S-V-D
  desc: 奇异值分解，把矩阵拆成旋转-伸缩-旋转
- term: KL
  full: Kullback–Leibler divergence
  zh: KL 散度
  say: 逐字母 K-L
  desc: KL 散度，衡量两个分布差多少的非对称度量
- term: SGD
  full: stochastic gradient descent
  zh: 随机梯度下降
  say: 逐字母 S-G-D
  desc: 随机梯度下降，按小批数据的梯度更新参数
- term: RLHF
  full: reinforcement learning from human feedback
  zh: 基于人类反馈的强化学习
  say: R-L-H-F
  desc: 用人类反馈的奖励做强化学习微调
- term: GRPO
  full: Group Relative Policy Optimization
  zh: 组相对策略优化
  say: G-R-P-O
  desc: 用组内均值替代价值模型的策略梯度方法
- term: MLE
  full: maximum likelihood estimation
  zh: 最大似然估计
  say: M-L-E
  desc: 最大似然估计，让数据概率最大的参数估计
- term: SFT
  full: supervised fine-tuning
  zh: 监督微调
  say: 逐字母 S-F-T
  desc: 用标注答案做监督微调
- term: PPL
  full: perplexity
  zh: 困惑度
  say: P-P-L
  desc: 困惑度，交叉熵的指数，越小越好
- term: PPO
  full: Proximal Policy Optimization
  zh: 近端策略优化
  say: P-P-O
  desc: 带裁剪目标、防步子过大的策略梯度方法
- term: TV
  full: total variation
  zh: 总变差距离
  say: T-V
  desc: 全变差距离，另一种分布间距离
  aliases:
  - 总变差距离
- term: FLOPs
  full: floating-point operations
  zh: 浮点运算次数
  say: "/flɒps/「弗拉普斯」"
  desc: 浮点运算次数，算量的计量单位
- term: MLP
  full: multi-layer perceptron
  zh: 多层感知机
  say: 逐字母 M-L-P
  desc: 多层感知机：线性层 + 非线性激活叠起来的网络
- term: GLU
  full: gated linear unit
  zh: 门控线性单元
  say: 逐字母 G-L-U，或 /ɡluː/「glue」
  desc: 门控线性单元，两路线性相乘的激活结构
- term: FFN
  full: feed-forward network
  zh: 前馈网络
  say: 逐字母 F-F-N
  desc: 前馈网络，Transformer 里 attention 之外的另一半参数
- term: CLIP
  full: Contrastive Language–Image Pre-training
  zh: 对比语言-图像预训练
  say: "/klɪp/「可利普」"
  desc: OpenAI 的图文对比模型，把图和文嵌进同一空间
- term: RoPE
  full: rotary position embedding
  zh: 旋转位置编码
  say: "/roʊp/「柔普」"
  desc: 旋转位置编码，按位置把向量转一个角度
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 低秩适配：冻结主干、只训低秩增量的微调方法
- term: PCA
  full: principal component analysis
  zh: 主成分分析
  say: P-C-A
  desc: 主成分分析，找方差最大的方向做降维
- term: MAP
  full: maximum a posteriori
  zh: 最大后验估计
  say: M-A-P
  desc: 最大后验估计，加先验的参数估计
- term: MSE
  full: mean squared error
  zh: 均方误差
  say: 逐字母 M-S-E
  desc: 均方误差，预测与目标差的平方均值
- term: SE
  full: standard error
  zh: 标准误
  say: S-E
  desc: 标准误，统计量自身的波动大小
