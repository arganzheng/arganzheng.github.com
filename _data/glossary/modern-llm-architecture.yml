---
- term: TTFT
  full: time to first token
  desc: 从发出请求到收到第一个 token 的时间
- term: bf16
  full: bfloat16
  desc: 16 位浮点，指数位与 fp32 一样多、尾数只有 7 位
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，算力的计量单位
- term: fp16
  full: 16-bit floating point
  desc: 半精度浮点，混合精度训练里前向常用的格式
- term: FSDP
  full: Fully Sharded Data Parallel
  desc: 把参数、梯度、优化器状态切到各卡的数据并行
- term: GiB
  full: gibibyte
  desc: 二进制 GB，1 GiB = 1024 MiB，显存账本里都用它
- term: LoRA
  full: Low-Rank Adaptation
  desc: 冻结原权重、只训低秩矩阵的微调方法
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  desc: 只按均方根缩放、不减均值的归一化
- term: RNN
  full: recurrent neural network
  desc: 循环神经网络，按时间步逐个处理序列
- term: SFT
  full: supervised fine-tuning
  desc: 监督微调，用指令和回答对训练模型
- term: NaN
  full: not a number
  desc: 浮点里的缺失值标记
- term: RLHF
  full: reinforcement learning from human feedback
  desc: 基于人类反馈的强化学习
- term: SGD
  full: stochastic gradient descent
  desc: 随机梯度下降，每步只用一小批样本
- term: FP8
  full: 8-bit floating point
  desc: 8 位浮点数
- term: EP
  full: expert parallelism
  desc: 专家并行，把 MoE 的专家分到不同卡上
- term: DP
  full: data parallelism
  desc: 数据并行，每张卡一份完整模型
- term: PP
  full: pipeline parallelism
  desc: 流水线并行，按层切到不同卡上
- term: GEMM
  full: general matrix multiply
  desc: 通用矩阵乘
- term: SM
  full: streaming multiprocessor
  desc: GPU 的计算单元，通信 kernel 也要占用
- term: TP
  full: tensor parallelism
  desc: 张量并行，把一层的矩阵切到多张卡上
- term: IB
  full: InfiniBand
  desc: InfiniBand 的简称
- term: PD
  full: prefill–decode
  desc: PD 分离：prefill 与 decode 放到不同节点上跑
- term: ZeRO
  full: Zero Redundancy Optimizer
  desc: DeepSpeed 的分片优化器，去掉各卡上的冗余状态
- term: MoE
  full: mixture of experts
  desc: 混合专家模型，每个 token 只激活少数专家
- term: RAG
  full: retrieval-augmented generation
  desc: 先检索资料，再让模型据此回答
- term: AWQ
  full: Activation-aware Weight Quantization
  desc: 按激活大小保护关键权重的低比特量化方法
- term: FP64
  full: 64-bit floating point
  desc: 双精度浮点
- term: AMP
  full: automatic mixed precision
  desc: 自动混合精度：部分算子用低精度跑
- term: TF32
  full: TensorFloat-32
  desc: Ampere 起 Tensor Core 用的 19 位精度矩阵乘格式
- term: BF16
  full: bfloat16
  desc: 8 位指数的 16 位浮点，范围同 FP32
- term: FP16
  full: 16-bit floating point
  desc: 半精度浮点，5 位指数、10 位尾数
- term: CUTLASS
  full: CUDA Templates for Linear Algebra Subroutines
  desc: NVIDIA 的 C++ 矩阵乘模板库
- term: FP32
  full: 32-bit floating point
  desc: 单精度浮点，深度学习的默认精度
- term: ulp
  full: unit in the last place
  desc: 浮点数最低位一格代表的数值间隔
- term: BERT
  full: Bidirectional Encoder Representations from Transformers
  desc: 双向编码器模型，对照 decoder-only 的 GPT
- term: CLIP
  full: Contrastive Language–Image Pre-training
  desc: OpenAI 的图文对比模型，把图和文嵌进同一空间
- term: FFN
  full: feed-forward network
  desc: 前馈网络：Transformer block 里 attention 之后的子层
- term: GELU
  full: Gaussian error linear unit
  desc: 平滑的 ReLU 变体，GPT 时代的默认激活
- term: GLU
  full: gated linear unit
  desc: 门控线性单元：两路相乘做门控，SwiGLU 的原型
- term: LSTM
  full: long short-term memory
  desc: 带门控记忆的 RNN，Transformer 之前的序列主力
- term: MLP
  full: multi-layer perceptron
  desc: 多层感知机：线性层 + 非线性激活叠起来的网络
- term: ReLU
  full: rectified linear unit
  desc: max(0, x)，现代激活函数的起点
- term: RoPE
  full: rotary position embedding
  desc: 旋转位置编码：按位置把向量转一个角度
- term: SiLU
  full: Sigmoid Linear Unit
  desc: x·sigmoid(x)，又叫 Swish；SwiGLU 的门控用它
- term: SwiGLU
  full: Swish-Gated Linear Unit
  desc: 用 SiLU 做门控的 FFN：两路相乘再降维
- term: ViT
  full: Vision Transformer
  desc: 把图像切块当序列送进 Transformer
- term: EAGLE
  full: "—"
  desc: 在特征层外推草稿的投机解码方法，接受率比 Medusa 高
- term: GQA
  full: grouped-query attention
  desc: 多个 q 头共用一组 k、v 头，KV cache 更小
- term: GPTQ
  full: "—"
  desc: 逐层用二阶信息补偿误差的训练后权重量化方法
- term: INT4
  full: 4-bit integer
  desc: 均匀 16 格的 4 bit 整数量化
- term: INT8
  full: 8-bit integer
  desc: 8 bit 整数量化，精度损失最小的低比特档
- term: MLA
  full: multi-head latent attention
  desc: 把 KV 压成低秩隐向量的 attention，DeepSeek 用它
- term: MTP
  full: multi-token prediction
  desc: 一次预测多个 token 的模块，训练出的头可投给投机解码
- term: W4A16
  full: "—"
  desc: 权重 4 bit、激活 16 bit 的量化档，PTQ 的常用配置
- term: W8A8
  full: "—"
  desc: 权重、激活都 8 bit 的量化档
- term: SDPA
  full: scaled dot-product attention
  desc: PyTorch 的融合 attention 函数，自选 kernel
- term: BPE
  full: byte-pair encoding
  desc: 字节对编码：反复合并最常见的相邻 pair 得到词表
- term: GEMV
  full: general matrix–vector multiply
  desc: 矩阵乘向量，decode 时 batch 为 1 的线性层
- term: MMA
  full: matrix multiply-accumulate
  desc: 矩阵乘加，Tensor Core 指令的统称
- term: FMA
  full: fused multiply-add
  desc: 融合乘加指令，不走 Tensor Core 的路径
- term: BLIP-2
  full: bootstrapped language-image pre-training
  desc: Salesforce 的 VLM，connector 是 Q-Former
- term: DiT
  full: diffusion transformer
  desc: 用 Transformer 替代 U-Net 的扩散骨干
- term: LLaVA
  full: large language and vision assistant
  desc: 早期主流 VLM，connector 是线性层 / MLP
- term: M-RoPE
  full: multimodal RoPE
  desc: Qwen2-VL 的三维（时间/高/宽）位置编码
- term: OCR
  full: optical character recognition
  desc: 光学字符识别，读出图里的文字
- term: Q-Former
  full: querying Transformer
  desc: BLIP-2 的 connector：K 个可学习 query 做 cross-attention
- term: VLM
  full: vision-language model
  desc: 能看图回答问题的语言模型
- term: MFU
  full: model FLOPs utilization
  desc: 模型算力利用率：实际吞吐 ÷ 理论峰值，预训练看它的健康度
- term: TFLOPS
  full: tera floating point operations per second
  desc: 每秒 10^12 次浮点运算，卡的峰值算力单位
- term: HBM3
  full: High Bandwidth Memory 3
  desc: H100 用的第三代高带宽显存
- term: SXM
  full: Server PCI Express Module
  desc: NVIDIA 的板载模组形态，功耗与带宽高于 PCIe 卡
- term: MXFP4
  full: microscaling FP4
  desc: 按小块共享缩放因子的 4 位浮点格式
- term: FLOP
  full: floating point operation
  desc: 一次浮点运算；文中算力账按 FLOP 记
- term: TFLOP
  full: tera floating point operations
  desc: 10^12 次浮点运算
- term: PFLOP
  full: peta floating point operations
  desc: 10^15 次浮点运算
- term: T5
  full: Text-to-Text Transfer Transformer
  desc: Google 的 encoder-decoder 模型，把任务都写成文本到文本
- term: SRAM
  full: static random-access memory
  desc: GPU 片上的小而快的存储
- term: MHA
  full: multi-head attention
  desc: 多头注意力：每个头独立算一份注意力再拼接
- term: MQA
  full: multi-query attention
  desc: 所有 q 头共享一组 k、v 头的注意力变体
- term: NTK
  full: Neural Tangent Kernel
  desc: 神经正切核；NTK-aware 是 RoPE 外推的插值方式
- term: PI
  full: position interpolation
  desc: 位置插值：把长窗口压回 RoPE 训练范围
- term: E4M3
  full: "—"
  desc: FP8 的一种格式：4 位指数 3 位尾数，精度优先
- term: E5M2
  full: "—"
  desc: FP8 的一种格式：5 位指数 2 位尾数，范围优先
- term: SSM
  full: state-space model
  desc: 状态空间模型，Mamba 一类的序列模型
- term: HFU
  full: hardware FLOPs utilization
  desc: 硬件算力利用率，不含重算的 MFU 变体
- term: TPS
  full: tokens per second
  desc: 每秒处理的 token 数，吞吐指标
- term: DPO
  full: Direct Preference Optimization
  desc: 直接偏好优化，不训奖励模型、直接用偏好对训策略
- term: Adam
  full: adaptive moment estimation
  desc: 按梯度一阶、二阶矩自适应步长的优化器
- term: lr
  full: learning rate
  desc: 学习率，每步梯度更新走的步长
- term: HBM
  full: high bandwidth memory
  desc: GPU 上的高带宽显存
