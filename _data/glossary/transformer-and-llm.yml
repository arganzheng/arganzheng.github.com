---
- term: CUDA
  full: Compute Unified Device Architecture
  desc: NVIDIA 的 GPU 编程平台
- term: DDP
  full: Distributed Data Parallel
  desc: PyTorch 的多卡数据并行训练方式
- term: checkpoint
  full: "—"
  desc: 训练中保存下来的模型与优化器状态
- term: mask
  full: "—"
  desc: 禁止某些位置被看到（如未来 token）的遮罩
- term: Q / K / V
  full: query / key / value
  desc: attention 里的查询、键、值三组向量
- term: nanoGPT
  full: "—"
  desc: Karpathy 写的极简 GPT 训练代码库
- term: KV cache
  full: key–value cache
  desc: 推理时缓存前面 token 的 K、V，后续步不用重算
- term: lm_head
  full: language modeling head
  desc: 最后把向量投影成词表上每个词的分数
- term: LayerNorm
  full: layer normalization
  desc: 把每个 token 的向量归一化到同一尺度，让深层能训
- term: decoder-only
  full: "—"
  desc: Transformer 的三条路线：只用 encoder、只用 decoder、两者都用
- term: decode
  full: "—"
  desc: 推理时每步只生成一个新 token 的阶段
- term: prefill
  full: "—"
  desc: 推理时一次处理完整段提示词的阶段
- term: embedding
  full: "—"
  desc: 把 token 编号查表变成向量
- term: HuggingFace
  full: "—"
  desc: 托管模型权重、提供 transformers 库的平台
- term: FFN
  full: feed-forward network
  desc: 每层里逐 token 做「放大 → 非线性 → 压回」的前馈子层
- term: attention
  full: "—"
  desc: 每个 token 按相关程度汇总其他 token 信息的运算
- term: encoder
  full: "—"
  desc: encoder 读完整段输入产出表示；decoder 逐个生成输出 token
- term: decoder
  full: "—"
  desc: encoder 读完整段输入产出表示；decoder 逐个生成输出 token
- term: GPT-2
  full: Generative Pre-trained Transformer
  desc: OpenAI 的 decoder-only 模型系列，GPT-2 small 是本文蓝本
- term: block
  full: "—"
  desc: 一层 Transformer：attention 与 FFN 两个子层加残差
- term: causal mask
  full: "—"
  desc: 把「看未来 token」的分数设成 −∞ 的遮罩
- term: RoPE
  full: rotary position embedding
  desc: 按位置旋转 q、k 的位置编码，Llama 采用
- term: GELU
  full: Gaussian error linear unit
  desc: ReLU 的平滑版激活函数，GPT-2 的 FFN 用它
- term: MLP
  full: multi-layer perceptron
  desc: 多层感知机；在 Transformer 里就是 FFN 子层
- term: Llama
  full: Large Language Model Meta AI
  desc: Meta 的开源模型系列，本文多处拿它对照
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，算力开销单位
- term: GQA
  full: grouped-query attention
  desc: 多个 query 头共享一组 K、V，缩小 KV cache
- term: SiLU
  full: Sigmoid Linear Unit
  desc: x·sigmoid(x) 形式的激活函数，Llama 的 FFN 用它
- term: d2l
  full: Dive into Deep Learning
  desc: "《动手学深度学习》，本文拿它的 10.7 节做术语对照"
- term: head
  full: "—"
  desc: 多头 attention 里各自一套投影的一个「头」
- term: BERT
  full: Bidirectional Encoder Representations from Transformers
  desc: Google 2018 年的 encoder-only 模型
- term: T5
  full: Text-to-Text Transfer Transformer
  desc: Google 的 encoder-decoder 模型，把任务都写成文本到文本
- term: BART
  full: Bidirectional and Auto-Regressive Transformers
  desc: Facebook 的 encoder-decoder 去噪预训练模型
- term: span corruption
  full: "—"
  desc: T5 的预训练目标：遮掉连续片段让模型补出来
- term: SVD
  full: singular value decomposition
  desc: 奇异值分解
- term: kernel
  full: "—"
  desc: 在 GPU 上执行的一个计算函数
- term: FlashAttention
  full: "—"
  desc: 分块计算 attention、不写出整张 T×T 权重表的 kernel
- term: bf16
  full: bfloat16
  desc: 16 位浮点格式，指数位与 FP32 相同
- term: HBM
  full: high bandwidth memory
  desc: GPU 的显存，容量大但比片上存储慢
- term: SRAM
  full: static random-access memory
  desc: GPU 片上的小而快的存储
- term: ReLU
  full: rectified linear unit
  desc: 负半轴截成 0 的激活函数
- term: SwiGLU
  full: Swish-Gated Linear Unit
  desc: 带门控的 FFN 激活，Llama 用三个矩阵实现
- term: MoE
  full: mixture of experts
  desc: 把 FFN 复制成多个专家、每个 token 只走其中几个
- term: RNN
  full: recurrent neural network
  desc: 按时间步递推的循环神经网络
- term: CNN
  full: convolutional neural network
  desc: 卷积神经网络
- term: BatchNorm
  full: batch normalization
  desc: 跨 batch 统计均值方差的归一化，CNN 常用
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  desc: 只除均方根、不减均值的 LayerNorm 简化版
- term: warmup
  full: "—"
  desc: 训练初期把学习率从很小逐步升上去
- term: logits
  full: "—"
  desc: softmax 之前每个词的原始分数
- term: BLEU
  full: bilingual evaluation understudy
  desc: 机器翻译常用的自动评分指标
- term: NeurIPS
  full: Conference on Neural Information Processing Systems
  desc: 机器学习顶级会议
