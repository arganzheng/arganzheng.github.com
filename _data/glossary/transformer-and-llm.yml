---
- term: DDP
  full: Distributed Data Parallel
  desc: PyTorch 的多卡数据并行训练方式
- term: FFN
  full: feed-forward network
  desc: 每层里逐 token 做「放大 → 非线性 → 压回」的前馈子层
- term: RoPE
  full: rotary position embedding
  desc: 按位置旋转 q、k 的位置编码，Llama 采用
- term: GELU
  full: Gaussian error linear unit
  desc: ReLU 的平滑版激活函数，GPT-2 的 FFN 用它
- term: MLP
  full: multi-layer perceptron
  desc: 多层感知机；在 Transformer 里就是 FFN 子层
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，算力开销单位
- term: GQA
  full: grouped-query attention
  desc: 多个 query 头共享一组 K、V，缩小 KV cache
- term: SiLU
  full: Sigmoid Linear Unit
  desc: x·sigmoid(x) 形式的激活函数，Llama 的 FFN 用它
- term: d2l
  full: Dive into Deep Learning
  desc: "《动手学深度学习》，本文拿它的 10.7 节做术语对照"
- term: BERT
  full: Bidirectional Encoder Representations from Transformers
  desc: Google 2018 年的 encoder-only 模型
- term: T5
  full: Text-to-Text Transfer Transformer
  desc: Google 的 encoder-decoder 模型，把任务都写成文本到文本
- term: BART
  full: Bidirectional and Auto-Regressive Transformers
  desc: Facebook 的 encoder-decoder 去噪预训练模型
- term: SVD
  full: singular value decomposition
  desc: 奇异值分解
- term: bf16
  full: bfloat16
  desc: 16 位浮点格式，指数位与 FP32 相同
- term: HBM
  full: high bandwidth memory
  desc: GPU 的显存，容量大但比片上存储慢
- term: SRAM
  full: static random-access memory
  desc: GPU 片上的小而快的存储
- term: ReLU
  full: rectified linear unit
  desc: 负半轴截成 0 的激活函数
- term: SwiGLU
  full: Swish-Gated Linear Unit
  desc: 带门控的 FFN 激活，Llama 用三个矩阵实现
- term: MoE
  full: mixture of experts
  desc: 把 FFN 复制成多个专家、每个 token 只走其中几个
- term: RNN
  full: recurrent neural network
  desc: 按时间步递推的循环神经网络
- term: CNN
  full: convolutional neural network
  desc: 卷积神经网络
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  desc: 只除均方根、不减均值的 LayerNorm 简化版
- term: BLEU
  full: bilingual evaluation understudy
  desc: 机器翻译常用的自动评分指标
- term: NeurIPS
  full: Conference on Neural Information Processing Systems
  desc: 机器学习顶级会议
