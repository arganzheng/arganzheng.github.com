- term: FastAPI
  full: "—"
  desc: 以 Pydantic 为核心、按类型注解解析请求的 Web 框架
- term: Cohere
  full: "—"
  desc: 常用的 rerank 模型
- term: TFLOPS
  full: tera floating point operations per second
  desc: 每秒 10^12 次浮点运算，卡的峰值算力单位
- term: SXM
  full: Server PCI Express Module
  desc: NVIDIA 的板载模组形态，功耗与带宽高于 PCIe 卡
- term: QKV
  full: query, key, value
  desc: 注意力的三个投影，常合并成一个矩阵
- term: FLOP
  full: floating point operation
  desc: 一次浮点运算；文中算力账按 FLOP 记
- term: Mooncake
  full: "—"
  desc: Kimi 开源的传输引擎，基于 RDMA 搬 KV 与权重
- term: Ray
  full: "—"
  desc: 分布式计算框架，verl 用它创建和调度各个 worker
- term: HBM
  full: high bandwidth memory
  desc: GPU 上的高带宽显存
- term: TFLOP
  full: tera floating point operations
  desc: 10^12 次浮点运算
- term: TransferQueue
  full: "—"
  desc: verl 的样本传输队列，数据不经单控制器
- term: abort
  full: "—"
  desc: 中止进行中的生成请求
- term: D2H
  full: device to host
  desc: 显存拷回主机内存
- term: EngineCore
  full: "—"
  desc: vLLM v1 里跑调度与前向的核心进程
- term: ZMQ
  full: ZeroMQ
  desc: 轻量消息库，常用来在进程间传控制消息
- term: HCCL
  full: Huawei Collective Communication Library
  desc: 华为昇腾的集合通信库
- term: LRU
  full: least recently used
  desc: 最近最少使用：先淘汰最久没用的
- term: LMCache
  full: "—"
  desc: 把 KV cache 存到 CPU / 磁盘再复用的缓存层
- term: Q / K / V
  full: query / key / value
  desc: attention 里的查询、键、值三组向量
- term: decoder-only
  full: "—"
  desc: Transformer 的三条路线：只用 encoder、只用 decoder、两者都用
- term: decoder
  full: "—"
  desc: encoder 读完整段输入产出表示；decoder 逐个生成输出 token
- term: GPT-2
  full: Generative Pre-trained Transformer
  desc: OpenAI 的 decoder-only 模型系列，GPT-2 small 是本文蓝本
- term: block
  full: "—"
  desc: 一层 Transformer：attention 与 FFN 两个子层加残差
- term: Llama
  full: Large Language Model Meta AI
  desc: Meta 的开源模型系列，本文多处拿它对照
- term: SRAM
  full: static random-access memory
  desc: GPU 片上的小而快的存储
- term: NeurIPS
  full: Conference on Neural Information Processing Systems
  desc: 机器学习顶级会议
- term: TPOT
  full: time per output token
  desc: 每个输出 token 的耗时，decode 延迟指标
- term: ITL
  full: inter-token latency
  desc: token 间延迟，同 TPOT
- term: P99
  full: 99th percentile
  desc: 99 分位延迟
- term: OOT
  full: out-of-tree
  desc: 不编进主仓、作为插件加载的后端
- term: MHA
  full: multi-head attention
  desc: 多头注意力：每个头独立算一份注意力再拼接
- term: MQA
  full: multi-query attention
  desc: 所有 q 头共享一组 k、v 头的注意力变体
- term: PIECEWISE
  full: "—"
  desc: vLLM 把 CUDA graph 切成几段录制的模式
