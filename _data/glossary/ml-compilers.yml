---
- term: CRTP
  full: curiously recurring template pattern
  desc: C++ 派生类把自己当模板参数传给基类的写法
- term: CUTLASS
  full: CUDA Templates for Linear Algebra Subroutines
  desc: NVIDIA 的 C++ GEMM 模板库
- term: TIR
  full: TensorIR
  desc: TVM 的低层张量程序 IR
- term: TE
  full: Tensor Expression
  desc: TVM 的张量表达式与调度接口
- term: MFMA
  full: matrix fused multiply-add
  desc: AMD CDNA 的矩阵指令
- term: CTA
  full: cooperative thread array
  desc: CUDA 里的线程块
- term: GEMM
  full: general matrix multiply
  desc: 通用矩阵乘
- term: TF32
  full: TensorFloat-32
  desc: Ampere 起 Tensor Core 用的 19 位浮点格式
- term: TMEM
  full: Tensor Memory
  desc: Blackwell 上 Tensor Core 专用的片上存储
- term: FP8
  full: 8-bit floating point
  desc: 8 位浮点格式（E4M3 / E5M2）
- term: BF16
  full: bfloat16
  desc: 8 位指数、7 位尾数的 16 位浮点格式
- term: CSE
  full: common subexpression elimination
  desc: 公共子表达式消除
- term: PDLL
  full: PDL Language
  desc: MLIR 写 pattern 的专用语言
- term: DRR
  full: Declarative Rewrite Rules
  desc: 用 TableGen 写 rewrite pattern 的方式
- term: GCN
  full: Graphics Core Next
  desc: AMD 较早的 GPU 架构与 ISA
- term: SASS
  full: "—（NVIDIA 未给出官方全称）"
  desc: NVIDIA GPU 真正执行的机器指令
- term: ISA
  full: instruction set architecture
  desc: 指令集架构
- term: HLO
  full: High Level Operations
  desc: XLA 的高层算子 IR
- term: AOT
  full: ahead-of-time
  desc: 运行前提前编译
- term: CFG
  full: control-flow graph
  desc: 控制流图：基本块与跳转边构成的图
- term: TMA
  full: Tensor Memory Accelerator
  desc: Hopper 起的异步张量搬运单元
- term: AST
  full: abstract syntax tree
  desc: 抽象语法树：源码解析后的树形结构
- term: ODS
  full: Operation Definition Specification
  desc: MLIR 用 TableGen 声明 Op 的机制
- term: JIT
  full: just-in-time compilation
  desc: 运行时即时编译
- term: GF(2)
  full: Galois field of two elements
  desc: 只有 0、1 的有限域，加法是异或
- term: IREE
  full: Intermediate Representation Execution Environment
  desc: 基于 MLIR 的端到端 ML 编译与运行时
- term: XLA
  full: Accelerated Linear Algebra
  desc: Google 的 ML 编译器，TensorFlow / JAX 在用
- term: wgmma
  full: warpgroup MMA
  desc: Hopper 上以 4 个 warp 为单位的异步 MMA
- term: MMA
  full: matrix multiply-accumulate
  desc: 矩阵乘加，Tensor Core 指令的统称
- term: cubin
  full: CUDA binary
  desc: GPU 上直接加载执行的二进制文件
- term: PTX
  full: Parallel Thread Execution
  desc: NVIDIA 的虚拟 GPU 指令集，由 ptxas 再编译
- term: IR
  full: intermediate representation
  desc: 中间表示：编译器各阶段之间传递的程序形式
- term: LLVM
  full: "—（最初是 Low Level Virtual Machine，现已不作缩写）"
  desc: 通用编译器基础设施，CPU / GPU 后端共用
- term: TTGIR
  full: TritonGPU IR
  desc: 带 layout 的 Triton GPU 方言
- term: TTIR
  full: Triton IR
  desc: Triton 最上层的 MLIR 方言，还没有 layout
- term: AOTAutograd
  full: ahead-of-time Autograd
  desc: torch.compile 里提前生成反向图的那一步
- term: MLIR
  full: Multi-Level Intermediate Representation
  desc: LLVM 社区的多层 IR 框架，可以自定义方言
- term: SSA
  full: static single assignment
  desc: 静态单赋值：每个值只被赋值一次
- term: LL
  full: linear layout
  desc: 把所有 layout 统一成 GF(2) 线性映射的表示
- term: FMA
  full: fused multiply-add
  desc: 融合乘加指令，不走 Tensor Core 的路径
- term: bf16
  full: bfloat16
  desc: 16 位 / 半精度 / 单精度浮点
- term: F64
  full: float64
  desc: 双精度浮点
- term: DFS
  full: depth-first search
  desc: 深度优先搜索
- term: WAR
  full: write after read
  desc: 写后读冒险：读还没完就被写覆盖
- term: SM
  full: streaming multiprocessor
  desc: GPU 上执行线程块的计算单元
- term: MoE
  full: mixture of experts
  desc: 混合专家：每个 token 只走少数几个专家
- term: RAW
  full: read after write
  desc: 读后写冒险：写还没落就被读
- term: WAW
  full: write after write
  desc: 写后写冒险：两次写的次序不能错
