---
- term: trace
  full: "—"
  desc: 一次任务每一步输入输出与决策的完整记录
- term: checkpoint
  full: "—"
  desc: 某一步之后的状态快照，崩溃后从这里续跑
- term: rollout
  full: "—"
  desc: 一次采样生成：给一组 prompt 跑完整前向
- term: serving
  full: "—"
  desc: 把模型部署成在线推理服务
- term: logits
  full: "—"
  desc: 模型对每个候选 token 输出的未归一化分数
- term: KV
  full: key–value
  desc: 推理时缓存的注意力键值，即 KV cache
- term: OOM
  full: out of memory
  desc: 内存耗尽
- term: worker
  full: "—"
  desc: 执行子任务的 agent（或执行 workflow 的进程）
- term: webhook
  full: "—"
  desc: 事件发生时由对方回调你给的 URL
- term: HF
  full: Hugging Face
  desc: 模型与数据集托管平台
- term: RL
  full: reinforcement learning
  desc: 强化学习
- term: bf16
  full: bfloat16
  desc: 16 位浮点，指数位与 fp32 一样多、尾数只有 7 位
- term: causal
  full: "—"
  desc: causal attention：每个位置只看自己和前面
- term: CUDA
  full: Compute Unified Device Architecture
  desc: NVIDIA 的 GPU 编程平台，conda 能连它的运行库一起装
- term: FLOPs
  full: floating-point operations
  desc: 浮点运算次数，算力的计量单位
- term: fp32
  full: 32-bit floating point
  desc: 单精度浮点，每个数 4 字节
- term: FlashAttention
  full: "—"
  desc: 分块计算、不显式构造 T×T 矩阵的 attention kernel
- term: FSDP
  full: Fully Sharded Data Parallel
  desc: 把参数、梯度、优化器状态切到各卡的数据并行
- term: GiB
  full: gibibyte
  desc: 二进制 GB，1 GiB = 1024 MiB，显存账本里都用它
- term: H100
  full: "—"
  desc: NVIDIA 的 Hopper 架构训练卡，显存账本按它算
- term: head
  full: "—"
  desc: 多头 attention 里的一个头，各用 d/h 维算一份
- term: hook
  full: "—"
  desc: 挂在 forward 前后、被自动调用的回调函数
- term: kernel
  full: "—"
  desc: 在 GPU 上执行的一个函数，通常对应一个算子
- term: LayerNorm
  full: layer normalization
  desc: 层归一化，每个 token 沿 hidden 维自己归一化
- term: LoRA
  full: Low-Rank Adaptation
  desc: 冻结原权重、只训低秩矩阵的微调方法
- term: mask
  full: "—"
  desc: 掩码，把不该看的位置加上 −∞ 或置零
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  desc: 只按均方根缩放、不减均值的归一化
- term: seed
  full: "—"
  desc: 随机数种子，换 seed 相当于换一次运气
- term: softmax
  full: "—"
  desc: 把一组分数归一化成概率分布的函数
- term: warmup
  full: "—"
  desc: 训练开头让学习率从小慢慢升到目标值
- term: batch
  full: "—"
  desc: 一次梯度更新用到的那一小批样本
- term: benchmark
  full: "—"
  desc: 公开评测集，用来给模型打分排名
- term: logit
  full: "—"
  desc: 过 sigmoid / softmax 之前的原始分数
- term: NaN
  full: not a number
  desc: 浮点里的缺失值标记
- term: FP8
  full: 8-bit floating point
  desc: 8 位浮点数
- term: DP
  full: data parallelism
  desc: 数据并行，每张卡一份完整模型
- term: PP
  full: pipeline parallelism
  desc: 流水线并行，按层切到不同卡上
- term: IPC
  full: inter-process communication
  desc: 进程间通信，这里指跨进程共享显存
- term: GEMM
  full: general matrix multiply
  desc: 通用矩阵乘
- term: NVMe
  full: Non-Volatile Memory Express
  desc: 走 PCIe 的固态盘接口协议
- term: P2P
  full: peer-to-peer
  desc: 设备之间直接互访，不经主机内存
- term: TP
  full: tensor parallelism
  desc: 张量并行，把一层的矩阵切到多张卡上
- term: rank
  full: "—"
  desc: 分布式任务里一个进程（通常一张卡）的编号
- term: IB
  full: InfiniBand
  desc: InfiniBand 的简称
- term: vLLM
  full: "—"
  desc: 开源大模型推理引擎
- term: straggler
  full: "—"
  desc: 拖慢所有人的那张慢卡
- term: PD
  full: prefill–decode
  desc: PD 分离：prefill 与 decode 放到不同节点上跑
- term: prefill
  full: "—"
  desc: 推理的两个阶段：一次处理整段输入 / 逐 token 生成
- term: decode
  full: "—"
  desc: 推理的两个阶段：一次处理整段输入 / 逐 token 生成
- term: NVLink
  full: "—"
  desc: NVIDIA 的 GPU 间高速直连链路
- term: PCIe
  full: Peripheral Component Interconnect Express
  desc: 主板上连接 GPU、网卡和 CPU 的总线
- term: NCCL
  full: NVIDIA Collective Communications Library
  desc: NVIDIA 的集合通信库，多卡通信的事实标准
- term: SGLang
  full: "—"
  desc: 开源推理引擎，与 vLLM 并列
- term: A/B
  full: A/B testing
  desc: 把流量随机分给两个版本，比较指标
- term: CFG
  full: context-free grammar
  desc: 上下文无关文法，能表达递归的嵌套结构
- term: tokenizer
  full: "—"
  desc: 把文本切成 token 的组件，各模型不同
- term: MPS
  full: Metal Performance Shaders
  desc: 苹果 GPU 的计算后端
- term: XPU
  full: "—"
  desc: Intel GPU 在 PyTorch 里的设备名
- term: B200
  full: "—"
  desc: NVIDIA Blackwell 架构的数据中心 GPU
- term: AWQ
  full: Activation-aware Weight Quantization
  desc: 按激活大小保护关键权重的低比特量化方法
- term: RTX
  full: "—"
  desc: NVIDIA 消费级显卡系列
- term: AR
  full: all-reduce
  desc: 各卡数据求和后再分发回每张卡的集合通信
- term: NPU
  full: neural processing unit
  desc: 神经网络专用处理器，这里指昇腾
- term: Blackwell
  full: "—"
  desc: NVIDIA 新一代 GPU 架构，RTX 5090 和 B200 都属于它
- term: cuBLAS
  full: "—"
  desc: NVIDIA 的 GPU 矩阵运算库
- term: H200
  full: "—"
  desc: NVIDIA Hopper 架构的数据中心 GPU
- term: Tensor Core
  full: "—"
  desc: NVIDIA GPU 上专做矩阵乘的计算单元
- term: CP
  full: context parallelism
  desc: 上下文并行：沿序列维切分长序列
- term: HSDP
  full: Hybrid Sharded Data Parallel
  desc: 机内分片、机间复制的 FSDP 变体
- term: SPMD
  full: single program, multiple data
  desc: 每个进程跑同一份程序、处理不同数据
- term: BF16
  full: bfloat16
  desc: 8 位指数的 16 位浮点，范围同 FP32
- term: FP16
  full: 16-bit floating point
  desc: 半精度浮点，5 位指数、10 位尾数
- term: Triton
  full: "—"
  desc: OpenAI 的 GPU kernel 编程语言和编译器
- term: stream
  full: "—"
  desc: GPU 上按提交顺序执行任务的队列
- term: H2D
  full: host to device
  desc: 主机内存拷到显存
- term: attention
  full: "—"
  desc: 注意力：按相关性加权混合其他位置的向量
- term: CLIP
  full: Contrastive Language–Image Pre-training
  desc: OpenAI 的图文对比模型，把图和文嵌进同一空间
- term: embedding
  full: "—"
  desc: 把离散对象（token、词）查表变成向量的表示
- term: encoder
  full: "—"
  desc: 编码输入得到表示的那半边（BERT 全是 encoder）
- term: FFN
  full: feed-forward network
  desc: 前馈网络：Transformer block 里 attention 之后的子层
- term: GELU
  full: Gaussian error linear unit
  desc: 平滑的 ReLU 变体，GPT 时代的默认激活
- term: KV cache
  full: key–value cache
  desc: 推理时缓存每层算过的 k、v，新 token 只算自己的
- term: MLP
  full: multi-layer perceptron
  desc: 多层感知机：线性层 + 非线性激活叠起来的网络
- term: residual
  full: "—"
  desc: 残差连接：输出 = 子层结果 + 输入，让深层可训
- term: RoPE
  full: rotary position embedding
  desc: 旋转位置编码：按位置把向量转一个角度
- term: SiLU
  full: Sigmoid Linear Unit
  desc: x·sigmoid(x)，又叫 Swish；SwiGLU 的门控用它
- term: VAE
  full: variational autoencoder
  desc: 变分自编码器：带概率隐空间的生成模型
- term: GQA
  full: grouped-query attention
  desc: 多个 q 头共用一组 k、v 头，KV cache 更小
- term: GPTQ
  full: "—"
  desc: 逐层用二阶信息补偿误差的训练后权重量化方法
- term: INT4
  full: 4-bit integer
  desc: 均匀 16 格的 4 bit 整数量化
- term: INT8
  full: 8-bit integer
  desc: 8 bit 整数量化，精度损失最小的低比特档
- term: KIVI
  full: "—"
  desc: KV cache 量化方法：key 按通道、value 按 token 量化
- term: SmoothQuant
  full: "—"
  desc: 把激活的异常值折进权重的量化方法，让两边都好量化
- term: W4A16
  full: "—"
  desc: 权重 4 bit、激活 16 bit 的量化档，PTQ 的常用配置
- term: W4A4
  full: "—"
  desc: 权重、激活都 4 bit 的量化档，收益最大、最难保精度
- term: W8A8
  full: "—"
  desc: 权重、激活都 8 bit 的量化档
- term: SDPA
  full: scaled dot-product attention
  desc: PyTorch 的融合 attention 函数，自选 kernel
- term: PagedAttention
  full: "—"
  desc: vLLM 按固定大小块管理 KV cache 的 attention
- term: top-k
  full: "—"
  desc: 只保留分数最高的 k 个 token
- term: chunked prefill
  full: "—"
  desc: 把长 prompt 切块依次前向，降低显存峰值
- term: CUDA graph
  full: "—"
  desc: 把一串 kernel 录成图一次提交，省 CPU 发射开销
- term: adapter
  full: "—"
  desc: 挂在冻结基座上的一小组可训参数，这里就是 LoRA 的 A、B
- term: NF4
  full: 4-bit NormalFloat
  desc: 按正态分布分位数取 16 个格点的 4 bit 格式
- term: Punica
  full: "—"
  desc: 多 LoRA 服务系统（Chen 等 2023），vLLM 借用了它的 kernel
- term: S-LoRA
  full: Scalable LoRA
  desc: 同时服务上千个 adapter 的系统（Sheng 等 2023）
- term: QK
  full: "—"
  desc: query 与 key，attention 里算相似度的两个投影
- term: TMA
  full: Tensor Memory Accelerator
  desc: Hopper 起的异步张量搬运单元
- term: epilogue
  full: "—"
  desc: kernel 主循环之后写回结果的那一段
- term: wgmma
  full: warpgroup MMA
  desc: Hopper 上以 4 个 warp 为单位的异步 MMA
- term: layout
  full: "—"
  desc: 张量元素怎样分到寄存器、线程、warp 上
- term: Inductor
  full: "—"
  desc: torch.compile 的后端，生成 Triton 代码
- term: warp
  full: "—"
  desc: GPU 上齐步执行的一组线程（NVIDIA 32 个）
- term: AMD
  full: "—"
  desc: GPU 厂商，其线程编排与 NVIDIA 不同
- term: Ampere
  full: "—"
  desc: NVIDIA GPU 连续三代架构
- term: Hopper
  full: "—"
  desc: NVIDIA GPU 连续三代架构
- term: A100
  full: NVIDIA Ampere GPU
  desc: 2020 年的数据中心卡，shared memory 上限 163 KB
- term: DDIM
  full: denoising diffusion implicit model
  desc: 把采样改成非马尔可夫的扩散采样器，可以跳步
- term: DDPM
  full: denoising diffusion probabilistic model
  desc: 去噪扩散概率模型：逐步加噪再学逐步去噪的生成框架
- term: DiT
  full: diffusion transformer
  desc: 用 Transformer 替代 U-Net 的扩散骨干
- term: FID
  full: Fréchet inception distance
  desc: 用 Inception 特征比较生成分布与真实分布的指标
- term: ODE
  full: ordinary differential equation
  desc: 常微分方程；flow matching / 确定性采样把它当生成路径
- term: patch
  full: "—"
  desc: 图像被切成的小方块，一个 patch 变成一个向量
- term: SigLIP
  full: Sigmoid Loss for Language-Image Pre-training
  desc: CLIP 的 sigmoid 损失版，对 batch 大小不敏感
- term: TTS
  full: text-to-speech
  desc: 语音合成；全双工模型把它和听（ASR）放进同一个网络
- term: MFU
  full: model FLOPs utilization
  desc: 模型算力利用率：实际吞吐 ÷ 理论峰值，预训练看它的健康度
- term: BCG
  full: Boston Consulting Group
  desc: 波士顿咨询，和哈佛合做了 758 名顾问的实验
- term: SLO
  full: service level objective
  desc: 服务等级目标，如可用率、延迟的承诺值
- term: QPS
  full: queries per second
  desc: 每秒查询数
- term: TFLOPS
  full: tera floating point operations per second
  desc: 每秒 10^12 次浮点运算，卡的峰值算力单位
- term: QKV
  full: query, key, value
  desc: 注意力的三个投影，常合并成一个矩阵
- term: offload
  full: "—"
  desc: 把参数或优化器状态挪到 CPU 内存
- term: FLOP
  full: floating point operation
  desc: 一次浮点运算；文中算力账按 FLOP 记
- term: Ray
  full: "—"
  desc: 分布式计算框架，verl 用它创建和调度各个 worker
- term: Megatron
  full: "—"
  desc: NVIDIA 的大模型训练框架，TP / PP / EP 齐全
- term: ZMQ
  full: ZeroMQ
  desc: 轻量消息库，常用来在进程间传控制消息
- term: Q / K / V
  full: query / key / value
  desc: attention 里的查询、键、值三组向量
- term: decoder
  full: "—"
  desc: encoder 读完整段输入产出表示；decoder 逐个生成输出 token
- term: block
  full: "—"
  desc: 一层 Transformer：attention 与 FFN 两个子层加残差
- term: T5
  full: Text-to-Text Transfer Transformer
  desc: Google 的 encoder-decoder 模型，把任务都写成文本到文本
- term: FLUX
  full: "—"
  desc: Black Forest Labs 的开源文生图模型
- term: SP
  full: sequence parallelism
  desc: 序列并行：沿序列维切分激活
- term: PSNR
  full: peak signal-to-noise ratio
  desc: 峰值信噪比，重建质量指标
- term: USP
  full: unified sequence parallelism
  desc: DiT 推理用的统一序列并行方案
- term: SD3
  full: Stable Diffusion 3
  desc: Stability AI 的第三代扩散模型
- term: SSIM
  full: structural similarity
  desc: 结构相似度，图像质量指标
- term: LPIPS
  full: learned perceptual image patch similarity
  desc: 学习到的感知相似度指标
- term: DMD
  full: distribution matching distillation
  desc: 分布匹配蒸馏：把多步扩散蒸成少步
- term: SD
  full: Stable Diffusion
  desc: Stability AI 的扩散模型系列
- term: NVFP4
  full: "—"
  desc: 4 位浮点量化格式，Blackwell 支持
- term: L40
  full: "—"
  desc: NVIDIA 的数据中心推理卡
- term: VSA
  full: "—"
  desc: 视频扩散模型里的稀疏注意力机制
- term: STA
  full: "—"
  desc: 视频扩散里的稀疏时空注意力
