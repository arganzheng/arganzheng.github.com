- term: "Adam"
  full: "adaptive moment estimation"
  desc: "按梯度一阶、二阶矩自适应步长的优化器"
- term: "AdamW"
  full: "Adam with decoupled weight decay"
  desc: "把 weight decay 从梯度里拆出来的 Adam"
- term: "attention"
  full: "—"
  desc: "注意力：按相关性加权混合其他位置的向量"
- term: "batch"
  full: "—"
  desc: "一次梯度更新用到的那一小批样本"
- term: "BatchNorm"
  full: "batch normalization"
  desc: "批归一化：沿 batch 维做标准化的归一化层"
- term: "BERT"
  full: "Bidirectional Encoder Representations from Transformers"
  desc: "双向编码器模型，对照 decoder-only 的 GPT"
- term: "BPTT"
  full: "backpropagation through time"
  desc: "沿时间步展开的反向传播，RNN/LSTM 的梯度走它"
- term: "CE"
  full: "cross-entropy"
  desc: "交叉熵，分类问题最常用的损失"
- term: "CLIP"
  full: "Contrastive Language–Image Pre-training"
  desc: "OpenAI 的图文对比模型，把图和文嵌进同一空间"
- term: "CNN"
  full: "convolutional neural network"
  desc: "卷积神经网络：局部感受野 + 权值共享"
- term: "DPO"
  full: "Direct Preference Optimization"
  desc: "直接偏好优化，不训奖励模型、直接用偏好对训策略"
- term: "dropout"
  full: "—"
  desc: "训练时随机把一部分神经元置零的正则化"
- term: "ELU"
  full: "exponential linear unit"
  desc: "负半轴平滑趋近负值的激活函数"
- term: "embedding"
  full: "—"
  desc: "把离散对象（token、词）查表变成向量的表示"
- term: "encoder"
  full: "—"
  desc: "编码输入得到表示的那半边（BERT 全是 encoder）"
- term: "epoch"
  full: "—"
  desc: "把训练集完整过一遍叫一个 epoch"
- term: "FFN"
  full: "feed-forward network"
  desc: "前馈网络：Transformer block 里 attention 之后的子层"
- term: "FLOPs"
  full: "floating-point operations"
  desc: "浮点运算次数，算量的计量单位"
- term: "GELU"
  full: "Gaussian error linear unit"
  desc: "平滑的 ReLU 变体，GPT 时代的默认激活"
- term: "GLU"
  full: "gated linear unit"
  desc: "门控线性单元：两路相乘做门控，SwiGLU 的原型"
- term: "ImageNet"
  full: "—"
  desc: "大规模图像分类数据集，LeNet 到 ResNet 的 benchmark"
- term: "Jacobian"
  full: "—"
  desc: "雅可比矩阵：向量函数对每个输入的全导数"
- term: "Kaiming"
  full: "—"
  desc: "Kaiming（He）初始化：按输入维度缩放的随机初始化"
- term: "KL"
  full: "Kullback–Leibler divergence"
  desc: "KL 散度，衡量两个分布差多少"
- term: "KV cache"
  full: "key–value cache"
  desc: "推理时缓存每层算过的 k、v，新 token 只算自己的"
- term: "LayerNorm"
  full: "layer normalization"
  desc: "层归一化：每个样本沿 hidden 维自己归一化"
- term: "LeakyReLU"
  full: "—"
  desc: "负半轴留一个小斜率的 ReLU 变体"
- term: "LeNet"
  full: "—"
  desc: "最早的卷积网络（LeCun 1998），认手写数字"
- term: "logits"
  full: "—"
  desc: "softmax 之前的原始分数，每个类别一个"
- term: "LoRA"
  full: "Low-Rank Adaptation"
  desc: "低秩适配：冻结主干、只训低秩增量的微调"
- term: "lr"
  full: "learning rate"
  desc: "学习率，每步梯度更新走的步长"
- term: "LSTM"
  full: "long short-term memory"
  desc: "带门控记忆的 RNN，Transformer 之前的序列主力"
- term: "MNIST"
  full: "—"
  desc: "手写数字数据集，深度学习的入门 benchmark"
- term: "MLP"
  full: "multi-layer perceptron"
  desc: "多层感知机：线性层 + 非线性激活叠起来的网络"
- term: "Momentum"
  full: "—"
  desc: "动量：让更新带上惯性，冲过浅坑"
- term: "MSE"
  full: "mean squared error"
  desc: "均方误差，预测与目标差的平方均值"
- term: "NaN"
  full: "not a number"
  desc: "浮点溢出或无效运算后的值"
- term: "ReLU"
  full: "rectified linear unit"
  desc: "max(0, x)，现代激活函数的起点"
- term: "residual"
  full: "—"
  desc: "残差连接：输出 = 子层结果 + 输入，让深层可训"
- term: "ResNet"
  full: "residual network"
  desc: "残差网络：靠 skip connection 把深度推到上百层"
- term: "RMSNorm"
  full: "Root Mean Square Layer Normalization"
  desc: "只按均方根缩放、不减均值的归一化"
- term: "RNN"
  full: "recurrent neural network"
  desc: "循环神经网络：按时间步逐个处理序列"
- term: "RoPE"
  full: "rotary position embedding"
  desc: "旋转位置编码：按位置把向量转一个角度"
- term: "seq2seq"
  full: "sequence-to-sequence"
  desc: "encoder–decoder 结构的序列到序列模型"
- term: "SFT"
  full: "supervised fine-tuning"
  desc: "监督微调：用指令和回答对训练模型"
- term: "SGD"
  full: "stochastic gradient descent"
  desc: "随机梯度下降：每步只用一小批样本"
- term: "sigmoid"
  full: "—"
  desc: "把任意实数压到 0 到 1 的 S 形函数"
- term: "SiLU"
  full: "Sigmoid Linear Unit"
  desc: "x·sigmoid(x)，又叫 Swish；SwiGLU 的门控用它"
- term: "softmax"
  full: "—"
  desc: "把一组分数归一化成概率分布的函数"
- term: "SwiGLU"
  full: "Swish-Gated Linear Unit"
  desc: "用 SiLU 做门控的 FFN：两路相乘再降维"
- term: "tanh"
  full: "—"
  desc: "双曲正切：压到 −1 到 1 的 S 形函数"
- term: "VAE"
  full: "variational autoencoder"
  desc: "变分自编码器：带概率隐空间的生成模型"
- term: "ViT"
  full: "Vision Transformer"
  desc: "把图像切块当序列送进 Transformer"
- term: "VJP"
  full: "vector–Jacobian product"
  desc: "向量左乘雅可比，反向传播实际算的东西"
- term: "warmup"
  full: "—"
  desc: "学习率先从小升到目标值的预热段"
- term: "weight decay"
  full: "—"
  desc: "每步把权重往 0 拉一点，等价于 L2 正则"
- term: "Word2Vec"
  full: "—"
  desc: "用「词出现在什么样的上下文」学词向量的经典方法"
- term: "Xavier"
  full: "—"
  desc: "Xavier（Glorot）初始化：按输入输出维度平衡的随机初始化"
- term: "XOR"
  full: "exclusive or"
  desc: "异或；单层感知机分不开的经典反例"
