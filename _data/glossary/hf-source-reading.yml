- term: "peft"
  full: "Parameter-Efficient Fine-Tuning"
  desc: "HF 的参数高效微调库，LoRA 就在这里"
- term: "trl"
  full: "Transformer Reinforcement Learning"
  desc: "HF 的后训练库：SFT、DPO、GRPO 的 Trainer"
- term: "LoRA"
  full: "Low-Rank Adaptation"
  desc: "给权重加一个低秩增量 BA，只训 A、B 两个小矩阵"
- term: "SFT"
  full: "supervised fine-tuning"
  desc: "有监督微调：拿标注好的回答训模型"
- term: "DPO"
  full: "Direct Preference Optimization"
  desc: "直接用好 / 差回答对训模型，不单独训奖励模型"
- term: "GRPO"
  full: "Group Relative Policy Optimization"
  desc: "同一 prompt 采一组回答，组内归一化奖励当优势"
- term: "SVD"
  full: "singular value decomposition"
  desc: "奇异值分解"
- term: "RoPE"
  full: "rotary position embedding"
  desc: "旋转位置编码：按位置把 q、k 的每对维度旋转一个角度"
- term: "KV cache"
  full: "key–value cache"
  desc: "推理时缓存每层算过的 k、v，新 token 只算自己的"
- term: "logits"
  full: "—"
  desc: "softmax 之前、每个词表位置一个的未归一化分数"
- term: "safetensors"
  full: "—"
  desc: "HF 的权重格式：JSON 头 + 原始字节，可 mmap"
- term: "RMSNorm"
  full: "Root Mean Square Layer Normalization"
  desc: "只除以均方根、不减均值的归一化"
- term: "MLP"
  full: "multi-layer perceptron"
  desc: "多层感知机，这里指每层 attention 之后的前馈子层"
- term: "prefill"
  full: "—"
  desc: "生成前把整段 prompt 一次前向、填满 KV cache"
- term: "BPE"
  full: "byte-pair encoding"
  desc: "字节对编码：反复合并最常见的相邻 pair 得到词表"
- term: "PPO"
  full: "Proximal Policy Optimization"
  desc: "把新旧策略的概率比裁剪在 1±ε 内的策略梯度算法"
- term: "KL"
  full: "Kullback–Leibler divergence"
  desc: "KL 散度，衡量两个分布差多远"
- term: "GQA"
  full: "grouped-query attention"
  desc: "多个 q 头共用一组 k、v 头，KV cache 更小"
- term: "FFN"
  full: "feed-forward network"
  desc: "前馈网络，block 里 attention 之后那个子层"
- term: "SiLU"
  full: "Sigmoid Linear Unit"
  desc: "激活函数 x·sigmoid(x)，又叫 Swish"
- term: "SwiGLU"
  full: "Swish-Gated Linear Unit"
  desc: "用 SiLU 做门控的 FFN：两路相乘再降维"
- term: "AdamW"
  full: "Adam with decoupled weight decay"
  desc: "带解耦权重衰减的 Adam 优化器，每个参数存两份矩"
- term: "DAPO"
  full: "Decoupled Clip and Dynamic sAmpling Policy Optimization"
  desc: "GRPO 的改进：clip-higher、过滤全对 / 全错组等"
- term: "RL"
  full: "reinforcement learning"
  desc: "强化学习"
- term: "REINFORCE"
  full: "—"
  desc: "最基本的策略梯度：loss = −A·log π"
