---
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 给权重加一个低秩增量 BA，只训 A、B 两个小矩阵
- term: SFT
  full: supervised fine-tuning
  zh: 监督微调
  say: 逐字母 S-F-T
  desc: 有监督微调：拿标注好的回答训模型
- term: DPO
  full: Direct Preference Optimization
  zh: 直接偏好优化
  say: 逐字母 D-P-O
  desc: 直接用好 / 差回答对训模型，不单独训奖励模型
- term: GRPO
  full: Group Relative Policy Optimization
  zh: 同一 prompt 采一组回答
  say: G-R-P-O
  desc: 同一 prompt 采一组回答，组内归一化奖励当优势
- term: SVD
  full: singular value decomposition
  zh: 奇异值分解
  say: S-V-D
  desc: 奇异值分解
- term: RoPE
  full: rotary position embedding
  zh: 旋转位置编码
  say: "/roʊp/「柔普」"
  desc: 旋转位置编码：按位置把 q、k 的每对维度旋转一个角度
- term: mmap
  full: memory map
  zh: 把文件映射进内存
  say: "「mmap」"
  desc: 把文件映射进内存，读到哪页才从磁盘加载哪页
- term: RMSNorm
  full: Root Mean Square Layer Normalization
  zh: 均方根归一化
  say: "「RMS-Norm」"
  desc: 只除以均方根、不减均值的归一化
- term: MLP
  full: multi-layer perceptron
  zh: 多层感知机
  say: 逐字母 M-L-P
  desc: 多层感知机，这里指每层 attention 之后的前馈子层
- term: SDPA
  full: scaled dot-product attention
  zh: PyTorch 的融合 attention 函数
  say: S-D-P-A
  desc: PyTorch 的融合 attention 函数，自选 kernel
- term: BPE
  full: byte-pair encoding
  zh: 反复合并最常见的相邻 pair 得到词表
  say: B-P-E
  desc: 字节对编码：反复合并最常见的相邻 pair 得到词表
- term: PPO
  full: Proximal Policy Optimization
  zh: 把新旧策略的概率比裁剪在 1±ε 内的策略梯度算…
  say: P-P-O
  desc: 把新旧策略的概率比裁剪在 1±ε 内的策略梯度算法
- term: KL
  full: Kullback–Leibler divergence
  zh: KL 散度
  say: 逐字母 K-L
  desc: KL 散度，衡量两个分布差多远
- term: GQA
  full: grouped-query attention
  zh: 分组查询注意力
  say: 逐字母 G-Q-A
  desc: 多个 q 头共用一组 k、v 头，KV cache 更小
- term: SwiGLU
  full: Swish-Gated Linear Unit
  zh: Swish 门控线性单元
  say: "/ˈswɪɡ.luː/「斯威-glue」"
  desc: 用 SiLU 做门控的 FFN：两路相乘再降维
- term: NFC
  full: Normalization Form C
  zh: 组合字符合成一个码位
  say: N-F-C
  desc: Unicode 规范化形式：组合字符合成一个码位
- term: DAPO
  full: Decoupled Clip and Dynamic sAmpling Policy Optimization
  zh: clip-higher、过滤全对 / 全错组等
  say: D-A-P-O
  desc: GRPO 的改进：clip-higher、过滤全对 / 全错组等
- term: rsLoRA
  full: Rank-Stabilized LoRA
  zh: scaling 用 α/√r 代替 α/r
  say: "「rsLoRA」"
  desc: scaling 用 α/√r 代替 α/r，秩大时更稳
