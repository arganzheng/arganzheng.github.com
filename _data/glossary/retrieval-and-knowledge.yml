---
- term: ANN
  full: approximate nearest neighbor
  zh: 近似最近邻搜索
  say: A-N-N
  desc: 近似最近邻搜索，用一点精度换速度
- term: SFT
  full: supervised fine-tuning
  zh: 监督微调
  say: 逐字母 S-F-T
  desc: 有监督微调：用（输入，期望输出）对训练模型
- term: IVF
  full: inverted file index
  zh: 倒排索引
  say: I-V-F
  desc: 先聚类、只搜最近几个簇的向量索引
- term: RAG
  full: retrieval-augmented generation
  zh: 检索增强生成
  say: "/ræɡ/「rag」"
  desc: 检索增强生成：先检索相关内容放进上下文，再让模型回答
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 只训练低秩增量矩阵的轻量微调方法
- term: VLM
  full: vision-language model
  zh: 视觉语言模型
  say: V-L-M
  desc: 能看图的语言模型，这里用来读文档图像
