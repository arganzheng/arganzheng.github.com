---
- term: ACL
  full: access control list
  desc: 访问控制列表：记录谁能看这份文档
- term: RAGAS
  full: Retrieval Augmented Generation Assessment
  desc: RAG 评测框架，定义了一组常用指标
- term: AIP
  full: Artificial Intelligence Platform
  desc: Palantir 建在本体之上的 AI 平台
- term: HyDE
  full: Hypothetical Document Embeddings
  desc: 先让模型写一段假想答案，再用它去检索
- term: LSP
  full: Language Server Protocol
  desc: 编辑器和语言服务之间的协议，能查定义与引用
- term: ANN
  full: approximate nearest neighbor
  desc: 近似最近邻搜索，用一点精度换速度
- term: RAFT
  full: Retrieval-Augmented Fine-Tuning
  desc: 用带干扰文档的检索结果做微调，让模型更会用检索
- term: SFT
  full: supervised fine-tuning
  desc: 有监督微调：用（输入，期望输出）对训练模型
- term: A/B
  full: A/B testing
  desc: 把流量分成两组、对比两个版本的实验
- term: ColBERT
  full: Contextualized Late Interaction over BERT
  desc: 按 token 存多向量、查询时晚交互的检索模型
- term: MMTEB
  full: Massive Multilingual Text Embedding Benchmark
  desc: MTEB 的多语言扩展版
- term: nDCG
  full: normalized discounted cumulative gain
  desc: 按位置打折、能用分级相关性的排序指标
- term: MRR
  full: mean reciprocal rank
  desc: 第一个相关结果排名倒数的平均值
- term: RRF
  full: reciprocal rank fusion
  desc: 倒数排名融合：只按排名合并多路结果
- term: IVF
  full: inverted file index
  desc: 先聚类、只搜最近几个簇的向量索引
- term: HNSW
  full: Hierarchical Navigable Small World
  desc: 分层的近邻图索引，多数向量库的默认结构
- term: MTEB
  full: Massive Text Embedding Benchmark
  desc: 文本 embedding 模型的综合榜单
- term: OCR
  full: optical character recognition
  desc: 光学字符识别，把图片里的字读出来
- term: BM25
  full: Best Matching 25
  desc: 按词频和文档长度打分的经典关键词检索算法
- term: RAG
  full: retrieval-augmented generation
  desc: 检索增强生成：先检索相关内容放进上下文，再让模型回答
- term: FAQ
  full: frequently asked questions
  desc: 常见问题列表
- term: KA
  full: key account
  desc: 大客户，公司内部对重点客户的叫法
- term: LoRA
  full: Low-Rank Adaptation
  desc: 只训练低秩增量矩阵的轻量微调方法
- term: B2B
  full: business-to-business
  desc: 面向企业客户的业务
- term: DOM
  full: Document Object Model
  desc: 网页的树状结构
- term: XML
  full: Extensible Markup Language
  desc: Office 文件内部用的标记格式
- term: VLM
  full: vision-language model
  desc: 能看图的语言模型，这里用来读文档图像
- term: int8
  full: 8-bit integer
  desc: 8 位整数，用来压缩向量
- term: PQ / SQ
  full: product quantization / scalar quantization
  desc: 乘积量化 / 标量量化，压缩向量省内存
- term: QPS
  full: queries per second
  desc: 每秒查询数
- term: SPLADE
  full: SParse Lexical AnD Expansion model
  desc: 学出词权重的稀疏检索模型
- term: SaaS
  full: software as a service
  desc: 软件即服务，这里指多租户的在线产品
- term: p50 / p95
  full: 50th / 95th percentile
  desc: 延迟的中位数与 95 分位
- term: BI
  full: business intelligence
  desc: 商业智能：报表与指标分析
- term: ERP
  full: enterprise resource planning
  desc: 企业资源计划系统
- term: CRM
  full: customer relationship management
  desc: 客户关系管理系统
- term: MES
  full: manufacturing execution system
  desc: 制造执行系统，管车间生产
- term: DPO
  full: Direct Preference Optimization
  desc: 直接用偏好对训练模型的对齐方法
