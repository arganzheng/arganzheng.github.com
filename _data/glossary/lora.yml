- term: "peft"
  full: "Parameter-Efficient Fine-Tuning"
  desc: "Hugging Face 的参数高效微调库，LoRA 的标准实现"
- term: "trl"
  full: "Transformer Reinforcement Learning"
  desc: "Hugging Face 的后训练库，提供 SFTTrainer、DPOTrainer"
- term: "bitsandbytes"
  full: "—"
  desc: "做 4 / 8 bit 量化的库，QLoRA 靠它加载 NF4 底座"
- term: "LoRA"
  full: "Low-Rank Adaptation"
  desc: "冻结原权重，只训一对低秩矩阵 B、A 的微调方法"
- term: "SFT"
  full: "supervised fine-tuning"
  desc: "监督微调：用指令–回复数据继续训模型"
- term: "DPO"
  full: "Direct Preference Optimization"
  desc: "直接用偏好对训练的对齐方法，需要参考模型"
- term: "GRPO"
  full: "Group Relative Policy Optimization"
  desc: "组内相对奖励的强化学习方法，KL 项要参考模型"
- term: "SVD"
  full: "singular value decomposition"
  desc: "奇异值分解，用来看 ΔW 的秩、做低秩截断"
- term: "RoPE"
  full: "rotary position embedding"
  desc: "旋转位置编码：按位置把 q、k 的每对维度旋转一个角度"
- term: "HF"
  full: "Hugging Face"
  desc: "开源模型与库平台；本系列读的 peft、trl、transformers 都是它的源码"
- term: "adapter"
  full: "—"
  desc: "训完存下的 LoRA 权重（A、B），挂到底座上用"
- term: "FLOPs"
  full: "floating-point operations"
  desc: "浮点运算次数，计算量的单位"
- term: "rsLoRA"
  full: "Rank-Stabilized LoRA"
  desc: "把缩放从 α/r 改成 α/√r 的 LoRA"
- term: "lr"
  full: "learning rate"
  desc: "学习率"
- term: "LoRA+"
  full: "—"
  desc: "给 B 设比 A 更大学习率的 LoRA 变体"
- term: "PiSSA"
  full: "Principal Singular values and Singular vectors Adaptation"
  desc: "用 W 的主奇异方向初始化 A、B"
- term: "DoRA"
  full: "Weight-Decomposed Low-Rank Adaptation"
  desc: "把权重拆成幅度与方向，只对方向挂 LoRA"
- term: "OLoRA"
  full: "Orthonormal Low-Rank Adaptation"
  desc: "用 W 的 QR 分解初始化 LoRA"
- term: "EVA"
  full: "Explained Variance Adaptation"
  desc: "用激活的 SVD 初始化 A，并按方差重分各层的 r"
- term: "LoftQ"
  full: "LoRA-Fine-Tuning-aware Quantization"
  desc: "对着量化误差初始化 LoRA，配合 QLoRA 用"
- term: "QLoRA"
  full: "Quantized LoRA"
  desc: "底座量化到 4 bit、上面再挂 LoRA 的训练方法"
- term: "NF4"
  full: "4-bit NormalFloat"
  desc: "按正态分布分位数取 16 个格点的 4 bit 格式"
- term: "multi-LoRA"
  full: "—"
  desc: "一个底座同时挂多个 adapter、按请求切换的服务方式"
- term: "GPT-3"
  full: "Generative Pre-trained Transformer 3"
  desc: "OpenAI 的 175B 模型，LoRA 原论文在它上面做实验"
- term: "kernel"
  full: "—"
  desc: "设备上执行一次算子的函数，个数决定调度开销"
- term: "Kaiming"
  full: "—"
  desc: "按输入维度缩放的随机初始化（He 等 2015），peft 的默认"
- term: "QR"
  full: "QR decomposition"
  desc: "QR 分解：矩阵 = 正交矩阵 Q × 上三角矩阵 R"
- term: "safetensors"
  full: "—"
  desc: "Hugging Face 的张量文件格式，adapter 权重存在里面"
- term: "logits"
  full: "—"
  desc: "softmax 之前的词表分数"
- term: "FP32"
  full: "32-bit floating point"
  desc: "单精度浮点"
- term: "vLLM"
  full: "—"
  desc: "开源 LLM 推理引擎，支持 multi-LoRA 服务"
- term: "BF16"
  full: "bfloat16"
  desc: "16 bit 浮点，范围同 FP32、尾数短"
- term: "Adam"
  full: "adaptive moment estimation"
  desc: "每个参数存一阶、二阶两个矩的优化器"
- term: "SGD"
  full: "stochastic gradient descent"
  desc: "随机梯度下降"
- term: "AdamW"
  full: "Adam with decoupled weight decay"
  desc: "权重衰减与梯度更新分开的 Adam"
- term: "KV"
  full: "key–value"
  desc: "注意力里的键与值；这里指 K、V 投影的维度"
- term: "warmup"
  full: "—"
  desc: "训练开头几步把学习率从零逐步升到峰值"
- term: "GEMM"
  full: "general matrix multiply"
  desc: "通用矩阵乘，线性层前向反向的主体"
- term: "MRPC"
  full: "Microsoft Research Paraphrase Corpus"
  desc: "判断两句话是否同义的小数据集"
- term: "Adapter"
  full: "—"
  desc: "Houlsby 等 2019 的方法：每层串联插一个瓶颈小网络"
- term: "MLP"
  full: "multi-layer perceptron"
  desc: "多层感知机；在 Transformer 里指每层的前馈子层"
- term: "FFN"
  full: "feed-forward network"
  desc: "前馈网络，即每层的 MLP 子层"
- term: "Prefix-Tuning"
  full: "—"
  desc: "每层前面接几个可训的虚拟 token 的 K、V"
- term: "P-Tuning / Prompt Tuning"
  full: "—"
  desc: "只在输入前加可训的连续 prompt 向量"
- term: "BitFit"
  full: "Bias-terms Fine-tuning"
  desc: "只训 bias 的微调方法"
- term: "autograd"
  full: "automatic differentiation"
  desc: "PyTorch 的自动求导，用来核对手算梯度"
- term: "GQA"
  full: "grouped-query attention"
  desc: "多个 query 头共享一组 K、V 头，k、v 投影因此很窄"
- term: "FlashAttention"
  full: "—"
  desc: "分块计算注意力、不存注意力分数矩阵的 kernel"
- term: "LayerNorm"
  full: "layer normalization"
  desc: "层归一化"
- term: "aten"
  full: "A Tensor Library"
  desc: "PyTorch 底层的张量算子库，profiler 按它计数"
- term: "fan_in"
  full: "—"
  desc: "一层的输入维度，决定 Kaiming 初始化的幅度"
- term: "lm_head"
  full: "—"
  desc: "输出层，把 hidden 映射成词表 logits"
- term: "AdaLoRA"
  full: "Adaptive LoRA"
  desc: "训练中按重要性动态分配各矩阵 r 的变体"
- term: "CorDA"
  full: "Context-oriented Decomposition Adaptation"
  desc: "用数据协方差加权的 SVD 选初始方向"
- term: "GSM8K"
  full: "Grade School Math 8K"
  desc: "约 8500 道小学数学应用题的评测集"
- term: "INT4"
  full: "4-bit integer"
  desc: "均匀 16 格的 4 bit 整数量化"
- term: "CUDA"
  full: "Compute Unified Device Architecture"
  desc: "NVIDIA 的 GPU 编程平台，分页优化器用它的统一内存"
- term: "Vicuna"
  full: "—"
  desc: "用 GPT-4 打分的对话评测，QLoRA 论文用它"
- term: "llama.cpp"
  full: "—"
  desc: "C/C++ 写的本地推理框架"
- term: "TensorRT-LLM"
  full: "—"
  desc: "NVIDIA 的 LLM 推理框架"
- term: "KL"
  full: "Kullback–Leibler divergence"
  desc: "衡量两个分布差多远，这里约束策略别离参考太远"
- term: "Punica"
  full: "—"
  desc: "多 LoRA 服务系统（Chen 等 2023），vLLM 借用了它的 kernel"
- term: "SGMV"
  full: "Segmented Gather Matrix-Vector multiplication"
  desc: "按 adapter 分段、一次算完各组瘦矩阵乘的 kernel"
- term: "BGMV"
  full: "Batched Gather Matrix-Vector multiplication"
  desc: "每个请求取自己的 adapter 做矩阵–向量乘的 kernel"
- term: "decode"
  full: "—"
  desc: "逐 token 生成的阶段，batch 小、每步读一遍权重"
- term: "GEMV"
  full: "general matrix–vector multiply"
  desc: "矩阵乘向量，decode 时 batch 为 1 的线性层"
- term: "ulp"
  full: "unit in the last place"
  desc: "浮点数最后一位的单位，更小的增量会被舍掉"
- term: "FP8"
  full: "8-bit floating point"
  desc: "8 bit 浮点格式，常用于推理量化"
- term: "GPTQ"
  full: "—"
  desc: "逐层用二阶信息补偿误差的训练后权重量化方法"
- term: "AWQ"
  full: "Activation-aware Weight Quantization"
  desc: "按激活大小保护重要通道的权重量化方法"
- term: "S-LoRA"
  full: "Scalable LoRA"
  desc: "同时服务上千个 adapter 的系统（Sheng 等 2023）"
