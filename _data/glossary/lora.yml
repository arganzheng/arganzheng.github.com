---
- term: LoRA
  full: Low-Rank Adaptation
  zh: 低秩适配
  say: "/ˈlɔːrə/「洛拉」"
  desc: 冻结原权重，只训一对低秩矩阵 B、A 的微调方法
- term: SFT
  full: supervised fine-tuning
  zh: 监督微调
  say: 逐字母 S-F-T
  desc: 监督微调：用指令–回复数据继续训模型
- term: DPO
  full: Direct Preference Optimization
  zh: 直接偏好优化
  say: 逐字母 D-P-O
  desc: 直接用偏好对训练的对齐方法，需要参考模型
- term: GRPO
  full: Group Relative Policy Optimization
  zh: 组相对策略优化
  say: G-R-P-O
  desc: 组内相对奖励的强化学习方法，KL 项要参考模型
- term: SVD
  full: singular value decomposition
  zh: 奇异值分解
  say: S-V-D
  desc: 奇异值分解，用来看 ΔW 的秩、做低秩截断
- term: RoPE
  full: rotary position embedding
  zh: 旋转位置编码
  say: "/roʊp/「柔普」"
  desc: 旋转位置编码：按位置把 q、k 的每对维度旋转一个角度
- term: FLOPs
  full: floating-point operations
  zh: 浮点运算次数
  say: "/flɒps/「弗拉普斯」"
  desc: 浮点运算次数，计算量的单位
- term: rsLoRA
  full: Rank-Stabilized LoRA
  zh: 秩稳定低秩适配
  say: "「rsLoRA」"
  desc: 把缩放从 α/r 改成 α/√r 的 LoRA
- term: PiSSA
  full: Principal Singular values and Singular vectors Adaptation
  zh: 主奇异值与奇异向量适配
  say: "「PiSSA」"
  desc: 用 W 的主奇异方向初始化 A、B
- term: DoRA
  full: Weight-Decomposed Low-Rank Adaptation
  zh: 权重分解低秩适配
  say: "「DoRA」"
  desc: 把权重拆成幅度与方向，只对方向挂 LoRA
- term: OLoRA
  full: Orthonormal Low-Rank Adaptation
  zh: 正交归一化低秩适配
  say: "「OLoRA」"
  desc: 用 W 的 QR 分解初始化 LoRA
- term: EVA
  full: Explained Variance Adaptation
  zh: 可解释方差适配
  say: E-V-A
  desc: 用激活的 SVD 初始化 A，并按方差重分各层的 r
- term: LoftQ
  full: LoRA-Fine-Tuning-aware Quantization
  zh: 感知 LoRA 微调的量化
  say: "「LoftQ」"
  desc: 对着量化误差初始化 LoRA，配合 QLoRA 用
- term: QLoRA
  full: Quantized LoRA
  zh: 量化低秩适配
  say: "「QLoRA」"
  desc: 底座量化到 4 bit、上面再挂 LoRA 的训练方法
- term: QR
  full: QR decomposition
  zh: QR 分解
  say: Q-R
  desc: QR 分解：矩阵 = 正交矩阵 Q × 上三角矩阵 R
- term: Adam
  full: adaptive moment estimation
  zh: 自适应矩估计
  say: "「亚当」"
  desc: 每个参数存一阶、二阶两个矩的优化器
- term: SGD
  full: stochastic gradient descent
  zh: 随机梯度下降
  say: 逐字母 S-G-D
  desc: 随机梯度下降
- term: AdamW
  full: Adam with decoupled weight decay
  zh: Adam 加解耦权重衰减
  say: "「亚当-W」"
  desc: 权重衰减与梯度更新分开的 Adam
- term: GEMM
  full: general matrix multiply
  zh: 通用矩阵乘
  say: "/dʒɛm/「jem」"
  desc: 通用矩阵乘，线性层前向反向的主体
- term: MLP
  full: multi-layer perceptron
  zh: 多层感知机
  say: 逐字母 M-L-P
  desc: 多层感知机；在 Transformer 里指每层的前馈子层
- term: FFN
  full: feed-forward network
  zh: 前馈网络
  say: 逐字母 F-F-N
  desc: 前馈网络，即每层的 MLP 子层
- term: GQA
  full: grouped-query attention
  zh: 分组查询注意力
  say: 逐字母 G-Q-A
  desc: 多个 query 头共享一组 K、V 头，k、v 投影因此很窄
- term: CorDA
  full: Context-oriented Decomposition Adaptation
  zh: 上下文导向分解适配
  say: "「CorDA」"
  desc: 用数据协方差加权的 SVD 选初始方向
- term: KL
  full: Kullback–Leibler divergence
  zh: KL 散度
  say: 逐字母 K-L
  desc: 衡量两个分布差多远，这里约束策略别离参考太远
