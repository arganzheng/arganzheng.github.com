<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 428" width="860" height="428" role="img" aria-labelledby="t d">
  <title id="t">保存与加载的两条流水线</title>
  <desc id="d">左列保存：训练状态 → staging（GPU 到主机内存）→ plan（每 rank 列出要写什么并汇总去重）→ write（每 rank 写自己的数据块，coordinator 最后写 .metadata）。中间是磁盘上的 checkpoint 目录：.metadata 与 __0_0.distcp … __N_0.distcp。右列加载：新的训练状态 → 读 .metadata → plan（本地分片与磁盘分片求交得到 ReadItem）→ read（只读交集，narrow 后 copy_）→ set_state_dict()。保存写入的数据块和 .metadata 正是加载读取的对象，两条线在目录上交汇。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; font-weight: 700; }
      .mono12 { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .proc-a { fill: #f3f9f5; stroke: #70a582; stroke-width: 1.2; }
      .proc-b { fill: #fff8ec; stroke: #d79a45; stroke-width: 1.2; }
      .proc-c { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #ffe3c2; stroke: #d79a45; stroke-width: 1.4; }
      .disk { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .thin { stroke: #40566f; stroke-width: 1.2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .sep { stroke: #7a8b9c; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .cut { stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
      .red { fill: #b42318; }
      .grey { fill: #7a8b9c; }
      .dash { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .dasharrow { stroke: #40566f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .red { fill: #b42318; }
      .grey { fill: #7a8b9c; }
      .dash { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .dasharrow { stroke: #40566f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>
<text x="20" y="22" text-anchor="start" class="head">保存</text>
<text x="590" y="22" text-anchor="start" class="head">加载</text>
<rect class="proc-c" x="20" y="40" width="250" height="44"/>
<text x="145.0" y="58" text-anchor="middle" class="small">训练状态</text>
<text x="145.0" y="76" text-anchor="middle" class="small">（每 rank 持有自己的分片）</text>
<path d="M45 84 V130" class="arrow"/>
<text x="55" y="104" text-anchor="start" class="small"><tspan font-weight="700">state_dict()</tspan>：参数、优化器、</text>
<text x="55" y="121" text-anchor="start" class="small">调度器、数据位置、RNG、步数</text>
<rect class="proc-c" x="20" y="130" width="250" height="48"/>
<text x="145.0" y="150" text-anchor="middle" class="small"><tspan font-weight="700">staging</tspan>：GPU → 主机内存</text>
<text x="145.0" y="168" text-anchor="middle" class="small">（可选，异步保存必需）</text>
<path d="M45 178 V200" class="arrow"/>
<rect class="proc-c" x="20" y="200" width="250" height="48"/>
<text x="145.0" y="220" text-anchor="middle" class="small"><tspan font-weight="700">plan</tspan>：每 rank 列出要写什么，</text>
<text x="145.0" y="238" text-anchor="middle" class="small">汇总去重成全局计划</text>
<path d="M45 248 V270" class="arrow"/>
<rect class="proc-c" x="20" y="270" width="250" height="48"/>
<text x="145.0" y="290" text-anchor="middle" class="small"><tspan font-weight="700">write</tspan>：每 rank 写自己的数据块</text>
<text x="145.0" y="308" text-anchor="middle" class="small">coordinator 最后写 .metadata</text>
<rect class="proc-a" x="590" y="40" width="250" height="44"/>
<text x="715.0" y="58" text-anchor="middle" class="small">新的训练状态</text>
<text x="715.0" y="76" text-anchor="middle" class="small">（可能是另一套 TP/PP/DP）</text>
<path d="M615 84 V130" class="arrow"/>
<text x="625" y="104" text-anchor="start" class="small"><tspan font-weight="700">state_dict()</tspan>：只要 key 与</text>
<text x="625" y="121" text-anchor="start" class="small">全局形状，内容待填</text>
<rect class="proc-a" x="590" y="130" width="250" height="48"/>
<text x="715.0" y="150" text-anchor="middle" class="small"><tspan font-weight="700">读 .metadata</tspan>：每个张量的</text>
<text x="715.0" y="168" text-anchor="middle" class="small">全局形状 + 所有分片位置</text>
<path d="M615 178 V200" class="arrow"/>
<rect class="proc-a" x="590" y="200" width="250" height="48"/>
<text x="715.0" y="220" text-anchor="middle" class="small"><tspan font-weight="700">plan</tspan>：本地分片 ∩ 磁盘分片</text>
<text x="715.0" y="238" text-anchor="middle" class="small">→ ReadItem 列表</text>
<path d="M615 248 V270" class="arrow"/>
<rect class="proc-a" x="590" y="270" width="250" height="48"/>
<text x="715.0" y="290" text-anchor="middle" class="small"><tspan font-weight="700">read</tspan>：只读交集部分，</text>
<text x="715.0" y="308" text-anchor="middle" class="small">narrow 后 copy_ 到本地张量</text>
<path d="M615 318 V340" class="arrow"/>
<rect class="proc-a" x="590" y="340" width="250" height="48"/>
<text x="715.0" y="360" text-anchor="middle" class="small"><tspan font-weight="700">set_state_dict()</tspan>：</text>
<text x="715.0" y="378" text-anchor="middle" class="small">装回模型与优化器</text>
<rect class="frame" x="320" y="112" width="220" height="250"/>
<text x="430" y="136" text-anchor="middle" class="bold">磁盘上的 checkpoint 目录</text>
<rect class="seg-hi" x="340" y="150" width="180" height="42"/>
<text x="430" y="168" text-anchor="middle" class="monob">.metadata</text>
<text x="430" y="185" text-anchor="middle" class="small">最后写，出现即完整</text>
<rect class="seg-c" x="340" y="212" width="180" height="26"/>
<text x="430" y="230" text-anchor="middle" class="mono">__0_0.distcp</text>
<rect class="seg-c" x="340" y="246" width="180" height="26"/>
<text x="430" y="264" text-anchor="middle" class="mono">__1_0.distcp</text>
<rect class="seg-c" x="340" y="306" width="180" height="26"/>
<text x="430" y="324" text-anchor="middle" class="mono">__N_0.distcp</text>
<text x="430" y="294" text-anchor="middle" class="small">…</text>
<text x="430" y="352" text-anchor="middle" class="small">全局张量的一组分片</text>
<path d="M270 284 C 300 284, 305 171, 338 171" class="arrow"/>
<path d="M270 304 C 300 304, 305 259, 338 259" class="arrow"/>
<path d="M520 171 C 555 171, 555 154, 588 154" class="dasharrow"/>
<path d="M520 259 C 555 259, 555 294, 588 294" class="dasharrow"/>
<text x="430" y="392" text-anchor="middle" class="small"><tspan font-weight="700">实线</tspan>：保存写入　虚线：加载读取</text>
<text x="430" y="412" text-anchor="middle" class="small"><tspan font-weight="700">两条线只在这个目录上交汇</tspan>：加载先读 .metadata 找到每块在哪，再只读自己需要的数据块</text>
</svg>
