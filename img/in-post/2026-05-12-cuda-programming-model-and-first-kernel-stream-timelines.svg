<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 417" width="760" height="417" role="img" aria-labelledby="title desc">
  <title id="title">同一 stream 与多 stream 的时间线</title>
  <desc id="desc">顶部时间轴下有三组 stream 时间线。同一 stream 的 k1、k2、memcpy、k3 首尾相接；stream A 的 k1、k3 与 stream B 的 k2、k4 无顺序保证，k2 与 k1 重叠；legacy 默认 stream 0 的 k1、浅色虚线等待段、k3 与 stream B 的 k2 互相等待，因此并发被串行化。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f1f3f6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c5d0dc" stroke-width="2"/>
    </pattern>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
.head { font-size: 15px; font-weight: 700; }
.body { font-size: 14px; }
.small { font-size: 13px; }
.tick { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; fill: #40566f; }
.axis { stroke: #40566f; stroke-width: 1.5; fill: none; }
.grid { stroke: #e3e9ef; stroke-width: 1; fill: none; }
.guide { stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
.frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.3; }
.cpu { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
.gpu { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
.idle { fill: url(#hatch); stroke: #9aa8b6; stroke-width: 1.2; }

.time-axis { marker-end: url(#arrow); }
.wait { fill: url(#hatch); stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; }
</style>
  </defs>
  <rect x="0" y="0" width="760" height="417" fill="#fff"/>
<line x1="128" y1="38" x2="724" y2="38" class="axis time-axis"/>
<text class="small" x="128" y="27" text-anchor="start">时间</text>
<rect x="16" y="54" width="728" height="74" rx="8" class="frame"/>
<text class="head" x="28" y="91.0" dominant-baseline="central">同一 stream</text>
<rect x="132" y="70" width="67" height="42" class="gpu"/>
<text class="small" x="165.5" y="91.0" text-anchor="middle" dominant-baseline="central">k1</text>
<rect x="199" y="70" width="67" height="42" class="gpu"/>
<text class="small" x="232.5" y="91.0" text-anchor="middle" dominant-baseline="central">k2</text>
<rect x="266" y="70" width="104" height="42" class="cpu"/>
<text class="small" x="318.0" y="91.0" text-anchor="middle" dominant-baseline="central">memcpy</text>
<rect x="370" y="70" width="67" height="42" class="gpu"/>
<text class="small" x="403.5" y="91.0" text-anchor="middle" dominant-baseline="central">k3</text>
<rect x="16" y="140" width="728" height="119" rx="8" class="frame"/>
<text class="head" x="28" y="175.0" dominant-baseline="central">stream A</text>
<text class="head" x="28" y="224.0" dominant-baseline="central">stream B</text>
<rect x="132" y="156" width="126" height="38" class="gpu"/>
<text class="small" x="195.0" y="175.0" text-anchor="middle" dominant-baseline="central">k1</text>
<rect x="258" y="156" width="104" height="38" class="gpu"/>
<text class="small" x="310.0" y="175.0" text-anchor="middle" dominant-baseline="central">k3</text>
<rect x="210" y="205" width="110" height="38" class="gpu"/>
<text class="small" x="265.0" y="224.0" text-anchor="middle" dominant-baseline="central">k2</text>
<rect x="332" y="205" width="86" height="38" class="gpu"/>
<text class="small" x="375.0" y="224.0" text-anchor="middle" dominant-baseline="central">k4</text>
<rect x="16" y="271" width="728" height="130" rx="8" class="frame"/>
<text class="head" x="28" y="307.0" dominant-baseline="central">默认 stream 0</text>
<text class="head" x="28" y="365.0" dominant-baseline="central">stream B</text>
<rect x="132" y="287" width="86" height="40" class="gpu"/>
<text class="small" x="175.0" y="307.0" text-anchor="middle" dominant-baseline="central">k1</text>
<rect x="350" y="287" width="90" height="40" class="gpu"/>
<text class="small" x="395.0" y="307.0" text-anchor="middle" dominant-baseline="central">k3</text>
<rect x="250" y="345" width="100" height="40" class="gpu"/>
<text class="small" x="300.0" y="365.0" text-anchor="middle" dominant-baseline="central">k2</text>
<rect x="218" y="287" width="132" height="40" class="wait"/>
<text class="small" x="284.0" y="307.0" text-anchor="middle" dominant-baseline="central">等 B 完成</text>
<text class="small" x="464" y="91.0" dominant-baseline="central">严格按提交顺序，一个接一个</text>
<text class="small" x="464" y="190.5" dominant-baseline="central">无顺序保证，可并发</text>
<text class="small" x="464" y="208.5" dominant-baseline="central">（只要 SM 资源够）</text>
<text class="small" x="464" y="327.0" dominant-baseline="central">legacy 默认 stream 与其他 stream</text>
<text class="small" x="464" y="345.0" dominant-baseline="central">互相等待，把并发变回串行</text>
</svg>
