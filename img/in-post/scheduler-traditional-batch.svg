<svg xmlns="http://www.w3.org/2000/svg" width="760" height="594.0" viewBox="0 0 760 594" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css">@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgSans';font-weight:500;src:url(data:font/woff2;base64,)}</style>
  <title id="title">传统深度学习里的 Batch：一组请求进、一组结果出</title>
  <desc id="desc">Request A、B、C 组成一个固定 Batch，整体执行完后所有 Request 一起完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 500; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 500; }
      .small { font-size: 14px; }
      .mono { font-family:'SvgMono','SvgSans', "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0.0" width="760" height="594.0" fill="#fff" />
  <text x="380" y="75.60000000000001" text-anchor="middle" class="head" transform="translate(0.000 0.000) ">一个 Batch</text>
  <rect class="seg-b" x="155" y="108.0" width="150" height="86.4" />
  <text x="230" y="160.20000000000002" text-anchor="middle" class="body" transform="translate(0.000 -3.000) ">Request A</text>
  <rect class="seg-b" x="305" y="108.0" width="150" height="86.4" />
  <text x="380" y="160.20000000000002" text-anchor="middle" class="body" transform="translate(0.000 -3.000) ">Request B</text>
  <rect class="seg-b" x="455" y="108.0" width="150" height="86.4" />
  <text x="530" y="160.20000000000002" text-anchor="middle" class="body" transform="translate(0.000 -3.000) ">Request C</text>
  <line x1="380" y1="230.4" x2="380" y2="302.40000000000003" class="arrow" />
  <g data-card="1"><rect class="compute" x="230" y="302.40000000000003" width="300" height="93.60000000000001" /><text x="380.0" y="358.2" text-anchor="middle" class="bold" transform="translate(0.000 -3.000) ">执行完整 Batch</text></g>
  <line x1="380" y1="396.0" x2="380" y2="468.0" class="arrow" />
  <g data-card="1"><rect class="card" x="230" y="468.0" width="300" height="93.60000000000001" /><text x="380.0" y="523.8000000000001" text-anchor="middle" class="body" transform="translate(0.000 -3.000) ">所有 Request 完成</text></g>
