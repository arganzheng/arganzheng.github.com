<text x="16" y="20" class="t">四级 ZeRO：N_d = 4 张卡上，参数 P（2N）、梯度 G（2N）、优化器状态 O（12N）各是整份还是 1/4 片</text>
<text x="16" y="38" class="m">实心格 = 本卡持有的那一段；虚线格 = 不持有（在别的卡上）。每张卡的显存 = 实心部分之和。</text>
