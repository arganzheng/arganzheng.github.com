  <rect class="cell" x="536.0" y="254.0" width="8.0" height="22.0" style="fill:#dbe8fb"/>
  <rect class="cell" x="544.0" y="254.0" width="8.0" height="22.0" style="fill:#dbe8fb"/>
  <text class="monos" x="590.0" y="249.0" text-anchor="middle">t2</text>
  <rect class="cell" x="558.0" y="254.0" width="8.0" height="22.0" style="fill:#dbe8fb"/>
  <rect class="cell" x="566.0" y="254.0" width="8.0" height="22.0" style="fill:#dbe8fb"/>
