<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 317" width="760" height="317" role="img" aria-labelledby="t d">
  <title id="t">SIMT 与块级张量：block 0 与 program 0</title>
  <desc id="d">左：CUDA（SIMT）写的是一个线程。block 0 里 t0、t1、t2、t3 … t127 每个线程一份代码，各自指向 x[0]、x[1]、x[2]、x[3] … x[127]；idx 是标量，if (idx&lt;n) 是分支；程序员决定线程 i 拿元素 blockIdx*128 + i。右：Triton（块级张量）写的是一个 block。program 0 一份代码操作整块：offs = [0, 1, 2, ..., 1023]（张量），mask = offs &lt; n（张量），x = tl.load(x_ptr + offs, mask)，mask 是谓词；编译器决定把它分给 128 个线程 × 8 个元素/线程，这个 layout 在源码里看不到。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #222; }
      .head { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #333; }
      .bold { font-size: 13px; font-weight: 700; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .box { fill: #f4f7fb; stroke: #40566f; stroke-width: 1.2; }
      .cell { fill: #fff; stroke: #40566f; stroke-width: 1; }
      .line { stroke: #40566f; stroke-width: 1.2; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40566f"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="317" fill="#fff"/>
  <text class="head" x="20.0" y="26.0">CUDA（SIMT）：写的是“一个线程”</text>
  <text class="small" x="20.0" y="48.0">每个线程一份代码；idx 是标量；if (idx&lt;n) 是分支</text>
  <text class="head" x="400.0" y="26.0">Triton（块级张量）：写的是“一个 block”</text>
  <text class="small" x="400.0" y="48.0">一份代码操作整块；mask 是谓词</text>
  <text class="bold" x="20.0" y="80.0">block 0</text>
  <text class="bold" x="400.0" y="80.0">program 0</text>
  <rect class="cell" x="20.0" y="92.0" width="54.0" height="28.0" style="fill:#dbe8fb"/>
  <text class="mono" x="47.0" y="111.0" text-anchor="middle">t0</text>
