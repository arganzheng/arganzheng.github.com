  <text class="body" x="279.0" y="111.0" text-anchor="middle">…</text>
  <text class="body" x="279.0" y="171.0" text-anchor="middle">…</text>
  <rect class="cell" x="310.0" y="92.0" width="54.0" height="28.0" style="fill:#dbe8fb"/>
  <text class="mono" x="337.0" y="111.0" text-anchor="middle">t127</text>
  <line class="arrow" x1="337.0" y1="120.0" x2="337.0" y2="150.0"/>
  <rect class="cell" x="310.0" y="152.0" width="54.0" height="28.0"/>
  <text class="mono" x="337.0" y="171.0" text-anchor="middle">x[127]</text>
  <rect class="box" x="400.0" y="92.0" width="340.0" height="88.0"/>
  <text class="mono" x="412.0" y="118.0">offs = [0, 1, 2, ..., 1023]</text>
  <text class="small" x="728.0" y="118.0" text-anchor="end">张量</text>
  <text class="mono" x="412.0" y="142.0">mask = offs &lt; n</text>
  <text class="small" x="728.0" y="142.0" text-anchor="end">张量</text>
  <text class="mono" x="412.0" y="166.0">x = tl.load(x_ptr + offs, mask)</text>
  <line class="arrow" x1="570.0" y1="180.0" x2="570.0" y2="234.0"/>
  <text class="small" x="580.0" y="213.0">编译器决定</text>
  <text class="monos" x="450.0" y="249.0" text-anchor="middle">t0</text>
  <rect class="cell" x="418.0" y="254.0" width="8.0" height="22.0" style="fill:#dbe8fb"/>
