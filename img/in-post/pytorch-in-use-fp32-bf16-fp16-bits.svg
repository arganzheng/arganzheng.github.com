<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 204" width="602" height="204" role="img" aria-labelledby="t d">
<title id="t">fp32 / bf16 / fp16 的指数与尾数位数</title>
<desc id="d">每格一位。fp32：1 位符号、8 位指数、23 位尾数。bf16：1 位符号、8 位指数、7 位尾数，砍尾数，保范围。fp16：1 位符号、5 位指数、10 位尾数，砍指数，保精度。指数决定范围，尾数决定精度。</desc>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#111;font-weight:500}
.h{font-size:13px} .lab{font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.t{font-size:13px} .note{font-size:13px}
.sg{fill:#e5e7eb;stroke:#374151;stroke-width:1} .ex{fill:#bfdbfe;stroke:#374151;stroke-width:1} .ma{fill:#fed7aa;stroke:#374151;stroke-width:1}
.tick{stroke:#374151;stroke-width:0.6;opacity:.55}
</style>
