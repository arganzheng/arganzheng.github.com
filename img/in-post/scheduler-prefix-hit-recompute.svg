<svg xmlns="http://www.w3.org/2000/svg" width="760" height="374.40000000000003" viewBox="0 0 760 374.4" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css">@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}</style>
  <title id="title">Prefix Cache 命中降低重算成本</title>
  <desc id="desc">同一条 Prompt：没有 Prefix Cache 时全部重算；有 Prefix Cache 时命中的前缀直接复用，只重算后面一段。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 500; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 500; }
      .small { font-size: 14px; }
      .mono { font-family:'SvgMono','SvgSans', "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0.0" width="760" height="374.40000000000003" fill="#fff" />
  <text x="190" y="50.4" text-anchor="start" class="small" transform="translate(0.000 0.000) ">被抢占的 Request 恢复时，整条 Prompt 要重新 Prefill：</text>
  <text x="30" y="140.4" text-anchor="start" class="body" transform="translate(0.000 0.000) ">没有 Prefix Cache</text>
  <rect class="seg-a" x="190" y="86.4" width="530" height="90.0" />
  <text x="455" y="142.20000000000002" text-anchor="middle" class="body" transform="translate(0.000 -4.800) ">整条 Prompt 全部重算</text>
  <text x="30" y="295.2" text-anchor="start" class="body" transform="translate(0.000 0.000) ">有 Prefix Cache</text>
  <rect class="seg-free" x="190" y="241.20000000000002" width="330" height="90.0" />
  <text x="355" y="297.0" text-anchor="middle" class="body" transform="translate(-0.000 -4.800) ">前缀命中，直接复用</text>
  <rect class="seg-a" x="520" y="241.20000000000002" width="200" height="90.0" />
  <text x="620" y="297.0" text-anchor="middle" class="body" transform="translate(-0.000 -4.800) ">只重算这一段</text>
<rect x="186" y="30.399600982666016" width="359.9150695800781" height="28.000499725341797" fill="transparent" stroke="none" /><rect x="26" y="120.39959716796875" width="119.67466735839844" height="28.000499725341797" fill="transparent" stroke="none" /><rect x="26" y="275.1996154785156" width="105.68994903564453" height="28.000499725341797" fill="transparent" stroke="none" /></svg>
