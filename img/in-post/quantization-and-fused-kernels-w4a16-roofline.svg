<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="700" height="440" fill="#ffffff"/>
  <!-- plot: x = M (log10 0..3.612 -> 70..660, 163.3 px/decade); y = time us (log10 0..3 -> 370..30, 113.3 px/decade) -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="70" y1="370" x2="660" y2="370"/>
    <line x1="70" y1="256.7" x2="660" y2="256.7"/>
    <line x1="70" y1="143.4" x2="660" y2="143.4"/>
    <line x1="70" y1="30" x2="660" y2="30"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
    <line x1="233.3" y1="30" x2="233.3" y2="370"/>
    <line x1="396.6" y1="30" x2="396.6" y2="370"/>
    <line x1="559.9" y1="30" x2="559.9" y2="370"/>
  </g>
  <g stroke="#333" stroke-width="1.2">
    <line x1="70" y1="370" x2="660" y2="370"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="70" y="388">1</text>
    <text x="233.3" y="388">10</text>
    <text x="396.6" y="388">100</text>
    <text x="559.9" y="388">1000</text>
    <text x="365" y="412" font-size="13">M = 本次 GEMM 的 token 数（decode: batch；prefill: prompt 长度）</text>
  </g>
  <g fill="#333" text-anchor="end">
    <text x="62" y="374">1</text>
    <text x="62" y="260.7">10</text>
    <text x="62" y="147.4">100</text>
    <text x="62" y="34">1000</text>
  </g>
  <text x="18" y="200" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 18 200)">一次 [M,4096]×[4096,4096] 的时间下界（µs，A100）</text>

  <!-- compute line (shared): t = 2*M*K*N / 312T = 0.1075 M us; from M=1 (0.1075 -> below axis) draw from M=10 -->
  <!-- BF16: flat at 16.8 us until M=156, then slope -->
  <polyline points="70,231.2 428.1,231.2 659.9,70.5" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <!-- INT4: flat at 4.2 us until M=32.6, then slope with 1.2x overhead -->
  <polyline points="70,299.4 317.1,299.4 659.9,61.5" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- knees -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="4 4">
    <line x1="428.1" y1="231.2" x2="428.1" y2="370"/>
    <line x1="317.1" y1="299.4" x2="317.1" y2="370"/>
  </g>
  <text x="432" y="362" fill="#555" font-size="11">M≈156 (BF16 ridge)</text>
  <text x="321" y="346" fill="#555" font-size="11">M≈40 (INT4 ridge)</text>

  <!-- labels -->
  <text x="80" y="224" fill="#2e6da4" font-size="12">BF16：读 32 MiB 权重 = 16.8 µs</text>
  <text x="80" y="316" fill="#c0392b" font-size="12">INT4：读 8 MiB 权重 = 4.2 µs</text>
  <text x="560" y="118" fill="#2e6da4" font-size="12" text-anchor="end">BF16：2MKN / 312 TFLOPS</text>
  <text x="560" y="66" fill="#c0392b" font-size="12" text-anchor="end">INT4：同样 FLOPs + 反量化指令（≈ +20%）</text>

  <!-- region annotations -->
  <g fill="#1e8449" font-size="12" font-weight="bold">
    <text x="150" y="272" text-anchor="middle">memory-bound</text>
    <text x="150" y="288" text-anchor="middle" font-weight="normal" font-size="11">INT4 快 ≈ 4×（decode）</text>
  </g>
  <g fill="#b9770e" font-size="12" font-weight="bold">
    <text x="330" y="168" text-anchor="middle">过渡区</text>
    <text x="330" y="184" text-anchor="middle" font-weight="normal" font-size="11">INT4 已 compute-bound，BF16 还没</text>
  </g>
  <g fill="#c0392b" font-size="12" font-weight="bold">
    <text x="590" y="250" text-anchor="middle">compute-bound</text>
    <text x="590" y="266" text-anchor="middle" font-weight="normal" font-size="11">INT4 反而慢（prefill）</text>
  </g>
  <!-- gap arrows -->
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1e8449"/>
    </marker>
  </defs>
  <line x1="200" y1="236" x2="200" y2="294" stroke="#1e8449" stroke-width="1.5" marker-end="url(#a2)" marker-start="url(#a2)"/>
</svg>
