<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img" aria-labelledby="t d">
  <title id="t">E ≈ A × U：矩形面积与两块空白</title>
  <desc id="d">横轴是卡的份额：已分配 A = 85%，没给出去 1 − A = 15%；纵轴是已分配卡上 SM 在算的时间份额（SM_ACTIVE）：算了 U = 41%，分配了但没算 1 − U = 59%；面积 = GPU 时间。左下块 E = A × U = 35 个点；左上块分配了但没算，A × (1 − U) = 50 个点；右侧整列没给出去，15 个点。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #222; }
      .head { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .bold { font-size: 13px; font-weight: 700; }
      .gapt { font-size: 13px; font-weight: 700; fill: #8a4a10; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .tick { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #333; }
      .val { font-size: 13px; fill: #333; }
      .busy { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .gap { fill: #fde4c8; stroke: #40566f; stroke-width: 1.2; }
      .rest { fill: #f1f3f6; stroke: #40566f; stroke-width: 1.2; }
      .axis { stroke: #555; stroke-width: 1; }
      .dim { stroke: #40566f; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="414" fill="#fff"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker></defs>
  <line class="dim" x1="153.0" y1="46" x2="606.0" y2="46" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <line class="dim" x1="150.0" y1="40" x2="150.0" y2="52"/><line class="dim" x1="609.0" y1="40" x2="609.0" y2="52"/>
  <text class="bold" x="379.5" y="36" text-anchor="middle">已分配 A = 85%</text>
  <line class="dim" x1="612.0" y1="46" x2="687.0" y2="46" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <line class="dim" x1="609.0" y1="40" x2="609.0" y2="52"/><line class="dim" x1="690.0" y1="40" x2="690.0" y2="52"/>
  <text class="bold" x="649.5" y="36" text-anchor="middle">1 − A</text>
  <rect class="gap" x="150" y="70" width="459.0" height="177.0"/>
  <rect class="busy" x="150" y="247.0" width="459.0" height="123.0"/>
  <rect class="rest" x="609.0" y="70" width="81.0" height="300"/>
  <text class="gapt" x="379.5" y="153.0" text-anchor="middle">分配了但没算</text>
  <text class="body" x="379.5" y="173.0" text-anchor="middle">A × (1 − U) = 50 个点</text>
  <text class="bold" x="379.5" y="303.0" text-anchor="middle">算了</text>
  <text class="body" x="379.5" y="323.0" text-anchor="middle">E = A × U = 35 个点</text>
  <text class="bold" x="649.5" y="194.5" text-anchor="middle">没给</text>
  <text class="bold" x="649.5" y="214.5" text-anchor="middle">出去</text>
  <text class="body" x="649.5" y="234.5" text-anchor="middle">15</text>
  <text class="body" x="649.5" y="254.5" text-anchor="middle">个点</text>
  <text class="body" x="80.0" y="153.0" text-anchor="middle">分配了但没算</text>
  <text class="body" x="80.0" y="173.0" text-anchor="middle">1 − U = 59%</text>
  <text class="body" x="80.0" y="303.0" text-anchor="middle">算了</text>
  <text class="body" x="80.0" y="323.0" text-anchor="middle">U = 41%</text>
  <text class="tick" x="698" y="74">100%</text>
  <text class="tick" x="698" y="374">0</text>
  <text class="body" x="420.0" y="398" text-anchor="middle">横轴：卡的份额；纵轴：已分配卡上 SM 在算的时间份额（SM_ACTIVE）；面积 = GPU 时间</text>
</svg>
