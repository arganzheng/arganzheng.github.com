<svg xmlns="http://www.w3.org/2000/svg" width="750" height="499" viewBox="0 0 750 499" role="img" aria-labelledby="title desc">
    <title id="title">call() 里 buffer 的生命周期：三个逻辑值共用一次分配</title><desc id="desc">extern mm 写入 buf0。buf1 成为同一存储的别名，删除 buf0 引用不释放显存。融合 Kernel 对每个元素先读取 mm 结果，再在寄存器计算 add 得到 tmp2、计算 relu 得到 tmp4，原地写回。调用返回 buf1 引用，不等待 GPU 完成。横轴表示依赖顺序而非实际耗时，Kernel 内为单元素示意，不表示跨线程块同步。</desc>
    <style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:600;fill:#111}
    .title{font-size:19px;font-weight:700}.small{font-size:13px}.mono{font-family:"Noto Sans Mono CJK SC",monospace;font-size:13px}
    .line{fill:none;stroke:#536273;stroke-width:1.2}.arrow{fill:none;stroke:#536273;stroke-width:1.5;marker-end:url(#arrow)}
    .outline{stroke:#536273;stroke-width:1.2}.guide{fill:none;stroke:#c4ccd5;stroke-width:1;stroke-dasharray:3 4}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#536273"/></marker></defs>
    <rect width="750" height="499" fill="#fff"/>
    <text x="20" y="29" class="title" text-anchor="start">buffer 生命周期</text><text x="20" y="56" class="title" text-anchor="start">三个逻辑值，共用一次显存分配</text><text x="20" y="91" class="" text-anchor="start">依赖顺序</text><path d="M190,86 H732" class="arrow"/><path d="M190,100 V419" class="guide"/><path d="M328,100 V419" class="guide"/><text x="20" y="134" class="" text-anchor="start">GPU 计算</text><rect x="190" y="112" width="138" height="38" fill="#e4edfa" class="outline"/><text x="202" y="137" class="" text-anchor="start">extern mm</text><rect x="328" y="112" width="402" height="38" fill="#ddf2e7" class="outline"/><text x="342" y="137" class="" text-anchor="start">fused add_relu</text><text x="20" y="177" class="" text-anchor="start">逻辑中间值</text><text x="20" y="207" class="" text-anchor="start">mm 的输出</text><rect x="190" y="185" width="240" height="34" fill="#e4edfa" class="outline"/><text x="202" y="207" class="" text-anchor="start">mm 写入 → tl.load</text><text x="20" y="252" class="" text-anchor="start">add 的输出</text><rect x="430" y="230" width="70" height="34" fill="#fff0d6" class="outline"/><text x="440" y="252" class="" text-anchor="start">tmp2</text><text x="20" y="297" class="" text-anchor="start">relu 的输出</text><rect x="500" y="275" width="230" height="34" fill="#ddf2e7" class="outline"/><text x="512" y="297" class="" text-anchor="start">tmp4 → 原地写回，保留输出</text><text x="20" y="340" class="" text-anchor="start">物理存储</text><rect x="190" y="349" width="540" height="32" fill="#e4edfa" class="outline"/><text x="203" y="371" class="" text-anchor="start">(128, 64)：同一块显存，只分配一次</text><text x="20" y="407" class="" text-anchor="start">Python 引用</text><rect x="190" y="387" width="138" height="32" fill="#f2f5f9" class="outline"/><text x="202" y="408" class="" text-anchor="start">buf0</text><rect x="328" y="387" width="402" height="32" fill="#f2f5f9" class="outline"/><text x="342" y="408" class="" text-anchor="start">buf1 = buf0；del buf0</text><text x="20" y="452" class="small" text-anchor="start">融合 Kernel 内按单元素展开；return 返回引用，不等待 GPU 完成</text><text x="20" y="477" class="small" text-anchor="start">Eager：t1、y、out 三次分配；Inductor：buf0 一次分配，buf1 只是别名</text></svg>