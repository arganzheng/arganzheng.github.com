  <path d="M690.0,456.0 L690.0,460.0" class="line"/>
  <text x="720.0" y="460.0" class="b">t</text>
  <text x="90.0" y="482.0" class="n">尾巴只占总时长的 1/10：achieved occupancy ≈ theoretical</text>
</svg>
