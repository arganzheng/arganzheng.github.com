  <path d="M690.0,184.0 L690.0,188.0" class="line"/>
  <text x="720.0" y="188.0" class="b">t</text>
  <text x="164.0" y="134.0" class="n">60% 的 block 槽位从头到尾空着：问题在 grid，不在 kernel 体内</text>
  <text x="20.0" y="220.0" class="h">waves = 1.2（grid ≈ 1037）</text>
  <path d="M90.0,320.0 L90.0,232.0" class="line"/>
  <path d="M86.0,240.0 L90.0,240.0" class="line"/>
  <text x="82.0" y="244.0" class="s" text-anchor="end">100%</text>
  <path d="M86.0,304.0 L90.0,304.0" class="line"/>
  <text x="82.0" y="308.0" class="s" text-anchor="end">20%</text>
  <rect x="90.0" y="240.0" width="60.0" height="80.0" class="bar" />
  <rect x="150.0" y="304.0" width="60.0" height="16.0" class="bar" />
  <path d="M90.0,320.0 L714.0,320.0" class="axis"/>
  <path d="M150.0,320.0 L150.0,324.0" class="line"/>
  <path d="M210.0,320.0 L210.0,324.0" class="line"/>
  <path d="M270.0,320.0 L270.0,324.0" class="line"/>
  <path d="M330.0,320.0 L330.0,324.0" class="line"/>
  <path d="M390.0,320.0 L390.0,324.0" class="line"/>
