  <path d="M690.0,320.0 L690.0,324.0" class="line"/>
  <text x="720.0" y="324.0" class="b">t</text>
  <text x="224.0" y="270.0" class="n">第二波只有 20% 的 block，却占近一半时间（tail）</text>
  <text x="224.0" y="288.0" class="n">SOL 是全程平均值，被这一半拉低</text>
  <text x="20.0" y="356.0" class="h">waves = 9.5（grid = 8192，fused add+RMSNorm）</text>
  <path d="M90.0,456.0 L90.0,368.0" class="line"/>
  <path d="M86.0,376.0 L90.0,376.0" class="line"/>
  <text x="82.0" y="380.0" class="s" text-anchor="end">100%</text>
  <path d="M86.0,417.6 L90.0,417.6" class="line"/>
  <text x="82.0" y="421.6" class="s" text-anchor="end">48%</text>
  <rect x="90.0" y="376.0" width="540.0" height="80.0" class="bar" />
  <rect x="630.0" y="417.6" width="60.0" height="38.4" class="bar" />
  <path d="M90.0,456.0 L714.0,456.0" class="axis"/>
  <path d="M150.0,456.0 L150.0,460.0" class="line"/>
