      .card { fill: #fff; stroke: #8a9bb0; stroke-width: 1.2; }
      .col-k { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; }
      .col-v { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; }
      .inner { fill: #fff; stroke: #4b9477; stroke-width: 1; }
      .job { fill: #7fa6d9; stroke: #40566f; stroke-width: 1; }
      .other { fill: #b9c2cc; stroke: #40566f; stroke-width: 1; }
      .free { fill: #fff; stroke: #40566f; stroke-width: 1; }
      .seg-a { fill: #fde8c8; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-x { fill: #eceff2; stroke: #9aa8b6; stroke-width: 1.2; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .tick { stroke: #40566f; stroke-width: 1.2; fill: none; }
      .tickk { stroke: #9aa8b6; stroke-width: 1; fill: none; }
    </style>
