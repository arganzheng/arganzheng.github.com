<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 491" width="760" height="491" role="img" aria-labelledby="t d">
  <title id="t">同一个 8 节点任务的三种落法</title>
  <desc id="d">网络层级：spine（block，tier 2，跨 leaf 3 跳）下接 leaf-1（rack r1）和 leaf-2（rack r2）（tier 1，同 leaf 1 跳）；r1 有 n1…n8，r2 有 n9…n16，每台 8 卡，机内 NVLink（tier 0）。放法 A：podset-required-topology: rack（Volcano hard, highestTierAllowed=1），J 占满 r1、r2 全空；任意两 Pod 之间 1 跳，代价是要等 r1 或 r2 有 8 台整机同时空出来。放法 B：无拓扑约束（或 preferred 退到 block），J 在 r1 占 3 台、r2 占 5 台，半数流量跨 spine 3 跳，与其他任务共享 leaf 上行，step time 可能翻倍，无报错。放法 C：碎片化（binpack 关闭时最常见），每台机器一半卡给 J、一半给其他任务，下一个 8 卡/整机任务永远等不到整机。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
