<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 103" width="760" height="103" role="img" aria-labelledby="t d">
  <title id="t">默认路径：veth + overlay 的数据流</title>
  <desc id="d">数据从 GPU 显存经 cudaMemcpy 拷到 host 内存，send() 进内核协议栈，经 veth 到宿主机，封装后由物理网卡发往对端，对端反向再走一遍。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #9fb3c8; stroke-width: 1.4; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .darrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); marker-start: url(#arrowr); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .vline { stroke: #40566f; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .seg { stroke: #40566f; stroke-width: 1.2; }
      .s-train { fill: #cfeccf; } .s-pause { fill: #f9d5d3; } .s-write { fill: #cfe2f3; }
      .s-idle { fill: #f3f5f7; } .s-stage { fill: #fde0b8; } .s-host { fill: #fff0a8; }
    </style>
  </defs>
<rect x="24.2" y="30.0" width="81.6" height="36.0" class="box"/>
<text x="65.0" y="53.0" text-anchor="middle" class="body">GPU 显存</text>
<line x1="105.8" y1="48" x2="191.8" y2="48" class="arrow"/>
<text x="148.8" y="40.0" text-anchor="middle" class="mono">cudaMemcpy</text>
<rect x="191.8" y="30.0" width="90.0" height="36.0" class="box"/>
<text x="236.8" y="53.0" text-anchor="middle" class="body">host 内存</text>
<line x1="281.8" y1="48" x2="337.8" y2="48" class="arrow"/>
<text x="309.8" y="40.0" text-anchor="middle" class="mono">send()</text>
<rect x="337.8" y="30.0" width="90.0" height="36.0" class="box"/>
<text x="382.8" y="53.0" text-anchor="middle" class="body">内核协议栈</text>
<line x1="427.8" y1="48" x2="473.8" y2="48" class="arrow"/>
<text x="450.8" y="40.0" text-anchor="middle" class="mono">veth</text>
<rect x="473.8" y="30.0" width="62.0" height="36.0" class="box"/>
<text x="504.8" y="53.0" text-anchor="middle" class="body">宿主机</text>
<line x1="535.8" y1="48" x2="581.8" y2="48" class="arrow"/>
<text x="558.8" y="40.0" text-anchor="middle" class="small">封装</text>
<rect x="581.8" y="30.0" width="76.0" height="36.0" class="box"/>
<text x="619.8" y="53.0" text-anchor="middle" class="body">物理网卡</text>
<line x1="657.8" y1="48" x2="687.8" y2="48" class="arrow"/>
<rect x="687.8" y="30.0" width="48.0" height="36.0" class="box"/>
<text x="711.8" y="53.0" text-anchor="middle" class="body">对端</text>
<text x="735.8" y="86.0" text-anchor="end" class="muted">（反向再来一遍）</text>
</svg>
