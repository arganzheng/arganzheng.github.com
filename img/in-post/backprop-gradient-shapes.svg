<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">梯度的形状：对谁求导，结果就和谁同形；向量对向量得到 Jacobian</title>
  <desc id="d">三个例子。① 标量 L = x₁² + x₂² + x₃² 对向量 x = (1, 2, 3) 求导，得 ∂L/∂x = 2x = (2, 4, 6)，与 x 同形。② 标量 L = 各元素平方和 对 2×2 矩阵 W = [[1, 2], [3, 4]] 求导，得 ∂L/∂W = 2W = [[2, 4], [6, 8]]，与 W 同形。③ 向量 y = (x₁ + x₂, x₂·x₃) 对向量 x = (1, 2, 3) 求导，得 2×3 的 Jacobian，第一行 ∂y₁/∂x = (1, 1, 0)，第二行 ∂y₂/∂x = (0, x₃, x₂) = (0, 3, 2)。</desc>
  <defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
  <style>.t{fill:#222;font-weight:700;font-size:15px}.f{fill:#222;font-weight:700;font-size:14px}.v{fill:#15803d;font-size:13px}.g{fill:#ea580c;font-size:13px;font-weight:600}.s{fill:#555;font-size:12px}.o{fill:#ea580c;font-size:12.5px;font-weight:600}</style>
  <text x="20" y="26" class="t">梯度的形状：「L 对 x 求导」，结果和 x 同形；输出是向量时得到 Jacobian</text>
  <rect x="12" y="54" width="796" height="108" rx="6" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="26" y="80" class="f">① 标量对向量</text>
  <text x="26" y="104" class="s">L = x₁² + x₂² + x₃²</text>
  <text x="26" y="124" class="s">x = (1, 2, 3)</text>
  <text x="270" y="76" class="s">自变量 x（3 个数）</text>
  <rect x="270" y="92" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="287.0" y="114.0" text-anchor="middle" class="f" font-weight="400">1</text>
  <rect x="304" y="92" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="321.0" y="114.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <rect x="338" y="92" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="355.0" y="114.0" text-anchor="middle" class="f" font-weight="400">3</text>
  <line x1="390" y1="114" x2="448" y2="114" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="419" y="106" text-anchor="middle" class="s">求导</text>
  <text x="470" y="76" class="g">∂L/∂x = 2x</text>
  <rect x="470" y="92" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="487.0" y="114.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <rect x="504" y="92" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="521.0" y="114.0" text-anchor="middle" class="f" font-weight="400">4</text>
  <rect x="538" y="92" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="555.0" y="114.0" text-anchor="middle" class="f" font-weight="400">6</text>
  <text x="660" y="114" class="s">与 x 同形：3 个数</text>
  <rect x="12" y="172" width="796" height="108" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="26" y="198" class="f">② 标量对矩阵</text>
  <text x="26" y="222" class="s">L = W₁₁² + W₁₂² + W₂₁² + W₂₂²</text>
  <text x="26" y="242" class="s">W 是 2×2</text>
  <text x="270" y="194" class="s">自变量 W（2×2）</text>
  <rect x="270" y="202" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="287.0" y="224.0" text-anchor="middle" class="f" font-weight="400">1</text>
  <rect x="304" y="202" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="321.0" y="224.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <rect x="270" y="236" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="287.0" y="258.0" text-anchor="middle" class="f" font-weight="400">3</text>
  <rect x="304" y="236" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="321.0" y="258.0" text-anchor="middle" class="f" font-weight="400">4</text>
  <line x1="390" y1="232" x2="448" y2="232" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="419" y="224" text-anchor="middle" class="s">求导</text>
  <text x="470" y="194" class="g">∂L/∂W = 2W</text>
  <rect x="470" y="202" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="487.0" y="224.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <rect x="504" y="202" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="521.0" y="224.0" text-anchor="middle" class="f" font-weight="400">4</text>
  <rect x="470" y="236" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="487.0" y="258.0" text-anchor="middle" class="f" font-weight="400">6</text>
  <rect x="504" y="236" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="521.0" y="258.0" text-anchor="middle" class="f" font-weight="400">8</text>
  <text x="660" y="232" class="s">与 W 同形：2×2</text>
  <rect x="12" y="290" width="796" height="108" rx="6" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="26" y="316" class="f">③ 向量对向量</text>
  <text x="26" y="340" class="s">y = (x₁ + x₂,  x₂·x₃)</text>
  <text x="26" y="360" class="s">x = (1, 2, 3)</text>
  <text x="270" y="312" class="s">自变量 x（3 个数）</text>
  <rect x="270" y="328" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="287.0" y="350.0" text-anchor="middle" class="f" font-weight="400">1</text>
  <rect x="304" y="328" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="321.0" y="350.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <rect x="338" y="328" width="34" height="34" fill="#dbeafe" stroke="#64748b"/>
  <text x="355.0" y="350.0" text-anchor="middle" class="f" font-weight="400">3</text>
  <line x1="390" y1="350" x2="448" y2="350" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="419" y="342" text-anchor="middle" class="s">求导</text>
  <text x="470" y="312" class="g">Jacobian ∂y/∂x</text>
  <rect x="470" y="320" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="487.0" y="342.0" text-anchor="middle" class="f" font-weight="400">1</text>
  <rect x="504" y="320" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="521.0" y="342.0" text-anchor="middle" class="f" font-weight="400">1</text>
  <rect x="538" y="320" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="555.0" y="342.0" text-anchor="middle" class="f" font-weight="400">0</text>
  <rect x="470" y="354" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="487.0" y="376.0" text-anchor="middle" class="f" font-weight="400">0</text>
  <rect x="504" y="354" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="521.0" y="376.0" text-anchor="middle" class="f" font-weight="400">3</text>
  <rect x="538" y="354" width="34" height="34" fill="#ffedd5" stroke="#64748b"/>
  <text x="555.0" y="376.0" text-anchor="middle" class="f" font-weight="400">2</text>
  <text x="578" y="342.0" class="s">← ∂y₁/∂x</text>
  <text x="578" y="376.0" class="s">← ∂y₂/∂x</text>
  <text x="660" y="350" class="s">y 的长度 × x 的长度：2×3</text>
  <text x="20" y="440" class="s">「L 对 x」是「L 对 x 求导」的简写：L 是被求导的输出（因变量），x 是对它求导的输入（自变量），不是相乘或相加。</text>
  <text x="20" y="458" class="s">结果的每一格回答同一个问题：输入的这一格变一点，输出跟着变多少。所以输入有几格，梯度就有几格。</text>
</svg>
