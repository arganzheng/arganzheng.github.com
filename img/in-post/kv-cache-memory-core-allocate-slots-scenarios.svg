<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" role="img" aria-labelledby="t d">
  <title id="t">allocate_slots() 的五种常见场景</title>
  <desc id="d">用 2000 token system prompt + 50 token 用户输入的例子，看五种场景下 computed、new_computed、external、new、lookahead 各占多少。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="40" y="30" text-anchor="start" class="bold">1 首个请求，前缀无命中</text><rect class="seg-a" x="40" y="40" width="680.0" height="34"/><text x="380.0" y="62.0" text-anchor="middle" class="mono">new 2050</text><text x="40" y="94" text-anchor="start" class="small">算 2050，分配 129 块</text><text x="40" y="128" text-anchor="start" class="bold">2 第二个请求，前缀命中 125 块</text><rect class="seg-b" x="40" y="138" width="560.0" height="34"/><text x="320.0" y="160.0" text-anchor="middle" class="mono">new_computed 2000</text><rect class="seg-a" x="600.0" y="138" width="120" height="34"/><text x="660.0" y="160.0" text-anchor="middle" class="mono">new 50</text><text x="40" y="192" text-anchor="start" class="small">算 50，分配 4 块（125 块复用，ref_cnt++）</text><text x="40" y="226" text-anchor="start" class="bold">3 长 Prompt 的第二个 chunk</text><rect class="seg-c" x="40" y="236" width="340.0" height="34"/><text x="210.0" y="258.0" text-anchor="middle" class="mono">computed 2048</text><rect class="seg-a" x="380.0" y="236" width="340.0" height="34"/><text x="550.0" y="258.0" text-anchor="middle" class="mono">new 2048</text><text x="40" y="290" text-anchor="start" class="small">上轮的 2048 已在块里，本轮再算 2048</text><text x="40" y="324" text-anchor="start" class="bold">4 Decode + 投机解码（K=3）</text><rect class="seg-c" x="40" y="334" width="440.0" height="34"/><text x="260.0" y="356.0" text-anchor="middle" class="mono">computed 2050</text><rect class="seg-a" x="480.0" y="334" width="120" height="34"/><text x="540.0" y="356.0" text-anchor="middle" class="mono">new 1</text><rect class="seg-reserved" x="600.0" y="334" width="120" height="34"/><text x="660.0" y="356.0" text-anchor="middle" class="mono">lookahead 3</text><text x="40" y="388" text-anchor="start" class="small">算 1 个 + 3 个候选，候选要先占 slot</text><text x="40" y="422" text-anchor="start" class="bold">5 PD 分离的 Decode 实例首轮</text><rect class="seg-d" x="40" y="432" width="560.0" height="34"/><text x="320.0" y="454.0" text-anchor="middle" class="mono">external 2049</text><rect class="seg-a" x="600.0" y="432" width="120" height="34"/><text x="660.0" y="454.0" text-anchor="middle" class="mono">new 1</text><text x="40" y="486" text-anchor="start" class="small">KV 由 Prefill 实例传来，最后 1 个 token 自己算</text>
</svg>
