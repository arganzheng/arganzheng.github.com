<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-labelledby="t d">
  <title id="t">current_platform 的多路派发</title>
  <desc id="d">左侧一个 current_platform 节点，五条直线箭头分别指向右侧五个直角框：Attention Backend Selector（get_attn_backend_cls）、Kernel Import（import_kernels）、Device Communicator（get_device_communicator_cls）、Worker / Device Runtime（check_and_update_config 填 worker_cls）、Platform Configuration（pre_register_and_update / check_and_update_config）。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect class="compute" x="40" y="135.0" width="190" height="48"/><text x="135.0" y="164" text-anchor="middle" class="mono">current_platform</text><rect class="seg-c" x="290" y="16" width="450" height="46"/><text x="302" y="35" text-anchor="start" class="bold">Attention Backend Selector</text><text x="302" y="53" text-anchor="start" class="mono">get_attn_backend_cls()</text><line x1="230" y1="159.0" x2="290" y2="39.0" class="arrow"/><rect class="seg-c" x="290" y="76" width="450" height="46"/><text x="302" y="95" text-anchor="start" class="bold">Kernel Import</text><text x="302" y="113" text-anchor="start" class="mono">import_kernels()</text><line x1="230" y1="159.0" x2="290" y2="99.0" class="arrow"/><rect class="seg-c" x="290" y="136" width="450" height="46"/><text x="302" y="155" text-anchor="start" class="bold">Device Communicator</text><text x="302" y="173" text-anchor="start" class="mono">get_device_communicator_cls()</text><line x1="230" y1="159.0" x2="290" y2="159.0" class="arrow"/><rect class="seg-c" x="290" y="196" width="450" height="46"/><text x="302" y="215" text-anchor="start" class="bold">Worker / Device Runtime</text><text x="302" y="233" text-anchor="start" class="mono">check_and_update_config() 填 worker_cls</text><line x1="230" y1="159.0" x2="290" y2="219.0" class="arrow"/><rect class="seg-c" x="290" y="256" width="450" height="46"/><text x="302" y="275" text-anchor="start" class="bold">Platform Configuration</text><text x="302" y="293" text-anchor="start" class="mono">pre_register_and_update() / check_and_update_config()</text><line x1="230" y1="159.0" x2="290" y2="279.0" class="arrow"/>
</svg>
