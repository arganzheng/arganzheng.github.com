  <text x="56" y="46" class="mute" text-anchor="start">（同一帧内的 token 互相看）</text>
  <text x="400" y="26" class="head" text-anchor="start">（b）temporal head：分数集中在等间距的斜线</text>
  <text x="436" y="46" class="mute" text-anchor="start">（跨帧同一空间位置的 token 互相看）</text>
