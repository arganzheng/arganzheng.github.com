  <text x="392" y="354" class="body" text-anchor="start">时间距离 0–1 的块：整块全算</text>
  <text x="392" y="380" class="body" text-anchor="start">时间距离 2–3 的块：只算对角带 |k − l| &lt; s/2</text>
  <text x="392" y="406" class="body" text-anchor="start">时间距离 4–7 的块：只算对角带 |k − l| &lt; s/4</text>
  <text x="392" y="458" class="body" text-anchor="start">时间距离每翻倍，算的比例减半、再减半……</text>
  <text x="392" y="484" class="body" text-anchor="start">每块内部：对角带就是空间窗口，也随距离缩小</text>
  <text x="392" y="536" class="mute" text-anchor="start">k、l：帧内的空间位置；s：一帧的 token 数</text>
</svg>
