<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-labelledby="t d">
  <title id="t">视频 DiT 稠密 attention 的三种结构</title>
  <desc id="d">（a）spatial head：分数集中在对角线上的帧块，同一帧内的 token 互相看；（b）temporal head：分数集中在等间距的斜线，每个帧块里一条对角线，跨帧同一空间位置的 token 互相看；（c）Radial 的能量衰减掩码，8 个 latent 帧：时间距离 0–1 的块全算，2–3 的块只算宽 s/2 的对角带，4–7 的块只算 s/4，时间距离每翻倍算的比例减半，块内空间窗口也随距离缩小。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
    .head { font-size: 15px; font-weight: 700; }
    .body { font-size: 14px; }
    .lab { font-size: 13px; fill: #40566f; }
    .mute { font-size: 13px; fill: #5b6b7c; }
    .grid { fill: none; stroke: #b7c3cf; stroke-width: 1; }
    .outer { fill: none; stroke: #40566f; stroke-width: 1.4; }
    .hot { fill: #e8836f; }
    .slash { fill: none; stroke: #c0392b; stroke-width: 3; stroke-linecap: butt; }
  </style>
  <rect width="760" height="624" fill="#fff"/>
