<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
  <title id="title">vLLM V1 一个 decode step 的跨进程数据流</title>
  <desc id="desc">请求进入 EngineCoreProc，经 Scheduler 调度、WorkerProc 执行，再由 output_rank 回传 token ids，最终输出 SSE。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #182535; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .actor { fill: #eef5ff; stroke: #5880b4; stroke-width: 2; rx: 10; }
      .lifeline { stroke: #aebdce; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="760" height="710" fill="#fff"/>
  <text x="380" y="34" text-anchor="middle" class="heading">一个 decode step：控制流与 token 路径</text>

  <rect x="28" y="56" width="190" height="58" class="actor"/>
  <text x="123" y="81" text-anchor="middle" class="label">API Server</text>
  <text x="123" y="101" text-anchor="middle" class="small">AsyncLLM · 事件循环</text>
  <rect x="285" y="56" width="190" height="58" class="actor"/>
  <text x="380" y="81" text-anchor="middle" class="label">EngineCoreProc</text>
  <text x="380" y="101" text-anchor="middle" class="small">输入 / 主 / 输出线程</text>
  <rect x="542" y="56" width="190" height="58" class="actor"/>
  <text x="637" y="81" text-anchor="middle" class="label">WorkerProc rank r</text>
  <text x="637" y="101" text-anchor="middle" class="small">Worker · GPUModelRunner</text>

  <line x1="123" y1="114" x2="123" y2="667" class="lifeline"/>
  <line x1="380" y1="114" x2="380" y2="667" class="lifeline"/>
  <line x1="637" y1="114" x2="637" y2="667" class="lifeline"/>

  <line x1="123" y1="150" x2="370" y2="150" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="247" y="137" text-anchor="middle" class="label">1 · 请求进入</text>
  <text x="247" y="171" text-anchor="middle" class="small">EngineCoreRequest · ZMQ + msgpack</text>

  <rect x="300" y="191" width="160" height="52" fill="#fff6e9" stroke="#c6873d" rx="8"/>
  <text x="380" y="213" text-anchor="middle" class="label">2 · 调度</text>
  <text x="380" y="232" text-anchor="middle" class="small">Scheduler.schedule()</text>

  <line x1="390" y1="268" x2="627" y2="268" stroke="#2b7a78" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="254" text-anchor="middle" class="label">3 · 广播</text>
  <text x="508" y="289" text-anchor="middle" class="small">SchedulerOutput · MessageQueue</text>

  <rect x="542" y="308" width="190" height="88" fill="#eff9f4" stroke="#4b9477" rx="8"/>
  <text x="637" y="332" text-anchor="middle" class="label">4 · 执行</text>
  <text x="637" y="352" text-anchor="middle" class="small">GPUModelRunner 前向计算</text>
  <text x="637" y="370" text-anchor="middle" class="small">各 rank 间的 TP collective</text>
  <text x="637" y="386" text-anchor="middle" class="small">与 PP 传输由 Worker 执行</text>

  <line x1="627" y1="425" x2="390" y2="425" stroke="#2b7a78" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="412" text-anchor="middle" class="label">5 · output_rank 回传</text>
  <text x="508" y="447" text-anchor="middle" class="small">ModelRunnerOutput · 响应队列</text>

  <rect x="280" y="465" width="200" height="54" fill="#fff6e9" stroke="#c6873d" rx="8"/>
  <text x="380" y="488" text-anchor="middle" class="label">6 · 更新</text>
  <text x="380" y="508" text-anchor="middle" class="small">Scheduler.update_from_output()</text>

  <line x1="370" y1="547" x2="133" y2="547" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="251" y="534" text-anchor="middle" class="label">7 · 输出 socket</text>
  <text x="251" y="569" text-anchor="middle" class="small">EngineCoreOutputs · ZMQ + msgpack</text>

  <rect x="38" y="591" width="170" height="70" fill="#eef5ff" stroke="#5880b4" rx="8"/>
  <text x="123" y="615" text-anchor="middle" class="label">8 · detokenize</text>
  <text x="123" y="635" text-anchor="middle" class="small">OutputProcessor</text>
  <text x="123" y="653" text-anchor="middle" class="small">RequestOutput → SSE</text>

  <text x="380" y="684" text-anchor="middle" class="small">图中只画一个 decode 迭代；prefill 跨同样的进程边界。</text>
</svg>
