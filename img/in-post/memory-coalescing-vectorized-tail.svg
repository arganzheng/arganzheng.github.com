<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-labelledby="t d">
  <title id="t">向量化 kernel 的元素 ↔ 线程映射与尾部</title>
  <desc id="d">BF16，每格 2 B。n = 8·n_vec + tail，例：n = 21 → n_vec = 2，tail = 5。e0–e7 占字节 0–16，是 int4 #0，由线程 i=0 一条 16 B 加载；e8–e15 占字节 16–32，是 int4 #1，由线程 i=1 一条 16 B 加载；e16–e20 占字节 32–42，是不足 16 B 的尾部，由 block 0 的线程 0…4 各标量处理 1 个元素。</desc>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
