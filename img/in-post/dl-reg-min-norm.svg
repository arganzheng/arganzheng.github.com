      <tspan style="font: 6.65px 'DejaVu Sans'" x="59.386895" y="-4.8046875">*</tspan>
      <tspan style="font: 9.5px 'DejaVu Sans'" x="66.131743 75.942534 79.648833 85.693023 90.563628 96.607818" y="-0.9765625">=(1,2)</tspan>
     </text>
    </g>
    <!-- $\|w^*\|=\sqrt{5}\approx2.236$ -->
    <g style="fill: #e0812c" transform="translate(116.387967 107.359094)">
     <text>
      <tspan style="font: 9.5px 'DejaVu Sans'" x="0 19.15599 25.75682 42.436477 51.518996 61.329787 67.373977 69.893752 75.937941 81.982131" y="-0.3362499999999997 -0.3362499999999997 -0.3362499999999997 -0.109375 -0.3362499999999997 -0.3362499999999997 -0.3362499999999997 -0.3362499999999997 -0.3362499999999997 -0.3362499999999997">‖‖=5≈2.236</tspan>
      <tspan style="font: oblique 9.5px 'DejaVu Sans'" x="4.75" y="-0.3362499999999997">w</tspan>
      <tspan style="font: 6.65px 'DejaVu Sans'" x="14.261971" y="-4.164375">*</tspan>
      <tspan style="font: 5.352792px 'STIXSizeOneSym'" x="35.567611" y="-1.6643749999999997">√</tspan>
     </text>
     <rect x="41.248977" y="-9.8125" width="8.419189" height="0.59375"/>
    </g>
   </g>
   <g id="text_20">
    <!-- 另一个插值解 $(5,0)$，范数 $=5$ -->
    <g style="fill: #c94c4c" transform="translate(258.352368 169.358436)">
     <text>
      <tspan style="font: 9.5px 'Heiti TC'" x="0 9.499985 18.999969 28.499954 37.999939 47.499924 56.999908 83.74649 93.246475 102.74646 112.246445" y="-0.828125">另一个插值解 ，范数 </tspan>
