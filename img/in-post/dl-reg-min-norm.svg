     </text>
    </g>
   </g>
   <g id="text_21">
    <text style="font: 11px 'Heiti SC', 'Heiti TC', 'Arial Unicode MS', 'DejaVu Sans'; text-anchor: middle" x="175.569156" y="16.11" transform="rotate(-0 175.569156 16.11)">GD 从小初始化出发，收敛到最小范数解</text>
