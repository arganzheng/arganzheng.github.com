   <g id="text_19">
    <!-- 最小范数解 $w^*=(1,2)$ -->
    <g style="fill: #e0812c" transform="translate(116.387967 93.489094)">
     <text>
      <tspan style="font: 9.5px 'Heiti TC'" x="0 9.499985 18.999969 28.499954 37.999939 47.499924" y="-0.9765625">最小范数解 </tspan>
