<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">三层 tile 嵌套：block、warp、mma</title>
<desc id="d">左：block tile 128×128 按比例画成 2×4 个 warp tile，每个 64 行 × 32 列，warp 0、1 在第一列上下，warp_m = warp % 2，warp_n = warp / 2。右：一个 warp tile 64×32 分成 4×4 个 16 行 × 8 列的 m16n8 mma tile，坐标 (i, j)，每个 4 个 f32 累加器，每线程 64 个。</desc>
