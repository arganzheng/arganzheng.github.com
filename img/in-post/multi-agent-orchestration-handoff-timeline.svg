<svg xmlns="http://www.w3.org/2000/svg" width="760" height="347" viewBox="0 0 760 347" role="img" aria-labelledby="title desc">
<title id="title">客服 handoff 的一次对话</title><desc id="desc">一条时间轴，四行：用户、分流 agent、退款 agent、人工。用户说明问题；分流 agent 判断是退款类，调用 transfer_to_refund，控制权和上下文（全部或摘要）移交给退款 agent；退款 agent 要订单号，用户给出订单号，退款 agent 查订单、校验政策，提交退款，用户收到答复。另一分支：超出政策或金额过阈值时 transfer_to_human，人工接手。同一时刻只有一行在工作。横轴只表示先后，不表示耗时。</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB",sans-serif;font-size:13px;font-weight:600;fill:#111}
.title{font-size:17px;font-weight:700}.ptitle{font-size:15px;font-weight:700}.cap{font-size:13px;fill:#333}
.mono{font-family:"Noto Sans Mono CJK SC",ui-monospace,monospace;font-size:12px}
.box{stroke:#536273;stroke-width:1.2}.dash{stroke:#536273;stroke-width:1.2;stroke-dasharray:5 4}
.line{fill:none;stroke:#536273;stroke-width:1.4}.arrow{fill:none;stroke:#536273;stroke-width:1.4;marker-end:url(#ah)}
.darrow{fill:none;stroke:#536273;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#ah)}
.axis{fill:none;stroke:#888;stroke-width:1.2;marker-end:url(#ax)}.sep{stroke:#d5dbe2;stroke-width:1}</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#536273"/></marker>
<marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#888"/></marker></defs>
<rect width="760" height="347" fill="#fff"/>
<text x="20.0" y="30.0" class="title" text-anchor="start">客服 handoff 的一次对话</text>
<text x="20.0" y="104.5" text-anchor="start">用户</text>
<text x="20.0" y="156.0" text-anchor="start">分流 agent</text>
<text x="20.0" y="173.0" text-anchor="start">（接待）</text>
<text x="20.0" y="244.5" text-anchor="start">退款 agent</text>
<text x="20.0" y="316.5" text-anchor="start">人工</text>
<path d="M112,64 H740" class="axis"/>
<text x="112.0" y="56.0" class="cap" text-anchor="start">时间</text>
<path d="M198.0,115.0 V145.0" class="arrow"/>
<path d="M298.0,175.0 V225.0" class="arrow"/>
<text x="290.0" y="196.0" class="mono" text-anchor="end">③ transfer_to_refund</text>
<text x="290.0" y="214.0" text-anchor="end">控制权 + 上下文（全部 or 摘要）移交</text>
<path d="M384.0,225.0 V115.0" class="arrow"/>
<path d="M470.0,115.0 V225.0" class="arrow"/>
<path d="M690.0,225.0 V115.0" class="arrow"/>
<path d="M604.0,255.0 V297.0" class="darrow"/>
<text x="596.0" y="280.5" text-anchor="end">超出政策 / 金额过阈值 → transfer_to_human</text>
<rect x="112.0" y="85.0" width="86" height="30" fill="#eceff3" class="box"/><text x="119.0" y="104.5">① 说明问题</text>
<rect x="198.0" y="145.0" width="100" height="30" fill="#fff0d6" class="box"/><text x="205.0" y="164.5">② 判断：退款</text>
<rect x="298.0" y="225.0" width="86" height="30" fill="#e4edfa" class="box"/><text x="305.0" y="244.5">④ 要订单号</text>
<rect x="384.0" y="85.0" width="86" height="30" fill="#eceff3" class="box"/><text x="391.0" y="104.5">⑤ 给订单号</text>
<rect x="470.0" y="225.0" width="134" height="30" fill="#e4edfa" class="box"/><text x="477.0" y="244.5">⑥ 查单 · 校验政策</text>
<rect x="604.0" y="225.0" width="86" height="30" fill="#e4edfa" class="box"/><text x="611.0" y="244.5">⑦ 提交退款</text>
<rect x="690.0" y="85.0" width="42" height="30" fill="#eceff3" class="box"/><text x="697.0" y="104.5">收到</text>
<rect x="604.0" y="297.0" width="72" height="30" fill="#f5f5f5" class="dash"/><text x="611.0" y="316.5">⑧ 转人工</text>
</svg>
