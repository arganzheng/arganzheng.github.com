<rect x="434.0" y="134.0" width="38.0" height="28.0" fill="#dde9f7" stroke="#111" stroke-width="1"/>
<text x="453.0" y="152.3" font-size="12" text-anchor="middle" fill="#111" font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">mma</text>
<rect x="472.0" y="134.0" width="38.0" height="28.0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="491.0" y="152.3" font-size="12" text-anchor="middle" fill="#111" font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">ldm</text>
<rect x="510.0" y="134.0" width="38.0" height="28.0" fill="#fff" stroke="#111" stroke-width="1"/>
