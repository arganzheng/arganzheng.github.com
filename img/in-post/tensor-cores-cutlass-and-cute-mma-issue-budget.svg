<svg xmlns="http://www.w3.org/2000/svg" width="760" height="212" viewBox="0 0 760 212" role="img" aria-labelledby="t d">
<title id="t">一个 warp 调度器的 mma 发射预算</title>
<desc id="d">时间轴 0 到 15 周期。Tensor Core 一行：mma #0（2048 FMA）占周期 0–7，mma #1 占周期 8–15。发射槽一行每周期一格：mma、ldm、ldm、addr、sync、loop、ldm、空、mma、ldm、ldm、addr、……。周期 1–7 这 7 个槽要装下下一条 mma 需要的全部准备工作。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-weight:600}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="760" height="212" fill="#fff"/>
<text x="20.0" y="22.0" font-size="14" text-anchor="start" fill="#111">一个 warp 调度器的指令预算</text>
<text x="20.0" y="42.0" font-size="13" text-anchor="start" fill="#111">（每周期最多发 1 条指令；它的 Tensor Core 每 8 周期吃 1 条 mma）</text>
<text x="20.0" y="76.0" font-size="13" text-anchor="start" fill="#111">周期</text>
