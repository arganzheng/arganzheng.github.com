<text x="263.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">3</text>
<text x="301.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">4</text>
<text x="339.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">5</text>
<text x="377.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">6</text>
<text x="415.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">7</text>
<text x="453.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">8</text>
<text x="491.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">9</text>
<text x="529.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">10</text>
<text x="567.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">11</text>
