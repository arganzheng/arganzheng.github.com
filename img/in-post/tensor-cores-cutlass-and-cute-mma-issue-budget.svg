<rect x="548.0" y="134.0" width="38.0" height="28.0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="567.0" y="152.3" font-size="12" text-anchor="middle" fill="#111" font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">addr</text>
<text x="605.0" y="152.0" font-size="13" text-anchor="middle" fill="#111">…</text>
<line x1="168.0" y1="172.0" x2="434.0" y2="172.0" stroke="#111" stroke-width="1.2"/>
<line x1="168.0" y1="166.0" x2="168.0" y2="172.0" stroke="#111" stroke-width="1.2"/>
<line x1="434.0" y1="166.0" x2="434.0" y2="172.0" stroke="#111" stroke-width="1.2"/>
<text x="301.0" y="192.0" font-size="13" text-anchor="middle" fill="#111">这 7 个槽要装下下一条 mma 需要的全部准备工作</text>
