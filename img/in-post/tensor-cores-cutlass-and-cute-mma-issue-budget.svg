<text x="681.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">14</text>
<text x="719.0" y="76.0" font-size="12" text-anchor="middle" fill="#111">15</text>
<text x="20.0" y="106.0" font-size="13" text-anchor="start" fill="#111">Tensor Core</text>
<rect x="131.0" y="88.0" width="302.0" height="30.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="282.0" y="107.7" font-size="13" text-anchor="middle" fill="#111">mma #0（2048 FMA）</text>
