<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="760" height="440" fill="#ffffff"/>
  <!-- plot area: x 70..730 (log10 AI: -2..4, 110 px/decade), y 30..370 (log10 TFLOPS: -1..3, 85 px/decade) -->
  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="70" y1="370" x2="730" y2="370"/>
    <line x1="70" y1="285" x2="730" y2="285"/>
    <line x1="70" y1="200" x2="730" y2="200"/>
    <line x1="70" y1="115" x2="730" y2="115"/>
    <line x1="70" y1="30" x2="730" y2="30"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
    <line x1="180" y1="30" x2="180" y2="370"/>
    <line x1="290" y1="30" x2="290" y2="370"/>
    <line x1="400" y1="30" x2="400" y2="370"/>
    <line x1="510" y1="30" x2="510" y2="370"/>
    <line x1="620" y1="30" x2="620" y2="370"/>
    <line x1="730" y1="30" x2="730" y2="370"/>
  </g>
  <!-- axes -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="70" y1="370" x2="730" y2="370"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
  </g>
  <!-- x ticks -->
  <g fill="#333" text-anchor="middle">
    <text x="70" y="388">0.01</text>
    <text x="180" y="388">0.1</text>
    <text x="290" y="388">1</text>
    <text x="400" y="388">10</text>
    <text x="510" y="388">100</text>
    <text x="620" y="388">1000</text>
    <text x="730" y="388">10000</text>
    <text x="400" y="412" font-size="13">Arithmetic Intensity（FLOP/Byte，对显存）</text>
  </g>
  <!-- y ticks -->
  <g fill="#333" text-anchor="end">
    <text x="62" y="374">0.1</text>
    <text x="62" y="289">1</text>
    <text x="62" y="204">10</text>
    <text x="62" y="119">100</text>
    <text x="62" y="34">1000</text>
  </g>
  <text x="18" y="200" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 18 200)">可达算力（TFLOPS）</text>

  <!-- region shading -->
  <rect x="70" y="30" width="328.8" height="340" fill="#fdf2f0" opacity="0.6"/>
  <text x="120" y="52" fill="#c0392b" font-size="12">memory-bound：可达算力 = AI × 带宽</text>
  <text x="600" y="120" fill="#1e8449" font-size="12" text-anchor="middle">compute-bound：可达算力 = 峰值</text>

  <!-- bandwidth roof: P = 2.0 TB/s * AI, from (0.05, 0.1) to bf16 ridge (156, 312) -->
  <line x1="146.9" y1="370" x2="531.2" y2="73.0" stroke="#c0392b" stroke-width="2.5"/>
  <!-- FP32 roof 19.5 TFLOPS from ridge 9.75 -->
  <line x1="398.8" y1="175.3" x2="730" y2="175.3" stroke="#1e8449" stroke-width="2.5"/>
  <!-- BF16 Tensor Core roof 312 TFLOPS from ridge 156 -->
  <line x1="531.2" y1="73.0" x2="730" y2="73.0" stroke="#1e8449" stroke-width="2.5"/>
  <!-- ridge markers -->
  <line x1="398.8" y1="175.3" x2="398.8" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="531.2" y1="73.0" x2="531.2" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="403" y="362" fill="#555" font-size="11">ridge ≈ 10</text>
  <text x="535" y="362" fill="#555" font-size="11">ridge ≈ 156</text>
  <text x="207" y="341" fill="#c0392b" font-size="12" transform="rotate(-37.7 207 341)">HBM 2.0 TB/s</text>
  <text x="725" y="168" fill="#1e8449" font-size="12" text-anchor="end">FP32 CUDA Core 19.5 TFLOPS</text>
  <text x="725" y="66" fill="#1e8449" font-size="12" text-anchor="end">BF16 Tensor Core 312 TFLOPS</text>

  <!-- points -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="169.3" cy="352.6" r="6" fill="#c0392b"/>
    <circle cx="188.7" cy="337.7" r="6" fill="#c0392b"/>
    <circle cx="290" cy="259.4" r="6" fill="#c0392b"/>
    <circle cx="395" cy="178.3" r="6" fill="#b9770e"/>
    <circle cx="635" cy="73.0" r="6" fill="#1e8449"/>
  </g>
  <!-- point labels -->
  <g fill="#333" font-size="11">
    <text x="100" y="335" text-anchor="start">add  AI≈0.08</text>
    <text x="196" y="357">relu  AI≈0.12</text>
    <text x="300" y="263">softmax / layer_norm  AI≈1</text>
    <text x="386" y="214" text-anchor="end">小 mm [128,32]×[32,64]  AI≈9</text>
    <text x="386" y="228" text-anchor="end" fill="#b9770e">规模太小，实际受 launch 限制</text>
    <text x="635" y="96" text-anchor="middle">mm 4096³ bf16  AI≈1370</text>
  </g>
  <line x1="150" y1="337" x2="166" y2="349" stroke="#999" stroke-width="1"/>
</svg>
