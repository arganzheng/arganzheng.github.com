<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 413" width="760" height="413" role="img" aria-labelledby="t d">
  <title id="t">tl.arange(0, 1024) 到 128 个线程的两种分法</title>
  <desc id="d">tl.arange(0, 1024)，num_warps = 4，128 个线程每人 8 个元素。① 连续（编译器为 load/store 选的）：线程 i 拿 [8i, 8i+8)，t0 拿 0–7，t1 拿 8–15，t2 拿 16–23 … t127 拿 1016–1023；每线程 8 × 2 B = 16 B 连续，一条 128 bit load；warp 0 覆盖 [0, 512 B) 连续，完全合并。TTGIR 里写成 #blocked&lt;{sizePerThread=[8], threadsPerWarp=[32], warpsPerCTA=[4], order=[0]}&gt;。② 跨步：线程 i 拿 i, i+128, i+256, …，元素 0、1、2 … 127 依次属于 t0 … t127，128 又回到 t0；每线程每次只能 load 2 B，warp 一次访问 32 × 2 B = 64 B 连续，8 次才凑够 512 B。</desc>
