<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" role="img" aria-labelledby="t d">
  <title id="t">一个 cache block 内 K/V 的存放方式（BF16，head_size = 128，block_size = 16，x = 8）</title>
  <desc id="d">K[t, h, d] 落在 key_cache[blk][h][d/8][t][d%8]，每格 8 个 BF16 共 16 B：head_size 切成 16 段，每段内 16 个 token 相邻，一段 256 B 连续，读端一个 warp 读一段；写入一个 token 是 16 段各写 16 B，段间 stride 256 B。V[t, h, d] 落在 value_cache[blk][h][d][t]，每格 1 个 BF16 共 2 B：同一 d 的 16 个 token 一行 32 B 连续，读端沿 token 维点积、合并读取；写入一个 token 是 128 个元素各写 2 B，stride 32 B，分散写，但每 token 只有 4 KiB。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .mutedmono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5b6b7c; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { stroke: #6f8399; stroke-width: 1.2; }
      .thin { stroke: #6f8399; stroke-width: 0.8; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .c-s { fill: #f9d5d3; } .c-e { fill: #fde0b8; } .c-m { fill: #cfe2f3; } .c-i { fill: #cfeccf; }
      .c-w { fill: #ffffff; } .c-g { fill: #eef1f4; } .c-pad { fill: #e3e7eb; }
      .b0 { fill: #cfe2f3; } .b1 { fill: #fde0b8; } .b2 { fill: #cfeccf; } .b3 { fill: #e6d7f2; } .b4 { fill: #f9d5d3; }
    </style>
  </defs>
<rect x="0" y="0" width="760" height="546" fill="#ffffff"/>
<text x="24.0" y="22.0" class="mono">K[t, h, d] 落在 key_cache[blk][h][d / 8][t][d % 8]</text>
<text x="438.8" y="22.0" class="small">每格 = 8 个 BF16 = 16 B</text>
<text x="24.0" y="50.0" class="bold">K cache（一个 blk、一个 h）：</text>
