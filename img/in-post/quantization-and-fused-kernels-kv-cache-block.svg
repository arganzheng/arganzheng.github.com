<text x="24.0" y="312.0" class="mono">V[t, h, d] 落在 value_cache[blk][h][d][t]</text>
<text x="366.2" y="312.0" class="small">每格 = 1 个 BF16 = 2 B</text>
<text x="24.0" y="340.0" class="bold">V cache（一个 blk、一个 h）：</text>
<text x="245.6" y="340.0" class="mono">[head_size = 128][block_size = 16]</text>
<text x="96.0" y="372.0" text-anchor="end" class="small">token</text>
