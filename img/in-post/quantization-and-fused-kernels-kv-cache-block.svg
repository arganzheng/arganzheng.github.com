<path d="M114,214 L114,220 L202,220 L202,214" class="line"/>
<text x="110.0" y="242.0" class="small">一段 256 B 连续：16 个 token 的同一 8 维相邻，读端一个 warp 读一段</text>
<text x="110.0" y="264.0" class="small">写入 token t：16 段各写 16 B，段间 stride 256 B（16 次 16 B 向量写）</text>
