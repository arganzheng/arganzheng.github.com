<svg xmlns="http://www.w3.org/2000/svg" width="760" height="218" viewBox="0 0 760 218" role="img" aria-labelledby="sp-t sp-d">
<title id="sp-t">训练与推理的消息大小放到一条对数轴上</title>
<desc id="sp-d">对数轴 64 KB 到 14 GB：decode TP all_reduce 在 128–512 KB，DDP bucket 25 MiB，TP/PP 激活 32 MB，FSDP 一层 400 MB，KV cache 1.3 GB，全部梯度 14 GB；下方按 8 卡 IB ring 的延迟占比分成延迟主导、拐点区、带宽主导三段。</desc>
<style>
text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #111; font-weight: 500; }
.s { font-size: 12px; }
.b { font-weight: 700; }
.mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
.red { fill: #c0392b; }
.gray { fill: #444; }
.box { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.2; }
.ok { fill: #d4edda; stroke: #2e7d32; stroke-width: 1.4; }
.plain { fill: #fff; stroke: #555; stroke-width: 1; }
.arr { stroke: #333; stroke-width: 1.4; fill: none; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#333"/></marker></defs>
<rect width="760" height="218" fill="#ffffff"/>
<rect x="88.1" y="98.0" width="76.1" height="10.0" rx="0" class="" style="fill:#1f5fa8"/>
<text x="84.1" y="60.0" text-anchor="start">decode TP all_reduce</text>
<text x="84.1" y="77.0" text-anchor="start">（batch 8 ~ 32）</text>
<line x1="88.1" y1="82.0" x2="88.1" y2="98.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<line x1="379.1" y1="112.0" x2="379.1" y2="82.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<circle cx="379.1" cy="112.0" r="3.5" fill="#1f5fa8"/>
<text x="383.1" y="76.0" text-anchor="end">DDP bucket</text>
<line x1="392.6" y1="112.0" x2="392.6" y2="46.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<circle cx="392.6" cy="112.0" r="3.5" fill="#1f5fa8"/>
<text x="388.6" y="23.0" text-anchor="start">TP/PP 激活</text>
<text x="388.6" y="40.0" text-anchor="start">（prefill/训练）</text>
<line x1="528.7" y1="112.0" x2="528.7" y2="82.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<circle cx="528.7" cy="112.0" r="3.5" fill="#1f5fa8"/>
<text x="528.7" y="76.0" text-anchor="middle">FSDP 一层</text>
<line x1="592.6" y1="112.0" x2="592.6" y2="46.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<circle cx="592.6" cy="112.0" r="3.5" fill="#1f5fa8"/>
<text x="592.6" y="23.0" text-anchor="middle">KV cache</text>
<text x="592.6" y="40.0" text-anchor="middle">（P2P）</text>
<line x1="724.0" y1="112.0" x2="724.0" y2="82.0" class="arr" style="stroke:#1f5fa8;stroke-width:1.4"/>
<circle cx="724.0" cy="112.0" r="3.5" fill="#1f5fa8"/>
<text x="728.0" y="59.0" text-anchor="end">全部梯度</text>
<text x="728.0" y="76.0" text-anchor="end">（分桶发）</text>
<line x1="40.0" y1="112.0" x2="738.0" y2="112.0" class="arr" marker-end="url(#ah)" style="stroke:#333;stroke-width:1.2"/>
<line x1="50.0" y1="112.0" x2="50.0" y2="117.0" class="arr" style="stroke:#333"/>
<text x="50.0" y="130.0" text-anchor="middle" class="s">64 KB</text>
<line x1="88.1" y1="112.0" x2="88.1" y2="117.0" class="arr" style="stroke:#333"/>
<text x="88.1" y="146.0" text-anchor="middle" class="s">128 KB</text>
<line x1="164.2" y1="112.0" x2="164.2" y2="117.0" class="arr" style="stroke:#333"/>
<text x="164.2" y="130.0" text-anchor="middle" class="s">512 KB</text>
<line x1="240.3" y1="112.0" x2="240.3" y2="117.0" class="arr" style="stroke:#333"/>
<text x="240.3" y="146.0" text-anchor="middle" class="s">2 MB</text>
<line x1="379.1" y1="112.0" x2="379.1" y2="117.0" class="arr" style="stroke:#333"/>
<text x="379.1" y="130.0" text-anchor="middle" class="s">25 MiB</text>
<line x1="392.6" y1="112.0" x2="392.6" y2="117.0" class="arr" style="stroke:#333"/>
<text x="392.6" y="146.0" text-anchor="middle" class="s">32 MB</text>
<line x1="528.7" y1="112.0" x2="528.7" y2="117.0" class="arr" style="stroke:#333"/>
<text x="528.7" y="130.0" text-anchor="middle" class="s">400 MB</text>
<line x1="593.5" y1="112.0" x2="593.5" y2="117.0" class="arr" style="stroke:#333"/>
<text x="593.5" y="146.0" text-anchor="middle" class="s">1.3 GB</text>
<line x1="724.0" y1="112.0" x2="724.0" y2="117.0" class="arr" style="stroke:#333"/>
<text x="724.0" y="130.0" text-anchor="middle" class="s">14 GB</text>
<rect x="50.0" y="166.0" width="114.2" height="26.0" rx="0" class="" style="fill:#fbe3e0;stroke:#888;stroke-width:1"/>
<text x="107.1" y="184.0" text-anchor="middle">延迟主导</text>
<rect x="164.2" y="166.0" width="152.3" height="26.0" rx="0" class="" style="fill:#fff3cd;stroke:#888;stroke-width:1"/>
<text x="240.3" y="184.0" text-anchor="middle">拐点区</text>
<rect x="316.5" y="166.0" width="407.5" height="26.0" rx="0" class="" style="fill:#dcefe0;stroke:#888;stroke-width:1"/>
<text x="520.2" y="184.0" text-anchor="middle">带宽主导</text>
<line x1="237.7" y1="166.0" x2="237.7" y2="192.0" class="arr" style="stroke:#c0392b;stroke-width:1.6"/>
<text x="237.7" y="208.0" text-anchor="middle" class="s red">8 卡 IB ring 拐点 S* ≈ 2 MB</text>
</svg>
