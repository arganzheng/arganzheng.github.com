<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 467" width="760" height="467" role="img" aria-labelledby="t d">
  <title id="t">容错的四个环节：故障、检测、重启、加载</title>
  <desc id="d">竖向时间轴：训练在跑 → ① 故障发生 → ② 检测 T_d → ③ 重启 T_r → ④ 加载 T_l → ⑤ 回退 τ/2 → 训练重新在跑。检测分显式（进程退出、XID、NCCL 报错，秒级）、隐式（hang / 变慢，靠 watchdog 超时默认 10 分钟、心跳、step 时间告警）、静默（算错不报错，靠冗余计算 / 重跑比对）；重启分进程重启（torchrun agent 杀掉全部 worker → rendezvous → 重新拉起 → CUDA init → NCCL comm init，分钟级）、进程内重启（NVRx inprocess 只 abort 通信、在原进程里重新进入训练函数，秒级）、弹性（torchft 副本组各自独立，坏组退出 quorum，其余组继续，无重启）；加载：从最近 checkpoint 加载（本地 NVMe 优先），重分片允许卡数变化；回退：上一个 checkpoint 到故障点之间的训练重做一遍。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .mark { fill: #40566f; }
    </style>
  </defs>
<text x="92" y="25" text-anchor="middle" class="bold">训练在跑</text>
<line x1="136" y1="20" x2="700" y2="20" class="axis"/>
<text x="710" y="25" text-anchor="start" class="small">时间</text>
<path d="M92 32 V54" class="arrow"/>
<rect class="card" x="17.0" y="54" width="150" height="40"/>
<text x="92" y="79.0" text-anchor="middle" class="bold">① 故障发生</text>
<text x="183" y="79.0" text-anchor="start" class="small">某张卡坏 / 某进程崩 / 某 rank hang / 某卡变慢 / 某卡算错</text>
<path d="M92 94 V116" class="arrow"/>
<rect class="card" x="17.0" y="116" width="150" height="67"/>
<text x="92" y="154.5" text-anchor="middle" class="bold">② 检测 T_d</text>
<text x="183" y="135.5" text-anchor="start" class="small">显式：进程退出、XID、NCCL 报错</text>
<text x="668" y="135.5" text-anchor="start" class="bold">→ 秒级</text>
<text x="183" y="154.5" text-anchor="start" class="small">隐式：hang / 变慢 → 靠 watchdog 超时（默认 10 分钟）、心跳、step 时间告警</text>
<text x="183" y="173.5" text-anchor="start" class="small">静默：算错不报错 → 靠冗余计算 / 重跑比对（第九章）</text>
<path d="M92 183 V205" class="arrow"/>
<rect class="card" x="17.0" y="205" width="150" height="86"/>
<text x="92" y="253.0" text-anchor="middle" class="bold">③ 重启 T_r</text>
<text x="183" y="224.5" text-anchor="start" class="small">进程重启：torchrun agent 杀掉全部 worker → rendezvous → 重新拉起</text>
<text x="223" y="243.5" text-anchor="start" class="small">→ CUDA init → NCCL comm init</text>
<text x="668" y="243.5" text-anchor="start" class="bold">→ 分钟级</text>
<text x="183" y="262.5" text-anchor="start" class="small">进程内重启：NVRx inprocess 只 abort 通信、在原进程里重新进入训练函数</text>
<text x="668" y="262.5" text-anchor="start" class="bold">→ 秒级</text>
<text x="183" y="281.5" text-anchor="start" class="small">弹性：torchft 的副本组各自独立，坏组退出 quorum，其余组继续</text>
<text x="668" y="281.5" text-anchor="start" class="bold">→ 无重启</text>
<path d="M92 291 V313" class="arrow"/>
<rect class="card" x="17.0" y="313" width="150" height="40"/>
<text x="92" y="338.0" text-anchor="middle" class="bold">④ 加载 T_l</text>
<text x="183" y="338.0" text-anchor="start" class="small">从最近 checkpoint 加载（本地 NVMe 优先，第八篇）；重分片允许卡数变化</text>
<path d="M92 353 V375" class="arrow"/>
<rect class="card" x="17.0" y="375" width="150" height="40"/>
<text x="92" y="400.0" text-anchor="middle" class="bold">⑤ 回退 τ/2</text>
<text x="183" y="400.0" text-anchor="start" class="small">上一个 checkpoint 到故障点之间的训练重做一遍</text>
<path d="M92 415 V437" class="arrow"/>
<text x="92" y="455" text-anchor="middle" class="bold">训练重新在跑</text>
</svg>
