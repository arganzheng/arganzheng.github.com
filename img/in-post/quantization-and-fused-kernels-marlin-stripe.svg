<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d">
  <title id="t">3×3 tile、5 个 block 的 stripe 分配</title>
  <desc id="d">B 矩阵切成 3 个列 slice × 3 个 K 块共 9 个 tile，5 个 block 按列优先各领一条 stripe。slice 0 的 K 块 0、1 归 block 0，K 块 2 归 block 1；slice 1 的 K 块 0 归 block 1，K 块 1、2 归 block 2；slice 2 的 K 块 0、1 归 block 3，K 块 2 归 block 4。每个 slice 的部分和落在两个 block 里，用 locks[slice] 做 global reduce。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .mutedmono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5b6b7c; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { stroke: #6f8399; stroke-width: 1.2; }
      .thin { stroke: #6f8399; stroke-width: 0.8; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .c-s { fill: #f9d5d3; } .c-e { fill: #fde0b8; } .c-m { fill: #cfe2f3; } .c-i { fill: #cfeccf; }
      .c-w { fill: #ffffff; } .c-g { fill: #eef1f4; } .c-pad { fill: #e3e7eb; }
      .b0 { fill: #cfe2f3; } .b1 { fill: #fde0b8; } .b2 { fill: #cfeccf; } .b3 { fill: #e6d7f2; } .b4 { fill: #f9d5d3; }
    </style>
  </defs>
<rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
<text x="24.0" y="22.0" class="muted">B 矩阵切成 3 个列 slice × 3 个 K 块 = 9 个 tile，5 个 block 按列优先各领一条</text>
<text x="24.0" y="42.0" class="muted">stripe（9 / 5 → 前 4 个 block 各 2 个 tile，最后一个 1 个）</text>
<text x="245.0" y="80.0" text-anchor="middle" class="bold">slice 0</text>
<text x="395.0" y="80.0" text-anchor="middle" class="bold">slice 1</text>
<text x="545.0" y="80.0" text-anchor="middle" class="bold">slice 2</text>
<text x="154.0" y="121.0" text-anchor="end" class="body">K 块 0</text>
<rect x="170.0" y="92.0" width="150.0" height="46.0" class="b0 cell"/>
<text x="245.0" y="121.0" text-anchor="middle" class="monob">block 0</text>
<rect x="320.0" y="92.0" width="150.0" height="46.0" class="b1 cell"/>
<text x="395.0" y="121.0" text-anchor="middle" class="monob">block 1</text>
<rect x="470.0" y="92.0" width="150.0" height="46.0" class="b3 cell"/>
<text x="545.0" y="121.0" text-anchor="middle" class="monob">block 3</text>
<text x="154.0" y="167.0" text-anchor="end" class="body">K 块 1</text>
<rect x="170.0" y="138.0" width="150.0" height="46.0" class="b0 cell"/>
<text x="245.0" y="167.0" text-anchor="middle" class="monob">block 0</text>
<rect x="320.0" y="138.0" width="150.0" height="46.0" class="b2 cell"/>
<text x="395.0" y="167.0" text-anchor="middle" class="monob">block 2</text>
<rect x="470.0" y="138.0" width="150.0" height="46.0" class="b3 cell"/>
<text x="545.0" y="167.0" text-anchor="middle" class="monob">block 3</text>
<text x="154.0" y="213.0" text-anchor="end" class="body">K 块 2</text>
<rect x="170.0" y="184.0" width="150.0" height="46.0" class="b1 cell"/>
<text x="245.0" y="213.0" text-anchor="middle" class="monob">block 1</text>
<rect x="320.0" y="184.0" width="150.0" height="46.0" class="b2 cell"/>
<text x="395.0" y="213.0" text-anchor="middle" class="monob">block 2</text>
<rect x="470.0" y="184.0" width="150.0" height="46.0" class="b4 cell"/>
<text x="545.0" y="213.0" text-anchor="middle" class="monob">block 4</text>
<rect x="170.0" y="92.0" width="450.0" height="138.0" class="line"/>
<path d="M178,242 L178,249 L312,249 L312,242" class="line"/>
<text x="245.0" y="270.0" text-anchor="middle" class="mono">block 0 + block 1</text>
<path d="M328,242 L328,249 L462,249 L462,242" class="line"/>
<text x="395.0" y="270.0" text-anchor="middle" class="mono">block 1 + block 2</text>
<path d="M478,242 L478,249 L612,249 L612,242" class="line"/>
<text x="545.0" y="270.0" text-anchor="middle" class="mono">block 3 + block 4</text>
<text x="154.0" y="270.0" text-anchor="end" class="small">locks[slice] 归约</text>
</svg>
