<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-labelledby="t d">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}]]></style>
 <title id="t">容量因子 1.25 下四个专家的填充与丢弃</title>
 <desc id="d">T = 4096、k = 8、E = 256 时每专家平均 128 行，容量因子 1.25 给每个专家 160 行的固定缓冲区。专家 0 收到 200 行，超出容量的 40 行被丢弃；专家 1 收到 160 行恰好填满；专家 2 收到 128 行，补 32 行零填充；专家 3 收到 80 行，补 80 行零填充。</desc>
 <defs>
  <style>
  text { font-family:'SvgSans', Noto Sans SC, sans-serif; fill: #111827; font-size: 13px; font-weight: 400; }
  .head { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #4b5563; }
  .ax { font-size: 12px; fill: #4b5563; }
  .grid { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
  .w { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.2; }
  .real { fill: #bbf7d0; stroke: #15803d; stroke-width: 1.2; }
  .pad { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .drop { fill: #fecaca; stroke: #b91c1c; stroke-width: 1.2; }
  .disp { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.2; }
  .gemm { fill: #bbf7d0; stroke: #15803d; stroke-width: 1.2; }
  .comb { fill: #fed7aa; stroke: #c2410c; stroke-width: 1.2; }
  .always { fill: #fde68a; stroke: #92400e; stroke-width: 1.2; }
  .ref { fill: #e5e7eb; stroke: #4b5563; stroke-width: 1.2; }
  .axis { stroke: #4b5563; stroke-width: 1.2; }
  .avg { stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .cap { stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 6 3; }
  .sep { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
 </defs>
 <rect width="760" height="278" fill="#ffffff" data-no-center="1" />
 <text class="ax" x="402.4" y="30" text-anchor="end">平均 128 行</text>
 <text class="ax" x="472.0" y="30" text-anchor="start">容量 160 行</text>
 <text x="166" y="76" text-anchor="end">专家 0：收到 200 行</text>
 <rect class="real" x="178" y="58" width="288.0" height="28" />
 <rect class="drop" x="466.0" y="58" width="72.0" height="28" />
 <text class="sub" x="552.0" y="76" text-anchor="start">丢弃 40 行（20%）</text>
 <text x="166" y="120" text-anchor="end">专家 1：收到 160 行</text>
 <rect class="real" x="178" y="102" width="288.0" height="28" />
 <text class="sub" x="552.0" y="120" text-anchor="start">恰好填满</text>
 <text x="166" y="164" text-anchor="end">专家 2：收到 128 行</text>
 <rect class="real" x="178" y="146" width="230.4" height="28" />
 <rect class="pad" x="408.4" y="146" width="57.6" height="28" />
 <text class="sub" x="552.0" y="164" text-anchor="start">填充 32 行</text>
 <text x="166" y="208" text-anchor="end">专家 3：收到 80 行</text>
 <rect class="real" x="178" y="190" width="144.0" height="28" />
 <rect class="pad" x="322.0" y="190" width="144.0" height="28" />
 <text class="sub" x="552.0" y="208" text-anchor="start">填充 80 行，一半空算</text>
 <line class="avg" x1="408.4" y1="38" x2="408.4" y2="234" />
 <line class="cap" x1="466.0" y1="38" x2="466.0" y2="234" />
 <rect class="real" x="178" y="245" width="18" height="13" />
 <text class="sub" x="203" y="256" text-anchor="start">实际 token</text>
 <rect class="pad" x="288" y="245" width="18" height="13" />
 <text class="sub" x="313" y="256" text-anchor="start">零填充（padding）</text>
 <rect class="drop" x="448" y="245" width="18" height="13" />
 <text class="sub" x="473" y="256" text-anchor="start">超出容量，被丢弃（drop）</text>
</svg>