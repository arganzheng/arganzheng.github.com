<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
  <title id="title">一个 LLM 请求要经历的步骤</title>
  <desc id="desc">请求进入后经过 Prefill、首个 Token 和多个 Decode Step，直到 EOS 或长度上限。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#62758a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 22px; font-weight: 700; }
      .step { font-size: 17px; font-weight: 600; }
      .box { fill: #f4f8fc; stroke: #8ba4bd; stroke-width: 1.6; rx: 12; }
      .arrow { stroke: #62758a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="760" height="690" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" class="title">一个 LLM 请求要经历的步骤</text>
  <rect x="170" y="66" width="420" height="54" class="box"/>
  <text x="380" y="100" text-anchor="middle" class="step">请求进入</text>
  <line x1="380" y1="120" x2="380" y2="146" class="arrow"/>
  <rect x="170" y="150" width="420" height="54" class="box"/>
  <text x="380" y="184" text-anchor="middle" class="step">Prompt Processing / Prefill</text>
  <line x1="380" y1="204" x2="380" y2="230" class="arrow"/>
  <rect x="170" y="234" width="420" height="54" class="box"/>
  <text x="380" y="268" text-anchor="middle" class="step">生成第一个 Token</text>
  <line x1="380" y1="288" x2="380" y2="314" class="arrow"/>
  <rect x="170" y="318" width="420" height="54" class="box"/>
  <text x="380" y="352" text-anchor="middle" class="step">Decode Step 1</text>
  <line x1="380" y1="372" x2="380" y2="398" class="arrow"/>
  <rect x="170" y="402" width="420" height="54" class="box"/>
  <text x="380" y="436" text-anchor="middle" class="step">Decode Step 2</text>
  <line x1="380" y1="456" x2="380" y2="482" class="arrow"/>
  <rect x="170" y="486" width="420" height="54" class="box"/>
  <text x="380" y="520" text-anchor="middle" class="step">Decode Step ...</text>
  <line x1="380" y1="540" x2="380" y2="566" class="arrow"/>
  <rect x="170" y="570" width="420" height="54" class="box"/>
  <text x="380" y="604" text-anchor="middle" class="step">EOS 或达到长度上限</text>
</svg>
