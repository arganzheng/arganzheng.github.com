<svg xmlns="http://www.w3.org/2000/svg" width="760" height="786.0" viewBox="0 0 760 786.0" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css">@font-face{font-family:'SvgSans';font-weight:500;src:url(data:font/woff2;base64,)}</style>
  <title id="title">一个 LLM 请求要经历的步骤</title>
  <desc id="desc">请求进入后经过 Prefill、首个 Token 和多个 Decode Step，直到 EOS 或长度上限。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#62758a" />
    </marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 22px; font-weight: 500; }
      .step { font-size: 17px; font-weight: 500; }
      .box { fill: #f4f8fc; stroke: #8ba4bd; stroke-width: 1.6; rx: 12; }
      .arrow { stroke: #62758a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="760" height="786.0" fill="#fff" />
  <text x="380" y="38" text-anchor="middle" class="title" transform="translate(0.000 0.000) ">一个 LLM 请求要经历的步骤</text>
  <rect x="170" y="66.0" width="420" height="54" class="box" />
  <text x="380" y="100.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">请求进入</text>
  <line x1="380" y1="120.0" x2="380" y2="162.0" class="arrow" />
  <rect x="170" y="166.0" width="420" height="54" class="box" />
  <text x="380" y="200.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">Prompt Processing / Prefill</text>
  <line x1="380" y1="220.0" x2="380" y2="262.0" class="arrow" />
  <rect x="170" y="266.0" width="420" height="54" class="box" />
  <text x="380" y="300.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">生成第一个 Token</text>
  <line x1="380" y1="320.0" x2="380" y2="362.0" class="arrow" />
  <rect x="170" y="366.0" width="420" height="54" class="box" />
  <text x="380" y="400.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">Decode Step 1</text>
  <line x1="380" y1="420.0" x2="380" y2="462.0" class="arrow" />
  <rect x="170" y="466.0" width="420" height="54" class="box" />
  <text x="380" y="500.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">Decode Step 2</text>
  <line x1="380" y1="520.0" x2="380" y2="562.0" class="arrow" />
  <rect x="170" y="566.0" width="420" height="54" class="box" />
  <text x="380" y="600.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">Decode Step ...</text>
  <line x1="380" y1="620.0" x2="380" y2="662.0" class="arrow" />
  <rect x="170" y="666.0" width="420" height="54" class="box" />
  <text x="380" y="700.0" text-anchor="middle" class="step" transform="translate(0.000 0.500) ">EOS 或达到长度上限</text>
<rect x="239.640625" y="8" width="280.71875" height="40" fill="transparent" stroke="none" /></svg>
