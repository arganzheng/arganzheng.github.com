<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="t d">
<title id="t">ldmatrix.x4 装一个 16×16 A 子块</title>
<desc id="d">16×16 的 A 子块（一行 16 个 BF16 = 32 B）分成四个 8×8 象限：左上矩阵 #0 → r0 = a0，左下矩阵 #1 → r1 = a1，右上矩阵 #2 → r2 = a2，右下矩阵 #3 → r3 = a3。每行起点的三角标出谁给地址：lane 0-7 给行 0-7 列 0，lane 8-15 给行 8-15 列 0，lane 16-23 给行 0-7 列 8，lane 24-31 给行 8-15 列 8。</desc>
