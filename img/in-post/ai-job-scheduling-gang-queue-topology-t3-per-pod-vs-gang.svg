<text x="16" y="125" text-anchor="start" class="mono">node-C</text>
<rect class="job" x="124" y="108" width="28" height="24"/>
<rect class="job" x="152" y="108" width="28" height="24"/>
<rect class="job" x="180" y="108" width="28" height="24"/>
<rect class="job" x="208" y="108" width="28" height="24"/>
<rect class="job" x="236" y="108" width="28" height="24"/>
<rect class="job" x="264" y="108" width="28" height="24"/>
<rect class="job" x="292" y="108" width="28" height="24"/>
<rect class="job" x="320" y="108" width="28" height="24"/>
<text x="362" y="125" text-anchor="start" class="small">Pod-2</text>
<text x="16" y="149" text-anchor="start" class="mono">node-D</text>
<rect class="job" x="124" y="132" width="28" height="24"/>
<rect class="job" x="152" y="132" width="28" height="24"/>
<rect class="job" x="180" y="132" width="28" height="24"/>
<rect class="job" x="208" y="132" width="28" height="24"/>
