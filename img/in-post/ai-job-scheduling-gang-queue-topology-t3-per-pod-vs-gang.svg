<rect class="job" x="320" y="60" width="28" height="24"/>
<text x="362" y="77" text-anchor="start" class="small">Pod-0 已绑定，等 rendezvous，利用率 0%</text>
<text x="16" y="101" text-anchor="start" class="mono">node-B</text>
<rect class="job" x="124" y="84" width="28" height="24"/>
<rect class="job" x="152" y="84" width="28" height="24"/>
