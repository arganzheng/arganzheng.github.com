<text x="16" y="349" text-anchor="start" class="mono">node-I..L</text>
<rect class="other" x="124" y="332" width="28" height="24"/>
<rect class="other" x="152" y="332" width="28" height="24"/>
<rect class="other" x="180" y="332" width="28" height="24"/>
