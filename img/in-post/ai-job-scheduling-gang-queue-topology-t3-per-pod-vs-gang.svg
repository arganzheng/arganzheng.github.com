<rect class="free" x="292" y="156" width="28" height="24"/>
<rect class="free" x="320" y="156" width="28" height="24"/>
<text x="362" y="173" text-anchor="start" class="small">各剩 2 张，放不下 8 卡的 Pod</text>
<text x="16" y="197" text-anchor="start" class="mono">node-I..L</text>
<rect class="other" x="124" y="180" width="28" height="24"/>
<rect class="other" x="152" y="180" width="28" height="24"/>
<rect class="other" x="180" y="180" width="28" height="24"/>
<rect class="other" x="208" y="180" width="28" height="24"/>
<rect class="other" x="236" y="180" width="28" height="24"/>
<rect class="other" x="264" y="180" width="28" height="24"/>
<rect class="other" x="292" y="180" width="28" height="24"/>
<rect class="other" x="320" y="180" width="28" height="24"/>
<text x="362" y="197" text-anchor="start" class="small">满</text>
<text x="16" y="228" text-anchor="start" class="small">Pod-4 … Pod-31 → Pending（Insufficient nvidia.com/gpu）；32 卡被占，0 卡在算</text>
<text x="16" y="270" text-anchor="start" class="head">gang 调度，同一时刻</text>
<text x="16" y="301" text-anchor="start" class="mono">node-A..D</text>
<rect class="free" x="124" y="284" width="28" height="24"/>
<rect class="free" x="152" y="284" width="28" height="24"/>
<rect class="free" x="180" y="284" width="28" height="24"/>
