<text x="362" y="149" text-anchor="start" class="small">Pod-3</text>
<text x="16" y="173" text-anchor="start" class="mono">node-E..H</text>
<rect class="other" x="124" y="156" width="28" height="24"/>
<rect class="other" x="152" y="156" width="28" height="24"/>
<rect class="other" x="180" y="156" width="28" height="24"/>
