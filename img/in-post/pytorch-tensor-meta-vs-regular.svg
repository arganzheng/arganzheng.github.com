<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">普通 Tensor 与 Meta Tensor：元数据一样，差的只是 Storage 里的数据</text><text x="195" y="52" fill="#333" font-size="12" text-anchor="middle" font-weight="600">普通 Tensor：torch.empty(2, 3)</text><rect x="30" y="62" width="330" height="112" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="4"/><text x="42" y="80" fill="#555" font-size="11" text-anchor="start" font-weight="600">元数据（逻辑视图）</text><text x="195" y="102" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">shape = (2, 3)　stride = (3, 1)</text><text x="195" y="122" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">storage_offset = 0　dtype = float32</text><text x="195" y="142" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">layout = strided　requires_grad = False</text><text x="195" y="162" fill="#222" font-size="12" text-anchor="middle" font-weight="600">device = cpu</text><line x1="195" y1="174" x2="195" y2="204" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/><text x="203" y="193" fill="#999" font-size="10" text-anchor="start" font-weight="normal">data_ptr()</text><text x="42" y="222" fill="#555" font-size="11" text-anchor="start" font-weight="600">Storage（物理存储）</text><rect x="60" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="82.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">1</text><rect x="105" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="127.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">2</text><rect x="150" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="172.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">3</text><rect x="195" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="217.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">4</text><rect x="240" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="262.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">5</text><rect x="285" y="230" width="45" height="30" fill="#fff4e0" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="307.5" y="249.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">6</text><text x="195" y="280" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">占 6 × 4 = 24 字节，data_ptr() ≠ 0</text><text x="195" y="304" fill="#2e7d32" font-size="12" text-anchor="middle" font-weight="normal">能读数值：x.sum().item() 得到一个数</text><text x="565" y="52" fill="#333" font-size="12" text-anchor="middle" font-weight="600">Meta Tensor：torch.empty(2, 3, device="meta")</text><rect x="400" y="62" width="330" height="112" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="4"/><text x="412" y="80" fill="#555" font-size="11" text-anchor="start" font-weight="600">元数据（逻辑视图）</text><text x="565" y="102" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">shape = (2, 3)　stride = (3, 1)</text><text x="565" y="122" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">storage_offset = 0　dtype = float32</text><text x="565" y="142" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">layout = strided　requires_grad = False</text><text x="565" y="162" fill="#c0392b" font-size="12" text-anchor="middle" font-weight="600">device = meta</text><line x1="565" y1="174" x2="565" y2="204" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/><text x="573" y="193" fill="#999" font-size="10" text-anchor="start" font-weight="normal">data_ptr()</text><text x="412" y="222" fill="#555" font-size="11" text-anchor="start" font-weight="600">Storage（物理存储）</text><rect x="430" y="230" width="270" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="0" stroke-dasharray="4 3"/><text x="565" y="250" fill="#999" font-size="12" text-anchor="middle" font-weight="normal">空：没有分配</text><text x="565" y="280" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">只记 nbytes = 24，data_ptr() = 0，不占内存</text><text x="565" y="304" fill="#c0392b" font-size="12" text-anchor="middle" font-weight="normal">能推形状：x + 1 仍是 meta；.item() 报错</text><line x1="380" y1="44" x2="380" y2="320" stroke="#ddd" stroke-dasharray="4 4"/></svg>
