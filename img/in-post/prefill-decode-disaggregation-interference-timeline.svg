<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 538" width="760" height="538" role="img" aria-labelledby="t d">
  <title id="t">三种做法在同一时间轴上的干扰位置</title>
  <desc id="d">共置把长 Prompt 的干扰集中成已有请求的一次 ITL 尖峰；Chunked Prefill 把它摊到每一步，但新请求的首 token 要等多步；PD 分离让 D 的时间线不被打断，新请求的 TTFT 多出交接与就绪等待两段。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-s" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-hold { fill: #fff8ec; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); marker-start: url(#arrow-s); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .thin { stroke: #7a8b9c; stroke-width: 1.2; fill: none; }
      .grid { stroke: #dde4ec; stroke-width: 1; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="538" fill="#fff"/>
<line x1="150" y1="22" x2="720" y2="22" class="axis"/>
<text x="150" y="14" text-anchor="start" class="small">时间 →（步长只示意先后，不等长）</text>
<text x="40" y="40" text-anchor="start" class="head">共置（整段 Prefill 进入混合 batch）</text>
<text x="40" y="76" text-anchor="start" class="small">GPU</text>
<rect class="seg-b" x="150" y="54" width="57" height="34"/>
<text x="178.5" y="75.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="207" y="54" width="57" height="34"/>
<text x="235.5" y="75.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="264" y="54" width="57" height="34"/>
<text x="292.5" y="75.55" text-anchor="middle" class="small">d</text>
<rect class="seg-a" x="321" y="54" width="228" height="34"/>
<text x="435" y="75.55" text-anchor="middle" class="small">d + 长 Prompt Prefill（一步）</text>
<rect class="seg-b" x="549" y="54" width="57" height="34"/>
<text x="577.5" y="75.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="606" y="54" width="57" height="34"/>
<text x="634.5" y="75.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="663" y="54" width="57" height="34"/>
<text x="691.5" y="75.55" text-anchor="middle" class="small">d</text>
<text x="40" y="116" text-anchor="start" class="small">已有请求 ITL</text>
<text x="178.5" y="116" text-anchor="middle" class="body">·</text>
<text x="235.5" y="116" text-anchor="middle" class="body">·</text>
<text x="292.5" y="116" text-anchor="middle" class="body">·</text>
