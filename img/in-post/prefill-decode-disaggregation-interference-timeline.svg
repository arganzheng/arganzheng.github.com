<rect class="seg-b" x="549" y="420" width="57" height="34"/>
<text x="577.5" y="441.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="606" y="420" width="57" height="34"/>
<text x="634.5" y="441.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="663" y="420" width="57" height="34"/>
<text x="691.5" y="441.55" text-anchor="middle" class="small">d</text>
<text x="40" y="482" text-anchor="start" class="small">已有请求 ITL</text>
<text x="178.5" y="482" text-anchor="middle" class="body">·</text>
<text x="235.5" y="482" text-anchor="middle" class="body">·</text>
<text x="292.5" y="482" text-anchor="middle" class="body">·</text>
<text x="349.5" y="482" text-anchor="middle" class="body">·</text>
<text x="406.5" y="482" text-anchor="middle" class="body">·</text>
<text x="463.5" y="482" text-anchor="middle" class="body">·</text>
<text x="500" y="482" text-anchor="start" class="small">只受 D 内部因素影响</text>
<text x="40" y="526" text-anchor="start" class="small">新请求 TTFT</text>
<line x1="150" y1="522" x2="378" y2="522" class="thin"/>
<line x1="150" y1="517" x2="150" y2="527" class="thin"/>
<line x1="378" y1="517" x2="378" y2="527" class="thin"/>
