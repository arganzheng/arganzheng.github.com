<line x1="378" y1="522" x2="435" y2="522" class="thin"/>
<line x1="378" y1="517" x2="378" y2="527" class="thin"/>
<line x1="435" y1="517" x2="435" y2="527" class="thin"/>
<text x="406.5" y="515" text-anchor="middle" class="small">交接</text>
<line x1="435" y1="522" x2="492" y2="522" class="thin"/>
<line x1="435" y1="517" x2="435" y2="527" class="thin"/>
<line x1="492" y1="517" x2="492" y2="527" class="thin"/>
