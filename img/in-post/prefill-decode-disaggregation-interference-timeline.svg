<rect class="seg-a" x="406.5" y="214" width="85.5" height="34"/>
<text x="449.25" y="235.55" text-anchor="middle" class="small">d + c4</text>
<rect class="seg-b" x="492" y="214" width="57" height="34"/>
<text x="520.5" y="235.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="549" y="214" width="57" height="34"/>
<text x="577.5" y="235.55" text-anchor="middle" class="small">d</text>
<rect class="seg-b" x="606" y="214" width="57" height="34"/>
<text x="634.5" y="235.55" text-anchor="middle" class="small">d</text>
<text x="40" y="276" text-anchor="start" class="small">已有请求 ITL</text>
<path d="M192.75 278 V266" class="arrow"/>
<path d="M278.25 278 V266" class="arrow"/>
<path d="M363.75 278 V266" class="arrow"/>
<path d="M449.25 278 V266" class="arrow"/>
<text x="500" y="276" text-anchor="start" class="small">每步都略变长，没有大尖峰</text>
<text x="40" y="320" text-anchor="start" class="small">新请求 TTFT</text>
<line x1="150" y1="316" x2="492" y2="316" class="thin"/>
<line x1="150" y1="311" x2="150" y2="321" class="thin"/>
<line x1="492" y1="311" x2="492" y2="321" class="thin"/>
<text x="321" y="309" text-anchor="middle" class="small">分 4 步才算完</text>
<text x="498" y="320" text-anchor="start" class="bold">首 token</text>
<text x="40" y="360" text-anchor="start" class="head">PD 分离</text>
<text x="40" y="396" text-anchor="start" class="small">P 实例</text>
<rect class="seg-a" x="150" y="374" width="228" height="34"/>
<text x="264" y="395.55" text-anchor="middle" class="small">长 Prompt Prefill</text>
<rect class="seg-c" x="378" y="374" width="57" height="34"/>
<text x="406.5" y="395.55" text-anchor="middle" class="small">交接</text>
<rect class="seg-hold" x="435" y="374" width="114" height="34"/>
<text x="492" y="395.55" text-anchor="middle" class="small">源块保留至确认</text>
<text x="40" y="442" text-anchor="start" class="small">D 实例</text>
<rect class="seg-b" x="150" y="420" width="57" height="34"/>
<text x="178.5" y="441.55" text-anchor="middle" class="small">d</text>
