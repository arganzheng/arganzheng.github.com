<text x="634.5" y="116" text-anchor="middle" class="body">·</text>
<text x="691.5" y="116" text-anchor="middle" class="body">·</text>
<line x1="321" y1="114" x2="549" y2="114" class="thin"/>
<line x1="321" y1="109" x2="321" y2="119" class="thin"/>
<line x1="549" y1="109" x2="549" y2="119" class="thin"/>
<text x="435" y="107" text-anchor="middle" class="small">一次长尖峰</text>
<text x="40" y="160" text-anchor="start" class="small">新请求 TTFT</text>
<line x1="150" y1="156" x2="321" y2="156" class="thin"/>
<line x1="150" y1="151" x2="150" y2="161" class="thin"/>
<line x1="321" y1="151" x2="321" y2="161" class="thin"/>
<text x="235.5" y="149" text-anchor="middle" class="small">排队</text>
<line x1="321" y1="156" x2="549" y2="156" class="thin"/>
<line x1="321" y1="151" x2="321" y2="161" class="thin"/>
<line x1="549" y1="151" x2="549" y2="161" class="thin"/>
<text x="435" y="149" text-anchor="middle" class="small">一步算完</text>
<text x="555" y="160" text-anchor="start" class="bold">首 token</text>
<text x="40" y="200" text-anchor="start" class="head">共置 + Chunked Prefill</text>
<text x="40" y="236" text-anchor="start" class="small">GPU</text>
<rect class="seg-a" x="150" y="214" width="85.5" height="34"/>
<text x="192.75" y="235.55" text-anchor="middle" class="small">d + c1</text>
<rect class="seg-a" x="235.5" y="214" width="85.5" height="34"/>
<text x="278.25" y="235.55" text-anchor="middle" class="small">d + c2</text>
<rect class="seg-a" x="321" y="214" width="85.5" height="34"/>
