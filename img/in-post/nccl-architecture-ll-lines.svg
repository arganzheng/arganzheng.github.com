<text class="s13" x="60" y="284">d = 8 B 数据 × 15 = 120 B，F = 8 B flag（flagThread = tid%8 == 7 的高 8 B）→ 120/128 = 93.75%</text>
<rect class="data" x="60" y="302" width="22" height="16"/><text class="s13" x="88" y="315">数据</text>
