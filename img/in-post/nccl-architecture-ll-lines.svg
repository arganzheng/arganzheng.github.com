<svg xmlns="http://www.w3.org/2000/svg" width="700" height="332" viewBox="0 0 700 332" role="img" aria-labelledby="t d">
<title id="t">LL 与 LL128 的 line 布局：数据与 flag 怎么排</title>
<desc id="d">LL 一行 16 字节依次是 data1、flag1、data2、flag2，各 4 字节，数据占一半；LL128 一行 128 字节由 t0 到 t7 八个线程各 16 字节拼成，前 120 字节是 15 个 8 字节数据，t7 的高 8 字节是 flag。</desc>
<style>
text{font-family:'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#111;font-weight:500}
.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace}
.s12{font-size:12px} .s13{font-size:13px} .s14{font-size:14px} .s16{font-size:16px;font-weight:600}
.mid{text-anchor:middle} .end{text-anchor:end}
.data{fill:#e3eefb;stroke:#2c5d8a;stroke-width:1}.flag{fill:#fdd9ae;stroke:#c26a12;stroke-width:1}.thr{fill:none;stroke:#1b3a57;stroke-width:2.2}
</style>
<rect width="700" height="332" fill="#fff"/>
<text class="s14" x="20" y="24">LL：ncclLLFifoLine，16 B = 一条 st.volatile.global.v4.u32（原子）</text>
