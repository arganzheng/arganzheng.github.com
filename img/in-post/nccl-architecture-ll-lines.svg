<text class="s13 mid mono" x="270.0" y="68">data2</text>
<rect class="flag" x="312" y="44" width="84" height="38"/>
<text class="s13 mid mono" x="354.0" y="68">flag2</text>
<text class="s12 mid mono" x="60" y="98">0</text>
<text class="s12 mid mono" x="144" y="98">4</text>
<text class="s12 mid mono" x="228" y="98">8</text>
<text class="s12 mid mono" x="312" y="98">12</text>
<text class="s12 mid mono" x="396" y="98">16</text>
<text class="s12 mono" x="14" y="98">byte</text>
<text class="s12 mid" x="102.0" y="116">val 低 32 位</text>
<text class="s12 mid" x="270.0" y="116">val 高 32 位</text>
<text class="s13" x="420" y="59">8 B 数据 + 8 B flag → 50%</text>
<text class="s13" x="420" y="79">flag = <tspan class="mono">NCCL_LL_FLAG(step+1)</tspan></text>
<text class="s14" x="20" y="170">LL128：一个 128 B line 由一个 warp 里的 8 个线程各持 16 B 拼成</text>
