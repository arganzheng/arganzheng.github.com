<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="t d">
  <title id="t">Attention 用 TP、MoE 用 EP 的 Transformer Block</title>
  <desc id="d">一个 Transformer Block 大框里有两层：Attention 用 TP，GPU 0–3 各算一部分 Head（Head 分片 i，本地算 softmax(QᵢKᵢᵀ/√d)Vᵢ）；MoE FFN 用 EP，GPU 0–3 各放 16 个 Expert（E0–E15、E16–E31、E32–E47、E48–E63），每个 Expert 本地算 Down(SiLU(Gate)⊙Up)。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c3cf"/></marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7a8b9c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .formula { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-style: italic; }
      .math { font-size: 14px; }
      .mute { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .req { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .comm { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-o { fill: #fde9cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #f9d5cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-light { stroke: #b7c3cf; stroke-width: 1.2; fill: none; marker-end: url(#arrow-light); }
      .arrow-hi { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#arrow-hi); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .dbl { stroke: #5880b4; stroke-width: 4; fill: none; }
      .dbl-in { stroke: #fff; stroke-width: 1.4; fill: none; }
      .dash { stroke: #7a8b9c; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow-axis); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
<rect class="frame" x="20" y="10" width="720" height="284"/>
<text x="32" y="32" text-anchor="start" class="head">Transformer Block</text>
<rect class="frame" x="32" y="44" width="696" height="106"/>
<text x="44" y="64" text-anchor="start" class="body">Attention：TP，4 张 GPU 各算一部分 Head</text>
<rect class="seg-a" x="44.0" y="74" width="160.5" height="66"/>
<text x="124.25" y="92" text-anchor="middle" class="small">GPU 0</text>
<text x="124.25" y="110" text-anchor="middle" class="mono">Head 分片 0</text>
<text x="124.25" y="128" text-anchor="middle" class="formula">softmax(Q₀K₀ᵀ/√d)V₀</text>
<rect class="seg-b" x="214.5" y="74" width="160.5" height="66"/>
<text x="294.75" y="92" text-anchor="middle" class="small">GPU 1</text>
<text x="294.75" y="110" text-anchor="middle" class="mono">Head 分片 1</text>
<text x="294.75" y="128" text-anchor="middle" class="formula">softmax(Q₁K₁ᵀ/√d)V₁</text>
<rect class="seg-c" x="385.0" y="74" width="160.5" height="66"/>
<text x="465.25" y="92" text-anchor="middle" class="small">GPU 2</text>
<text x="465.25" y="110" text-anchor="middle" class="mono">Head 分片 2</text>
<text x="465.25" y="128" text-anchor="middle" class="formula">softmax(Q₂K₂ᵀ/√d)V₂</text>
<rect class="seg-d" x="555.5" y="74" width="160.5" height="66"/>
<text x="635.75" y="92" text-anchor="middle" class="small">GPU 3</text>
<text x="635.75" y="110" text-anchor="middle" class="mono">Head 分片 3</text>
<text x="635.75" y="128" text-anchor="middle" class="formula">softmax(Q₃K₃ᵀ/√d)V₃</text>
<line x1="380.0" y1="150" x2="380.0" y2="176" class="arrow"/>
<rect class="frame" x="32" y="176" width="696" height="106"/>
<text x="44" y="196" text-anchor="start" class="body">MoE FFN：EP，不同 GPU 放不同 Expert</text>
<rect class="seg-a" x="44.0" y="206" width="160.5" height="66"/>
<text x="124.25" y="224" text-anchor="middle" class="small">GPU 0</text>
<text x="124.25" y="242" text-anchor="middle" class="mono">E0 ~ E15</text>
<text x="124.25" y="260" text-anchor="middle" class="formula">Down(SiLU(Gate)⊙Up)</text>
<rect class="seg-b" x="214.5" y="206" width="160.5" height="66"/>
<text x="294.75" y="224" text-anchor="middle" class="small">GPU 1</text>
<text x="294.75" y="242" text-anchor="middle" class="mono">E16 ~ E31</text>
<text x="294.75" y="260" text-anchor="middle" class="formula">Down(SiLU(Gate)⊙Up)</text>
<rect class="seg-c" x="385.0" y="206" width="160.5" height="66"/>
<text x="465.25" y="224" text-anchor="middle" class="small">GPU 2</text>
<text x="465.25" y="242" text-anchor="middle" class="mono">E32 ~ E47</text>
<text x="465.25" y="260" text-anchor="middle" class="formula">Down(SiLU(Gate)⊙Up)</text>
<rect class="seg-d" x="555.5" y="206" width="160.5" height="66"/>
<text x="635.75" y="224" text-anchor="middle" class="small">GPU 3</text>
<text x="635.75" y="242" text-anchor="middle" class="mono">E48 ~ E63</text>
<text x="635.75" y="260" text-anchor="middle" class="formula">Down(SiLU(Gate)⊙Up)</text>
</svg>
