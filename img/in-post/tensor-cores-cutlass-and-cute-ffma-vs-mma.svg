<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">FFMA 与 mma.sync 的一条指令</title>
<desc id="d">左：FFMA，32 个 lane 各做 1 次乘加，共 32 次乘加 64 FLOP。右：mma.sync.m16n8k16，32 个 lane 协作做 D[16×8] = A[16×16]·B[16×8] + C[16×8]，按比例画出 A 16×16（256 个 BF16）、B 16×8（128 BF16）、D 16×8（128 FP32），共 2048 次乘加 4096 FLOP，是 FFMA 的 64 倍。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-weight:600}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="760" height="300" fill="#fff"/>
<text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#111">一个 warp 的一条指令：</text>
<text x="20.0" y="56.0" font-size="14" text-anchor="start" fill="#111" font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">FFMA</text>
<text x="20.0" y="80.0" font-size="13" text-anchor="start" fill="#111">32 个 lane 各做 1 次 d = a*b + c</text>
<text x="300.0" y="56.0" font-size="14" text-anchor="start" fill="#111" font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">mma.sync.m16n8k16</text>
<text x="300.0" y="80.0" font-size="13" text-anchor="start" fill="#111">32 个 lane 协作做 D[16×8] = A[16×16] · B[16×8] + C[16×8]</text>
