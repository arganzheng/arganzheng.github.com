<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="t d">
  <title id="t">MHA / GQA / MQA / MLA 的 query 到 KV head 映射（n_h = 8）</title>
  <desc id="d">以 8 个 query head 为例。MHA：q0 到 q7 各自对应 kv0 到 kv7，每层每 token 缓存 8 × 2 × d_head。GQA（n_kv = 2，g = 4）：q0–q3 共享 kv0，q4–q7 共享 kv1，缓存 2 × 2 × d_head。MQA（n_kv = 1）：8 个 query head 共享 kv0，缓存 1 × 2 × d_head。MLA：每个 head 经自己的升维矩阵 W_UK,h / W_UV,h（权重，不缓存）连到同一个 c^KV（d_c 维），再加所有 head 共用的 k^R（d_h^R 维），缓存 d_c + d_h^R。</desc>
