  <title id="t">1F1B 调度：K=4，M=8</title>
  <desc id="d">4 行是 stage 0 到 3，横轴是时间，共 22 格。stage 0 先做 F₀ 到 F₃，等 stage 3、2、1 依次做完 B₀ 后才做 B₀，之后 F 和 B 交替；stage 3 在 F₀ 之后立刻做 B₀，此后每做一个 F 就接一个 B。稳态时 stage 0 每个 F 和 B 之间有等待，所有 B₇ 做完时结束。</desc>
