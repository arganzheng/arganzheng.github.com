<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800" role="img" aria-labelledby="t d">
  <title id="t">平台机制全局图：网络与存储</title>
  <desc id="d">Pod（训练 rank）里的 eth0、net1、/dev/infiniband 设备文件和 /dev/nvidia* 分别从哪来、由谁部署、依赖节点上的哪些内核模块。eth0 和 net1 都经 Multus 元插件：kubelet 调 CNI ADD，Multus 按 networks 注解和 NAD 先调默认 CNI（Calico/Cilium…，集群自带）给 eth0，再调 delegate CNI（host-device / macvlan / ipoib / sriov）给 net1。/dev/infiniband/* 由 RDMA device plugin（rdma-shared 或 sriov）在 kubelet Allocate 时挂进容器，/dev/nvidia* 由 GPU device plugin（nvidia.com/gpu）挂进容器。NCCL 环境变量和 IPC_LOCK 写在 Pod spec 里。Network Operator 的 NicClusterPolicy 部署 secondaryNetwork（multus、cniPlugins、ipoib）、nvIpam、rdmaSharedDevicePlugin / sriovDevicePlugin，ofedDriver（DOCA-OFED 驱动容器）加载 mlx5_core、ib_core、ib_uverbs、rdma_cm。GPU Operator 的 ClusterPolicy 部署 devicePlugin、driver（加载 nvidia）和 driver.rdma.enabled（nvidia-peermem sidecar，加载 nvidia_peermem），以及 gds、gdrcopy；nvidia_peermem 针对 OFED 的 ib_core 编译，所以 OFED 先就位。不装 peermem 也可以走 DMA-BUF。节点上 RDMA 子系统的 netns 模式 shared 或 exclusive 是全节点开关。存储一栏：CSI 把并行文件系统 PVC、对象存储 + 缓存层（JuiceFS/Alluxio/Fluid）、节点本地 NVMe 挂进 Pod；PyTorch DCP 用 dcp.save 每 rank 写分片，dcp.async_save 先 stage 到 host 内存再后台写。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #9fb3c8; stroke-width: 1.4; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .darrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); marker-start: url(#arrowr); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .vline { stroke: #40566f; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .seg { stroke: #40566f; stroke-width: 1.2; }
      .s-train { fill: #cfeccf; } .s-pause { fill: #f9d5d3; } .s-write { fill: #cfe2f3; }
      .s-idle { fill: #f3f5f7; } .s-stage { fill: #fde0b8; } .s-host { fill: #fff0a8; }
    </style>
  </defs>
<rect x="62.0" y="8.0" width="690.0" height="156.0" class="frame"/>
<text x="72.0" y="30.0" text-anchor="start" class="bold">Pod（训练 rank）</text>
<text x="72.0" y="52.0" text-anchor="start" class="small">Pod spec 里写的：env NCCL_IB_HCA / NCCL_SOCKET_IFNAME / NCCL_NET_GDR_LEVEL</text>
<text x="72.0" y="71.0" text-anchor="start" class="small">securityContext 加 IPC_LOCK（RDMA 注册内存要锁页）</text>
<rect x="68.0" y="86.0" width="88.0" height="66.0" class="cell"/>
<text x="112.0" y="106.0" text-anchor="middle" class="monob">eth0</text>
<text x="112.0" y="124.0" text-anchor="middle" class="small">veth</text>
<text x="112.0" y="142.0" text-anchor="middle" class="small">overlay IP</text>
<rect x="178.0" y="86.0" width="172.0" height="66.0" class="cell"/>
<text x="264.0" y="115.0" text-anchor="middle" class="monob">net1</text>
<text x="264.0" y="133.0" text-anchor="middle" class="small">RDMA 侧 IP</text>
<rect x="372.0" y="86.0" width="189.0" height="66.0" class="cell"/>
<text x="466.5" y="115.0" text-anchor="middle" class="monob">/dev/infiniband/</text>
<text x="466.5" y="133.0" text-anchor="middle" class="mono">{uverbs0,rdma_cm,...}</text>
<rect x="583.0" y="86.0" width="163.0" height="66.0" class="cell"/>
<text x="664.5" y="115.0" text-anchor="middle" class="monob">/dev/nvidia*</text>
<text x="664.5" y="133.0" text-anchor="middle" class="small">GPU 设备文件</text>
<rect x="62.0" y="190.0" width="294.0" height="136.0" class="frame"/>
<rect x="68.0" y="198.0" width="88.0" height="86.0" class="box"/>
<text x="112.0" y="218.5" text-anchor="middle" class="bold">默认 CNI</text>
<text x="112.0" y="237.5" text-anchor="middle" class="small">Calico/</text>
<text x="112.0" y="255.5" text-anchor="middle" class="small">Cilium…</text>
<text x="112.0" y="273.5" text-anchor="middle" class="small">（集群自带）</text>
<rect x="178.0" y="198.0" width="172.0" height="86.0" class="box"/>
<text x="264.0" y="227.5" text-anchor="middle" class="bold">delegate CNI</text>
<text x="264.0" y="246.5" text-anchor="middle" class="small">host-device / macvlan</text>
<text x="264.0" y="264.5" text-anchor="middle" class="small">/ ipoib / sriov</text>
<text x="209.0" y="297.0" text-anchor="middle" class="bold">Multus 元插件</text>
<text x="209.0" y="316.0" text-anchor="middle" class="small">按 networks 注解 + NAD 逐个调用</text>
<rect x="366.0" y="190.0" width="201.0" height="136.0" class="box"/>
<text x="466.5" y="235.5" text-anchor="middle" class="bold">RDMA device plugin</text>
<text x="466.5" y="254.5" text-anchor="middle" class="small">rdma-shared 或 sriov</text>
<text x="466.5" y="272.5" text-anchor="middle" class="small">kubelet Allocate 时</text>
<text x="466.5" y="290.5" text-anchor="middle" class="small">挂 /dev/infiniband/*</text>
<rect x="577.0" y="190.0" width="175.0" height="136.0" class="box"/>
<text x="664.5" y="235.5" text-anchor="middle" class="bold">GPU device plugin</text>
<text x="664.5" y="254.5" text-anchor="middle" class="mono">nvidia.com/gpu</text>
<text x="664.5" y="272.5" text-anchor="middle" class="small">kubelet Allocate 时</text>
<text x="664.5" y="290.5" text-anchor="middle" class="small">挂 /dev/nvidia*</text>
<line x1="112.0" y1="152.0" x2="112.0" y2="198.0" class="line"/>
<line x1="264.0" y1="152.0" x2="264.0" y2="198.0" class="line"/>
<line x1="466.5" y1="152.0" x2="466.5" y2="190.0" class="line"/>
<line x1="664.5" y1="152.0" x2="664.5" y2="190.0" class="line"/>
<text x="8.0" y="263.0" text-anchor="start" class="bold">谁给的</text>
<rect x="172.0" y="352.0" width="395.0" height="168.0" class="frame"/>
<rect x="178.0" y="360.0" width="172.0" height="82.0" class="box"/>
<text x="264.0" y="388.0" text-anchor="middle" class="monob">secondaryNetwork</text>
<text x="264.0" y="406.0" text-anchor="middle" class="small">multus · cniPlugins</text>
<text x="264.0" y="424.0" text-anchor="middle" class="small">· ipoib；nvIpam</text>
<rect x="372.0" y="360.0" width="189.0" height="82.0" class="box"/>
<text x="466.5" y="388.0" text-anchor="middle" class="mono">rdmaSharedDevicePlugin</text>
<text x="466.5" y="406.0" text-anchor="middle" class="mono">/ sriovDevicePlugin</text>
<text x="466.5" y="424.0" text-anchor="middle" class="small">（config 原样透传）</text>
<text x="369.5" y="463.0" text-anchor="middle" class="bold">Network Operator · NicClusterPolicy</text>
<rect x="178.0" y="472.0" width="383.0" height="40.0" class="box"/>
<text x="369.5" y="497.0" text-anchor="middle" class="small">ofedDriver：DOCA-OFED 驱动容器</text>
<line x1="264.0" y1="326.0" x2="264.0" y2="360.0" class="line"/>
<line x1="466.5" y1="326.0" x2="466.5" y2="360.0" class="line"/>
<rect x="577.0" y="352.0" width="175.0" height="168.0" class="frame"/>
<rect x="583.0" y="360.0" width="163.0" height="40.0" class="box"/>
<text x="664.5" y="385.0" text-anchor="middle" class="mono">devicePlugin</text>
<text x="664.5" y="420.0" text-anchor="middle" class="bold">GPU Operator ·</text>
