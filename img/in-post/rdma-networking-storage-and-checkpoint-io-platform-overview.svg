<text x="664.5" y="485.0" text-anchor="middle" class="mono">driver.rdma.enabled</text>
<text x="664.5" y="503.0" text-anchor="middle" class="mono">gds · gdrcopy</text>
<line x1="664.5" y1="326.0" x2="664.5" y2="360.0" class="line"/>
