<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">重分片：磁盘块与加载侧本地块的区间求交</title>
  <desc id="d">左侧竖条是磁盘上的两块（TP=2 保存）：chunk 0 占行 0 到 2048，chunk 1 占行 2048 到 4096，各自写在 __0_0.distcp 与 __1_0.distcp。中间竖条是加载侧 FSDP 5 个 rank 的本地块：820、820、820、820、816 行。2048 这条虚线贯穿两侧，rank 2 的区间 [1640, 2460) 跨过它：前 408 行落在 chunk 0，后 412 行落在 chunk 1，其余 rank 各自完全落在一个 chunk 里。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; font-weight: 700; }
      .mono12 { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .proc-a { fill: #f3f9f5; stroke: #70a582; stroke-width: 1.2; }
      .proc-b { fill: #fff8ec; stroke: #d79a45; stroke-width: 1.2; }
      .proc-c { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #ffe3c2; stroke: #d79a45; stroke-width: 1.4; }
      .disk { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .thin { stroke: #40566f; stroke-width: 1.2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .sep { stroke: #7a8b9c; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .cut { stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>
<text x="14" y="28" text-anchor="start" class="small">行号</text>
<text x="165" y="28" text-anchor="middle" class="bold">磁盘上的块（TP=2 保存）</text>
<text x="390" y="28" text-anchor="middle" class="bold">加载侧的本地块（FSDP 5 rank）</text>
<rect class="seg-a" x="70" y="50" width="190" height="200"/>
<text x="84" y="120" text-anchor="start" class="monob">chunk 0</text>
<text x="84" y="142" text-anchor="start" class="mono">offsets=[0,0]</text>
<text x="84" y="162" text-anchor="start" class="mono">sizes=[2048,4096]</text>
<text x="84" y="182" text-anchor="start" class="mono">→ __0_0.distcp</text>
<rect class="seg-b" x="70" y="250" width="190" height="200"/>
<text x="84" y="320" text-anchor="start" class="monob">chunk 1</text>
<text x="84" y="342" text-anchor="start" class="mono">offsets=[2048,0]</text>
<text x="84" y="362" text-anchor="start" class="mono">sizes=[2048,4096]</text>
<text x="84" y="382" text-anchor="start" class="mono">→ __1_0.distcp</text>
<rect class="seg-free" x="290" y="50" width="200" height="80.0781"/>
<text x="304" y="95.0391" text-anchor="start" class="mono">rank 0  [0, 820)</text>
<rect class="seg-free" x="290" y="130.078" width="200" height="80.0781"/>
<text x="304" y="175.117" text-anchor="start" class="mono">rank 1  [820, 1640)</text>
<rect class="seg-hi" x="290" y="210.156" width="200" height="80.0781"/>
<text x="304" y="234.156" text-anchor="start" class="mono">rank 2  [1640, 2460)</text>
<rect class="seg-free" x="290" y="290.234" width="200" height="80.0781"/>
<text x="304" y="335.273" text-anchor="start" class="mono">rank 3  [2460, 3280)</text>
<rect class="seg-free" x="290" y="370.312" width="200" height="79.6875"/>
<text x="304" y="415.156" text-anchor="start" class="mono">rank 4  [3280, 4096)</text>
<text x="60" y="55" text-anchor="end" class="mono">0</text>
<text x="60" y="255" text-anchor="end" class="mono">2048</text>
<text x="60" y="455" text-anchor="end" class="mono">4096</text>
<line x1="70" y1="250" x2="530" y2="250" class="cut"/>
<line x1="490" y1="210.156" x2="530" y2="210.156" class="thin"/>
<text x="536" y="215.156" text-anchor="start" class="mono12">1640</text>
<line x1="490" y1="290.234" x2="530" y2="290.234" class="thin"/>
<text x="536" y="295.234" text-anchor="start" class="mono12">2460</text>
<text x="536" y="320.234" text-anchor="start" class="bold">rank 2 跨过 2048：</text>
<text x="536" y="342.234" text-anchor="start" class="mono12">[1640, 2048) 408 行 ← chunk 0</text>
<text x="536" y="360.234" text-anchor="start" class="mono12">[2048, 2460) 412 行 ← chunk 1</text>
<text x="536" y="382.234" text-anchor="start" class="small">两个 ReadItem，各读自己那段</text>
</svg>
