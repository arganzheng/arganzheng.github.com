      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #333; }
      .italic { font-size: 13px; font-style: italic; fill: #333; }
      .num { font-size: 14px; font-weight: 600; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #333; }
      .sep { stroke: #d5dde6; stroke-width: 1; }
      .dcell { fill: #fff; stroke: #8a9bb0; stroke-width: 1; }
      .n2 { fill: #eef4fc; stroke: #8a9bb0; stroke-width: 1; }
      .n3 { fill: #e2ecf9; stroke: #8a9bb0; stroke-width: 1; }
      .n4 { fill: #d6e4f7; stroke: #8a9bb0; stroke-width: 1; }
      .n5 { fill: #c9dbf3; stroke: #8a9bb0; stroke-width: 1; }
