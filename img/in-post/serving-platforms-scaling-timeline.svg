  <rect x="270" y="166" width="60" height="30" class="n3"/>
  <text x="300.0" y="186" class="num" text-anchor="middle">3</text>
  <rect x="330" y="166" width="60" height="30" class="n3"/>
  <text x="354.0" y="186" class="num" text-anchor="middle">3</text>
  <path d="M367.0,186 L377.0,186 L372.0,176 Z" class="mk-up"/>
  <rect x="390" y="166" width="60" height="30" class="n5"/>
  <text x="414.0" y="186" class="num" text-anchor="middle">5</text>
  <path d="M427.0,186 L437.0,186 L432.0,176 Z" class="mk-up"/>
  <rect x="450" y="166" width="60" height="30" class="n9"/>
  <text x="474.0" y="186" class="num" text-anchor="middle">9</text>
  <path d="M487.0,186 L497.0,186 L492.0,176 Z" class="mk-up"/>
  <rect x="510" y="166" width="60" height="30" class="n10"/>
  <text x="540.0" y="186" class="num" text-anchor="middle">10</text>
  <rect x="570" y="166" width="60" height="30" class="n10"/>
  <text x="600.0" y="186" class="num" text-anchor="middle">10</text>
  <rect x="630" y="166" width="60" height="30" class="n9"/>
  <text x="660.0" y="186" class="num" text-anchor="middle">9</text>
  <rect x="690" y="166" width="60" height="30" class="n5"/>
  <text x="720.0" y="186" class="num" text-anchor="middle">… 5</text>
  <text x="150" y="216" class="small" text-anchor="start">D 越过 N × 36 即触发，决策后 9 分钟才就绪；就绪 N = 9 分钟前的 ceil(D/36)</text>
  <text x="150" y="235" class="small" text-anchor="start">→ 余量 56 正好盖住 9 分钟的增长，爬升期不排队；峰值 ceil(350/36) = 10 副本</text>
  <text x="150" y="254" class="small" text-anchor="start">→ 高峰多 16 卡 × 3.5 h = 56 卡时/天</text>
  <line x1="8" y1="272" x2="752" y2="272" class="sep"/>
  <text x="12" y="302" class="bold" text-anchor="start">组合方案</text>
  <text x="12" y="320" class="small" text-anchor="start">cron 19:48</text>
  <text x="12" y="338" class="small" text-anchor="start">+ running</text>
  <text x="12" y="356" class="small" text-anchor="start">56 / wait 4</text>
  <text x="144" y="302" class="italic" text-anchor="end">N =</text>
  <rect x="150" y="282" width="60" height="30" class="n2"/>
  <text x="174.0" y="302" class="num" text-anchor="middle">2</text>
  <path d="M187.0,302 L197.0,302 L192.0,292 Z" class="mk-up"/>
  <rect x="210" y="282" width="60" height="30" class="n6"/>
  <text x="240.0" y="302" class="num" text-anchor="middle">6</text>
  <rect x="270" y="282" width="60" height="30" class="n6"/>
  <text x="300.0" y="302" class="num" text-anchor="middle">6</text>
  <rect x="330" y="282" width="60" height="30" class="n6"/>
  <text x="360.0" y="302" class="num" text-anchor="middle">6</text>
  <rect x="390" y="282" width="60" height="30" class="n6"/>
  <text x="420.0" y="302" class="num" text-anchor="middle">6</text>
  <rect x="450" y="282" width="60" height="30" class="n6"/>
  <text x="480.0" y="302" class="num" text-anchor="middle">6</text>
  <rect x="510" y="282" width="60" height="30" class="n6"/>
  <text x="540.0" y="302" class="num" text-anchor="middle">…</text>
  <rect x="570" y="282" width="60" height="30" class="n6"/>
  <text x="594.0" y="302" class="num" text-anchor="middle">6</text>
  <path d="M607.0,292 L617.0,292 L612.0,302 Z" class="mk-down"/>
  <rect x="630" y="282" width="60" height="30" class="n5"/>
  <text x="660.0" y="302" class="num" text-anchor="middle">5</text>
  <rect x="690" y="282" width="60" height="30" class="n2"/>
  <text x="720.0" y="302" class="num" text-anchor="middle">… 2</text>
  <text x="150" y="332" class="small" text-anchor="start">19:48 cron 抬到 6，19:57 就绪（比 D &gt; 128 的 20:04 早 7 分）</text>
  <text x="150" y="351" class="small" text-anchor="start">running 56 在预期高峰内不动（350 / (6 × 56) ≈ 1.04，在 HPA 10% 容忍度内）</text>
  <text x="150" y="370" class="small" text-anchor="start">23:30 地板回 2；15 分钟窗口 + 每 5 分钟缩 1，6 → 2 约 20 分钟</text>
  <text x="150" y="389" class="small" text-anchor="start">→ 3.2 + 1.3 卡时 = 约 5 卡时/天</text>
  <line x1="8" y1="407" x2="752" y2="407" class="sep"/>
  <path d="M151,427 L161,427 L156,417 Z" class="mk-up"/>
