<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 441" width="760" height="441" role="img" aria-labelledby="t d">
  <title id="t">三种扩缩方案在同一时间轴上的对照</title>
  <desc id="d">时刻 19:48、19:57、20:00、20:04、20:20、20:40、…、23:30、23:50、24:00，并发 D 依次为 100、100、100、125、225、350、…、350、150、100。常驻 6：N 全程 6，全天多 16 卡 × 20.5 h = 328 卡时/天。反应式阈值 36：N 为 3、3、3、3（扩容决策）、5（扩容决策）、9（扩容决策）、10、10、9、… 5；D 越过 N × 36 即触发，决策后 9 分钟才就绪，就绪 N 等于 9 分钟前的 ceil(D/36)，余量 56 正好盖住 9 分钟的增长，爬升期不排队，峰值 ceil(350/36) = 10 副本，高峰多 16 卡 × 3.5 h = 56 卡时/天。组合方案 cron 19:48 + running 56 / wait 4：N 为 2（扩容决策）、6、6、6、6、6、6（23:30 缩容开始）、5、… 2；19:48 cron 抬到 6，19:57 就绪（比 D > 128 的 20:04 早 7 分），running 56 在预期高峰内不动（350 / (6 × 56) ≈ 1.04，在 HPA 10% 容忍度内），23:30 地板回 2，15 分钟窗口 + 每 5 分钟缩 1，6 → 2 约 20 分钟，合计 3.2 + 1.3 卡时 = 约 5 卡时/天。</desc>
