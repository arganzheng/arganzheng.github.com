  <text x="540.0" y="56" class="num" text-anchor="middle">…</text>
  <rect x="570" y="36" width="60" height="30" class="dcell"/>
  <text x="600.0" y="56" class="num" text-anchor="middle">350</text>
  <rect x="630" y="36" width="60" height="30" class="dcell"/>
  <text x="660.0" y="56" class="num" text-anchor="middle">150</text>
