  <text x="720.0" y="24" class="mono" text-anchor="middle">24:00</text>
  <text x="12" y="56" class="bold" text-anchor="start">D 并发</text>
  <rect x="150" y="36" width="60" height="30" class="dcell"/>
  <text x="180.0" y="56" class="num" text-anchor="middle">100</text>
