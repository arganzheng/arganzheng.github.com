      .n9 { fill: #97b7e3; stroke: #8a9bb0; stroke-width: 1; }
      .n10 { fill: #8aaedf; stroke: #8a9bb0; stroke-width: 1; }
      .mk-up { fill: #c0392b; }
      .mk-down { fill: #1e7b4a; }
    </style>
  </defs>
  <text x="12" y="24" class="bold" text-anchor="start">时刻</text>
  <text x="180.0" y="24" class="mono" text-anchor="middle">19:48</text>
  <text x="240.0" y="24" class="mono" text-anchor="middle">19:57</text>
  <text x="300.0" y="24" class="mono" text-anchor="middle">20:00</text>
  <text x="360.0" y="24" class="mono" text-anchor="middle">20:04</text>
  <text x="420.0" y="24" class="mono" text-anchor="middle">20:20</text>
