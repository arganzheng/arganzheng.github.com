  <line x1="8" y1="78" x2="752" y2="78" class="sep"/>
  <text x="12" y="108" class="bold" text-anchor="start">常驻 6</text>
  <text x="144" y="108" class="italic" text-anchor="end">N =</text>
  <rect x="150" y="88" width="60" height="30" class="n6"/>
  <text x="180.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="210" y="88" width="60" height="30" class="n6"/>
  <text x="240.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="270" y="88" width="60" height="30" class="n6"/>
  <text x="300.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="330" y="88" width="60" height="30" class="n6"/>
  <text x="360.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="390" y="88" width="60" height="30" class="n6"/>
  <text x="420.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="450" y="88" width="60" height="30" class="n6"/>
  <text x="480.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="510" y="88" width="60" height="30" class="n6"/>
  <text x="540.0" y="108" class="num" text-anchor="middle">…</text>
  <rect x="570" y="88" width="60" height="30" class="n6"/>
  <text x="600.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="630" y="88" width="60" height="30" class="n6"/>
  <text x="660.0" y="108" class="num" text-anchor="middle">6</text>
  <rect x="690" y="88" width="60" height="30" class="n6"/>
  <text x="720.0" y="108" class="num" text-anchor="middle">6</text>
  <text x="150" y="138" class="small" text-anchor="start">全天多 16 卡 × 20.5 h = 328 卡时/天</text>
  <line x1="8" y1="156" x2="752" y2="156" class="sep"/>
  <text x="12" y="186" class="bold" text-anchor="start">反应式</text>
  <text x="12" y="204" class="small" text-anchor="start">阈值 36</text>
  <text x="144" y="186" class="italic" text-anchor="end">N =</text>
  <rect x="150" y="166" width="60" height="30" class="n3"/>
  <text x="180.0" y="186" class="num" text-anchor="middle">3</text>
