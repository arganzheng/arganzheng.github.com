<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d">
  <title id="t">256 个线程在 128×128 C tile 上的铺法</title>
  <desc id="d">16×16 的线程网格，tid = tm*16 + tn；每格是一个线程负责的 8×8 输出。warp 0 是 tid 0..31，占 tm = 0、1 两行；warp 1 占 tm = 2、3；warp 7 占 tm = 14、15。</desc>
