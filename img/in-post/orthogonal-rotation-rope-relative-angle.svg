<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <defs>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a00"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/></marker>
  </defs>
  <style>
    .t{font-weight:600;fill:#222}.m{fill:#666;font-size:11px}.s{fill:#444;font-size:11px}
    .ax{stroke:#bbb;stroke-width:1}.circ{fill:none;stroke:#ccc;stroke-dasharray:3 3}
    .q{stroke:#c98a00;stroke-width:2.2;marker-end:url(#aq)}.k{stroke:#5b8def;stroke-width:2.2;marker-end:url(#ak)}
    .q0{stroke:#c98a00;stroke-width:1.2;stroke-dasharray:4 3;opacity:.5}
    .arc{fill:none;stroke:#d32f2f;stroke-width:1.6}.arcq{fill:none;stroke:#c98a00;stroke-width:1;stroke-dasharray:3 2}
    text{text-anchor:middle}
  </style>

  <text x="380" y="20" class="t" font-size="13">RoPE：q 转 mθ、k 转 nθ，两者的夹角只看 n − m（例：θ = 30°，q、k 都从 (1, 0) 出发）</text>

  <!-- ===== left panel: m = 1, n = 4 ===== -->
  <g transform="translate(170,175)">
    <text x="0" y="-130" class="t">q 在位置 m = 1，k 在位置 n = 4</text>
    <line x1="-110" y1="0" x2="110" y2="0" class="ax"/><line x1="0" y1="-110" x2="0" y2="110" class="ax"/>
    <circle cx="0" cy="0" r="90" class="circ"/>
    <!-- original (1,0) -->
    <line x1="0" y1="0" x2="90" y2="0" class="q0"/>
    <text x="98" y="14" class="m" style="text-anchor:start">未旋转的 q、k = (1, 0)</text>
    <!-- q rotated 30° : (cos30, sin30) = (0.866, 0.5) -> svg y up -->
    <line x1="0" y1="0" x2="77.9" y2="-45" class="q"/>
    <text x="92" y="-50" class="t" fill="#c98a00" style="text-anchor:start">q 转 1·30° = 30°</text>
    <!-- k rotated 120°: (-0.5, 0.866) -->
    <line x1="0" y1="0" x2="-45" y2="-77.9" class="k"/>
    <text x="-52" y="-92" class="t" fill="#5b8def" style="text-anchor:end">k 转 4·30° = 120°</text>
    <!-- arc between 30° and 120°, radius 55 -->
    <path d="M47.6,-27.5 A55,55 0 0 0 -27.5,-47.6" class="arc"/>
    <text x="14" y="-62" class="t" fill="#d32f2f">90°</text>
    <text x="0" y="128" class="s">夹角 120° − 30° = 90°，内积 cos 90° = 0</text>
  </g>

  <!-- ===== right panel: m = 4, n = 7 ===== -->
  <g transform="translate(560,175)">
    <text x="0" y="-130" class="t">整句往后挪 3 个位置：m = 4，n = 7</text>
    <line x1="-110" y1="0" x2="110" y2="0" class="ax"/><line x1="0" y1="-110" x2="0" y2="110" class="ax"/>
    <circle cx="0" cy="0" r="90" class="circ"/>
    <line x1="0" y1="0" x2="90" y2="0" class="q0"/>
    <!-- q rotated 120°: (-0.5, 0.866) -->
    <line x1="0" y1="0" x2="-45" y2="-77.9" class="q"/>
    <text x="-52" y="-92" class="t" fill="#c98a00" style="text-anchor:end">q 转 4·30° = 120°</text>
    <!-- k rotated 210°: (-0.866, -0.5) -->
    <line x1="0" y1="0" x2="-77.9" y2="45" class="k"/>
    <text x="-84" y="62" class="t" fill="#5b8def" style="text-anchor:start">k 转 7·30° = 210°</text>
    <!-- arc between 120° and 210°, radius 55 -->
    <path d="M-27.5,-47.6 A55,55 0 0 0 -47.6,27.5" class="arc"/>
    <text x="-66" y="-6" class="t" fill="#d32f2f">90°</text>
    <text x="0" y="128" class="s">夹角 210° − 120° = 90°，内积仍是 0</text>
  </g>

  <text x="380" y="318" class="s">绝对位置各变了 3，相对位置 n − m = 3 没变，所以 attention 分数不变：这就是 RoPE 要的性质</text>
</svg>
