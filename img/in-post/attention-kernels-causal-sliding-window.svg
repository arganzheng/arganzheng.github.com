<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="t d">
  <title id="t">分块因果掩码与 sliding window 下的 tile 分类</title>
  <desc id="d">左：N = 8 块（B_r = B_c）的因果掩码。Q 块 i 对 K 块 j &lt; i 是完整块，无 mask，纯 GEMM + softmax（主循环第一段）；j = i 是对角块，块内逐元素 mask（主循环第二段）；j &gt; i 的右上部分整块跳过，不读 K/V、不算；FLOPs 与 KV 读取都省约一半。右：再加 sliding window（W = 3 块），Q 块 i 的 K 块 i−3 是左边界块，块内 mask 掉 j &lt; i − W + 1；K 块 i−2、i−1 是完整块；K 块 i 是对角块；更左边与右上都整块跳过。每个 Q 块最多跑 W/B_c + 1 = 4 个 tile，成本从 O(N²) 降为 O(N·W)。</desc>
