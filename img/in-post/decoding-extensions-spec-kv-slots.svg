<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-labelledby="t d">
  <title id="t">连续两步的 KV 槽位（K=3）</title>
  <desc id="d">step t 用 4 个位置验证 d1 d2 d3 并采 bonus，d2 被拒后 num_computed_tokens 回滚到 N+2，脏槽位不清零；step t+1 的 recovered token 和新 draft 直接覆盖这些槽位。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="40" y="24" text-anchor="start" class="bold">step t   调度前 num_computed_tokens = N，draft = [d1 d2 d3]</text><text x="122" y="50" text-anchor="end" class="small">slot</text><text x="166.0" y="50" text-anchor="middle" class="mono">N</text><text x="238.0" y="50" text-anchor="middle" class="mono">N+1</text><text x="310.0" y="50" text-anchor="middle" class="mono">N+2</text><text x="382.0" y="50" text-anchor="middle" class="mono">N+3</text><text x="454.0" y="50" text-anchor="middle" class="mono">N+4</text><text x="526.0" y="50" text-anchor="middle" class="mono">N+5</text><text x="122" y="82" text-anchor="end" class="small">input_ids</text><rect class="seg-freefrag" x="130" y="60" width="72" height="34"/><text x="166.0" y="82.0" text-anchor="middle" class="mono">s</text><rect class="seg-freefrag" x="202" y="60" width="72" height="34"/><text x="238.0" y="82.0" text-anchor="middle" class="mono">d1</text><rect class="seg-freefrag" x="274" y="60" width="72" height="34"/><text x="310.0" y="82.0" text-anchor="middle" class="mono">d2</text><rect class="seg-freefrag" x="346" y="60" width="72" height="34"/><text x="382.0" y="82.0" text-anchor="middle" class="mono">d3</text><rect class="seg-freefrag" x="418" y="60" width="72" height="34"/><rect class="seg-freefrag" x="490" y="60" width="72" height="34"/><text x="572" y="82" text-anchor="start" class="small">s = 上一步采出的 token</text><text x="122" y="116" text-anchor="end" class="small">logits</text><text x="166.0" y="116" text-anchor="middle" class="mono">verify</text><text x="238.0" y="116" text-anchor="middle" class="mono">verify</text><text x="310.0" y="116" text-anchor="middle" class="mono">verify</text><text x="382.0" y="116" text-anchor="middle" class="mono">bonus</text><text x="572" y="116" text-anchor="start" class="small">4 个位置的 logits</text><text x="122" y="136" text-anchor="end" class="small">用途</text><text x="166.0" y="136" text-anchor="middle" class="mono">d1</text><text x="238.0" y="136" text-anchor="middle" class="mono">d2</text><text x="310.0" y="136" text-anchor="middle" class="mono">d3</text><text x="572" y="136" text-anchor="start" class="small">d2 被拒 → recovered r2</text><text x="122" y="156" text-anchor="end" class="small">验证结果</text><text x="166.0" y="156" text-anchor="middle" class="mono">ok</text><text x="238.0" y="156" text-anchor="middle" class="mono">REJ</text><text x="310.0" y="156" text-anchor="middle" class="mono">(skip)</text><text x="382.0" y="156" text-anchor="middle" class="mono">(skip)</text><text x="572" y="156" text-anchor="start" class="small">output = [d1, r2]</text><text x="122" y="176" text-anchor="end" class="small"></text><text x="572" y="176" text-anchor="start" class="small">accepted = 1，rejected = 2</text><text x="40" y="204" text-anchor="start" class="body">update_from_output()：num_computed_tokens = N + 4 − 2 = N + 2 ← “回滚”就是这一行</text><text x="40" y="224" text-anchor="start" class="small">slot N+2 / N+3 里仍是 d2 / d3 写下的 KV，不释放、不清零，只是“当作没算过”</text><text x="40" y="260" text-anchor="start" class="bold">step t+1   num_new_tokens = 1 + 3，slot_mapping 从 N+2 开始</text><text x="122" y="286" text-anchor="end" class="small">slot</text><text x="166.0" y="286" text-anchor="middle" class="mono">N</text><text x="238.0" y="286" text-anchor="middle" class="mono">N+1</text><text x="310.0" y="286" text-anchor="middle" class="mono">N+2</text><text x="382.0" y="286" text-anchor="middle" class="mono">N+3</text><text x="454.0" y="286" text-anchor="middle" class="mono">N+4</text><text x="526.0" y="286" text-anchor="middle" class="mono">N+5</text><text x="122" y="318" text-anchor="end" class="small">input_ids</text><rect class="seg-c" x="130" y="296" width="72" height="34"/><text x="166.0" y="318.0" text-anchor="middle" class="mono">(s)</text><rect class="seg-c" x="202" y="296" width="72" height="34"/><text x="238.0" y="318.0" text-anchor="middle" class="mono">(d1)</text><rect class="seg-a" x="274" y="296" width="72" height="34"/><text x="310.0" y="318.0" text-anchor="middle" class="mono">r2</text><rect class="seg-a" x="346" y="296" width="72" height="34"/><text x="382.0" y="318.0" text-anchor="middle" class="mono">d1'</text><rect class="seg-a" x="418" y="296" width="72" height="34"/><text x="454.0" y="318.0" text-anchor="middle" class="mono">d2'</text><rect class="seg-a" x="490" y="296" width="72" height="34"/><text x="526.0" y="318.0" text-anchor="middle" class="mono">d3'</text><text x="572" y="318" text-anchor="start" class="small">r2 与新 draft 覆盖脏槽位</text><path class="brk" d="M130 322 V328 H274 V322"/><text x="202.0" y="345" text-anchor="middle" class="small">已计算</text><path class="brk" d="M274 322 V328 H562 V322"/><text x="418.0" y="345" text-anchor="middle" class="small">本步 forward 重写这 4 个位置的 KV</text>
</svg>
