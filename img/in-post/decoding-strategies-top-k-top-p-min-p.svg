<text x="380" y="245" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">为什么要截断：尾部几十上百个每个只有千分之一的 token，加起来可能有 5–10% 的总质量——</text>
<text x="380" y="263" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">每 10–20 步就会抽到一个"胡话"token，而且一旦抽到，后面的生成都以它为条件。</text>
