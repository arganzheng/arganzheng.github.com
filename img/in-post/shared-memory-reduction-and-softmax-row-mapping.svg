<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">block-per-row 与 warp-per-row 的线程分配</title><desc id="desc">输入为 R 行 d 列。左边每一行分给一个独立 block，每个 block 的 T 个线程分担 d 个元素；右边以每 block 四个 warp 为例，block 0 的 warp 0 至 3 分别处理行 0 至 3，block 1 的 warp 0 处理行 4，其他行继续分配。</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/></marker></defs>
<style>
text {font-family:"Noto Sans CJK SC","PingFang SC",sans-serif; fill:#1e293b; font-size:13.5px;font-weight:500}
.label {font-size:13.5px} .title {font-size:16px;font-weight:600} .minor {font-size:12.5px; fill:#334155} .mono {font-family:ui-monospace,SFMono-Regular,monospace;font-size:13.5px}
.accent {fill:#1d4ed8;font-weight:600} .tile {fill:#f8fafc;stroke:#cbd5e1;stroke-width:1} .highlight {fill:#dbeafe;stroke:#2563eb;stroke-width:1.2}
.pad {fill:#fff7ed;stroke:#fb923c;stroke-width:1} .miss {fill:#dbeafe;stroke:#2563eb;stroke-width:1} .edge {fill:none;stroke:#2563eb;stroke-width:1.5;stroke-linejoin:round}
.grid {fill:none;stroke:#cbd5e1;stroke-width:1} .divider {fill:none;stroke:#94a3b8;stroke-width:1}
</style>
<text x="18" y="32" text-anchor="start" class="title">输入 [R, d]</text><text x="234" y="32" text-anchor="middle" class="title">block-per-row</text><text x="570" y="32" text-anchor="middle" class="title">warp-per-row</text><text x="127" y="64" text-anchor="start" class="minor">每个 block：T 个线程</text><text x="425" y="64" text-anchor="start" class="minor">示例：4 warp / block，R ≥ 5</text><text x="70" y="108" text-anchor="end" class="label">行 0</text><rect x="112" y="84" width="248" height="40" class="highlight"/><path d="M 78 104 H 112" class="edge" marker-end="url(#tip)"/><text x="125" y="110" text-anchor="start" class="label">block 0</text><text x="70" y="162" text-anchor="end" class="label">行 1</text><rect x="112" y="138" width="248" height="40" class="highlight"/><path d="M 78 158 H 112" class="edge" marker-end="url(#tip)"/><text x="125" y="164" text-anchor="start" class="label">block 1</text><text x="70" y="216" text-anchor="end" class="label">行 2</text><rect x="112" y="192" width="248" height="40" class="highlight"/><path d="M 78 212 H 112" class="edge" marker-end="url(#tip)"/><text x="125" y="218" text-anchor="start" class="label">block 2</text><text x="70" y="270" text-anchor="end" class="label">行 3</text><rect x="112" y="246" width="248" height="40" class="highlight"/><path d="M 78 266 H 112" class="edge" marker-end="url(#tip)"/><text x="125" y="272" text-anchor="start" class="label">block 3</text><text x="70" y="324" text-anchor="end" class="label">行 4</text><rect x="112" y="300" width="248" height="40" class="highlight"/><path d="M 78 320 H 112" class="edge" marker-end="url(#tip)"/><text x="125" y="326" text-anchor="start" class="label">block 4</text><text x="70" y="386" text-anchor="end" class="label">⋮</text><text x="125" y="386" text-anchor="start" class="label">⋮</text><rect x="410" y="79" width="320" height="197" class="tile"/><text x="425" y="102" text-anchor="start" class="accent">block 0</text><text x="519" y="127" text-anchor="end" class="label">warp 0</text><path d="M 528 123 H 629" class="edge" marker-end="url(#tip)"/><rect x="629" y="109" width="79" height="29" class="highlight"/><text x="668" y="129" text-anchor="middle" class="label">行 0</text><text x="519" y="166" text-anchor="end" class="label">warp 1</text><path d="M 528 162 H 629" class="edge" marker-end="url(#tip)"/><rect x="629" y="148" width="79" height="29" class="highlight"/><text x="668" y="168" text-anchor="middle" class="label">行 1</text><text x="519" y="205" text-anchor="end" class="label">warp 2</text><path d="M 528 201 H 629" class="edge" marker-end="url(#tip)"/><rect x="629" y="187" width="79" height="29" class="highlight"/><text x="668" y="207" text-anchor="middle" class="label">行 2</text><text x="519" y="244" text-anchor="end" class="label">warp 3</text><path d="M 528 240 H 629" class="edge" marker-end="url(#tip)"/><rect x="629" y="226" width="79" height="29" class="highlight"/><text x="668" y="246" text-anchor="middle" class="label">行 3</text><rect x="410" y="286" width="320" height="51" class="tile"/><text x="425" y="307" text-anchor="start" class="accent">block 1</text><text x="519" y="326" text-anchor="end" class="label">warp 0</text><path d="M 528 319 H 629" class="edge" marker-end="url(#tip)"/><rect x="629" y="304" width="79" height="29" class="highlight"/><text x="668" y="324" text-anchor="middle" class="label">行 4</text><text x="425" y="386" text-anchor="start" class="minor">⋮</text>
</svg>
