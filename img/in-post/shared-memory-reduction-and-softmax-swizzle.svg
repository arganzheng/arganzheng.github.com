<svg xmlns="http://www.w3.org/2000/svg" width="760" height="431" viewBox="0 0 760 431" role="img" aria-labelledby="title desc">
<title id="title">8×8 tile 的 swizzle 布局</title><desc id="desc">每行按行号与逻辑列异或确定物理列，所有行仍占满八个 bank。高亮的逻辑列零沿对角线落在八个不同 bank。</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/></marker></defs>
<style>
