<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">FP32 / FP16 / BF16 的位布局：BF16 就是 FP32 的高 16 位</text><text x="112" y="68" fill="#222" font-size="12" text-anchor="end" font-weight="600">FP32</text><rect x="120" y="50" width="14" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="127.0" y="67" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">S</text><rect x="134" y="50" width="112" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="190.0" y="67" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">exp（8）</text><rect x="246" y="50" width="322" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="407.0" y="67" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mantissa（23）</text><text x="578" y="67" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal"></text><text x="120" y="92" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 + 8 + 23 = 32 bit；范围 ~1e-38 .. 3e38，~7 位十进制精度</text><text x="112" y="128" fill="#222" font-size="12" text-anchor="end" font-weight="600">FP16</text><rect x="120" y="110" width="14" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="127.0" y="127" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">S</text><rect x="134" y="110" width="70" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="169.0" y="127" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">exp（5）</text><rect x="204" y="110" width="140" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="274.0" y="127" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mant（10）</text><text x="354" y="127" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 + 5 + 10 = 16 bit；范围 ~6e-5 .. 65504（易溢出 / 下溢），~3 位十进制精度</text><text x="112" y="178" fill="#222" font-size="12" text-anchor="end" font-weight="600">BF16</text><rect x="120" y="160" width="14" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="127.0" y="177" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">S</text><rect x="134" y="160" width="112" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="190.0" y="177" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">exp（8）</text><rect x="246" y="160" width="98" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="295.0" y="177" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mant（7）</text><text x="354" y="177" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 + 8 + 7 = 16 bit；指数位和 FP32 一样，范围相同；~2 位十进制精度</text><text x="112" y="233" fill="#222" font-size="12" text-anchor="end" font-weight="600">FP32</text><rect x="120" y="215" width="14" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="127.0" y="232" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">S</text><rect x="134" y="215" width="112" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="190.0" y="232" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">exp（8）</text><rect x="246" y="215" width="98" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="295.0" y="232" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mant 高 7（7）</text><rect x="344" y="215" width="224" height="26" fill="#f3f3f3" stroke="#555" stroke-width="1" rx="0"/><text x="456.0" y="232" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mant 低 16 位（16）</text><text x="578" y="232" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal"></text><line x1="120" y1="250" x2="344" y2="250" stroke="#1f6fb2" stroke-width="2"/><text x="232" y="264" fill="#1f6fb2" font-size="10.5" text-anchor="middle" font-weight="600">BF16 保留的 16 位</text><line x1="344" y1="250" x2="568" y2="250" stroke="#999" stroke-width="2"/><text x="456" y="264" fill="#666" font-size="10.5" text-anchor="middle" font-weight="normal">转换时按这 16 位舍入（round-to-nearest-even）</text><text x="380" y="292" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">FP32 → BF16 是"砍掉低 16 位并舍入"，所以范围不变、精度从 7 位掉到 2 位；FP32 → FP16 要重编指数，大数溢出成 inf、小数下溢成 0。</text>
</svg>
