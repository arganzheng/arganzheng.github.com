<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">训练的一步：一句话的 T 个位置同时各预测下一个 token，得到 T 个 loss，反向一次更新全部参数</text><text x="52" y="78" fill="#333" font-size="11" text-anchor="end" font-weight="600">输入 x</text><rect x="60" y="60" width="86" height="28" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="4"/><text x="103.0" y="79" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">The</text><text x="103.0" y="54" fill="#888" font-size="9.5" text-anchor="middle" font-weight="normal">位置 0</text><rect x="152" y="60" width="86" height="28" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="4"/><text x="195.0" y="79" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">cat</text><text x="195.0" y="54" fill="#888" font-size="9.5" text-anchor="middle" font-weight="normal">位置 1</text><rect x="244" y="60" width="86" height="28" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="4"/><text x="287.0" y="79" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">sat</text><text x="287.0" y="54" fill="#888" font-size="9.5" text-anchor="middle" font-weight="normal">位置 2</text><rect x="336" y="60" width="86" height="28" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="4"/><text x="379.0" y="79" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">on</text><text x="379.0" y="54" fill="#888" font-size="9.5" text-anchor="middle" font-weight="normal">位置 3</text><rect x="428" y="60" width="86" height="28" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="4"/><text x="471.0" y="79" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">the</text><text x="471.0" y="54" fill="#888" font-size="9.5" text-anchor="middle" font-weight="normal">位置 4</text><rect x="60" y="106" width="454" height="54" fill="#fafbfd" stroke="#999" stroke-width="1.2" rx="6"/><text x="287.0" y="128" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">一次前向：embedding → 12 个 block（causal mask：位置 i 只看 0..i）→ lm_head</text><text x="287.0" y="148" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">输出 logits [T, V]：每个位置一个词表分布——T 个预测同时算出</text><line x1="103.0" y1="88" x2="103.0" y2="106" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="103.0" y1="160" x2="103.0" y2="180" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="195.0" y1="88" x2="195.0" y2="106" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="195.0" y1="160" x2="195.0" y2="180" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="287.0" y1="88" x2="287.0" y2="106" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="287.0" y1="160" x2="287.0" y2="180" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="379.0" y1="88" x2="379.0" y2="106" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="379.0" y1="160" x2="379.0" y2="180" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="471.0" y1="88" x2="471.0" y2="106" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><line x1="471.0" y1="160" x2="471.0" y2="180" stroke="#1f6fb2" stroke-width="1" marker-end="url(#ar)"/><text x="52" y="200" fill="#333" font-size="11" text-anchor="end" font-weight="600">预测</text><rect x="60" y="182" width="86" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4"/><text x="103.0" y="201" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">p(·|The)</text><rect x="152" y="182" width="86" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4"/><text x="195.0" y="201" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">p(·|The cat)</text><rect x="244" y="182" width="86" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4"/><text x="287.0" y="201" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">p(·|…sat)</text><rect x="336" y="182" width="86" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4"/><text x="379.0" y="201" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">p(·|…on)</text><rect x="428" y="182" width="86" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4"/><text x="471.0" y="201" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">p(·|…the)</text><text x="52" y="250" fill="#333" font-size="11" text-anchor="end" font-weight="600">目标 y</text><rect x="60" y="232" width="86" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="103.0" y="251" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">cat</text><line x1="103.0" y1="210" x2="103.0" y2="232" stroke="#999" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="152" y="232" width="86" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="195.0" y="251" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">sat</text><line x1="195.0" y1="210" x2="195.0" y2="232" stroke="#999" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="244" y="232" width="86" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="287.0" y="251" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">on</text><line x1="287.0" y1="210" x2="287.0" y2="232" stroke="#999" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="336" y="232" width="86" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="379.0" y="251" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">the</text><line x1="379.0" y1="210" x2="379.0" y2="232" stroke="#999" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="428" y="232" width="86" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="471.0" y="251" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">mat</text><line x1="471.0" y1="210" x2="471.0" y2="232" stroke="#999" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><text x="524" y="251" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">= 输入右移一位</text><text x="52" y="292" fill="#333" font-size="11" text-anchor="end" font-weight="600">loss</text><rect x="60" y="274" width="86" height="26" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="4"/><text x="103.0" y="292" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">−log p0(y0)</text><rect x="152" y="274" width="86" height="26" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="4"/><text x="195.0" y="292" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">−log p1(y1)</text><rect x="244" y="274" width="86" height="26" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="4"/><text x="287.0" y="292" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">−log p2(y2)</text><rect x="336" y="274" width="86" height="26" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="4"/><text x="379.0" y="292" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">−log p3(y3)</text><rect x="428" y="274" width="86" height="26" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="4"/><text x="471.0" y="292" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">−log p4(y4)</text><text x="524" y="292" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">→ 平均 = 这一步的 loss</text><line x1="670" y1="274" x2="670" y2="106" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="680" y="180" fill="#c0392b" font-size="11" text-anchor="start" font-weight="600">反向传播</text><text x="680" y="196" fill="#c0392b" font-size="10" text-anchor="start" font-weight="normal">沿同一条路走回去</text><text x="680" y="210" fill="#c0392b" font-size="10" text-anchor="start" font-weight="normal">每个参数得到 .grad</text><text x="60" y="330" fill="#333" font-size="11" text-anchor="start" font-weight="normal">为什么可以一次算 T 个：causal mask 保证位置 i 的预测只用了 token 0..i，与推理时「只有前文」的情形完全一致；</text><text x="60" y="348" fill="#333" font-size="11" text-anchor="start" font-weight="normal">目标直接取真实的下一个 token 而不是模型自己刚预测的（teacher forcing），T 个位置互不依赖，所以能并行。</text><text x="60" y="372" fill="#666" font-size="11" text-anchor="start" font-weight="normal">之后 optimizer.step()：每个参数沿 .grad 走一小步（AdamW）；一步结束，换下一个 batch。</text>
</svg>
