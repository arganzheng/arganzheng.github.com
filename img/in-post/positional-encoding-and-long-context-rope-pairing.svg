<svg xmlns="http://www.w3.org/2000/svg" width="740" height="302" viewBox="0 0 740 302" role="img" aria-labelledby="t d">
<title id="t">RoPE 两种维度配对的布局对照</title>
<desc id="d">d_head = 128。原论文把相邻两维 (x_2i, x_2i+1) 配成第 i 对；HF rotate_half 把前一半第 i 维与后一半第 i 维 (x_i, x_i+64) 配成第 i 对。同色两格共用同一个 θ_i。</desc>
<style>text{font-family:-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;font-size:13px;fill:#222} .h{font-size:13px;font-weight:600} .c{text-anchor:middle} .n{text-anchor:middle;font-size:11px;fill:#666}</style>
<rect width="740" height="302" fill="#fff"/>
<text class="h" x="120" y="30">原论文（相邻配对）：第 i 对 = (x₂ᵢ, x₂ᵢ₊₁)</text>
<rect x="124.0" y="48" width="50" height="30" fill="#d6e9f5" stroke="#0072B2"/>
<text class="c" x="149.0" y="67.0">x₀</text>
<rect x="174.0" y="48" width="50" height="30" fill="#d6e9f5" stroke="#0072B2"/>
<text class="c" x="199.0" y="67.0">x₁</text>
<path d="M128.0 84 V90 H220.0 V84" fill="none" stroke="#0072B2" stroke-width="1.5"/>
<line x1="174.0" y1="90" x2="174.0" y2="94" stroke="#0072B2" stroke-width="1.5"/>
<text class="c" x="174.0" y="110" fill="#0072B2">θ₀</text>
<rect x="238.0" y="48" width="50" height="30" fill="#fbecc9" stroke="#E69F00"/>
<text class="c" x="263.0" y="67.0">x₂</text>
<rect x="288.0" y="48" width="50" height="30" fill="#fbecc9" stroke="#E69F00"/>
<text class="c" x="313.0" y="67.0">x₃</text>
<path d="M242.0 84 V90 H334.0 V84" fill="none" stroke="#E69F00" stroke-width="1.5"/>
<line x1="288.0" y1="90" x2="288.0" y2="94" stroke="#E69F00" stroke-width="1.5"/>
<text class="c" x="288.0" y="110" fill="#E69F00">θ₁</text>
<rect x="352.0" y="48" width="50" height="30" fill="#cceee4" stroke="#009E73"/>
<text class="c" x="377.0" y="67.0">x₄</text>
<rect x="402.0" y="48" width="50" height="30" fill="#cceee4" stroke="#009E73"/>
<text class="c" x="427.0" y="67.0">x₅</text>
<path d="M356.0 84 V90 H448.0 V84" fill="none" stroke="#009E73" stroke-width="1.5"/>
<line x1="402.0" y1="90" x2="402.0" y2="94" stroke="#009E73" stroke-width="1.5"/>
<text class="c" x="402.0" y="110" fill="#009E73">θ₂</text>
<text class="c" x="484.0" y="67.0">…</text>
<rect x="516.0" y="48" width="50" height="30" fill="#f4dfeb" stroke="#CC79A7"/>
<text class="c" x="541.0" y="67.0">x₁₂₆</text>
<rect x="566.0" y="48" width="50" height="30" fill="#f4dfeb" stroke="#CC79A7"/>
<text class="c" x="591.0" y="67.0">x₁₂₇</text>
<path d="M520.0 84 V90 H612.0 V84" fill="none" stroke="#CC79A7" stroke-width="1.5"/>
<line x1="566.0" y1="90" x2="566.0" y2="94" stroke="#CC79A7" stroke-width="1.5"/>
<text class="c" x="566.0" y="110" fill="#CC79A7">θ₆₃</text>
<text class="h" x="120" y="146">HF rotate_half（前后半配对）：第 i 对 = (xᵢ, xᵢ₊₆₄)</text>
<rect x="120.0" y="212" width="50" height="30" fill="#d6e9f5" stroke="#0072B2"/>
<text class="c" x="145.0" y="231.0">x₀</text>
<text class="c" x="145.0" y="262" fill="#0072B2">θ₀</text>
<rect x="170.0" y="212" width="50" height="30" fill="#fbecc9" stroke="#E69F00"/>
<text class="c" x="195.0" y="231.0">x₁</text>
<text class="c" x="195.0" y="262" fill="#E69F00">θ₁</text>
<rect x="220.0" y="212" width="50" height="30" fill="#cceee4" stroke="#009E73"/>
<text class="c" x="245.0" y="231.0">x₂</text>
<text class="c" x="245.0" y="262" fill="#009E73">θ₂</text>
<text class="c" x="288.0" y="231.0">…</text>
<rect x="306.0" y="212" width="50" height="30" fill="#f4dfeb" stroke="#CC79A7"/>
