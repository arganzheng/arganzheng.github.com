<text class="c" x="331.0" y="262" fill="#CC79A7">θ₆₃</text>
<rect x="384.0" y="212" width="50" height="30" fill="#d6e9f5" stroke="#0072B2"/>
<text class="c" x="409.0" y="231.0">x₆₄</text>
<text class="c" x="409.0" y="262" fill="#0072B2">θ₀</text>
<rect x="434.0" y="212" width="50" height="30" fill="#fbecc9" stroke="#E69F00"/>
<text class="c" x="459.0" y="231.0">x₆₅</text>
<text class="c" x="459.0" y="262" fill="#E69F00">θ₁</text>
<rect x="484.0" y="212" width="50" height="30" fill="#cceee4" stroke="#009E73"/>
<text class="c" x="509.0" y="231.0">x₆₆</text>
<text class="c" x="509.0" y="262" fill="#009E73">θ₂</text>
<text class="c" x="552.0" y="231.0">…</text>
<rect x="570.0" y="212" width="50" height="30" fill="#f4dfeb" stroke="#CC79A7"/>
<text class="c" x="595.0" y="231.0">x₁₂₇</text>
<text class="c" x="595.0" y="262" fill="#CC79A7">θ₆₃</text>
<line x1="370.0" y1="204" x2="370.0" y2="272" stroke="#888" stroke-dasharray="4 3"/>
<text class="n" x="370.0" y="288">d_head/2 = 64</text>
<path d="M331.0 212 V196 H595.0 V212" fill="none" stroke="#CC79A7" stroke-width="1.5"/>
<path d="M245.0 212 V185 H509.0 V212" fill="none" stroke="#009E73" stroke-width="1.5"/>
<path d="M195.0 212 V174 H459.0 V212" fill="none" stroke="#E69F00" stroke-width="1.5"/>
