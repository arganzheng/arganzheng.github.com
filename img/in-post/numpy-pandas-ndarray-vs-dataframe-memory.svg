<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">ndarray 与 DataFrame：逻辑上都像"一张表"，内存里完全不同</text><text x="40" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">ndarray　shape (4, 3)，dtype float32</text><rect x="40" y="60" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="66.0" y="75.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.91</text><rect x="92" y="60" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="118.0" y="75.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.12</text><rect x="144" y="60" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="170.0" y="75.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.55</text><rect x="40" y="84" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="66.0" y="99.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.30</text><rect x="92" y="84" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="118.0" y="99.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.77</text><rect x="144" y="84" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="170.0" y="99.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.08</text><rect x="40" y="108" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="66.0" y="123.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.64</text><rect x="92" y="108" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="118.0" y="123.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.49</text><rect x="144" y="108" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="170.0" y="123.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.21</text><rect x="40" y="132" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="66.0" y="147.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.05</text><rect x="92" y="132" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="118.0" y="147.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.83</text><rect x="144" y="132" width="52" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="170.0" y="147.675" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.97</text><text x="34" y="72" fill="#666" font-size="9" text-anchor="end" font-weight="normal">[0]</text><text x="34" y="96" fill="#666" font-size="9" text-anchor="end" font-weight="normal">[1]</text><text x="34" y="120" fill="#666" font-size="9" text-anchor="end" font-weight="normal">[2]</text><text x="34" y="144" fill="#666" font-size="9" text-anchor="end" font-weight="normal">[3]</text><text x="118" y="172" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">逻辑视图：按位置取 x[3, 2] = 0.97</text><text x="40" y="192" fill="#333" font-size="11" text-anchor="start" font-weight="600">内存：一整块连续的 float32，12 × 4 B = 48 B</text><rect x="40" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="53" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.91</text><rect x="66" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="79" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.12</text><rect x="92" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="105" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.55</text><rect x="118" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="131" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.30</text><rect x="144" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="157" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.77</text><rect x="170" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="183" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.08</text><rect x="196" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="209" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.64</text><rect x="222" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="235" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.49</text><rect x="248" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="261" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.21</text><rect x="274" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="287" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.05</text><rect x="300" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="313" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.83</text><rect x="326" y="200" width="26" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="339" y="214" fill="#333" font-size="7.5" text-anchor="middle" font-weight="normal">0.97</text><text x="40" y="236" fill="#666" font-size="10" text-anchor="start" font-weight="normal">x[i, j] 在第 i*3 + j 个格子（stride = (3, 1)）；整块同一类型，</text><text x="40" y="250" fill="#666" font-size="10" text-anchor="start" font-weight="normal">所以矩阵乘、沿轴求和可以直接交给 BLAS / 向量指令。</text><text x="400" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">DataFrame　4 行 × 3 列，每列自己的 dtype</text><rect x="440" y="60" width="96" height="20" fill="#e9ecef" stroke="#999" stroke-width="1" rx="0"/><text x="488" y="74" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">category</text><rect x="440" y="80" width="96" height="24" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="488" y="96" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">math</text><rect x="440" y="104" width="96" height="24" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="488" y="120" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">code</text><rect x="440" y="128" width="96" height="24" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="488" y="144" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">math</text><rect x="440" y="152" width="96" height="24" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="488" y="168" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">qa</text><rect x="540" y="60" width="96" height="20" fill="#e9ecef" stroke="#999" stroke-width="1" rx="0"/><text x="588" y="74" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">correct</text><rect x="540" y="80" width="96" height="24" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="588" y="96" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">True</text><rect x="540" y="104" width="96" height="24" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="588" y="120" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">False</text><rect x="540" y="128" width="96" height="24" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="588" y="144" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">True</text><rect x="540" y="152" width="96" height="24" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="588" y="168" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">True</text><rect x="640" y="60" width="96" height="20" fill="#e9ecef" stroke="#999" stroke-width="1" rx="0"/><text x="688" y="74" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">score</text><rect x="640" y="80" width="96" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="688" y="96" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.91</text><rect x="640" y="104" width="96" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="688" y="120" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.30</text><rect x="640" y="128" width="96" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="688" y="144" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.64</text><rect x="640" y="152" width="96" height="24" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="688" y="168" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">0.05</text><rect x="400" y="80" width="36" height="24" fill="#f3f3f3" stroke="#999" stroke-width="1" rx="0"/><text x="418" y="96" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">q1</text><rect x="400" y="104" width="36" height="24" fill="#f3f3f3" stroke="#999" stroke-width="1" rx="0"/><text x="418" y="120" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">q2</text><rect x="400" y="128" width="36" height="24" fill="#f3f3f3" stroke="#999" stroke-width="1" rx="0"/><text x="418" y="144" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">q3</text><rect x="400" y="152" width="36" height="24" fill="#f3f3f3" stroke="#999" stroke-width="1" rx="0"/><text x="418" y="168" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">q4</text><text x="418" y="74" fill="#666" font-size="9.5" text-anchor="middle" font-weight="normal">index</text><text x="570" y="194" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">逻辑视图：按名字取 df.loc["q3", "score"] = 0.64</text><text x="400" y="212" fill="#333" font-size="11" text-anchor="start" font-weight="600">内存：每一列是独立的一维数组（各自的 dtype），外加一个 index</text><text x="400" y="234" fill="#333" font-size="9.5" text-anchor="start" font-weight="normal">category</text><rect x="470" y="220" width="40" height="20" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="490" y="234" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">math</text><rect x="510" y="220" width="40" height="20" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="530" y="234" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">code</text><rect x="550" y="220" width="40" height="20" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="570" y="234" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">math</text><rect x="590" y="220" width="40" height="20" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="610" y="234" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">qa</text><text x="636" y="234" fill="#666" font-size="9" text-anchor="start" font-weight="normal">object（字符串）</text><text x="400" y="260" fill="#333" font-size="9.5" text-anchor="start" font-weight="normal">correct</text><rect x="470" y="246" width="40" height="20" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="490" y="260" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">True</text><rect x="510" y="246" width="40" height="20" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="530" y="260" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">False</text><rect x="550" y="246" width="40" height="20" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="570" y="260" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">True</text><rect x="590" y="246" width="40" height="20" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="610" y="260" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">True</text><text x="636" y="260" fill="#666" font-size="9" text-anchor="start" font-weight="normal">bool</text><text x="400" y="286" fill="#333" font-size="9.5" text-anchor="start" font-weight="normal">score</text><rect x="470" y="272" width="40" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="490" y="286" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">0.91</text><rect x="510" y="272" width="40" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="530" y="286" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">0.30</text><rect x="550" y="272" width="40" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="570" y="286" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">0.64</text><rect x="590" y="272" width="40" height="20" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="610" y="286" fill="#333" font-size="8.5" text-anchor="middle" font-weight="normal">0.05</text><text x="636" y="286" fill="#666" font-size="9" text-anchor="start" font-weight="normal">float64</text><text x="400" y="316" fill="#666" font-size="10" text-anchor="start" font-weight="normal">df["score"].to_numpy() 拿到的就是第三条——一个普通 ndarray；</text><text x="400" y="330" fill="#666" font-size="10" text-anchor="start" font-weight="normal">groupby("category") 是按第一条的标签把其他列分组，即 SQL 的 GROUP BY。</text>
</svg>
