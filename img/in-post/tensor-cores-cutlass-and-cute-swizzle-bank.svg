<rect width="760" height="422" fill="#fff"/>
<text x="20.0" y="22.0" font-size="13" text-anchor="start" fill="#111">一行 64 B = 4 个 16 B chunk；shared 的 32 个 bank 分成 8 个 bank 组（每组 16 B）</text>
<text x="20.0" y="44.0" font-size="13" text-anchor="start" fill="#111">第 r 行第 p 个物理 chunk 落在 bank 组 (4r + p) mod 8</text>
