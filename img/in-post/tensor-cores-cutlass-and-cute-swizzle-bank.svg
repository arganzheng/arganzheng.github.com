<svg xmlns="http://www.w3.org/2000/svg" width="760" height="422" viewBox="0 0 760 422" role="img" aria-labelledby="t d">
<title id="t">不 swizzle 与 swizzle 下 8 行 chunk 的 bank 组</title>
<desc id="d">两个 8 行 × 4 个物理 chunk 的网格，格里写 bank 组 (4r+p) mod 8，深色是一个 phase 里 8 个 lane 读到的逻辑 chunk 0。不 swizzle 时 8 行都读物理 chunk 0，bank 组 0、4 交替，只用到两个组，4 路 conflict。swizzle 后物理 chunk = 0 ^ ((r&gt;&gt;1)&amp;3)，依次是 0,0,1,1,2,2,3,3，bank 组 0,4,1,5,2,6,3,7，8 个不同的组，无 conflict。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-weight:600}</style>
