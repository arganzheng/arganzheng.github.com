<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" role="img" aria-labelledby="t d">
  <title id="t">Medusa：多个 head 同时预测</title>
  <desc id="d">同一个 hidden state 送进多个 Medusa Head，各自给出未来不同位置的候选，组织成 Candidate Tree 后由 Target 一次验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect class="compute" x="240" y="16" width="280" height="44"/><text x="380.0" y="43" text-anchor="middle" class="bold">Target Model</text><line x1="380" y1="60" x2="380" y2="86" class="arrow"/><rect class="card" x="240" y="86" width="280" height="40"/><text x="380.0" y="111" text-anchor="middle" class="body">Hidden State</text><path d="M380 126 V146 H150 V166" class="arrow"/><path d="M380 146 V166" class="arrow"/><path d="M380 146 H610 V166" class="arrow"/><rect class="memory" x="60" y="166" width="180" height="40"/><text x="150.0" y="191" text-anchor="middle" class="bold">Medusa Head 1</text><line x1="150" y1="206" x2="150" y2="232" class="arrow"/><rect class="card" x="80" y="232" width="140" height="36"/><text x="150.0" y="255" text-anchor="middle" class="small">candidates</text><rect class="memory" x="290" y="166" width="180" height="40"/><text x="380.0" y="191" text-anchor="middle" class="bold">Medusa Head 2</text><line x1="380" y1="206" x2="380" y2="232" class="arrow"/><rect class="card" x="310" y="232" width="140" height="36"/><text x="380.0" y="255" text-anchor="middle" class="small">candidates</text><rect class="memory" x="520" y="166" width="180" height="40"/><text x="610.0" y="191" text-anchor="middle" class="bold">Medusa Head 3</text><line x1="610" y1="206" x2="610" y2="232" class="arrow"/><rect class="card" x="540" y="232" width="140" height="36"/><text x="610.0" y="255" text-anchor="middle" class="small">candidates</text><path d="M150 268 V288 H380 V308" class="arrow"/><path d="M380 268 V308" class="arrow"/><path d="M610 268 V288 H380" class="line"/><rect class="card" x="240" y="308" width="280" height="40"/><text x="380.0" y="333" text-anchor="middle" class="bold">Candidate Tree</text><line x1="380" y1="348" x2="380" y2="374" class="arrow"/><rect class="compute" x="240" y="374" width="280" height="44"/><text x="380.0" y="401" text-anchor="middle" class="bold">Target Verification</text>
</svg>
