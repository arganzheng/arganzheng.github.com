xt x="230" y="186" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">← 底层存储，6 个格子</text><line x1="62" y1="108" x2="55" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><line x1="106" y1="108" x2="85" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><line x1="150" y1="108" x2="115" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><line x1="62" y1="138" x2="145" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><line x1="106" y1="138" x2="175" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><line x1="150" y1="138" x2="205" y2="168" stroke="#1f6fb2" stroke-width="0.8" marker-end="url(#ar)"/><text x="40" y="230" fill="#333" font-size="11" text-anchor="start" font-weight="600">stride = (3, 1)：位置 = i·3 + j·1</text><text x="40" y="248" fill="#666" font-size="10" text-anchor="start" font-weight="normal">行优先连续：一行的三个数挨在一起，x[1,0] 在第 3 格</text><text x="420" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">y = torch.tensor([[1,4],[2,5],[3,6]]).t()</text><text x="420" y="70" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">逻辑视图 [i, j]</text><rect x="420" y="78" width="44" height="30" fill="#fff" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="442" y="97" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">1</text><text x="442" y="87" fill="#999" font-size="7.5" text-anchor="middle" font-weight="normal">[0,0]</text><rect x="464" y="78" width="44" height="30" fill="#fff" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="486" y="97" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">2</text><text x="486" y="87" fill="#999" font-size="7.5" text-anchor="middle" font-weight="normal">[0,1]</text><rect x="508" y="78" width="44" height="30" fill="#fff" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="530" y="97" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">