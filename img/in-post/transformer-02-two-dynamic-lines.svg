<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="460" y="24" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">同一台模型的两条动态线：训练是「前向 → loss → 反向 → 更新」的循环，推理是「一次 prefill + 逐个 decode」</text><rect x="24" y="44" width="422" height="420" fill="#fbfcfe" stroke="#c9d6e6" stroke-width="1" rx="8"/><rect x="474" y="44" width="422" height="420" fill="#fbfdfb" stroke="#cfe3d2" stroke-width="1" rx="8"/><text x="235.0" y="66" fill="#1f6fb2" font-size="13" text-anchor="middle" font-weight="600">训练（参数在变）</text><text x="685.0" y="66" fill="#4d9a5c" font-size="13" text-anchor="middle" font-weight="600">推理（参数冻结）</text><rect x="40" y="82" width="390" height="46" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="235.0" y="101" fill="#222" font-size="12" text-anchor="middle" font-weight="600">① 取一个 batch</text><text x="235.0" y="119" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">[B, T+1] 个连续 token → 输入 x 与右移一位的目标 y</text><line x1="235.0" y1="128" x2="235.0" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="40" y="150" width="390" height="46" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="235.0" y="169" fill="#222" font-size="12" text-anchor="middle" font-weight="600">② 前向</text><text x="235.0" y="187" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">[B, T] → [B, T, d] → … → logits [B, T, V]，沿路保存激活值</text><line x1="235.0" y1="196" x2="235.0" y2="216" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="40" y="218" width="390" height="46" fill="#fdeeee" stroke="#c0392b" stroke-width="1.3" rx="6"/><text x="235.0" y="237" fill="#222" font-size="12" text-anchor="middle" font-weight="600">③ loss</text><text x="235.0" y="255" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">B × T 个位置各一个交叉熵，取平均成一个标量</text><line x1="235.0" y1="264" x2="235.0" y2="284" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="40" y="286" width="390" height="46" fill="#fdeeee" stroke="#c0392b" stroke-width="1.3" rx="6"/><text x="235.0" y="305" fill="#222" font-size="12" text-anchor="middle" font-weight="600">④ 反向</text><text x="235.0" y="323" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">沿原路走回去，每个参数得到同形状的 .grad，激活值用完释放</text><line x1="235.0" y1="332" x2="235.0" y2="352" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="40" y="354" width="390" height="46" fill="#fff4e0" stroke="#c98a00" stroke-width="1.3" rx="6"/><text x="235.0" y="373" fill="#222" font-size="12" text-anchor="middle" font-weight="600">⑤ AdamW 更新</text><text x="235.0" y="391" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">每个参数沿梯度反方向挪一小步；zero_grad</text><path d="M40,377.0 L30,377.0 L30,105.0 L38,105.0" fill="none" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><text x="235.0" y="426" fill="#888" font-size="10.5" text-anchor="middle" font-weight="normal">换下一个 batch 回到 ①，几十万步之后就是一个语言模型</text><rect x="490" y="82" width="390" height="46" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.3" rx="6"/><text x="685.0" y="101" fill="#222" font-size="12" text-anchor="middle" font-weight="600">① 用户的 prompt</text><text x="685.0" y="119" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">[1, T] 个 token，一次性全部已知</text><line x1="685.0" y1="128" x2="685.0" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="490" y="150" width="390" height="46" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.3" rx="6"/><text x="685.0" y="169" fill="#222" font-size="12" text-anchor="middle" font-weight="600">② prefill</text><text x="685.0" y="187" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">T 个位置一次前向（同训练的前向），每层的 K、V 写进 cache</text><line x1="685.0" y1="196" x2="685.0" y2="216" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="490" y="218" width="390" height="46" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.3" rx="6"/><text x="685.0" y="237" fill="#222" font-size="12" text-anchor="middle" font-weight="600">③ 采样</text><text x="685.0" y="255" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">只取最后一个位置的分布，按温度 / top-k 抽出 1 个新 token</text><line x1="685.0" y1="264" x2="685.0" y2="284" stroke="#666" stroke-width="1.4" marker-end="url(#ar)"/><rect x="490" y="286" width="390" height="46" fill="#fff4e0" stroke="#c98a00" stroke-width="1.3" rx="6"/><text x="685.0" y="305" fill="#222" font-size="12" text-anchor="middle" font-weight="600">④ decode</text><text x="685.0" y="323" fill="#555" font-size="10.5" text-anchor="middle" font-weight="normal">只把这 1 个 token 喂进去 [1, 1]，读 cache 里全部 K、V，追加自己的</text><path d="M880,309.0 L890,309.0 L890,241.0 L882,241.0" fill="none" stroke="#c98a00" stroke-width="1.5" marker-end="url(#ar)"/><text x="685.0" y="358" fill="#888" font-size="10.5" text-anchor="middle" font-weight="normal">③ ↔ ④ 循环，每圈吐出 1 个 token，直到 EOS 或长度上限</text><text x="685.0" y="376" fill="#888" font-size="10.5" text-anchor="middle" font-weight="normal">第一个字等 prefill（TTFT），之后每个字等一次 decode（TPOT）</text><text x="235.0" y="446" fill="#333" font-size="11" text-anchor="middle" font-weight="600">显存大头：参数 + 梯度 + 优化器状态 + 激活值</text><text x="685.0" y="446" fill="#333" font-size="11" text-anchor="middle" font-weight="600">显存大头：参数 + KV cache</text>
</svg>
