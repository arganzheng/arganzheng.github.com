<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}]]></style>
<title id="t">共置同步的一步时间线（64 卡）</title>
  <desc id="d">横轴是时间，按秒成比例（切与同步两条竖线不到 1 秒）。GPU 行：生成 602 秒，其中吞吐部分 406 秒全部卡都在跑，长尾 196 秒里在跑的序列越来越少、其余卡空转；切 0.2 秒；前向 72 秒；训练 136 秒；同步 0.3 秒。显存行：生成时是推理权重 16 GB 加 KV 池 56 GB，切的时刻 KV 池换成训练状态回卡，前向与训练时是训练状态 2 GB 加 ref 0.25 GB 加激活。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .bold { font-size: 14px; font-weight: 400; }
      .small { font-size: 13px; }
      .sub { font-size: 10px; }
      .mono { font-family:'SvgMono', "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .monob { font-family:'SvgMono', "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 400; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; }
      .stair { fill: #dbe8fb; stroke: none; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .wall { stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>
<path d="M65.0 45 V55 M65.0 50 H571.4 M571.4 45 V55" class="line" />
<text x="318.2" y="41.0" text-anchor="middle" class="small">生成 602 s</text>
<path d="M573.4 45 V55 M573.4 50 H632.2 M632.2 45 V55" class="line" />
<text x="602.8" y="41.0" text-anchor="middle" class="small">前向 72 s</text>
<path d="M634.2 45 V55 M634.2 50 H747.0 M747.0 45 V55" class="line" />
<text x="690.6" y="41.0" text-anchor="middle" class="small">训练 136 s</text>
<text x="572.4" y="18.0" text-anchor="middle" class="small">切 0.2 s</text>
<text x="748.0" y="18.0" text-anchor="end" class="small">同步 0.3 s</text>
<text x="16.0" y="99.0" text-anchor="start" class="bold">GPU</text>
<rect class="seg-a" x="64.0" y="66" width="342.8" height="56" /><text x="235.4" y="98.5" text-anchor="middle" class="small">吞吐部分 406 s</text>
<rect class="seg-wait" x="406.8" y="66" width="165.5" height="56" data-band="" />
<rect class="stair" x="407.5" y="74.6" width="23.6" height="46.4" data-band="" />
<rect class="stair" x="431.2" y="87.5" width="23.6" height="33.5" data-band="" />
<rect class="stair" x="454.8" y="97.2" width="23.6" height="23.8" data-band="" />
<rect class="stair" x="478.5" y="104.8" width="23.6" height="16.2" data-band="" />
<rect class="stair" x="502.1" y="110.2" width="23.6" height="10.8" data-band="" />
<rect class="stair" x="525.8" y="114.5" width="23.6" height="6.5" data-band="" />
<rect class="stair" x="549.4" y="117.8" width="23.6" height="3.2" data-band="" />
<text x="564.4" y="86.0" text-anchor="end" class="small">长尾 196 s</text>
<rect class="seg-b" x="572.4" y="66" width="60.8" height="56" /><text x="602.8" y="98.5" text-anchor="middle" class="small">前向</text>
<rect class="seg-b" x="633.2" y="66" width="114.8" height="56" /><text x="690.6" y="98.5" text-anchor="middle" class="small">训练</text>
<text x="16.0" y="173.0" text-anchor="start" class="bold">显存</text>
<rect class="seg-q" x="64.0" y="144" width="508.4" height="48" /><text x="318.2" y="172.5" text-anchor="middle" class="small">推理权重 16 GB + KV 池 56 GB</text>
<rect class="seg-d" x="572.4" y="144" width="175.6" height="48" />
<path d="M572.4 24 V198" class="wall" />
<path d="M748.0 24 V198" class="wall" />
<text x="572.4" y="216.0" text-anchor="middle" class="small">显存：KV 池 → 训练状态回卡</text>
<text class="small"><tspan x="580.4" y="162">训练状态 2 GB +</tspan><tspan x="580.4" y="183">ref 0.25 GB + 激活……</tspan></text></svg>