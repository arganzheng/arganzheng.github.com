<svg xmlns="http://www.w3.org/2000/svg" width="330" height="979.2" viewBox="234 100.8 330 979.2" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgMono';font-weight:400;src:url(data:font/woff2;base64,)}]]></style>
<title id="title">从 remaining_tokens 到 num_new_tokens 的判断链</title>
  <desc id="desc">Scheduler 计算 remaining_tokens，与 Token Budget 比较后得到 num_new_tokens，分配 KV 槽位、消耗预算，再处理下一个 Request。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 20px; font-weight: 500; }
      .head { font-size: 16px; font-weight: 500; }
      .body { font-size: 14px; }
      .small { font-size: 14px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .arrow { stroke: #40566f; stroke-width: 2; marker-end: url(#arrow); }
      .used { fill: #4e79a7; stroke: #fff; stroke-width: 2; }
      .free { fill: #e8edf2; stroke: #fff; stroke-width: 2; }
    </style>
  </defs>
  <rect x="234" y="100.8" width="330" height="979.2" fill="#fff" />
  <g data-card="remaining"><rect class="card" x="250" y="129.6" width="260" height="104.4" /><text x="380" y="194.4" text-anchor="middle" class="head" transform="translate(-0.000 -7.100) "><tspan font-family="'SvgMono','SvgSans', DejaVu Sans Mono">remaining_tokens</tspan></text></g>
  <line x1="380" y1="234.0" x2="380" y2="298.8" class="arrow" />
  <g data-card="compare"><rect class="compute" x="250" y="298.8" width="260" height="104.4" /><text x="380" y="363.6" text-anchor="middle" class="body" transform="translate(-0.000 -6.600) ">与 Token Budget 比较</text></g>
  <line x1="380" y1="403.2" x2="380" y2="468.0" class="arrow" />
  <g data-card="newtokens"><rect class="card" x="250" y="468.0" width="260" height="104.4" /><text x="380" y="532.8000000000001" text-anchor="middle" class="head" transform="translate(-0.000 -7.100) "><tspan font-family="'SvgMono','SvgSans', DejaVu Sans Mono">num_new_tokens</tspan></text></g>
  <line x1="380" y1="572.4" x2="380" y2="637.2" class="arrow" />
  <g data-card="slots"><rect class="memory" x="250" y="637.2" width="260" height="104.4" /><text x="380" y="702.0" text-anchor="middle" class="head" transform="translate(-0.000 -7.100) "><tspan font-family="'SvgMono','SvgSans', DejaVu Sans Mono">allocate_slots()</tspan></text></g>
  <line x1="380" y1="741.6" x2="380" y2="806.4" class="arrow" />
  <g data-card="consume"><rect class="compute" x="250" y="806.4" width="260" height="104.4" /><text x="380" y="871.2" text-anchor="middle" class="body" transform="translate(-0.000 -6.600) ">消耗 Token Budget</text></g>
  <line x1="380" y1="910.8000000000001" x2="380" y2="975.6" class="arrow" />
  <g data-card="next"><rect class="request" x="250" y="975.6" width="260" height="75.60000000000001" /><text x="380" y="1024.2" text-anchor="middle" class="body" transform="translate(0.000 -4.800) ">下一个 Request</text></g>
  <path d="M 510 1013.4 H 548 V 181.8 H 510" fill="none" class="arrow" />
</svg>