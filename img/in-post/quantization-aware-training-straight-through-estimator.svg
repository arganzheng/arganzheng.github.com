<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
</defs>
<rect width="760" height="320" fill="#ffffff"/>
<text x="380" y="26" fill="#202938" font-size="16" text-anchor="middle" font-weight="700">假量化：前向真的量化，反向用 STE 近似</text>
<text x="24" y="60" fill="#334155" font-size="13" font-weight="700">前向：量化误差进入 loss</text>
<g fill="#f1f5f9" stroke="#718096" stroke-width="1.5">
  <rect x="24" y="76" width="124" height="62" rx="10"/>
  <rect x="171" y="76" width="124" height="62" rx="10"/>
  <rect x="318" y="76" width="124" height="62" rx="10"/>
  <rect x="465" y="76" width="124" height="62" rx="10"/>
  <rect x="612" y="76" width="124" height="62" rx="10"/>
</g>
<g fill="#202938" text-anchor="middle">
  <text x="86" y="101" font-size="13" font-weight="700">fp32 主权重 w</text>
  <text x="86" y="122" font-size="11">连续值</text>
  <text x="233" y="101" font-size="13" font-weight="700">clip</text>
  <text x="233" y="122" font-size="11">范围 [−c, c]</text>
  <text x="380" y="101" font-size="13" font-weight="700">round</text>
  <text x="380" y="122" font-size="11">整数码 q</text>
  <text x="527" y="101" font-size="13" font-weight="700">dequant</text>
  <text x="527" y="122" font-size="11">ŵ = Δq</text>
  <text x="674" y="101" font-size="13" font-weight="700">线性层 / loss</text>
  <text x="674" y="122" font-size="11">使用 ŵ 计算</text>
</g>
<g stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)">
  <line x1="148" y1="107" x2="166" y2="107"/>
  <line x1="295" y1="107" x2="313" y2="107"/>
  <line x1="442" y1="107" x2="460" y2="107"/>
  <line x1="589" y1="107" x2="607" y2="107"/>
</g>
<text x="24" y="180" fill="#334155" font-size="13" font-weight="700">反向：裁剪 STE 只把范围内的梯度传回去</text>
<g fill="#e8f5f2" stroke="#238a83" stroke-width="1.5">
  <rect x="24" y="198" width="168" height="62" rx="10"/>
  <rect x="365" y="198" width="205" height="62" rx="10"/>
  <rect x="612" y="198" width="124" height="62" rx="10"/>
</g>
<g fill="#202938" text-anchor="middle">
  <text x="108" y="222" font-size="13" font-weight="700">更新 fp32 w</text>
  <text x="108" y="244" font-size="11">累积梯度，跨格点后 ŵ 才变</text>
  <text x="467" y="222" font-size="13" font-weight="700">裁剪 STE mask</text>
  <text x="467" y="244" font-size="11">|w| ≤ c：1；范围外：0</text>
  <text x="674" y="222" font-size="13" font-weight="700">反传梯度</text>
  <text x="674" y="244" font-size="11">∂L/∂ŵ</text>
</g>
<g stroke="#238a83" stroke-width="1.8" marker-end="url(#arrow)">
  <line x1="612" y1="229" x2="576" y2="229"/>
  <line x1="365" y1="229" x2="198" y2="229"/>
</g>
<line x1="674" y1="138" x2="674" y2="192" stroke="#238a83" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="380" y="294" fill="#5b6472" font-size="11" text-anchor="middle">前向的 clip → round → dequant 不变；STE 只替换反向梯度。</text>
</svg>
