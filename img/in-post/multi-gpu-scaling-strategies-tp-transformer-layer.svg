<text x="633.0" y="134.0" text-anchor="middle" class="small">Column TP</text>
<text x="633.0" y="152.0" text-anchor="middle" class="mono">Up₀ … Up₃</text>
<path d="M523.0,158 V174 H578" class="line"/>
<path d="M633.0,158 V174 H578" class="line"/>
