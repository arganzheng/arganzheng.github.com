<text x="292.0" y="134.0" text-anchor="middle" class="small">Column TP</text>
<text x="292.0" y="152.0" text-anchor="middle" class="mono">V₀ V₁ V₂ V₃</text>
<path d="M72.0,158 V174 H182" class="line"/>
