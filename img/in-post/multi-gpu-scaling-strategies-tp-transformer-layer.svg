<text x="578.0" y="227.0" text-anchor="middle" class="math">GPU 本地计算：Actᵢ = SiLU(Gateᵢ) ⊙ Upᵢ</text>
<text x="578.0" y="245.0" text-anchor="middle" class="small">4 张卡各自只算自己的中间维度，不通信</text>
<line x1="578" y1="254" x2="578" y2="276" class="arrow"/>
