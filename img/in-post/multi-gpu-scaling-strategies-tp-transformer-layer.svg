<line x1="182" y1="474" x2="182" y2="500" class="arrow"/>
<rect class="card" x="122" y="500" width="120" height="32"/>
<text x="182.0" y="521.0" text-anchor="middle" class="body">Attention Out</text>
<rect class="frame" x="405" y="15" width="345" height="540"/>
<text x="417" y="36" text-anchor="start" class="head">MLP</text>
<rect class="card" x="533" y="40" width="90" height="28"/>
<text x="578.0" y="59.0" text-anchor="middle" class="body">Input</text>
<path d="M578,68 V84 H523.0 V100" class="arrow"/>
