<text x="223.0" y="386.0" text-anchor="middle" class="math">Attn₂ O₂</text>
<text x="223.0" y="404.0" text-anchor="middle" class="small">部分和</text>
<rect class="card" x="265" y="352" width="80" height="58"/>
<text x="305.0" y="368.0" text-anchor="middle" class="small">GPU 3</text>
<text x="305.0" y="386.0" text-anchor="middle" class="math">Attn₃ O₃</text>
<text x="305.0" y="404.0" text-anchor="middle" class="small">部分和</text>
<path d="M59,410 V426 H182" class="line"/>
<path d="M141,410 V426 H182" class="line"/>
<path d="M223,410 V426 H182" class="line"/>
<path d="M305,410 V426 H182" class="line"/>
