<path d="M292.0,158 V174 H182" class="line"/>
<line x1="182" y1="174" x2="182" y2="190" class="arrow"/>
<rect class="card" x="27" y="190" width="310" height="64"/>
<text x="182.0" y="209.0" text-anchor="middle" class="small">Attention Compute</text>
<text x="182.0" y="227.0" text-anchor="middle" class="math">GPU 本地计算：Attnᵢ = softmax(Qᵢ Kᵢᵀ / √d) Vᵢ</text>
<text x="182.0" y="245.0" text-anchor="middle" class="small">4 张卡各自只算自己的 Head，不通信</text>
<line x1="182" y1="254" x2="182" y2="276" class="arrow"/>
