<text x="537.0" y="386.0" text-anchor="middle" class="math">Act₁ Down₁</text>
<text x="537.0" y="404.0" text-anchor="middle" class="small">部分和</text>
<rect class="card" x="579" y="352" width="80" height="58"/>
