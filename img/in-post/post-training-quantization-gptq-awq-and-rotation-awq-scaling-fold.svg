<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">AWQ 的等价缩放与算子折叠</title>
  <desc id="desc">把逆通道缩放折进前一个算子，把对应权重列乘以通道缩放后做 INT4 量化，两路输入进入下一层 GEMM。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; }
      .box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 12; }
      .highlight { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; rx: 12; }
      .note { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; rx: 10; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .teal-line { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow-teal); }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text class="title" x="28" y="34">AWQ：把缩放折进已有算子</text>

  <rect class="box" x="28" y="78" width="202" height="82"/>
  <text class="label" x="129" y="108" text-anchor="middle">前一个算子</text>
  <text class="small" x="129" y="133" text-anchor="middle">RMSNorm γ / Linear 输出通道</text>

  <rect class="highlight" x="286" y="78" width="186" height="82"/>
  <text class="label" x="379" y="108" text-anchor="middle">输入通道</text>
  <text class="small" x="379" y="133" text-anchor="middle">X′ = diag(s)⁻¹ X</text>

  <path class="line" d="M230 119 H278"/>
  <text class="small" x="254" y="96" text-anchor="middle">折入</text>
  <rect class="note" x="54" y="183" width="230" height="56"/>
  <text class="small" x="169" y="207" text-anchor="middle">γ 或输出通道吸收 diag(s)⁻¹</text>
  <text class="small" x="169" y="226" text-anchor="middle">不增加运行时缩放 kernel</text>
  <path class="teal-line dash" d="M169 183 V166 H129 V160"/>

  <rect class="box" x="28" y="258" width="202" height="48"/>
  <text class="label" x="129" y="288" text-anchor="middle">下一层权重 W</text>
  <rect class="highlight" x="286" y="248" width="186" height="68"/>
  <text class="label" x="379" y="276" text-anchor="middle">W′ = W diag(s)</text>
  <text class="small" x="379" y="299" text-anchor="middle">显著通道对应列放大</text>
  <path class="line" d="M230 282 H278"/>

  <rect class="highlight" x="526" y="248" width="104" height="68"/>
  <text class="label" x="578" y="277" text-anchor="middle">INT4</text>
  <text class="small" x="578" y="299" text-anchor="middle">量化 W′</text>
  <path class="line" d="M472 282 H518"/>

  <rect class="box" x="656" y="78" width="76" height="238"/>
  <text class="label" x="694" y="124" text-anchor="middle">GEMM</text>
  <text class="small" x="694" y="151" text-anchor="middle">W′q</text>
  <text class="small" x="694" y="173" text-anchor="middle">×</text>
  <text class="small" x="694" y="195" text-anchor="middle">X′</text>
  <text class="label" x="694" y="246" text-anchor="middle">Y</text>
  <path class="line" d="M472 119 H642"/>
  <path class="line" d="M630 282 H642 V220 H648"/>
  <text class="small" x="378" y="213" text-anchor="middle">未量化时两边缩放抵消：W′ X′ = W X</text>
</svg>
