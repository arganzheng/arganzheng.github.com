rif">通道 4</text><rect x="477" y="195" width="85.0" height="16" rx="4" fill="#3b82f6"/><text x="657" y="208" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">1.00</text><text x="380" y="267" fill="#1e293b" font-size="12" text-anchor="middle" font-weight="700" font-family="Arial, PingFang SC, sans-serif">单样本输出：y = Σ wⱼxⱼ，未剪枝时为 4.15</text><text x="30" y="300" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">未剪枝</text><rect x="175" y="287" width="330.0" height="15" rx="4" fill="#64748b"/><text x="520" y="300" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">4.15</text><text x="30" y="331" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">按幅度剪通道 1</text><rect x="175" y="318" width="171.0" height="15" rx="4" fill="#d97706"/><text x="520" y="331" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">2.15</text><text x="30" y="362" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">按 Wanda 剪通道 2</text><rect x="175" y="349" width="302.2" height="15" rx="4" fill="#3b82f6"/><text x="520" y="362" fill="#334155" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">3.80</text><text x="380" y="397" fill="#64748b" font-size="9" text-anchor="middle" font-weight="normal" font-family="Arial, PingFang SC, sans-serif">玩具校准集只有一个输入；实际 Wanda 会在多条输入上统计通道范数。</text></svg>