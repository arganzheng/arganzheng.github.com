<svg xmlns="http://www.w3.org/2000/svg" width="740" height="222" viewBox="0 0 740 222" role="img" aria-labelledby="t d">
<title id="t">一个 group 里的两个 all_reduce 合成一次 kernel 启动</title>
<desc id="d">grid = 8 个 block，block i 对应 channel i。work batch 0：8 个 block 各处理 A 的 1/8；work batch 1：只有 block 0、1 各处理 B 的 1/2，block 2 到 7 在 batch 0 后 nextBatchIx == -1 结束。</desc>
