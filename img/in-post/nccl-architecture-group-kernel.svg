.s12{font-size:12px} .s13{font-size:13px} .s14{font-size:14px} .s16{font-size:16px;font-weight:600}
.mid{text-anchor:middle} .end{text-anchor:end}
.a{fill:#e3eefb;stroke:#2c5d8a;stroke-width:1.2}.bb{fill:#e3f4e1;stroke:#2e7d32;stroke-width:1.2}.none{fill:#f3f3f3;stroke:#bbb;stroke-width:1.2}.end{stroke:#c62828;stroke-width:3.5}.sub{fill:#333}.sub2{fill:#888}
</style>
