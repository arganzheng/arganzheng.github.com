<text x="380.0" y="360.0" font-size="12" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="middle">或 Mooncake Transfer Engine</text>
