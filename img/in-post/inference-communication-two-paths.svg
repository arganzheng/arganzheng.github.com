<text x="380.0" y="387.0" font-size="11.5" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="middle">或 WRITE（Mooncake，prefill 侧发起）</text>
<text x="380.0" y="408.0" font-size="12.5" font-weight="500" fill="#111" text-anchor="middle"><tspan font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>KVConnector 两侧：scheduler 侧决定传哪些 block、何时可释放；worker 侧发起与轮询传输</tspan></text>
