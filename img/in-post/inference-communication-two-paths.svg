<rect x="538.0" y="322.0" width="180.0" height="46.0" fill="#d4edda" stroke="#2e7d32" stroke-width="1.2" />
<text x="628.0" y="341.0" font-size="13" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="600" fill="#111" text-anchor="middle">KV blocks</text>
<text x="628.0" y="360.0" font-size="11.5" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="middle">显存，已注册</text>
<rect x="270.0" y="321.0" width="220.0" height="48.0" fill="#f6f8fa" stroke="#555" stroke-width="1.2" />
