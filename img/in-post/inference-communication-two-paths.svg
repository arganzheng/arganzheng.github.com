<text x="241.0" y="133.0" font-size="12.5" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="600" fill="#111" text-anchor="middle">.all_reduce</text>
<line x1="316.0" y1="119.0" x2="314.0" y2="119.0" stroke="#333" stroke-width="1.4"/>
