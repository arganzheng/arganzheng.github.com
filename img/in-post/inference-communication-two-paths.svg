<rect x="498.0" y="130.0" width="238.0" height="26.0" fill="#fff3cd" stroke="#555" stroke-width="1.2" />
<text x="338.0" y="148.0" font-size="12.5" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="700" fill="#111" text-anchor="start">custom all-reduce</text>
<text x="506.0" y="148.0" font-size="12" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="start">本篇主角：IPC + flag + 一个 kernel</text>
<line x1="314.0" y1="143.0" x2="330.0" y2="143.0" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="330.0" y="156.0" width="168.0" height="26.0" fill="#f6f8fa" stroke="#555" stroke-width="1.2" />
<rect x="498.0" y="156.0" width="238.0" height="26.0" fill="#f6f8fa" stroke="#555" stroke-width="1.2" />
<text x="338.0" y="174.0" font-size="12.5" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="start">torch symmetric memory</text>
<text x="506.0" y="174.0" font-size="12" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="start">multimem / two-shot</text>
<line x1="314.0" y1="169.0" x2="330.0" y2="169.0" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
