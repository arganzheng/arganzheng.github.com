<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="two-paths-t two-paths-d">
<title id="two-paths-t">推理里的两条通信路径</title>
<desc id="two-paths-d">上：decode step 中 GPU0 到 GPU7 的 TP all_reduce 进入 CudaCommunicator.all_reduce，按顺序尝试六个后端。下：PD 分离中 prefill 实例的 KV blocks 经 NIXL、UCX、verbs/GDR 或 Mooncake Transfer Engine 传到 decode 实例。</desc>
<style>text{dominant-baseline:auto}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#fff"/>
