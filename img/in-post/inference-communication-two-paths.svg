<text x="56.0" y="141.0" font-size="13" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="500" fill="#111" text-anchor="middle">…</text>
<rect x="26.0" y="158.0" width="60.0" height="24.0" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.2" />
