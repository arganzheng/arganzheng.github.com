<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
  <title id="t">dense FFN 与 MoE grouped GEMM 的权重摊薄</title>
  <desc id="d">左：dense FFN 一份权重 W 被全部 T 行摊薄，I ≈ T FLOP/byte。右：MoE 有 E 份权重，每份只被 T·k/E 行摊薄且分布不均：热门 E0 有 3 个 M-tile，最后一个 pad 掉一半；E1 只有 1 个 tile，3/4 是 pad；冷门 E2 没分到 token，不产生 M-tile；E3 有 2 个 tile，第二个 3/4 是 pad。网格尾部 expert_ids = −1 的 tile 全是 pad，kernel 直接 return。每个 expert 的 I ≈ T·k/E。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .mutedmono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5b6b7c; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { stroke: #6f8399; stroke-width: 1.2; }
      .thin { stroke: #6f8399; stroke-width: 0.8; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .c-s { fill: #f9d5d3; } .c-e { fill: #fde0b8; } .c-m { fill: #cfe2f3; } .c-i { fill: #cfeccf; }
      .c-w { fill: #ffffff; } .c-g { fill: #eef1f4; } .c-pad { fill: #e3e7eb; }
      .b0 { fill: #cfe2f3; } .b1 { fill: #fde0b8; } .b2 { fill: #cfeccf; } .b3 { fill: #e6d7f2; } .b4 { fill: #f9d5d3; }
    </style>
  </defs>
<rect x="0" y="0" width="760" height="350" fill="#ffffff"/>
<text x="24.0" y="24.0" class="head">dense FFN：一份权重 W</text>
<text x="24.0" y="44.0" class="head">被全部 T 行摊薄</text>
<rect x="80.0" y="70.0" width="100.0" height="140.0" class="b0 cell"/>
<text x="70.0" y="145.0" text-anchor="end" class="body">T 行</text>
<text x="190.0" y="145.0" class="monob">× W</text>
<text x="80.0" y="236.0" class="body">I ≈ T FLOP/byte</text>
<line x1="244.0" y1="14.0" x2="244.0" y2="300.0" class="rule"/>
<text x="260.0" y="24.0" class="head">MoE：E 份权重，每份只被 T·k/E 行摊薄，且分布不均</text>
<text x="260.0" y="70.0" class="small">E0（热门）</text>
<rect x="340.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="352.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="364.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="376.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="340.0" y="52.0" width="48.0" height="26.0" class="line"/>
<rect x="394.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="406.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="418.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="430.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="394.0" y="52.0" width="48.0" height="26.0" class="line"/>
<rect x="448.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="460.0" y="52.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="472.0" y="52.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="484.0" y="52.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="448.0" y="52.0" width="48.0" height="26.0" class="line"/>
<text x="508.0" y="70.0" class="small">← 3 个 M-tile，最后一个 pad 掉一半</text>
<text x="260.0" y="110.0" class="small">E1</text>
<rect x="340.0" y="92.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="352.0" y="92.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="364.0" y="92.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="376.0" y="92.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="340.0" y="92.0" width="48.0" height="26.0" class="line"/>
<text x="400.0" y="110.0" class="small">← 1 个 tile，3/4 是 pad</text>
<text x="260.0" y="150.0" class="small">E2（冷门）</text>
<text x="340.0" y="150.0" class="small">0 个 token：不产生 M-tile</text>
<text x="260.0" y="190.0" class="small">E3</text>
<rect x="340.0" y="172.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="352.0" y="172.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="364.0" y="172.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="376.0" y="172.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="340.0" y="172.0" width="48.0" height="26.0" class="line"/>
<rect x="394.0" y="172.0" width="12.0" height="26.0" class="b0 cell"/>
<rect x="406.0" y="172.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="418.0" y="172.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="430.0" y="172.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="394.0" y="172.0" width="48.0" height="26.0" class="line"/>
<text x="260.0" y="230.0" class="small">…</text>
<text x="260.0" y="260.0" class="small">尾部</text>
<rect x="340.0" y="242.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="352.0" y="242.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="364.0" y="242.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="376.0" y="242.0" width="12.0" height="26.0" class="c-pad cell"/>
<rect x="340.0" y="242.0" width="48.0" height="26.0" class="line" style="stroke-dasharray:4 3"/>
<text x="400.0" y="260.0" class="small">← expert_ids = −1，kernel 直接 return</text>
<rect x="260.0" y="286.0" width="14.0" height="14.0" class="b0 cell"/>
<text x="280.0" y="298.0" class="small">有效行</text>
<rect x="339.0" y="286.0" width="14.0" height="14.0" class="c-pad cell"/>
<text x="359.0" y="298.0" class="small">pad 行（一格 = M-tile 的一行，block_size = 4）</text>
<text x="260.0" y="330.0" class="body">每个 expert 的 I ≈ T·k/E</text>
</svg>
