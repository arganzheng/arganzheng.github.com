<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 760 364" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}]]></style>
  <title id="title">Launch-bound 的提交成本与 GPU 空档</title>
  <desc id="desc">CPU 提交 add、relu、mm 分别用 20、20、25 微秒。GPU 在各次提交结束后执行 4、3、8 微秒。总跨度 73 微秒，忙碌 15 微秒，利用率约 21%。</desc>
  <style>text{font-family:'SvgSans', 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:400}rect,line,path{shape-rendering:geometricPrecision}</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="364" fill="#fff"/>
  <text x="110" y="28" font-size="14" text-anchor="start" fill="#111827">时间 →（µs，按比例）</text>
  <line x1="110" y1="48" x2="720" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110.0" y1="45" x2="110.0" y2="54" stroke="#64748b" stroke-width="1.5"/>
  <text x="110.0" y="72" font-size="13" text-anchor="middle" fill="#111827">0</text>
  <line x1="260.0" y1="45" x2="260.0" y2="54" stroke="#64748b" stroke-width="1.5"/>
  <text x="260.0" y="72" font-size="13" text-anchor="middle" fill="#111827">20</text>
  <line x1="410.0" y1="45" x2="410.0" y2="54" stroke="#64748b" stroke-width="1.5"/>
  <text x="410.0" y="72" font-size="13" text-anchor="middle" fill="#111827">40</text>
  <line x1="560.0" y1="45" x2="560.0" y2="54" stroke="#64748b" stroke-width="1.5"/>
  <text x="560.0" y="72" font-size="13" text-anchor="middle" fill="#111827">60</text>
  <line x1="710.0" y1="45" x2="710.0" y2="54" stroke="#64748b" stroke-width="1.5"/>
  <text x="710.0" y="72" font-size="13" text-anchor="middle" fill="#111827">80</text>
  <text x="18" y="122" font-size="15" text-anchor="start" fill="#111827">CPU</text>
  <text x="18" y="248" font-size="15" text-anchor="start" fill="#111827">GPU</text>
  <rect x="110.0" y="96" width="150.0" height="42" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
  <text x="185.0" y="123.000" font-size="14" text-anchor="middle" fill="#111827">提交 add 20 µs</text>
  <rect x="260.0" y="96" width="150.0" height="42" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
  <text x="335.0" y="123.000" font-size="14" text-anchor="middle" fill="#111827">提交 relu 20 µs</text>
  <rect x="410.0" y="96" width="187.5" height="42" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
  <text x="503.75" y="123.000" font-size="14" text-anchor="middle" fill="#111827">提交 mm 25 µs</text>
  <rect x="260.0" y="222" width="30.0" height="42" fill="#dcefe3" stroke="#52657a" stroke-width="1.2"/>
  <line x1="260.0" y1="138" x2="260.0" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275.0" y="294" font-size="14" text-anchor="middle" fill="#111827">add 4 µs</text>
  <rect x="410.0" y="222" width="22.5" height="42" fill="#dcefe3" stroke="#52657a" stroke-width="1.2"/>
  <line x1="410.0" y1="138" x2="410.0" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="421.25" y="294" font-size="14" text-anchor="middle" fill="#111827">relu 3 µs</text>
  <rect x="597.5" y="222" width="60.0" height="42" fill="#dcefe3" stroke="#52657a" stroke-width="1.2"/>
  <line x1="597.5" y1="138" x2="597.5" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="627.5" y="294" font-size="14" text-anchor="middle" fill="#111827">mm 8 µs</text>
  <text x="110" y="335" font-size="15" text-anchor="start" fill="#111827">GPU 忙碌 4 + 3 + 8 = 15 µs；端到端 73 µs，利用率 ≈ 21%</text>
</svg>
