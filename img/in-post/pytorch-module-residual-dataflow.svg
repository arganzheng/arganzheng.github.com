<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" role="img" aria-labelledby="t d">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgSans';font-weight:500;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgMono';font-weight:400;src:url(data:font/woff2;base64,)}]]></style>
<title id="t">ResidualBlock 的数据流：Module 树只有两个 Linear，forward 多一条 residual 旁路</title>
  <desc id="d">x 依次经过 fc1（Linear）、torch.relu、fc2（Linear），再与从 x 分出的 residual 相加得到 output。fc1、fc2 是注册的子模块，torch.relu 和加法只是 forward 里的 Tensor 运算。</desc>
  <style>
text{font-family:'SvgSans', "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#111;font-weight:400}
.mono{font-family:'SvgMono', "SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
.small{font-size:12px}
.lab{font-size:13px;font-weight:500}
.num{font-size:12px;font-weight:400;fill:#555}
.mod{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.2}
.op{fill:#f5f5f5;stroke:#757575;stroke-width:1.2}
.cpu{fill:#fff8e1;stroke:#f9a825;stroke-width:1.2}
.gpu{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.2}
.ag{fill:#f3e5f5;stroke:#7b1fa2;stroke-width:1.2}
.opt{fill:#fbe9e7;stroke:#d84315;stroke-width:1.2}
.dash{stroke-dasharray:5 3}
.ln{stroke:#333;stroke-width:1.3;fill:none}
.ax{stroke:#888;stroke-width:1;fill:none}
.grid{stroke:#ccc;stroke-width:1;stroke-dasharray:3 3}
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#333" />
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#888" />
    </marker>
  </defs>
  <rect width="640" height="128" fill="#fff" />
  <text x="28" y="92" text-anchor="middle" dominant-baseline="central" class="mono">x</text>
  <line x1="40" y1="92" x2="90" y2="92" class="ln" marker-end="url(#ah)" />
  <rect x="90" y="70.0" width="84" height="44" class="mod" />
  <text font-size="0"><tspan x="132.0" y="82.500" text-anchor="middle" dominant-baseline="central" class="mono lab" font-size="13px">fc1</tspan><tspan x="132.0" y="100.500" text-anchor="middle" dominant-baseline="central" class="small" font-size="12px">Linear</tspan></text>

  <line x1="174" y1="92" x2="214" y2="92" class="ln" marker-end="url(#ah)" />
  <rect x="214" y="70.0" width="100" height="44" class="op" />
  <text x="264.0" y="92" text-anchor="middle" dominant-baseline="central" class="mono">torch.relu</text>
  <line x1="314" y1="92" x2="354" y2="92" class="ln" marker-end="url(#ah)" />
  <rect x="354" y="70.0" width="84" height="44" class="mod" />
  <text font-size="0"><tspan x="396.0" y="82.500" text-anchor="middle" dominant-baseline="central" class="mono lab" font-size="13px">fc2</tspan><tspan x="396.0" y="100.500" text-anchor="middle" dominant-baseline="central" class="small" font-size="12px">Linear</tspan></text>

  <line x1="438" y1="92" x2="486" y2="92" class="ln" marker-end="url(#ah)" />
  <circle cx="500" cy="92" r="14" class="op" />
  <text x="500" y="91" text-anchor="middle" dominant-baseline="central" class="lab">+</text>
  <line x1="514" y1="92" x2="560" y2="92" class="ln" marker-end="url(#ah)" />
  <text x="566" y="92" text-anchor="start" dominant-baseline="central" class="mono">output</text>
  <circle cx="60" cy="92" r="2.5" fill="#333" />
  <path d="M60,92 V30 H500 V78" class="ln" marker-end="url(#ah)" />
  <text x="280.0" y="20" text-anchor="middle" dominant-baseline="central" class="mono">residual = x</text>
</svg>