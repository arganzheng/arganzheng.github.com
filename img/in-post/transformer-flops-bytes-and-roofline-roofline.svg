<svg xmlns="http://www.w3.org/2000/svg" width="740" height="450" viewBox="0 0 740 450" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="740" height="450" fill="#ffffff"/>
  <!-- plot area: x 70..670 (log10 I: -1..4, 120 px/decade), y 40..390 (log10 TFLOPS: 0..3.5, 100 px/decade) -->
  <!-- x(I) = 70 + 120*(log10 I + 1); y(P) = 390 - 100*log10 P -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="70" y1="390" x2="670" y2="390"/>
    <line x1="70" y1="290" x2="670" y2="290"/>
    <line x1="70" y1="190" x2="670" y2="190"/>
    <line x1="70" y1="90" x2="670" y2="90"/>
    <line x1="70" y1="40" x2="670" y2="40"/>
    <line x1="70" y1="40" x2="70" y2="390"/>
    <line x1="190" y1="40" x2="190" y2="390"/>
    <line x1="310" y1="40" x2="310" y2="390"/>
    <line x1="430" y1="40" x2="430" y2="390"/>
    <line x1="550" y1="40" x2="550" y2="390"/>
    <line x1="670" y1="40" x2="670" y2="390"/>
  </g>
  <!-- axes -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="70" y1="390" x2="670" y2="390"/>
    <line x1="70" y1="40" x2="70" y2="390"/>
  </g>
  <!-- x ticks -->
  <g fill="#333" text-anchor="middle">
    <text x="70" y="408">0.1</text>
    <text x="190" y="408">1</text>
    <text x="310" y="408">10</text>
    <text x="430" y="408">100</text>
    <text x="550" y="408">1000</text>
    <text x="670" y="408">10⁴</text>
    <text x="370" y="432" font-size="13">算术强度 I（FLOP/byte，对 HBM）</text>
  </g>
  <!-- y ticks -->
  <g fill="#333" text-anchor="end">
    <text x="62" y="394">1</text>
    <text x="62" y="294">10</text>
    <text x="62" y="194">100</text>
    <text x="62" y="94">1000</text>
  </g>
  <text x="18" y="215" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 18 215)">可达算力（TFLOPS，对数轴）</text>

  <!-- A100 roofline (dashed grey): P = 2.0*I up to ridge (156, 312) -->
  <line x1="153.9" y1="390" x2="453.2" y2="140.6" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="453.2" y1="140.6" x2="670" y2="140.6" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="668" y="134" fill="#777" font-size="11" text-anchor="end">A100 roof 312 T，ridge 156</text>

  <!-- H100 roofline: bandwidth slope P = 3.35*I from P=1 (I=0.2985) to ridge (295, 989) -->
  <line x1="127" y1="390" x2="486.4" y2="90.5" stroke="#c0392b" stroke-width="2.5"/>
  <!-- compute roof -->
  <line x1="486.4" y1="90.5" x2="670" y2="90.5" stroke="#1e8449" stroke-width="2.5"/>
  <!-- ridge marker -->
  <line x1="486.4" y1="90.5" x2="486.4" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="490" y="382" fill="#555" font-size="11" text-anchor="start">ridge ≈ 295</text>
  <text x="118" y="345" fill="#c0392b" font-size="12" transform="rotate(-39.8 118 345)">HBM3 3.35 TB/s</text>
  <text x="668" y="82" fill="#1e8449" font-size="12" text-anchor="end">H100 roof：BF16 dense 989 TFLOPS</text>
  <text x="474" y="60" fill="#666" font-size="12" text-anchor="end">← memory-bound</text>
  <text x="498" y="60" fill="#666" font-size="12" text-anchor="start">compute-bound →</text>

  <!-- limit I -> 18 for 8K context, B -> inf -->
  <line x1="340.6" y1="350" x2="340.6" y2="390" stroke="#2e6da4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="345" y="372" fill="#2e6da4" font-size="11">8K 上下文 B→∞：I→18</text>

  <!-- arrow: decode B=64 weights only -> with 8K KV -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <path d="M400,163 L338,215" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <!-- leader lines from points to labels -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="269" y1="277.3" x2="346" y2="277.3"/>
    <line x1="305" y1="247.2" x2="346" y2="247.2"/>
    <line x1="413" y1="157" x2="488" y2="157"/>
  </g>
  <!-- points -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="190" cy="337.5" r="6" fill="#c0392b"/>
    <circle cx="262.2" cy="277.3" r="6" fill="#b9770e"/>
    <circle cx="298.4" cy="247.2" r="6" fill="#c0392b"/>
    <circle cx="329.7" cy="221.1" r="6" fill="#2e6da4"/>
    <circle cx="406.7" cy="157" r="6" fill="#c0392b"/>
    <circle cx="486.4" cy="90.5" r="6" fill="#c0392b"/>
    <circle cx="662.8" cy="90.5" r="6" fill="#1e8449"/>
  </g>
  <!-- labels -->
  <g fill="#333" font-size="11">
    <text x="224" y="341">decode B=1、RMSNorm：I=1，3.35 TFLOPS（峰值 0.3%）</text>
    <text x="350" y="281">读 KV cache：I = g = 4（与 B、s 无关）</text>
    <text x="350" y="251">decode B=8（纯权重）：I=8</text>
    <text x="364" y="225">B=64 + 8K KV：I=14.6（有效 batch≈15）</text>
    <text x="492" y="161">decode B=64（纯权重）：I=64</text>
    <text x="478" y="108" text-anchor="end">decode B=295（纯权重）刚到 ridge</text>
    <text x="655" y="112" text-anchor="end">prefill s=8K：I≈8700</text>
  </g>
</svg>
