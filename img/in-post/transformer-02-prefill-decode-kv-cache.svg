<svg xmlns="http://www.w3.org/2000/svg" width="900" height="382" viewBox="0 0 900 382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="450" y="22" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">推理：prefill 把 prompt 一次算完并存下每层的 K、V；decode 每步只算一个新 token，K、V 追加进 cache</text><text x="140" y="78" fill="#333" font-size="11" text-anchor="end" font-weight="600">prefill</text><rect x="150" y="60" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="171.0" y="79" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">The</text><rect x="196" y="60" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="217.0" y="79" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">cat</text><rect x="242" y="60" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="263.0" y="79" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">sat</text><rect x="288" y="60" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="309.0" y="79" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">on</text><rect x="334" y="60" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="355.0" y="79" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">the</text><line x1="378" y1="74" x2="392" y2="74" stroke="#8a6bd1" stroke-width="1.2" marker-end="url(#ar)"/><rect x="394" y="60" width="42" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4" stroke-dasharray="3 2"/><text x="415.0" y="79" fill="#8a6bd1" font-size="10.5" text-anchor="middle" font-weight="normal">mat</text><text x="610" y="79" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">算 5 个（同训练前向），只取最后一个位置的分布</text><text x="140" y="122" fill="#333" font-size="11" text-anchor="end" font-weight="600">decode 1</text><rect x="150" y="104" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="171.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">The</text><rect x="196" y="104" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="217.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">cat</text><rect x="242" y="104" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="263.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">sat</text><rect x="288" y="104" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="309.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">on</text><rect x="334" y="104" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="355.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">the</text><rect x="380" y="104" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="401.0" y="123" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">mat</text><line x1="424" y1="118" x2="438" y2="118" stroke="#8a6bd1" stroke-width="1.2" marker-end="url(#ar)"/><rect x="440" y="104" width="42" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4" stroke-dasharray="3 2"/><text x="461.0" y="123" fill="#8a6bd1" font-size="10.5" text-anchor="middle" font-weight="normal">because</text><text x="610" y="123" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">只算 mat 的 Q/K/V；Q 去看 cache 里 5 个 K</text><text x="140" y="166" fill="#333" font-size="11" text-anchor="end" font-weight="600">decode 2</text><rect x="150" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="171.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">The</text><rect x="196" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="217.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">cat</text><rect x="242" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="263.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">sat</text><rect x="288" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="309.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">on</text><rect x="334" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="355.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">the</text><rect x="380" y="148" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="401.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mat</text><rect x="426" y="148" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="447.0" y="167" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">because</text><line x1="470" y1="162" x2="484" y2="162" stroke="#8a6bd1" stroke-width="1.2" marker-end="url(#ar)"/><rect x="486" y="148" width="42" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4" stroke-dasharray="3 2"/><text x="507.0" y="167" fill="#8a6bd1" font-size="10.5" text-anchor="middle" font-weight="normal">it</text><text x="610" y="167" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">再算 1 个；cache 变成 6 个</text><text x="140" y="210" fill="#333" font-size="11" text-anchor="end" font-weight="600">decode 3</text><rect x="150" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="171.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">The</text><rect x="196" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="217.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">cat</text><rect x="242" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="263.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">sat</text><rect x="288" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="309.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">on</text><rect x="334" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="355.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">the</text><rect x="380" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="401.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">mat</text><rect x="426" y="192" width="42" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="447.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="normal">because</text><rect x="472" y="192" width="42" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="493.0" y="211" fill="#222" font-size="10.5" text-anchor="middle" font-weight="600">it</text><line x1="516" y1="206" x2="530" y2="206" stroke="#8a6bd1" stroke-width="1.2" marker-end="url(#ar)"/><rect x="532" y="192" width="42" height="28" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4" stroke-dasharray="3 2"/><text x="553.0" y="211" fill="#8a6bd1" font-size="10.5" text-anchor="middle" font-weight="normal">was</text><text x="610" y="211" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">……直到 EOS 或长度上限</text><rect x="150" y="244" width="42" height="16" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="4"/><text x="198" y="256" fill="#333" font-size="10.5" text-anchor="start" font-weight="normal">已在 KV cache 里，不再计算</text><rect x="380" y="244" width="42" height="16" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="428" y="256" fill="#333" font-size="10.5" text-anchor="start" font-weight="normal">这一步真正过模型的 token</text><rect x="590" y="244" width="42" height="16" fill="#f3f0fa" stroke="#8a6bd1" stroke-width="1.2" rx="4" stroke-dasharray="3 2"/><text x="638" y="256" fill="#333" font-size="10.5" text-anchor="start" font-weight="normal">从最后一个位置的分布抽出的新 token</text><text x="60" y="288" fill="#333" font-size="11" text-anchor="start" font-weight="normal">为什么旧 token 不用重算：causal attention 里第 i 个 token 的 K、V 只由 token 0..i 决定，</text><text x="60" y="306" fill="#333" font-size="11" text-anchor="start" font-weight="normal">新 token 来了它们一个数都不变（L0 第四篇）。每步计算量从「整段 T 个 token」降到「1 个 token」；</text><text x="60" y="324" fill="#333" font-size="11" text-anchor="start" font-weight="normal">代价是显存里多一份逐层、逐 token 的 K、V——Llama-3-8B 每个 token 128 KiB（第六篇）。</text><text x="60" y="348" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">训练 vs 推理：训练一次前向 T 个位置都「新算」且都有目标；推理只有最后一个位置需要分布，</text><text x="60" y="364" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">前面的位置只为了给后面提供 K、V。</text>
</svg>
