.m{font-family:'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:14px}
.w{font-size:12px;fill:#555}
.r{fill:#c0392b;font-weight:700}
.o{fill:#d35400}
.cell{fill:#fff;stroke:#555;stroke-width:1}
.out{fill:#f2f2f2;stroke:#555;stroke-width:1}
</style>
<rect width="740" height="304" fill="#fff"/>
<text class="m" x="60" y="30" text-anchor="end">10<tspan baseline-shift="super" font-size="0.72em">4</tspan></text><text class="m" x="68" y="30">= 1.0011100010 × 2<tspan baseline-shift="super" font-size="0.72em">13</tspan></text><text x="250" y="30">（恰好 10 位尾数，FP16 可精确表示）</text>
<text class="m" x="60" y="54" text-anchor="end">1</text><text class="m" x="68" y="54">= 1.0000000000 × 2<tspan baseline-shift="super" font-size="0.72em">0</tspan></text>
