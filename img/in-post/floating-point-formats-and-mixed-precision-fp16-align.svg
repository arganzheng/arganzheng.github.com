<svg xmlns="http://www.w3.org/2000/svg" width="740" height="304" viewBox="0 0 740 304" role="img" aria-labelledby="t d">
<title id="t">FP16 下 10^4 + 1 的逐位对齐</title>
<desc id="d">10^4 = 1.0011100010 × 2^13，1 = 1.0000000000 × 2^0。对齐到 2^13 后，1 右移 13 位，唯一的有效位落在 10 位尾数窗口外第 3 位（位权 2^0）；精确和的窗口外部分为 001，即 1/8 ulp，小于 1/2 ulp，舍入到最近后结果为 1.0011100010 × 2^13 = 10^4。</desc>
<style>
