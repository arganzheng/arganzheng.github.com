<title id="tr-rate-t">FLUX 28 步的相对变化率（示意）</title>
<desc id="tr-rate-d">柱状图：FLUX 28 步里相邻步残差的相对 L1 差。第 1 步没有上一步；第 2 步约 40%，开头几步迅速降到 10% 左右，第 5 到 22 步平缓在 5–10%，结尾几步又升到 20% 以上。下方标出三段：第 1–4 步决定构图不能跳，第 5–22 步平缓可跳，第 23–28 步决定细节少跳。</desc>
