<line x1="534.0" y1="220.0" x2="534.0" y2="136.0" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="539.0" y="152.0" font-size="13" text-anchor="start" fill="#111">⑧</text>
