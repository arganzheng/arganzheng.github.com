<line x1="150.0" y1="278.0" x2="732.0" y2="278.0" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="720.0" y="296.0" font-size="12" text-anchor="end" fill="#111">时间</text>
</svg>
