<line x1="246" y1="76" x2="246" y2="160" stroke="#fff" stroke-width="5"/>
<line x1="246.0" y1="76.0" x2="246.0" y2="160.0" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="251.0" y="92.0" font-size="13" text-anchor="start" fill="#111">②</text>
<line x1="342" y1="136" x2="342" y2="220" stroke="#fff" stroke-width="5"/>
<line x1="342.0" y1="136.0" x2="342.0" y2="220.0" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
