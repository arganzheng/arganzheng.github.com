<line x1="534.0" y1="100.0" x2="534.0" y2="76.0" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="539.0" y="92.0" font-size="13" text-anchor="start" fill="#111">⑨</text>
