  <rect x="168" y="236" width="102" height="24" class="gpu"/>
  <text x="176" y="252.5" text-anchor="start">GPU3</text>
  <line x1="158" y1="280" x2="168" y2="280" class="pcie"/>
  <rect x="168" y="268" width="102" height="24" class="nic"/>
  <text x="176" y="284.5" text-anchor="start">NIC2</text>
  <line x1="158" y1="312" x2="168" y2="312" class="pcie"/>
  <rect x="168" y="300" width="102" height="24" class="nic"/>
  <text x="176" y="316.5" text-anchor="start">NIC3</text>
  <line x1="318.0" y1="96" x2="318.0" y2="112" class="pcie"/>
  <rect x="280" y="112" width="76" height="24" class="sw"/>
  <text x="318.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="318.0" y1="136" x2="318.0" y2="160" class="pcie"/>
  <rect x="280" y="160" width="76" height="44" class="sw"/>
  <text x="318.0" y="178.0" text-anchor="middle" class="s">NVMe /</text>
  <text x="318.0" y="195.0" text-anchor="middle" class="s">管理网卡 …</text>
  <rect x="404" y="44" width="340" height="52" class="cpu"/>
  <text x="574.0" y="66.0" text-anchor="middle" class="b">CPU1 (NUMA 1)</text>
  <text x="574.0" y="83.0" text-anchor="middle">root complex</text>
  <line x1="465.0" y1="96" x2="465.0" y2="112" class="pcie"/>
  <rect x="404" y="112" width="122" height="24" class="sw"/>
  <text x="465.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="465.0" y1="136" x2="465.0" y2="160" class="pcie"/>
  <rect x="404" y="160" width="122" height="28" class="sw"/>
  <text x="465.0" y="178.5" text-anchor="middle">PCIe switch 2</text>
  <line x1="414" y1="188" x2="414" y2="312" class="pcie"/>
  <line x1="414" y1="216" x2="424" y2="216" class="pcie"/>
  <rect x="424" y="204" width="102" height="24" class="gpu"/>
  <text x="432" y="220.5" text-anchor="start">GPU4</text>
  <line x1="414" y1="248" x2="424" y2="248" class="pcie"/>
  <rect x="424" y="236" width="102" height="24" class="gpu"/>
  <text x="432" y="252.5" text-anchor="start">GPU5</text>
  <line x1="414" y1="280" x2="424" y2="280" class="pcie"/>
  <rect x="424" y="268" width="102" height="24" class="nic"/>
  <text x="432" y="284.5" text-anchor="start">NIC4 (mlx5_4)</text>
  <line x1="414" y1="312" x2="424" y2="312" class="pcie"/>
  <rect x="424" y="300" width="102" height="24" class="nic"/>
  <text x="432" y="316.5" text-anchor="start">NIC5 (mlx5_5)</text>
  <line x1="597.0" y1="96" x2="597.0" y2="112" class="pcie"/>
  <rect x="536" y="112" width="122" height="24" class="sw"/>
  <text x="597.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="597.0" y1="136" x2="597.0" y2="160" class="pcie"/>
  <rect x="536" y="160" width="122" height="28" class="sw"/>
  <text x="597.0" y="178.5" text-anchor="middle">PCIe switch 3</text>
  <line x1="546" y1="188" x2="546" y2="312" class="pcie"/>
  <line x1="546" y1="216" x2="556" y2="216" class="pcie"/>
  <rect x="556" y="204" width="102" height="24" class="gpu"/>
  <text x="564" y="220.5" text-anchor="start">GPU6</text>
  <line x1="546" y1="248" x2="556" y2="248" class="pcie"/>
  <rect x="556" y="236" width="102" height="24" class="gpu"/>
  <text x="564" y="252.5" text-anchor="start">GPU7</text>
  <line x1="546" y1="280" x2="556" y2="280" class="pcie"/>
  <rect x="556" y="268" width="102" height="24" class="nic"/>
  <text x="564" y="284.5" text-anchor="start">NIC6</text>
  <line x1="546" y1="312" x2="556" y2="312" class="pcie"/>
  <rect x="556" y="300" width="102" height="24" class="nic"/>
  <text x="564" y="316.5" text-anchor="start">NIC7</text>
  <line x1="706.0" y1="96" x2="706.0" y2="112" class="pcie"/>
  <rect x="668" y="112" width="76" height="24" class="sw"/>
  <text x="706.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="706.0" y1="136" x2="706.0" y2="160" class="pcie"/>
  <rect x="668" y="160" width="76" height="28" class="sw"/>
  <text x="706.0" y="178.5" text-anchor="middle" class="s">…</text>
</svg>
