<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title desc">
  <title id="title">双路服务器的 PCIe 树：root complex、switch、GPU、NIC</title>
  <desc id="desc">CPU0（NUMA 0）的 root complex 有三个 root port：PCIe switch 0 下挂 GPU0、GPU1、NIC0 (mlx5_0)、NIC1 (mlx5_1)；PCIe switch 1 下挂 GPU2、GPU3、NIC2、NIC3；第三个接 NVMe / 管理网卡等。CPU1（NUMA 1）同样：PCIe switch 2 下挂 GPU4、GPU5、NIC4 (mlx5_4)、NIC5 (mlx5_5)；PCIe switch 3 下挂 GPU6、GPU7、NIC6、NIC7；还有其他 root port。两颗 CPU 之间是 UPI / Infinity Fabric。</desc>
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2d3d; font-size: 13px; font-weight: 500; }
.b { font-size: 14px; font-weight: 700; }
.s { font-size: 12px; }
.m { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
.frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.3; }
.gpu { fill: #dbe9f6; stroke: #3b6ea5; stroke-width: 1.2; }
.nic { fill: #e3f2e1; stroke: #4a8a3a; stroke-width: 1.2; }
.cpu { fill: #fdf1d6; stroke: #b8860b; stroke-width: 1.2; }
.sw { fill: #f1f1f1; stroke: #777; stroke-width: 1.2; }
.mem { fill: #efe6f6; stroke: #8e5ea2; stroke-width: 1.2; }
.net { fill: #fbe9e7; stroke: #c0392b; stroke-width: 1.2; }
.nvl { stroke: #3b6ea5; stroke-width: 3.5; fill: none; }
.pcie { stroke: #555; stroke-width: 1.6; fill: none; }
.upi { stroke: #b8860b; stroke-width: 2; fill: none; }
.wire { stroke: #c0392b; stroke-width: 1.6; fill: none; }
.port { fill: #555; }
  </style>
  <rect width="760" height="340" fill="#ffffff"/>
  <path d="M186,44 V32 H574 V44" class="upi"/>
  <text x="380" y="26" text-anchor="middle">UPI / Infinity Fabric</text>
  <rect x="16" y="44" width="340" height="52" class="cpu"/>
  <text x="186.0" y="66.0" text-anchor="middle" class="b">CPU0 (NUMA 0)</text>
  <text x="186.0" y="83.0" text-anchor="middle">root complex</text>
  <line x1="77.0" y1="96" x2="77.0" y2="112" class="pcie"/>
  <rect x="16" y="112" width="122" height="24" class="sw"/>
  <text x="77.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="77.0" y1="136" x2="77.0" y2="160" class="pcie"/>
  <rect x="16" y="160" width="122" height="28" class="sw"/>
  <text x="77.0" y="178.5" text-anchor="middle">PCIe switch 0</text>
  <line x1="26" y1="188" x2="26" y2="312" class="pcie"/>
  <line x1="26" y1="216" x2="36" y2="216" class="pcie"/>
  <rect x="36" y="204" width="102" height="24" class="gpu"/>
  <text x="44" y="220.5" text-anchor="start">GPU0</text>
  <line x1="26" y1="248" x2="36" y2="248" class="pcie"/>
  <rect x="36" y="236" width="102" height="24" class="gpu"/>
  <text x="44" y="252.5" text-anchor="start">GPU1</text>
  <line x1="26" y1="280" x2="36" y2="280" class="pcie"/>
  <rect x="36" y="268" width="102" height="24" class="nic"/>
  <text x="44" y="284.5" text-anchor="start">NIC0 (mlx5_0)</text>
  <line x1="26" y1="312" x2="36" y2="312" class="pcie"/>
  <rect x="36" y="300" width="102" height="24" class="nic"/>
  <text x="44" y="316.5" text-anchor="start">NIC1 (mlx5_1)</text>
  <line x1="209.0" y1="96" x2="209.0" y2="112" class="pcie"/>
  <rect x="148" y="112" width="122" height="24" class="sw"/>
  <text x="209.0" y="128.5" text-anchor="middle" class="s">root port</text>
  <line x1="209.0" y1="136" x2="209.0" y2="160" class="pcie"/>
  <rect x="148" y="160" width="122" height="28" class="sw"/>
