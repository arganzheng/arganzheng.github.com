<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="t d">
  <title id="t">Bs 读取的 bank 分布：现状与修法</title>
  <desc id="d">Bs[kk][·] 一行 128 个 float 按 bank = 下标 mod 32 折成 4 行。现状每个 tn 读连续 8 列，tn、tn+4、tn+8、tn+12 落在同一组 bank，只用 16 个 bank、4 个 wavefront；修法把 8 列拆成 [tn*4, +4) 和 [64 + tn*4, +4)，tn 0..7 铺满 32 个 bank，tn 8..15 是下一行，2 个 wavefront。</desc>
