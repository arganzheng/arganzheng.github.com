<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" role="img" aria-labelledby="title desc">
<title id="title">tile[32][32] 各元素所在的 bank</title><desc id="desc">行 0、行 1、行 31 的各列映射到 bank 0、bank 1、bank 2、直到 bank 31，同一列始终落在同一个 bank。</desc>
