<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">y.expand(2, 3)：shape=(2, 3)，stride=(0, 1)——两行读的是同一段内存</text><text x="60" y="56" fill="#333" font-size="11" text-anchor="start" font-weight="600">第一步：右对齐比较各维</text><text x="80" y="76" fill="#333" font-size="11" text-anchor="start" font-weight="normal">x　(2, 3)</text><text x="80" y="94" fill="#333" font-size="11" text-anchor="start" font-weight="normal">y　(   3)　→ 缺失的维度视为 1，补成 (1, 3)</text><text x="80" y="112" fill="#333" font-size="11" text-anchor="start" font-weight="normal">z　(2, 3)　→ 1 可以扩展成 2，3 == 3 保持不变</text><text x="60" y="150" fill="#333" font-size="11" text-anchor="start" font-weight="600">第二步：expand 视图（逻辑 2×3）</text><rect x="100" y="168" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="135.0" y="186.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 0</text><rect x="170" y="168" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="205.0" y="186.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 1</text><rect x="240" y="168" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="275.0" y="186.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 2</text><text x="94" y="186.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=0</text><rect x="100" y="196" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="135.0" y="214.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 0</text><rect x="170" y="196" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="205.0" y="214.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 1</text><rect x="240" y="196" width="70" height="28" fill="#fff" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="275.0" y="214.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">→ idx 2</text><text x="94" y="214.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=1</text><text x="135.0" y="162" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=0</text><text x="205.0" y="162" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=1</text><text x="275.0" y="162" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=2</text><text x="440" y="150" fill="#333" font-size="11" text-anchor="start" font-weight="600">y 的 storage（物理只有 3 个元素）</text><rect x="470" y="182" width="50" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="495.0" y="200.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">y0</text><text x="495.0" y="176" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">0</text><rect x="520" y="182" width="50" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="545.0" y="200.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">y1</text><text x="545.0" y="176" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">1</text><rect x="570" y="182" width="50" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="0"/><text x="595.0" y="200.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">y2</text><text x="595.0" y="176" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">2</text><line x1="312" y1="182" x2="466" y2="196" stroke="#c98a00" stroke-width="1.2" marker-end="url(#ar)"/><line x1="312" y1="210" x2="466" y2="196" stroke="#c98a00" stroke-width="1.2" marker-end="url(#ar)"/><text x="390" y="176" fill="#c98a00" font-size="10.5" text-anchor="middle" font-weight="600">两行都读</text><text x="60" y="250" fill="#333" font-size="11" text-anchor="start" font-weight="normal">offset(i, j) = i·0 + j·1 = j　←　i 变化不移动物理位置，两行读的是同一段内存；不分配新 storage，不复制。</text>
</svg>
