<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img" aria-labelledby="title desc">
  <title id="title">默认部署：vllm serve + AsyncMPClient + MultiprocExecutor</title>
  <desc id="desc">API Server、EngineCoreProc 和 WorkerProc 的模块、线程与消息通道。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2b7a78"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 19px; font-weight: 700; }
      .process { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .box { stroke-width: 2; rx: 14; }
      .thread { fill: #fff; stroke: #b8c7d8; stroke-width: 1.4; rx: 9; }
    </style>
  </defs>
  <rect width="760" height="1060" fill="#fff"/>
  <text x="380" y="34" text-anchor="middle" class="title">默认部署：vllm serve + AsyncMPClient + MultiprocExecutor</text>

  <rect x="28" y="54" width="704" height="218" class="box" fill="#eef5ff" stroke="#5880b4"/>
  <text x="50" y="84" class="process">进程 A · API Server</text>
  <text x="50" y="109" class="body">FastAPI · OpenAI route · uvicorn / uvloop</text>
  <rect x="48" y="124" width="664" height="102" class="thread"/>
  <text x="66" y="149" class="label">AsyncLLM</text>
  <text x="66" y="174" class="body">InputProcessor · tokenize → EngineCoreRequest</text>
  <text x="66" y="197" class="body">AsyncMPClient · OutputProcessor · detokenize → SSE</text>
  <text x="50" y="251" class="small">文本处理留在这里；默认多进程路径下不持有模型权重，也不跑 GPU forward</text>

  <line x1="220" y1="273" x2="220" y2="354" stroke="#40566f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="238" y="296" class="label">API → EngineCore</text>
  <text x="238" y="316" class="small">ZMQ / msgpack · ADD</text>
  <text x="238" y="334" class="small">EngineCoreRequest · ABORT · UTILITY</text>
  <line x1="535" y1="354" x2="535" y2="273" stroke="#40566f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="552" y="296" class="label">EngineCore → API</text>
  <text x="552" y="316" class="small">ZMQ / msgpack</text>
  <text x="552" y="334" class="small">只有 token ids</text>

  <rect x="28" y="356" width="704" height="300" class="box" fill="#fff6e9" stroke="#c6873d"/>
  <text x="50" y="386" class="process">进程 B · EngineCoreProc</text>
  <rect x="48" y="400" width="664" height="54" class="thread"/>
  <text x="66" y="423" class="label">输入线程</text>
  <text x="200" y="423" class="body">ZMQ → MsgpackDecoder → input_queue</text>
  <text x="200" y="443" class="small">接收 ADD / ABORT / UTILITY</text>
  <rect x="48" y="463" width="664" height="118" class="thread"/>
  <text x="66" y="487" class="label">主线程 · EngineCore.run_busy_loop()</text>
  <text x="66" y="511" class="body">Scheduler.schedule() → MultiprocExecutor.execute_model()</text>
  <text x="66" y="533" class="body">→ Scheduler.update_from_output()</text>
  <text x="66" y="555" class="small">Scheduler 持有 Request 状态、KVCacheManager 与 BlockPool 元数据</text>
  <text x="66" y="573" class="small">StructuredOutputManager 也在 EngineCore 侧</text>
  <rect x="48" y="590" width="664" height="48" class="thread"/>
  <text x="66" y="619" class="label">输出线程</text>
  <text x="200" y="619" class="body">output_queue → MsgpackEncoder → ZMQ</text>

  <line x1="220" y1="657" x2="220" y2="755" stroke="#2b7a78" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="238" y="684" class="label">EngineCore → Worker</text>
  <text x="238" y="704" class="small">MessageQueue 广播</text>
  <text x="238" y="722" class="small">SchedulerOutput · 同机共享内存</text>
  <line x1="535" y1="755" x2="535" y2="657" stroke="#2b7a78" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="552" y="684" class="label">Worker → EngineCore</text>
  <text x="552" y="704" class="small">response queue</text>
  <text x="552" y="722" class="small">ModelRunnerOutput</text>
  <text x="552" y="740" class="small">仅 output_rank 回传</text>

  <rect x="28" y="757" width="704" height="270" class="box" fill="#eff9f4" stroke="#4b9477"/>
  <text x="50" y="787" class="process">进程 C · WorkerProc × N（TP × PP ranks）</text>
  <rect x="48" y="801" width="664" height="158" class="thread"/>
  <text x="66" y="827" class="label">WorkerProc 主线程 · MessageQueue 出队 → Worker</text>
  <text x="66" y="852" class="body">GPUModelRunner（ModelRunner）· Attention Backend</text>
  <text x="66" y="877" class="body">模型权重分片 · GPU KV cache tensors</text>
  <text x="66" y="907" class="small">各 rank 之间的 TP / PP collective 走 NCCL / PyTorch distributed</text>
  <text x="66" y="928" class="small">rank 直接通信，不经过 EngineCore</text>
  <text x="50" y="984" class="small">跨机时 worker 控制队列走远程传输；共享内存只适用于同机 worker。</text>
</svg>
