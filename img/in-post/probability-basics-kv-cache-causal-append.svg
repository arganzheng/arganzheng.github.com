<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">为什么 KV cache 可以只追加不重算：因果 attention 里，旧 token 的 K、V 不看新 token</text><text x="40" y="74" fill="#333" font-size="12" text-anchor="start" font-weight="600">第 3 步</text><rect x="170" y="54" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="220" y="75" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">我　k1, v1</text><text x="220" y="102" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><rect x="290" y="54" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="340" y="75" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">爱　k2, v2</text><text x="340" y="102" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><rect x="410" y="54" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="460" y="75" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">北京　k3, v3</text><text x="460" y="102" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><text x="40" y="120" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">前 3 个 token 各自算出自己的 k、v，存进 cache；第 3 个 token 的 q 去和 k₁ k₂ k₃ 算分</text><text x="40" y="164" fill="#333" font-size="12" text-anchor="start" font-weight="600">第 4 步</text><rect x="170" y="144" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="220" y="165" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">我　k1, v1</text><text x="220" y="192" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><rect x="290" y="144" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="340" y="165" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">爱　k2, v2</text><text x="340" y="192" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><rect x="410" y="144" width="100" height="34" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.5" rx="4"/><text x="460" y="165" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">北京　k3, v3</text><text x="460" y="192" fill="#4d9a5c" font-size="10" text-anchor="middle" font-weight="normal">缓存里直接用</text><rect x="530" y="144" width="100" height="34" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="580" y="165" fill="#222" font-size="11.5" text-anchor="middle" font-weight="normal">天安门　k4, v4</text><text x="580" y="192" fill="#c98a00" font-size="10" text-anchor="middle" font-weight="600">新算</text><text x="40" y="210" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">来了"天安门"：只新算 k₄、v₄ 并追加；k₁…k₃、v₁…v₃ 一个数都没变——因为它们只由各自左边的 token 决定</text><text x="40" y="254" fill="#333" font-size="12" text-anchor="start" font-weight="600">第 4 步的 attention</text><rect x="170" y="234" width="100" height="34" fill="#e8eef8" stroke="#1f4f8a" stroke-width="1.5" rx="4"/><text x="220" y="255" fill="#1f4f8a" font-size="11.5" text-anchor="middle" font-weight="normal">q₄（天安门）</text><line x1="270" y1="251" x2="220" y2="290" stroke="#1f4f8a" stroke-width="1.2" marker-end="url(#ar)"/><text x="220" y="306" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">k1·q₄ → 权重 → 取 v1</text><line x1="270" y1="251" x2="340" y2="290" stroke="#1f4f8a" stroke-width="1.2" marker-end="url(#ar)"/><text x="340" y="306" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">k2·q₄ → 权重 → 取 v2</text><line x1="270" y1="251" x2="460" y2="290" stroke="#1f4f8a" stroke-width="1.2" marker-end="url(#ar)"/><text x="460" y="306" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">k3·q₄ → 权重 → 取 v3</text><line x1="270" y1="251" x2="580" y2="290" stroke="#1f4f8a" stroke-width="1.2" marker-end="url(#ar)"/><text x="580" y="306" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">k4·q₄ → 权重 → 取 v4</text><text x="380" y="340" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">反例：双向编码器（BERT 一类）里第 1 个 token 的表示也要看第 4 个 token，新 token 一来前面全变，缓存就失效了。</text><text x="380" y="358" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">所以"条件分布只依赖前文"（数学）+ "每个位置只看左边"（架构）两条一起，才让 decode 每步的代价从"重算整句"降到"算一个 token"。</text>
</svg>
