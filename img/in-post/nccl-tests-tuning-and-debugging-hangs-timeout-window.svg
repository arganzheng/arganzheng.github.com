<svg xmlns="http://www.w3.org/2000/svg" width="740" height="396" viewBox="0 0 740 396" role="img" aria-labelledby="timeout-window-t timeout-window-d">
<title id="timeout-window-t">timeout 覆盖的区间：三条时间线并排</title>
<desc id="timeout-window-d">CPU 线程、计算 stream、NCCL stream 与 watchdog 四行共用一条时间轴。t0 是 CPU 调用 dist.all_reduce、WorkNCCL 创建、workStartTime_ 起算的时刻；CPU 立即返回、Python 继续，直到 .item() 这类同步点阻塞；NCCL stream 先等计算 stream 上排在前面的 30 s GEMM，再执行在 flag 上自旋等对端的 NCCL kernel，最后是 end event；watchdog 每 100 ms 检查 now − workStartTime_ 是否超过 opTimeout_ 且 end event 未完成。opTimeout_ 的计量区间从 t0 到 end event 完成，包含排队与等对端，不管 CPU 侧等多久。</desc>
<style>
text { font-family: 'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #111; font-weight: 500; }
.s { font-size: 12px; } .m { font-size: 13px; } .l { font-size: 14px; font-weight: 600; }
.mono { font-family: 'SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace; }

</style>
<rect width="740" height="396" fill="#ffffff"/>

<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="2"/></pattern></defs>
<line x1="190" y1="58" x2="190" y2="326" stroke="#111" stroke-width="1" stroke-dasharray="none"/>
<line x1="620" y1="58" x2="620" y2="326" stroke="#111" stroke-width="1" stroke-dasharray="5 3"/>
<text class="m" x="186" y="30" text-anchor="start" >t0：CPU 调用 dist.all_reduce</text>
<text class="m" x="186" y="48" text-anchor="start" >WorkNCCL 创建，workStartTime_ 起算</text>
<text class="m" x="626" y="48" text-anchor="start" >end event 完成</text>
<text class="l" x="24" y="114.0" text-anchor="start" >CPU 线程</text>
<text class="l" x="24" y="178.0" text-anchor="start" >计算 stream</text>
<text class="l" x="24" y="242.0" text-anchor="start" >NCCL stream</text>
<text class="l" x="24" y="306.0" text-anchor="start" >watchdog 线程</text>
<rect x="190" y="92" width="190" height="34" fill="#e8f1fb" stroke="#555" stroke-width="1"/>
<text class="m" x="285.0" y="113.5" text-anchor="middle">立即返回，Python 继续</text>
<rect x="380" y="92" width="240" height="34" fill="#fde2c8" stroke="#555" stroke-width="1"/>
<text class="m" x="500.0" y="113.5" text-anchor="middle">.item() 等同步点阻塞</text>
<line x1="620" y1="109.0" x2="716" y2="109.0" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<text class="s" x="628" y="102.0" text-anchor="start" >继续</text>
<text class="s" x="386" y="145" text-anchor="start" >（CPU 侧等多久，timeout 不管）</text>
<rect x="190" y="156" width="180" height="34" fill="#e3e3f6" stroke="#555" stroke-width="1"/>
<text class="m" x="280.0" y="177.5" text-anchor="middle">排在前面的 GEMM 30 s</text>
<rect x="190" y="220" width="180" height="34" fill="url(#hatch)" stroke="#555"/>
<text class="m" x="280.0" y="241.5" text-anchor="middle" >等 GEMM 的 event</text>
<rect x="370" y="220" width="250" height="34" fill="#fbd5d5" stroke="#555" stroke-width="1"/>
<text class="m" x="495.0" y="241.5" text-anchor="middle">NCCL kernel 自旋等对端 ……</text>
<rect x="617" y="216" width="6" height="42" fill="#111"/>
<line x1="370" y1="190" x2="370" y2="219" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<text class="s" x="376" y="209" text-anchor="start" >stream 依赖（event）</text>
<line x1="204" y1="290" x2="204" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="218" y1="290" x2="218" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="232" y1="290" x2="232" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="246" y1="290" x2="246" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="260" y1="290" x2="260" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="274" y1="290" x2="274" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="288" y1="290" x2="288" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="302" y1="290" x2="302" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="316" y1="290" x2="316" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="330" y1="290" x2="330" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="344" y1="290" x2="344" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="358" y1="290" x2="358" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="372" y1="290" x2="372" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="386" y1="290" x2="386" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="400" y1="290" x2="400" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="414" y1="290" x2="414" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="428" y1="290" x2="428" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="442" y1="290" x2="442" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="456" y1="290" x2="456" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="470" y1="290" x2="470" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="484" y1="290" x2="484" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="498" y1="290" x2="498" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="512" y1="290" x2="512" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="526" y1="290" x2="526" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="540" y1="290" x2="540" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="554" y1="290" x2="554" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="568" y1="290" x2="568" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="582" y1="290" x2="582" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="596" y1="290" x2="596" y2="300" stroke="#555" stroke-width="1.2"/>
<line x1="610" y1="290" x2="610" y2="300" stroke="#555" stroke-width="1.2"/>
<text class="s" x="194" y="320" text-anchor="start" >每 100 ms：now − workStartTime_ &gt; opTimeout_ 且 end event 未完成？</text>
<path d="M190,337 L190,344 L620,344 L620,337" fill="none" stroke="#0072B2" stroke-width="1.6"/>
<text class="m" x="405.0" y="364" text-anchor="middle" style="fill:#0b4f7c">opTimeout_ 计量区间（默认 10 min，含排队与等对端）</text>
<text class="s" x="728" y="386" text-anchor="end" style="fill:#444">示意，时长不按比例</text>
</svg>
