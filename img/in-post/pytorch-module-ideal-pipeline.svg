<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img" aria-labelledby="t d">
<title id="t">理想的训练流水线：CPU 准备下一批，GPU 算当前批</title>
<desc id="d">CPU Worker 一行依次准备 Batch N、N+1、N+2、N+3；GPU 一行晚一格依次计算 Batch N、N+1、N+2。每个 batch 准备完就交给 GPU，CPU 准备 N+1 与 GPU 计算 N 在同一时段进行。</desc>
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#111;font-weight:500}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
.small{font-size:12px}
.lab{font-size:13px;font-weight:600}
.num{font-size:12px;font-weight:600;fill:#555}
.mod{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.2}
.op{fill:#f5f5f5;stroke:#757575;stroke-width:1.2}
.cpu{fill:#fff8e1;stroke:#f9a825;stroke-width:1.2}
.gpu{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.2}
.ag{fill:#f3e5f5;stroke:#7b1fa2;stroke-width:1.2}
.opt{fill:#fbe9e7;stroke:#d84315;stroke-width:1.2}
.dash{stroke-dasharray:5 3}
.ln{stroke:#333;stroke-width:1.3;fill:none}
.ax{stroke:#888;stroke-width:1;fill:none}
.grid{stroke:#ccc;stroke-width:1;stroke-dasharray:3 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#333"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#888"/></marker></defs>
<rect width="720" height="236" fill="#fff"/>
<text x="20" y="87.0" text-anchor="start" dominant-baseline="central" class="lab">CPU Worker</text>
<text x="20" y="167.0" text-anchor="start" dominant-baseline="central" class="lab">GPU</text>
<rect x="249" y="60" width="147" height="134" fill="none" stroke="#1565c0" stroke-width="1.2" class="dash"/>
<text x="322.5" y="44" text-anchor="middle" dominant-baseline="central" class="small">同一时段：CPU 准备 N+1，GPU 计算 N</text>
<rect x="120" y="70" width="135" height="34" class="cpu"/>
<text x="187.5" y="87.0" text-anchor="middle" dominant-baseline="central">准备 Batch N</text>
<rect x="255" y="70" width="135" height="34" class="cpu"/>
<text x="322.5" y="87.0" text-anchor="middle" dominant-baseline="central">准备 Batch N+1</text>
<rect x="255" y="150" width="135" height="34" class="gpu"/>
<text x="322.5" y="167.0" text-anchor="middle" dominant-baseline="central">计算 Batch N</text>
<rect x="390" y="70" width="135" height="34" class="cpu"/>
<text x="457.5" y="87.0" text-anchor="middle" dominant-baseline="central">准备 Batch N+2</text>
<rect x="390" y="150" width="135" height="34" class="gpu"/>
<text x="457.5" y="167.0" text-anchor="middle" dominant-baseline="central">计算 Batch N+1</text>
<rect x="525" y="70" width="135" height="34" class="cpu"/>
<text x="592.5" y="87.0" text-anchor="middle" dominant-baseline="central">准备 Batch N+3</text>
<rect x="525" y="150" width="135" height="34" class="gpu"/>
<text x="592.5" y="167.0" text-anchor="middle" dominant-baseline="central">计算 Batch N+2</text>
<line x1="255" y1="104" x2="255" y2="150" class="ln" marker-end="url(#ah)"/>
<line x1="390" y1="104" x2="390" y2="150" class="ln" marker-end="url(#ah)"/>
<line x1="525" y1="104" x2="525" y2="150" class="ln" marker-end="url(#ah)"/>
<line x1="120" y1="214" x2="670" y2="214" class="ax" marker-end="url(#ahg)"/>
<text x="676" y="214" text-anchor="start" dominant-baseline="central" class="small">时间</text>
</svg>
