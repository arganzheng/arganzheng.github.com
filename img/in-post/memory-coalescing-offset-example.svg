  <rect x="394.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="410.0" y="271.0" font-size="12" text-anchor="middle" class="s">2</text>
  <rect x="426.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="442.0" y="271.0" font-size="12" text-anchor="middle" class="s">3</text>
  <rect x="458.0" y="256.0" width="32.0" height="22.0" fill="#93c5fd" stroke="#94a3b8" stroke-width="0.8" />
  <text x="474.0" y="271.0" font-size="12" text-anchor="middle" class="t">4</text>
  <rect x="490.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="506.0" y="271.0" font-size="12" text-anchor="middle" class="s">5</text>
  <rect x="522.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="538.0" y="271.0" font-size="12" text-anchor="middle" class="s">6</text>
  <rect x="554.0" y="256.0" width="32.0" height="22.0" fill="#fde68a" stroke="#94a3b8" stroke-width="0.8" />
  <text x="570.0" y="271.0" font-size="12" text-anchor="middle" class="t">7</text>
  <rect x="586.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="602.0" y="271.0" font-size="12" text-anchor="middle" class="s">8</text>
  <rect x="618.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="634.0" y="271.0" font-size="12" text-anchor="middle" class="s">9</text>
  <rect x="650.0" y="256.0" width="32.0" height="22.0" fill="#93c5fd" stroke="#94a3b8" stroke-width="0.8" />
  <text x="666.0" y="271.0" font-size="12" text-anchor="middle" class="t">10</text>
  <rect x="682.0" y="256.0" width="32.0" height="22.0" fill="#fff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="698.0" y="271.0" font-size="12" text-anchor="middle" class="s">11</text>
  <path d="M378.0,256.0 Q426.0,234.0 474.0,256.0" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="426.0" y="240.0" font-size="11" text-anchor="middle" class="t">+3</text>
  <path d="M474.0,256.0 Q522.0,234.0 570.0,256.0" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="522.0" y="240.0" font-size="11" text-anchor="middle" class="t">+3</text>
  <path d="M570.0,256.0 Q618.0,234.0 666.0,256.0" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="618.0" y="240.0" font-size="11" text-anchor="middle" class="t">+3</text>
  <text x="378.0" y="293.0" font-size="11" text-anchor="middle" class="s">i1=0</text>
  <text x="474.0" y="293.0" font-size="11" text-anchor="middle" class="s">i1=1</text>
  <text x="570.0" y="293.0" font-size="11" text-anchor="middle" class="s">i1=2</text>
  <text x="666.0" y="293.0" font-size="11" text-anchor="middle" class="s">i1=3</text>
  <text x="16.0" y="322.0" font-size="13" text-anchor="start" class="t">相邻线程 i1 差 1 → 地址差 3 个元素：不再合并</text>
