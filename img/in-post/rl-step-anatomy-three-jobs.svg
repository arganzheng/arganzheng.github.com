<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-labelledby="t d">
  <title id="t">一步 RL：生成 rollout、打分、训练</title>
  <desc id="d">三个并排的框：生成 rollout（推理引擎，B 个 prompt × G 条回答，decode 为主，serving 形态，memory-bound，长尾由最长回答决定）→ 打分（规则 / 验证器，或奖励模型，或代码沙箱）→ 训练（参考前向 log π_ref、旧策略前向 log π_old、策略前向 + 反向，PPO 还有价值模型）。打分到训练之间是同步 ①（样本：token、logprob、reward → 训练器）；训练完成后同步 ②（新权重 → 推理引擎）回到生成。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect class="compute" x="16" y="16" width="330" height="102"/><text x="28" y="38" text-anchor="start" class="bold">生成 rollout</text><text x="28" y="66" text-anchor="start" class="small">推理引擎：B 个 prompt × G 条回答，decode 为主</text><text x="28" y="85" text-anchor="start" class="small">形态：serving —— 请求、批、KV 池、连续批处理</text><text x="28" y="104" text-anchor="start" class="small">memory-bound，长尾由最长的回答决定</text><rect class="card" x="380" y="16" width="112" height="102"/><text x="392" y="38" text-anchor="start" class="bold">打分</text><text x="392" y="66" text-anchor="start" class="small">规则 / 验证器</text><text x="392" y="85" text-anchor="start" class="small">或奖励模型</text><text x="392" y="104" text-anchor="start" class="small">或代码沙箱</text><rect class="memory" x="528" y="16" width="216" height="102"/><text x="540" y="38" text-anchor="start" class="bold">训练</text><text x="540" y="66" text-anchor="start" class="small">参考前向 log π_ref</text><text x="540" y="85" text-anchor="start" class="small">旧策略前向 log π_old</text><text x="540" y="104" text-anchor="start" class="small">策略前向 + 反向（PPO：价值模型）</text><line x1="346" y1="67.0" x2="380" y2="67.0" class="arrow"/><line x1="492" y1="67.0" x2="528" y2="67.0" class="arrow"/><path d="M636 118 V162 H181 V122" class="arrow"/><text x="408" y="154" text-anchor="middle" class="small">同步 ②：新权重 → 推理引擎</text><text x="408" y="182" text-anchor="middle" class="small">同步 ①：样本（token、logprob、reward）→ 训练器，在打分与训练之间</text>
</svg>
