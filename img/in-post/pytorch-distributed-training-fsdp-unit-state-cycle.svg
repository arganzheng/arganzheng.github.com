<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-labelledby="t d">
  <title id="t">分片单元在 step 中的状态循环</title>
  <desc id="d">前向：sharded 经 all_gather 变成 unsharded，前向计算后 reshard 回到 sharded。反向：sharded 再经 all_gather 变成 unsharded，反向计算后 reshard，并对梯度做 reduce_scatter，回到 sharded。</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b4504f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 13px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; fill: #5b6b7c; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .mut { fill: #5b6b7c; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .ax { stroke: #8795a5; stroke-width: 1; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="380" y="24" class="head" text-anchor="middle">分片单元在 step 中的状态循环</text>
  <text x="20" y="73" class="bold">前向</text>
  <text x="20" y="171" class="bold">反向</text>
  <rect x="120" y="52" width="90" height="32" rx="0" fill="#dbe8f7" stroke="#4a78b0" stroke-width="1.2"/>
  <text x="165.0" y="72.5" class="mono" text-anchor="middle">sharded</text>
  <rect x="330" y="52" width="100" height="32" rx="0" fill="#fbe5cc" stroke="#c27a2c" stroke-width="1.2"/>
  <text x="380.0" y="72.5" class="mono" text-anchor="middle">unsharded</text>
  <rect x="560" y="52" width="90" height="32" rx="0" fill="#dbe8f7" stroke="#4a78b0" stroke-width="1.2"/>
  <text x="605.0" y="72.5" class="mono" text-anchor="middle">sharded</text>
  <line x1="210" y1="68" x2="329" y2="68" stroke="#40566f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="270" y="62" class="monos" text-anchor="middle">all_gather</text>
  <line x1="430" y1="68" x2="559" y2="68" stroke="#40566f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="495" y="62" class="tiny" text-anchor="middle">前向计算</text>
  <text x="495" y="84" class="monos" text-anchor="middle">reshard</text>
  <rect x="555" y="150" width="100" height="32" rx="0" fill="#fbe5cc" stroke="#c27a2c" stroke-width="1.2"/>
  <text x="605.0" y="170.5" class="mono" text-anchor="middle">unsharded</text>
  <rect x="120" y="150" width="90" height="32" rx="0" fill="#dbe8f7" stroke="#4a78b0" stroke-width="1.2"/>
  <text x="165.0" y="170.5" class="mono" text-anchor="middle">sharded</text>
  <line x1="605" y1="84" x2="605" y2="149" stroke="#40566f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="613" y="121.0" class="monos">all_gather</text>
  <line x1="555" y1="166" x2="211" y2="166" stroke="#40566f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="383" y="160" class="tiny" text-anchor="middle">反向计算</text>
  <text x="383" y="182" class="monos" text-anchor="middle">reshard + reduce_scatter</text>
</svg>
