<text x="338" y="380" text-anchor="middle" class="small">1g</text>
<rect class="seg-dim" x="360" y="358" width="44" height="34"/>
<rect class="p3" x="436" y="358" width="152" height="34"/>
<text x="512" y="380" text-anchor="middle" class="small">4 片</text>
<rect class="p2" x="588" y="358" width="76" height="34"/>
<text x="626" y="380" text-anchor="middle" class="small">2 片</text>
<rect class="p1" x="664" y="358" width="38" height="34"/>
<text x="683" y="380" text-anchor="middle" class="small">1</text>
<rect class="seg-dim" x="702" y="358" width="38" height="34"/>
<line x1="20" y1="406" x2="740" y2="406" class="rule"/>
<text x="20" y="428" text-anchor="start" class="smallb">碎片：先建 2g.10gb 于位置 4-5，再想放 4g.20gb（只能占 0-3）仍可</text>
<rect class="seg-free" x="96" y="438" width="44" height="34"/>
<rect class="seg-free" x="140" y="438" width="44" height="34"/>
<rect class="seg-free" x="184" y="438" width="44" height="34"/>
<rect class="seg-free" x="228" y="438" width="44" height="34"/>
<rect class="seg-free" x="360" y="438" width="44" height="34"/>
<rect class="p2" x="272" y="438" width="88" height="34"/>
<text x="316" y="460" text-anchor="middle" class="small">2g.10gb</text>
<text x="118" y="460" text-anchor="middle" class="note">0</text>
<text x="162" y="460" text-anchor="middle" class="note">1</text>
<text x="206" y="460" text-anchor="middle" class="note">2</text>
<text x="250" y="460" text-anchor="middle" class="note">3</text>
