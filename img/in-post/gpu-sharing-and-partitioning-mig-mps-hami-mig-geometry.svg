<text x="20" y="494" text-anchor="start" class="smallb">但若先建 1g.5gb 于位置 2，4g.20gb 就再也放不下——placement 固定导致的碎片</text>
<rect class="seg-free" x="96" y="504" width="44" height="34"/>
<rect class="seg-free" x="140" y="504" width="44" height="34"/>
