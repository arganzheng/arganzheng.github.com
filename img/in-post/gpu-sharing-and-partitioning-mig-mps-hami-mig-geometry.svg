<rect class="p3" x="588" y="266" width="152" height="34"/>
<text x="664" y="288" text-anchor="middle" class="small">4 片</text>
<text x="96" y="322" text-anchor="start" class="note">4g 只能从位置 0 起；3g 有两个合法起点（0 或 4）</text>
<text x="20" y="348" text-anchor="start" class="smallb">3g.20gb + 2g.10gb + 1g.5gb（6 / 7）</text>
<rect class="p3" x="96" y="358" width="132" height="34"/>
<text x="162" y="380" text-anchor="middle" class="small">3g.20gb</text>
<rect class="p2" x="228" y="358" width="88" height="34"/>
