<path d="M717 125 L721 118 L725 125" class="thin"/>
<text x="713" y="138" text-anchor="end" class="note">7 个 1g 实例用掉 7 个显存 slice，第 8 片空着</text>
<text x="20" y="164" text-anchor="start" class="smallb">all-3g.20gb（2 个实例）—— 核心问题的方案一</text>
<rect class="p3" x="96" y="174" width="132" height="34"/>
<text x="162" y="196" text-anchor="middle" class="small">3g.20gb A</text>
<rect class="p3" x="228" y="174" width="132" height="34"/>
<text x="294" y="196" text-anchor="middle" class="small">3g.20gb B</text>
<rect class="seg-dim" x="360" y="174" width="44" height="34"/>
<rect class="p3" x="436" y="174" width="152" height="34"/>
<text x="512" y="196" text-anchor="middle" class="small">A（4 片）</text>
<rect class="p3" x="588" y="174" width="152" height="34"/>
<text x="664" y="196" text-anchor="middle" class="small">B（4 片）</text>
<line x1="382" y1="232" x2="382" y2="211" class="thin"/>
<path d="M378 217 L382 210 L386 217" class="thin"/>
<text x="374" y="230" text-anchor="end" class="note">第 7 个计算 slice 没有显存可配，浪费</text>
<text x="20" y="256" text-anchor="start" class="smallb">4g.20gb + 3g.20gb（7 / 8，用满）</text>
<rect class="p4" x="96" y="266" width="176" height="34"/>
<text x="184" y="288" text-anchor="middle" class="small">4g.20gb</text>
<rect class="p3" x="272" y="266" width="132" height="34"/>
<text x="338" y="288" text-anchor="middle" class="small">3g.20gb</text>
<rect class="p4" x="436" y="266" width="152" height="34"/>
