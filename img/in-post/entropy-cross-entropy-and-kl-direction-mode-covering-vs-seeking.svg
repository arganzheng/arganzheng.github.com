<text x="424" y="76" fill="#777" font-size="11" text-anchor="start" font-weight="normal">p（灰，虚线）</text>
<text x="424" y="92" fill="#1f6fb2" font-size="11" text-anchor="start" font-weight="normal">q（蓝）</text>
<text x="580.0" y="212" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">q 有概率的地方 p 不能为零；q 为零的地方不罚</text>
<text x="580.0" y="230" fill="#333" font-size="11" text-anchor="middle" font-weight="600">→ q 挑一个峰待着（mode-seeking）：窄而尖</text>
<text x="380" y="265" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">若 q 可以任意取，两种 KL 的最优解都是 q = p，没有差别；差别只在「够不到」的时候出现。RLHF 的 KL 罚项是 reverse 方向。</text>
</svg>
