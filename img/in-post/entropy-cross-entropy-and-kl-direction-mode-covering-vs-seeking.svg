<text x="54" y="92" fill="#1f6fb2" font-size="11" text-anchor="start" font-weight="normal">q（蓝）</text>
<text x="210.0" y="212" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">p 有概率的地方 q 不能为零，否则 log(p/q) → ∞</text>
<text x="210.0" y="230" fill="#333" font-size="11" text-anchor="middle" font-weight="600">→ q 摊开盖住两个峰（mode-covering）：宽而平</text>
