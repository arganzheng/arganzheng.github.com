<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 247" width="760" height="247" role="img" aria-labelledby="t d">
  <title id="t">AoS 与 SoA 下 warp 读 x 分量触碰的内存</title>
  <desc id="d">每格 4 B。AoS：pts[i] = {x, y, z}，内存里是 x0 y0 z0 | x1 y1 z1 | x2 y2 z2 | x3 …，线程 i 读 x_i，间隔 12 B；32 B sector 的边界和结构体边界对不齐，warp 触碰共 384 B、12 sector，有效 128 B → 33%。SoA：x[]、y[]、z[] 三个数组，x0 x1 x2 … x31 连续，y、z 在别处，线程 i 读 x[i]，间隔 4 B，warp 触碰共 128 B、4 sector → 100%。</desc>
