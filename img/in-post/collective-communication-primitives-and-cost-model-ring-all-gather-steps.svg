<text x="80.0" y="71.0" text-anchor="middle">块 0、1 完整</text>
<rect x="216.0" y="34.0" width="128.0" height="46.0" rx="0" class="box"/>
<text x="280.0" y="53.0" text-anchor="middle" class="b">rank 1</text>
