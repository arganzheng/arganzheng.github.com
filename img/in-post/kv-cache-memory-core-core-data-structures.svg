<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-labelledby="t d">
  <title id="t">KV Cache 核心数据结构关系</title>
  <desc id="d">Request 经 KVCacheManager 对应一个 KVCacheBlocks；KVCacheBlocks 按 KV Cache Group 保存物理块序列；block_id 直接索引 GPU HBM 上的 kv_cache；每个 KVCacheBlock 记录 block_id、ref_cnt、block_hash 和 FreeBlockQueue 的前后指针，ref_cnt 为 0 的块串在双向链表里。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect class="card" x="40" y="16" width="330" height="106"/><text x="205.0" y="38" text-anchor="middle" class="bold">Request（逻辑层，不碰显存）</text><text x="205.0" y="60" text-anchor="middle" class="mono">request_id · prompt_token_ids</text><text x="205.0" y="79" text-anchor="middle" class="mono">output_token_ids · num_computed_tokens</text><text x="205.0" y="98" text-anchor="middle" class="mono">block_hashes · status</text><text x="385" y="50" text-anchor="start" class="small">KVCacheManager</text><text x="385" y="68" text-anchor="start" class="small">1 个 Request ↔ 1 个 KVCacheBlocks</text><line x1="205" y1="122" x2="205" y2="160" class="arrow"/><text x="40" y="154" text-anchor="start" class="small">KVCacheBlocks.blocks：外层按 KV Cache Group，内层是该 Group 的物理块序列</text><text x="52" y="186" text-anchor="middle" class="head">(</text><text x="60" y="184" text-anchor="start" class="head">[</text><rect class="seg-b" x="74" y="160" width="66" height="36"/><text x="107.0" y="183.0" text-anchor="middle" class="small">Block 7</text><rect class="seg-b" x="144" y="160" width="66" height="36"/><text x="177.0" y="183.0" text-anchor="middle" class="small">Block 13</text><rect class="seg-b" x="214" y="160" width="66" height="36"/><text x="247.0" y="183.0" text-anchor="middle" class="small">Block 21</text><text x="286" y="184" text-anchor="start" class="head">]</text><text x="300" y="184" text-anchor="start" class="head">, …  )</text><text x="40" y="238" text-anchor="start" class="small">GPU HBM：kv_cache[block_id]，每格 [block_size, num_kv_heads, head_dim]</text><rect class="seg-freefrag" x="40.0" y="250" width="42.5" height="40"/><text x="61.25" y="275.0" text-anchor="middle" class="small">0</text><rect class="seg-freefrag" x="82.5" y="250" width="42.5" height="40"/><text x="103.75" y="275.0" text-anchor="middle" class="small">1</text><rect class="seg-freefrag" x="125.0" y="250" width="42.5" height="40"/><text x="146.25" y="275.0" text-anchor="middle" class="small">2</text><rect class="seg-freefrag" x="167.5" y="250" width="42.5" height="40"/><text x="188.75" y="275.0" text-anchor="middle" class="small">3</text><rect class="seg-freefrag" x="210.0" y="250" width="42.5" height="40"/><text x="231.25" y="275.0" text-anchor="middle" class="small">4</text><rect class="seg-freefrag" x="252.5" y="250" width="42.5" height="40"/><text x="273.75" y="275.0" text-anchor="middle" class="small">5</text><rect class="seg-freefrag" x="295.0" y="250" width="42.5" height="40"/><text x="316.25" y="275.0" text-anchor="middle" class="small">6</text><rect class="seg-b" x="337.5" y="250" width="42.5" height="40"/><text x="358.75" y="275.0" text-anchor="middle" class="small">7</text><rect class="seg-freefrag" x="380.0" y="250" width="42.5" height="40"/><text x="401.25" y="275.0" text-anchor="middle" class="small">8</text><rect class="seg-freefrag" x="422.5" y="250" width="42.5" height="40"/><text x="443.75" y="275.0" text-anchor="middle" class="small">9</text><rect class="seg-freefrag" x="465.0" y="250" width="42.5" height="40"/><text x="486.25" y="275.0" text-anchor="middle" class="small">10</text><rect class="seg-freefrag" x="507.5" y="250" width="42.5" height="40"/><text x="528.75" y="275.0" text-anchor="middle" class="small">11</text><rect class="seg-freefrag" x="550.0" y="250" width="42.5" height="40"/><text x="571.25" y="275.0" text-anchor="middle" class="small">12</text><rect class="seg-b" x="592.5" y="250" width="42.5" height="40"/><text x="613.75" y="275.0" text-anchor="middle" class="small">13</text><rect class="seg-freefrag" x="635.0" y="250" width="42.5" height="40"/><text x="656.25" y="275.0" text-anchor="middle" class="small">14</text><rect class="seg-b" x="677.5" y="250" width="42.5" height="40"/><text x="698.75" y="275.0" text-anchor="middle" class="small">…</text><path d="M107 196 V226 H352.75 V250" class="arrow"/><path d="M177 196 V220 H609.75 V250" class="arrow"/><path d="M247 196 V214 H698.75 V250" class="arrow"/><text x="40" y="312" text-anchor="start" class="small">block_id 直接当下标：逻辑上连续的 7 → 13 → 21 落在不连续的物理块上</text><rect class="memory" x="40" y="340" width="300" height="100"/><text x="190.0" y="362" text-anchor="middle" class="bold">KVCacheBlock（以 Block 13 为例）</text><text x="190.0" y="384" text-anchor="middle" class="mono">block_id = 13   ref_cnt = 1</text><text x="190.0" y="403" text-anchor="middle" class="mono">block_hash = 0xDEF2</text><text x="190.0" y="422" text-anchor="middle" class="mono">prev_free_block / next_free_block</text><text x="372" y="352" text-anchor="start" class="small">FreeBlockQueue：双向链表，只串 ref_cnt == 0 的块</text><text x="372" y="370" text-anchor="start" class="small">Block 13 正被持有，不在链表里</text><text x="398" y="406" text-anchor="end" class="small">head</text><rect class="seg-freefrag" x="404" y="384" width="52" height="34"/><text x="430.0" y="406.0" text-anchor="middle" class="small">Block 2</text><line x1="456" y1="396" x2="480" y2="396" class="arrow"/><line x1="480" y1="406" x2="456" y2="406" class="arrow"/><rect class="seg-freefrag" x="480" y="384" width="52" height="34"/><text x="506.0" y="406.0" text-anchor="middle" class="small">Block 3</text><line x1="532" y1="396" x2="556" y2="396" class="arrow"/><line x1="556" y1="406" x2="532" y2="406" class="arrow"/><rect class="seg-freefrag" x="556" y="384" width="52" height="34"/><text x="582.0" y="406.0" text-anchor="middle" class="small">Block 4</text><line x1="608" y1="396" x2="632" y2="396" class="arrow"/><line x1="632" y1="406" x2="608" y2="406" class="arrow"/><rect class="seg-freefrag" x="632" y="384" width="52" height="34"/><text x="658.0" y="406.0" text-anchor="middle" class="small">Block 5</text><text x="688" y="406" text-anchor="start" class="small">tail</text><text x="544" y="438" text-anchor="middle" class="small">next_free_block →  /  ← prev_free_block</text>
</svg>
