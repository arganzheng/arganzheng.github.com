<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-labelledby="t d">
  <title id="t">一个调度器手里 4 个 warp 的逐周期 stall</title>
  <desc id="d">4 个 warp × 12 个周期的网格。warp 0–3 依次在第 1–4 周期发射一条 LDG，然后都在等数据（long scoreboard），第 5–9 周期没有任何 warp 就绪，发射槽空转；第 10–12 周期 warp 0–2 的数据回来，再次发射。</desc>
