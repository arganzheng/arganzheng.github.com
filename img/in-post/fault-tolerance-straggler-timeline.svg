<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" role="img" aria-labelledby="t d">
  <title id="t">一个 step 内各 rank 的时间线（rank 5 是 straggler）</title>
  <desc id="d">四行时间轴：rank 0、1、6 先计算，然后在 all-reduce 里等待，最慢的 rank 5 到达后才真正通信；rank 5 的计算段一直延伸到其他 rank 等待结束的位置，等待≈0。轴下三个标注：step 开始；快 rank 进入集合通信，开始等（单看自己像是通信慢）；最慢 rank 到达，all-reduce 才真正开始。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .mark { fill: #40566f; }
    </style>
  </defs>
<text x="24" y="18" text-anchor="start" class="small">时间</text>
<line x1="96" y1="14" x2="750" y2="14" class="axis"/>
<text x="24" y="51.0" text-anchor="start" class="mono">rank 0</text>
<rect class="seg-a" x="96" y="30" width="204" height="32"/>
<text x="198.0" y="51.0" text-anchor="middle" class="small">计算</text>
<rect class="seg-wait" x="300" y="30" width="220" height="32"/>
<text x="410.0" y="51.0" text-anchor="middle" class="small">等待 all-reduce</text>
<rect class="seg-b" x="520" y="30" width="80" height="32"/>
<text x="560.0" y="51.0" text-anchor="middle" class="small">通信</text>
<text x="24" y="95.0" text-anchor="start" class="mono">rank 1</text>
<rect class="seg-a" x="96" y="74" width="204" height="32"/>
<text x="198.0" y="95.0" text-anchor="middle" class="small">计算</text>
<rect class="seg-wait" x="300" y="74" width="220" height="32"/>
<text x="410.0" y="95.0" text-anchor="middle" class="small">等待 all-reduce</text>
<rect class="seg-b" x="520" y="74" width="80" height="32"/>
<text x="560.0" y="95.0" text-anchor="middle" class="small">通信</text>
<text x="24" y="139.0" text-anchor="start" class="mono">rank 5</text>
<rect class="seg-a" x="96" y="118" width="424" height="32"/>
<text x="308.0" y="139.0" text-anchor="middle" class="small">计算（慢）</text>
<rect class="seg-b" x="520" y="118" width="80" height="32"/>
<text x="560.0" y="139.0" text-anchor="middle" class="small">通信</text>
<text x="608" y="139.0" text-anchor="start" class="small">← 计算长、等待≈0</text>
<text x="24" y="183.0" text-anchor="start" class="mono">rank 6</text>
<rect class="seg-a" x="96" y="162" width="204" height="32"/>
<text x="198.0" y="183.0" text-anchor="middle" class="small">计算</text>
<rect class="seg-wait" x="300" y="162" width="220" height="32"/>
<text x="410.0" y="183.0" text-anchor="middle" class="small">等待 all-reduce</text>
<rect class="seg-b" x="520" y="162" width="80" height="32"/>
<text x="560.0" y="183.0" text-anchor="middle" class="small">通信</text>
<path d="M91 207 L101 207 L96 198 Z" class="mark"/>
<path d="M295 207 L305 207 L300 198 Z" class="mark"/>
<path d="M515 207 L525 207 L520 198 Z" class="mark"/>
<text x="96" y="224" text-anchor="start" class="small">step 开始</text>
<text x="300" y="224" text-anchor="start" class="small">快 rank 进入集合通信，开始等</text>
<text x="300" y="242" text-anchor="start" class="small">（单看自己：像是“通信慢”）</text>
<text x="520" y="224" text-anchor="start" class="small">最慢 rank 到达，</text>
<text x="520" y="242" text-anchor="start" class="small">all-reduce 才真正开始</text>
</svg>
