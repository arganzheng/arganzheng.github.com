<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">正交矩阵在做什么：旋转 90°——长度不变、夹角不变、逆就是转置</text><line x1="70" y1="190" x2="330" y2="190" stroke="#ccc" stroke-width="1"/><line x1="200" y1="250" x2="200" y2="60" stroke="#ccc" stroke-width="1"/><line x1="200" y1="190" x2="290" y2="160" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ar)"/><text x="296" y="154" fill="#1f6fb2" font-size="12" text-anchor="start" font-weight="600">a = (3, 1)</text><line x1="200" y1="190" x2="170" y2="100" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ar)"/><text x="92" y="94" fill="#1f6fb2" font-size="12" text-anchor="start" font-weight="600">Ra = (−1, 3)</text><line x1="200" y1="190" x2="260" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="268" y="132" fill="#c0392b" font-size="12" text-anchor="start" font-weight="600">b = (2, 2)</text><line x1="200" y1="190" x2="140" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="50" y="132" fill="#c0392b" font-size="12" text-anchor="start" font-weight="600">Rb = (−2, 2)</text><path d="M 260 170 A 63 63 0 0 0 180 130" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar)"/><text x="230" y="120" fill="#333" font-size="11" text-anchor="start" font-weight="normal">转 90°</text><text x="200" y="270" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">‖a‖ = √10 = ‖Ra‖　　‖b‖ = √8 = ‖Rb‖</text><text x="200" y="288" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">⟨a, b⟩ = 3·2 + 1·2 = 8 = (−1)·(−2) + 3·2 = ⟨Ra, Rb⟩</text><text x="380" y="62" fill="#222" font-size="11.5" text-anchor="start" font-weight="600">R 把 (x, y) 送到 (−y, x)：逆时针转 90°。</text><text x="380" y="80" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">它的两列是 (0, 1) 和 (−1, 0)：各长 1、互相垂直——</text><text x="380" y="98" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">这就是"正交矩阵"的全部要求，RᵀR = I 只是把它写成一个式子。</text><text x="380" y="124" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">a = (3, 1) → Ra = (0·3 + (−1)·1,  1·3 + 0·1) = (−1, 3)</text><text x="380" y="142" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">b = (2, 2) → Rb = (0·2 + (−1)·2,  1·2 + 0·2) = (−2, 2)</text><text x="380" y="160" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">两个向量一起转：长度没变、夹角没变、内积没变。</text><text x="380" y="186" fill="#222" font-size="11.5" text-anchor="start" font-weight="600">为什么在意它：作用后长度、夹角都不变，说明它只是</text><text x="380" y="204" fill="#222" font-size="11.5" text-anchor="start" font-weight="600">"换了个角度看同一组向量"，信息一点没丢。</text><text x="380" y="222" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">RoPE 用它给 token 打位置标记而不破坏 q、k 的相似度（第三章）；</text><text x="380" y="240" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">SVD 用两个正交矩阵把任意矩阵夹成"旋转·拉伸·旋转"（第四章）。</text><text x="380" y="266" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">求逆免费：R⁻¹ = Rᵀ——转回去就是转 −90°，不用解方程。</text>
</svg>
