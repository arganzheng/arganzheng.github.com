<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
  <style>.t{font-weight:600;fill:#222}.m{fill:#666;font-size:11px}.n{fill:#d6e6ff;stroke:#5b8def}.nh{fill:#fde7c8;stroke:#c98a00}.no{fill:#e8f5e9;stroke:#4d9a5c}</style>
  <text x="16" y="22" class="t">两层 MLP：输入层（不算层数）→ 隐藏层（Linear + ReLU）→ 输出层（Linear + softmax）</text>
  <!-- input column: 784 -->
  <g transform="translate(70,60)">
    <text x="0" y="-12" text-anchor="middle" class="m">输入 x</text>
    <text x="0" y="-0" text-anchor="middle" class="m">784 维（28×28 像素）</text>
    <circle cx="0" cy="30" r="9" class="n"/><circle cx="0" cy="58" r="9" class="n"/><circle cx="0" cy="86" r="9" class="n"/>
    <text x="0" y="118" text-anchor="middle" class="m">⋮</text>
    <circle cx="0" cy="146" r="9" class="n"/><circle cx="0" cy="174" r="9" class="n"/>
  </g>
  <!-- hidden column: 256 -->
  <g transform="translate(330,60)">
    <text x="0" y="-12" text-anchor="middle" class="m">隐藏层 a = ReLU(xW₁ + b₁)</text>
    <text x="0" y="-0" text-anchor="middle" class="m">256 个神经元</text>
    <circle cx="0" cy="30" r="9" class="nh"/><circle cx="0" cy="58" r="9" class="nh"/><circle cx="0" cy="86" r="9" class="nh"/>
    <text x="0" y="118" text-anchor="middle" class="m">⋮</text>
    <circle cx="0" cy="146" r="9" class="nh"/><circle cx="0" cy="174" r="9" class="nh"/>
  </g>
  <!-- output column: 10 -->
  <g transform="translate(590,60)">
    <text x="0" y="-12" text-anchor="middle" class="m">输出 z = aW₂ + b₂ → softmax</text>
    <text x="0" y="-0" text-anchor="middle" class="m">10 个类别</text>
    <circle cx="0" cy="44" r="9" class="no"/><circle cx="0" cy="72" r="9" class="no"/><circle cx="0" cy="100" r="9" class="no"/>
    <text x="0" y="132" text-anchor="middle" class="m">⋮</text>
    <circle cx="0" cy="160" r="9" class="no"/>
  </g>
  <!-- full connections: input->hidden (sample lines) -->
  <g stroke="#bbb" stroke-width="0.8">
    <line x1="79" y1="90" x2="321" y2="90"/><line x1="79" y1="90" x2="321" y2="118"/><line x1="79" y1="90" x2="321" y2="146"/><line x1="79" y1="90" x2="321" y2="206"/><line x1="79" y1="90" x2="321" y2="234"/>
    <line x1="79" y1="118" x2="321" y2="90"/><line x1="79" y1="118" x2="321" y2="118"/><line x1="79" y1="118" x2="321" y2="146"/><line x1="79" y1="118" x2="321" y2="206"/><line x1="79" y1="118" x2="321" y2="234"/>
    <line x1="79" y1="146" x2="321" y2="90"/><line x1="79" y1="146" x2="321" y2="118"/><line x1="79" y1="146" x2="321" y2="146"/><line x1="79" y1="146" x2="321" y2="206"/><line x1="79" y1="146" x2="321" y2="234"/>
    <line x1="79" y1="206" x2="321" y2="90"/><line x1="79" y1="206" x2="321" y2="118"/><line x1="79" y1="206" x2="321" y2="146"/><line x1="79" y1="206" x2="321" y2="206"/><line x1="79" y1="206" x2="321" y2="234"/>
    <line x1="79" y1="234" x2="321" y2="90"/><line x1="79" y1="234" x2="321" y2="118"/><line x1="79" y1="234" x2="321" y2="146"/><line x1="79" y1="234" x2="321" y2="206"/><line x1="79" y1="234" x2="321" y2="234"/>
    <!-- hidden->output -->
    <line x1="339" y1="90" x2="581" y2="104"/><line x1="339" y1="90" x2="581" y2="132"/><line x1="339" y1="90" x2="581" y2="160"/><line x1="339" y1="90" x2="581" y2="220"/>
    <line x1="339" y1="118" x2="581" y2="104"/><line x1="339" y1="118" x2="581" y2="132"/><line x1="339" y1="118" x2="581" y2="160"/><line x1="339" y1="118" x2="581" y2="220"/>
    <line x1="339" y1="146" x2="581" y2="104"/><line x1="339" y1="146" x2="581" y2="132"/><line x1="339" y1="146" x2="581" y2="160"/><line x1="339" y1="146" x2="581" y2="220"/>
    <line x1="339" y1="206" x2="581" y2="104"/><line x1="339" y1="206" x2="581" y2="132"/><line x1="339" y1="206" x2="581" y2="160"/><line x1="339" y1="206" x2="581" y2="220"/>
    <line x1="339" y1="234" x2="581" y2="104"/><line x1="339" y1="234" x2="581" y2="132"/><line x1="339" y1="234" x2="581" y2="160"/><line x1="339" y1="234" x2="581" y2="220"/>
  </g>
  <!-- weight labels -->
  <rect x="150" y="248" width="100" height="40" rx="4" fill="#fff" stroke="#c98a00"/>
  <text x="200" y="264" text-anchor="middle" class="m">第一层 Linear</text>
  <text x="200" y="280" text-anchor="middle" class="m">W₁ [784, 256]  b₁ [256]</text>
  <rect x="410" y="248" width="100" height="40" rx="4" fill="#fff" stroke="#4d9a5c"/>
  <text x="460" y="264" text-anchor="middle" class="m">第二层 Linear</text>
  <text x="460" y="280" text-anchor="middle" class="m">W₂ [256, 10]  b₂ [10]</text>
  <text x="16" y="306" class="m">全连接：每个隐藏神经元连着全部 784 个输入（784 条边 = W₁ 的一列），每个输出连着全部 256 个隐藏神经元。</text>
  <text x="16" y="322" class="m">参数 = 边数 + 偏置数 = 784×256 + 256 + 256×10 + 10 = 203,530。</text>
</svg>
