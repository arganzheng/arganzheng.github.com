<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">y.contiguous()：按 y 的逻辑顺序把元素逐个抄进一块新 storage</text><text x="40" y="66" fill="#333" font-size="11" text-anchor="start" font-weight="600">before：y = x.t()</text><text x="40" y="82" fill="#666" font-size="10" text-anchor="start" font-weight="normal">shape=(3, 2)，stride=(1, 3)</text><text x="40" y="96" fill="#666" font-size="10" text-anchor="start" font-weight="normal">与 x 共享 storage</text><rect x="330" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="355.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">0</text><text x="355.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">0</text><rect x="380" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="405.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">1</text><text x="405.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">1</text><rect x="430" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="455.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">2</text><text x="455.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">2</text><rect x="480" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="505.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">3</text><text x="505.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">3</text><rect x="530" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="555.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">4</text><text x="555.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">4</text><rect x="580" y="66" width="50" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="605.0" y="84.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">5</text><text x="605.0" y="60" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">5</text><text x="330" y="118" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">按 y 的逻辑顺序读取：idx 0 → 3 → 1 → 4 → 2 → 5（跳跃访问），逐元素复制</text><line x1="355" y1="94" x2="355" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><line x1="505" y1="94" x2="405" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><line x1="405" y1="94" x2="455" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><line x1="555" y1="94" x2="505" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><line x1="455" y1="94" x2="555" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><line x1="605" y1="94" x2="605" y2="186" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><text x="40" y="196" fill="#333" font-size="11" text-anchor="start" font-weight="600">after：z = y.contiguous()</text><text x="40" y="212" fill="#666" font-size="10" text-anchor="start" font-weight="normal">shape=(3, 2)，stride=(2, 1)</text><text x="40" y="226" fill="#666" font-size="10" text-anchor="start" font-weight="normal">新分配的 storage</text><rect x="330" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="355.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">0</text><text x="355.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">0</text><rect x="380" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="405.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">3</text><text x="405.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">1</text><rect x="430" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="455.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">1</text><text x="455.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">2</text><rect x="480" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="505.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">4</text><text x="505.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">3</text><rect x="530" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="555.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">2</text><text x="555.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">4</text><rect x="580" y="196" width="50" height="28" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="0"/><text x="605.0" y="214.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">5</text><text x="605.0" y="190" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">5</text><text x="40" y="262" fill="#333" font-size="11" text-anchor="start" font-weight="normal">z[i, j] = storage'[i·2 + j]：逻辑顺序 == 物理顺序，可以直接 view(6)；代价是一次真实的逐元素拷贝。</text>
</svg>
