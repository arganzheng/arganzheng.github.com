<text x="380" y="285" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">经典机器学习只看到左半边（L2 第一篇的 U 形）；深度网络工作在右半边——</text>
<text x="380" y="302" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">参数比样本多几个量级却不过拟合。本篇要解释的就是右半边为什么存在。</text>
