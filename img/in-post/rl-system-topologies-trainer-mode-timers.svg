<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342" role="img" aria-labelledby="t d">
  <title id="t">三种模式的一步时间线（timing_s/*）</title>
  <desc id="d">三种 trainer_mode 的一步都按同一串计时段走：gen、reward、old_log_prob、ref、adv、update_actor、update_weights，段宽不按比例。sync：gen 含 sleep，update_weights 含 wake_up 和显存切换。colocate_async：gen 是从缓冲取样的等待（rollout 在跑），再加 abort 和 sleep；update_weights 含 wake_up 和 resume。separate_async：gen 到 update_actor 重复 k 次（parameter_sync_step），gen 是取样等待、通常接近 0；update_weights 跨机发给 standalone 池，standalone 池一直在生成，只在这时 abort、接收新权重、resume。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .sub { font-size: 10px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; }
      .stair { fill: #dbe8fb; stroke: none; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .wall { stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>
<text x="16.0" y="39.0" text-anchor="start" class="monob">sync</text>
<rect class="seg-q" x="140.0" y="16" width="60.0" height="36"/><text x="170.0" y="38.5" text-anchor="middle" class="mono">gen</text>
<rect class="seg-b" x="200.0" y="16" width="62.0" height="36"/><text x="231.0" y="38.5" text-anchor="middle" class="mono">reward</text>
<rect class="seg-b" x="262.0" y="16" width="108.0" height="36"/><text x="316.0" y="38.5" text-anchor="middle" class="mono">old_log_prob</text>
<rect class="seg-b" x="370.0" y="16" width="44.0" height="36"/><text x="392.0" y="38.5" text-anchor="middle" class="mono">ref</text>
<rect class="seg-b" x="414.0" y="16" width="44.0" height="36"/><text x="436.0" y="38.5" text-anchor="middle" class="mono">adv</text>
<rect class="seg-b" x="458.0" y="16" width="108.0" height="36"/><text x="512.0" y="38.5" text-anchor="middle" class="mono">update_actor</text>
<rect class="seg-q" x="566.0" y="16" width="176.0" height="36"/><text x="654.0" y="38.5" text-anchor="middle" class="mono">update_weights</text>
<text x="144.0" y="72.0" text-anchor="start" class="small">含 sleep</text>
<text x="570.0" y="72.0" text-anchor="start" class="small">含 wake_up、显存切换</text>
<text x="16.0" y="127.0" text-anchor="start" class="monob">colocate_async</text>
<rect class="seg-q" x="140.0" y="104" width="60.0" height="36"/><text x="170.0" y="126.5" text-anchor="middle" class="mono">gen</text>
<rect class="seg-b" x="200.0" y="104" width="62.0" height="36"/><text x="231.0" y="126.5" text-anchor="middle" class="mono">reward</text>
<rect class="seg-b" x="262.0" y="104" width="108.0" height="36"/><text x="316.0" y="126.5" text-anchor="middle" class="mono">old_log_prob</text>
<rect class="seg-b" x="370.0" y="104" width="44.0" height="36"/><text x="392.0" y="126.5" text-anchor="middle" class="mono">ref</text>
<rect class="seg-b" x="414.0" y="104" width="44.0" height="36"/><text x="436.0" y="126.5" text-anchor="middle" class="mono">adv</text>
<rect class="seg-b" x="458.0" y="104" width="108.0" height="36"/><text x="512.0" y="126.5" text-anchor="middle" class="mono">update_actor</text>
<rect class="seg-q" x="566.0" y="104" width="176.0" height="36"/><text x="654.0" y="126.5" text-anchor="middle" class="mono">update_weights</text>
<text x="144.0" y="160.0" text-anchor="start" class="small">取样等待（rollout 在跑）+ abort + sleep</text>
<text x="570.0" y="160.0" text-anchor="start" class="small">含 wake_up + resume</text>
<path d="M141.0 210 V202 H565.0 V210" class="line"/>
<text x="353.0" y="196.0" text-anchor="middle" class="small">× k 次（parameter_sync_step）</text>
<text x="16.0" y="239.0" text-anchor="start" class="monob">separate_async</text>
<rect class="seg-q" x="140.0" y="216" width="60.0" height="36"/><text x="170.0" y="238.5" text-anchor="middle" class="mono">gen</text>
<rect class="seg-b" x="200.0" y="216" width="62.0" height="36"/><text x="231.0" y="238.5" text-anchor="middle" class="mono">reward</text>
<rect class="seg-b" x="262.0" y="216" width="108.0" height="36"/><text x="316.0" y="238.5" text-anchor="middle" class="mono">old_log_prob</text>
<rect class="seg-b" x="370.0" y="216" width="44.0" height="36"/><text x="392.0" y="238.5" text-anchor="middle" class="mono">ref</text>
<rect class="seg-b" x="414.0" y="216" width="44.0" height="36"/><text x="436.0" y="238.5" text-anchor="middle" class="mono">adv</text>
<rect class="seg-b" x="458.0" y="216" width="108.0" height="36"/><text x="512.0" y="238.5" text-anchor="middle" class="mono">update_actor</text>
<rect class="seg-q" x="566.0" y="216" width="176.0" height="36"/><text x="654.0" y="238.5" text-anchor="middle" class="mono">update_weights</text>
<text x="144.0" y="274.0" text-anchor="start" class="small">取样等待，通常接近 0</text>
<text x="16.0" y="313.0" text-anchor="start" class="bold">standalone 池</text>
<rect class="seg-a" x="140.0" y="290" width="426.0" height="36"/><text x="353.0" y="312.5" text-anchor="middle" class="small">持续生成</text>
<rect class="seg-mark" x="566.0" y="290" width="176.0" height="36"/><text x="654.0" y="312.5" text-anchor="middle" class="small">abort → 接收 → resume</text>
<rect class="seg-a" x="742.0" y="290" width="6.0" height="36"/>
<path d="M590.0 252 V290" class="arrow"/>
<text x="596.0" y="276.0" text-anchor="start" class="small">跨机</text>
</svg>
