<svg xmlns="http://www.w3.org/2000/svg" width="740" height="518" viewBox="0 0 740 518" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <rect width="740" height="518" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#e65100"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== top: x rows (never reordered) ===== -->
  <text x="20" y="22" font-weight="bold" fill="#333">x 的 6 行（原始 token 顺序，从头到尾不重排）</text>

  <!-- row labels -->
  <g fill="#333" text-anchor="end">
    <text x="180" y="57">行号 i</text>
    <text x="180" y="85">所属请求</text>
    <text x="180" y="113">请求的 adapter</text>
    <text x="180" y="137">槽位</text>
    <text x="180" y="150" font-size="10" font-family="Menlo, Consolas, monospace" fill="#666">token_lora_mapping</text>
  </g>

  <!-- column cells: x = 190 + 70*i, w=64 -->
  <!-- slot colours: -1 grey, 1 blue, 2 orange -->
  <g stroke-width="1.2">
    <!-- row: index -->
    <rect x="190" y="40" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="260" y="40" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="330" y="40" width="64" height="24" fill="#ffe0b2" stroke="#e65100"/>
    <rect x="400" y="40" width="64" height="24" fill="#eeeeee" stroke="#888"/>
    <rect x="470" y="40" width="64" height="24" fill="#eeeeee" stroke="#888"/>
    <rect x="540" y="40" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
    <!-- row: request -->
    <rect x="190" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="260" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="330" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="400" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="470" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="540" y="68" width="64" height="24" fill="#fff" stroke="#999"/>
    <!-- row: adapter -->
    <rect x="190" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="260" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="330" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="400" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="470" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <rect x="540" y="96" width="64" height="24" fill="#fff" stroke="#999"/>
    <!-- row: slot -->
    <rect x="190" y="124" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="260" y="124" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="330" y="124" width="64" height="24" fill="#ffe0b2" stroke="#e65100"/>
    <rect x="400" y="124" width="64" height="24" fill="#eeeeee" stroke="#888"/>
    <rect x="470" y="124" width="64" height="24" fill="#eeeeee" stroke="#888"/>
    <rect x="540" y="124" width="64" height="24" fill="#e3f2fd" stroke="#1565c0"/>
  </g>
  <g fill="#333" text-anchor="middle" font-family="Menlo, Consolas, monospace">
    <text x="222" y="57">0</text><text x="292" y="57">1</text><text x="362" y="57">2</text>
    <text x="432" y="57">3</text><text x="502" y="57">4</text><text x="572" y="57">5</text>
    <text x="222" y="141">1</text><text x="292" y="141">1</text><text x="362" y="141">2</text>
    <text x="432" y="141">-1</text><text x="502" y="141">-1</text><text x="572" y="141">1</text>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="222" y="85">A</text><text x="292" y="85">A</text><text x="362" y="85">B</text>
    <text x="432" y="85">C</text><text x="502" y="85">C</text><text x="572" y="85">D</text>
    <text x="222" y="113">客服</text><text x="292" y="113">客服</text><text x="362" y="113">代码</text>
    <text x="432" y="113" fill="#777">(无)</text><text x="502" y="113" fill="#777">(无)</text><text x="572" y="113">客服</text>
  </g>

  <!-- ===== gather arrows: from sorted cell k (y=232) up to original column j (y=150) ===== -->
  <!-- sorted order: k0->3, k1->4, k2->0, k3->1, k4->5, k5->2 -->
  <g stroke-width="1.4" fill="none">
    <line x1="222" y1="232" x2="432" y2="152" stroke="#888" marker-end="url(#arrG)" stroke-dasharray="4 3"/>
    <line x1="292" y1="232" x2="502" y2="152" stroke="#888" marker-end="url(#arrG)" stroke-dasharray="4 3"/>
    <line x1="362" y1="232" x2="222" y2="152" stroke="#1565c0" marker-end="url(#arrB)"/>
    <line x1="432" y1="232" x2="292" y2="152" stroke="#1565c0" marker-end="url(#arrB)"/>
    <line x1="502" y1="232" x2="572" y2="152" stroke="#1565c0" marker-end="url(#arrB)"/>
    <line x1="572" y1="232" x2="362" y2="152" stroke="#e65100" marker-end="url(#arrO)"/>
  </g>
  <text x="620" y="190" font-size="11" fill="#555">按名单里的行号</text>
  <text x="620" y="204" font-size="11" fill="#555">gather 原始行</text>
  <text x="620" y="218" font-size="11" fill="#555">（x 不动）</text>

  <!-- ===== middle: sorted index array ("点名单") ===== -->
  <g fill="#333" text-anchor="end">
    <text x="180" y="245" font-size="12">点名单</text>
    <text x="180" y="259" font-size="10" font-family="Menlo, Consolas, monospace" fill="#666">token_indices_sorted</text>
    <text x="180" y="270" font-size="10" font-family="Menlo, Consolas, monospace" fill="#666">_by_lora_ids</text>
  </g>
  <g stroke-width="1.5">
    <rect x="190" y="236" width="64" height="26" fill="#eeeeee" stroke="#888"/>
    <rect x="260" y="236" width="64" height="26" fill="#eeeeee" stroke="#888"/>
    <rect x="330" y="236" width="64" height="26" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="400" y="236" width="64" height="26" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="470" y="236" width="64" height="26" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="540" y="236" width="64" height="26" fill="#ffe0b2" stroke="#e65100"/>
  </g>
  <g fill="#333" text-anchor="middle" font-family="Menlo, Consolas, monospace">
    <text x="222" y="254">3</text><text x="292" y="254">4</text><text x="362" y="254">0</text>
    <text x="432" y="254">1</text><text x="502" y="254">5</text><text x="572" y="254">2</text>
  </g>
  <!-- k index under cells -->
  <g fill="#999" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace">
    <text x="222" y="274">k=0</text><text x="292" y="274">1</text><text x="362" y="274">2</text>
    <text x="432" y="274">3</text><text x="502" y="274">4</text><text x="572" y="274">5</text>
  </g>
  <!-- segment bars -->
  <g stroke-width="3">
    <line x1="190" y1="281" x2="324" y2="281" stroke="#888"/>
    <line x1="330" y1="281" x2="534" y2="281" stroke="#1565c0"/>
    <line x1="540" y1="281" x2="604" y2="281" stroke="#e65100"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="257" y="296" fill="#666">槽位 -1 · 2 行 · 起点 0</text>
    <text x="432" y="296" fill="#1565c0">槽位 1 · 3 行 · 起点 2</text>
    <text x="572" y="296" fill="#e65100">槽位 2 · 1 行 · 起点 5</text>
  </g>
  <text x="614" y="254" font-size="11" fill="#555">sort(stable) 的下标</text>

  <!-- ===== bottom: programs along grid axis 2 ===== -->
  <text x="20" y="330" font-weight="bold" fill="#333">grid 第三维：4 个 program</text>
  <text x="20" y="346" font-size="11" fill="#666">lora_idx = 0..3，共 max_loras+1 格</text>

  <!-- arrows program -> segment bar -->
  <g stroke-width="1.4" fill="none">
    <line x1="282" y1="352" x2="420" y2="302" stroke="#1565c0" marker-end="url(#arrB)"/>
    <line x1="457" y1="352" x2="562" y2="302" stroke="#e65100" marker-end="url(#arrO)"/>
  </g>

  <g stroke-width="1.5">
    <rect x="27" y="354" width="160" height="66" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-dasharray="4 3"/>
    <rect x="202" y="354" width="160" height="66" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="377" y="354" width="160" height="66" rx="4" fill="#ffe0b2" stroke="#e65100"/>
    <rect x="552" y="354" width="160" height="66" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="107" y="374" fill="#888" font-family="Menlo, Consolas, monospace">lora_idx=0 → id -1</text>
    <text x="107" y="394" fill="#888">无 LoRA 的那组</text>
    <text x="107" y="411" fill="#888">整个 program return</text>
    <text x="282" y="374" fill="#0d47a1" font-family="Menlo, Consolas, monospace">lora_idx=1 → 槽位 1</text>
    <text x="282" y="394" fill="#0d47a1">名单[2,5) → 行 0,1,5</text>
    <text x="282" y="411" fill="#0d47a1">× lora_a/b_stacked[1]</text>
    <text x="457" y="374" fill="#bf360c" font-family="Menlo, Consolas, monospace">lora_idx=2 → 槽位 2</text>
    <text x="457" y="394" fill="#bf360c">名单[5,6) → 行 2</text>
    <text x="457" y="411" fill="#bf360c">× lora_a/b_stacked[2]</text>
    <text x="632" y="374" fill="#888" font-family="Menlo, Consolas, monospace">lora_idx=3 → id -1</text>
    <text x="632" y="394" fill="#888">尾部空格</text>
    <text x="632" y="411" fill="#888">return</text>
  </g>

  <!-- three small arrays -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333">
    <text x="20" y="446">active_lora_ids      [-1,  1,  2, -1]</text>
    <text x="20" y="463">num_tokens_per_lora  [ 2,  3,  1,  0]</text>
    <text x="20" y="480">lora_token_start_loc [ 0,  2,  5,  6]</text>
  </g>
  <g font-size="11" fill="#666">
    <text x="330" y="446">← unique()：名单里第 k 组是哪个槽位（尾部填 -1）</text>
    <text x="330" y="463">← 第 k 组有几行</text>
    <text x="330" y="480">← 前缀和：第 k 组从名单第几行开始</text>
  </g>

  <text x="20" y="508" font-size="12" fill="#333">结果：y 第 0,1,5 行 += B₁(A₁x)，第 2 行 += B₂(A₂x)，第 3,4 行只有基座输出；x、y 都没有被物理重排</text>
</svg>
