<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" width="760" height="224" role="img" aria-labelledby="t d">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgSans';font-weight:500;src:url(data:font/woff2;base64,)}]]></style>
<title id="t">双缓冲下的填、传、装</title>
<desc id="d">三行：填、传、装，横轴是时间（示意，不按比例）。两块缓冲轮流用：b0 填完开始传，b1 填进另一块缓冲；传比填慢，所以 b2 要等 b0 传完、缓冲空出来才能开始填，填一行出现等待的空档。传一行首尾相接没有空档，是瓶颈；装紧跟每个 bucket 的传之后。整次同步的时间约等于传的总时间。</desc>
<defs><style>
text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#243447; }
.small { font-size:12px; } .bold { font-size:14px; font-weight:500; } .sub { font-size:11px; }
.seg { stroke:#40566f; stroke-width:1; }
.wait { fill:#fff; stroke:#d79a45; stroke-width:1.4; stroke-dasharray:5 4; }
.axis { stroke:#40566f; stroke-width:1.2; fill:none; }
</style></defs>
<text x="18.0" y="62.0" text-anchor="start" class="bold">填</text>
<rect x="60.0" y="40" width="71.2" height="34" fill="#e3f1e8" class="seg" />
<text x="95.6" y="61.5" text-anchor="middle" class="small">b0</text>
<rect x="131.2" y="40" width="71.2" height="34" fill="#e3f1e8" class="seg" />
<text x="166.8" y="61.5" text-anchor="middle" class="small">b1</text>
<rect x="238.0" y="40" width="71.2" height="34" fill="#e3f1e8" class="seg" />
<text x="273.6" y="61.5" text-anchor="middle" class="small">b2</text>
<rect x="344.8" y="40" width="71.2" height="34" fill="#e3f1e8" class="seg" />
<text x="380.4" y="61.5" text-anchor="middle" class="small">b3</text>
<rect x="451.6" y="40" width="71.2" height="34" fill="#e3f1e8" class="seg" />
<text x="487.2" y="61.5" text-anchor="middle" class="small">b4</text>
<rect x="202.4" y="40" width="35.6" height="34" class="wait" data-no-center="" />
<rect x="309.2" y="40" width="35.6" height="34" class="wait" data-no-center="" />
<rect x="416.0" y="40" width="35.6" height="34" class="wait" data-no-center="" />
<text x="18.0" y="114.0" text-anchor="start" class="bold">传</text>
<rect x="131.2" y="92" width="106.8" height="34" fill="#dbe8fb" class="seg" />
<text x="184.6" y="113.5" text-anchor="middle" class="small">b0</text>
<rect x="238.0" y="92" width="106.8" height="34" fill="#dbe8fb" class="seg" />
<text x="291.4" y="113.5" text-anchor="middle" class="small">b1</text>
<rect x="344.8" y="92" width="106.8" height="34" fill="#dbe8fb" class="seg" />
<text x="398.2" y="113.5" text-anchor="middle" class="small">b2</text>
<rect x="451.6" y="92" width="106.8" height="34" fill="#dbe8fb" class="seg" />
<text x="505.0" y="113.5" text-anchor="middle" class="small">b3</text>
<rect x="558.4" y="92" width="106.8" height="34" fill="#dbe8fb" class="seg" />
<text x="611.8" y="113.5" text-anchor="middle" class="small">b4</text>
<text x="18.0" y="166.0" text-anchor="start" class="bold">装</text>
<rect x="238.0" y="144" width="71.2" height="34" fill="#f5e9f7" class="seg" />
<text x="273.6" y="165.5" text-anchor="middle" class="small">b0</text>
<rect x="344.8" y="144" width="71.2" height="34" fill="#f5e9f7" class="seg" />
<text x="380.4" y="165.5" text-anchor="middle" class="small">b1</text>
<rect x="451.6" y="144" width="71.2" height="34" fill="#f5e9f7" class="seg" />
<text x="487.2" y="165.5" text-anchor="middle" class="small">b2</text>
<rect x="558.4" y="144" width="71.2" height="34" fill="#f5e9f7" class="seg" />
