<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-labelledby="t d">
<title id="t">ncclGetDtree(nNodes = 8)：两棵互补的二叉树</title>
<desc id="d">树 0 由 ncclGetBtree 建成：0 为根，子 4；4 的子 2、6；2 的子 1、3；6 的子 5、7。树 1 是镜像 r→7−r：7 为根，子 3；3 的子 5、1；5 的子 6、4；1 的子 2、0。树 0 的内部节点 0 4 2 6 在树 1 中都是叶子，反之亦然。</desc>
