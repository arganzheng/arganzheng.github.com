<title id="bt-t">NCCL 的二叉树形状：rank 0 为根，奇数 rank 全是叶子</title>
<desc id="bt-d">n = 8 时 ncclGetBtree 的树：r0 为根、只有一个孩子 r4；r4 的孩子是 r2、r6；r2 的孩子是 r1、r3；r6 的孩子是 r5、r7。右侧箭头标出 reduce 向上 3 步、broadcast 向下 3 步。</desc>
