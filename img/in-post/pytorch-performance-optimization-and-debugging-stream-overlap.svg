<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">copy_stream 与 compute_stream 的重叠及依赖</title>
<desc id="desc">worker collate 后由主进程的 pin-memory 线程准备 pinned buffer。copy_stream 搬运 batch i+1 时 compute_stream 执行 batch i。copy_stream 上记录的 Event 通过竖箭头约束计算起点；record_stream 向 allocator 登记显存使用，不是 Stream 间调用。</desc>
<style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:500}rect,line,path{shape-rendering:geometricPrecision}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="760" height="510" fill="#fff"/>
<line x1="150" y1="76" x2="730" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="62" font-size="14" text-anchor="start" fill="#111827">时间 →（示意，非等比例）</text>
<text x="20" y="125" font-size="15" text-anchor="start" fill="#111827">worker</text>
<rect x="150" y="100" width="100" height="42" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
<text x="200.0" y="126.0" font-size="13" text-anchor="middle" fill="#111827">collate i+1</text>
<rect x="470" y="100" width="125" height="42" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
<text x="532.5" y="126.0" font-size="13" text-anchor="middle" fill="#111827">准备 batch i+2</text>
<text x="20" y="222" font-size="15" text-anchor="start" fill="#111827">pinned buf</text>
<rect x="250" y="197" width="100" height="42" fill="#fff0cf" stroke="#52657a" stroke-width="1.2"/>
<text x="300.0" y="223.0" font-size="14" text-anchor="middle" fill="#111827">pin i+1</text>
<line x1="250" y1="142" x2="250" y2="197" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20" y="320" font-size="15" text-anchor="start" fill="#111827">copy_stream</text>
<rect x="150" y="294" width="100" height="44" fill="#dcefe3" stroke="#52657a" stroke-width="1.2"/>
<text x="200.0" y="321.0" font-size="15" text-anchor="middle" fill="#111827">H2D i</text>
<rect x="250" y="294" width="20" height="44" fill="#fff0cf" stroke="#52657a" stroke-width="1.2"/>
<rect x="350" y="294" width="150" height="44" fill="#dcefe3" stroke="#52657a" stroke-width="1.2"/>
<text x="425.0" y="321.0" font-size="14" text-anchor="middle" fill="#111827">H2D batch i+1</text>
<line x1="350" y1="239" x2="350" y2="294" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20" y="422" font-size="14" text-anchor="start" fill="#111827">compute_stream</text>
<rect x="270" y="396" width="230" height="44" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
<text x="385.0" y="423.0" font-size="15" text-anchor="middle" fill="#111827">前向 / 反向 batch i</text>
<rect x="520" y="396" width="205" height="44" fill="#dceafb" stroke="#52657a" stroke-width="1.2"/>
<text x="622.5" y="423.0" font-size="14" text-anchor="middle" fill="#111827">前向 / 反向 batch i+1</text>
<line x1="270" y1="338" x2="270" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="294" width="20" height="44" fill="#fff0cf" stroke="#52657a" stroke-width="1.2"/>
<line x1="520" y1="338" x2="520" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="282" y="366" font-size="13" text-anchor="start" fill="#111827">Event i：wait_stream 的边界</text>
<text x="540" y="366" font-size="13" text-anchor="start" fill="#111827">Event i+1</text>
<path d="M725,396 V12 H470 V100" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="38" font-size="14" text-anchor="start" fill="#111827">下一步</text>
<text x="150" y="481" font-size="15" text-anchor="start" fill="#111827">H2D i+1 与计算 i 并发；计算 i+1 必须等自己的拷贝完成</text>
</svg>
