<svg xmlns="http://www.w3.org/2000/svg" width="760" height="578" viewBox="0 0 760 578" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache 不够时：D 进不来，只能抢占 Running Request 腾出空间</title>
  <desc id="desc">Token Budget 足够但 Free Blocks 不足时，D 无法被接纳；Scheduler 选择一个 Running Request 抢占，释放它的 KV Cache，把它标为 PREEMPTED 并重新放回 Waiting。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="578" fill="#fff"/>
  <g data-card="1"><rect class="compute" x="210.0" y="20" width="340" height="48"/><text x="380.0" y="49" text-anchor="middle" class="body">Token Budget 足够（D 分得到 token）</text></g>
  <line x1="380" y1="68" x2="380" y2="96" class="arrow"/>
  <g data-card="1"><rect class="card" x="210.0" y="96" width="340" height="48"/><text x="380.0" y="125" text-anchor="middle" class="body">D 需要 KV Cache（Prompt 4K）</text></g>
  <line x1="380" y1="144" x2="380" y2="172" class="arrow"/>
  <g data-card="1"><rect class="waiting" x="210.0" y="172" width="340" height="48"/><text x="380.0" y="201" text-anchor="middle" class="body">Free Blocks 不足</text></g>
  <line x1="380" y1="220" x2="380" y2="248" class="arrow"/>
  <g data-card="1"><rect class="card" x="210.0" y="248" width="340" height="48"/><text x="380.0" y="277" text-anchor="middle" class="body">无法接纳 D，需要释放 KV Cache</text></g>
  <line x1="380" y1="296" x2="380" y2="324" class="arrow"/>
  <g data-card="1"><rect class="card" x="210.0" y="324" width="340" height="48"/><text x="380.0" y="353" text-anchor="middle" class="body">选择一个 Running Request</text></g>
  <line x1="380" y1="372" x2="380" y2="400" class="arrow"/>
  <g data-card="1"><rect class="compute" x="210.0" y="400" width="340" height="48"/><text x="380.0" y="429" text-anchor="middle" class="bold">Preemption</text></g>
  <path d="M380 448 V480 H150 M380 480 H610" class="line"/>
  <line x1="150" y1="480" x2="150" y2="510" class="arrow"/>
  <line x1="380" y1="480" x2="380" y2="510" class="arrow"/>
  <line x1="610" y1="480" x2="610" y2="510" class="arrow"/>
  <g data-card="1"><rect class="memory" x="45" y="510" width="210" height="52"/><text x="150.0" y="541" text-anchor="middle" class="body">释放它的 KV Cache</text></g>
  <g data-card="1"><rect class="memory" x="275" y="510" width="210" height="52"/><text x="380.0" y="541" text-anchor="middle" class="body">状态变 PREEMPTED</text></g>
  <g data-card="1"><rect class="memory" x="505" y="510" width="210" height="52"/><text x="610.0" y="541" text-anchor="middle" class="body">重新进入 Waiting</text></g>
</svg>
