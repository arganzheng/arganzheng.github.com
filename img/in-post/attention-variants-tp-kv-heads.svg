  <text class="m" x="588.0" y="94" text-anchor="middle">…</text>
  <rect class="blue" x="608.0" y="74" width="132.0" height="30"/>
  <text class="m" x="674.0" y="94" text-anchor="middle">q56..q63</text>
  <text class="b" x="162" y="94" text-anchor="end">query</text>
  <rect class="orange" x="172" y="104" width="132.0" height="30"/>
  <text class="m" x="238.0" y="124" text-anchor="middle">kv0</text>
  <rect class="orange" x="304.0" y="104" width="132.0" height="30"/>
  <text class="m" x="370.0" y="124" text-anchor="middle">kv1</text>
  <rect class="orange" x="436.0" y="104" width="132.0" height="30"/>
  <text class="m" x="502.0" y="124" text-anchor="middle">kv2</text>
  <rect class="white" x="568.0" y="104" width="40" height="30"/>
  <text class="m" x="588.0" y="124" text-anchor="middle">…</text>
