  <rect class="blue" x="436.0" y="222" width="88.0" height="30"/>
  <text class="m" x="480.0" y="242" text-anchor="middle">q12..q15</text>
  <rect class="white" x="524.0" y="222" width="40" height="30"/>
  <text class="m" x="544.0" y="242" text-anchor="middle">…</text>
  <rect class="blue" x="564.0" y="222" width="88.0" height="30"/>
  <text class="m" x="608.0" y="242" text-anchor="middle">q56..q59</text>
  <rect class="blue" x="652.0" y="222" width="88.0" height="30"/>
  <text class="m" x="696.0" y="242" text-anchor="middle">q60..q63</text>
  <text class="b" x="162" y="242" text-anchor="end">query</text>
  <rect class="orange" x="172" y="252" width="88.0" height="30"/>
  <text class="m" x="216.0" y="272" text-anchor="middle">kv0</text>
  <rect class="orange" x="260.0" y="252" width="88.0" height="30"/>
  <text class="m" x="304.0" y="272" text-anchor="middle">kv0</text>
  <rect class="orange" x="348.0" y="252" width="88.0" height="30"/>
  <text class="m" x="392.0" y="272" text-anchor="middle">kv1</text>
  <rect class="orange" x="436.0" y="252" width="88.0" height="30"/>
  <text class="m" x="480.0" y="272" text-anchor="middle">kv1</text>
  <rect class="white" x="524.0" y="252" width="40" height="30"/>
  <text class="m" x="544.0" y="272" text-anchor="middle">…</text>
  <rect class="orange" x="564.0" y="252" width="88.0" height="30"/>
  <text class="m" x="608.0" y="272" text-anchor="middle">kv7</text>
  <rect class="orange" x="652.0" y="252" width="88.0" height="30"/>
  <text class="m" x="696.0" y="272" text-anchor="middle">kv7</text>
  <text class="b" x="162" y="272" text-anchor="end">KV head</text>
  <text class="bb" x="20" y="212">TP = 16</text>
  <line class="ln" x1="216.0" y1="282" x2="216.0" y2="296"/>
  <line class="ln" x1="304.0" y1="282" x2="304.0" y2="296"/>
  <line class="ln" x1="216.0" y1="296" x2="304.0" y2="296"/>
  <text class="s" x="260.0" y="314" text-anchor="middle">复制</text>
  <line class="ln" x1="392.0" y1="282" x2="392.0" y2="296"/>
  <line class="ln" x1="480.0" y1="282" x2="480.0" y2="296"/>
