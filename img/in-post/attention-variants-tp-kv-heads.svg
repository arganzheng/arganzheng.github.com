  <text class="m" x="674.0" y="124" text-anchor="middle">kv7</text>
  <text class="b" x="162" y="124" text-anchor="end">KV head</text>
  <text class="bb" x="20" y="64">TP = 8</text>
  <text class="s" x="172" y="158">每卡 40 KiB/token，8 卡合计 320 KiB（恰好均分）</text>
  <rect class="gray" x="172" y="192" width="88.0" height="30"/>
  <text class="b" x="216.0" y="212" text-anchor="middle">卡0</text>
  <rect class="gray" x="260.0" y="192" width="88.0" height="30"/>
  <text class="b" x="304.0" y="212" text-anchor="middle">卡1</text>
  <rect class="gray" x="348.0" y="192" width="88.0" height="30"/>
  <text class="b" x="392.0" y="212" text-anchor="middle">卡2</text>
  <rect class="gray" x="436.0" y="192" width="88.0" height="30"/>
  <text class="b" x="480.0" y="212" text-anchor="middle">卡3</text>
  <rect class="white" x="524.0" y="192" width="40" height="30"/>
  <text class="b" x="544.0" y="212" text-anchor="middle">…</text>
  <rect class="gray" x="564.0" y="192" width="88.0" height="30"/>
  <text class="b" x="608.0" y="212" text-anchor="middle">卡14</text>
  <rect class="gray" x="652.0" y="192" width="88.0" height="30"/>
  <text class="b" x="696.0" y="212" text-anchor="middle">卡15</text>
  <rect class="blue" x="172" y="222" width="88.0" height="30"/>
  <text class="m" x="216.0" y="242" text-anchor="middle">q0..q3</text>
  <rect class="blue" x="260.0" y="222" width="88.0" height="30"/>
  <text class="m" x="304.0" y="242" text-anchor="middle">q4..q7</text>
