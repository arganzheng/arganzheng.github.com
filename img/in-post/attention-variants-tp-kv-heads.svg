<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-labelledby="t d">
  <title id="t">Llama-3-70B 在 TP=8 与 TP=16 下的 KV head 分配</title>
  <desc id="d">Llama-3-70B：n_h = 64，n_kv = 8，320 KiB/token。TP = 8：卡 i 持有 q8i 到 q8i+7 与 kv i（卡0 q0..q7 kv0 … 卡7 q56..q63 kv7），每卡 40 KiB/token，8 卡合计 320 KiB，恰好均分。TP = 16：卡 i 持有 4 个 query head（q4i..q4i+3）与 kv ⌊i/2⌋，相邻两卡复制同一个 KV head（卡0、卡1 都是 kv0 … 卡14、卡15 都是 kv7），每卡仍 40 KiB/token，16 卡合计 640 KiB，是 TP/n_kv = 2 倍。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; font-weight: 600; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 14px; }
      .bb { font-size: 14px; font-weight: 700; }
      .s { font-size: 13px; }
      .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 600; }
      .ms { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
      .blue { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .dblue { fill: #9fc0ec; }
      .orange { fill: #fde4c8; stroke: #40566f; stroke-width: 1.2; }
      .purple { fill: #e9def5; stroke: #40566f; stroke-width: 1.2; }
      .gray { fill: #e6e9ee; stroke: #40566f; stroke-width: 1.2; }
      .white { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .skip { fill: #e6e9ee; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .thin { stroke: #c3ccd6; stroke-width: 1; fill: none; }
      .blk { stroke: #40566f; stroke-width: 2; fill: none; }
      .dot { fill: #8a97a6; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="358" fill="#fff"/>
  <text class="bb" x="20" y="26">Llama-3-70B：n<tspan dy="4" font-size="75%">h</tspan><tspan dy="-4"> = 64，n</tspan><tspan dy="4" font-size="75%">kv</tspan><tspan dy="-4"> = 8，320 KiB/token</tspan></text>
  <rect class="gray" x="172" y="44" width="132.0" height="30"/>
  <text class="b" x="238.0" y="64" text-anchor="middle">卡0</text>
  <rect class="gray" x="304.0" y="44" width="132.0" height="30"/>
  <text class="b" x="370.0" y="64" text-anchor="middle">卡1</text>
  <rect class="gray" x="436.0" y="44" width="132.0" height="30"/>
  <text class="b" x="502.0" y="64" text-anchor="middle">卡2</text>
  <rect class="white" x="568.0" y="44" width="40" height="30"/>
  <text class="b" x="588.0" y="64" text-anchor="middle">…</text>
  <rect class="gray" x="608.0" y="44" width="132.0" height="30"/>
  <text class="b" x="674.0" y="64" text-anchor="middle">卡7</text>
  <rect class="blue" x="172" y="74" width="132.0" height="30"/>
  <text class="m" x="238.0" y="94" text-anchor="middle">q0..q7</text>
  <rect class="blue" x="304.0" y="74" width="132.0" height="30"/>
  <text class="m" x="370.0" y="94" text-anchor="middle">q8..q15</text>
  <rect class="blue" x="436.0" y="74" width="132.0" height="30"/>
  <text class="m" x="502.0" y="94" text-anchor="middle">q16..q23</text>
