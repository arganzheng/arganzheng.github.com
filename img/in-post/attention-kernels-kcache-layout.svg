      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .thin { stroke: #8a97a6; stroke-width: 1; fill: none; }
      .arr { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .mark { stroke: #c0392b; stroke-width: 2.2; fill: none; }
    </style>
