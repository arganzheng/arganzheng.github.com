<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" role="img" aria-labelledby="t d">
  <title id="t">K cache 一个 (block, kv_head) 内的布局</title>
  <desc id="d">BF16 时 x = 8（16 B），block_size = 16，head_size = 128，共 16 个 dim 组。实际布局 [head_size/x][block_size][x]（x-major）：每个 dim 组一行，行内 16 个 token 各 16 B 连续，一行 256 B，第 8 个 token 处是 128 B cache line 边界。一个 warp 是 16 个 thread group（每组 2 线程），对应 16 个 token；第 j 轮 group g 读 token g 的 dim 组 j，线程 0 读前 8 B、线程 1 读后 8 B，32 段 8 B 落在同一行，256 B 连续 = 2 条 cache line，完美合并。若按 [block_size][head_size]（token 主序）存，每个 token 一行 256 B，16 个 token 的同一 dim 组相隔 256 B，散在 16 条 cache line 上。</desc>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
