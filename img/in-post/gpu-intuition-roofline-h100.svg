<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" viewBox="0 0 760 312" role="img" aria-labelledby="t d">
<title id="t">H100 的 roofline：算力上限、带宽斜线与 decode / prefill 的位置</title>
<desc id="d">双对数坐标。横轴算术强度（FLOP/字节），纵轴可达性能（TFLOP/s）。斜线是带宽 3.35 TB/s 乘强度，在 ridge≈295 处碰到算力上限 989 TFLOPS 的横线。decode B=1 强度 1、约 3.35 TFLOP/s，是峰值的 0.3%；decode B=128 仍在斜线上，memory-bound；decode B=512 到了横线，compute-bound；prefill 与训练强度约数千，在横线上。</desc>
<style>text{font-family:'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, 'Segoe UI', sans-serif;font-weight:500;fill:#111}.ti{font-size:14px;font-weight:700}.lb{font-size:12px}.tk{font-size:11px;fill:#333}.mb{fill:#1f5fa0}.cb{fill:#b03024}.ax{stroke:#444;stroke-width:1.5;fill:none}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text class="ti" x="380.0" y="22" text-anchor="middle">Roofline：一个操作能跑多快，被两条线压着——</text>
<text class="ti" x="380.0" y="42" text-anchor="middle">算力上限（横线）与带宽 × 算术强度（斜线）</text>
<rect x="70" y="76" width="463.0" height="194" fill="#1f5fa0" opacity="0.06"/>
<rect x="533.0" y="76" width="207.0" height="194" fill="#b03024" opacity="0.06"/>
<line class="ax" x1="70" y1="270" x2="750" y2="270" marker-end="url(#ar)"/>
<line class="ax" x1="70" y1="270" x2="70" y2="68" marker-end="url(#ar)"/>
<text class="tk" x="64" y="62">可达性能 (TFLOP/s，对数)</text>
<text class="tk" x="750" y="302" text-anchor="end">算术强度 (FLOP / 字节，对数)</text>
<line x1="108.2" y1="270" x2="108.2" y2="274" stroke="#444"/>
<text class="tk" x="108.2" y="286" text-anchor="middle">1</text>
<line x1="280.2" y1="270" x2="280.2" y2="274" stroke="#444"/>
<text class="tk" x="280.2" y="286" text-anchor="middle">10</text>
<line x1="452.2" y1="270" x2="452.2" y2="274" stroke="#444"/>
<text class="tk" x="452.2" y="286" text-anchor="middle">100</text>
<line x1="624.2" y1="270" x2="624.2" y2="274" stroke="#444"/>
<text class="tk" x="624.2" y="286" text-anchor="middle">1000</text>
<line x1="66" y1="270.0" x2="70" y2="270.0" stroke="#444"/>
<text class="tk" x="63" y="274.0" text-anchor="end">1</text>
<line x1="66" y1="211.9" x2="70" y2="211.9" stroke="#444"/>
<text class="tk" x="63" y="215.9" text-anchor="end">10</text>
<line x1="66" y1="153.8" x2="70" y2="153.8" stroke="#444"/>
<text class="tk" x="63" y="157.8" text-anchor="end">100</text>
<line x1="66" y1="96.0" x2="70" y2="96.0" stroke="#444"/>
<text class="tk" x="63" y="100.0" text-anchor="end">989</text>
<line x1="533.0" y1="270" x2="533.0" y2="96.0" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>
<text class="tk" x="533.0" y="286" text-anchor="middle" style="font-weight:700">ridge≈295</text>
<line x1="533.0" y1="96.0" x2="740" y2="96.0" stroke="#b03024" stroke-width="2.5"/>
<text class="lb cb" x="636.5" y="87.0" text-anchor="middle" style="font-weight:700">算力上限 989 TFLOPS</text>
<line x1="70" y1="252.4" x2="533.0" y2="96.0" stroke="#1f5fa0" stroke-width="2.5"/>
<text class="lb mb" x="293.8" y="168.8" text-anchor="middle" transform="rotate(-18.66 293.8 176.8)" style="font-weight:700">斜线 = 带宽 3.35 TB/s × 算术强度</text>
<circle cx="108.2" cy="239.5" r="5" fill="#1f5fa0"/>
<text class="lb mb" x="102.2" y="261.5">decode B=1：强度 1，性能 ≈ 3.35 TFLOP/s = 峰值的 0.3%</text>
<circle cx="470.6" cy="117.1" r="5" fill="#1f5fa0"/>
<text class="lb mb" x="460.6" y="107.1" text-anchor="end">decode B=128 (memory-bound)</text>
<circle cx="574.2" cy="96.0" r="5" fill="#b03024"/>
<text class="lb cb" x="568.2" y="116.0">decode B=512</text>
<text class="lb cb" x="568.2" y="131.0">(compute-bound)</text>
<circle cx="729.5" cy="96.0" r="5" fill="#b03024"/>
<text class="lb cb" x="735.5" y="116.0" text-anchor="end">prefill / 训练</text>
<text class="lb cb" x="735.5" y="131.0" text-anchor="end">强度 ≈ 数千</text>
<text class="lb mb" x="348.6" y="206">memory-bound 区：</text>
<text class="lb mb" x="348.6" y="222">加算力没用，省字节有用</text>
<text class="lb cb" x="549.0" y="206">compute-bound 区：</text>
<text class="lb cb" x="549.0" y="222">省字节没用，加算力有用</text>
</svg>
