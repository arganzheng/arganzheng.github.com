<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">Roofline：一个操作能跑多快，被两条线压着——算力上限（横线）与带宽 × 算术强度（斜线）</text>
<line x1="90" y1="270" x2="700" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="90" y1="270" x2="90" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="700" y="300" fill="#333" font-size="11" text-anchor="end" font-weight="normal">算术强度 (FLOP / 字节，对数)</text>
<text x="82" y="56" fill="#333" font-size="11" text-anchor="start" font-weight="normal">可达性能 (TFLOP/s，对数)</text>
<text x="135.1544993495972" y="284" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">1</text>
<text x="285.1544993495972" y="284" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">10</text>
<text x="435.1544993495972" y="284" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">100</text>
<text x="585.1544993495972" y="284" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">1000</text>
<text x="84" y="274.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">1</text>
<text x="84" y="213.4128498490753" fill="#666" font-size="10" text-anchor="end" font-weight="normal">10</text>
<text x="84" y="152.82569969815057" fill="#666" font-size="10" text-anchor="end" font-weight="normal">100</text>
<text x="84" y="92.5295925495088" fill="#666" font-size="10" text-anchor="end" font-weight="normal">989</text>
<line x1="505.6772220336473" y1="88.5295925495088" x2="690.0" y2="88.5295925495088" stroke="#c0392b" stroke-width="2.5"/>
<text x="644.8455006504028" y="74.5295925495088" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">算力上限 989 TFLOPS</text>
<line x1="90.0" y1="256.4275809873212" x2="505.6772220336473" y2="88.5295925495088" stroke="#1f6fb2" stroke-width="2.5"/>
<text x="206.72268755754655" y="199.28161434019756" fill="#1f6fb2" font-size="11" text-anchor="start" font-weight="600">斜线 = 3.35 TB/s × 强度</text>
<line x1="505.6772220336473" y1="270" x2="505.6772220336473" y2="88.5295925495088" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
<text x="505.6772220336473" y="284" fill="#333" font-size="10" text-anchor="middle" font-weight="600">ridge≈295</text>
