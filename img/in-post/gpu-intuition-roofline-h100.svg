<text x="143.1544993495972" y="228.18903144009536" fill="#1f6fb2" font-size="11" text-anchor="start" font-weight="normal">decode B=1：3.35 TFLOP/s（峰值 0.3%）</text>
<circle cx="451.2" cy="110.5" r="5" fill="#1f6fb2"/>
<text x="459.23599479677745" y="126.51918460951444" fill="#1f6fb2" font-size="11" text-anchor="start" font-weight="normal">decode B=128</text>
