<rect class="seg-b" x="290" y="82" width="100" height="32" />
<text x="340.0" y="103.0" text-anchor="middle" class="small">Compute</text>
<rect class="seg-b" x="390" y="82" width="100" height="32" />
<text x="440.0" y="103.0" text-anchor="middle" class="small">Combine</text>
<text x="20" y="145.0" text-anchor="start" class="body">Chunk 2</text>
<rect class="seg-c" x="290" y="124" width="100" height="32" />
<text x="340.0" y="145.0" text-anchor="middle" class="small">Dispatch</text>
<rect class="seg-c" x="390" y="124" width="100" height="32" />
<text x="440.0" y="145.0" text-anchor="middle" class="small">Compute</text>
<rect class="seg-c" x="490" y="124" width="100" height="32" />
<text x="540.0" y="145.0" text-anchor="middle" class="small">Combine</text>
<text x="20" y="187.0" text-anchor="start" class="body">Chunk 3</text>
<rect class="seg-d" x="390" y="166" width="100" height="32" />
<text x="440.0" y="187.0" text-anchor="middle" class="small">Dispatch</text>
<rect class="seg-d" x="490" y="166" width="100" height="32" />
<text x="540.0" y="187.0" text-anchor="middle" class="small">Compute</text>
<rect class="seg-d" x="590" y="166" width="100" height="32" />
<text x="640.0" y="187.0" text-anchor="middle" class="small">Combine</text>
</svg>