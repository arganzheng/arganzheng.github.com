<svg xmlns="http://www.w3.org/2000/svg" width="760" height="325" viewBox="0 0 760 325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">广播：X[2, 3] + b[3]——小的那个不复制，只是"每一行都读同一段"</text><text x="50" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">X　形状 (2, 3)</text><rect x="50" y="60" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="70.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">1</text><rect x="90" y="60" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="110.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">2</text><rect x="130" y="60" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="150.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">3</text><rect x="50" y="88" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="70.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">4</text><rect x="90" y="88" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="110.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">5</text><rect x="130" y="88" width="40" height="28" fill="#eef4fb" stroke="#7a9cc6" stroke-width="1" rx="0"/><text x="150.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">6</text><text x="185" y="94" fill="#333" font-size="18" text-anchor="middle" font-weight="normal">+</text><text x="210" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">b　形状 (3,)</text><rect x="210" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="230.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">10</text><rect x="250" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="270.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">20</text><rect x="290" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="310.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">30</text><text x="270" y="140" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">第一步：右对齐比较形状</text><text x="270" y="156" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">(2, 3) 与 (   3)：缺的维当 1 → (1, 3)</text><text x="270" y="172" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">1 可以"撑"成 2，3 == 3 → 结果 (2, 3)</text><line x1="350" y1="94" x2="400" y2="94" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="410" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">第二步：b 被"看成" (2, 3)</text><rect x="410" y="60" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="430.0" y="78.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">10</text><rect x="450" y="60" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="470.0" y="78.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">20</text><rect x="490" y="60" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="510.0" y="78.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">30</text><rect x="410" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="430.0" y="106.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">10</text><rect x="450" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="470.0" y="106.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">20</text><rect x="490" y="88" width="40" height="28" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="510.0" y="106.2" fill="#8a5a00" font-size="12" text-anchor="middle" font-weight="normal">30</text><text x="470" y="132" fill="#8a5a00" font-size="10" text-anchor="middle" font-weight="normal">两行读的是同一段内存（stride = 0）</text><text x="470" y="146" fill="#8a5a00" font-size="10" text-anchor="middle" font-weight="normal">内存里仍然只有 10 20 30 三个数</text><text x="550" y="94" fill="#333" font-size="18" text-anchor="middle" font-weight="normal">=</text><text x="575" y="52" fill="#333" font-size="12" text-anchor="start" font-weight="600">X + b　形状 (2, 3)</text><rect x="575" y="60" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="595.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">11</text><rect x="615" y="60" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="635.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">22</text><rect x="655" y="60" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="675.0" y="78.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">33</text><rect x="575" y="88" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="595.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">14</text><rect x="615" y="88" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="635.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">25</text><rect x="655" y="88" width="40" height="28" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1" rx="0"/><text x="675.0" y="106.2" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">36</text><line x1="40" y1="200" x2="720" y2="200" stroke="#ddd" stroke-width="1"/><text x="50" y="222" fill="#333" font-size="11" text-anchor="start" font-weight="normal">写成循环就是：for i in 0..1: for j in 0..2: Y[i][j] = X[i][j] + b[j]　——　b 的下标里没有 i，所以"复制"是免费的</text><text x="50" y="242" fill="#333" font-size="11" text-anchor="start" font-weight="normal">规则只有一条：从最后一维往前对齐，每一维要么相等、要么其中一个是 1（或不存在）。相等就逐个对应，1 就沿这一维重复读。</text><text x="50" y="262" fill="#333" font-size="11" text-anchor="start" font-weight="normal">Linear 的偏置 X[512, 4096] + b[4096]、归一化的缩放 X[32, 512, 4096] * s[32, 512, 1] 都是它；</text><text x="50" y="280" fill="#333" font-size="11" text-anchor="start" font-weight="normal">X[512, 4096] + Y[4096, 512] 则报错：最后一维 4096 ≠ 512 且都不是 1。</text><text x="50" y="306" fill="#666" font-size="11" text-anchor="start" font-weight="normal">与 Spark / Flink 里的"广播变量"（把一份小数据发到每台机器）只是同名：这里是同一进程里按形状规则对齐，没有任何网络传输。</text>
</svg>
