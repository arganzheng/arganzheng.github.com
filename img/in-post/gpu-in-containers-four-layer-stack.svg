<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-labelledby="t d">
  <title id="t">四层栈：哪层在宿主机、哪层在容器</title>
  <desc id="d">四层自上而下叠放，第 3 层与第 2 层之间是一条注入边界虚线：Container Toolkit 把下面两层“挂”进容器。容器内（镜像 / pip wheel）：第 4 层 库，libcudnn.so.9、libnccl.so.2、libcublas.so.12、libnvrtc.so.12，来源 pip wheel（nvidia-cudnn-cu12 …）或 nvidia/cuda:*-runtime 层；第 3 层 CUDA Runtime，libcudart.so.12（或静态链进 libtorch_cuda.so），来源 nvidia-cuda-runtime-cu12 wheel / nvidia/cuda:*-runtime，版本 = torch.version.cuda。宿主机（驱动包）：第 2 层 用户态驱动，libcuda.so.580.x、libnvidia-ml.so.580.x、libnvidia-ptxjitcompiler.so.580.x、nvidia-smi，版本 = nvidia-smi 左上角的 Driver Version；第 1 层 内核态驱动，nvidia.ko、nvidia-uvm.ko、nvidia-modeset.ko → /dev/nvidia0 … /dev/nvidiactl /dev/nvidia-uvm。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #222; font-size: 13px; }
      .title { font-size: 15px; font-weight: 700; }
      .lab { font-size: 14px; font-weight: 700; }
      .muted { fill: #444; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .grid { stroke: #9fb3c8; stroke-width: 1.2; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .bound { stroke: #d55e00; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .boundt { fill: #b34700; font-weight: 700; }
    </style>
  </defs>
  <rect width="760" height="352" fill="#fff"/>
  <rect class="box" x="120" y="10" width="630" height="63"/>
  <line class="grid" x1="232" y1="10" x2="232" y2="73"/>
  <text xml:space="preserve" x="176.0" y="35.5" class="lab" text-anchor="middle" data-box="120,10,112,63">第 4 层</text>
  <text xml:space="preserve" x="176.0" y="57.5" text-anchor="middle" data-box="120,10,112,63">库</text>
  <text xml:space="preserve" x="247" y="36" data-box="232,10,518,63"><tspan class="mono">libcudnn.so.9  libnccl.so.2  libcublas.so.12  libnvrtc.so.12</tspan></text>
  <text xml:space="preserve" x="247" y="58" data-box="232,10,518,63">来源：pip wheel（<tspan class="mono">nvidia-cudnn-cu12</tspan> …）或 <tspan class="mono">nvidia/cuda:*-runtime</tspan> 层</text>
  <rect class="box" x="120" y="73" width="630" height="85"/>
  <line class="grid" x1="232" y1="73" x2="232" y2="158"/>
  <text xml:space="preserve" x="176.0" y="109.5" class="lab" text-anchor="middle" data-box="120,73,112,85">第 3 层</text>
  <text xml:space="preserve" x="176.0" y="131.5" text-anchor="middle" data-box="120,73,112,85">CUDA Runtime</text>
  <text xml:space="preserve" x="247" y="99" data-box="232,73,518,85"><tspan class="mono">libcudart.so.12</tspan>（或静态链进 <tspan class="mono">libtorch_cuda.so</tspan>）</text>
  <text xml:space="preserve" x="247" y="121" data-box="232,73,518,85">来源：<tspan class="mono">nvidia-cuda-runtime-cu12</tspan> wheel / <tspan class="mono">nvidia/cuda:*-runtime</tspan></text>
  <text xml:space="preserve" x="247" y="143" data-box="232,73,518,85">版本 = <tspan class="mono">torch.version.cuda</tspan></text>
  <line class="bound" x1="10" y1="176.0" x2="750" y2="176.0"/>
  <rect x="245.0" y="163.0" width="380" height="26" fill="#fff"/>
  <text xml:space="preserve" x="435.0" y="181.0" class="boundt" text-anchor="middle" data-box="245.0,163.0,380,26">注入边界：Container Toolkit 把下面两层“挂”进容器</text>
  <rect class="box" x="120" y="194" width="630" height="85"/>
  <line class="grid" x1="232" y1="194" x2="232" y2="279"/>
  <text xml:space="preserve" x="176.0" y="230.5" class="lab" text-anchor="middle" data-box="120,194,112,85">第 2 层</text>
  <text xml:space="preserve" x="176.0" y="252.5" text-anchor="middle" data-box="120,194,112,85">用户态驱动</text>
  <text xml:space="preserve" x="247" y="220" data-box="232,194,518,85"><tspan class="mono">libcuda.so.580.x  libnvidia-ml.so.580.x</tspan></text>
  <text xml:space="preserve" x="247" y="242" data-box="232,194,518,85"><tspan class="mono">libnvidia-ptxjitcompiler.so.580.x</tspan></text>
  <text xml:space="preserve" x="247" y="264" data-box="232,194,518,85"><tspan class="mono">nvidia-smi</tspan>；版本 = <tspan class="mono">nvidia-smi</tspan> 左上角的 Driver Version</text>
  <rect class="box" x="120" y="279" width="630" height="63"/>
  <line class="grid" x1="232" y1="279" x2="232" y2="342"/>
  <text xml:space="preserve" x="176.0" y="304.5" class="lab" text-anchor="middle" data-box="120,279,112,63">第 1 层</text>
  <text xml:space="preserve" x="176.0" y="326.5" text-anchor="middle" data-box="120,279,112,63">内核态驱动</text>
  <text xml:space="preserve" x="247" y="305" data-box="232,279,518,63"><tspan class="mono">nvidia.ko  nvidia-uvm.ko  nvidia-modeset.ko</tspan></text>
  <text xml:space="preserve" x="247" y="327" data-box="232,279,518,63">→ <tspan class="mono">/dev/nvidia0</tspan> … <tspan class="mono">/dev/nvidiactl</tspan> <tspan class="mono">/dev/nvidia-uvm</tspan></text>
  <text xml:space="preserve" x="61.0" y="69.0" class="lab" text-anchor="middle" data-box="4,10,114,148">容器内</text>
  <text xml:space="preserve" x="61.0" y="89.0" class="muted" text-anchor="middle" data-box="4,10,114,148">（镜像 /</text>
  <text xml:space="preserve" x="61.0" y="109.0" class="muted" text-anchor="middle" data-box="4,10,114,148">pip wheel）</text>
  <text xml:space="preserve" x="61.0" y="263.0" class="lab" text-anchor="middle" data-box="4,194,114,148">宿主机</text>
  <text xml:space="preserve" x="61.0" y="283.0" class="muted" text-anchor="middle" data-box="4,194,114,148">（驱动包）</text>
</svg>
