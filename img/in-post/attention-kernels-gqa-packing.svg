<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" role="img" aria-labelledby="t d">
  <title id="t">GQA：朴素 block 分配与按 KV head 打包</title>
  <desc id="d">Llama-3-8B 有 32 个 query head、8 个 KV head，g = 4。朴素做法：q head 0–3 各一个 block，每个 block 都读 K/V head 0，同一份 KV 被读 4 次，靠 L2 兜底；decode 时每个 block 是 M = 1 的 GEMV。打包做法：同一 KV head 的 g 个 query head 进同一 tile，token t 到 t+3 每个 token 4 行（q head 0–3），4 行 × BLOCK_Q = 4 个 token = BLOCK_M = 16 行，乘 K_j^T 时一条 mma 的 M 维填满；K/V head 0 只读一次，算术强度 × g。</desc>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; font-weight: 600; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 14px; }
      .bb { font-size: 14px; font-weight: 700; }
      .s { font-size: 13px; }
      .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 600; }
      .ms { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
      .red { fill: #a3271f; }
      .blue { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .dblue { fill: #9fc0ec; stroke: #40566f; stroke-width: 1.2; }
      .green { fill: #dcefe2; stroke: #40566f; stroke-width: 1.2; }
      .orange { fill: #fde4c8; stroke: #40566f; stroke-width: 1.2; }
      .purple { fill: #e9def5; stroke: #40566f; stroke-width: 1.2; }
      .gray { fill: #e6e9ee; stroke: #40566f; stroke-width: 1.2; }
      .white { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .wait { fill: #fff; stroke: #8a97a6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.2; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .thin { stroke: #8a97a6; stroke-width: 1; fill: none; }
      .arr { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .mark { stroke: #c0392b; stroke-width: 2.2; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="536" fill="#fff"/>
  <text class="bb" x="20" y="24">Llama-3-8B：32 个 query head，8 个 KV head，g = 4</text>
  <text class="h" x="20" y="56">朴素：每个 query head 一个 block</text>
  <rect class="orange" x="20" y="72" width="90" height="30"/>
  <text class="ms" x="65" y="92" text-anchor="middle">q head 0</text>
  <line class="arr" x1="110" y1="87" x2="150" y2="87"/>
  <rect class="white" x="150" y="72" width="80" height="30"/>
  <text class="ms" x="190" y="92" text-anchor="middle">block 0</text>
  <line class="arr" x1="230" y1="87" x2="340" y2="87"/>
  <text class="s" x="285" y="82" text-anchor="middle">读 K/V head 0</text>
  <rect class="orange" x="20" y="112" width="90" height="30"/>
  <text class="ms" x="65" y="132" text-anchor="middle">q head 1</text>
  <line class="arr" x1="110" y1="127" x2="150" y2="127"/>
  <rect class="white" x="150" y="112" width="80" height="30"/>
  <text class="ms" x="190" y="132" text-anchor="middle">block 1</text>
  <line class="arr" x1="230" y1="127" x2="340" y2="127"/>
  <text class="s" x="285" y="122" text-anchor="middle">读 K/V head 0</text>
  <rect class="orange" x="20" y="152" width="90" height="30"/>
  <text class="ms" x="65" y="172" text-anchor="middle">q head 2</text>
  <line class="arr" x1="110" y1="167" x2="150" y2="167"/>
  <rect class="white" x="150" y="152" width="80" height="30"/>
  <text class="ms" x="190" y="172" text-anchor="middle">block 2</text>
  <line class="arr" x1="230" y1="167" x2="340" y2="167"/>
  <text class="s" x="285" y="162" text-anchor="middle">读 K/V head 0</text>
  <rect class="orange" x="20" y="192" width="90" height="30"/>
  <text class="ms" x="65" y="212" text-anchor="middle">q head 3</text>
  <line class="arr" x1="110" y1="207" x2="150" y2="207"/>
  <rect class="white" x="150" y="192" width="80" height="30"/>
  <text class="ms" x="190" y="212" text-anchor="middle">block 3</text>
  <line class="arr" x1="230" y1="207" x2="340" y2="207"/>
  <text class="s" x="285" y="202" text-anchor="middle">读 K/V head 0</text>
  <rect class="green" x="340" y="72" width="110" height="150"/>
  <text class="ms" x="395" y="142" text-anchor="middle">K/V head 0</text>
  <text class="s" x="466" y="122">同一份 KV 被读 4 次</text>
  <text class="s" x="466" y="142">（靠 L2 兜底）</text>
  <text class="s" x="466" y="176">decode 时每个 block</text>
  <text class="s" x="466" y="196">是 M = 1 的 GEMV</text>
  <text class="h" x="20" y="266">打包：同一 KV head 的 g 个 query head 进同一 tile</text>
  <rect class="orange" x="110" y="282" width="170" height="15"/>
  <text class="ms" x="195.0" y="294" text-anchor="middle">q head 0</text>
  <rect class="orange" x="110" y="297" width="170" height="15"/>
  <text class="ms" x="195.0" y="309" text-anchor="middle">q head 1</text>
  <rect class="orange" x="110" y="312" width="170" height="15"/>
  <text class="ms" x="195.0" y="324" text-anchor="middle">q head 2</text>
  <rect class="orange" x="110" y="327" width="170" height="15"/>
  <text class="ms" x="195.0" y="339" text-anchor="middle">q head 3</text>
  <line class="ln" x1="100" y1="284" x2="100" y2="340"/>
  <text class="ms" x="94" y="317" text-anchor="end">token t</text>
  <rect class="blue" x="110" y="342" width="170" height="15"/>
  <text class="ms" x="195.0" y="354" text-anchor="middle">q head 0</text>
  <rect class="blue" x="110" y="357" width="170" height="15"/>
  <text class="ms" x="195.0" y="369" text-anchor="middle">q head 1</text>
  <rect class="blue" x="110" y="372" width="170" height="15"/>
  <text class="ms" x="195.0" y="384" text-anchor="middle">q head 2</text>
  <rect class="blue" x="110" y="387" width="170" height="15"/>
  <text class="ms" x="195.0" y="399" text-anchor="middle">q head 3</text>
  <line class="ln" x1="100" y1="344" x2="100" y2="400"/>
  <text class="ms" x="94" y="377" text-anchor="end">token t+1</text>
  <rect class="purple" x="110" y="402" width="170" height="15"/>
  <text class="ms" x="195.0" y="414" text-anchor="middle">q head 0</text>
  <rect class="purple" x="110" y="417" width="170" height="15"/>
  <text class="ms" x="195.0" y="429" text-anchor="middle">q head 1</text>
  <rect class="purple" x="110" y="432" width="170" height="15"/>
  <text class="ms" x="195.0" y="444" text-anchor="middle">q head 2</text>
  <rect class="purple" x="110" y="447" width="170" height="15"/>
  <text class="ms" x="195.0" y="459" text-anchor="middle">q head 3</text>
  <line class="ln" x1="100" y1="404" x2="100" y2="460"/>
  <text class="ms" x="94" y="437" text-anchor="end">token t+2</text>
  <rect class="gray" x="110" y="462" width="170" height="15"/>
  <text class="ms" x="195.0" y="474" text-anchor="middle">q head 0</text>
  <rect class="gray" x="110" y="477" width="170" height="15"/>
  <text class="ms" x="195.0" y="489" text-anchor="middle">q head 1</text>
  <rect class="gray" x="110" y="492" width="170" height="15"/>
  <text class="ms" x="195.0" y="504" text-anchor="middle">q head 2</text>
  <rect class="gray" x="110" y="507" width="170" height="15"/>
  <text class="ms" x="195.0" y="519" text-anchor="middle">q head 3</text>
  <line class="ln" x1="100" y1="464" x2="100" y2="520"/>
  <text class="ms" x="94" y="497" text-anchor="end">token t+3</text>
  <line class="ln" x1="290" y1="282" x2="290" y2="522"/>
  <text class="s" x="300" y="372.0">4 行（g 个 q head）</text>
  <text class="s" x="300" y="394.0">× BLOCK_Q = 4 个 token</text>
  <text class="s" x="300" y="416.0">= BLOCK_M = 16 行</text>
  <text class="s" x="300" y="438.0">一条 mma 的 M 维填满</text>
  <text class="h" x="500" y="407.0" text-anchor="middle">×</text>
  <rect class="green" x="530" y="322" width="150" height="160"/>
  <text class="bb" x="605" y="398.0" text-anchor="middle">K<tspan dy="4" font-size="75%">j</tspan><tspan dy="-4">​</tspan><tspan dy="-6" font-size="75%">T</tspan><tspan dy="6">​</tspan></text>
  <text class="s" x="605" y="418.0" text-anchor="middle">（K/V head 0）</text>
  <text class="s" x="605" y="508" text-anchor="middle">只读一次，算术强度 × g</text>
</svg>
