<title id="t">local_tile 与 local_partition 三步划分图示</title>
<desc id="d">① 128×128 的 tile 按 (64,32) zipped_divide 成 2×4 个 warp tile，w5 高亮，结果 ((_64,_32),(_2,_4)):((_1,_128),(_64,_4096))，前半是 warp tile 内坐标，后半是第几个 warp。② local_tile(T,(64,32),(1,2)) 取出 warp 5 的 64×32 子块，layout (_64,_32):(_1,_128)，起始偏移 8256。③ local_partition 按 8×4 线程网格交错划分，lane 3 = 线程坐标 (3,0)，拿行 3、11、…、59 与列 0、4、…、28 交叉处的 8×8 个元素，layout (_8,_8):(_8,_512)。</desc>
