<svg xmlns="http://www.w3.org/2000/svg" width="900" height="462" viewBox="0 0 900 462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="440" y="24" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">训练前向每一站的输出形状（B = 2、T = 5、d = 8、V = 16）：条宽 ∝ 最后一维</text><line x1="286" y1="44" x2="286" y2="404" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/><text x="286" y="418" fill="#888" font-size="10" text-anchor="middle" font-weight="normal">d = 8</text><text x="180" y="63" fill="#333" font-size="11" text-anchor="end" font-weight="normal">输入 idx</text><rect x="190" y="50" width="60" height="18" fill="#f4f4f4" stroke="#ddd" stroke-width="1.2" rx="3"/><text x="590" y="63" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5)</text><text x="670" y="63" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">每个 token 一个整数编号</text><text x="180" y="93" fill="#333" font-size="11" text-anchor="end" font-weight="normal">wte 查表</text><rect x="190" y="80" width="96" height="18" fill="#1f6fb222" stroke="#1f6fb2" stroke-width="1.2" rx="3"/><text x="590" y="93" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="93" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">每个 token 一个 8 维向量</text><text x="180" y="123" fill="#333" font-size="11" text-anchor="end" font-weight="normal">+ wpe 查表</text><rect x="190" y="110" width="96" height="18" fill="#1f6fb222" stroke="#1f6fb2" stroke-width="1.2" rx="3"/><text x="590" y="123" fill="#222" font-size="11" text-anchor="start" font-weight="600">(5, 8)</text><text x="670" y="123" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">5 个位置各一个向量，广播加到每句上</text><text x="180" y="153" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block0.attn.c_attn</text><rect x="190" y="140" width="288" height="18" fill="#8a6bd122" stroke="#8a6bd1" stroke-width="1.2" rx="3"/><text x="590" y="153" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 24)</text><text x="670" y="153" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">Q、K、V 一次算出（3d）再切开</text><text x="180" y="183" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block0.attn 输出</text><rect x="190" y="170" width="96" height="18" fill="#8a6bd122" stroke="#8a6bd1" stroke-width="1.2" rx="3"/><text x="590" y="183" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="183" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">加回残差流</text><text x="180" y="213" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block0.mlp.c_fc</text><rect x="190" y="200" width="384" height="18" fill="#c98a0022" stroke="#c98a00" stroke-width="1.2" rx="3"/><text x="590" y="213" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 32)</text><text x="670" y="213" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">FFN 放大到 4d</text><text x="180" y="243" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block0.mlp 输出</text><rect x="190" y="230" width="96" height="18" fill="#c98a0022" stroke="#c98a00" stroke-width="1.2" rx="3"/><text x="590" y="243" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="243" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">压回 d，加回残差流</text><text x="180" y="273" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block0 输出</text><rect x="190" y="260" width="96" height="18" fill="#4d9a5c22" stroke="#4d9a5c" stroke-width="1.2" rx="3"/><text x="590" y="273" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="273" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">残差流</text><text x="180" y="303" fill="#333" font-size="11" text-anchor="end" font-weight="normal">block1（同上）</text><rect x="190" y="290" width="96" height="18" fill="#4d9a5c22" stroke="#4d9a5c" stroke-width="1.2" rx="3"/><text x="590" y="303" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="303" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">24 → 8 → 32 → 8 再走一遍</text><text x="180" y="333" fill="#333" font-size="11" text-anchor="end" font-weight="normal">ln_f</text><rect x="190" y="320" width="96" height="18" fill="#4d9a5c22" stroke="#4d9a5c" stroke-width="1.2" rx="3"/><text x="590" y="333" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 8)</text><text x="670" y="333" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">最后一次 LayerNorm</text><text x="180" y="363" fill="#333" font-size="11" text-anchor="end" font-weight="normal">lm_head → logits</text><rect x="190" y="350" width="192" height="18" fill="#c0392b22" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="590" y="363" fill="#222" font-size="11" text-anchor="start" font-weight="600">(2, 5, 16)</text><text x="670" y="363" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">每个位置 V = 16 个分数</text><text x="180" y="393" fill="#333" font-size="11" text-anchor="end" font-weight="normal">loss</text><rect x="190" y="380" width="12" height="18" fill="#f4f4f4" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="590" y="393" fill="#222" font-size="11" text-anchor="start" font-weight="600">()</text><text x="670" y="393" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">标量 2.7805 ≈ ln 16</text><text x="60" y="444" fill="#333" font-size="11" text-anchor="start" font-weight="normal">残差流的宽度从 wte 到 ln_f 一直是 d：只有 QKV（3d）和 FFN（4d）两处临时变宽又缩回；lm_head 之后每个位置都有一个词表分布。</text>
</svg>
