<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-labelledby="title desc">
  <title id="title">两层 fat-tree：leaf 上行 32、下行 64 端口</title>
  <desc id="desc">spine0 到 spine3 各用 8 条链路接到 leaf0，上行 4 × 8 = 32 端口；leaf0 下行 64 端口，接 8 台机器 × 8 张网卡，即 NIC0 到 NIC63。超额订阅比 64 : 32 = 2 : 1。</desc>
