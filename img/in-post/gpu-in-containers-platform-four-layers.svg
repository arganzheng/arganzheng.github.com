<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" width="760" height="564" role="img" aria-labelledby="t d">
  <title id="t">平台机制全局图：四层</title>
  <desc id="d">自上而下四层，层间用箭头连接。Pod spec：resources.limits: nvidia.com/gpu: 2（device plugin 路径），resourceClaims: [{resourceClaimTemplateName}]（DRA 路径，1.34 GA）。箭头：调度，计数（NodeResourcesFit）或按属性算（DynamicResources 插件）。kubelet：device manager（pkg/kubelet/cm/devicemanager）ListAndWatch 记数、Allocate 取注入指令；DRA manager（pkg/kubelet/cm/dra）NodePrepareResources 取 CDI 设备名。箭头：注入指令，环境变量 NVIDIA_VISIBLE_DEVICES=GPU-uuid,... 或 CDI 设备 nvidia.com/gpu=0。容器运行时 + Container Toolkit：containerd / CRI-O → nvidia-container-runtime（OCI runtime 包装）；legacy：prestart hook → nvidia-container-cli configure，挂 libcuda.so、/dev/nvidia*；cdi / jit-cdi：按 CDI spec 改 OCI spec（v1.20.0 默认 auto → jit-cdi）。箭头向下到宿主机：nvidia.ko / nvidia-uvm.ko + libcuda.so.&lt;ver&gt; + nvidia-smi（节点管理员或 GPU Operator 驱动容器）；GPU Feature Discovery → 节点标签 nvidia.com/gpu.product / gpu.memory / cuda.driver.major …；GPU Operator（ClusterPolicy）把驱动容器、Toolkit、device plugin、GFD、DCGM Exporter、MIG Manager 装成一套。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #222; font-size: 13px; }
      .title { font-size: 15px; font-weight: 700; }
      .lab { font-size: 14px; font-weight: 700; }
      .muted { fill: #444; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .grid { stroke: #9fb3c8; stroke-width: 1.2; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .bound { stroke: #d55e00; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .boundt { fill: #b34700; font-weight: 700; }
    </style>
  </defs>
  <rect width="760" height="564" fill="#fff"/>
  <rect class="box" x="10" y="10" width="740" height="85"/>
  <text xml:space="preserve" x="26" y="36" class="title" data-box="10,10,740,85">Pod spec</text>
  <text xml:space="preserve" x="26" y="58" data-box="10,10,740,85"><tspan class="mono">resources.limits: nvidia.com/gpu: 2</tspan></text>
  <text xml:space="preserve" x="734" y="58" class="muted" text-anchor="end" data-box="10,10,740,85">← device plugin 路径</text>
  <text xml:space="preserve" x="26" y="80" data-box="10,10,740,85"><tspan class="mono">resourceClaims: [{resourceClaimTemplateName}]</tspan></text>
  <text xml:space="preserve" x="734" y="80" class="muted" text-anchor="end" data-box="10,10,740,85">← DRA 路径（1.34 GA）</text>
  <line class="arrow" x1="60" y1="95" x2="60" y2="141"/>
  <text xml:space="preserve" x="76" y="123.0" data-box="0,95,760,46">调度：计数（<tspan class="mono">NodeResourcesFit</tspan>）或按属性算（<tspan class="mono">DynamicResources</tspan> 插件）</text>
  <rect class="box" x="10" y="141" width="740" height="85"/>
  <text xml:space="preserve" x="26" y="167" class="title" data-box="10,141,740,85">kubelet</text>
  <text xml:space="preserve" x="26" y="189" data-box="10,141,740,85">device manager（<tspan class="mono">pkg/kubelet/cm/devicemanager</tspan>）：<tspan class="mono">ListAndWatch</tspan> 记数、<tspan class="mono">Allocate</tspan> 取注入指令</text>
  <text xml:space="preserve" x="26" y="211" data-box="10,141,740,85">DRA manager（<tspan class="mono">pkg/kubelet/cm/dra</tspan>）：<tspan class="mono">NodePrepareResources</tspan> 取 CDI 设备名</text>
  <line class="arrow" x1="60" y1="226" x2="60" y2="272"/>
  <text xml:space="preserve" x="76" y="254.0" data-box="0,226,760,46">注入指令：环境变量 <tspan class="mono">NVIDIA_VISIBLE_DEVICES=GPU-uuid,...</tspan> 或 CDI 设备 <tspan class="mono">nvidia.com/gpu=0</tspan></text>
  <rect class="box" x="10" y="272" width="740" height="107"/>
  <text xml:space="preserve" x="26" y="298" class="title" data-box="10,272,740,107">容器运行时 + Container Toolkit</text>
  <text xml:space="preserve" x="26" y="320" data-box="10,272,740,107"><tspan class="mono">containerd</tspan> / <tspan class="mono">CRI-O</tspan> → <tspan class="mono">nvidia-container-runtime</tspan>（OCI runtime 包装）</text>
  <text xml:space="preserve" x="26" y="342" data-box="10,272,740,107">legacy：prestart hook → <tspan class="mono">nvidia-container-cli configure</tspan>，挂 <tspan class="mono">libcuda.so</tspan>、<tspan class="mono">/dev/nvidia*</tspan></text>
  <text xml:space="preserve" x="26" y="364" data-box="10,272,740,107"><tspan class="mono">cdi</tspan> / <tspan class="mono">jit-cdi</tspan>：按 CDI spec 改 OCI spec（v1.20.0 默认 <tspan class="mono">auto</tspan> → <tspan class="mono">jit-cdi</tspan>）</text>
  <line class="arrow" x1="60" y1="379" x2="60" y2="425"/>
  <rect class="box" x="10" y="425" width="740" height="129"/>
  <text xml:space="preserve" x="26" y="451" class="title" data-box="10,425,740,129">宿主机</text>
  <text xml:space="preserve" x="26" y="473" data-box="10,425,740,129"><tspan class="mono">nvidia.ko</tspan> / <tspan class="mono">nvidia-uvm.ko</tspan> + <tspan class="mono">libcuda.so.&lt;ver&gt;</tspan> + <tspan class="mono">nvidia-smi</tspan></text>
  <text xml:space="preserve" x="734" y="473" class="muted" text-anchor="end" data-box="10,425,740,129">← 节点管理员或 GPU Operator 驱动容器</text>
  <text xml:space="preserve" x="26" y="495" data-box="10,425,740,129">GPU Feature Discovery → 节点标签 <tspan class="mono">nvidia.com/gpu.product</tspan> / <tspan class="mono">gpu.memory</tspan> / <tspan class="mono">cuda.driver.major</tspan> …</text>
  <text xml:space="preserve" x="26" y="517" data-box="10,425,740,129">GPU Operator（ClusterPolicy）：把驱动容器、Toolkit、device plugin、GFD、</text>
  <text xml:space="preserve" x="26" y="539" data-box="10,425,740,129"><tspan visibility="hidden">GPU Operator（ClusterPolicy）：</tspan>DCGM Exporter、MIG Manager 装成一套</text>
</svg>
