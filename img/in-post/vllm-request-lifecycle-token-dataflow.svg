<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
  <title id="title">一个 token 穿过 Serving 栈：每跳传的是什么</title>
  <desc id="desc">Client、API Server、EngineCoreProc、WorkerProc 四条生命线；去程文本→token ids，回程 token ids→文本，标注每一跳的载荷。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <marker id="arrow-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2b7a78"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #182535; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .actor { fill: #eef5ff; stroke: #5880b4; stroke-width: 2; rx: 10; }
      .actor-b { fill: #fff6e9; stroke: #c6873d; stroke-width: 2; rx: 10; }
      .actor-c { fill: #eff9f4; stroke: #4b9477; stroke-width: 2; rx: 10; }
      .lifeline { stroke: #aebdce; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="760" height="660" fill="#fff"/>
  <text x="380" y="34" text-anchor="middle" class="heading">Token 数据流：每一跳传的是什么</text>

  <rect x="28" y="56" width="150" height="58" class="actor"/>
  <text x="103" y="81" text-anchor="middle" class="label">Client</text>
  <text x="103" y="101" text-anchor="middle" class="small">HTTP / SSE</text>
  <rect x="210" y="56" width="190" height="58" class="actor"/>
  <text x="305" y="81" text-anchor="middle" class="label">API Server · 进程 A</text>
  <text x="305" y="101" text-anchor="middle" class="small">Input / Output Processor</text>
  <rect x="430" y="56" width="150" height="58" class="actor-b"/>
  <text x="505" y="81" text-anchor="middle" class="label">EngineCoreProc</text>
  <text x="505" y="101" text-anchor="middle" class="small">Scheduler · Executor</text>
  <rect x="612" y="56" width="126" height="58" class="actor-c"/>
  <text x="675" y="81" text-anchor="middle" class="label">WorkerProc</text>
  <text x="675" y="101" text-anchor="middle" class="small">GPU 前向 + 采样</text>

  <line x1="103" y1="114" x2="103" y2="580" class="lifeline"/>
  <line x1="305" y1="114" x2="305" y2="580" class="lifeline"/>
  <line x1="505" y1="114" x2="505" y2="580" class="lifeline"/>
  <line x1="675" y1="114" x2="675" y2="580" class="lifeline"/>

  <!-- 1 C→A -->
  <line x1="113" y1="150" x2="295" y2="150" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="136" text-anchor="middle" class="label">1 · HTTP JSON</text>
  <text x="204" y="172" text-anchor="middle" class="small">文本：&quot;Hello, tell me a joke&quot;</text>

  <!-- 2 activation: tokenize -->
  <rect x="285" y="192" width="40" height="60" fill="#dbe7f5" stroke="#5880b4" stroke-width="1.2" rx="5"/>
  <text x="262" y="215" text-anchor="end" class="label">2 · tokenize</text>
  <text x="262" y="233" text-anchor="end" class="small">InputProcessor → token ids</text>

  <!-- 3 A→B -->
  <line x1="315" y1="278" x2="495" y2="278" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="264" text-anchor="middle" class="label">3 · EngineCoreRequest</text>
  <text x="405" y="300" text-anchor="middle" class="small">ZMQ · token ids [15496, 11, 2425, …]</text>

  <!-- 4 activation: schedule -->
  <rect x="490" y="322" width="30" height="64" fill="#f0e2cd" stroke="#c6873d" stroke-width="1.2" rx="5"/>
  <text x="480" y="345" text-anchor="end" class="label">4 · schedule()</text>
  <text x="480" y="363" text-anchor="end" class="small">谁跑 · 几 token · 块在哪</text>

  <!-- 5 B→C -->
  <line x1="522" y1="412" x2="665" y2="412" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="594" y="398" text-anchor="middle" class="label">5 · SchedulerOutput</text>
  <text x="594" y="434" text-anchor="middle" class="small">MessageQueue 广播 · 元数据（无 tensor）</text>

  <!-- activation: forward+sample -->
  <rect x="655" y="452" width="40" height="52" fill="#d8ecdf" stroke="#4b9477" stroke-width="1.2" rx="5"/>
  <text x="645" y="474" text-anchor="end" class="label">forward → sample</text>
  <text x="645" y="492" text-anchor="end" class="small">GPU 上的 tensor，不外传</text>

  <!-- 6 C→B -->
  <line x1="655" y1="530" x2="515" y2="530" stroke="#2b7a78" stroke-width="2" marker-end="url(#arrow-r)"/>
  <text x="585" y="516" text-anchor="middle" class="label">6 · ModelRunnerOutput</text>
  <text x="585" y="552" text-anchor="middle" class="small">token ids · 仅 output_rank 回传</text>

  <!-- 7 B→A -->
  <line x1="495" y1="574" x2="315" y2="574" stroke="#2b7a78" stroke-width="2" marker-end="url(#arrow-r)"/>
  <text x="405" y="560" text-anchor="middle" class="label">7 · EngineCoreOutputs</text>
  <text x="405" y="594" text-anchor="middle" class="small">ZMQ · 仍只有 token ids</text>

  <!-- 8 activation: detokenize -->
  <rect x="285" y="608" width="40" height="36" fill="#dbe7f5" stroke="#5880b4" stroke-width="1.2" rx="5"/>
  <text x="262" y="620" text-anchor="end" class="label">8 · detokenize</text>
  <text x="262" y="638" text-anchor="end" class="small">token ids → 文本</text>

  <!-- 9 A→C(client) -->
  <line x1="285" y1="598" x2="113" y2="598" stroke="#2b7a78" stroke-width="2" marker-end="url(#arrow-r)"/>
  <text x="196" y="584" text-anchor="middle" class="label">SSE chunk</text>
</svg>
