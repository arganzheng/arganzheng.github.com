<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">一个 token 穿过 Serving 栈的泳道数据流</title>
  <desc id="desc">Client、API Server 进程、EngineCoreProc、WorkerProc 四条泳道；去程文本→token ids，回程 token ids→detokenize→文本。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <marker id="arrow-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2b7a78"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182535; }
      .title { font-size: 19px; font-weight: 700; }
      .lane { font-size: 15px; font-weight: 700; }
      .label { font-size: 13.5px; font-weight: 700; }
      .body { font-size: 12.5px; }
      .small { font-size: 11.5px; }
    </style>
  </defs>
  <rect width="760" height="620" fill="#fff"/>
  <text x="380" y="30" text-anchor="middle" class="title">Token 数据流：每跳传的是什么（一个 decode step）</text>

  <!-- 泳道 -->
  <rect x="30" y="48" width="120" height="530" fill="#f7f9fc" stroke="#c9d4e0" rx="8"/>
  <rect x="170" y="48" width="180" height="530" fill="#eef5ff" stroke="#5880b4" rx="8"/>
  <rect x="370" y="48" width="160" height="530" fill="#fff6e9" stroke="#c6873d" rx="8"/>
  <rect x="550" y="48" width="180" height="530" fill="#eff9f4" stroke="#4b9477" rx="8"/>
  <text x="90" y="76" text-anchor="middle" class="lane">Client</text>
  <text x="260" y="76" text-anchor="middle" class="lane">API Server 进程 A</text>
  <text x="260" y="94" text-anchor="middle" class="small">AsyncLLM · 输入/输出处理</text>
  <text x="450" y="76" text-anchor="middle" class="lane">EngineCoreProc B</text>
  <text x="450" y="94" text-anchor="middle" class="small">Scheduler · Executor（进程内对象）</text>
  <text x="640" y="76" text-anchor="middle" class="lane">WorkerProc C ×N</text>
  <text x="640" y="94" text-anchor="middle" class="small">Worker · GPUModelRunner · GPU</text>

  <!-- 去程 -->
  <line x1="92" y1="130" x2="168" y2="130" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="130" y="120" text-anchor="middle" class="label">1 · HTTP JSON</text>
  <text x="130" y="147" text-anchor="middle" class="small">文本 prompt + 采样参数</text>

  <rect x="185" y="168" width="150" height="60" fill="#fff" stroke="#5880b4" stroke-width="1.2" rx="8"/>
  <text x="260" y="191" text-anchor="middle" class="label">2 · tokenize</text>
  <text x="260" y="211" text-anchor="middle" class="small">InputProcessor → token ids</text>

  <line x1="336" y1="262" x2="444" y2="262" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="390" y="246" text-anchor="middle" class="label">3 · EngineCoreRequest</text>
  <text x="390" y="282" text-anchor="middle" class="small">ZMQ · 只有 token ids，跨进程</text>

  <rect x="382" y="300" width="136" height="78" fill="#fff" stroke="#c6873d" stroke-width="1.2" rx="8"/>
  <text x="450" y="322" text-anchor="middle" class="label">4 · schedule()</text>
  <text x="450" y="342" text-anchor="middle" class="small">SchedulerOutput：谁跑、</text>
  <text x="450" y="360" text-anchor="middle" class="small">几 token、块在哪</text>

  <line x1="520" y1="400" x2="548" y2="400" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="534" y="392" text-anchor="middle" class="label">5</text>

  <rect x="562" y="380" width="156" height="100" fill="#fff" stroke="#4b9477" stroke-width="1.2" rx="8"/>
  <text x="640" y="402" text-anchor="middle" class="label">5 · 广播 + 前向</text>
  <text x="640" y="422" text-anchor="middle" class="small">MessageQueue 广播 →</text>
  <text x="640" y="440" text-anchor="middle" class="small">prepare_inputs → forward →</text>
  <text x="640" y="458" text-anchor="middle" class="small">sampled_token_id（GPU）</text>

  <!-- 回程 -->
  <line x1="560" y1="505" x2="532" y2="505" stroke="#2b7a78" stroke-width="1.8" marker-end="url(#arrow-r)"/>
  <text x="540" y="490" text-anchor="middle" class="label">6 · ModelRunnerOutput</text>
  <text x="540" y="524" text-anchor="middle" class="small">token ids · 仅 output_rank 回传</text>

  <line x1="368" y1="530" x2="338" y2="530" stroke="#2b7a78" stroke-width="1.8" marker-end="url(#arrow-r)"/>
  <text x="452" y="518" text-anchor="middle" class="label">7 · EngineCoreOutputs</text>
  <text x="452" y="549" text-anchor="middle" class="small">ZMQ · 仍只有 token ids</text>

  <rect x="185" y="500" width="150" height="54" fill="#fff" stroke="#5880b4" stroke-width="1.2" rx="8"/>
  <text x="260" y="522" text-anchor="middle" class="label">8 · detokenize</text>
  <text x="260" y="541" text-anchor="middle" class="small">OutputProcessor → 文本增量</text>

  <line x1="168" y1="565" x2="92" y2="565" stroke="#2b7a78" stroke-width="1.8" marker-end="url(#arrow-r)"/>
  <text x="130" y="556" text-anchor="middle" class="label">SSE chunk</text>

  <text x="380" y="602" text-anchor="middle" class="small">文本只在进程 A 出现：去程在 A 内 tokenize，回程到 A 才 detokenize；B、C 之间只传 token ids 与元数据</text>
</svg>
