<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">一次请求的时间线：Queueing、Prefill、TTFT、ITL、TPOT 与 E2E</title>
  <desc id="desc">t0 到 tN 的虚线刻度贯穿每一行。Queueing 和 Prefill 分别覆盖 t0–t1、t1–t2；TTFT 覆盖 t0–t2；ITL1、ITL2、ITL3 和后续区间从 t2 连续延伸到 tN；TPOT 覆盖 t2–tN，E2E 覆盖 t0–tN。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#62758a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .title { font-size: 19px; font-weight: 700; fill: #243447; }
      .guide { stroke: #aeb9c5; stroke-width: 1; stroke-dasharray: 4 5; }
      .time { font-size: 13px; font-weight: 600; }
      .label { font-size: 14px; font-weight: 600; }
      .queue { stroke: #65758b; }
      .prefill { stroke: #547b9c; }
      .ttft { stroke: #356b8c; }
      .itl, .tpot { stroke: #a96f28; }
      .e2e { stroke: #4d6790; }
      .bracket { fill: none; stroke-width: 2.2; stroke-linecap: square; }
    </style>
  </defs>
  <rect width="760" height="370" fill="#fff"/>
  <text x="380" y="29" text-anchor="middle" class="title">一次请求的时间线：Queueing、Prefill、TTFT、ITL、TPOT 与 E2E</text>

  <text x="30" y="75" class="time">时间</text>
  <line x1="95" y1="70" x2="708" y2="70" stroke="#62758a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="time" text-anchor="middle">
    <text x="95" y="61">t0</text>
    <text x="195" y="61">t1</text>
    <text x="295" y="61">t2</text>
    <text x="390" y="61">t3</text>
    <text x="485" y="61">t4</text>
    <text x="580" y="61">t5</text>
    <text x="700" y="61">tN</text>
  </g>
  <g class="guide">
    <line x1="95" y1="82" x2="95" y2="329"/>
    <line x1="195" y1="82" x2="195" y2="329"/>
    <line x1="295" y1="82" x2="295" y2="329"/>
    <line x1="390" y1="82" x2="390" y2="329"/>
    <line x1="485" y1="82" x2="485" y2="329"/>
    <line x1="580" y1="82" x2="580" y2="329"/>
    <line x1="700" y1="82" x2="700" y2="329"/>
  </g>

  <g text-anchor="middle">
    <path d="M95 128 V116 H195 V128" class="bracket queue"/>
    <text x="145" y="108" class="label">Queueing</text>
    <path d="M195 128 V116 H295 V128" class="bracket prefill"/>
    <text x="245" y="108" class="label">Prefill</text>

    <path d="M95 177 V165 H295 V177" class="bracket ttft"/>
    <text x="195" y="157" class="label" fill="#356b8c">TTFT</text>

    <path d="M295 226 V214 H390 V226" class="bracket itl"/>
    <text x="342.5" y="206" class="label" fill="#a96f28">ITL1</text>
    <path d="M390 226 V214 H485 V226" class="bracket itl"/>
    <text x="437.5" y="206" class="label" fill="#a96f28">ITL2</text>
    <path d="M485 226 V214 H580 V226" class="bracket itl"/>
    <text x="532.5" y="206" class="label" fill="#a96f28">ITL3</text>
    <path d="M580 226 V214 H700 V226" class="bracket itl"/>
    <text x="640" y="206" class="label" fill="#a96f28">…</text>

    <path d="M295 275 V263 H700 V275" class="bracket tpot"/>
    <text x="497.5" y="255" class="label" fill="#a96f28">TPOT = (E2E − TTFT) / (N − 1)</text>

    <path d="M95 324 V312 H700 V324" class="bracket e2e"/>
    <text x="397.5" y="304" class="label" fill="#4d6790">E2E Latency</text>
  </g>
</svg>
