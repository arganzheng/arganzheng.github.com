<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Greedy 与 beam width 2 搜索树</title>
  <desc id="desc">三步 token 搜索示例。Greedy 选择 A、A1、A1b，累计 log probability 为 -2.00；beam width 2 保留 B、B1、B1a，累计值为 -1.32。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#90a0af"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, sans-serif; fill: #17283b; }
      .sub { font: 13px system-ui, sans-serif; fill: #53677d; }
      .step { font: 12px system-ui, sans-serif; fill: #52657a; }
      .node-text { font: 700 13px system-ui, sans-serif; fill: #20364b; text-anchor: middle; }
      .score { font: 11px system-ui, sans-serif; fill: #52657a; text-anchor: middle; }
      .edge-label { font: 11px system-ui, sans-serif; fill: #53677d; text-anchor: middle; }
      .node { fill: #f4f7fa; stroke: #9aabba; stroke-width: 1.2; }
      .kept { fill: #e6f1fb; stroke: #4079aa; stroke-width: 2; }
      .best { fill: #d7ebf8; stroke: #27628f; stroke-width: 2.4; }
      .pruned { opacity: 0.48; }
      .edge { fill: none; stroke: #9aa9b7; stroke-width: 1.4; marker-end: url(#arrow); }
      .beam-edge { fill: none; stroke: #3e78a6; stroke-width: 2.1; marker-end: url(#arrow); }
      .greedy-edge { fill: none; stroke: #c77a2d; stroke-width: 2.3; stroke-dasharray: 5 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="760" height="500" fill="#fff"/>
  <text class="title" x="24" y="30">三步搜索：greedy 的局部选择与 beam 的累计分数</text>
  <text class="sub" x="24" y="51">边上是条件 log-prob；节点下是累计 log-prob。beam width = 2。</text>
  <text class="step" x="26" y="85">第 1 步</text>
  <text class="step" x="26" y="205">第 2 步</text>
  <text class="step" x="26" y="325">第 3 步</text>

  <path class="beam-edge" d="M380 87 L190 133"/>
  <path class="beam-edge" d="M380 87 L485 133"/>
  <path class="edge pruned" d="M380 87 L650 133"/>
  <text class="edge-label" x="278" y="102">−0.69</text>
  <text class="edge-label" x="438" y="105">−1.05</text>
  <text class="edge-label" x="535" y="100">−1.90</text>

  <path class="greedy-edge" d="M190 155 L120 253"/>
  <path class="edge pruned" d="M190 155 L275 253"/>
  <path class="beam-edge" d="M485 155 L465 253"/>
  <path class="edge pruned" d="M485 155 L605 253"/>
  <text class="edge-label" x="141" y="202">−0.80</text>
  <text class="edge-label" x="240" y="202">−1.05</text>
  <text class="edge-label" x="460" y="202">−0.16</text>
  <text class="edge-label" x="555" y="202">−2.30</text>

  <path class="edge pruned" d="M120 275 L155 373"/>
  <path class="greedy-edge" d="M120 275 L270 373"/>
  <path class="beam-edge" d="M465 275 L485 373"/>
  <path class="edge pruned" d="M465 275 L605 373"/>
  <text class="edge-label" x="135" y="326">−0.92</text>
  <text class="edge-label" x="225" y="326">−0.51</text>
  <text class="edge-label" x="485" y="326">−0.11</text>
  <text class="edge-label" x="565" y="326">−3.00</text>

  <g>
    <circle class="node kept" cx="190" cy="145" r="26"/><text class="node-text" x="190" y="149">A</text><text class="score" x="190" y="180">−0.69</text>
    <circle class="node kept" cx="485" cy="145" r="26"/><text class="node-text" x="485" y="149">B</text><text class="score" x="485" y="180">−1.05</text>
    <circle class="node pruned" cx="650" cy="145" r="26"/><text class="node-text" x="650" y="149">C</text><text class="score" x="650" y="180">−1.90</text>

    <circle class="node kept" cx="120" cy="265" r="27"/><text class="node-text" x="120" y="269">A1</text><text class="score" x="120" y="300">−1.49</text>
    <circle class="node pruned" cx="275" cy="265" r="27"/><text class="node-text" x="275" y="269">A2</text><text class="score" x="275" y="300">−1.74</text>
    <circle class="node best" cx="465" cy="265" r="27"/><text class="node-text" x="465" y="269">B1</text><text class="score" x="465" y="300">−1.21</text>
    <circle class="node pruned" cx="605" cy="265" r="27"/><text class="node-text" x="605" y="269">B2</text><text class="score" x="605" y="300">−3.35</text>

    <circle class="node pruned" cx="155" cy="385" r="29"/><text class="node-text" x="155" y="389">A1a</text><text class="score" x="155" y="423">−2.41</text>
    <circle class="node kept" cx="270" cy="385" r="29"/><text class="node-text" x="270" y="389">A1b</text><text class="score" x="270" y="423">−2.00</text>
    <circle class="node best" cx="485" cy="385" r="29"/><text class="node-text" x="485" y="389">B1a</text><text class="score" x="485" y="423">−1.32</text>
    <circle class="node pruned" cx="605" cy="385" r="29"/><text class="node-text" x="605" y="389">B1b</text><text class="score" x="605" y="423">−4.21</text>
  </g>

  <line x1="24" y1="447" x2="736" y2="447" stroke="#d7e0e8"/>
  <line x1="34" y1="465" x2="74" y2="465" class="greedy-edge"/>
  <text class="step" x="83" y="469">greedy：A → A1 → A1b（−2.00）</text>
  <line x1="370" y1="465" x2="410" y2="465" class="beam-edge"/>
  <text class="step" x="419" y="469">beam 最佳：B → B1 → B1a（−1.32）</text>
</svg>
