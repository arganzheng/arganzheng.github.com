<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">M = 300, N = 200, K = 20 的边界补齐</title>
  <desc id="d">A 从 300×20 补到 384×24，B 从 20×200 补到 24×256，C 从 300×200 补到 384×256。A、B 越界部分由 predicated load 读成 0；C 的越界部分只由补的 0 参与算出，epilogue 跳过写回。图中 K 方向放大了 10 倍。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111;font-size:13px}
.b{font-weight:700}.s{font-size:12px;fill:#333}.m{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
.ms{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:11px}.g{fill:#777}
.bx{stroke:#40566f;stroke-width:1.2}.ln{stroke:#40566f;stroke-width:1.2;fill:none}.gd{stroke:#9aa5b1;stroke-width:1;stroke-dasharray:4 3;fill:none}
.hot{stroke:#c0392b;stroke-width:2.2}</style><marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker></defs>
  <rect x="0" y="0" width="760" height="360" fill="#fff"/>
  <text class="m" x="140.0" y="30.0" text-anchor="middle">A: 300×20 → 384×24</text>
  <rect class="bx" x="80.0" y="80.0" width="120.0" height="192.0" fill="#fde4c8"/>
  <rect class="bx" x="80.0" y="80.0" width="100.0" height="150.0" fill="#dbe8fb"/>
  <text class="s" x="130.0" y="160.0" text-anchor="middle">有效 A</text>
  <text class="m" x="190.0" y="160.0" text-anchor="middle">0</text>
  <text class="m" x="130.0" y="255.0" text-anchor="middle">0</text>
  <text class="ms" x="80.0" y="72.0" text-anchor="middle">0</text>
  <line class="ln" x1="80.0" y1="76.0" x2="80.0" y2="80.0"/>
  <text class="ms" x="180.0" y="72.0" text-anchor="middle">20</text>
  <line class="ln" x1="180.0" y1="76.0" x2="180.0" y2="80.0"/>
  <text class="ms" x="200.0" y="72.0" text-anchor="middle">24</text>
  <line class="ln" x1="200.0" y1="76.0" x2="200.0" y2="80.0"/>
  <text class="ms" x="72.0" y="84.0" text-anchor="end">0</text>
  <line class="ln" x1="76.0" y1="80.0" x2="80.0" y2="80.0"/>
  <text class="ms" x="72.0" y="234.0" text-anchor="end">300</text>
  <line class="ln" x1="76.0" y1="230.0" x2="80.0" y2="230.0"/>
  <text class="ms" x="72.0" y="276.0" text-anchor="end">384</text>
  <line class="ln" x1="76.0" y1="272.0" x2="80.0" y2="272.0"/>
  <text class="ms" x="222.0" y="72.0">k →</text>
  <text class="ms" x="72.0" y="290.0" text-anchor="end">m ↓</text>
  <text class="m" x="364.0" y="30.0" text-anchor="middle">B: 20×200 → 24×256</text>
  <rect class="bx" x="300.0" y="80.0" width="128.0" height="120.0" fill="#fde4c8"/>
  <rect class="bx" x="300.0" y="80.0" width="100.0" height="100.0" fill="#dbe8fb"/>
  <text class="s" x="350.0" y="135.0" text-anchor="middle">有效 B</text>
  <text class="m" x="414.0" y="130.0" text-anchor="middle">0</text>
  <text class="m" x="350.0" y="194.0" text-anchor="middle">0</text>
  <text class="ms" x="300.0" y="72.0" text-anchor="middle">0</text>
  <line class="ln" x1="300.0" y1="76.0" x2="300.0" y2="80.0"/>
  <text class="ms" x="400.0" y="72.0" text-anchor="middle">200</text>
  <line class="ln" x1="400.0" y1="76.0" x2="400.0" y2="80.0"/>
  <text class="ms" x="428.0" y="72.0" text-anchor="middle">256</text>
  <line class="ln" x1="428.0" y1="76.0" x2="428.0" y2="80.0"/>
  <text class="ms" x="292.0" y="84.0" text-anchor="end">0</text>
  <line class="ln" x1="296.0" y1="80.0" x2="300.0" y2="80.0"/>
  <text class="ms" x="292.0" y="184.0" text-anchor="end">20</text>
  <line class="ln" x1="296.0" y1="180.0" x2="300.0" y2="180.0"/>
  <text class="ms" x="292.0" y="204.0" text-anchor="end">24</text>
  <line class="ln" x1="296.0" y1="200.0" x2="300.0" y2="200.0"/>
  <text class="ms" x="450.0" y="72.0">n →</text>
  <text class="ms" x="292.0" y="218.0" text-anchor="end">k ↓</text>
  <text class="m" x="624.0" y="30.0" text-anchor="middle">C: 300×200 → 384×256</text>
  <rect class="bx" x="560.0" y="80.0" width="128.0" height="192.0" fill="#f1f3f6"/>
  <rect class="bx" x="560.0" y="80.0" width="100.0" height="150.0" fill="#dbe8fb"/>
  <text class="s" x="610.0" y="160.0" text-anchor="middle">有效 C（写回）</text>
  <text class="m" x="674.0" y="160.0" text-anchor="middle">x</text>
  <text class="m" x="610.0" y="255.0" text-anchor="middle">x</text>
  <text class="ms" x="560.0" y="72.0" text-anchor="middle">0</text>
  <line class="ln" x1="560.0" y1="76.0" x2="560.0" y2="80.0"/>
  <text class="ms" x="660.0" y="72.0" text-anchor="middle">200</text>
  <line class="ln" x1="660.0" y1="76.0" x2="660.0" y2="80.0"/>
  <text class="ms" x="688.0" y="72.0" text-anchor="middle">256</text>
  <line class="ln" x1="688.0" y1="76.0" x2="688.0" y2="80.0"/>
  <text class="ms" x="552.0" y="84.0" text-anchor="end">0</text>
  <line class="ln" x1="556.0" y1="80.0" x2="560.0" y2="80.0"/>
  <text class="ms" x="552.0" y="234.0" text-anchor="end">300</text>
  <line class="ln" x1="556.0" y1="230.0" x2="560.0" y2="230.0"/>
  <text class="ms" x="552.0" y="276.0" text-anchor="end">384</text>
  <line class="ln" x1="556.0" y1="272.0" x2="560.0" y2="272.0"/>
  <text class="ms" x="710.0" y="72.0">n →</text>
  <text class="ms" x="552.0" y="290.0" text-anchor="end">m ↓</text>
  <rect class="bx" x="80.0" y="312.0" width="14.0" height="14.0" fill="#fde4c8"/>
  <text class="s" x="100.0" y="324.0">0：predicated load 读成 0（越界的 A、B 元素，0 × b = 0，不污染累加）</text>
  <rect class="bx" x="80.0" y="336.0" width="14.0" height="14.0" fill="#f1f3f6"/>
  <text class="s" x="100.0" y="348.0">x：只由补的 0 参与算出、没人要的 C 元素，epilogue 用谓词跳过写回</text>
</svg>
