<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="title desc">
  <title id="title">节点内与节点间的两类路径：8 卡服务器与邻居</title>
  <desc id="desc">节点 A：GPU0、GPU1 … GPU7 都经 NVLink 接到 NVSwitch；GPU0 与 GPU1 经 PCIe 挂在 PCIe sw0 下，GPU7 挂在 PCIe sw3 下；sw0 下还有 NIC0 与 CPU0，sw3 下有 CPU1 与 NIC7；CPU0 与 CPU1 之间是 UPI，各自接 DRAM0、DRAM1。节点 B：GPU0' … GPU7' 经 PCIe sw 接 NIC0' 与 CPU。NIC0、NIC7、NIC0' 都接到 IB / RoCE 交换网。</desc>
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2d3d; font-size: 13px; font-weight: 500; }
.b { font-size: 14px; font-weight: 700; }
.s { font-size: 12px; }
.m { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
.frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.3; }
.gpu { fill: #dbe9f6; stroke: #3b6ea5; stroke-width: 1.2; }
.nic { fill: #e3f2e1; stroke: #4a8a3a; stroke-width: 1.2; }
.cpu { fill: #fdf1d6; stroke: #b8860b; stroke-width: 1.2; }
.sw { fill: #f1f1f1; stroke: #777; stroke-width: 1.2; }
.mem { fill: #efe6f6; stroke: #8e5ea2; stroke-width: 1.2; }
.net { fill: #fbe9e7; stroke: #c0392b; stroke-width: 1.2; }
.nvl { stroke: #3b6ea5; stroke-width: 3.5; fill: none; }
.pcie { stroke: #555; stroke-width: 1.6; fill: none; }
.upi { stroke: #b8860b; stroke-width: 2; fill: none; }
.wire { stroke: #c0392b; stroke-width: 1.6; fill: none; }
.port { fill: #555; }
  </style>
  <rect width="760" height="392" fill="#ffffff"/>
  <rect x="12" y="12" width="508" height="310" class="frame"/>
  <text x="24" y="34" text-anchor="start" class="b">节点 A</text>
  <rect x="540" y="12" width="208" height="310" class="frame"/>
  <text x="552" y="34" text-anchor="start" class="b">节点 B</text>
  <rect x="40" y="46" width="460" height="30" class="sw"/>
  <text x="270.0" y="65.5" text-anchor="middle">NVSwitch</text>
  <line x1="76" y1="76" x2="76" y2="100" class="nvl"/>
  <rect x="40" y="100" width="72" height="30" class="gpu"/>
  <text x="76.0" y="119.5" text-anchor="middle">GPU0</text>
  <line x1="166" y1="76" x2="166" y2="100" class="nvl"/>
  <rect x="130" y="100" width="72" height="30" class="gpu"/>
  <text x="166.0" y="119.5" text-anchor="middle">GPU1</text>
  <line x1="464" y1="76" x2="464" y2="100" class="nvl"/>
  <rect x="428" y="100" width="72" height="30" class="gpu"/>
  <text x="464.0" y="119.5" text-anchor="middle">GPU7</text>
  <text x="314" y="120" text-anchor="middle" class="b">…</text>
  <text x="84" y="93" text-anchor="start" class="s">NVLink</text>
  <rect x="40" y="160" width="162" height="30" class="sw"/>
  <text x="121.0" y="179.5" text-anchor="middle">PCIe sw0</text>
  <rect x="340" y="160" width="160" height="30" class="sw"/>
  <text x="420.0" y="179.5" text-anchor="middle">PCIe sw3</text>
  <line x1="76" y1="130" x2="76" y2="160" class="pcie"/>
  <line x1="166" y1="130" x2="166" y2="160" class="pcie"/>
  <line x1="464" y1="130" x2="464" y2="160" class="pcie"/>
  <text x="82" y="150" text-anchor="start" class="s">PCIe</text>
  <rect x="40" y="220" width="72" height="30" class="nic"/>
  <text x="76.0" y="239.5" text-anchor="middle">NIC0</text>
  <rect x="130" y="220" width="72" height="30" class="cpu"/>
  <text x="166.0" y="239.5" text-anchor="middle">CPU0</text>
  <rect x="340" y="220" width="72" height="30" class="cpu"/>
  <text x="376.0" y="239.5" text-anchor="middle">CPU1</text>
  <rect x="428" y="220" width="72" height="30" class="nic"/>
  <text x="464.0" y="239.5" text-anchor="middle">NIC7</text>
  <line x1="76" y1="190" x2="76" y2="220" class="pcie"/>
  <line x1="166" y1="190" x2="166" y2="220" class="pcie"/>
  <line x1="376" y1="190" x2="376" y2="220" class="pcie"/>
  <line x1="464" y1="190" x2="464" y2="220" class="pcie"/>
  <line x1="202" y1="235" x2="340" y2="235" class="upi"/>
  <text x="271" y="228" text-anchor="middle">UPI</text>
  <rect x="130" y="280" width="72" height="26" class="mem"/>
  <text x="166.0" y="297.5" text-anchor="middle">DRAM0</text>
  <rect x="340" y="280" width="72" height="26" class="mem"/>
  <text x="376.0" y="297.5" text-anchor="middle">DRAM1</text>
  <line x1="166" y1="250" x2="166" y2="280" class="pcie"/>
  <line x1="376" y1="250" x2="376" y2="280" class="pcie"/>
  <rect x="560" y="100" width="168" height="30" class="gpu"/>
  <text x="644.0" y="119.5" text-anchor="middle">GPU0' … GPU7'</text>
  <rect x="560" y="160" width="168" height="30" class="sw"/>
  <text x="644.0" y="179.5" text-anchor="middle">PCIe sw</text>
  <line x1="644" y1="130" x2="644" y2="160" class="pcie"/>
  <line x1="596" y1="190" x2="596" y2="220" class="pcie"/>
  <line x1="692" y1="190" x2="692" y2="220" class="pcie"/>
  <rect x="560" y="220" width="72" height="30" class="nic"/>
  <text x="596.0" y="239.5" text-anchor="middle">NIC0'</text>
  <rect x="656" y="220" width="72" height="30" class="cpu"/>
  <text x="692.0" y="239.5" text-anchor="middle">CPU</text>
  <line x1="76" y1="250" x2="76" y2="346" class="wire"/>
  <line x1="464" y1="250" x2="464" y2="346" class="wire"/>
  <line x1="596" y1="250" x2="596" y2="346" class="wire"/>
  <rect x="40" y="346" width="680" height="30" class="net"/>
  <text x="380.0" y="365.5" text-anchor="middle">IB / RoCE 交换网</text>
</svg>
