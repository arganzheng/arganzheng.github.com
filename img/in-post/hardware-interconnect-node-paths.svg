<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342" role="img" aria-labelledby="title desc">
  <title id="title">节点内与节点间的两类路径：8 卡服务器与邻居</title>
  <desc id="desc">节点 A：CPU0 与 CPU1 之间是 UPI，各自接 DRAM0、DRAM1。CPU0 经 root port 向下接 PCIe sw0，sw0 下挂 NIC0、GPU0、GPU1；CPU1 经 root port 接 PCIe sw3，sw3 下挂 GPU7、NIC7。GPU0、GPU1 … GPU7 都经 NVLink 接到 NVSwitch。节点 B：CPU 经 PCIe sw 接 NIC0' 与 GPU0' … GPU7'。NIC0、NIC7、NIC0' 都接到 IB / RoCE 交换网。</desc>
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2d3d; font-size: 13px; font-weight: 500; }
.b { font-size: 14px; font-weight: 700; }
.s { font-size: 12px; }
.m { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
.frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.3; }
.gpu { fill: #dbe9f6; stroke: #3b6ea5; stroke-width: 1.2; }
.nic { fill: #e3f2e1; stroke: #4a8a3a; stroke-width: 1.2; }
.cpu { fill: #fdf1d6; stroke: #b8860b; stroke-width: 1.2; }
.sw { fill: #f1f1f1; stroke: #777; stroke-width: 1.2; }
.mem { fill: #efe6f6; stroke: #8e5ea2; stroke-width: 1.2; }
.net { fill: #fbe9e7; stroke: #c0392b; stroke-width: 1.2; }
.nvl { stroke: #3b6ea5; stroke-width: 3.5; fill: none; }
.pcie { stroke: #555; stroke-width: 1.6; fill: none; }
.upi { stroke: #b8860b; stroke-width: 2; fill: none; }
.wire { stroke: #c0392b; stroke-width: 1.6; fill: none; }
.port { fill: #555; }
  </style>
  <rect width="760" height="342" fill="#ffffff"/>
  <rect x="12" y="12" width="500" height="260" class="frame"/>
  <text x="24" y="34" text-anchor="start" class="b">节点 A</text>
  <rect x="528" y="12" width="220" height="260" class="frame"/>
  <text x="540" y="34" text-anchor="start" class="b">节点 B</text>
  <rect x="40" y="46" width="72" height="30" class="mem"/>
  <text x="76.0" y="65.5" text-anchor="middle">DRAM0</text>
  <rect x="130" y="46" width="72" height="30" class="cpu"/>
  <text x="166.0" y="65.5" text-anchor="middle">CPU0</text>
  <rect x="340" y="46" width="72" height="30" class="cpu"/>
  <text x="376.0" y="65.5" text-anchor="middle">CPU1</text>
  <rect x="428" y="46" width="72" height="30" class="mem"/>
  <text x="464.0" y="65.5" text-anchor="middle">DRAM1</text>
  <line x1="112" y1="61" x2="130" y2="61" class="pcie"/>
  <line x1="412" y1="61" x2="428" y2="61" class="pcie"/>
  <line x1="202" y1="61" x2="340" y2="61" class="upi"/>
  <text x="271" y="54" text-anchor="middle">UPI</text>
  <line x1="166" y1="76" x2="166" y2="106" class="pcie"/>
  <line x1="376" y1="76" x2="376" y2="106" class="pcie"/>
  <text x="172" y="96" text-anchor="start" class="s">PCIe（root port）</text>
  <rect x="40" y="106" width="252" height="30" class="sw"/>
  <text x="166.0" y="125.5" text-anchor="middle">PCIe sw0</text>
  <rect x="340" y="106" width="160" height="30" class="sw"/>
  <text x="420.0" y="125.5" text-anchor="middle">PCIe sw3</text>
  <line x1="76" y1="136" x2="76" y2="166" class="pcie"/>
  <line x1="166" y1="136" x2="166" y2="166" class="pcie"/>
  <line x1="256" y1="136" x2="256" y2="166" class="pcie"/>
  <line x1="376" y1="136" x2="376" y2="166" class="pcie"/>
  <line x1="464" y1="136" x2="464" y2="166" class="pcie"/>
  <rect x="40" y="166" width="72" height="30" class="nic"/>
  <text x="76.0" y="185.5" text-anchor="middle">NIC0</text>
  <rect x="130" y="166" width="72" height="30" class="gpu"/>
  <text x="166.0" y="185.5" text-anchor="middle">GPU0</text>
  <rect x="220" y="166" width="72" height="30" class="gpu"/>
  <text x="256.0" y="185.5" text-anchor="middle">GPU1</text>
  <text x="316" y="186" text-anchor="middle" class="b">…</text>
  <rect x="340" y="166" width="72" height="30" class="gpu"/>
  <text x="376.0" y="185.5" text-anchor="middle">GPU7</text>
  <rect x="428" y="166" width="72" height="30" class="nic"/>
  <text x="464.0" y="185.5" text-anchor="middle">NIC7</text>
  <line x1="166" y1="196" x2="166" y2="226" class="nvl"/>
  <line x1="256" y1="196" x2="256" y2="226" class="nvl"/>
  <line x1="376" y1="196" x2="376" y2="226" class="nvl"/>
  <text x="174" y="215" text-anchor="start" class="s">NVLink</text>
  <rect x="130" y="226" width="282" height="30" class="sw"/>
  <text x="271.0" y="245.5" text-anchor="middle">NVSwitch</text>
  <rect x="544" y="46" width="72" height="30" class="cpu"/>
  <text x="580.0" y="65.5" text-anchor="middle">CPU</text>
  <line x1="580" y1="76" x2="580" y2="106" class="pcie"/>
  <rect x="544" y="106" width="188" height="30" class="sw"/>
  <text x="638.0" y="125.5" text-anchor="middle">PCIe sw</text>
  <line x1="580" y1="136" x2="580" y2="166" class="pcie"/>
  <line x1="680" y1="136" x2="680" y2="166" class="pcie"/>
  <rect x="544" y="166" width="72" height="30" class="nic"/>
  <text x="580.0" y="185.5" text-anchor="middle">NIC0'</text>
  <rect x="628" y="166" width="104" height="30" class="gpu"/>
  <text x="680.0" y="185.5" text-anchor="middle" class="s">GPU0' … GPU7'</text>
  <line x1="76" y1="196" x2="76" y2="296" class="wire"/>
  <line x1="464" y1="196" x2="464" y2="296" class="wire"/>
  <line x1="580" y1="196" x2="580" y2="296" class="wire"/>
  <rect x="40" y="296" width="680" height="30" class="net"/>
  <text x="380.0" y="315.5" text-anchor="middle">IB / RoCE 交换网</text>
</svg>
