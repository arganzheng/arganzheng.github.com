<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="t d">
  <title id="t">DP 与 TP 的请求路径对照</title>
  <desc id="d">左边是 DP：三个请求分别进三张卡，每张卡都放完整模型。右边是 TP：一个请求同时分到三张卡，每张卡只放 1/N 的模型，算完再汇合。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c3cf"/></marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7a8b9c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .math { font-size: 14px; }
      .mute { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .req { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .comm { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-o { fill: #fde9cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #f9d5cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-light { stroke: #b7c3cf; stroke-width: 1.2; fill: none; marker-end: url(#arrow-light); }
      .arrow-hi { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#arrow-hi); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .dbl { stroke: #5880b4; stroke-width: 4; fill: none; }
      .dbl-in { stroke: #fff; stroke-width: 1.4; fill: none; }
      .dash { stroke: #7a8b9c; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow-axis); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
<text x="30" y="32" text-anchor="start" class="head">DP：每张卡一份完整模型，各算各的请求</text>
<rect class="req" x="30" y="52" width="110" height="34"/>
<text x="85.0" y="74.0" text-anchor="middle" class="body">Request A</text>
<line x1="140" y1="69" x2="200" y2="69" class="arrow"/>
<rect class="gpu" x="200" y="52" width="140" height="34"/>
<text x="270.0" y="74.0" text-anchor="middle" class="body">GPU 0 · 完整模型</text>
<rect class="req" x="30" y="104" width="110" height="34"/>
<text x="85.0" y="126.0" text-anchor="middle" class="body">Request B</text>
<line x1="140" y1="121" x2="200" y2="121" class="arrow"/>
<rect class="gpu" x="200" y="104" width="140" height="34"/>
<text x="270.0" y="126.0" text-anchor="middle" class="body">GPU 1 · 完整模型</text>
<rect class="req" x="30" y="156" width="110" height="34"/>
<text x="85.0" y="178.0" text-anchor="middle" class="body">Request C</text>
<line x1="140" y1="173" x2="200" y2="173" class="arrow"/>
<rect class="gpu" x="200" y="156" width="140" height="34"/>
<text x="270.0" y="178.0" text-anchor="middle" class="body">GPU 2 · 完整模型</text>
<line x1="375" y1="20" x2="375" y2="228" class="dash"/>
<text x="410" y="32" text-anchor="start" class="head">TP：一个请求拆到三张卡，共同完成</text>
<rect class="req" x="510" y="52" width="130" height="34"/>
<text x="575.0" y="74.0" text-anchor="middle" class="body">一个 Request</text>
<path d="M575,86 V98 H460 V112" class="arrow"/>
<path d="M575,86 V98 H575 V112" class="arrow"/>
<path d="M575,86 V98 H690 V112" class="arrow"/>
<rect class="gpu" x="410" y="112" width="100" height="46"/>
<text x="460.0" y="131.0" text-anchor="middle" class="body">GPU 0</text>
<text x="460.0" y="149.0" text-anchor="middle" class="small">1/N 模型</text>
<rect class="gpu" x="525" y="112" width="100" height="46"/>
<text x="575.0" y="131.0" text-anchor="middle" class="body">GPU 1</text>
<text x="575.0" y="149.0" text-anchor="middle" class="small">1/N 模型</text>
<rect class="gpu" x="640" y="112" width="100" height="46"/>
<text x="690.0" y="131.0" text-anchor="middle" class="body">GPU 2</text>
<text x="690.0" y="149.0" text-anchor="middle" class="small">1/N 模型</text>
<path d="M460,158 V172 H575" class="line"/>
<path d="M575,158 V172 H575" class="line"/>
<path d="M690,158 V172 H575" class="line"/>
<line x1="575" y1="172" x2="575" y2="186" class="arrow"/>
<rect class="card" x="510" y="186" width="130" height="34"/>
<text x="575.0" y="208.0" text-anchor="middle" class="body">共同完成计算</text>
</svg>
