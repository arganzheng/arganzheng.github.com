<title id="dt-t">double binary tree：两棵互补的树各处理一半数据</title>
<desc id="dt-d">n = 8。树 A 为 ncclGetBtree：r0→r4→{r2,r6}，r2→{r1,r3}，r6→{r5,r7}。树 B 为镜像（rank r 换成 7−r）：r7→r3→{r1,r5}，r1→{r0,r2}，r5→{r4,r6}。偶数 rank 在 A 里是内部节点、在 B 里是叶子，奇数 rank 反之。</desc>
