<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338" role="img" aria-labelledby="t d">
  <title id="t">一线程一元素与 grid-stride 的元素分配</title>
  <desc id="d">n = 12 个元素，每个 block 4 个线程。一线程一元素：grid = 3 个 block，共 12 个线程，T0…T11 各处理 e0…e11 中的一个。grid-stride：grid 固定 1 个 block，只有 T0…T3 四个线程，第 1 轮处理 e0–e3，第 2 轮 e4–e7，第 3 轮 e8–e11；每个线程一轮跳 4 个元素，步长 = 4 = 全 grid 线程数，每一轮内相邻线程仍访问相邻地址。</desc>
