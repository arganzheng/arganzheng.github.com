  <text x="504.0" y="266.0" class="n">→ kernel 无法区分，也不需要区分</text>
  <text x="20.0" y="306.0" class="m">transposed</text>
  <rect x="130.0" y="288.0" width="22.0" height="26.0" class="r0" />
