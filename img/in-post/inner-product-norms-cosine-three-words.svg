<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">内积、范数、余弦：三个词，一张图</text><line x1="90" y1="205" x2="340" y2="205" stroke="#ddd" stroke-width="1"/><line x1="110" y1="225" x2="110" y2="45" stroke="#ddd" stroke-width="1"/><line x1="110" y1="205" x2="310" y2="205" stroke="#1f6fb2" stroke-width="3" marker-end="url(#ar)"/><text x="315" y="210" fill="#1f6fb2" font-size="15" text-anchor="start" font-weight="600">a</text><line x1="110" y1="205" x2="230" y2="85" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/><text x="236" y="81" fill="#c0392b" font-size="15" text-anchor="start" font-weight="600">b</text><path d="M 150 205 A 40 40 0 0 0 138 177" fill="none" stroke="#333" stroke-width="1.2"/><text x="156" y="191" fill="#333" font-size="13" text-anchor="start" font-weight="normal">θ</text><line x1="230" y1="85" x2="230" y2="205" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="222" y="197" width="8" height="8" fill="none" stroke="#888" stroke-width="1"/><line x1="110" y1="219" x2="230" y2="219" stroke="#4d9a5c" stroke-width="2"/><line x1="110" y1="215" x2="110" y2="223" stroke="#4d9a5c" stroke-width="2"/><line x1="230" y1="215" x2="230" y2="223" stroke="#4d9a5c" stroke-width="2"/><text x="170" y="237" fill="#4d9a5c" font-size="11" text-anchor="middle" font-weight="normal">‖b‖·cos θ：b 在 a 方向上的投影</text><text x="144" y="127" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="normal">‖b‖ = b 的长度</text><text x="278" y="195" fill="#1f6fb2" font-size="11" text-anchor="middle" font-weight="normal">‖a‖ = a 的长度</text><text x="210" y="263" fill="#333" font-size="13" text-anchor="middle" font-weight="600">⟨a, b⟩ = ‖a‖ · ‖b‖ · cos θ</text><text x="210" y="281" fill="#666" font-size="11" text-anchor="middle" font-weight="normal">= a 的长度 × b 的长度 × 夹角余弦</text><rect x="400" y="60" width="330" height="82" fill="#fafbfd" stroke="#d5dce6" stroke-width="1" rx="6"/><rect x="400" y="60" width="54" height="82" fill="#8a6bd1" stroke="#8a6bd1" stroke-width="1" rx="6"/><text x="427" y="106" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">内积</text><text x="466" y="80" fill="#333" font-size="13" text-anchor="start" font-weight="600">⟨a, b⟩ = Σ aᵢ bᵢ</text><text x="466" y="100" fill="#333" font-size="11" text-anchor="start" font-weight="normal">"对应位置相乘再相加"　→　方向 + 大小都算</text><text x="466" y="120" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">例：a=(1,2,3), b=(4,−1,2)：1·4 + 2·(−1) + 3·2 = 8</text><rect x="400" y="155" width="330" height="82" fill="#fafbfd" stroke="#d5dce6" stroke-width="1" rx="6"/><rect x="400" y="155" width="54" height="82" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="1" rx="6"/><text x="427" y="201" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">范数</text><text x="466" y="175" fill="#333" font-size="13" text-anchor="start" font-weight="600">‖a‖ = √⟨a, a⟩ = √(Σ aᵢ²)</text><text x="466" y="195" fill="#333" font-size="11" text-anchor="start" font-weight="normal">"向量自己的长度"　→　只有大小</text><text x="466" y="215" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">例：a=(1,2,3)：√(1+4+9) = √14 ≈ 3.74</text><rect x="400" y="250" width="330" height="82" fill="#fafbfd" stroke="#d5dce6" stroke-width="1" rx="6"/><rect x="400" y="250" width="54" height="82" fill="#4d9a5c" stroke="#4d9a5c" stroke-width="1" rx="6"/><text x="427" y="296" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">余弦</text><text x="466" y="270" fill="#333" font-size="13" text-anchor="start" font-weight="600">cos θ = ⟨a, b⟩ / (‖a‖ ‖b‖)</text><text x="466" y="290" fill="#333" font-size="11" text-anchor="start" font-weight="normal">"内积除掉两个长度"　→　只有方向，取值 −1…1</text><text x="466" y="310" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">例：8 / (3.74 × 4.58) ≈ 0.47，夹角约 62°</text><text x="380" y="356" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">把 b 拉长两倍：内积翻倍、‖b‖ 翻倍、余弦不变——所以"只想比方向"时用余弦，"长度也算信息"时用内积。</text>
</svg>
