<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">F1：8 张 GPU 上的 TP、DP、PP 进程组与每卡持有的模型分片</title>
  <desc id="d">8 卡 TP2 × PP2 × DP2。上排 rank 0–3 是 pp0（layers 0–7 + embedding），下排 rank 4–7 是 pp1（layers 8–15 + 输出层）；左两列是 DP 副本 0，右两列是 DP 副本 1。相邻两卡是 TP 组（矩阵左半 / 右半），上下两卡是 PP 组，色条相同的两卡持有同一分片、是 DP 组。每卡持有本卡一半的 bf16 参数、该分片完整的 fp32 梯度、一半的 fp32 主参数与 Adam 矩（分布式优化器）。</desc>
  <style>.tt{fill:#222;font-size:15px}.b{fill:#222;font-weight:700;font-size:15px}.d{fill:#222}.m{fill:#444;font-size:12px}.h{fill:#555;font-size:13px}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
