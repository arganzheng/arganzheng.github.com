<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">标量计算图：前向算值，反向逐边乘局部导数</title>
  <desc id="d">z = w x + b，e = z − y，L = e²，代入 x=2、w=3、b=−1、y=4。前向得到 z=5、e=1、L=1。反向从 ∂L/∂L=1 开始：经过 L=e² 乘局部导数 2e=2 得 ∂L/∂e=2；经过 e=z−y，乘 ∂e/∂z=1 得 ∂L/∂z=2，乘 ∂e/∂y=−1 得 ∂L/∂y=−2；经过 z=wx+b，乘 ∂z/∂w=x=2 得 ∂L/∂w=4，乘 ∂z/∂x=w=3 得 ∂L/∂x=6，乘 ∂z/∂b=1 得 ∂L/∂b=2。</desc>
  <defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
  <style>.t{fill:#222;font-weight:700;font-size:15px}.f{fill:#222;font-weight:700;font-size:14px}.v{fill:#15803d;font-size:13px}.g{fill:#ea580c;font-size:13px;font-weight:600}.s{fill:#555;font-size:12px}.o{fill:#ea580c;font-size:12.5px;font-weight:600}</style>
  <text x="20" y="26" class="t">标量计算图：前向算值，反向每过一条边乘一次局部导数</text>
  <line x1="20" y1="48" x2="50" y2="48" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/><text x="58" y="52" class="s">前向</text>
  <line x1="100" y1="48" x2="130" y2="48" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/><text x="138" y="52" class="s">反向，边上写「上游梯度 × 局部导数 = 传回的梯度」</text>
  <text x="470" y="52" class="s">节点里：<tspan fill="#15803d">绿 = 前向值</tspan>，<tspan fill="#ea580c">橙 = 损失对它的梯度</tspan></text>
  <line x1="160.2" y1="126.6" x2="324.2" y2="192.2" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="319.8" y1="203.4" x2="155.8" y2="137.8" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="158.0" y1="219.0" x2="322.0" y2="219.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="322.0" y1="231.0" x2="158.0" y2="231.0" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="155.8" y1="312.2" x2="319.8" y2="246.6" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="324.2" y1="257.8" x2="160.2" y2="323.4" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="458.0" y1="219.0" x2="552.0" y2="219.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="552.0" y1="231.0" x2="458.0" y2="231.0" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="614.0" y1="306.0" x2="614.0" y2="264.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="626.0" y1="264.0" x2="626.0" y2="306.0" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="688.0" y1="219.0" x2="737.0" y2="219.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="737.0" y1="231.0" x2="688.0" y2="231.0" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <rect x="26.0" y="70.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="94" text-anchor="middle" class="f">w</text>
  <text x="90" y="113" text-anchor="middle" class="v">= 3</text>
  <text x="90" y="131" text-anchor="middle" class="g">∂L/∂w = 4</text>
  <rect x="26.0" y="190.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="214" text-anchor="middle" class="f">x</text>
  <text x="90" y="233" text-anchor="middle" class="v">= 2</text>
  <text x="90" y="251" text-anchor="middle" class="g">∂L/∂x = 6</text>
  <rect x="26.0" y="310.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="334" text-anchor="middle" class="f">b</text>
  <text x="90" y="353" text-anchor="middle" class="v">= −1</text>
  <text x="90" y="371" text-anchor="middle" class="g">∂L/∂b = 2</text>
  <rect x="326.0" y="190.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="390" y="214" text-anchor="middle" class="f">z = wx + b</text>
  <text x="390" y="233" text-anchor="middle" class="v">= 5</text>
  <text x="390" y="251" text-anchor="middle" class="g">∂L/∂z = 2</text>
  <rect x="556.0" y="190.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="620" y="214" text-anchor="middle" class="f">e = z − y</text>
  <text x="620" y="233" text-anchor="middle" class="v">= 1</text>
  <text x="620" y="251" text-anchor="middle" class="g">∂L/∂e = 2</text>
  <rect x="556.0" y="310.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="620" y="334" text-anchor="middle" class="f">y</text>
  <text x="620" y="353" text-anchor="middle" class="v">= 4</text>
  <text x="620" y="371" text-anchor="middle" class="g">∂L/∂y = −2</text>
  <rect x="741.0" y="190.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="805" y="214" text-anchor="middle" class="f">L = e²</text>
  <text x="805" y="233" text-anchor="middle" class="v">= 1</text>
  <text x="805" y="251" text-anchor="middle" class="g">∂L/∂L = 1</text>
  <text x="265" y="128" text-anchor="middle" class="s">∂z/∂w = x = 2</text>
  <text x="265" y="144" text-anchor="middle" class="o">2 × 2 = 4</text>
  <text x="222" y="194" text-anchor="middle" class="s">∂z/∂x = w = 3</text>
  <text x="222" y="210" text-anchor="middle" class="o">2 × 3 = 6</text>
  <text x="268" y="318" text-anchor="middle" class="s">∂z/∂b = 1</text>
  <text x="268" y="334" text-anchor="middle" class="o">2 × 1 = 2</text>
  <text x="505" y="194" text-anchor="middle" class="s">∂e/∂z = 1</text>
  <text x="505" y="210" text-anchor="middle" class="o">2 × 1 = 2</text>
  <text x="640" y="282" text-anchor="start" class="s">∂e/∂y = −1</text>
  <text x="640" y="298" text-anchor="start" class="o">2 × (−1) = −2</text>
  <text x="712" y="168" text-anchor="middle" class="s">∂L/∂e = 2e = 2</text>
  <text x="712" y="184" text-anchor="middle" class="o">1 × 2 = 2</text>
  <text x="20" y="406" class="s">每个节点只需要两样东西：从右边传来的上游梯度，和自己这条边的局部导数。一路乘回去，就得到 L 对每个输入、每个参数的梯度。</text>
</svg>
