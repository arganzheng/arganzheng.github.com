<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="740" height="330" fill="#ffffff"/>
  <!-- x axis: log2 value, b in [-150, 130], x(b) = 60 + (b + 150) * 2.25  (plot 60..690) -->
  <!-- gradient band 2^-40 .. 2^0 -->
  <rect x="307.5" y="34" width="90" height="212" fill="#fdebd0" stroke="none"/>
  <text x="352.5" y="28" fill="#b9770e" font-size="11" text-anchor="middle">激活梯度典型分布 2^-40 … 2^0</text>
  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="109.5" y1="34" x2="109.5" y2="246"/>
    <line x1="181.5" y1="34" x2="181.5" y2="246"/>
    <line x1="253.5" y1="34" x2="253.5" y2="246"/>
    <line x1="325.5" y1="34" x2="325.5" y2="246"/>
    <line x1="469.5" y1="34" x2="469.5" y2="246"/>
    <line x1="541.5" y1="34" x2="541.5" y2="246"/>
    <line x1="613.5" y1="34" x2="613.5" y2="246"/>
    <line x1="685.5" y1="34" x2="685.5" y2="246"/>
  </g>
  <!-- x = 1 marker -->
  <line x1="397.5" y1="34" x2="397.5" y2="246" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- bars: light = subnormal, dark = normal -->
  <!-- FP32: subnormal 2^-149..2^-126, normal 2^-126..2^128 -->
  <rect x="62.25" y="44" width="51.75" height="18" fill="#d6eaf8" stroke="#2e6da4" stroke-width="1"/>
  <rect x="114" y="44" width="571.5" height="18" fill="#2e6da4" stroke="#2e6da4" stroke-width="1"/>
  <text x="120" y="57" fill="#ffffff" font-size="12">FP32  1/8/23   [1.4e-45, 3.4e38]</text>

  <!-- BF16: subnormal 2^-133..2^-126, normal 2^-126..2^128 -->
  <rect x="98.25" y="84" width="15.75" height="18" fill="#d6eaf8" stroke="#2e6da4" stroke-width="1"/>
  <rect x="114" y="84" width="571.5" height="18" fill="#2e6da4" stroke="#2e6da4" stroke-width="1"/>
  <text x="120" y="97" fill="#ffffff" font-size="12">BF16  1/8/7    [9.2e-41, 3.4e38]  与 FP32 同范围</text>

  <!-- FP16: subnormal 2^-24..2^-14, normal 2^-14..2^16 -->
  <rect x="343.5" y="124" width="22.5" height="18" fill="#fadbd8" stroke="#c0392b" stroke-width="1"/>
  <rect x="366" y="124" width="67.5" height="18" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <text x="440" y="137" fill="#333" font-size="12">FP16  1/5/10   [6e-8, 65504]</text>

  <!-- E5M2: subnormal 2^-16..2^-14, normal 2^-14..2^15.8 -->
  <rect x="361.5" y="164" width="4.5" height="18" fill="#fadbd8" stroke="#c0392b" stroke-width="1"/>
  <rect x="366" y="164" width="67" height="18" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <text x="440" y="177" fill="#333" font-size="12">E5M2  1/5/2    [1.5e-5, 57344]  与 FP16 同指数</text>

  <!-- E4M3: subnormal 2^-9..2^-6, normal 2^-6..2^8.8 -->
  <rect x="377.25" y="204" width="6.75" height="18" fill="#d5f5e3" stroke="#1e8449" stroke-width="1"/>
  <rect x="384" y="204" width="33.3" height="18" fill="#1e8449" stroke="#1e8449" stroke-width="1"/>
  <text x="424" y="217" fill="#333" font-size="12">E4M3  1/4/3    [2e-3, 448]  只有 18 个二进制数量级</text>

  <!-- legend -->
  <rect x="62" y="232" width="14" height="10" fill="#d6eaf8" stroke="#2e6da4" stroke-width="1"/>
  <text x="80" y="241" fill="#555" font-size="11">次正规数（有效位随数值减小）</text>
  <rect x="250" y="232" width="14" height="10" fill="#2e6da4" stroke="#2e6da4" stroke-width="1"/>
  <text x="268" y="241" fill="#555" font-size="11">正规数（相对精度恒定 = 2^-M）</text>

  <!-- axis -->
  <line x1="60" y1="250" x2="690" y2="250" stroke="#333" stroke-width="1.2"/>
  <g fill="#333" text-anchor="middle" font-size="11">
    <text x="109.5" y="266">2^-128</text>
    <text x="181.5" y="266">2^-96</text>
    <text x="253.5" y="266">2^-64</text>
    <text x="325.5" y="266">2^-32</text>
    <text x="397.5" y="266">2^0 = 1</text>
    <text x="469.5" y="266">2^32</text>
    <text x="541.5" y="266">2^64</text>
    <text x="613.5" y="266">2^96</text>
    <text x="685.5" y="266">2^128</text>
  </g>
  <g fill="#888" text-anchor="middle" font-size="10">
    <text x="109.5" y="281">3e-39</text>
    <text x="181.5" y="281">1e-29</text>
    <text x="253.5" y="281">5e-20</text>
    <text x="325.5" y="281">2e-10</text>
    <text x="397.5" y="281">1</text>
    <text x="469.5" y="281">4e9</text>
    <text x="541.5" y="281">2e19</text>
    <text x="613.5" y="281">8e28</text>
    <text x="685.5" y="281">3e38</text>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="109.5" y1="250" x2="109.5" y2="254"/>
    <line x1="181.5" y1="250" x2="181.5" y2="254"/>
    <line x1="253.5" y1="250" x2="253.5" y2="254"/>
    <line x1="325.5" y1="250" x2="325.5" y2="254"/>
    <line x1="397.5" y1="250" x2="397.5" y2="254"/>
    <line x1="469.5" y1="250" x2="469.5" y2="254"/>
    <line x1="541.5" y1="250" x2="541.5" y2="254"/>
    <line x1="613.5" y1="250" x2="613.5" y2="254"/>
    <line x1="685.5" y1="250" x2="685.5" y2="254"/>
  </g>
  <text x="375" y="306" fill="#333" font-size="13" text-anchor="middle">可表示的正数范围（对数轴，每 32 个二进制数量级一格）</text>
</svg>
