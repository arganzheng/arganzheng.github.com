<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" role="img" aria-labelledby="t d">
<title id="t">B fragment（16×8）各元素所在的 lane 与寄存器</title>
<desc id="d">8 行 × 8 列的网格，行是相邻两个 k，列是 n，一格是同一列 n、相邻两行 k 的 2 个 BF16。列 n 由 quad n 持有，行 k=2t..2t+1 由 lane 4n+t 的 b0 持有，k=2t+8..2t+9 由 b1 持有。</desc>
