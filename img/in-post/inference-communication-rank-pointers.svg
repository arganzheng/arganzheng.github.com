<text x="20.0" y="214.0" font-size="13" font-weight="500" fill="#111" text-anchor="start"><tspan font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace'>buffer_ptrs[i]</tspan><tspan font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'> → rank i 的预注册输入缓冲区（eager 模式先 memcpy 进来）</tspan></text>
