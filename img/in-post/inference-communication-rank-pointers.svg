<svg xmlns="http://www.w3.org/2000/svg" width="700" height="466" viewBox="0 0 700 466" role="img" aria-labelledby="rank-pointers-t rank-pointers-d">
<title id="rank-pointers-t">rank 0 进程里的三组指针（world_size = 4）</title>
<desc id="rank-pointers-d">meta 块由 Signal 与 max_size 字节的 tmp buffer 组成；buffer_ptrs 指向各 rank 的预注册输入缓冲区；rank_data 的槽位 k 存 4 个地址 ptrs[0..3]，ptrs[0] 是本地 load，其余是经 NVLink 的远端 load。</desc>
<style>text{dominant-baseline:auto}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="700" height="466" fill="#fff"/>
<text x="350.0" y="22.0" font-size="14" font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' font-weight="700" fill="#111" text-anchor="middle">rank 0 进程里的三组指针（world_size = 4）</text>
<text x="20.0" y="52.0" font-size="13" font-weight="500" fill="#111" text-anchor="start"><tspan font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace'>meta_ptrs[i]</tspan><tspan font-family='"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'> → rank i 的 meta 块（rank i cudaMalloc，其余 rank IPC 映射）</tspan></text>
<rect x="20.0" y="64.0" width="170.0" height="92.0" fill="#e8f0fe" stroke="#444" stroke-width="1.2" />
<rect x="190.0" y="64.0" width="470.0" height="92.0" fill="#f6f8fa" stroke="#444" stroke-width="1.2" />
<text x="34.0" y="86.0" font-size="13" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="700" fill="#111" text-anchor="start">Signal</text>
<text x="48.0" y="108.0" font-size="12.5" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="500" fill="#111" text-anchor="start">start[36][8]</text>
<text x="48.0" y="127.0" font-size="12.5" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="500" fill="#111" text-anchor="start">end[36][8]</text>
<text x="48.0" y="146.0" font-size="12.5" font-family='"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace' font-weight="500" fill="#111" text-anchor="start">_flag[36]</text>
