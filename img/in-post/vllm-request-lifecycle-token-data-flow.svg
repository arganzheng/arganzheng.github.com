<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1460" viewBox="0 0 760 1460" role="img" aria-labelledby="svg-title desc">
  <title id="svg-title">vLLM 请求在 API Server、EngineCore 与 Worker 之间的 U 形往返</title>
  <desc id="desc">请求从 Client 经 API Server、EngineCore 和 Worker 到 GPU，再沿底部返回 API Server 并以 SSE 响应 Client。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#526477"/>
    </marker>
    <style>
      .title { font: 700 20px sans-serif; fill: #233447; }
      .subtitle { font: 13px sans-serif; fill: #526477; }
      .band-label { font: 700 13px sans-serif; fill: #34495e; }
      .client-col-label { font: 700 13px sans-serif; fill: #34495e; }
      .node { stroke-width: 1.5; }
      .api-node { fill: #fff; stroke: #5880b4; }
      .engine-node { fill: #fff; stroke: #c6873d; }
      .worker-node { fill: #fff; stroke: #4b9477; }
      .client-node { fill: #fff; stroke: #7b8794; }
      .node-title { font: 700 13px sans-serif; fill: #263746; }
      .node-body { font: 12px sans-serif; fill: #526477; }
      .edge { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #263746; }
      .edge-muted { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #34495e; }
      .arrow { fill: none; stroke: #526477; stroke-width: 1.7; marker-end: url(#arrow); }
      .arrow-plain { fill: none; stroke: #526477; stroke-width: 1.7; }
    </style>
  </defs>

  <rect width="760" height="1460" fill="#fff"/>
  <text id="title" x="380" y="31" text-anchor="middle" class="title">一个请求穿过 vLLM Serving 栈的 U 形往返</text>
  <text x="380" y="53" text-anchor="middle" class="subtitle">组件按实际进程归属；箭头旁标出跨组件传递的数据</text>

  <rect x="100" y="74" width="250" height="1344" rx="18" fill="#eef5ff" stroke="#5880b4" stroke-width="1.5"/>
  <rect x="370" y="74" width="130" height="1344" rx="18" fill="#fff6e9" stroke="#c6873d" stroke-width="1.5"/>
  <rect x="630" y="74" width="116" height="1344" rx="18" fill="#eff9f4" stroke="#4b9477" stroke-width="1.5"/>
  <text x="225" y="98" text-anchor="middle" class="band-label">API Server process</text>
  <text x="435" y="98" text-anchor="middle" class="band-label">EngineCoreProc</text>
  <text x="688" y="98" text-anchor="middle" class="band-label">WorkerProc</text>
  <text x="50" y="98" text-anchor="middle" class="client-col-label">Client</text>

  <rect x="12" y="120" width="76" height="56" rx="10" class="node client-node"/>
  <text x="50" y="153" text-anchor="middle" class="node-title">Client</text>
  <rect x="110" y="120" width="105" height="56" rx="10" class="node api-node"/>
  <text x="162.5" y="153" text-anchor="middle" class="node-title">API Server</text>
  <rect x="228" y="112" width="112" height="72" rx="10" class="node api-node"/>
  <text x="284" y="138" text-anchor="middle" class="node-title">AsyncLLM</text>
  <text x="284" y="157" text-anchor="middle" class="node-body">InputProcessor</text>
  <text x="284" y="175" text-anchor="middle" class="node-body">Tokenizer</text>
  <rect x="380" y="120" width="110" height="56" rx="10" class="node engine-node"/>
  <text x="435" y="153" text-anchor="middle" class="node-title">EngineCore</text>

  <path d="M88 148 H110" class="arrow"/>
  <path d="M215 148 H228" class="arrow"/>
  <path d="M340 148 H380" class="arrow"/>
  <text x="110" y="207" class="edge">HTTP JSON</text>
  <text x="110" y="225" class="edge">"Hello, tell me a joke"</text>
  <text x="210" y="253" class="edge">add_request(text)</text>
  <text x="342" y="281" text-anchor="end" class="edge">
    <tspan x="342" dy="0">EngineCoreRequest(</tspan>
    <tspan x="342" dy="17">token_ids [15496, 11,</tspan>
    <tspan x="342" dy="17">2425, 757, 257, 9707])</tspan>
  </text>

  <path d="M435 176 V315" class="arrow"/>
  <rect x="380" y="315" width="110" height="62" rx="10" class="node engine-node"/>
  <text x="435" y="340" text-anchor="middle" class="node-title">Scheduler</text>
  <text x="435" y="359" text-anchor="middle" class="node-body">schedule()</text>
  <path d="M435 377 V445" class="arrow"/>

  <text x="505" y="390" class="edge">
    <tspan x="505" dy="0">Scheduler</tspan>
    <tspan x="505" dy="15">Output</tspan>
    <tspan x="505" dy="15">scheduled_</tspan>
    <tspan x="505" dy="15">new_reqs[</tspan>
    <tspan x="505" dy="15">NewRequest</tspan>
    <tspan x="505" dy="15">Data:</tspan>
    <tspan x="505" dy="15">prompt_token_</tspan>
    <tspan x="505" dy="15">ids,</tspan>
    <tspan x="505" dy="15">block_ids, …]</tspan>
    <tspan x="505" dy="15">scheduled_</tspan>
    <tspan x="505" dy="15">cached_reqs[</tspan>
    <tspan x="505" dy="15">new_block_</tspan>
    <tspan x="505" dy="15">ids]</tspan>
    <tspan x="505" dy="15">num_scheduled_</tspan>
    <tspan x="505" dy="15">tokens{req_id:</tspan>
    <tspan x="505" dy="15">n}</tspan>
    <tspan x="505" dy="15">finished_req_</tspan>
    <tspan x="505" dy="15">ids, …</tspan>
  </text>

  <rect x="380" y="445" width="110" height="60" rx="10" class="node engine-node"/>
  <text x="435" y="481" text-anchor="middle" class="node-title">Executor</text>
  <path d="M435 505 V710 H632" class="arrow"/>
  <text x="638" y="650" class="edge">MessageQueue</text>
  <text x="638" y="668" class="edge">broadcast</text>

  <rect x="632" y="680" width="112" height="60" rx="10" class="node worker-node"/>
  <text x="688" y="716" text-anchor="middle" class="node-title">Worker</text>
  <path d="M744 710 V830" class="arrow"/>
  <text x="635" y="765" class="edge">
    <tspan x="635" dy="0">input_ids,</tspan>
    <tspan x="635" dy="16">positions,</tspan>
    <tspan x="635" dy="16">block_table,</tspan>
    <tspan x="635" dy="16">slot_mapping</tspan>
  </text>

  <rect x="632" y="820" width="112" height="80" rx="10" class="node worker-node"/>
  <text x="688" y="846" text-anchor="middle" class="node-title">
    <tspan x="688" dy="0">GPUModel</tspan>
    <tspan x="688" dy="16">Runner</tspan>
  </text>
  <text x="688" y="884" text-anchor="middle" class="node-body">_prepare_inputs()</text>
  <path d="M744 900 V970" class="arrow"/>

  <rect x="632" y="970" width="112" height="60" rx="10" class="node worker-node"/>
  <text x="688" y="994" text-anchor="middle" class="node-title">GPU Forward</text>
  <text x="688" y="1013" text-anchor="middle" class="node-title">Pass</text>
  <path d="M744 1030 V1115" class="arrow"/>
  <text x="635" y="1059" class="edge">logits</text>
  <text x="635" y="1077" class="edge">[vocab_size]</text>

  <rect x="632" y="1115" width="112" height="80" rx="10" class="node worker-node"/>
  <text x="688" y="1140" text-anchor="middle" class="node-title">Sampling</text>
  <text x="688" y="1163" text-anchor="middle" class="node-body">top-p / top-k</text>
  <text x="688" y="1182" text-anchor="middle" class="node-body">temp</text>
  <path d="M744 1195 V1270" class="arrow"/>
  <text x="635" y="1227" class="edge">
    <tspan x="635" dy="0">sampled_</tspan>
    <tspan x="635" dy="17">token_id</tspan>
  </text>

  <rect x="632" y="1270" width="112" height="60" rx="10" class="node worker-node"/>
  <text x="688" y="1294" text-anchor="middle" class="node-title">ModelRunner</text>
  <text x="688" y="1313" text-anchor="middle" class="node-title">Output</text>
  <text x="505" y="1248" class="edge">
    <tspan x="505" dy="0">ModelRunner</tspan>
    <tspan x="505" dy="17">Output</tspan>
    <tspan x="505" dy="17">response</tspan>
    <tspan x="505" dy="17">queue ·</tspan>
    <tspan x="505" dy="17">output_rank</tspan>
  </text>
  <path d="M632 1300 H616 V1370 H490" class="arrow"/>

  <text x="375" y="1250" class="edge">
    <tspan x="375" dy="0">EngineCore</tspan>
    <tspan x="375" dy="17">Outputs</tspan>
    <tspan x="375" dy="17">token ids only</tspan>
    <tspan x="375" dy="17">ZMQ</tspan>
  </text>
  <rect x="380" y="1340" width="110" height="60" rx="10" class="node engine-node"/>
  <text x="435" y="1376" text-anchor="middle" class="node-title">EngineCore</text>

  <path d="M380 1370 H340" class="arrow"/>
  <rect x="210" y="1334" width="130" height="68" rx="10" class="node api-node"/>
  <text x="275" y="1357" text-anchor="middle" class="node-title">AsyncLLM</text>
  <text x="275" y="1376" text-anchor="middle" class="node-body">OutputProcessor</text>
  <text x="275" y="1394" text-anchor="middle" class="node-body">Detokenizer</text>
  <text x="110" y="1320" class="edge">"Sure"</text>
  <path d="M210 1370 H200" class="arrow"/>
  <rect x="110" y="1340" width="90" height="60" rx="10" class="node api-node"/>
  <text x="155" y="1376" text-anchor="middle" class="node-title">SSE Stream</text>
  <path d="M110 1370 H88" class="arrow"/>
  <rect x="12" y="1338" width="76" height="66" rx="10" class="node client-node"/>
  <text x="50" y="1357" text-anchor="middle" class="node-body">Sure, here's</text>
  <text x="50" y="1374" text-anchor="middle" class="node-body">a joke…</text>
</svg>
