<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">vLLM V1 的多 API Server 与 data parallel 部署变体</title>
  <desc id="desc">多 API Server 进程连接 EngineCore；data parallel 部署会启动多个 EngineCore rank，并可按需使用 coordinator。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40566f"/>
    </marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9b6a2f"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #182535; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .api { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.7; rx: 8; }
      .engine { fill: #fff6e9; stroke: #c6873d; stroke-width: 1.7; rx: 8; }
      .coord { fill: #fff1dc; stroke: #c6873d; stroke-width: 1.7; rx: 8; }
      .worker { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.7; rx: 8; }
    </style>
  </defs>
  <rect width="760" height="500" fill="#fff"/>
  <text x="380" y="34" text-anchor="middle" class="heading">不同部署方式会在不同层增加进程</text>
  <line x1="380" y1="58" x2="380" y2="462" stroke="#d2dbe5" stroke-width="1.5"/>

  <text x="190" y="76" text-anchor="middle" class="heading">多个 API Server</text>
  <rect x="34" y="104" width="142" height="57" class="api"/>
  <text x="105" y="128" text-anchor="middle" class="label">API Server 0</text>
  <text x="105" y="148" text-anchor="middle" class="small">AsyncLLM + 客户端</text>
  <rect x="34" y="184" width="142" height="57" class="api"/>
  <text x="105" y="208" text-anchor="middle" class="label">API Server 1</text>
  <text x="105" y="228" text-anchor="middle" class="small">AsyncLLM + 客户端</text>
  <text x="105" y="267" text-anchor="middle" class="body">… API Server N−1</text>
  <line x1="176" y1="132" x2="236" y2="132" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="176" y1="212" x2="236" y2="212" stroke="#40566f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="241" y="145" width="112" height="76" class="engine"/>
  <text x="297" y="171" text-anchor="middle" class="label">EngineCore</text>
  <text x="297" y="191" text-anchor="middle" class="small">每个客户端的 ZMQ</text>
  <text x="297" y="209" text-anchor="middle" class="small">输入 / 输出</text>
  <text x="190" y="303" text-anchor="middle" class="body">API Server 数量增加的是前端进程。</text>
  <text x="190" y="324" text-anchor="middle" class="small">这本身不会增加 model ranks。</text>
  <text x="190" y="346" text-anchor="middle" class="small">默认数量可随 DP 配置变化。</text>

  <text x="570" y="76" text-anchor="middle" class="heading">数据并行（DP &gt; 1）</text>
  <rect x="405" y="103" width="119" height="50" class="api"/>
  <text x="464" y="125" text-anchor="middle" class="label">API Server</text>
  <text x="464" y="143" text-anchor="middle" class="small">负载均衡客户端</text>
  <rect x="568" y="103" width="150" height="50" class="coord"/>
  <text x="643" y="125" text-anchor="middle" class="label">DPCoordinator</text>
  <text x="643" y="143" text-anchor="middle" class="small">统计信息 / wave 状态</text>
  <line x1="563" y1="128" x2="524" y2="128" stroke="#9b6a2f" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>

  <rect x="405" y="204" width="143" height="62" class="engine"/>
  <text x="476" y="228" text-anchor="middle" class="label">EngineCore DP0</text>
  <text x="476" y="249" text-anchor="middle" class="small">Scheduler + Executor</text>
  <rect x="405" y="282" width="143" height="49" class="worker"/>
  <text x="476" y="303" text-anchor="middle" class="label">Worker ranks</text>
  <text x="476" y="320" text-anchor="middle" class="small">TP × PP group</text>
  <rect x="569" y="204" width="143" height="62" class="engine"/>
  <text x="640" y="228" text-anchor="middle" class="label">EngineCore DP1</text>
  <text x="640" y="249" text-anchor="middle" class="small">Scheduler + Executor</text>
  <rect x="569" y="282" width="143" height="49" class="worker"/>
  <text x="640" y="303" text-anchor="middle" class="label">Worker ranks</text>
  <text x="640" y="320" text-anchor="middle" class="small">TP × PP group</text>
  <path d="M455 153 V174 H476 V198" fill="none" stroke="#40566f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M493 153 V176 H640 V198" fill="none" stroke="#40566f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="550" y="192" text-anchor="middle" class="small">请求路由</text>
  <line x1="476" y1="266" x2="476" y2="277" stroke="#40566f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="266" x2="640" y2="277" stroke="#40566f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="570" y="365" text-anchor="middle" class="body">每个 DP rank 都有自己的 EngineCore 和 KV state。</text>
  <text x="570" y="386" text-anchor="middle" class="small">可选的 DPCoordinator 会向 API Server 提供负载统计，并协调 MoE waves。</text>

  <text x="380" y="443" text-anchor="middle" class="small">UniProcExecutor 不会创建 WorkerProc；Ray 改变 Worker 的启动与放置方式。两者是不同的执行选择。</text>
  <text x="380" y="465" text-anchor="middle" class="small">源码：vLLM v0.27.1 · cli/serve.py · engine/utils.py · engine/coordinator.py</text>
</svg>
