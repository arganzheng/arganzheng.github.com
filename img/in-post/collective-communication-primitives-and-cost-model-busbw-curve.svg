<text x="700.0" y="42.1" text-anchor="end">平台：由 β 与算法带宽效率决定</text>
<text x="700.0" y="58.1" text-anchor="end">（带宽的账）</text>
<text x="398.3" y="116.2" text-anchor="start">← 拐点附近：S* ≈ 步数 × α × β / 效率</text>
<text x="415.5" y="134.2" text-anchor="start">（两本账相当）</text>
<text x="398.3" y="154.2" text-anchor="start" class="gray">S* = nαβ ≈ 2 MB，busbw = 平台的一半</text>
<text x="92.0" y="130.7" text-anchor="start">小消息端：T ≈ 步数 × α，与 S 无关；</text>
<text x="92.0" y="148.7" text-anchor="start">busbw 随 S 线性上升（双对数下斜率为 1）</text>
<text x="82.0" y="60.1" text-anchor="start" class="red">β = 25 GB/s</text>
