<svg xmlns="http://www.w3.org/2000/svg" width="740" height="348" viewBox="0 0 740 348" role="img" aria-labelledby="bb-t bb-d">
<title id="bb-t">busbw 随消息大小的曲线：延迟主导、拐点、平台</title>
<desc id="bb-d">8 卡 IB ring all_reduce（α = 10 µs，β = 25 GB/s）的理论 busbw，双对数坐标：小消息端斜率 1 上升，拐点 S* = nαβ ≈ 2 MB 处为平台一半，大消息端趋于 β。</desc>
