<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="t d">
  <title id="t">一个 uint32 里 8 个 INT4 的位排布与 magic-number 解包</title>
  <desc id="d">32 位寄存器 q 从高到低是 e7 到 e0 八个 4 bit 格。lop3 用掩码 0x000f000f 取每个半字的低 4 bit（e0、e4），或上 0x6400 得到 FP16 值 1024 + q，再 hsub2 减 1032 得到 q − 8；用掩码 0x00f000f0 取 bit 4..7（e1、e5），得到 1024 + 16q，hfma2 乘 1/16 加 −72 得到 q − 8。e2/e3/e6/e7 由调用方 q &gt;&gt; 8 后再调一次。4 个元素 4 条指令，没有 int→float 的 cvt。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .monos { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 13px; fill: #5b6b7c; }
      .mutedmono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5b6b7c; }
      .box { fill: #fff; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { stroke: #6f8399; stroke-width: 1.2; }
      .thin { stroke: #6f8399; stroke-width: 0.8; }
      .line { stroke: #40566f; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #40566f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #9fb3c8; stroke-width: 1.2; }
      .c-s { fill: #f9d5d3; } .c-e { fill: #fde0b8; } .c-m { fill: #cfe2f3; } .c-i { fill: #cfeccf; }
      .c-w { fill: #ffffff; } .c-g { fill: #eef1f4; } .c-pad { fill: #e3e7eb; }
      .b0 { fill: #cfe2f3; } .b1 { fill: #fde0b8; } .b2 { fill: #cfeccf; } .b3 { fill: #e6d7f2; } .b4 { fill: #f9d5d3; }
    </style>
  </defs>
<rect x="0" y="0" width="760" height="592" fill="#ffffff"/>
<text x="24.0" y="22.0" class="muted">一个 uint32 q 装 8 个 INT4，每格 4 bit（哪个逻辑权重放哪一格由 repack 决定）</text>
<text x="126.0" y="73.0" text-anchor="end" class="monob">q</text>
<rect x="140.0" y="52.0" width="70.0" height="32.0" class="c-g cell"/>
<text x="175.0" y="73.0" text-anchor="middle" class="monob">e7</text>
<rect x="210.0" y="52.0" width="70.0" height="32.0" class="c-g cell"/>
<text x="245.0" y="73.0" text-anchor="middle" class="monob">e6</text>
<rect x="280.0" y="52.0" width="70.0" height="32.0" class="c-e cell"/>
<text x="315.0" y="73.0" text-anchor="middle" class="monob">e5</text>
<rect x="350.0" y="52.0" width="70.0" height="32.0" class="c-m cell"/>
<text x="385.0" y="73.0" text-anchor="middle" class="monob">e4</text>
<rect x="420.0" y="52.0" width="70.0" height="32.0" class="c-g cell"/>
<text x="455.0" y="73.0" text-anchor="middle" class="monob">e3</text>
<rect x="490.0" y="52.0" width="70.0" height="32.0" class="c-g cell"/>
<text x="525.0" y="73.0" text-anchor="middle" class="monob">e2</text>
<rect x="560.0" y="52.0" width="70.0" height="32.0" class="c-e cell"/>
<text x="595.0" y="73.0" text-anchor="middle" class="monob">e1</text>
<rect x="630.0" y="52.0" width="70.0" height="32.0" class="c-m cell"/>
<text x="665.0" y="73.0" text-anchor="middle" class="monob">e0</text>
<text x="144.0" y="46.0" class="mutedmono">31</text>
<text x="214.0" y="46.0" class="mutedmono">27</text>
<text x="284.0" y="46.0" class="mutedmono">23</text>
<text x="354.0" y="46.0" class="mutedmono">19</text>
<text x="424.0" y="46.0" class="mutedmono">15</text>
<text x="494.0" y="46.0" class="mutedmono">11</text>
<text x="564.0" y="46.0" class="mutedmono">7</text>
<text x="634.0" y="46.0" class="mutedmono">3</text>
<text x="696.0" y="46.0" text-anchor="end" class="mutedmono">0</text>
<path d="M144,94 L144,100 L416,100 L416,94" class="line"/>
<text x="280.0" y="118.0" text-anchor="middle" class="small">高半字（16 bit）</text>
<path d="M424,94 L424,100 L696,100 L696,94" class="line"/>
<text x="560.0" y="118.0" text-anchor="middle" class="small">低半字（16 bit）</text>
<rect x="140.0" y="130.0" width="12.0" height="12.0" class="c-m cell"/>
<text x="158.0" y="141.0" class="small">lo 取走 e0、e4（每个半字的低 4 bit）</text>
<rect x="430.0" y="130.0" width="12.0" height="12.0" class="c-e cell"/>
<text x="448.0" y="141.0" class="small">hi 取走 e1、e5（bit 4..7）</text>
<text x="140.0" y="164.0" class="small">灰格 e2/e3/e6/e7：调用方 q &gt;&gt; 8 后再调一次</text>
<text x="24.0" y="198.0" class="monob">lo = lop3(q, LO = 0x000f000f, EX = 0x64006400)</text>
<text x="24.0" y="218.0" class="muted">取每个半字的低 4 bit，或上 FP16 的 1024 编码；下面是其中一个半字</text>
<rect x="140.0" y="232.0" width="22.0" height="26.0" class="c-s cell"/>
<text x="151.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="162.0" y="232.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="173.0" y="250.0" text-anchor="middle" class="mono">1</text>
<rect x="184.0" y="232.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="195.0" y="250.0" text-anchor="middle" class="mono">1</text>
<rect x="206.0" y="232.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="217.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="228.0" y="232.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="239.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="250.0" y="232.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="261.0" y="250.0" text-anchor="middle" class="mono">1</text>
<rect x="272.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="283.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="294.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="305.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="316.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="327.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="338.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="349.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="360.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="371.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="382.0" y="232.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="393.0" y="250.0" text-anchor="middle" class="mono">0</text>
<rect x="404.0" y="232.0" width="22.0" height="26.0" class="c-m cell"/>
<text x="415.0" y="250.0" text-anchor="middle" class="mono">q0</text>
<rect x="426.0" y="232.0" width="22.0" height="26.0" class="c-m cell"/>
<text x="437.0" y="250.0" text-anchor="middle" class="mono">q0</text>
<rect x="448.0" y="232.0" width="22.0" height="26.0" class="c-m cell"/>
<text x="459.0" y="250.0" text-anchor="middle" class="mono">q0</text>
<rect x="470.0" y="232.0" width="22.0" height="26.0" class="c-m cell"/>
<text x="481.0" y="250.0" text-anchor="middle" class="mono">q0</text>
<path d="M142,264 L142,269 L160,269 L160,264" class="line"/>
<text x="151.0" y="286.0" text-anchor="middle" class="small">S</text>
<path d="M164,264 L164,269 L270,269 L270,264" class="line"/>
<text x="217.0" y="286.0" text-anchor="middle" class="small">E = 25 → 2^10</text>
<path d="M274,264 L274,269 L490,269 L490,264" class="line"/>
<text x="382.0" y="286.0" text-anchor="middle" class="small">M（低 4 bit = q0）</text>
<text x="510.0" y="250.0" class="body">→ FP16 值 = 1024 + q0</text>
<text x="140.0" y="312.0" class="small">两个半字并排就是一个 half2：{1024 + q4, 1024 + q0}</text>
<text x="140.0" y="334.0" class="mono">__hsub2(lo, 0x6408 = 1032) → {q4 − 8, q0 − 8}</text>
<text x="140.0" y="356.0" class="small">一条指令完成「减 1024 + 减零点 8」</text>
<text x="24.0" y="396.0" class="monob">hi = lop3(q, HI = 0x00f000f0, EX = 0x64006400)</text>
<text x="24.0" y="416.0" class="muted">取 bit 4..7，它落在尾数第 4..7 位</text>
<rect x="140.0" y="430.0" width="22.0" height="26.0" class="c-s cell"/>
<text x="151.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="162.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="173.0" y="448.0" text-anchor="middle" class="mono">1</text>
<rect x="184.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="195.0" y="448.0" text-anchor="middle" class="mono">1</text>
<rect x="206.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="217.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="228.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="239.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="250.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="261.0" y="448.0" text-anchor="middle" class="mono">1</text>
<rect x="272.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="283.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="294.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="305.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="316.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="327.0" y="448.0" text-anchor="middle" class="mono">q1</text>
<rect x="338.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="349.0" y="448.0" text-anchor="middle" class="mono">q1</text>
<rect x="360.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="371.0" y="448.0" text-anchor="middle" class="mono">q1</text>
<rect x="382.0" y="430.0" width="22.0" height="26.0" class="c-e cell"/>
<text x="393.0" y="448.0" text-anchor="middle" class="mono">q1</text>
<rect x="404.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="415.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="426.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="437.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="448.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="459.0" y="448.0" text-anchor="middle" class="mono">0</text>
<rect x="470.0" y="430.0" width="22.0" height="26.0" class="c-g cell"/>
<text x="481.0" y="448.0" text-anchor="middle" class="mono">0</text>
<path d="M142,462 L142,467 L160,467 L160,462" class="line"/>
<text x="151.0" y="484.0" text-anchor="middle" class="small">S</text>
<path d="M164,462 L164,467 L270,467 L270,462" class="line"/>
<text x="217.0" y="484.0" text-anchor="middle" class="small">E = 25 → 2^10</text>
<path d="M274,462 L274,467 L490,467 L490,462" class="line"/>
<text x="382.0" y="484.0" text-anchor="middle" class="small">M</text>
<text x="510.0" y="448.0" class="body">→ FP16 值 = 1024 + 16·q1</text>
<text x="140.0" y="510.0" class="mono">__hfma2(hi, 0x2c00 = 1/16, 0xd480 = −72)</text>
<text x="140.0" y="532.0" class="mono">→ (1024 + 16·q1) / 16 − 72 = q1 − 8</text>
<line x1="24.0" y1="550.0" x2="736.0" y2="550.0" class="rule"/>
<text x="24.0" y="572.0" class="body">4 个元素、4 条指令（2 lop3 + 1 hsub2 + 1 hfma2），全程没有 int → float 的 cvt</text>
</svg>
