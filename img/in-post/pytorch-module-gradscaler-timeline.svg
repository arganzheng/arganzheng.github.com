<svg xmlns="http://www.w3.org/2000/svg" width="746" height="382" viewBox="0 0 746 382" role="img" aria-labelledby="t d">
<title id="t">GradScaler 的一次迭代：scale 放大 loss，step 内部 unscale 并查溢出，update 自适应 scale</title>
<desc id="d">训练循环依次执行 autocast 前向、scaler.scale(loss)、backward、scaler.step(optimizer)、scaler.update()。autocast 下前向返回 outputs 和 loss；scale 返回 loss × scale；step 内 GradScaler 先 unscale 并检查 inf/nan，梯度正常才调用 optimizer.step()，否则跳过；update 调整 scale。</desc>
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#111;font-weight:500}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
.small{font-size:12px}
.lab{font-size:13px;font-weight:600}
.num{font-size:12px;font-weight:600;fill:#555}
.mod{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.2}
.op{fill:#f5f5f5;stroke:#757575;stroke-width:1.2}
.cpu{fill:#fff8e1;stroke:#f9a825;stroke-width:1.2}
.gpu{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.2}
.ag{fill:#f3e5f5;stroke:#7b1fa2;stroke-width:1.2}
.opt{fill:#fbe9e7;stroke:#d84315;stroke-width:1.2}
.dash{stroke-dasharray:5 3}
.ln{stroke:#333;stroke-width:1.3;fill:none}
.ax{stroke:#888;stroke-width:1;fill:none}
.grid{stroke:#ccc;stroke-width:1;stroke-dasharray:3 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#333"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#888"/></marker></defs>
<rect width="746" height="382" fill="#fff"/>
<text x="16" y="73.0" text-anchor="start" dominant-baseline="central" class="lab">训练循环</text>
<text x="16" y="149.0" text-anchor="start" dominant-baseline="central" class="lab">autocast</text>
<text x="16" y="225.0" text-anchor="start" dominant-baseline="central" class="lab">GradScaler</text>
<text x="16" y="301.0" text-anchor="start" dominant-baseline="central" class="lab">Optimizer</text>
<rect x="100" y="56" width="112" height="34" class="op"/>
<text x="156.0" y="73.0" text-anchor="middle" dominant-baseline="central">autocast 前向</text>
<text x="156.0" y="36" text-anchor="middle" dominant-baseline="central" class="num">①</text>
<rect x="212" y="56" width="90" height="34" class="op"/>
<text x="257.0" y="73.0" text-anchor="middle" dominant-baseline="central" class="mono">scale(loss)</text>
<text x="257.0" y="36" text-anchor="middle" dominant-baseline="central" class="num">②</text>
<rect x="302" y="56" width="80" height="34" class="op"/>
<text x="342.0" y="73.0" text-anchor="middle" dominant-baseline="central" class="mono">backward()</text>
<text x="342.0" y="36" text-anchor="middle" dominant-baseline="central" class="num">③</text>
<rect x="382" y="56" width="268" height="34" class="op"/>
<text x="516.0" y="73.0" text-anchor="middle" dominant-baseline="central" class="mono">step(optimizer)</text>
<text x="516.0" y="36" text-anchor="middle" dominant-baseline="central" class="num">④</text>
<rect x="650" y="56" width="76" height="34" class="op"/>
<text x="688.0" y="73.0" text-anchor="middle" dominant-baseline="central" class="mono">update()</text>
<text x="688.0" y="36" text-anchor="middle" dominant-baseline="central" class="num">⑤</text>
<rect x="100" y="132" width="102" height="34" class="gpu"/>
<text x="151.0" y="149.0" text-anchor="middle" dominant-baseline="central" class="mono">FP16 forward</text>
<line x1="100" y1="90" x2="100" y2="132" class="ln" marker-end="url(#ah)"/>
<line x1="202" y1="132" x2="202" y2="90" class="ln" marker-end="url(#ah)"/>
<text x="196" y="111.0" text-anchor="end" dominant-baseline="central" class="small">outputs, loss</text>
<rect x="212" y="208" width="80" height="34" class="cpu"/>
<text x="252.0" y="225.0" text-anchor="middle" dominant-baseline="central" class="mono">× scale</text>
<line x1="212" y1="90" x2="212" y2="208" class="ln" marker-end="url(#ah)"/>
<line x1="292" y1="208" x2="292" y2="90" class="ln" marker-end="url(#ah)"/>
<text x="298" y="111.0" text-anchor="start" dominant-baseline="central" class="small">loss × scale</text>
<rect x="382" y="208" width="124" height="34" class="cpu"/>
<text x="444.0" y="225.0" text-anchor="middle" dominant-baseline="central">unscale_ + 查溢出</text>
<rect x="506" y="208" width="134" height="34" class="cpu"/>
<text x="573.0" y="225.0" text-anchor="middle" dominant-baseline="central">调用或跳过 step</text>
<rect x="506" y="284" width="124" height="34" class="opt dash"/>
<text x="568.0" y="301.0" text-anchor="middle" dominant-baseline="central" class="mono">optimizer.step()</text>
<line x1="382" y1="90" x2="382" y2="208" class="ln" marker-end="url(#ah)"/>
<line x1="506" y1="242" x2="506" y2="284" class="ln" marker-end="url(#ah)"/>
<text x="500" y="263.0" text-anchor="end" dominant-baseline="central" class="small">梯度正常</text>
<line x1="630" y1="284" x2="630" y2="242" class="ln" marker-end="url(#ah)"/>
<text x="636" y="263.0" text-anchor="start" dominant-baseline="central" class="small">参数已更新</text>
<rect x="650" y="208" width="76" height="34" class="cpu"/>
<text x="688.0" y="225.0" text-anchor="middle" dominant-baseline="central">调整 scale</text>
<line x1="650" y1="90" x2="650" y2="208" class="ln" marker-end="url(#ah)"/>
<line x1="100" y1="348" x2="736" y2="348" class="ax" marker-end="url(#ahg)"/>
<text x="736" y="364" text-anchor="end" dominant-baseline="central" class="small">时间</text>
</svg>
