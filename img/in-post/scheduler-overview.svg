<title id="title">Scheduler 的全貌：Token Budget、KV Cache、Mixed Batch</title>
  <desc id="desc">Scheduler 按 Token Budget 为 A、B、C 分配 256、1、5 个 token，分别形成 Prefill、Decode 和 Spec Decode，再汇合为 Mixed Batch。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .title { font-size: 20px; font-weight: 500; }
      .head { font-size: 16px; font-weight: 500; }
      .body { font-size: 14px; }
      .small { font-size: 14px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .arrow { stroke: #40566f; stroke-width: 2; marker-end: url(#arrow); }
      .used { fill: #4e79a7; stroke: #fff; stroke-width: 2; }
      .free { fill: #e8edf2; stroke: #fff; stroke-width: 2; }
    </style>
  </defs>
  <rect x="22" y="108.0" width="716" height="774.0" fill="#fff" />
  <g data-card="scheduler"><rect class="card" x="280" y="136.8" width="200" height="97.2" /><text x="380" y="198.0" text-anchor="middle" class="head" transform="translate(-0.008 -5.600) ">Scheduler</text></g>
  <line x1="380" y1="241.20000000000002" x2="380" y2="277.2" class="arrow" />
  <g data-card="budget"><rect class="compute" x="240" y="291.6" width="280" height="97.2" /><text x="380" y="352.8" text-anchor="middle" class="head" transform="translate(0.000 -5.600) ">Token Budget</text></g>
  <path d="M 380 388.8 V 439.2 H 136 M 380 439.2 H 624" fill="none" stroke="#40566f" stroke-width="2" />
  <line x1="136" y1="439.2" x2="136" y2="493.2" class="arrow" />
  <line x1="380" y1="439.2" x2="380" y2="493.2" class="arrow" />
  <line x1="624" y1="439.2" x2="624" y2="493.2" class="arrow" />
  <g data-card="a"><rect class="request" x="38" y="493.2" width="196" height="129.6" data-no-center="" /><text x="136" y="547.2" text-anchor="middle" class="body">Request A · 256</text><text x="136" y="594.0" text-anchor="middle" class="small">Prefill</text></g>
  <g data-card="b"><rect class="request" x="282" y="493.2" width="196" height="129.6" data-no-center="" /><text x="380" y="547.2" text-anchor="middle" class="body">Request B · 1</text><text x="380" y="594.0" text-anchor="middle" class="small">Decode</text></g>
  <g data-card="c"><rect class="request" x="526" y="493.2" width="196" height="129.6" data-no-center="" /><text x="624" y="547.2" text-anchor="middle" class="body">Request C · 5</text><text x="624" y="594.0" text-anchor="middle" class="small">Spec Decode</text></g>
  <path d="M 136 622.8 V 687.6 H 380 M 380 622.8 V 687.6 M 624 622.8 V 687.6 H 380" fill="none" stroke="#40566f" stroke-width="2" />
