  <g data-card="mixed"><rect class="memory" x="240" y="741.6" width="280" height="111.60000000000001" /><text x="380" y="811.8000000000001" text-anchor="middle" class="head" transform="translate(0.000 -7.400) ">Mixed Batch</text></g>
