<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="t d">
  <title id="t">Chunk 流水线：按时刻展开</title>
  <desc id="d">时间视角：t0 到 t5 每一列是一个时刻。Dispatch 行依次处理 Chunk 0–3，Compute 行晚一拍，Combine 行再晚一拍；同一时刻三个阶段各自在处理不同的 Chunk。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c3cf"/></marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7a8b9c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .formula { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-style: italic; }
      .math { font-size: 14px; }
      .mute { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .req { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .comm { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-o { fill: #fde9cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #f9d5cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-light { stroke: #b7c3cf; stroke-width: 1.2; fill: none; marker-end: url(#arrow-light); }
      .arrow-hi { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#arrow-hi); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .dbl { stroke: #5880b4; stroke-width: 4; fill: none; }
      .dbl-in { stroke: #fff; stroke-width: 1.4; fill: none; }
      .dash { stroke: #7a8b9c; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow-axis); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
<text x="150.0" y="30" text-anchor="middle" class="mono">t0</text>
<text x="250.0" y="30" text-anchor="middle" class="mono">t1</text>
<text x="350.0" y="30" text-anchor="middle" class="mono">t2</text>
<text x="450.0" y="30" text-anchor="middle" class="mono">t3</text>
<text x="550.0" y="30" text-anchor="middle" class="mono">t4</text>
<text x="650.0" y="30" text-anchor="middle" class="mono">t5</text>
<text x="20" y="65.0" text-anchor="start" class="body">Dispatch</text>
<rect class="seg-a" x="100" y="40" width="100" height="40"/>
<text x="150.0" y="65.0" text-anchor="middle" class="small">Chunk 0</text>
<rect class="seg-b" x="200" y="40" width="100" height="40"/>
<text x="250.0" y="65.0" text-anchor="middle" class="small">Chunk 1</text>
<rect class="seg-c" x="300" y="40" width="100" height="40"/>
<text x="350.0" y="65.0" text-anchor="middle" class="small">Chunk 2</text>
<rect class="seg-d" x="400" y="40" width="100" height="40"/>
<text x="450.0" y="65.0" text-anchor="middle" class="small">Chunk 3</text>
<text x="20" y="105.0" text-anchor="start" class="body">Compute</text>
<rect class="seg-a" x="200" y="80" width="100" height="40"/>
<text x="250.0" y="105.0" text-anchor="middle" class="small">Chunk 0</text>
<rect class="seg-b" x="300" y="80" width="100" height="40"/>
<text x="350.0" y="105.0" text-anchor="middle" class="small">Chunk 1</text>
<rect class="seg-c" x="400" y="80" width="100" height="40"/>
<text x="450.0" y="105.0" text-anchor="middle" class="small">Chunk 2</text>
<rect class="seg-d" x="500" y="80" width="100" height="40"/>
<text x="550.0" y="105.0" text-anchor="middle" class="small">Chunk 3</text>
<text x="20" y="145.0" text-anchor="start" class="body">Combine</text>
<rect class="seg-a" x="300" y="120" width="100" height="40"/>
<text x="350.0" y="145.0" text-anchor="middle" class="small">Chunk 0</text>
<rect class="seg-b" x="400" y="120" width="100" height="40"/>
<text x="450.0" y="145.0" text-anchor="middle" class="small">Chunk 1</text>
<rect class="seg-c" x="500" y="120" width="100" height="40"/>
<text x="550.0" y="145.0" text-anchor="middle" class="small">Chunk 2</text>
<rect class="seg-d" x="600" y="120" width="100" height="40"/>
<text x="650.0" y="145.0" text-anchor="middle" class="small">Chunk 3</text>
<line x1="100" y1="178" x2="700" y2="178" class="axis"/>
<text x="706" y="183" text-anchor="start" class="mute">时间</text>
</svg>
