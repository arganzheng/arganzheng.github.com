181.0" text-anchor="middle" class="small">G4</text><text x="602" y="182" text-anchor="start" class="small">每 2 个 Q 共享一份</text><text x="40" y="242" text-anchor="start" class="head">MQA</text><text x="102" y="242" text-anchor="end" class="small">Q</text><rect class="seg-q" x="110" y="220" width="60" height="32"/><text x="140.0" y="241.0" text-anchor="middle" class="small">1</text><rect class="seg-q" x="170" y="220" width="60" height="32"/><text x="200.0" y="241.0" text-anchor="middle" class="small">2</text><rect class="seg-q" x="230" y="220" width="60" height="32"/><text x="260.0" y="241.0" text-anchor="middle" class="small">3</text><rect class="seg-q" x="290" y="220" width="60" height="32"/><text x="320.0" y="241.0" text-anchor="middle" class="small">4</text><rect class="seg-q" x="350" y="220" width="60" height="32"/><text x="380.0" y="241.0" text-anchor="middle" class="small">5</text><rect class="seg-q" x="410" y="220" width="60" height="32"/><text x="440.0" y="241.0" text-anchor="middle" class="small">6</text><rect class="seg-q" x="470" y="220" width="60" height="32"/><text x="500.0" y="241.0" text-anchor="middle" class="small">7</text><rect class="seg-q" x="530" y="220" width="60" height="32"/><text x="560.0" y="241.0" text-anchor="middle" class="small">8</text><text x="102" y="282" text-anchor="end" class="small">K/V</text><rect class="seg-kv" x="110" y="260" width="480" height="32"/><text x="350.0" y="281.0" text-anchor="middle" class="small">K/V 1</text><text x="602" y="282" text-anchor="start" class="small">全部 Q 共享一份</text>
