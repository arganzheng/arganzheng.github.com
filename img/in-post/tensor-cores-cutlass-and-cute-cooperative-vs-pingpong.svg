<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" role="img" aria-labelledby="t d">
<title id="t">Cooperative 与 Ping-pong 调度下 Tensor Core 的忙闲</title>
<desc id="d">同一条时间轴，宽度按工作量画：一个 128×128 tile 的 mainloop 是一个单位。Cooperative：WG1、WG2 合算 256x128 的 t0、t1，各 128 行，mainloop 各占两个单位，同时做 epilogue，这时 Tensor Core 空闲。Ping-pong：WG1 算 t0、t2，WG2 算 t1、t3，一个做 epilogue 或等待时另一个在跑 mainloop，Tensor Core 一直忙，算完同样 4 个 128×128 用时更短。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-weight:600}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="760" height="346" fill="#fff"/>
<text x="20.0" y="24.0" font-size="13" text-anchor="start" fill="#111">Cooperative：两个 consumer 合算一个 256x128 tile（各 128 行），同进同出</text>
<text x="20.0" y="57.0" font-size="13" text-anchor="start" fill="#111">WG1</text>
<rect x="110.0" y="38.0" width="240.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="230.0" y="56.3" font-size="12" text-anchor="middle" fill="#111">mainloop t0 行 0-127</text>
<rect x="350.0" y="38.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="380.0" y="56.3" font-size="12" text-anchor="middle" fill="#111">epi t0</text>
<rect x="410.0" y="38.0" width="240.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="530.0" y="56.3" font-size="12" text-anchor="middle" fill="#111">mainloop t1 行 0-127</text>
<rect x="650.0" y="38.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="680.0" y="56.3" font-size="12" text-anchor="middle" fill="#111">epi t1</text>
<text x="20.0" y="93.0" font-size="13" text-anchor="start" fill="#111">WG2</text>
<rect x="110.0" y="74.0" width="240.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="230.0" y="92.3" font-size="12" text-anchor="middle" fill="#111">mainloop t0 行 128-255</text>
<rect x="350.0" y="74.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="380.0" y="92.3" font-size="12" text-anchor="middle" fill="#111">epi t0</text>
<rect x="410.0" y="74.0" width="240.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="530.0" y="92.3" font-size="12" text-anchor="middle" fill="#111">mainloop t1 行 128-255</text>
<rect x="650.0" y="74.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="680.0" y="92.3" font-size="12" text-anchor="middle" fill="#111">epi t1</text>
<text x="20.0" y="129.0" font-size="13" text-anchor="start" fill="#111">TC</text>
<rect x="110.0" y="110.0" width="240.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="230.0" y="128.3" font-size="12" text-anchor="middle" fill="#fff">WG1+WG2</text>
<rect x="350.0" y="110.0" width="60.0" height="28.0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380.0" y="128.3" font-size="12" text-anchor="middle" fill="#111">空闲</text>
<rect x="410.0" y="110.0" width="240.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="530.0" y="128.3" font-size="12" text-anchor="middle" fill="#fff">WG1+WG2</text>
<rect x="650.0" y="110.0" width="60.0" height="28.0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="680.0" y="128.3" font-size="12" text-anchor="middle" fill="#111">空闲</text>
<text x="20.0" y="176.0" font-size="13" text-anchor="start" fill="#111">Ping-pong：两个 consumer 各算一个 128x128 tile，用 ordered barrier 错开</text>
<text x="20.0" y="209.0" font-size="13" text-anchor="start" fill="#111">WG1</text>
<rect x="110.0" y="190.0" width="120.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="170.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">mainloop t0</text>
<rect x="230.0" y="190.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="260.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">epi t0</text>
<rect x="290.0" y="190.0" width="60.0" height="28.0" fill="#eeeeee" stroke="#888" stroke-width="1"/>
<text x="320.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">等 WG2</text>
<rect x="350.0" y="190.0" width="120.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="410.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">mainloop t2</text>
<rect x="470.0" y="190.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="500.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">epi t2</text>
<rect x="530.0" y="190.0" width="60.0" height="28.0" fill="#eeeeee" stroke="#888" stroke-width="1"/>
<text x="560.0" y="208.3" font-size="12" text-anchor="middle" fill="#111">等 WG2</text>
<text x="20.0" y="245.0" font-size="13" text-anchor="start" fill="#111">WG2</text>
<rect x="110.0" y="226.0" width="120.0" height="28.0" fill="#eeeeee" stroke="#888" stroke-width="1"/>
<text x="170.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">等 WG1</text>
<rect x="230.0" y="226.0" width="120.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="290.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">mainloop t1</text>
<rect x="350.0" y="226.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="380.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">epi t1</text>
<rect x="410.0" y="226.0" width="60.0" height="28.0" fill="#eeeeee" stroke="#888" stroke-width="1"/>
<text x="440.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">等 WG1</text>
<rect x="470.0" y="226.0" width="120.0" height="28.0" fill="#dde9f7" stroke="#2e6da4" stroke-width="1"/>
<text x="530.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">mainloop t3</text>
<rect x="590.0" y="226.0" width="60.0" height="28.0" fill="#fdf1d6" stroke="#b9770e" stroke-width="1"/>
<text x="620.0" y="244.3" font-size="12" text-anchor="middle" fill="#111">epi t3</text>
<text x="20.0" y="281.0" font-size="13" text-anchor="start" fill="#111">TC</text>
<rect x="110.0" y="262.0" width="120.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="170.0" y="280.3" font-size="12" text-anchor="middle" fill="#fff">WG1</text>
<rect x="230.0" y="262.0" width="120.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="290.0" y="280.3" font-size="12" text-anchor="middle" fill="#fff">WG2</text>
<rect x="350.0" y="262.0" width="120.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="410.0" y="280.3" font-size="12" text-anchor="middle" fill="#fff">WG1</text>
<rect x="470.0" y="262.0" width="120.0" height="28.0" fill="#2e6da4" stroke="#1b4f7a" stroke-width="1"/>
<text x="530.0" y="280.3" font-size="12" text-anchor="middle" fill="#fff">WG2</text>
<line x1="110.0" y1="306.0" x2="730.0" y2="306.0" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="110.0" y1="302.0" x2="110.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<line x1="230.0" y1="302.0" x2="230.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<line x1="350.0" y1="302.0" x2="350.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<line x1="470.0" y1="302.0" x2="470.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<line x1="590.0" y1="302.0" x2="590.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<line x1="710.0" y1="302.0" x2="710.0" y2="310.0" stroke="#111" stroke-width="1.2"/>
<text x="170.0" y="326.0" font-size="12" text-anchor="middle" fill="#111">1 个 128×128 mainloop</text>
<text x="730.0" y="326.0" font-size="12" text-anchor="end" fill="#111">时间</text>
</svg>
