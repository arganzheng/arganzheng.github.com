<svg xmlns="http://www.w3.org/2000/svg" width="750" height="438" viewBox="0 0 750 438" role="img" aria-labelledby="title desc">
    <title id="title">CUDA 与 Triton 的分工：四个 program 与一个 program 内的线程映射</title><desc id="desc">1024 个元素按 BLOCK=256 划为四个 program。pid 0 至 3 分别处理 0..255、256..511、512..767、768..1023，offs=pid*256+arange(0,256)。仅展开 pid 0，num_warps=4，warp 0 至 3 的线程编号为 0..31、32..63、64..95、96..127。平均每线程两个元素，元素到线程的具体映射和合并访存由编译器决定。</desc>
    <style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:600;fill:#111}
    .title{font-size:19px;font-weight:700}.small{font-size:13px}.mono{font-family:"Noto Sans Mono CJK SC",monospace;font-size:13px}
    .line{fill:none;stroke:#536273;stroke-width:1.2}.arrow{fill:none;stroke:#536273;stroke-width:1.5;marker-end:url(#arrow)}
    .outline{stroke:#536273;stroke-width:1.2}.guide{fill:none;stroke:#c4ccd5;stroke-width:1;stroke-dasharray:3 4}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#536273"/></marker></defs>
    <rect width="750" height="438" fill="#fff"/>
    <text x="20" y="29" class="title" text-anchor="start">CUDA 与 Triton 的分工</text><text x="20" y="56" class="title" text-anchor="start">1024 个元素，BLOCK = 256，grid = 4</text><rect x="30" y="82" width="172" height="112" fill="#e4edfa" class=""/><rect x="202" y="82" width="172" height="112" fill="#ddf2e7" class=""/><rect x="374" y="82" width="172" height="112" fill="#fff0d6" class=""/><rect x="546" y="82" width="172" height="112" fill="#f0e9fa" class=""/><rect x="30" y="82" width="688" height="112" fill="none" class="outline"/><path d="M202,82 V194" class="line"/><path d="M374,82 V194" class="line"/><path d="M546,82 V194" class="line"/><path d="M30,115 H718" class="line"/><path d="M30,146 H718" class="line"/><text x="40" y="105" class="" text-anchor="start">pid = 0</text><text x="40" y="136" class="mono" text-anchor="start">x[0..255]</text><text x="40" y="165" class="mono" text-anchor="start">offs = 0*256</text><text x="40" y="184" class="mono" text-anchor="start">+ arange(0, 256)</text><text x="212" y="105" class="" text-anchor="start">pid = 1</text><text x="212" y="136" class="mono" text-anchor="start">x[256..511]</text><text x="212" y="165" class="mono" text-anchor="start">offs = 1*256</text><text x="212" y="184" class="mono" text-anchor="start">+ arange(0, 256)</text><text x="384" y="105" class="" text-anchor="start">pid = 2</text><text x="384" y="136" class="mono" text-anchor="start">x[512..767]</text><text x="384" y="165" class="mono" text-anchor="start">offs = 2*256</text><text x="384" y="184" class="mono" text-anchor="start">+ arange(0, 256)</text><text x="556" y="105" class="" text-anchor="start">pid = 3</text><text x="556" y="136" class="mono" text-anchor="start">x[768..1023]</text><text x="556" y="165" class="mono" text-anchor="start">offs = 3*256</text><text x="556" y="184" class="mono" text-anchor="start">+ arange(0, 256)</text><path d="M116,194 V252" class="arrow"/><text x="140" y="229" class="small" text-anchor="start">只展开 pid = 0：由编译器映射到线程</text><rect x="30" y="252" width="688" height="110" fill="#f2f5f9" class="outline"/><text x="42" y="277" class="" text-anchor="start">一个 program：256 个元素，num_warps = 4，共 128 个线程</text><path d="M30,290 H718" class="line"/><path d="M202,290 V362" class="line"/><path d="M374,290 V362" class="line"/><path d="M546,290 V362" class="line"/><text x="40" y="316" class="" text-anchor="start">warp 0</text><text x="40" y="345" class="" text-anchor="start">线程 0..31</text><text x="212" y="316" class="" text-anchor="start">warp 1</text><text x="212" y="345" class="" text-anchor="start">线程 32..63</text><text x="384" y="316" class="" text-anchor="start">warp 2</text><text x="384" y="345" class="" text-anchor="start">线程 64..95</text><text x="556" y="316" class="" text-anchor="start">warp 3</text><text x="556" y="345" class="" text-anchor="start">线程 96..127</text><text x="30" y="391" class="small" text-anchor="start">平均每线程 2 个元素（256 / 128）；具体 layout 由编译器决定</text><text x="30" y="416" class="small" text-anchor="start">连续地址的访问通过线程布局实现合并访存</text></svg>