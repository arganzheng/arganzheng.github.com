<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234.0" viewBox="0 0 760 234" role="img" aria-labelledby="title desc">
<style id="embedded-fonts" type="text/css"><![CDATA[@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'SvgSans';font-weight:500;src:url(data:font/woff2;base64,)}]]></style>
<title id="title">KV Cache 块的 Watermark 分区</title>
  <desc id="desc">KV Cache Blocks 的末尾留出一小段 Watermark 安全余量，其余可正常使用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f" /></marker>
    <style>
      text { font-family:'SvgSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 500; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 500; }
      .small { font-size: 14px; }
      .mono { font-family:'SvgMono','SvgSans', "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0.0" width="760" height="234.0" fill="#fff" />
  <text x="380" y="54.0" text-anchor="middle" class="head" transform="translate(0.000 0.000) ">KV Cache Blocks</text>
  <rect class="seg-b" x="40" y="82.8" width="560" height="115.2" />
  <text x="320" y="149.4" text-anchor="middle" class="bold" transform="translate(0.000 -3.000) ">可正常使用</text>
  <rect class="seg-mark" x="600" y="82.8" width="120" height="115.2" />
  <text x="660" y="133.20000000000002" text-anchor="middle" class="small" transform="translate(0.000 -4.800) ">Watermark</text>
  <text x="660" y="169.20000000000002" text-anchor="middle" class="small" transform="translate(0.000 -4.800) ">安全余量</text>
