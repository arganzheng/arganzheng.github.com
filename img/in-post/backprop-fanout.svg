<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">一个量走了两条路：两路梯度在 x 处相加</title>
  <desc id="d">f = x·y + x，x=2、y=3。记 q = x·y = 6，f = q + x = 8。反向从 ∂f/∂f=1 开始：f = q + x 是加法，对 q 和对 x 的局部导数都是 1，所以传给 q 的梯度是 1 × 1 = 1，直接传给 x 的是 1 × 1 = 1；q = x·y 是乘法，对 x 的局部导数是 y=3，对 y 的局部导数是 x=2，所以传给 x 的是 1 × 3 = 3，传给 y 的是 1 × 2 = 2。x 收到两路梯度 3 和 1，相加得 df/dx = 4。</desc>
  <defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
  <style>.t{fill:#222;font-weight:700;font-size:15px}.f{fill:#222;font-weight:700;font-size:14px}.v{fill:#15803d;font-size:13px}.g{fill:#ea580c;font-size:13px;font-weight:600}.s{fill:#555;font-size:12px}.o{fill:#ea580c;font-size:12.5px;font-weight:600}</style>
  <text x="20" y="26" class="t">一个量走了两条路：f = x·y + x，两路梯度在 x 处相加</text>
  <line x1="20" y1="48" x2="50" y2="48" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/><text x="58" y="52" class="s">前向</text>
  <line x1="100" y1="48" x2="130" y2="48" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/><text x="138" y="52" class="s">反向，边上写「上游梯度 × 局部导数 = 传回的梯度」</text>
  <text x="470" y="52" class="s">节点里：<tspan fill="#15803d">绿 = 前向值</tspan>，<tspan fill="#ea580c">橙 = 损失对它的梯度</tspan></text>
  <line x1="180.0" y1="164.0" x2="334.0" y2="219.7" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="330.0" y1="231.0" x2="176.0" y2="175.3" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="176.8" y1="290.1" x2="330.8" y2="258.2" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="333.2" y1="269.9" x2="179.2" y2="301.8" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="466.0" y1="220.5" x2="630.0" y2="163.1" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="634.0" y1="174.5" x2="470.0" y2="231.9" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="178.0" y1="139.0" x2="632.0" y2="139.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="632.0" y1="151.0" x2="178.0" y2="151.0" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <rect x="46.0" y="110.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="110" y="134" text-anchor="middle" class="f">x</text>
  <text x="110" y="153" text-anchor="middle" class="v">= 2</text>
  <text x="110" y="171" text-anchor="middle" class="g">∂f/∂x = 3 + 1 = 4</text>
  <rect x="46.0" y="275.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="110" y="299" text-anchor="middle" class="f">y</text>
  <text x="110" y="318" text-anchor="middle" class="v">= 3</text>
  <text x="110" y="336" text-anchor="middle" class="g">∂f/∂y = 2</text>
  <rect x="336.0" y="215.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="400" y="239" text-anchor="middle" class="f">q = x·y</text>
  <text x="400" y="258" text-anchor="middle" class="v">= 6</text>
  <text x="400" y="276" text-anchor="middle" class="g">∂f/∂q = 1</text>
  <rect x="636.0" y="110.0" width="128" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="700" y="134" text-anchor="middle" class="f">f = q + x</text>
  <text x="700" y="153" text-anchor="middle" class="v">= 8</text>
  <text x="700" y="171" text-anchor="middle" class="g">∂f/∂f = 1</text>
  <text x="405" y="110" text-anchor="middle" class="s">路径 ②：∂f/∂x（直接）= 1</text>
  <text x="405" y="126" text-anchor="middle" class="o">1 × 1 = 1</text>
  <text x="560" y="236" text-anchor="start" class="s">∂f/∂q = 1</text>
  <text x="560" y="252" text-anchor="start" class="o">1 × 1 = 1</text>
  <text x="270" y="166" text-anchor="middle" class="s">路径 ①：∂q/∂x = y = 3</text>
  <text x="270" y="182" text-anchor="middle" class="o">1 × 3 = 3</text>
  <text x="250" y="318" text-anchor="middle" class="s">∂q/∂y = x = 2</text>
  <text x="250" y="334" text-anchor="middle" class="o">1 × 2 = 2</text>
  <text x="20" y="390" class="s">乘号前面永远是上游梯度（从输出一侧传来的那个数），乘号后面是这条边的局部导数。</text>
  <text x="20" y="408" class="s">x 有两条出边，就收到两路梯度：路径 ① 经过 q 得 3，路径 ② 直接到 f 得 1，相加 3 + 1 = 4。</text>
</svg>
