<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">ΔW = BA 的两种用法：在线时"先过瘦矩阵"，定型后"合并进权重"</text><rect x="40" y="55" width="330" height="240" fill="#f8fafc" stroke="#c9d3df" stroke-width="1" rx="6"/><text x="205" y="75" fill="#333" font-size="12" text-anchor="middle" font-weight="600">在线：训练中 / 多个 adapter 切换</text><rect x="60" y="115" width="44" height="26" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/><text x="82" y="132" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">x</text><text x="82" y="107" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">[1, 4096]</text><line x1="104" y1="128" x2="140" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="140" y="100" width="70" height="56" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="3"/><text x="175" y="125" fill="#1f6fb2" font-size="13" text-anchor="middle" font-weight="600">W</text><text x="175" y="143" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">4096×4096</text><line x1="210" y1="128" x2="280" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="245" y="121" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">33.5 M</text><line x1="82" y1="141" x2="82" y2="215" stroke="#555" stroke-width="1.5"/><line x1="82" y1="215" x2="140" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="140" y="200" width="50" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="165" y="215" fill="#c0392b" font-size="12" text-anchor="middle" font-weight="600">A</text><text x="165" y="226" fill="#c0392b" font-size="9" text-anchor="middle" font-weight="normal">4096×16</text><text x="165" y="247" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">→ [1, 16]</text><line x1="190" y1="215" x2="220" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="205" y="207" fill="#666" font-size="9" text-anchor="middle" font-weight="normal">131 K</text><rect x="220" y="200" width="50" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="245" y="215" fill="#c0392b" font-size="12" text-anchor="middle" font-weight="600">B</text><text x="245" y="226" fill="#c0392b" font-size="9" text-anchor="middle" font-weight="normal">16×4096</text><line x1="270" y1="215" x2="290" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="276" y="241" fill="#666" font-size="9" text-anchor="middle" font-weight="normal">131 K</text><line x1="290" y1="215" x2="290" y2="141" stroke="#555" stroke-width="1.5"/><circle cx="290" cy="128" r="10" fill="#fff" stroke="#555"/><text x="290" y="132" fill="#333" font-size="13" text-anchor="middle" font-weight="normal">+</text><line x1="300" y1="128" x2="340" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="348" y="132" fill="#333" font-size="12" text-anchor="start" font-weight="normal">y</text><text x="205" y="277" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">每步多算 0.26 M FLOPs（不到 W 的 1%）</text><text x="205" y="292" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">A、B 单独存，换 adapter 只换这两个小矩阵</text><rect x="390" y="55" width="330" height="240" fill="#f8fafc" stroke="#c9d3df" stroke-width="1" rx="6"/><text x="555" y="75" fill="#333" font-size="12" text-anchor="middle" font-weight="600">定型：只服务一个 adapter</text><text x="555" y="107" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">训完一次性算 W' = W + BA</text><rect x="450" y="125" width="60" height="44" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.2" rx="3"/><text x="480" y="150" fill="#1f6fb2" font-size="13" text-anchor="middle" font-weight="600">W</text><text x="525" y="151" fill="#333" font-size="14" text-anchor="middle" font-weight="normal">+</text><rect x="540" y="125" width="30" height="44" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="555" y="150" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="normal">B</text><rect x="574" y="139" width="44" height="16" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2" rx="3"/><text x="596" y="151" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="normal">A</text><text x="635" y="151" fill="#333" font-size="14" text-anchor="middle" font-weight="normal">=</text><rect x="650" y="125" width="60" height="44" fill="#e8eef8" stroke="#1f4f8a" stroke-width="1.2" rx="3"/><text x="680" y="150" fill="#1f4f8a" font-size="13" text-anchor="middle" font-weight="600">W'</text><text x="555" y="190" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">BA 算一次：537 M FLOPs，存成 4096×4096</text><rect x="430" y="220" width="44" height="26" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/><text x="452" y="237" fill="#333" font-size="12" text-anchor="middle" font-weight="normal">x</text><line x1="474" y1="233" x2="520" y2="233" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="520" y="213" width="70" height="40" fill="#e8eef8" stroke="#1f4f8a" stroke-width="1.2" rx="3"/><text x="555" y="237" fill="#1f4f8a" font-size="13" text-anchor="middle" font-weight="600">W'</text><line x1="590" y1="233" x2="640" y2="233" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/><text x="648" y="237" fill="#333" font-size="12" text-anchor="start" font-weight="normal">y</text><text x="555" y="277" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">之后每步与原模型一样：33.5 M FLOPs，零额外开销</text><text x="555" y="292" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">代价：A、B 不再单独存在，换 adapter 要重新合并</text><text x="380" y="325" fill="#333" font-size="11" text-anchor="middle" font-weight="normal">两者不矛盾：左边省的是"每一步都重算 BA"（570 M），右边是把它算一次存下来。第三篇 §六再讲 LoRA 本身。</text>
</svg>
