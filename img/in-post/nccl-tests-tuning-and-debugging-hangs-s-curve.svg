<text class="m" x="270.0" y="426.6">斜率 45°（双对数坐标），高度由 α 决定</text>
<text class="s" x="690" y="505.1" text-anchor="end" fill="#444">ring 模型：n = 8，α = 3 µs，β = 400 GB/s（典型值，非实测）</text>
