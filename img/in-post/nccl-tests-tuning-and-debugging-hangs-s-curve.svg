<svg xmlns="http://www.w3.org/2000/svg" width="740" height="577" viewBox="0 0 740 577" role="img" aria-labelledby="s-curve-t s-curve-d">
<title id="s-curve-t">健康的 all_reduce busbw 曲线：S 形与拐点</title>
<desc id="s-curve-d">双对数坐标下 ring 模型（n=8，α=3 µs，β=400 GB/s）的 busbw 曲线。左端延迟主导，busbw 正比于 S，是一条 45° 斜线，高度由 α 决定；S_knee = nαβ ≈ 9.6 MB 处 busbw 为平台的一半；约 9·S_knee 处达到平台的 90%；右端趋于带宽平台 β_eff。</desc>
