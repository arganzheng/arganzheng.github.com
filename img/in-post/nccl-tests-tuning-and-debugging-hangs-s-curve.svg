<text class="m" x="684" y="66.4" text-anchor="end">带宽平台：busbw ≈ β_eff</text>
<text class="m" x="453.9" y="98.4" text-anchor="end">拐点 S_knee = n·α·β ≈ 9.6 MB：</text>
<text class="m" x="453.9" y="116.4" text-anchor="end">α 项与 β 项相当，busbw = 平台的一半</text>
