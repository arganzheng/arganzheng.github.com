<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-labelledby="t d">
  <title id="t">All-to-All Dispatch</title>
  <desc id="d">上排是发送方 GPU 0–3，下排是接收方 GPU 0–3（各自管 16 个 Expert）。每张卡都可能向每张卡发 Token，所以是全对全。GPU 0 的四条边按正文例子标出了发给各卡的 Token。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c3cf"/></marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7a8b9c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .math { font-size: 14px; }
      .mute { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .req { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .comm { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-o { fill: #fde9cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #f9d5cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-light { stroke: #b7c3cf; stroke-width: 1.2; fill: none; marker-end: url(#arrow-light); }
      .arrow-hi { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#arrow-hi); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .dbl { stroke: #5880b4; stroke-width: 4; fill: none; }
      .dbl-in { stroke: #fff; stroke-width: 1.4; fill: none; }
      .dash { stroke: #7a8b9c; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow-axis); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
<text x="20" y="22" text-anchor="start" class="mute">发送方</text>
<text x="20" y="150" text-anchor="start" class="mute">接收方</text>
<rect class="gpu" x="80" y="30" width="120" height="34"/>
<text x="140.0" y="52.0" text-anchor="middle" class="body">GPU 0</text>
<rect class="gpu" x="252" y="30" width="120" height="34"/>
<text x="312.0" y="52.0" text-anchor="middle" class="body">GPU 1</text>
<rect class="gpu" x="424" y="30" width="120" height="34"/>
<text x="484.0" y="52.0" text-anchor="middle" class="body">GPU 2</text>
<rect class="gpu" x="596" y="30" width="120" height="34"/>
<text x="656.0" y="52.0" text-anchor="middle" class="body">GPU 3</text>
<rect class="gpu" x="80" y="130" width="120" height="50"/>
<text x="140.0" y="151.0" text-anchor="middle" class="body">GPU 0</text>
<text x="140.0" y="169.0" text-anchor="middle" class="mono">E0 ~ E15</text>
<text x="140" y="200" text-anchor="middle" class="small">来自 GPU 0：t₀、t₃</text>
<rect class="gpu" x="252" y="130" width="120" height="50"/>
<text x="312.0" y="151.0" text-anchor="middle" class="body">GPU 1</text>
<text x="312.0" y="169.0" text-anchor="middle" class="mono">E16 ~ E31</text>
<text x="312" y="200" text-anchor="middle" class="small">来自 GPU 0：t₁、t₅</text>
<rect class="gpu" x="424" y="130" width="120" height="50"/>
<text x="484.0" y="151.0" text-anchor="middle" class="body">GPU 2</text>
<text x="484.0" y="169.0" text-anchor="middle" class="mono">E32 ~ E47</text>
<text x="484" y="200" text-anchor="middle" class="small">来自 GPU 0：t₂</text>
<rect class="gpu" x="596" y="130" width="120" height="50"/>
<text x="656.0" y="151.0" text-anchor="middle" class="body">GPU 3</text>
<text x="656.0" y="169.0" text-anchor="middle" class="mono">E48 ~ E63</text>
<text x="656" y="200" text-anchor="middle" class="small">来自 GPU 0：t₄</text>
<line x1="306" y1="64" x2="134" y2="130" class="arrow-light"/>
<line x1="312" y1="64" x2="312" y2="130" class="arrow-light"/>
<line x1="318" y1="64" x2="490" y2="130" class="arrow-light"/>
<line x1="324" y1="64" x2="668" y2="130" class="arrow-light"/>
<line x1="472" y1="64" x2="128" y2="130" class="arrow-light"/>
<line x1="478" y1="64" x2="306" y2="130" class="arrow-light"/>
<line x1="484" y1="64" x2="484" y2="130" class="arrow-light"/>
<line x1="490" y1="64" x2="662" y2="130" class="arrow-light"/>
<line x1="638" y1="64" x2="122" y2="130" class="arrow-light"/>
<line x1="644" y1="64" x2="300" y2="130" class="arrow-light"/>
<line x1="650" y1="64" x2="478" y2="130" class="arrow-light"/>
<line x1="656" y1="64" x2="656" y2="130" class="arrow-light"/>
<line x1="140" y1="64" x2="140" y2="130" class="arrow"/>
<line x1="146" y1="64" x2="318" y2="130" class="arrow"/>
<line x1="152" y1="64" x2="496" y2="130" class="arrow"/>
<line x1="158" y1="64" x2="674" y2="130" class="arrow"/>
</svg>
