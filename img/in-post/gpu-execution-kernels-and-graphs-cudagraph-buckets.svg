<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 752" width="760" height="752" role="img" aria-labelledby="t d">
  <title id="t">cudagraph_capture_sizes 的分桶、录图与 dispatch</title>
  <desc id="d">启动时按 capture size × 执行模式 × LoRA 情况拼出 BatchDescriptor 作为 key，每个 key 录一张图存进字典；运行时把实际 batch 向上 pad 到最近的桶、拼出同样的 key 查表，命中就 replay，多出的行白算，查不到或超过上限就走 eager。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="40" y="22" text-anchor="start" class="head">启动时：按 key 录图</text><text x="40" y="46" text-anchor="start" class="mono">cudagraph_capture_sizes</text><rect class="seg-c" x="226" y="30" width="46" height="28"/><text x="249.0" y="49.0" text-anchor="middle" class="small">1</text><rect class="seg-c" x="272" y="30" width="46" height="28"/><text x="295.0" y="49.0" text-anchor="middle" class="small">2</text><rect class="seg-c" x="318" y="30" width="46" height="28"/><text x="341.0" y="49.0" text-anchor="middle" class="small">4</text><rect class="seg-c" x="364" y="30" width="46" height="28"/><text x="387.0" y="49.0" text-anchor="middle" class="small">8</text><rect class="seg-c" x="410" y="30" width="46" height="28"/><text x="433.0" y="49.0" text-anchor="middle" class="small">16</text><rect class="seg-c" x="456" y="30" width="46" height="28"/><text x="479.0" y="49.0" text-anchor="middle" class="small">24</text><rect class="seg-c" x="502" y="30" width="46" height="28"/><text x="525.0" y="49.0" text-anchor="middle" class="small">32</text><rect class="seg-freefrag" x="548" y="30" width="30" height="28"/><text x="563.0" y="49.0" text-anchor="middle" class="small">…</text><rect class="seg-c" x="578" y="30" width="46" height="28"/><text x="601.0" y="49.0" text-anchor="middle" class="small">512</text><text x="40" y="80" text-anchor="start" class="small">每个 size 配上执行模式和 LoRA 情况，拼成 key，每个 key 录一张图：</text><text x="40" y="100" text-anchor="start" class="mono">key = BatchDescriptor(num_tokens=size, num_reqs, uniform, has_lora, num_active_loras)</text><rect x="40" y="114" width="680" height="96" fill="none" stroke="#40566f" stroke-width="1.6"/><text x="52" y="134" text-anchor="start" class="mono">concrete_cudagraph_entries: dict[BatchDescriptor, CUDAGraphEntry]</text><text x="56" y="158" text-anchor="start" class="small">FULL，size=8，uniform=True（纯 decode）</text><text x="412" y="158" text-anchor="start" class="small">→ 一张整图 G8</text><text x="56" y="180" text-anchor="start" class="small">PIECEWISE，size=8，num_reqs=None（混合 batch）</text><text x="412" y="180" text-anchor="start" class="small">→ 一组分段图：按 attention 切开，每段一张</text><text x="56" y="202" text-anchor="start" class="small">FULL / PIECEWISE，size=16 … size=512，× LoRA 取值</text><text x="412" y="202" text-anchor="start" class="small">→ 同上，逐个 key 各录各的</text><text x="40" y="246" text-anchor="start" class="head">运行时：每一步 Decode 的 dispatch</text><rect class="card" x="40" y="262" width="150" height="36"/><text x="115" y="285" text-anchor="middle" class="bold">实际 batch</text><text x="206" y="285" text-anchor="start" class="small">num_tokens = 5（5 个请求各 1 个 token）</text><line x1="115" y1="298" x2="115" y2="316" class="arrow"/><rect class="card" x="40" y="316" width="150" height="36"/><text x="115" y="339" text-anchor="middle" class="bold">pad 到最近的桶</text><text x="206" y="339" text-anchor="start" class="small">_bs_to_padded_graph_size[5] = 8</text><line x1="115" y1="352" x2="115" y2="370" class="arrow"/><rect class="card" x="40" y="370" width="150" height="36"/><text x="115" y="393" text-anchor="middle" class="bold">拼出 key</text><text x="206" y="393" text-anchor="start" class="small">BatchDescriptor(num_tokens=8, uniform=是否纯 decode, LoRA 情况)</text><line x1="115" y1="406" x2="115" y2="424" class="arrow"/><rect class="card" x="40" y="424" width="150" height="36"/><text x="115" y="447" text-anchor="middle" class="bold">查表</text><text x="206" y="447" text-anchor="start" class="small">先找 FULL 的 key，没有就找 PIECEWISE</text><line x1="115" y1="460" x2="115" y2="478" class="arrow"/><rect class="card" x="40" y="478" width="150" height="36"/><text x="115" y="501" text-anchor="middle" class="bold">replay</text><text x="206" y="501" text-anchor="start" class="small">取出录好的图重放；pad 多出的 3 行白算</text><text x="640" y="440" text-anchor="middle" class="small">都不命中，</text><text x="640" y="456" text-anchor="middle" class="small">或 num_tokens &gt; 上限 512</text><path d="M640 462 V486" class="arrow"/><rect class="waiting" x="580" y="486" width="120" height="32"/><text x="640.0" y="507" text-anchor="middle" class="bold">eager</text><text x="40" y="560" text-anchor="start" class="head">例子</text><text x="40" y="584" text-anchor="start" class="bold">实际 decode batch</text><text x="240" y="584" text-anchor="start" class="bold">pad 到</text><text x="340" y="584" text-anchor="start" class="bold">replay</text><text x="480" y="584" text-anchor="start" class="bold">白算的行</text><text x="40" y="608" text-anchor="start" class="small">3 个请求</text><text x="240" y="608" text-anchor="start" class="small">4</text><text x="340" y="608" text-anchor="start" class="small">G4</text><text x="480" y="608" text-anchor="start" class="small">1 / 4</text><text x="40" y="630" text-anchor="start" class="small">5 个请求</text><text x="240" y="630" text-anchor="start" class="small">8</text><text x="340" y="630" text-anchor="start" class="small">G8</text><text x="480" y="630" text-anchor="start" class="small">3 / 8</text><text x="40" y="652" text-anchor="start" class="small">9 个请求</text><text x="240" y="652" text-anchor="start" class="small">16</text><text x="340" y="652" text-anchor="start" class="small">G16</text><text x="480" y="652" text-anchor="start" class="small">7 / 16</text><text x="40" y="674" text-anchor="start" class="small">17 个请求</text><text x="240" y="674" text-anchor="start" class="small">24</text><text x="340" y="674" text-anchor="start" class="small">G24</text><text x="480" y="674" text-anchor="start" class="small">7 / 24</text><text x="40" y="696" text-anchor="start" class="small">200 个请求</text><text x="240" y="696" text-anchor="start" class="small">200</text><text x="340" y="696" text-anchor="start" class="small">G200</text><text x="480" y="696" text-anchor="start" class="small">0</text><text x="40" y="718" text-anchor="start" class="small">600 个请求</text><text x="240" y="718" text-anchor="start" class="small">不 pad</text><text x="340" y="718" text-anchor="start" class="small">eager（dispatch 返回 NONE）</text><text x="480" y="718" text-anchor="start" class="small">——</text>
</svg>
