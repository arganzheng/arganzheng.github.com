<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-labelledby="t d">
  <title id="t">FlashAttention 的 Tiling：只在 SRAM 里出现</title>
  <desc id="d">Q_tile 从 HBM 加载一次，K_tile、V_tile 每轮循环加载；S_tile 与 softmax 统计量 m、l、累加器 O_acc 只在 SRAM 里存在，循环结束后才把 O[N,d] 写回 HBM。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect x="40" y="20" width="190" height="200" fill="none" stroke="#40566f" stroke-width="1.6"/><text x="135" y="44" text-anchor="middle" class="bold">HBM（显存）</text><text x="135" y="64" text-anchor="middle" class="small">Q、K、V 切成小块</text><rect class="seg-b" x="70" y="84" width="130" height="34"/><text x="135.0" y="106.0" text-anchor="middle" class="mono">Q_tile [Bq,d]</text><line x1="230" y1="101" x2="330" y2="101" class="arrow"/><text x="280" y="93" text-anchor="middle" class="small">加载一次</text><rect class="seg-b" x="70" y="128" width="130" height="34"/><text x="135.0" y="150.0" text-anchor="middle" class="mono">K_tile [Bk,d]</text><line x1="230" y1="145" x2="330" y2="145" class="arrow"/><text x="280" y="137" text-anchor="middle" class="small">每轮循环加载</text><rect class="seg-b" x="70" y="172" width="130" height="34"/><text x="135.0" y="194.0" text-anchor="middle" class="mono">V_tile [Bk,d]</text><line x1="230" y1="189" x2="330" y2="189" class="arrow"/><text x="280" y="181" text-anchor="middle" class="small">每轮循环加载</text><rect x="330" y="20" width="300" height="200" fill="none" stroke="#40566f" stroke-width="1.6"/><text x="480" y="44" text-anchor="middle" class="bold">SRAM / Shared Memory</text><text x="342" y="78" text-anchor="start" class="mono">S_tile = Q_tile @ K_tileᵀ  [Bq,Bk]</text><text x="342" y="104" text-anchor="start" class="small">Online Softmax：维护 m [Bq]、l [Bq]</text><text x="342" y="128" text-anchor="start" class="small">O_acc [Bq,d] += P_tile @ V_tile</text><text x="342" y="148" text-anchor="start" class="small">（按新的 m 重缩放后累加）</text><text x="342" y="178" text-anchor="start" class="small">S_tile、P_tile 用完即弃，不写回 HBM</text><text x="342" y="200" text-anchor="start" class="small">m、l、O_acc 全程留在片上</text><line x1="630" y1="120" x2="656" y2="120" class="arrow"/><rect class="seg-b" x="656" y="103" width="84" height="34"/><text x="698.0" y="125.0" text-anchor="middle" class="mono">O [N,d]</text><text x="698" y="160" text-anchor="middle" class="small">循环结束</text><text x="698" y="176" text-anchor="middle" class="small">才写回 HBM</text><text x="40" y="250" text-anchor="start" class="small">HBM 只发生三类访问：Q 读一次、K/V 分块各读一遍、O 写一次；N×N 的中间矩阵从不落地</text>
</svg>
