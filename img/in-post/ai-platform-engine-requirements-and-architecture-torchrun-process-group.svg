<text x="296" y="149.05" text-anchor="middle" class="small">worker RANK 9</text>
<text x="296" y="167.05" text-anchor="middle" class="small">GPU 1</text>
<path d="M217 202 H229" class="line"/>
<text x="237" y="207" text-anchor="start" class="small">…</text>
<path d="M217 250 H225" class="line"/>
<rect class="proc-a" x="225" y="230" width="142" height="40"/>
<text x="296" y="245.05" text-anchor="middle" class="small">worker RANK 15</text>
<text x="296" y="263.05" text-anchor="middle" class="small">GPU 7</text>
<rect class="frame" x="384" y="14" width="176" height="268"/>
<text x="472" y="35" text-anchor="middle" class="bold">节点 2</text>
<rect class="proc-c" x="394" y="46" width="156" height="28"/>
<text x="472" y="63.7" text-anchor="middle" class="mono">torchrun (agent)</text>
<path d="M402 74 V250" class="line"/>
<path d="M402 106 H410" class="line"/>
<rect class="proc-a" x="410" y="86" width="142" height="40"/>
<text x="481" y="101.05" text-anchor="middle" class="small">worker RANK 16</text>
<text x="481" y="119.05" text-anchor="middle" class="small">GPU 0</text>
<path d="M402 154 H414" class="line"/>
<text x="422" y="159" text-anchor="start" class="small">…</text>
<path d="M402 250 H410" class="line"/>
<rect class="proc-a" x="410" y="230" width="142" height="40"/>
<text x="481" y="245.05" text-anchor="middle" class="small">worker RANK 23</text>
<text x="481" y="263.05" text-anchor="middle" class="small">GPU 7</text>
<rect class="frame" x="569" y="14" width="176" height="268"/>
<text x="657" y="35" text-anchor="middle" class="bold">节点 3</text>
<rect class="proc-c" x="579" y="46" width="156" height="28"/>
<text x="657" y="63.7" text-anchor="middle" class="mono">torchrun (agent)</text>
<path d="M587 74 V250" class="line"/>
<path d="M587 106 H595" class="line"/>
<rect class="proc-a" x="595" y="86" width="142" height="40"/>
<text x="666" y="101.05" text-anchor="middle" class="small">worker RANK 24</text>
<text x="666" y="119.05" text-anchor="middle" class="small">GPU 0</text>
<path d="M587 154 H599" class="line"/>
<text x="607" y="159" text-anchor="start" class="small">…</text>
<path d="M587 250 H595" class="line"/>
<rect class="proc-a" x="595" y="230" width="142" height="40"/>
<text x="666" y="245.05" text-anchor="middle" class="small">worker RANK 31</text>
<text x="666" y="263.05" text-anchor="middle" class="small">GPU 7</text>
<rect class="proc-b" x="40" y="326" width="680" height="50"/>
<text x="380" y="346" text-anchor="middle" class="bold">rendezvous</text>
<text x="380" y="365" text-anchor="middle" class="mono">--rdzv-backend=c10d --rdzv-endpoint=&lt;节点 0 地址&gt;:29400 --rdzv-id=&lt;任务 ID&gt;</text>
<path d="M102.0 282 V326" class="arrow"/>
<path d="M287.0 282 V326" class="arrow"/>
<path d="M472.0 282 V326" class="arrow"/>
<path d="M657.0 282 V326" class="arrow"/>
</svg>
