<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1380" role="img" aria-labelledby="title desc">
  <title id="title">从感知机到 Transformer：深度模型演进时间线</title>
  <desc id="desc">按历史阶段展示 1943 至 2017 年的神经网络节点、兴起与寒冬，并延伸到 GPT-3 和 ChatGPT。</desc>
  <defs>
    <style>
      text { font-family: "Arial Unicode MS", "PingFang SC", sans-serif; fill: #283344; }
      .heading { font-size: 34px; font-weight: 700; }
      .subheading { font-size: 18px; fill: #596579; }
      .phase { font-size: 20px; font-weight: 700; }
      .event { font-size: 22px; font-weight: 600; }
      .year { font-size: 18px; fill: #526176; }
      .axis { fill: none; stroke: #526176; stroke-width: 3; stroke-linecap: round; }
      .leader { stroke: #718096; stroke-width: 1.5; stroke-dasharray: 4 5; }
      .node { fill: #fffdf8; stroke: #35445c; stroke-width: 3; }
      .note { font-size: 15px; fill: #596579; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#35445c"/>
    </marker>
  </defs>
  <rect width="1900" height="1380" fill="#fffdf8"/>
  <text class="heading" x="70" y="92">从感知机到 Transformer</text>
  <text class="subheading" x="72" y="124">节点按阶段非线性排布以留出注释空间；兴起与寒冬是历史概括，右侧延伸至 2020+ LLM</text>

  <rect x="80" y="165" width="360" height="54" rx="8" fill="#e8e9ec" stroke="#8e98a8" stroke-width="2"/>
  <rect x="445" y="165" width="450" height="54" rx="8" fill="#dcebdc" stroke="#77a17f" stroke-width="2"/>
  <rect x="900" y="165" width="345" height="54" rx="8" fill="#f4e0d9" stroke="#c98679" stroke-width="2"/>
  <rect x="1250" y="165" width="465" height="54" rx="8" fill="#dcebdc" stroke="#77a17f" stroke-width="2"/>
  <text class="phase" x="260" y="199" text-anchor="middle">理论前史 · 1943–1956</text>
  <text class="phase" x="670" y="199" text-anchor="middle">第一次兴起 · 1957–1969</text>
  <text class="phase" x="1072" y="199" text-anchor="middle">第一次寒冬 · 1969–1980</text>
  <text class="phase" x="1482" y="199" text-anchor="middle">第二次兴起 · 1980–1989</text>

  <path class="axis" d="M90 510 H1730"/>
  <g>
    <path class="leader" d="M110 502 V372"/><circle class="node" cx="110" cy="510" r="7"/>
    <text class="event" x="110" y="310" text-anchor="middle"><tspan x="110">McCulloch–Pitts</tspan><tspan class="year" x="110" dy="23">1943 · 阈值神经元</tspan></text>

    <path class="leader" d="M260 518 V600"/><circle class="node" cx="260" cy="510" r="7"/>
    <text class="event" x="260" y="625" text-anchor="middle"><tspan x="260">图灵测试</tspan><tspan class="year" x="260" dy="23">1950</tspan></text>

    <path class="leader" d="M410 502 V372"/><circle class="node" cx="410" cy="510" r="7"/>
    <text class="event" x="410" y="310" text-anchor="middle"><tspan x="410">达特茅斯会议</tspan><tspan class="year" x="410" dy="23">1956 · AI 研究议程</tspan></text>

    <path class="leader" d="M560 518 V600"/><circle class="node" cx="560" cy="510" r="7"/>
    <text class="event" x="560" y="625" text-anchor="middle"><tspan x="560">Rosenblatt 感知机报告</tspan><tspan class="year" x="560" dy="23">1957</tspan></text>

    <path class="leader" d="M710 502 V372"/><circle class="node" cx="710" cy="510" r="7"/>
    <text class="event" x="710" y="310" text-anchor="middle"><tspan x="710">感知机论文</tspan><tspan class="year" x="710" dy="23">1958 · Psychological Review</tspan></text>

    <path class="leader" d="M860 518 V600"/><circle class="node" cx="860" cy="510" r="7"/>
    <text class="event" x="860" y="625" text-anchor="middle"><tspan x="860">ADALINE · Widrow–Hoff</tspan><tspan class="year" x="860" dy="23">1960</tspan></text>

    <path class="leader" d="M1010 502 V372"/><circle class="node" cx="1010" cy="510" r="7"/>
    <text class="event" x="1010" y="310" text-anchor="middle"><tspan x="1010">Minsky &amp; Papert</tspan><tspan class="year" x="1010" dy="23">1969 · Perceptrons</tspan></text>

    <path class="leader" d="M1160 518 V600"/><circle class="node" cx="1160" cy="510" r="7"/>
    <text class="event" x="1160" y="625" text-anchor="middle"><tspan x="1160">Neocognitron · 福岛邦彦</tspan><tspan class="year" x="1160" dy="23">1980</tspan></text>

    <path class="leader" d="M1310 502 V372"/><circle class="node" cx="1310" cy="510" r="7"/>
    <text class="event" x="1310" y="310" text-anchor="middle"><tspan x="1310">反向传播</tspan><tspan class="year" x="1310" dy="23">1986 · Rumelhart 等</tspan></text>

    <path class="leader" d="M1460 518 V600"/><circle class="node" cx="1460" cy="510" r="7"/>
    <text class="event" x="1460" y="625" text-anchor="middle"><tspan x="1460">LeCun 卷积网络</tspan><tspan class="year" x="1460" dy="23">1989 · 手写邮编识别</tspan></text>

    <path class="leader" d="M1610 502 V372"/><circle class="node" cx="1610" cy="510" r="7"/>
    <text class="event" x="1610" y="310" text-anchor="middle"><tspan x="1610">万能逼近定理</tspan><tspan class="year" x="1610" dy="23">1989 · Cybenko；Hornik 等</tspan></text>
  </g>

  <rect x="80" y="780" width="650" height="56" rx="8" fill="#f4e0d9" stroke="#c98679" stroke-width="2"/>
  <rect x="735" y="780" width="980" height="56" rx="8" fill="#dcebdc" stroke="#77a17f" stroke-width="2"/>
  <text class="phase" x="405" y="815" text-anchor="middle">第二次寒冬 · 1990s–2006</text>
  <text class="phase" x="1225" y="815" text-anchor="middle">第三次兴起 · 2006–2017</text>

  <rect x="1715" y="945" width="160" height="255" rx="10" fill="#eef0f7" stroke="#7584a4" stroke-width="2"/>
  <path class="axis" d="M90 1090 H1718" marker-end="url(#arrow)"/>
  <text class="phase" x="1795" y="989" text-anchor="middle">2020+</text>
  <text class="event" x="1795" y="1030" text-anchor="middle">GPT-3</text>
  <text class="year" x="1795" y="1053" text-anchor="middle">2020</text>
  <text class="event" x="1795" y="1130" text-anchor="middle">ChatGPT</text>
  <text class="year" x="1795" y="1153" text-anchor="middle">2022</text>

  <g>
    <path class="leader" d="M130 1082 V963"/><circle class="node" cx="130" cy="1090" r="7"/>
    <text class="event" x="130" y="920" text-anchor="middle"><tspan x="130">SVM</tspan><tspan class="year" x="130" dy="23">1995 · 核方法与间隔</tspan></text>

    <path class="leader" d="M270 1098 V1172"/><circle class="node" cx="270" cy="1090" r="7"/>
    <text class="event" x="270" y="1196" text-anchor="middle"><tspan x="270">LSTM</tspan><tspan class="year" x="270" dy="23">1997 · Hochreiter &amp; Schmidhuber</tspan></text>

    <path class="leader" d="M410 1082 V963"/><circle class="node" cx="410" cy="1090" r="7"/>
    <text class="event" x="410" y="920" text-anchor="middle"><tspan x="410">LeNet-5</tspan><tspan class="year" x="410" dy="23">1998 · 手写识别</tspan></text>

    <path class="leader" d="M700 1098 V1172"/><circle class="node" cx="700" cy="1090" r="7"/>
    <text class="event" x="700" y="1196" text-anchor="middle"><tspan x="700">DBN · 逐层预训练</tspan><tspan class="year" x="700" dy="23">2006</tspan></text>

    <path class="leader" d="M970 1082 V963"/><circle class="node" cx="970" cy="1090" r="7"/>
    <text class="event" x="970" y="920" text-anchor="middle"><tspan x="970">AlexNet</tspan><tspan class="year" x="970" dy="23">2012 · ImageNet</tspan></text>

    <path class="leader" d="M1120 1098 V1172"/><circle class="node" cx="1120" cy="1090" r="7"/>
    <text class="event" x="1120" y="1196" text-anchor="middle"><tspan x="1120">Word2Vec</tspan><tspan class="year" x="1120" dy="23">2013</tspan></text>

    <path class="leader" d="M1260 1082 V963"/><circle class="node" cx="1260" cy="1090" r="7"/>
    <text class="event" x="1260" y="920" text-anchor="middle"><tspan x="1260">seq2seq + Bahdanau attention</tspan><tspan class="year" x="1260" dy="23">2014</tspan></text>

    <path class="leader" d="M1400 1098 V1172"/><circle class="node" cx="1400" cy="1090" r="7"/>
    <text class="event" x="1400" y="1196" text-anchor="middle"><tspan x="1400">GAN · Goodfellow 等</tspan><tspan class="year" x="1400" dy="23">2014</tspan></text>

    <path class="leader" d="M1530 1082 V963"/><circle class="node" cx="1530" cy="1090" r="7"/>
    <text class="event" x="1530" y="920" text-anchor="middle"><tspan x="1530">ResNet</tspan><tspan class="year" x="1530" dy="23">2015</tspan></text>

    <path class="leader" d="M1600 1098 V1172"/><circle class="node" cx="1600" cy="1090" r="7"/>
    <text class="event" x="1600" y="1196" text-anchor="middle"><tspan x="1600">Transformer</tspan><tspan class="year" x="1600" dy="23">2017 · Attention Is All You Need</tspan></text>
  </g>
</svg>
