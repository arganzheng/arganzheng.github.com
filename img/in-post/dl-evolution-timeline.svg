<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1308" viewBox="0 0 760 1308" role="img" aria-labelledby="title desc">
<title id="title">从感知机到 Transformer：深度模型演进时间线</title>
<desc id="desc">竖向时间线：左侧色块为三次兴起与两次寒冬的近似分期，右侧每行一个事件，按年份先后排列。</desc>
<style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#283344}.h{font-size:24px;font-weight:bold}.sub{font-size:13.5px;fill:#596579}.phase{font-size:17px;font-weight:bold}.range{font-size:13.5px;fill:#465266}.yr{font-size:15px;font-weight:bold;fill:#35445c}.name{font-size:15.5px;font-weight:600}.desc{font-size:13.5px;fill:#5d6a7e;font-weight:normal}.axis{stroke:#9aa4b4;stroke-width:2}.dot{fill:#fffdf8;stroke:#35445c;stroke-width:2.4}</style>
<rect width="760" height="1308" fill="#fffdf8"/>
<text class="h" x="16" y="36">从感知机到 Transformer</text>
<text class="sub" x="16" y="62">每行一个事件，按年份先后排列，行距不代表时间长短；左侧色块为近似的历史分期。</text>
