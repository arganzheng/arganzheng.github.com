<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" role="img" aria-labelledby="t d">
  <title id="t">TP=8 到 TP=2 的 KV head 重组</title>
  <desc id="d">P 的 8 个 rank 各持有 1 个 KV head；D 的每个 rank 需要 4 个 head，要从 P 的 4 个 rank 各读一段，再按自己的布局写入目标块。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-s" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-hold { fill: #fff8ec; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); marker-start: url(#arrow-s); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .thin { stroke: #7a8b9c; stroke-width: 1.2; fill: none; }
      .grid { stroke: #dde4ec; stroke-width: 1; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="192" fill="#fff"/>
<text x="20" y="30" text-anchor="start" class="head">P 实例，TP=8：</text>
<text x="20" y="52" text-anchor="start" class="body">每个 rank 持有 1 个 KV head</text>
<rect class="seg-a" x="250" y="16" width="56" height="46"/>
<text x="278" y="34.55" text-anchor="middle" class="small">rank 0</text>
<text x="278" y="52.55" text-anchor="middle" class="mono">h0</text>
<rect class="seg-a" x="312" y="16" width="56" height="46"/>
<text x="340" y="34.55" text-anchor="middle" class="small">rank 1</text>
<text x="340" y="52.55" text-anchor="middle" class="mono">h1</text>
<rect class="seg-a" x="374" y="16" width="56" height="46"/>
<text x="402" y="34.55" text-anchor="middle" class="small">rank 2</text>
<text x="402" y="52.55" text-anchor="middle" class="mono">h2</text>
<rect class="seg-a" x="436" y="16" width="56" height="46"/>
<text x="464" y="34.55" text-anchor="middle" class="small">rank 3</text>
<text x="464" y="52.55" text-anchor="middle" class="mono">h3</text>
<rect class="seg-a" x="498" y="16" width="56" height="46"/>
<text x="526" y="34.55" text-anchor="middle" class="small">rank 4</text>
<text x="526" y="52.55" text-anchor="middle" class="mono">h4</text>
<rect class="seg-a" x="560" y="16" width="56" height="46"/>
<text x="588" y="34.55" text-anchor="middle" class="small">rank 5</text>
<text x="588" y="52.55" text-anchor="middle" class="mono">h5</text>
<rect class="seg-a" x="622" y="16" width="56" height="46"/>
<text x="650" y="34.55" text-anchor="middle" class="small">rank 6</text>
<text x="650" y="52.55" text-anchor="middle" class="mono">h6</text>
<rect class="seg-a" x="684" y="16" width="56" height="46"/>
<text x="712" y="34.55" text-anchor="middle" class="small">rank 7</text>
<text x="712" y="52.55" text-anchor="middle" class="mono">h7</text>
<rect class="seg-b" x="250" y="112" width="242" height="64"/>
<text x="371" y="130.55" text-anchor="middle" class="small">rank 0</text>
<text x="371" y="148.55" text-anchor="middle" class="small">需要 h0 h1 h2 h3</text>
<text x="371" y="166.55" text-anchor="middle" class="small">从 P 的 rank 0～3 各读一段</text>
<path d="M278 62 V112" class="arrow"/>
<path d="M340 62 V112" class="arrow"/>
<path d="M402 62 V112" class="arrow"/>
<path d="M464 62 V112" class="arrow"/>
<rect class="seg-b" x="498" y="112" width="242" height="64"/>
<text x="619" y="130.55" text-anchor="middle" class="small">rank 1</text>
<text x="619" y="148.55" text-anchor="middle" class="small">需要 h4 h5 h6 h7</text>
<text x="619" y="166.55" text-anchor="middle" class="small">从 P 的 rank 4～7 各读一段</text>
<path d="M526 62 V112" class="arrow"/>
<path d="M588 62 V112" class="arrow"/>
<path d="M650 62 V112" class="arrow"/>
<path d="M712 62 V112" class="arrow"/>
<text x="20" y="130" text-anchor="start" class="head">D 实例，TP=2：</text>
<text x="20" y="152" text-anchor="start" class="body">每个 rank 需要 4 个 KV head，</text>
<text x="20" y="172" text-anchor="start" class="body">按自己的布局写入目标块</text>
</svg>
