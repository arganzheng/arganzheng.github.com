<text x="458.0" y="128.0" text-anchor="middle" class="monob">2'</text>
<text x="510.0" y="102.0" text-anchor="middle" class="mutedmono">x[7]</text>
<rect x="484.0" y="108.0" width="52.0" height="30.0" class="b3 cell"/>
<text x="510.0" y="128.0" text-anchor="middle" class="monob">3'</text>
<path d="M146.0,138 L146.0,150 L354.0,150 L354.0,138" class="line" style="stroke:#3d7ab8;stroke-width:2"/>
<text x="560.0" y="122.0" class="mono">平面 0 = (x[0], x[4])</text>
<path d="M198.0,138 L198.0,162 L406.0,162 L406.0,138" class="line" style="stroke:#d9822b;stroke-width:2"/>
<text x="560.0" y="139.0" class="mono">平面 1 = (x[1], x[5])</text>
<path d="M250.0,138 L250.0,174 L458.0,174 L458.0,138" class="line" style="stroke:#3f9b4f;stroke-width:2"/>
<text x="560.0" y="156.0" class="mono">平面 2 = (x[2], x[6])</text>
<path d="M302.0,138 L302.0,186 L510.0,186 L510.0,138" class="line" style="stroke:#8a5cb8;stroke-width:2"/>
<text x="560.0" y="173.0" class="mono">平面 3 = (x[3], x[7])</text>
<text x="120.0" y="212.0" class="body">线程 j 读 x[j] 与 x[j+4]：warp 读两段各 32 个连续元素</text>
<text x="24.0" y="256.0" class="bold">GPT-J（interleaved）</text>
<text x="195.9" y="256.0" class="body">第 j 个平面 = (x[2j], x[2j+1])</text>
<text x="106.0" y="308.0" text-anchor="end" class="monob">x</text>
<text x="146.0" y="282.0" text-anchor="middle" class="mutedmono">x[0]</text>
<rect x="120.0" y="288.0" width="52.0" height="30.0" class="b0 cell"/>
<text x="146.0" y="308.0" text-anchor="middle" class="monob">0</text>
<text x="198.0" y="282.0" text-anchor="middle" class="mutedmono">x[1]</text>
<rect x="172.0" y="288.0" width="52.0" height="30.0" class="b0 cell"/>
<text x="198.0" y="308.0" text-anchor="middle" class="monob">0'</text>
<text x="250.0" y="282.0" text-anchor="middle" class="mutedmono">x[2]</text>
<rect x="224.0" y="288.0" width="52.0" height="30.0" class="b1 cell"/>
<text x="250.0" y="308.0" text-anchor="middle" class="monob">1</text>
<text x="302.0" y="282.0" text-anchor="middle" class="mutedmono">x[3]</text>
<rect x="276.0" y="288.0" width="52.0" height="30.0" class="b1 cell"/>
<text x="302.0" y="308.0" text-anchor="middle" class="monob">1'</text>
<text x="354.0" y="282.0" text-anchor="middle" class="mutedmono">x[4]</text>
<rect x="328.0" y="288.0" width="52.0" height="30.0" class="b2 cell"/>
<text x="354.0" y="308.0" text-anchor="middle" class="monob">2</text>
<text x="406.0" y="282.0" text-anchor="middle" class="mutedmono">x[5]</text>
<rect x="380.0" y="288.0" width="52.0" height="30.0" class="b2 cell"/>
<text x="406.0" y="308.0" text-anchor="middle" class="monob">2'</text>
<text x="458.0" y="282.0" text-anchor="middle" class="mutedmono">x[6]</text>
<rect x="432.0" y="288.0" width="52.0" height="30.0" class="b3 cell"/>
<text x="458.0" y="308.0" text-anchor="middle" class="monob">3</text>
<text x="510.0" y="282.0" text-anchor="middle" class="mutedmono">x[7]</text>
<rect x="484.0" y="288.0" width="52.0" height="30.0" class="b3 cell"/>
