<text x="250.0" y="128.0" text-anchor="middle" class="monob">2</text>
<text x="302.0" y="102.0" text-anchor="middle" class="mutedmono">x[3]</text>
<rect x="276.0" y="108.0" width="52.0" height="30.0" class="b3 cell"/>
<text x="302.0" y="128.0" text-anchor="middle" class="monob">3</text>
<text x="354.0" y="102.0" text-anchor="middle" class="mutedmono">x[4]</text>
<rect x="328.0" y="108.0" width="52.0" height="30.0" class="b0 cell"/>
<text x="354.0" y="128.0" text-anchor="middle" class="monob">0'</text>
<text x="406.0" y="102.0" text-anchor="middle" class="mutedmono">x[5]</text>
<rect x="380.0" y="108.0" width="52.0" height="30.0" class="b1 cell"/>
<text x="406.0" y="128.0" text-anchor="middle" class="monob">1'</text>
<text x="458.0" y="102.0" text-anchor="middle" class="mutedmono">x[6]</text>
