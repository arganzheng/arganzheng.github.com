<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img" aria-labelledby="t d">
  <title id="t">Coalesce 之后循环体里的多余转换</title>
  <desc id="d">Coalesce 之后 matmul 循环体的三段 def-use 链，橙色箭头是 convert_layout，灰色箭头是作为操作数或产出结果。A 的指针：%arg10 指针 #blocked1 经 convert 变成 %59 指针 #blocked6，交给 tt.load，为 load 服务。A 的 load 结果：tt.load 产出 %60 #blocked6，convert 到 %61 #blocked1，再 convert 到 %65 #dot_op&lt;parent=#blocked8&gt;，交给 tt.dot；中间的 #blocked1 毫无用处。累加器：%arg12 #blocked 经 convert 变成 %67 #blocked8 进 tt.dot，结果 %68 #blocked8 再 convert 回 %69 #blocked，每轮两次。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #222; }
      .rowt { font-size: 13px; font-weight: 700; }
      .leg { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Noto Sans CJK SC", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; }
      .val { fill: #eaf2fb; stroke: #2c6fad; stroke-width: 1.2; }
      .bad { fill: #fde2e1; stroke: #c0392b; stroke-width: 1.2; }
      .op { fill: #ececec; stroke: #555; stroke-width: 1.2; }
      .cvt { stroke: #d35400; stroke-width: 2; }
      .use { stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="ac" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d35400"/></marker>
    <marker id="au" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <line class="cvt" x1="16" y1="18" x2="48" y2="18" marker-end="url(#ac)"/>
  <text class="leg" x="56" y="22"><tspan class="mono">convert_layout</tspan></text>
  <line class="use" x1="168" y1="18" x2="200" y2="18" marker-end="url(#au)"/>
  <text class="leg" x="208" y="22">作为操作数 / 产出结果</text>
  <text class="rowt" x="16" y="58">A 的指针：为 load 服务</text>
  <rect class="val" x="16" y="66" width="120" height="54"/>
  <text class="mono" x="76.0" y="89.5" text-anchor="middle">%arg10 指针</text>
  <text class="monob" x="76.0" y="104.5" text-anchor="middle">#blocked1</text>
  <rect class="val" x="168" y="66" width="120" height="54"/>
  <text class="mono" x="228.0" y="89.5" text-anchor="middle">%59 指针</text>
  <text class="monob" x="228.0" y="104.5" text-anchor="middle">#blocked6</text>
  <rect class="op" x="320" y="66" width="120" height="54"/>
  <text class="monob" x="380.0" y="97.0" text-anchor="middle">tt.load</text>
  <line class="cvt" x1="136" y1="93.0" x2="168" y2="93.0" marker-end="url(#ac)"/>
  <line class="use" x1="288" y1="93.0" x2="320" y2="93.0" marker-end="url(#au)"/>
  <text class="rowt" x="16" y="154">A 的 load 结果：中间的 #blocked1 毫无用处</text>
  <rect class="op" x="16" y="162" width="120" height="54"/>
  <text class="monob" x="76.0" y="193.0" text-anchor="middle">tt.load</text>
  <rect class="val" x="168" y="162" width="120" height="54"/>
  <text class="mono" x="228.0" y="185.5" text-anchor="middle">%60</text>
  <text class="monob" x="228.0" y="200.5" text-anchor="middle">#blocked6</text>
  <rect class="bad" x="320" y="162" width="120" height="54"/>
  <text class="mono" x="380.0" y="185.5" text-anchor="middle">%61</text>
  <text class="monob" x="380.0" y="200.5" text-anchor="middle">#blocked1</text>
  <rect class="val" x="472" y="162" width="120" height="54"/>
  <text class="mono" x="532.0" y="178.0" text-anchor="middle">%65</text>
  <text class="monob" x="532.0" y="193.0" text-anchor="middle">#dot_op&lt;parent=</text>
  <text class="monob" x="532.0" y="208.0" text-anchor="middle">#blocked8&gt;</text>
  <rect class="op" x="624" y="162" width="120" height="54"/>
  <text class="monob" x="684.0" y="193.0" text-anchor="middle">tt.dot</text>
  <line class="use" x1="136" y1="189.0" x2="168" y2="189.0" marker-end="url(#au)"/>
  <line class="cvt" x1="288" y1="189.0" x2="320" y2="189.0" marker-end="url(#ac)"/>
  <line class="cvt" x1="440" y1="189.0" x2="472" y2="189.0" marker-end="url(#ac)"/>
  <line class="use" x1="592" y1="189.0" x2="624" y2="189.0" marker-end="url(#au)"/>
  <text class="rowt" x="16" y="250">累加器：每轮两次</text>
  <rect class="val" x="16" y="258" width="120" height="54"/>
  <text class="mono" x="76.0" y="281.5" text-anchor="middle">%arg12</text>
  <text class="monob" x="76.0" y="296.5" text-anchor="middle">#blocked</text>
  <rect class="val" x="168" y="258" width="120" height="54"/>
  <text class="mono" x="228.0" y="281.5" text-anchor="middle">%67</text>
  <text class="monob" x="228.0" y="296.5" text-anchor="middle">#blocked8</text>
  <rect class="op" x="320" y="258" width="120" height="54"/>
  <text class="monob" x="380.0" y="289.0" text-anchor="middle">tt.dot</text>
  <rect class="val" x="472" y="258" width="120" height="54"/>
  <text class="mono" x="532.0" y="281.5" text-anchor="middle">%68</text>
  <text class="monob" x="532.0" y="296.5" text-anchor="middle">#blocked8</text>
  <rect class="val" x="624" y="258" width="120" height="54"/>
  <text class="mono" x="684.0" y="281.5" text-anchor="middle">%69</text>
  <text class="monob" x="684.0" y="296.5" text-anchor="middle">#blocked</text>
  <line class="cvt" x1="136" y1="285.0" x2="168" y2="285.0" marker-end="url(#ac)"/>
  <line class="use" x1="288" y1="285.0" x2="320" y2="285.0" marker-end="url(#au)"/>
  <line class="use" x1="440" y1="285.0" x2="472" y2="285.0" marker-end="url(#au)"/>
  <line class="cvt" x1="592" y1="285.0" x2="624" y2="285.0" marker-end="url(#ac)"/>
</svg>
