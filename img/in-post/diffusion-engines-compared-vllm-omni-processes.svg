<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
  <title id="t">vllm serve --omni 的 stage 进程</title>
  <desc id="d">API server 进程里有 FastAPI、AsyncOmni、AsyncOmniEngine 和 Orchestrator 线程。FLUX 只有一个 diffusion stage（stage 0），单副本时 DiffusionEngine 用 inline 方式跑在这个进程里；多 stage、多副本或用 --stage-id 单独启动时，StageDiffusionClient 经 ZMQ PUSH/PULL 把请求发给独立的 StageDiffusionProc 进程，DiffusionEngine 在那里跑。两种情况下 DiffusionEngine 都含 RequestScheduler / StepScheduler 和 MultiprocDiffusionExecutor，多卡时执行器起 N 个 WorkerProc 进程并用共享内存 MessageQueue 派任务，每个 WorkerProc 里是 DiffusionWorker → DiffusionModelRunner，持有 models/flux 的 pipeline 与 transformer。</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; }
      .ttl { font-size: 14px; font-weight: 700; }
      .ttl2 { font-size: 13px; font-weight: 700; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
      .cmd { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .lbl { font-size: 12px; fill: #333; }
      .note { font-size: 12px; fill: #444; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" class="cmd">vllm serve black-forest-labs/FLUX.1-dev --omni --port 8091</text>
  <rect x="20" y="50" width="310" height="222" fill="#f3f5f8" stroke="#7d8a99" stroke-width="1.3"/>
  <text x="34" y="76" class="ttl">API server 进程</text>
  <text x="34" y="102" class="mono">entrypoints/openai/：FastAPI</text>
  <text x="34" y="122" class="mono">AsyncOmni → AsyncOmniEngine</text>
  <text x="34" y="142" class="mono">Orchestrator 线程</text>
  <text x="34" y="162" class="mono">StageDiffusionClient（非 inline）</text>
  <rect x="430" y="50" width="310" height="222" fill="#f3f5f8" stroke="#7d8a99" stroke-width="1.3"/>
  <text x="444" y="76" class="ttl">StageDiffusionProc 进程</text>
  <text x="444" y="102" class="mono">stage_diffusion_proc.py</text>
  <text x="444" y="122" class="mono">多 stage、多副本或 --stage-id 时才有</text>
  <rect x="34" y="182" width="282" height="76" fill="#fff7e0" stroke="#c98a00" stroke-width="1.3"/>
  <text x="46" y="204" class="ttl2">stage 0：DiffusionEngine（inline）</text>
  <text x="46" y="226" class="mono">RequestScheduler / StepScheduler</text>
  <text x="46" y="246" class="mono">MultiprocDiffusionExecutor（多卡）</text>
  <rect x="444" y="182" width="282" height="76" fill="#fff7e0" stroke="#c98a00" stroke-width="1.3"/>
  <text x="456" y="204" class="ttl2">stage 0：DiffusionEngine</text>
  <text x="456" y="226" class="mono">RequestScheduler / StepScheduler</text>
  <text x="456" y="246" class="mono">MultiprocDiffusionExecutor（多卡）</text>
  <line x1="330" y1="158" x2="430" y2="158" class="ln" marker-end="url(#ar)"/>
  <text x="380.0" y="150" class="lbl" text-anchor="middle">ZMQ</text>
  <text x="380.0" y="175" class="lbl" text-anchor="middle">PUSH / PULL</text>
  <rect x="128" y="348" width="520" height="76" fill="#eef6ff" stroke="#5b8fd6" stroke-width="1.3"/>
  <rect x="124" y="344" width="520" height="76" fill="#eef6ff" stroke="#5b8fd6" stroke-width="1.3"/>
  <rect x="120" y="340" width="520" height="76" fill="#eef6ff" stroke="#5b8fd6" stroke-width="1.3"/>
  <text x="134" y="364" class="ttl">WorkerProc × N 进程</text>
  <text x="134" y="388" class="mono">DiffusionWorker → DiffusionModelRunner</text>
  <text x="134" y="406" class="mono">models/flux/pipeline_flux.py + flux_transformer.py</text>
  <line x1="175.0" y1="258" x2="175.0" y2="340" class="ln" marker-end="url(#ar)"/>
  <line x1="585.0" y1="258" x2="585.0" y2="340" class="ln" marker-end="url(#ar)"/>
  <text x="185.0" y="300" class="lbl">起 N 个进程</text>
  <text x="185.0" y="318" class="lbl">shm MessageQueue 派任务</text>
  <text x="575.0" y="300" class="lbl" text-anchor="end">起 N 个进程</text>
  <text x="575.0" y="318" class="lbl" text-anchor="end">shm MessageQueue 派任务</text>
</svg>
