<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-labelledby="t d">
  <title id="t">每线程 4 B 与 16 B 一条 warp 加载的字节数</title>
  <desc id="d">按字节比例画。每线程 4 B（float）：线程 0…31 各 4 B，一条 warp 加载 = 128 B，正好 4 个 sector、1 条 cache line。每线程 16 B（float4）：线程 0、1 … 31 各 16 B，一条 warp 加载 = 512 B，16 个 sector、4 条 cache line。同样是 4 个 sector 一组连续，但一条指令搬 4 倍的字节，在飞的请求也多 4 倍。</desc>
