<text x="295.0" y="120.0" text-anchor="middle" class="body">rank 1</text>
<text x="295.0" y="138.0" text-anchor="middle" class="small">GPU 1</text>
<line x1="237" y1="124" x2="253" y2="124" class="dbl"/>
<line x1="237" y1="124" x2="253" y2="124" class="dbl-in"/>
<rect class="gpu" x="153" y="184" width="84" height="40"/>
<text x="195.0" y="200.0" text-anchor="middle" class="body">rank 2</text>
<text x="195.0" y="218.0" text-anchor="middle" class="small">GPU 2</text>
<rect class="gpu" x="253" y="184" width="84" height="40"/>
<text x="295.0" y="200.0" text-anchor="middle" class="body">rank 3</text>
<text x="295.0" y="218.0" text-anchor="middle" class="small">GPU 3</text>
<line x1="237" y1="204" x2="253" y2="204" class="dbl"/>
<line x1="237" y1="204" x2="253" y2="204" class="dbl-in"/>
<line x1="195" y1="144" x2="195" y2="184" class="arrow"/>
<line x1="295" y1="144" x2="295" y2="184" class="arrow"/>
<text x="245" y="168" text-anchor="middle" class="mute">send/recv</text>
<rect class="frame" x="470" y="50" width="270" height="196"/>
<text x="605" y="72" text-anchor="middle" class="bold">Node 1：DP rank 1（副本 1）</text>
<text x="555" y="92" text-anchor="middle" class="mute">TP rank 0</text>
<text x="655" y="92" text-anchor="middle" class="mute">TP rank 1</text>
<rect class="gpu" x="513" y="104" width="84" height="40"/>
<text x="555.0" y="120.0" text-anchor="middle" class="body">rank 4</text>
<text x="555.0" y="138.0" text-anchor="middle" class="small">GPU 0</text>
<rect class="gpu" x="613" y="104" width="84" height="40"/>
<text x="655.0" y="120.0" text-anchor="middle" class="body">rank 5</text>
<text x="655.0" y="138.0" text-anchor="middle" class="small">GPU 1</text>
<line x1="597" y1="124" x2="613" y2="124" class="dbl"/>
<line x1="597" y1="124" x2="613" y2="124" class="dbl-in"/>
<rect class="gpu" x="513" y="184" width="84" height="40"/>
<text x="555.0" y="200.0" text-anchor="middle" class="body">rank 6</text>
<text x="555.0" y="218.0" text-anchor="middle" class="small">GPU 2</text>
<rect class="gpu" x="613" y="184" width="84" height="40"/>
<text x="655.0" y="200.0" text-anchor="middle" class="body">rank 7</text>
<text x="655.0" y="218.0" text-anchor="middle" class="small">GPU 3</text>
<line x1="597" y1="204" x2="613" y2="204" class="dbl"/>
<line x1="597" y1="204" x2="613" y2="204" class="dbl-in"/>
<line x1="555" y1="144" x2="555" y2="184" class="arrow"/>
<line x1="655" y1="144" x2="655" y2="184" class="arrow"/>
<text x="605" y="168" text-anchor="middle" class="mute">send/recv</text>
<text x="425" y="142" text-anchor="middle" class="mute">两个副本之间</text>
<text x="425" y="160" text-anchor="middle" class="mute">不传递激活</text>
<line x1="110" y1="272" x2="150" y2="272" class="dbl"/>
<line x1="110" y1="272" x2="150" y2="272" class="dbl-in"/>
<text x="158" y="277" text-anchor="start" class="mute">TP 组 All-Reduce（NVLink）</text>
<line x1="360" y1="262" x2="360" y2="282" class="arrow"/>
<text x="372" y="277" text-anchor="start" class="mute">PP 组 P2P send/recv</text>
<text x="110" y="308" text-anchor="start" class="mono">TP 组：[0,1] [2,3] [4,5] [6,7]</text>
<text x="430" y="308" text-anchor="start" class="mono">PP 组：[0,2] [1,3] [4,6] [5,7]</text>
<text x="110" y="330" text-anchor="start" class="mono">DP 组：[0,4] [1,5] [2,6] [3,7]</text>
