<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="t d">
  <title id="t">RankGenerator 的掩码：8 卡 TP2 × DP2 × PP2</title>
  <desc id="d">上：8 张卡按 rank = tp + 2·dp + 4·pp 排成 pp 两行、dp 两列、tp 两子列的网格；下：get_ranks 的 tp / dp / pp / tp-dp 四种掩码，各自把 8 张卡分成的进程组用同色标出。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="380" y="22" text-anchor="middle" class="body">world_size = 8，order = "tp-cp-ep-dp-pp"，TP 2 × DP 2 × PP 2（cp = ep = 1）</text><text x="380" y="42" text-anchor="middle" class="small">rank = tp + 2·dp + 4·pp：tp 变化最快（相邻卡），pp 最慢</text><text x="220" y="66" text-anchor="middle" class="bold">dp=0</text><text x="185.0" y="86" text-anchor="middle" class="small">tp=0</text><text x="255.0" y="86" text-anchor="middle" class="small">tp=1</text><text x="396" y="66" text-anchor="middle" class="bold">dp=1</text><text x="361.0" y="86" text-anchor="middle" class="small">tp=0</text><text x="431.0" y="86" text-anchor="middle" class="small">tp=1</text><text x="134" y="123.0" text-anchor="end" class="bold">pp=0</text><rect class="seg-free" x="150" y="96" width="70" height="44"/><text x="185.0" y="123.0" text-anchor="middle" class="mono">rank 0</text><rect class="seg-free" x="220" y="96" width="70" height="44"/><text x="255.0" y="123.0" text-anchor="middle" class="mono">rank 1</text><rect class="seg-free" x="326" y="96" width="70" height="44"/><text x="361.0" y="123.0" text-anchor="middle" class="mono">rank 2</text><rect class="seg-free" x="396" y="96" width="70" height="44"/><text x="431.0" y="123.0" text-anchor="middle" class="mono">rank 3</text><text x="134" y="183.0" text-anchor="end" class="bold">pp=1</text><rect class="seg-free" x="150" y="156" width="70" height="44"/><text x="185.0" y="183.0" text-anchor="middle" class="mono">rank 4</text><rect class="seg-free" x="220" y="156" width="70" height="44"/><text x="255.0" y="183.0" text-anchor="middle" class="mono">rank 5</text><rect class="seg-free" x="326" y="156" width="70" height="44"/><text x="361.0" y="183.0" text-anchor="middle" class="mono">rank 6</text><rect class="seg-free" x="396" y="156" width="70" height="44"/><text x="431.0" y="183.0" text-anchor="middle" class="mono">rank 7</text><text x="380" y="232" text-anchor="middle" class="body">get_ranks(…)：同色的卡属于同一个进程组</text><rect class="seg-a" x="40" y="252" width="36" height="26"/><text x="58.0" y="270.0" text-anchor="middle" class="mono">0</text><rect class="seg-a" x="76" y="252" width="36" height="26"/><text x="94.0" y="270.0" text-anchor="middle" class="mono">1</text><rect class="seg-b" x="126" y="252" width="36" height="26"/><text x="144.0" y="270.0" text-anchor="middle" class="mono">2</text><rect class="seg-b" x="162" y="252" width="36" height="26"/><text x="180.0" y="270.0" text-anchor="middle" class="mono">3</text><rect class="seg-kv" x="40" y="278" width="36" height="26"/><text x="58.0" y="296.0" text-anchor="middle" class="mono">4</text><rect class="seg-kv" x="76" y="278" width="36" height="26"/><text x="94.0" y="296.0" text-anchor="middle" class="mono">5</text><rect class="seg-d" x="126" y="278" width="36" height="26"/><text x="144.0" y="296.0" text-anchor="middle" class="mono">6</text><rect class="seg-d" x="162" y="278" width="36" height="26"/><text x="180.0" y="296.0" text-anchor="middle" class="mono">7</text><text x="224" y="276" text-anchor="start" class="mono">get_ranks("tp")  变 tp，固定 dp,pp</text><text x="224" y="300" text-anchor="start" class="mono">→ {0,1} {2,3} {4,5} {6,7}</text><rect class="seg-a" x="40" y="344" width="36" height="26"/><text x="58.0" y="362.0" text-anchor="middle" class="mono">0</text><rect class="seg-b" x="76" y="344" width="36" height="26"/><text x="94.0" y="362.0" text-anchor="middle" class="mono">1</text><rect class="seg-a" x="126" y="344" width="36" height="26"/><text x="144.0" y="362.0" text-anchor="middle" class="mono">2</text><rect class="seg-b" x="162" y="344" width="36" height="26"/><text x="180.0" y="362.0" text-anchor="middle" class="mono">3</text><rect class="seg-kv" x="40" y="370" width="36" height="26"/><text x="58.0" y="388.0" text-anchor="middle" class="mono">4</text><rect class="seg-d" x="76" y="370" width="36" height="26"/><text x="94.0" y="388.0" text-anchor="middle" class="mono">5</text><rect class="seg-kv" x="126" y="370" width="36" height="26"/><text x="144.0" y="388.0" text-anchor="middle" class="mono">6</text><rect class="seg-d" x="162" y="370" width="36" height="26"/><text x="180.0" y="388.0" text-anchor="middle" class="mono">7</text><text x="224" y="368" text-anchor="start" class="mono">get_ranks("dp")  变 dp，固定 tp,pp</text><text x="224" y="392" text-anchor="start" class="mono">→ {0,2} {1,3} {4,6} {5,7}</text><rect class="seg-a" x="40" y="436" width="36" height="26"/><text x="58.0" y="454.0" text-anchor="middle" class="mono">0</text><rect class="seg-b" x="76" y="436" width="36" height="26"/><text x="94.0" y="454.0" text-anchor="middle" class="mono">1</text><rect class="seg-kv" x="126" y="436" width="36" height="26"/><text x="144.0" y="454.0" text-anchor="middle" class="mono">2</text><rect class="seg-d" x="162" y="436" width="36" height="26"/><text x="180.0" y="454.0" text-anchor="middle" class="mono">3</text><rect class="seg-a" x="40" y="462" width="36" height="26"/><text x="58.0" y="480.0" text-anchor="middle" class="mono">4</text><rect class="seg-b" x="76" y="462" width="36" height="26"/><text x="94.0" y="480.0" text-anchor="middle" class="mono">5</text><rect class="seg-kv" x="126" y="462" width="36" height="26"/><text x="144.0" y="480.0" text-anchor="middle" class="mono">6</text><rect class="seg-d" x="162" y="462" width="36" height="26"/><text x="180.0" y="480.0" text-anchor="middle" class="mono">7</text><text x="224" y="460" text-anchor="start" class="mono">get_ranks("pp")  变 pp，固定 tp,dp</text><text x="224" y="484" text-anchor="start" class="mono">→ {0,4} {1,5} {2,6} {3,7}</text><rect class="seg-a" x="40" y="528" width="36" height="26"/><text x="58.0" y="546.0" text-anchor="middle" class="mono">0</text><rect class="seg-a" x="76" y="528" width="36" height="26"/><text x="94.0" y="546.0" text-anchor="middle" class="mono">1</text><rect class="seg-a" x="126" y="528" width="36" height="26"/><text x="144.0" y="546.0" text-anchor="middle" class="mono">2</text><rect class="seg-a" x="162" y="528" width="36" height="26"/><text x="180.0" y="546.0" text-anchor="middle" class="mono">3</text><rect class="seg-b" x="40" y="554" width="36" height="26"/><text x="58.0" y="572.0" text-anchor="middle" class="mono">4</text><rect class="seg-b" x="76" y="554" width="36" height="26"/><text x="94.0" y="572.0" text-anchor="middle" class="mono">5</text><rect class="seg-b" x="126" y="554" width="36" height="26"/><text x="144.0" y="572.0" text-anchor="middle" class="mono">6</text><rect class="seg-b" x="162" y="554" width="36" height="26"/><text x="180.0" y="572.0" text-anchor="middle" class="mono">7</text><text x="224" y="552" text-anchor="start" class="mono">get_ranks("tp-dp")  变 tp,dp，固定 pp</text><text x="224" y="576" text-anchor="start" class="mono">→ {0,1,2,3} {4,5,6,7}</text>
</svg>
