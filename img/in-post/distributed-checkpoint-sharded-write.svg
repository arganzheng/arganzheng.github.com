<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 392" width="845" height="392" role="img" aria-labelledby="t d">
  <title id="t">分片写：每个 rank 只写自己唯一持有的那部分</title>
  <desc id="d">4 卡 TP2 × DP2 的例子。rank 0 与 rank 2 都持有 bf16 参数 P0，rank 1 与 rank 3 都持有 P1；去重后 P0 由 rank 0 写，P1 由 rank 3 写。每卡的优化器分片 O00、O10、O01、O11 互不重复，各自写进自己的 __r_0.distcp。coordinator 最后写 .metadata，记录每个 key 的全局形状和每块在哪个文件的哪个偏移。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: 'Hiragino Sans GB', 'PingFang SC', sans-serif; fill: #243447; font-weight: 600; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 13px; font-weight: 700; }
      .mono12 { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .proc-a { fill: #f3f9f5; stroke: #70a582; stroke-width: 1.2; }
      .proc-b { fill: #fff8ec; stroke: #d79a45; stroke-width: 1.2; }
      .proc-c { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #ffe3c2; stroke: #d79a45; stroke-width: 1.4; }
      .disk { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .thin { stroke: #40566f; stroke-width: 1.2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .sep { stroke: #7a8b9c; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .cut { stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
      .red { fill: #b42318; }
      .grey { fill: #222; }
      .dash { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .dasharrow { stroke: #40566f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .red { fill: #b42318; }
      .grey { fill: #222; }
      .dash { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .dasharrow { stroke: #40566f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>
<text x="20" y="24" text-anchor="start" class="head">例：4 卡 TP 2 × DP 2，分布式优化器</text>
<rect class="frame" x="20" y="40" width="190" height="128"/>
<text x="115" y="62" text-anchor="middle" class="bold">rank 0（tp0, dp0）</text>
<rect class="seg-a" x="32" y="74" width="166" height="34"/>
<text x="115" y="96" text-anchor="middle" class="small">bf16 参数 P0</text>
<rect class="seg-d" x="32" y="118" width="166" height="34"/>
<text x="115" y="140" text-anchor="middle" class="small">优化器分片 O00</text>
<path d="M115 168 V206" class="arrow"/>
<rect class="seg-c" x="32" y="206" width="166" height="48"/>
<text x="115" y="226" text-anchor="middle" class="mono">__0_0.distcp</text>
<text x="115" y="244" text-anchor="middle" class="small">P0 + O00</text>
<rect class="frame" x="225" y="40" width="190" height="128"/>
<text x="320" y="62" text-anchor="middle" class="bold">rank 1（tp1, dp0）</text>
<rect class="dash" x="237" y="74" width="166" height="34"/>
<text x="320" y="96" text-anchor="middle" class="small">bf16 参数 P1（副本，不写）</text>
<rect class="seg-d" x="237" y="118" width="166" height="34"/>
<text x="320" y="140" text-anchor="middle" class="small">优化器分片 O10</text>
<path d="M320 168 V206" class="arrow"/>
<rect class="seg-c" x="237" y="206" width="166" height="48"/>
<text x="320" y="226" text-anchor="middle" class="mono">__1_0.distcp</text>
<text x="320" y="244" text-anchor="middle" class="small">O10</text>
<rect class="frame" x="430" y="40" width="190" height="128"/>
<text x="525" y="62" text-anchor="middle" class="bold">rank 2（tp0, dp1）</text>
<rect class="dash" x="442" y="74" width="166" height="34"/>
<text x="525" y="96" text-anchor="middle" class="small">bf16 参数 P0（副本，不写）</text>
<rect class="seg-d" x="442" y="118" width="166" height="34"/>
<text x="525" y="140" text-anchor="middle" class="small">优化器分片 O01</text>
<path d="M525 168 V206" class="arrow"/>
<rect class="seg-c" x="442" y="206" width="166" height="48"/>
<text x="525" y="226" text-anchor="middle" class="mono">__2_0.distcp</text>
<text x="525" y="244" text-anchor="middle" class="small">O01</text>
<rect class="frame" x="635" y="40" width="190" height="128"/>
<text x="730" y="62" text-anchor="middle" class="bold">rank 3（tp1, dp1）</text>
<rect class="seg-a" x="647" y="74" width="166" height="34"/>
<text x="730" y="96" text-anchor="middle" class="small">bf16 参数 P1</text>
<rect class="seg-d" x="647" y="118" width="166" height="34"/>
<text x="730" y="140" text-anchor="middle" class="small">优化器分片 O11</text>
<path d="M730 168 V206" class="arrow"/>
<rect class="seg-c" x="647" y="206" width="166" height="48"/>
<text x="730" y="226" text-anchor="middle" class="mono">__3_0.distcp</text>
<text x="730" y="244" text-anchor="middle" class="small">P1 + O11</text>
<rect class="seg-hi" x="20" y="276" width="805" height="34"/>
<text x="422" y="298" text-anchor="middle" class="small">.metadata（coordinator 汇总各 rank 的 WriteResult 后最后写）：每个 key 的全局形状 + 每块在哪个文件的哪个偏移</text>
<text x="20" y="336" text-anchor="start" class="small">P0 在 rank 0、2 上各有一份，P1 在 rank 1、3 上各有一份。plan 阶段去重，重复的块只派给其中一个 rank 写</text>
<text x="20" y="356" text-anchor="start" class="small">（DCP 按各 rank 的计划大小均衡分配）。优化器分片每卡一份、互不重复，各写各的。</text>
<text x="20" y="376" text-anchor="start" class="small">所有 rank 同时写自己的文件，写入时间由并行文件系统的聚合带宽决定。</text>
</svg>
