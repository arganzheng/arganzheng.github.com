<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 128" width="760" height="128" role="img" aria-labelledby="t d">
  <title id="t">64K 序列切成 4 个 chunk</title>
  <desc id="d">64K 长的输入序列按位置切成 4 段连续的 chunk：t₁–t₁₆₀₀₀ 给 GPU 0，t₁₆₀₀₁–t₃₂₀₀₀ 给 GPU 1，t₃₂₀₀₁–t₄₈₀₀₀ 给 GPU 2，t₄₈₀₀₁–t₆₄₀₀₀ 给 GPU 3。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c3cf"/></marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7a8b9c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .formula { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-style: italic; }
      .math { font-size: 14px; }
      .mute { font-size: 13px; fill: #5b6b7c; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .req { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .comm { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.2; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-o { fill: #fde9cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-hi { fill: #f9d5cf; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #fff; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-light { stroke: #b7c3cf; stroke-width: 1.2; fill: none; marker-end: url(#arrow-light); }
      .arrow-hi { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#arrow-hi); }
      .line { stroke: #40566f; stroke-width: 1.8; fill: none; }
      .dbl { stroke: #5880b4; stroke-width: 4; fill: none; }
      .dbl-in { stroke: #fff; stroke-width: 1.4; fill: none; }
      .dash { stroke: #7a8b9c; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow-axis); }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
<text x="20" y="24" text-anchor="start" class="body">完整序列：[t₁, t₂, …, t₆₄₀₀₀]</text>
<rect class="seg-a" x="20" y="38" width="180" height="46"/>
<text x="110.0" y="57" text-anchor="middle" class="small">chunk 0</text>
<text x="110.0" y="75" text-anchor="middle" class="math">t₁ ~ t₁₆₀₀₀</text>
<text x="110.0" y="106" text-anchor="middle" class="bold">GPU 0</text>
<rect class="seg-b" x="200" y="38" width="180" height="46"/>
<text x="290.0" y="57" text-anchor="middle" class="small">chunk 1</text>
<text x="290.0" y="75" text-anchor="middle" class="math">t₁₆₀₀₁ ~ t₃₂₀₀₀</text>
<text x="290.0" y="106" text-anchor="middle" class="bold">GPU 1</text>
<rect class="seg-c" x="380" y="38" width="180" height="46"/>
<text x="470.0" y="57" text-anchor="middle" class="small">chunk 2</text>
<text x="470.0" y="75" text-anchor="middle" class="math">t₃₂₀₀₁ ~ t₄₈₀₀₀</text>
<text x="470.0" y="106" text-anchor="middle" class="bold">GPU 2</text>
<rect class="seg-d" x="560" y="38" width="180" height="46"/>
<text x="650.0" y="57" text-anchor="middle" class="small">chunk 3</text>
<text x="650.0" y="75" text-anchor="middle" class="math">t₄₈₀₀₁ ~ t₆₄₀₀₀</text>
<text x="650.0" y="106" text-anchor="middle" class="bold">GPU 3</text>
</svg>
