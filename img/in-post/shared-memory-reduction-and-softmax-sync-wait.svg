<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc">
<title id="title">一次 __syncthreads() 的等待代价（4 个 warp 时间线）</title><desc id="desc">四个 warp 沿同一时间轴工作。warp 2 遇到 cache miss 最晚到栅栏；warp 0、1、3 在栅栏等待，所有 warp 同时放行。</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/></marker></defs>
<style>
text {font-family:"Noto Sans CJK SC","PingFang SC",sans-serif; fill:#1e293b; font-size:13.5px;font-weight:500}
.label {font-size:13.5px} .title {font-size:16px;font-weight:600} .minor {font-size:12.5px; fill:#334155} .mono {font-family:ui-monospace,SFMono-Regular,monospace;font-size:13.5px}
.accent {fill:#1d4ed8;font-weight:600} .tile {fill:#f8fafc;stroke:#cbd5e1;stroke-width:1} .highlight {fill:#dbeafe;stroke:#2563eb;stroke-width:1.2}
.pad {fill:#fff7ed;stroke:#fb923c;stroke-width:1} .miss {fill:#dbeafe;stroke:#2563eb;stroke-width:1} .edge {fill:none;stroke:#2563eb;stroke-width:1.5;stroke-linejoin:round}
.grid {fill:none;stroke:#cbd5e1;stroke-width:1} .divider {fill:none;stroke:#94a3b8;stroke-width:1}
</style>
<text x="16" y="34" text-anchor="start" class="label">时间</text><path d="M 100 30 H 712" class="edge" marker-end="url(#tip)"/><text x="80" y="75" text-anchor="end" class="label">warp 0</text><rect x="100" y="54" width="170" height="32" class="tile"/><rect x="270" y="54" width="370" height="32" class="pad"/><text x="655" y="75" text-anchor="start" class="label">继续</text><text x="80" y="121" text-anchor="end" class="label">warp 1</text><rect x="100" y="100" width="194" height="32" class="tile"/><rect x="294" y="100" width="346" height="32" class="pad"/><text x="655" y="121" text-anchor="start" class="label">继续</text><text x="80" y="167" text-anchor="end" class="label">warp 2</text><rect x="100" y="146" width="230" height="32" class="tile"/><rect x="330" y="146" width="310" height="32" class="miss"/><text x="485" y="167" text-anchor="middle" class="accent">cache miss</text><text x="655" y="167" text-anchor="start" class="label">继续</text><text x="80" y="213" text-anchor="end" class="label">warp 3</text><rect x="100" y="192" width="170" height="32" class="tile"/><rect x="270" y="192" width="370" height="32" class="pad"/><text x="655" y="213" text-anchor="start" class="label">继续</text><path d="M 640 50 V 243" class="divider"/><path d="M 640 269 V 244" class="edge" marker-end="url(#tip)"/><text x="640" y="289" text-anchor="middle" class="accent">所有 warp 到齐才放行</text><rect x="100" y="306" width="18" height="14" class="tile"/><text x="128" y="319" text-anchor="start" class="minor">在干活</text><rect x="214" y="306" width="18" height="14" class="miss"/><text x="242" y="319" text-anchor="start" class="minor">cache miss</text><rect x="367" y="306" width="18" height="14" class="pad"/><text x="395" y="319" text-anchor="start" class="minor">在栅栏上空等</text>
</svg>
