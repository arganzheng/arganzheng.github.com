<svg xmlns="http://www.w3.org/2000/svg" width="760" height="447.2" viewBox="0 0 760 447.2" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, sans-serif" font-weight="400">
<style id="embedded-fonts" type="text/css">@font-face{font-family:'SvgSans';font-weight:400;src:url(data:font/woff2;base64,)}</style>
<title id="title">一次 __syncthreads() 的等待代价（4 个 warp 时间线）</title><desc id="desc">四个 warp 沿同一时间轴工作。warp 2 遇到 cache miss 最晚到栅栏；warp 0、1、3 在栅栏等待，所有 warp 同时放行。</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb" /></marker></defs>
<style>
text {font-family:'SvgSans', Noto Sans SC, sans-serif; fill:#1e293b; font-size:13.5px;font-weight:500}
.label {font-size:13.5px} .title {font-size:16px;font-weight: 500} .minor {font-size:12.5px; fill:#334155} .mono {font-family:'SvgMono', DejaVu Sans Mono, monospace;font-size:13.5px}
.accent {fill:#1d4ed8;font-weight: 500} .tile {fill:#f8fafc;stroke:#cbd5e1;stroke-width:1} .highlight {fill:#dbeafe;stroke:#2563eb;stroke-width:1.2}
.pad {fill:#fff7ed;stroke:#fb923c;stroke-width:1} .miss {fill:#dbeafe;stroke:#2563eb;stroke-width:1} .edge {fill:none;stroke:#2563eb;stroke-width:1.5;stroke-linejoin:round}
.grid {fill:none;stroke:#cbd5e1;stroke-width:1} .divider {fill:none;stroke:#94a3b8;stroke-width:1}
</style>
<text x="16" y="44.2" text-anchor="start" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">时间</text><path d="M 100 39 H 712" class="edge" marker-end="url(#tip)" /><text x="80" y="97.5" text-anchor="end" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">warp 0</text><rect x="100" y="70.2" width="170" height="41.6" class="tile" /><rect x="270" y="70.2" width="370" height="41.6" class="pad" /><text x="655" y="97.5" text-anchor="start" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">继续</text><text x="80" y="157.3" text-anchor="end" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">warp 1</text><rect x="100" y="130" width="194" height="41.6" class="tile" /><rect x="294" y="130" width="346" height="41.6" class="pad" /><text x="655" y="157.3" text-anchor="start" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">继续</text><text x="80" y="217.1" text-anchor="end" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">warp 2</text><rect x="100" y="189.8" width="230" height="41.6" class="tile" /><rect x="330" y="189.8" width="310" height="41.6" class="miss" /><text x="485" y="217.1" text-anchor="middle" class="accent" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400" transform="translate(0 -0.500) ">cache miss</text><text x="655" y="217.1" text-anchor="start" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">继续</text><text x="80" y="276.9" text-anchor="end" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">warp 3</text><rect x="100" y="249.6" width="170" height="41.6" class="tile" /><rect x="270" y="249.6" width="370" height="41.6" class="pad" /><text x="655" y="276.9" text-anchor="start" class="label" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">继续</text><path d="M 640 65 V 315.9" class="divider" /><path d="M 640 349.7 V 317.2" class="edge" marker-end="url(#tip)" /><text x="640" y="375.7" text-anchor="middle" class="accent" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">所有 warp 到齐才放行</text><rect x="100" y="397.8" width="18" height="18.2" class="tile" /><text x="128" y="414.7" text-anchor="start" class="minor" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">在干活</text><rect x="214" y="397.8" width="18" height="18.2" class="miss" /><text x="242" y="414.7" text-anchor="start" class="minor" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">cache miss</text><rect x="367" y="397.8" width="18" height="18.2" class="pad" /><text x="395" y="414.7" text-anchor="start" class="minor" style=";font-family:'SvgSans', Noto Sans SC, sans-serif;font-weight:400">在栅栏上空等</text>
