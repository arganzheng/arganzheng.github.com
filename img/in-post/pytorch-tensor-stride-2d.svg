<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">x：shape=(2, 3)，stride=(3, 1)　　offset(i, j) = i·3 + j·1</text><text x="60" y="58" fill="#333" font-size="11" text-anchor="start" font-weight="600">storage（一维，下标即物理位置）</text><rect x="60" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="90.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">a</text><text x="90.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">0</text><rect x="120" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="150.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">b</text><text x="150.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">1</text><rect x="180" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="210.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">c</text><text x="210.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">2</text><rect x="240" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="270.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">d</text><text x="270.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">3</text><rect x="300" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="330.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">e</text><text x="330.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">4</text><rect x="360" y="76" width="60" height="28" fill="#f3f6fa" stroke="#7a9cc6" stroke-width="1.2" rx="0"/><text x="390.0" y="94.5" fill="#222" font-size="12" text-anchor="middle" font-weight="normal">f</text><text x="390.0" y="70" fill="#999" font-size="9" text-anchor="middle" font-weight="normal">5</text><line x1="60" y1="118" x2="240" y2="118" stroke="#1f6fb2" stroke-width="2"/><text x="150" y="132" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">row i=0</text><line x1="240" y1="118" x2="420" y2="118" stroke="#c0392b" stroke-width="2"/><text x="330" y="132" fill="#c0392b" font-size="10" text-anchor="middle" font-weight="normal">row i=1</text><text x="450" y="96" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">相邻两行起点相差 3 = stride[0]</text><text x="60" y="168" fill="#333" font-size="11" text-anchor="start" font-weight="600">逻辑视图 x[i, j]</text><rect x="100" y="186" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="155.0" y="206.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,0)→0　a</text><rect x="210" y="186" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="265.0" y="206.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,1)→1　b</text><rect x="320" y="186" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="375.0" y="206.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,2)→2　c</text><text x="94" y="206.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=0</text><rect x="100" y="218" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="155.0" y="238.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,0)→3　d</text><rect x="210" y="218" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="265.0" y="238.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,1)→4　e</text><rect x="320" y="218" width="110" height="32" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="375.0" y="238.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,2)→5　f</text><text x="94" y="238.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=1</text><text x="155.0" y="180" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=0</text><text x="265.0" y="180" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=1</text><text x="375.0" y="180" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=2</text><text x="450" y="205" fill="#333" font-size="11" text-anchor="start" font-weight="normal">j 增 1 → 物理位置 +1（stride[1] = 1）</text><text x="450" y="225" fill="#333" font-size="11" text-anchor="start" font-weight="normal">i 增 1 → 物理位置 +3（stride[0] = 3）</text>
</svg>
