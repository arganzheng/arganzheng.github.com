<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" width="760" height="198" role="img" aria-labelledby="t d">
  <title id="t">padded 布局与 packed + cu_seqlens 布局</title>
  <desc id="d">左：padded [B, N_max, d]，N_max = 5；seq 0 是 a0 a1 a2 加 2 个 pad，seq 1 是 b0–b4，seq 2 是 c0 c1 加 3 个 pad；15 个槽位，5 个是 pad，浪费 1/3。右：packed [total_tokens, d]，a0–a2、b0–b4、c0–c1 首尾相接，cu_seqlens 边界在 0、3、8、10；seq_lens = [3, 5, 2]，cu_seqlens = [0, 3, 8, 10]，长度 B+1；block 拿到 b 后，行范围是 [cu_seqlens[b], cu_seqlens[b+1])。</desc>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; font-weight: 600; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 14px; }
      .bb { font-size: 14px; font-weight: 700; }
      .s { font-size: 13px; }
      .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 600; }
      .ms { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
      .red { fill: #a3271f; }
      .blue { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .dblue { fill: #9fc0ec; stroke: #40566f; stroke-width: 1.2; }
      .green { fill: #dcefe2; stroke: #40566f; stroke-width: 1.2; }
      .orange { fill: #fde4c8; stroke: #40566f; stroke-width: 1.2; }
      .purple { fill: #e9def5; stroke: #40566f; stroke-width: 1.2; }
      .gray { fill: #e6e9ee; stroke: #40566f; stroke-width: 1.2; }
      .white { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .wait { fill: #fff; stroke: #8a97a6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.2; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .thin { stroke: #8a97a6; stroke-width: 1; fill: none; }
      .arr { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .mark { stroke: #c0392b; stroke-width: 2.2; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="198" fill="#fff"/>
  <text class="m" x="20" y="24">padded [B, N_max, d]（N_max = 5）</text>
  <text class="ms" x="62" y="60" text-anchor="end">seq 0</text>
  <rect class="blue" x="70" y="40" width="34" height="30"/>
  <text class="ms" x="87.0" y="60" text-anchor="middle">a0</text>
  <rect class="blue" x="104" y="40" width="34" height="30"/>
  <text class="ms" x="121.0" y="60" text-anchor="middle">a1</text>
  <rect class="blue" x="138" y="40" width="34" height="30"/>
  <text class="ms" x="155.0" y="60" text-anchor="middle">a2</text>
  <rect class="gray" x="172" y="40" width="34" height="30"/>
  <text class="ms" x="189.0" y="60" text-anchor="middle">·</text>
  <rect class="gray" x="206" y="40" width="34" height="30"/>
  <text class="ms" x="223.0" y="60" text-anchor="middle">·</text>
  <text class="s" x="248" y="60">← 2 个 pad</text>
  <text class="ms" x="62" y="96" text-anchor="end">seq 1</text>
  <rect class="green" x="70" y="76" width="34" height="30"/>
  <text class="ms" x="87.0" y="96" text-anchor="middle">b0</text>
  <rect class="green" x="104" y="76" width="34" height="30"/>
  <text class="ms" x="121.0" y="96" text-anchor="middle">b1</text>
  <rect class="green" x="138" y="76" width="34" height="30"/>
  <text class="ms" x="155.0" y="96" text-anchor="middle">b2</text>
  <rect class="green" x="172" y="76" width="34" height="30"/>
  <text class="ms" x="189.0" y="96" text-anchor="middle">b3</text>
  <rect class="green" x="206" y="76" width="34" height="30"/>
  <text class="ms" x="223.0" y="96" text-anchor="middle">b4</text>
  <text class="ms" x="62" y="132" text-anchor="end">seq 2</text>
  <rect class="orange" x="70" y="112" width="34" height="30"/>
  <text class="ms" x="87.0" y="132" text-anchor="middle">c0</text>
  <rect class="orange" x="104" y="112" width="34" height="30"/>
  <text class="ms" x="121.0" y="132" text-anchor="middle">c1</text>
  <rect class="gray" x="138" y="112" width="34" height="30"/>
  <text class="ms" x="155.0" y="132" text-anchor="middle">·</text>
  <rect class="gray" x="172" y="112" width="34" height="30"/>
  <text class="ms" x="189.0" y="132" text-anchor="middle">·</text>
  <rect class="gray" x="206" y="112" width="34" height="30"/>
  <text class="ms" x="223.0" y="132" text-anchor="middle">·</text>
  <text class="s" x="248" y="132">← 3 个 pad</text>
  <text class="s" x="20" y="166">15 个槽位，5 个是 pad（浪费 1/3）</text>
  <text class="m" x="380" y="24">packed [total_tokens, d] + cu_seqlens</text>
  <rect class="blue" x="380" y="40" width="36" height="30"/>
  <text class="ms" x="398.0" y="60" text-anchor="middle">a0</text>
  <rect class="blue" x="416" y="40" width="36" height="30"/>
  <text class="ms" x="434.0" y="60" text-anchor="middle">a1</text>
  <rect class="blue" x="452" y="40" width="36" height="30"/>
  <text class="ms" x="470.0" y="60" text-anchor="middle">a2</text>
  <rect class="green" x="488" y="40" width="36" height="30"/>
  <text class="ms" x="506.0" y="60" text-anchor="middle">b0</text>
  <rect class="green" x="524" y="40" width="36" height="30"/>
  <text class="ms" x="542.0" y="60" text-anchor="middle">b1</text>
  <rect class="green" x="560" y="40" width="36" height="30"/>
  <text class="ms" x="578.0" y="60" text-anchor="middle">b2</text>
  <rect class="green" x="596" y="40" width="36" height="30"/>
  <text class="ms" x="614.0" y="60" text-anchor="middle">b3</text>
  <rect class="green" x="632" y="40" width="36" height="30"/>
  <text class="ms" x="650.0" y="60" text-anchor="middle">b4</text>
  <rect class="orange" x="668" y="40" width="36" height="30"/>
  <text class="ms" x="686.0" y="60" text-anchor="middle">c0</text>
  <rect class="orange" x="704" y="40" width="36" height="30"/>
  <text class="ms" x="722.0" y="60" text-anchor="middle">c1</text>
  <line class="mark" x1="380" y1="36" x2="380" y2="78"/>
  <text class="m" x="380" y="94" text-anchor="middle">0</text>
  <line class="mark" x1="488" y1="36" x2="488" y2="78"/>
  <text class="m" x="488" y="94" text-anchor="middle">3</text>
  <line class="mark" x1="668" y1="36" x2="668" y2="78"/>
  <text class="m" x="668" y="94" text-anchor="middle">8</text>
  <line class="mark" x1="740" y1="36" x2="740" y2="78"/>
  <text class="m" x="740" y="94" text-anchor="middle">10</text>
  <text class="m" x="380" y="122">seq_lens   = [3, 5, 2]</text>
  <text class="m" x="380" y="142">cu_seqlens = [0, 3, 8, 10]  # 长度 B+1</text>
  <text class="s" x="380" y="166">block 拿到 b 后：行范围</text>
  <text class="m" x="380" y="186">[cu_seqlens[b], cu_seqlens[b+1])</text>
</svg>
