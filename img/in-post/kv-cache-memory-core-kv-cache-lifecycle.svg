<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d">
  <title id="t">KV Cache 生命周期全景</title>
  <desc id="d">写入：Prefill 一次写满若干整块，Decode 每步追加一个 slot，写满才要新块；读取：attention kernel 按 Block Table 逐块从 HBM 取 K/V；归还：ref_cnt 归零后有 hash 的块追加到 free_block_queue 尾部留作缓存，无 hash 的插到头部，被抢占则全部释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="40" y="24" text-anchor="start" class="head">① 写入</text><text x="110" y="24" text-anchor="start" class="body">Prefill：一次写入若干整块（block_size = 16）</text><rect class="seg-used" x="110" y="36" width="11" height="26"/><rect class="seg-used" x="121" y="36" width="11" height="26"/><rect class="seg-used" x="132" y="36" width="11" height="26"/><rect class="seg-used" x="143" y="36" width="11" height="26"/><rect class="seg-used" x="154" y="36" width="11" height="26"/><rect class="seg-used" x="165" y="36" width="11" height="26"/><rect class="seg-used" x="176" y="36" width="11" height="26"/><rect class="seg-used" x="187" y="36" width="11" height="26"/><rect class="seg-used" x="198" y="36" width="11" height="26"/><rect class="seg-used" x="209" y="36" width="11" height="26"/><rect class="seg-used" x="220" y="36" width="11" height="26"/><rect class="seg-used" x="231" y="36" width="11" height="26"/><rect class="seg-used" x="242" y="36" width="11" height="26"/><rect class="seg-used" x="253" y="36" width="11" height="26"/><rect class="seg-used" x="264" y="36" width="11" height="26"/><rect class="seg-used" x="275" y="36" width="11" height="26"/><text x="198.0" y="78" text-anchor="middle" class="small">Block 0：t₁–t₁₆</text><rect class="seg-used" x="310" y="36" width="11" height="26"/><rect class="seg-used" x="321" y="36" width="11" height="26"/><rect class="seg-used" x="332" y="36" width="11" height="26"/><rect class="seg-used" x="343" y="36" width="11" height="26"/><rect class="seg-used" x="354" y="36" width="11" height="26"/><rect class="seg-used" x="365" y="36" width="11" height="26"/><rect class="seg-used" x="376" y="36" width="11" height="26"/><rect class="seg-used" x="387" y="36" width="11" height="26"/><rect class="seg-used" x="398" y="36" width="11" height="26"/><rect class="seg-used" x="409" y="36" width="11" height="26"/><rect class="seg-used" x="420" y="36" width="11" height="26"/><rect class="seg-used" x="431" y="36" width="11" height="26"/><rect class="seg-used" x="442" y="36" width="11" height="26"/><rect class="seg-used" x="453" y="36" width="11" height="26"/><rect class="seg-used" x="464" y="36" width="11" height="26"/><rect class="seg-used" x="475" y="36" width="11" height="26"/><text x="398.0" y="78" text-anchor="middle" class="small">Block 1：t₁₇–t₃₂</text><rect class="seg-used" x="510" y="36" width="11" height="26"/><rect class="seg-used" x="521" y="36" width="11" height="26"/><rect class="seg-used" x="532" y="36" width="11" height="26"/><rect class="seg-used" x="543" y="36" width="11" height="26"/><rect class="seg-used" x="554" y="36" width="11" height="26"/><rect class="seg-used" x="565" y="36" width="11" height="26"/><rect class="seg-used" x="576" y="36" width="11" height="26"/><rect class="seg-used" x="587" y="36" width="11" height="26"/><rect class="seg-used" x="598" y="36" width="11" height="26"/><rect class="seg-freefrag" x="609" y="36" width="11" height="26"/><rect class="seg-freefrag" x="620" y="36" width="11" height="26"/><rect class="seg-freefrag" x="631" y="36" width="11" height="26"/><rect class="seg-freefrag" x="642" y="36" width="11" height="26"/><rect class="seg-freefrag" x="653" y="36" width="11" height="26"/><rect class="seg-freefrag" x="664" y="36" width="11" height="26"/><rect class="seg-freefrag" x="675" y="36" width="11" height="26"/><text x="598.0" y="78" text-anchor="middle" class="small">Block 2：t₃₃–tₙ（未满）</text><text x="110" y="112" text-anchor="start" class="body">Decode：每步只追加 1 个 slot，写满了才申请新块</text><rect class="seg-used" x="110" y="124" width="11" height="26"/><rect class="seg-used" x="121" y="124" width="11" height="26"/><rect class="seg-used" x="132" y="124" width="11" height="26"/><rect class="seg-used" x="143" y="124" width="11" height="26"/><rect class="seg-used" x="154" y="124" width="11" height="26"/><rect class="seg-used" x="165" y="124" width="11" height="26"/><rect class="seg-used" x="176" y="124" width="11" height="26"/><rect class="seg-used" x="187" y="124" width="11" height="26"/><rect class="seg-used" x="198" y="124" width="11" height="26"/><rect class="seg-a" x="209" y="124" width="11" height="26"/><rect class="seg-freefrag" x="220" y="124" width="11" height="26"/><rect class="seg-freefrag" x="231" y="124" width="11" height="26"/><rect class="seg-freefrag" x="242" y="124" width="11" height="26"/><rect class="seg-freefrag" x="253" y="124" width="11" height="26"/><rect class="seg-freefrag" x="264" y="124" width="11" height="26"/><rect class="seg-freefrag" x="275" y="124" width="11" height="26"/><text x="198.0" y="166" text-anchor="middle" class="small">Block 2 追加 tₙ₊₁</text><rect class="seg-used" x="310" y="124" width="11" height="26"/><rect class="seg-used" x="321" y="124" width="11" height="26"/><rect class="seg-used" x="332" y="124" width="11" height="26"/><rect class="seg-used" x="343" y="124" width="11" height="26"/><rect class="seg-used" x="354" y="124" width="11" height="26"/><rect class="seg-used" x="365" y="124" width="11" height="26"/><rect class="seg-used" x="376" y="124" width="11" height="26"/><rect class="seg-used" x="387" y="124" width="11" height="26"/><rect class="seg-used" x="398" y="124" width="11" height="26"/><rect class="seg-used" x="409" y="124" width="11" height="26"/><rect class="seg-used" x="420" y="124" width="11" height="26"/><rect class="seg-used" x="431" y="124" width="11" height="26"/><rect class="seg-used" x="442" y="124" width="11" height="26"/><rect class="seg-used" x="453" y="124" width="11" height="26"/><rect class="seg-used" x="464" y="124" width="11" height="26"/><rect class="seg-used" x="475" y="124" width="11" height="26"/><text x="398.0" y="166" text-anchor="middle" class="small">写满 → 注册 block_hash</text><rect class="seg-used" x="510" y="124" width="11" height="26"/><rect class="seg-freefrag" x="521" y="124" width="11" height="26"/><rect class="seg-freefrag" x="532" y="124" width="11" height="26"/><rect class="seg-freefrag" x="543" y="124" width="11" height="26"/><rect class="seg-freefrag" x="554" y="124" width="11" height="26"/><rect class="seg-freefrag" x="565" y="124" width="11" height="26"/><rect class="seg-freefrag" x="576" y="124" width="11" height="26"/><rect class="seg-freefrag" x="587" y="124" width="11" height="26"/><rect class="seg-freefrag" x="598" y="124" width="11" height="26"/><rect class="seg-freefrag" x="609" y="124" width="11" height="26"/><rect class="seg-freefrag" x="620" y="124" width="11" height="26"/><rect class="seg-freefrag" x="631" y="124" width="11" height="26"/><rect class="seg-freefrag" x="642" y="124" width="11" height="26"/><rect class="seg-freefrag" x="653" y="124" width="11" height="26"/><rect class="seg-freefrag" x="664" y="124" width="11" height="26"/><rect class="seg-freefrag" x="675" y="124" width="11" height="26"/><text x="598.0" y="166" text-anchor="middle" class="small">再要新块 Block 3</text><text x="40" y="208" text-anchor="start" class="head">② 读取</text><text x="110" y="208" text-anchor="start" class="body">Attention kernel 只认 Block Table，不认请求</text><text x="110" y="240" text-anchor="start" class="small">req_42 的 Block Table</text><rect class="seg-b" x="260" y="222" width="66" height="30"/><text x="293.0" y="242.0" text-anchor="middle" class="small">PB 7</text><rect class="seg-b" x="330" y="222" width="66" height="30"/><text x="363.0" y="242.0" text-anchor="middle" class="small">PB 13</text><rect class="seg-b" x="400" y="222" width="66" height="30"/><text x="433.0" y="242.0" text-anchor="middle" class="small">PB 21</text><rect class="seg-freefrag" x="110.0" y="290" width="38.75" height="32"/><text x="129.375" y="311.0" text-anchor="middle" class="small">0</text><rect class="seg-freefrag" x="148.75" y="290" width="38.75" height="32"/><text x="168.125" y="311.0" text-anchor="middle" class="small">1</text><rect class="seg-freefrag" x="187.5" y="290" width="38.75" height="32"/><text x="206.875" y="311.0" text-anchor="middle" class="small">2</text><rect class="seg-freefrag" x="226.25" y="290" width="38.75" height="32"/><text x="245.625" y="311.0" text-anchor="middle" class="small">3</text><rect class="seg-freefrag" x="265.0" y="290" width="38.75" height="32"/><text x="284.375" y="311.0" text-anchor="middle" class="small">4</text><rect class="seg-freefrag" x="303.75" y="290" width="38.75" height="32"/><text x="323.125" y="311.0" text-anchor="middle" class="small">5</text><rect class="seg-freefrag" x="342.5" y="290" width="38.75" height="32"/><text x="361.875" y="311.0" text-anchor="middle" class="small">6</text><rect class="seg-b" x="381.25" y="290" width="38.75" height="32"/><text x="400.625" y="311.0" text-anchor="middle" class="small">7</text><rect class="seg-freefrag" x="420.0" y="290" width="38.75" height="32"/><text x="439.375" y="311.0" text-anchor="middle" class="small">8</text><rect class="seg-freefrag" x="458.75" y="290" width="38.75" height="32"/><text x="478.125" y="311.0" text-anchor="middle" class="small">9</text><rect class="seg-freefrag" x="497.5" y="290" width="38.75" height="32"/><text x="516.875" y="311.0" text-anchor="middle" class="small">10</text><rect class="seg-freefrag" x="536.25" y="290" width="38.75" height="32"/><text x="555.625" y="311.0" text-anchor="middle" class="small">11</text><rect class="seg-freefrag" x="575.0" y="290" width="38.75" height="32"/><text x="594.375" y="311.0" text-anchor="middle" class="small">12</text><rect class="seg-b" x="613.75" y="290" width="38.75" height="32"/><text x="633.125" y="311.0" text-anchor="middle" class="small">13</text><rect class="seg-freefrag" x="652.5" y="290" width="38.75" height="32"/><text x="671.875" y="311.0" text-anchor="middle" class="small">14</text><rect class="seg-freefrag" x="691.25" y="290" width="38.75" height="32"/><text x="710.625" y="311.0" text-anchor="middle" class="small">…</text><rect class="seg-b" x="691.25" y="290" width="38.75" height="32"/><text x="710.625" y="311.0" text-anchor="middle" class="small">…</text><text x="40" y="311" text-anchor="start" class="small">HBM</text><path d="M293 252 V270 H400.625 V290" class="arrow"/><path d="M363 252 V266 H633.125 V290" class="arrow"/><path d="M433 252 V262 H710.625 V290" class="arrow"/><text x="110" y="344" text-anchor="start" class="small">kernel 按表逐块取 K/V 算 attention，块是否连续、属于哪个请求都不重要</text><text x="40" y="386" text-anchor="start" class="head">③ 归还</text><text x="110" y="386" text-anchor="start" class="body">KVCacheManager.free()：ref_cnt--，归零的块才回到 free_block_queue</text><rect class="seg-b" x="110" y="400" width="120" height="34"/><text x="170.0" y="422.0" text-anchor="middle" class="small">请求完成</text><line x1="230" y1="417" x2="262" y2="417" class="arrow"/><rect class="seg-freefrag" x="262" y="400" width="120" height="34"/><text x="322.0" y="422.0" text-anchor="middle" class="small">ref_cnt → 0</text><path d="M382 417 H404 V404 H430" class="arrow"/><path d="M382 417 H404 V430 H430" class="arrow"/><text x="436" y="408" text-anchor="start" class="small">有 block_hash → append 到 tail，留给 Prefix Cache</text><text x="436" y="434" text-anchor="start" class="small">无 hash（未写满）→ prepend 到 head，最先被分走</text><rect class="seg-wait" x="110" y="452" width="120" height="34"/><text x="170.0" y="474.0" text-anchor="middle" class="small">被抢占</text><line x1="230" y1="469" x2="262" y2="469" class="arrow"/><text x="268" y="473" text-anchor="start" class="small">全部块释放，num_computed_tokens = 0；重跑时前缀仍可命中缓存</text>
</svg>
