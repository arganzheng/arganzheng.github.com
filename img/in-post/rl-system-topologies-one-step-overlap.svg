<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="760" height="172" role="img" aria-labelledby="t d">
  <title id="t">一步流水：rollout 池与训练池</title>
  <desc id="d">两行共用一条时间轴。rollout 池 46 张卡用 θ_{t-1} 生成 batch t，761 秒；同一时间训练池 18 张卡训练 batch t-1 得到 θ_t，740 秒后训练完，等 rollout 池生成完。两边都完成后，θ_t 从训练池跨机同步到 rollout 池，几秒；之后 rollout 池用 θ_t 生成 batch t+1，训练池训练 batch t 得到 θ_{t+1}。同步段放大画了。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .sub { font-size: 10px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; }
      .stair { fill: #dbe8fb; stroke: none; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .wall { stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>
<text x="16.0" y="49.0" text-anchor="start" class="bold">rollout 池 (46)</text>
<text x="16.0" y="117.0" text-anchor="start" class="bold">训练池 (18)</text>
<rect class="seg-a" x="140.0" y="24" width="400.0" height="40"/><text x="340.0" y="48.5" text-anchor="middle" class="small">生成 batch t（用 θ<tspan class="sub" dy="4">t-1</tspan><tspan dy="-4">​</tspan>）761 s</text>
<rect class="seg-mark" x="540.0" y="24" width="16.0" height="40"/>
<rect class="seg-a" x="556.0" y="24" width="192.0" height="40"/><text x="652.0" y="48.5" text-anchor="middle" class="small">生成 batch t+1（用 θ<tspan class="sub" dy="4">t</tspan><tspan dy="-4">​</tspan>）</text>
<rect class="seg-b" x="140.0" y="92" width="389.0" height="40"/><text x="334.5" y="116.5" text-anchor="middle" class="small">训练 batch t-1 → θ<tspan class="sub" dy="4">t</tspan><tspan dy="-4">​</tspan>  740 s</text>
<rect class="seg-wait" x="529.0" y="92" width="11.0" height="40"/>
<rect class="seg-mark" x="540.0" y="92" width="16.0" height="40"/>
<rect class="seg-b" x="556.0" y="92" width="192.0" height="40"/><text x="652.0" y="116.5" text-anchor="middle" class="small">训练 batch t → θ<tspan class="sub" dy="4">t+1</tspan><tspan dy="-4">​</tspan></text>
<path d="M548.0 92 V64" class="arrow"/>
<text x="540.0" y="83.0" text-anchor="end" class="small">同步 θ<tspan class="sub" dy="4">t</tspan><tspan dy="-4">​</tspan> 到 rollout 池（跨机，几秒）</text>
<path d="M534.5 136 V144" class="line"/>
<text x="534.5" y="160.0" text-anchor="middle" class="small">等</text>
</svg>
