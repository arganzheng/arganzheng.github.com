<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" width="720" height="282" role="img" aria-labelledby="t d">
  <title id="t">pymalloc 的 Arena、Pool、Block 三层结构</title>
  <desc id="d">三行。第一行是一个 Arena，连续切成 Pool 0 到 Pool 63，每个 Pool 标着它分到的 size class，Pool 1 和 Pool 2 都是 48 B。第二行放大 Pool 1：开头是 pool header，后面是一串同样大小的 48 B block。第三行是 64 位上的 size class 档位：16、32、48、64、80、…、496、512 字节，48 B 那一档高亮。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2d3d; }
      .head { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .muted { font-size: 12px; fill: #46586b; }
      .frame { fill: #f8fafc; stroke: #9fb3c8; stroke-width: 1.4; }
      .cell { fill: #fff; stroke: #9fb3c8; stroke-width: 1.2; }
      .hcell { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .hl { fill: #fde0b8; stroke: #b9772a; stroke-width: 1.2; }
      .zoom { stroke: #7f97b2; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>
