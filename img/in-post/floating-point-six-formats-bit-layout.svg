<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">六种浮点格式的位域：BF16 = FP32 的高 16 位，E5M2 = FP16 的高 8 位，TF32 只在乘法器入口截尾数</text><text x="105" y="68" fill="#222" font-size="12" text-anchor="end" font-weight="600">FP32</text><rect x="115" y="50" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="67" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="50" width="104" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="180.0" y="67" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×8</text><rect x="232" y="50" width="299" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="381.5" y="67" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×23</text><text x="541" y="67" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 8 / 23，bias 127</text><text x="105" y="112" fill="#222" font-size="12" text-anchor="end" font-weight="600">TF32</text><rect x="115" y="94" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="111" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="94" width="104" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="180.0" y="111" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×8</text><rect x="232" y="94" width="130" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="297.0" y="111" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×10</text><rect x="362" y="94" width="169" height="26" fill="#f3f3f3" stroke="#555" stroke-width="1" rx="0"/><text x="446.5" y="111" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">入口截掉</text><text x="541" y="111" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 8 / 10；内存仍 4 B，乘法器入口丢低 13 位尾数</text><text x="105" y="156" fill="#222" font-size="12" text-anchor="end" font-weight="600">BF16</text><rect x="115" y="138" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="155" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="138" width="104" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="180.0" y="155" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×8</text><rect x="232" y="138" width="91" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="277.5" y="155" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×7</text><text x="333" y="155" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 8 / 7 = FP32 的高 16 位；范围同 FP32</text><text x="105" y="200" fill="#222" font-size="12" text-anchor="end" font-weight="600">FP16</text><rect x="115" y="182" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="199" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="182" width="65" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="160.5" y="199" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×5</text><rect x="193" y="182" width="130" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="258.0" y="199" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×10</text><text x="333" y="199" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 5 / 10，bias 15；最大 65504</text><text x="105" y="244" fill="#222" font-size="12" text-anchor="end" font-weight="600">E5M2</text><rect x="115" y="226" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="243" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="226" width="65" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="160.5" y="243" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×5</text><rect x="193" y="226" width="26" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="206.0" y="243" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×2</text><text x="229" y="243" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 5 / 2 = FP16 的高 8 位；保留 inf / NaN</text><text x="105" y="288" fill="#222" font-size="12" text-anchor="end" font-weight="600">E4M3</text><rect x="115" y="270" width="13" height="26" fill="#e8eef8" stroke="#555" stroke-width="1" rx="0"/><text x="121.5" y="287" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">S</text><rect x="128" y="270" width="52" height="26" fill="#fff4e0" stroke="#555" stroke-width="1" rx="0"/><text x="154.0" y="287" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">E×4</text><rect x="180" y="270" width="39" height="26" fill="#eaf5ea" stroke="#555" stroke-width="1" rx="0"/><text x="199.5" y="287" fill="#222" font-size="10" text-anchor="middle" font-weight="normal">M×3</text><text x="229" y="287" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">1 / 4 / 3，bias 7；无 inf，仅一个 NaN 编码——独立设计</text><text x="380" y="318" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">位域包含不等于"转换就是把低位扔掉"：转换按最近舍入（§2）。</text>
</svg>
