  <rect class="blue" x="20" y="295" width="16" height="16"/>
  <text class="s" x="42" y="308">已在 KV cache 里的前缀</text>
  <rect class="green" x="220" y="295" width="16" height="16"/>
  <text class="s" x="242" y="308">本步新 token（K/V 先写入 cache，再被本步读到）</text>
  <rect class="white" x="20" y="319" width="16" height="16"/>
  <text class="s" x="42" y="332">因果 mask 掉（A 的后续新 token）</text>
  <line class="mark" x1="300" y1="327" x2="316" y2="327"/>
  <text class="s" x="322" y="332">cu_seqlens_q 的边界（packed Q 行号）</text>
  <text class="m" x="20" y="362">cu_seqlens_q = [0, 4, 5, 6]（Q 共 6 行）    seq_lens = [12, 12, 6]（K/V 长度）</text>
