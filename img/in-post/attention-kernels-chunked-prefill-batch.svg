<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-labelledby="t d">
  <title id="t">一个 chunked-prefill batch 的 Q 行与可见 key</title>
  <desc id="d">请求 A 正在 prefill 第二个 chunk：q_len = 4，ctx_len = 8，packed Q 行 a0–a3 分别能看到 key 0–8、0–9、0–10、0–11，其中 0–7 是已在 KV cache 里的前缀，8–11 是本步新 token，seq_len = 12。B 在 decode：q_len = 1，ctx_len = 11，b0 看到 0–10 的前缀和新 token 11，seq_len = 12。C 在 decode：q_len = 1，ctx_len = 5，c0 看到 0–4 的前缀和新 token 5，seq_len = 6。cu_seqlens_q = [0, 4, 5, 6]（Q 共 6 行），seq_lens = [12, 12, 6]。本步新 token 的 K/V 先写入 cache，再被本步读到。</desc>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; font-weight: 600; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 14px; }
      .bb { font-size: 14px; font-weight: 700; }
      .s { font-size: 13px; }
      .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 600; }
      .ms { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
      .red { fill: #a3271f; }
      .blue { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .dblue { fill: #9fc0ec; stroke: #40566f; stroke-width: 1.2; }
      .green { fill: #dcefe2; stroke: #40566f; stroke-width: 1.2; }
      .orange { fill: #fde4c8; stroke: #40566f; stroke-width: 1.2; }
      .purple { fill: #e9def5; stroke: #40566f; stroke-width: 1.2; }
      .gray { fill: #e6e9ee; stroke: #40566f; stroke-width: 1.2; }
      .white { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .wait { fill: #fff; stroke: #8a97a6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.2; }
      .ln { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .thin { stroke: #8a97a6; stroke-width: 1; fill: none; }
      .arr { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .mark { stroke: #c0392b; stroke-width: 2.2; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="376" fill="#fff"/>
  <text class="bb" x="20" y="24">一个 chunked-prefill batch：请求 A 正在 prefill 第二个 chunk，B、C 在 decode</text>
  <text class="s" x="30" y="62" text-anchor="middle">请求</text>
  <text class="s" x="82" y="62" text-anchor="middle">q_len</text>
  <text class="s" x="140" y="62" text-anchor="middle">ctx_len</text>
  <text class="s" x="218" y="62" text-anchor="middle">Q 行</text>
  <text class="ms" x="218" y="78" text-anchor="middle">(packed)</text>
  <text class="s" x="250" y="44">能看到的 key（位置 0 … ctx_len+q）</text>
