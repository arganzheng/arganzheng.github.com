<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">FP32 + Adam(W)：每个参数在显存里对应四块同样大小的内存，合计 16 B</text><rect x="60" y="60" width="150" height="70" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.5" rx="4"/><text x="135.0" y="84" fill="#1f6fb2" font-size="14" text-anchor="middle" font-weight="600">param</text><text x="135.0" y="104" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">权重本身</text><text x="135.0" y="120" fill="#1f6fb2" font-size="12" text-anchor="middle" font-weight="600">4 B</text><rect x="220" y="60" width="150" height="70" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.5" rx="4"/><text x="295.0" y="84" fill="#1f6fb2" font-size="14" text-anchor="middle" font-weight="600">grad</text><text x="295.0" y="104" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">.grad，反向算出的梯度</text><text x="295.0" y="120" fill="#1f6fb2" font-size="12" text-anchor="middle" font-weight="600">4 B</text><rect x="380" y="60" width="150" height="70" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="455.0" y="84" fill="#c98a00" font-size="14" text-anchor="middle" font-weight="600">exp_avg</text><text x="455.0" y="104" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">一阶动量 m（梯度的滑动平均）</text><text x="455.0" y="120" fill="#c98a00" font-size="12" text-anchor="middle" font-weight="600">4 B</text><rect x="540" y="60" width="150" height="70" fill="#fff4e0" stroke="#c98a00" stroke-width="1.5" rx="4"/><text x="615.0" y="84" fill="#c98a00" font-size="14" text-anchor="middle" font-weight="600">exp_avg_sq</text><text x="615.0" y="104" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">二阶动量 v（梯度平方的滑动平均）</text><text x="615.0" y="120" fill="#c98a00" font-size="12" text-anchor="middle" font-weight="600">4 B</text><line x1="60" y1="144" x2="370" y2="144" stroke="#1f6fb2" stroke-width="2"/><text x="215" y="160" fill="#1f6fb2" font-size="11" text-anchor="middle" font-weight="600">Module 持有：8 B</text><line x1="380" y1="144" x2="690" y2="144" stroke="#c98a00" stroke-width="2"/><text x="535" y="160" fill="#c98a00" font-size="11" text-anchor="middle" font-weight="600">Optimizer.state 持有：8 B</text><text x="380" y="188" fill="#333" font-size="13" text-anchor="middle" font-weight="600">合计 16 B / 参数</text><line x1="40" y1="208" x2="720" y2="208" stroke="#ddd" stroke-width="1"/><text x="60" y="228" fill="#333" font-size="12" text-anchor="start" font-weight="600">换算到 7B 参数的模型：</text><rect x="60" y="238" width="140.0" height="30" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1" rx="0"/><text x="130.0" y="257" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">param 28 GB</text><rect x="200.0" y="238" width="140.0" height="30" fill="#dbe8f7" stroke="#1f6fb2" stroke-width="1" rx="0"/><text x="270.0" y="257" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">grad 28 GB</text><rect x="340.0" y="238" width="140.0" height="30" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="0"/><text x="410.0" y="257" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">exp_avg 28 GB</text><rect x="480.0" y="238" width="140.0" height="30" fill="#ffe7bd" stroke="#c98a00" stroke-width="1" rx="0"/><text x="550.0" y="257" fill="#333" font-size="10.5" text-anchor="middle" font-weight="normal">exp_avg_sq 28 GB</text><text x="628" y="257" fill="#333" font-size="12" text-anchor="start" font-weight="600">= 112 GB</text><text x="60" y="290" fill="#333" font-size="11" text-anchor="start" font-weight="normal">7e9 × 16 B ≈ 112 GB，其中 param + grad = 56 GB、Optimizer state = 56 GB——还没算激活值和临时缓冲，一张 80 GB 的卡已经放不下。</text><text x="60" y="308" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">所以多卡训练最先被切到各卡上的就是 Optimizer state（第九篇 ZeRO / FSDP）；</text><text x="60" y="324" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">混合精度把 param / grad 换成 bf16 也只省 4 B，主权重和动量仍是 fp32（第八篇算完整的账）。</text>
</svg>
