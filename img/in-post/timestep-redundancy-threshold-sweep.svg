<text class="t" x="568.6" y="268" text-anchor="middle">0.3</text>
<line class="ax" x1="610.2" y1="250" x2="610.2" y2="254"/>
<text class="t" x="610.2" y="268" text-anchor="middle">0.4</text>
<line class="ax" x1="651.7" y1="250" x2="651.7" y2="254"/>
<text class="t" x="651.7" y="268" text-anchor="middle">0.5</text>
<line class="ax" x1="693.2" y1="250" x2="693.2" y2="254"/>
<text class="t" x="693.2" y="268" text-anchor="middle">0.6</text>
<text x="720.0" y="254">τ</text>
<path d="M464.8 64.0 L485.5 70.0 L506.3 88.0 L527.1 120.4 L547.8 154.0 L568.6 166.0 L589.4 178.0 L610.2 190.0 L651.7 208.0 L693.2 226.0" style="fill:none;stroke:#D55E00;stroke-width:2;stroke-dasharray:6 4"/>
<circle cx="547.8" cy="154.0" r="5" fill="#D55E00"/>
<text class="t" x="547.8" y="144.0" text-anchor="middle">33</text>
<circle cx="610.2" cy="190.0" r="5" fill="#D55E00"/>
<text class="t" x="610.2" y="180.0" text-anchor="middle">30</text>
<circle cx="693.2" cy="226.0" r="5" fill="#D55E00"/>
<text class="t" x="693.2" y="216.0" text-anchor="middle">27</text>
<text x="579.0" y="292" text-anchor="middle">质量对 τ 先平后降（累积误差超过去噪能吸收的量）</text>
<circle cx="70" cy="316" r="5" fill="#555"/>
<text class="t" x="82" y="320">正文表格档位（0.25 / 0.4 / 0.6）</text>
<line x1="300" y1="316" x2="330" y2="316" style="stroke:#555;stroke-width:2;stroke-dasharray:6 4"/>
<text class="t" x="338" y="320">示意趋势：除 0.25 / 0.4 / 0.6 外均非实测（含 τ 很小时约 40 dB 走平）</text>
</svg>
