<svg xmlns="http://www.w3.org/2000/svg" width="740" height="336" viewBox="0 0 740 336" role="img" aria-labelledby="tr-sweep-t tr-sweep-d">
<title id="tr-sweep-t">阈值扫描：加速比与 PSNR 曲线的形状</title>
<desc id="tr-sweep-d">两幅折线图，横轴都是 TeaCache 阈值 τ（0 到 0.6）。实心点是正文表格的三个档位：左图加速比 0.25 / 0.4 / 0.6 约 1.5 / 1.8 / 2.0×，右图对基线图的 PSNR 约 33 / 30 / 27 dB。其余部分是虚线示意趋势，不是实测：加速比从 τ=0 的 1.0× 上升后趋于饱和；PSNR 在 τ 很小时约 40 dB 走平，之后下降。两图在 τ=0.3–0.4 处有灰带，标为工作点。</desc>
<style>
text{font-family:"Hiragino Sans GB","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:600;fill:#111;font-size:13px}
.t{font-size:12px} .s{font-size:11.5px} .h{font-size:14px}
.ax{stroke:#111;stroke-width:1.2;fill:none} .grid{stroke:#d8d8d8;stroke-width:1}
.br{stroke:#111;stroke-width:1.2;fill:none}
</style>
<rect width="740" height="336" fill="#fff"/>
<rect x="190.6" y="40" width="41.5" height="210" fill="#ececec"/>
<text class="s" x="211.4" y="242" text-anchor="middle">工作点</text>
<line class="grid" x1="66" y1="180.0" x2="336.0" y2="180.0"/>
<line class="grid" x1="66" y1="110.0" x2="336.0" y2="110.0"/>
<line class="grid" x1="66" y1="40.0" x2="336.0" y2="40.0"/>
<text class="t" x="58" y="254.0" text-anchor="end">1.0</text>
<text class="t" x="58" y="184.0" text-anchor="end">1.5</text>
<text class="t" x="58" y="114.0" text-anchor="end">2.0</text>
<text class="t" x="58" y="44.0" text-anchor="end">2.5</text>
<text x="58" y="26" text-anchor="start">加速比</text>
<path class="ax" d="M66 36 V250 H336.0"/>
<line class="ax" x1="66.0" y1="250" x2="66.0" y2="254"/>
<text class="t" x="66.0" y="268" text-anchor="middle">0.0</text>
<line class="ax" x1="107.5" y1="250" x2="107.5" y2="254"/>
<text class="t" x="107.5" y="268" text-anchor="middle">0.1</text>
<line class="ax" x1="149.1" y1="250" x2="149.1" y2="254"/>
<text class="t" x="149.1" y="268" text-anchor="middle">0.2</text>
<line class="ax" x1="190.6" y1="250" x2="190.6" y2="254"/>
<text class="t" x="190.6" y="268" text-anchor="middle">0.3</text>
<line class="ax" x1="232.2" y1="250" x2="232.2" y2="254"/>
<text class="t" x="232.2" y="268" text-anchor="middle">0.4</text>
<line class="ax" x1="273.7" y1="250" x2="273.7" y2="254"/>
<text class="t" x="273.7" y="268" text-anchor="middle">0.5</text>
<line class="ax" x1="315.2" y1="250" x2="315.2" y2="254"/>
<text class="t" x="315.2" y="268" text-anchor="middle">0.6</text>
<text x="342.0" y="254">τ</text>
<path d="M66.0 250.0 L86.8 231.8 L107.5 215.0 L128.3 202.4 L149.1 191.2 L169.8 180.0 L190.6 166.0 L211.4 152.0 L232.2 138.0 L273.7 121.2 L315.2 110.0" style="fill:none;stroke:#0072B2;stroke-width:2;stroke-dasharray:6 4"/>
<circle cx="169.8" cy="180.0" r="5" fill="#0072B2"/>
<text class="t" x="169.8" y="170.0" text-anchor="middle">1.5×</text>
<circle cx="232.2" cy="138.0" r="5" fill="#0072B2"/>
<text class="t" x="232.2" y="128.0" text-anchor="middle">1.8×</text>
<circle cx="315.2" cy="110.0" r="5" fill="#0072B2"/>
<text class="t" x="315.2" y="100.0" text-anchor="middle">2.0×</text>
<text x="201.0" y="292" text-anchor="middle">加速比对 τ 先快后饱和（首末步是硬底）</text>
<rect x="568.6" y="40" width="41.5" height="210" fill="#ececec"/>
<text class="s" x="589.4" y="242" text-anchor="middle">工作点</text>
