<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342" role="img" aria-labelledby="nixl-request-timeline-t nixl-request-timeline-d">
<title id="nixl-request-timeline-t">NixlConnector 一个请求的生命周期</title>
<desc id="nixl-request-timeline-d">横轴是时间，五行分别是 prefill worker、prefill scheduler、router、decode scheduler、decode worker。1–3 是首次遇到 prefill engine 时的握手，4–7 是 prefill，8–17 是 decode 侧发起 READ、轮询完成、通知 prefill 释放 block 并进入 decode。</desc>
<style>text{dominant-baseline:auto}</style>
