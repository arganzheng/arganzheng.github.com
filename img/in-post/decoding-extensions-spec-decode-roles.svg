<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
  <title id="t">投机解码在 vLLM 里改的三个角色</title>
  <desc id="d">Proposer 产出 draft；Scheduler 把 draft 算进预算、预留 lookahead 槽位并在 step 后回滚；GPUModelRunner 一次 forward 取 1+K 个位置的 logits；RejectionSampler 验证候选并采 bonus。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<rect class="compute" x="40" y="16" width="320" height="56"/><text x="200.0" y="39" text-anchor="middle" class="bold">Proposer</text><text x="200.0" y="59" text-anchor="middle" class="small">vllm/v1/spec_decode/</text><text x="380" y="47" text-anchor="start" class="small">产出 draft_token_ids（可选 draft_probs）</text><line x1="200" y1="72" x2="200" y2="100" class="arrow"/><rect class="compute" x="40" y="100" width="320" height="56"/><text x="200.0" y="123" text-anchor="middle" class="bold">Scheduler</text><text x="200.0" y="143" text-anchor="middle" class="small">vllm/v1/core/sched/scheduler.py</text><text x="380" y="122" text-anchor="start" class="small">把 draft 算进 token 预算；给 KV 预留 lookahead 槽位；</text><text x="380" y="140" text-anchor="start" class="small">step 后按接受数回滚 num_computed_tokens</text><line x1="200" y1="156" x2="200" y2="184" class="arrow"/><rect class="compute" x="40" y="184" width="320" height="56"/><text x="200.0" y="207" text-anchor="middle" class="bold">GPUModelRunner</text><text x="200.0" y="227" text-anchor="middle" class="small">vllm/v1/worker/gpu_model_runner.py</text><text x="380" y="206" text-anchor="start" class="small">_calc_spec_decode_metadata()：</text><text x="380" y="224" text-anchor="start" class="small">一次 forward 取 1+K 个位置的 logits</text><line x1="200" y1="240" x2="200" y2="268" class="arrow"/><rect class="compute" x="40" y="268" width="320" height="56"/><text x="200.0" y="291" text-anchor="middle" class="bold">RejectionSampler</text><text x="200.0" y="311" text-anchor="middle" class="small">vllm/v1/sample/rejection_sampler.py</text><text x="380" y="290" text-anchor="start" class="small">验证 K 个候选 + 采 1 个 bonus，</text><text x="380" y="308" text-anchor="start" class="small">输出 [batch, K+1]，被拒位置填 -1</text>
</svg>
