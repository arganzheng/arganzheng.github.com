<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <style>
    .h0{fill:#fde7c8;stroke:#c98a00} .h1{fill:#d6e6ff;stroke:#5b8def} .lbl{fill:#222} .mut{fill:#666;font-size:11px} .t{font-weight:600;fill:#222}
  </style>
  <!-- panel 1: Q [T, d] -->
  <text x="18" y="22" class="t">① Q = X @ W_Q → [T, d]（B 省略，T = 3，d = 4）</text>
  <g transform="translate(30,40)">
    <!-- rows t=0..2, cols d=0..3, each cell 34x28 -->
    <rect x="0"   y="0"  width="34" height="28" class="h0"/><rect x="34" y="0" width="34" height="28" class="h0"/><rect x="68" y="0" width="34" height="28" class="h1"/><rect x="102" y="0" width="34" height="28" class="h1"/>
    <rect x="0"   y="28" width="34" height="28" class="h0"/><rect x="34" y="28" width="34" height="28" class="h0"/><rect x="68" y="28" width="34" height="28" class="h1"/><rect x="102" y="28" width="34" height="28" class="h1"/>
    <rect x="0"   y="56" width="34" height="28" class="h0"/><rect x="34" y="56" width="34" height="28" class="h0"/><rect x="68" y="56" width="34" height="28" class="h1"/><rect x="102" y="56" width="34" height="28" class="h1"/>
    <text x="-8" y="18" text-anchor="end" class="mut">t=0</text><text x="-8" y="46" text-anchor="end" class="mut">t=1</text><text x="-8" y="74" text-anchor="end" class="mut">t=2</text>
    <text x="17" y="-6" text-anchor="middle" class="mut">d0</text><text x="51" y="-6" text-anchor="middle" class="mut">d1</text><text x="85" y="-6" text-anchor="middle" class="mut">d2</text><text x="119" y="-6" text-anchor="middle" class="mut">d3</text>
    <text x="0" y="104" class="mut">内存里按行连续：t0d0 t0d1 t0d2 t0d3 t1d0 …</text>
  </g>
  <!-- panel 2: reshape [T, h, d_h] -->
  <text x="18" y="172" class="t">② reshape → [T, h, d_h]（h = 2，d_h = 2）</text>
  <text x="18" y="188" class="m" style="fill:#666;font-size:11px">同一块内存，只是把每行的 4 个数读成 2 组 × 2 个</text>
  <g transform="translate(30,216)">
    <g>
      <rect x="0"  y="0" width="34" height="28" class="h0"/><rect x="34" y="0" width="34" height="28" class="h0"/>
      <rect x="82" y="0" width="34" height="28" class="h1"/><rect x="116" y="0" width="34" height="28" class="h1"/>
      <rect x="0"  y="28" width="34" height="28" class="h0"/><rect x="34" y="28" width="34" height="28" class="h0"/>
      <rect x="82" y="28" width="34" height="28" class="h1"/><rect x="116" y="28" width="34" height="28" class="h1"/>
      <rect x="0"  y="56" width="34" height="28" class="h0"/><rect x="34" y="56" width="34" height="28" class="h0"/>
      <rect x="82" y="56" width="34" height="28" class="h1"/><rect x="116" y="56" width="34" height="28" class="h1"/>
      <text x="-8" y="18" text-anchor="end" class="mut">t=0</text><text x="-8" y="46" text-anchor="end" class="mut">t=1</text><text x="-8" y="74" text-anchor="end" class="mut">t=2</text>
      <text x="34" y="-6" text-anchor="middle" class="mut">head 0</text><text x="116" y="-6" text-anchor="middle" class="mut">head 1</text>
      <text x="0" y="104" class="mut">零成本：不复制数据，stride 变了</text>
    </g>
  </g>
  <!-- arrow to panel 3 -->
  <line x1="200" y1="266" x2="300" y2="266" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="256" text-anchor="middle" class="mut">transpose(0, 2, 1, 3)</text>
  <!-- panel 3: [h, T, d_h] -->
  <text x="330" y="172" class="t">③ transpose → [h, T, d_h]</text>
  <text x="330" y="188" class="m" style="fill:#666;font-size:11px">每个头独立成一个 [T, d_h] 矩阵</text>
  <g transform="translate(330,216)">
    <text x="34" y="-6" text-anchor="middle" class="mut">head 0 : [T, d_h]</text>
    <rect x="0" y="0" width="34" height="28" class="h0"/><rect x="34" y="0" width="34" height="28" class="h0"/>
    <rect x="0" y="28" width="34" height="28" class="h0"/><rect x="34" y="28" width="34" height="28" class="h0"/>
    <rect x="0" y="56" width="34" height="28" class="h0"/><rect x="34" y="56" width="34" height="28" class="h0"/>
    <text x="-8" y="18" text-anchor="end" class="mut">t=0</text><text x="-8" y="46" text-anchor="end" class="mut">t=1</text><text x="-8" y="74" text-anchor="end" class="mut">t=2</text>
  </g>
  <g transform="translate(450,216)">
    <text x="34" y="-6" text-anchor="middle" class="mut">head 1 : [T, d_h]</text>
    <rect x="0" y="0" width="34" height="28" class="h1"/><rect x="34" y="0" width="34" height="28" class="h1"/>
    <rect x="0" y="28" width="34" height="28" class="h1"/><rect x="34" y="28" width="34" height="28" class="h1"/>
    <rect x="0" y="56" width="34" height="28" class="h1"/><rect x="34" y="56" width="34" height="28" class="h1"/>
  </g>
  <text x="330" y="320" class="mut">内存没动，但读取顺序变成 t0d0 t0d1 t1d0 t1d1 … —— 不再连续。</text>
  <text x="330" y="336" class="mut">之后每个头各算自己的 Q Kᵀ：[T, d_h] × [d_h, T] → [T, T]</text>
  <!-- right side of panel 1: the S computation -->
  <g transform="translate(330,40)">
    <text x="0" y="0" class="t">④ S = Q @ K.transpose(0, 1, 3, 2)</text>
    <text x="0" y="22" class="lbl">[B, h, T, d_h] × [B, h, d_h, T] → [B, h, T, T]</text>
    <text x="0" y="46" class="mut">最后两维做矩阵乘（内维 d_h 相同），</text>
    <text x="0" y="62" class="mut">前面的 B、h 只是"有 B×h 份"——</text>
    <text x="0" y="78" class="mut">每个头、每句话各得一张 T×T 的分数表。</text>
  </g>
</svg>
