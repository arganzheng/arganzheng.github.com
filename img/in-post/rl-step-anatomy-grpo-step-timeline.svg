<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d">
  <title id="t">GRPO 严格 on-policy 的一步</title>
  <desc id="d">一条时间轴 t0 → t1 → t2 → t3 → t0'，三行。推理引擎：t0–t1 prefill 和 decode 直到长尾结束，t1–t3 空闲等新权重（共置形态下显存让给训练），t3 同步 ② 收到 θ_{t+1}。打分：t1–t2 验证器 / 沙箱 / RM。训练器：t0–t2 空闲等全部 rollout 完成，t2–t3 参考前向、旧策略前向、优势 A 和 μ 轮训练。t1 样本（token、log π_old、结束原因）交给打分，t2 样本 + reward 交给训练器，t3 θ_{t+1} 回到推理引擎，再进入下一步。两道墙：t1 训练器等最后一条 rollout，t3 推理引擎等新权重。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="24" y="18" text-anchor="start" class="small">时间</text><line x1="96" y1="14" x2="756" y2="14" class="axis"/><line x1="96" y1="10" x2="96" y2="18" class="line"/><text x="96" y="32" text-anchor="middle" class="mono">t0</text><line x1="310" y1="10" x2="310" y2="18" class="line"/><text x="310" y="32" text-anchor="middle" class="mono">t1</text><line x1="420" y1="10" x2="420" y2="18" class="line"/><text x="420" y="32" text-anchor="middle" class="mono">t2</text><line x1="690" y1="10" x2="690" y2="18" class="line"/><text x="690" y="32" text-anchor="middle" class="mono">t3</text><line x1="748" y1="10" x2="748" y2="18" class="line"/><text x="748" y="32" text-anchor="middle" class="mono">t0'</text><text x="24" y="124" text-anchor="start" class="bold">推理引擎</text><rect class="seg-a" x="96" y="100" width="60" height="36"/><text x="126.0" y="123.0" text-anchor="middle" class="small">prefill</text><rect class="seg-a" x="156" y="100" width="154" height="36"/><text x="233.0" y="123.0" text-anchor="middle" class="small">decode ……长尾</text><rect class="seg-wait" x="310" y="100" width="380" height="36"/><text x="500.0" y="123.0" text-anchor="middle" class="small">空闲：等新权重（共置形态下显存让给训练）</text><rect class="seg-mark" x="690" y="100" width="58" height="36"/><text x="719.0" y="123.0" text-anchor="middle" class="small">同步 ②</text><text x="24" y="204" text-anchor="start" class="bold">打分</text><rect class="seg-freefrag" x="310" y="180" width="110" height="36"/><text x="365.0" y="203.0" text-anchor="middle" class="small">验证器 / RM</text><text x="24" y="284" text-anchor="start" class="bold">训练器</text><rect class="seg-wait" x="96" y="260" width="324" height="36"/><text x="108" y="283.0" text-anchor="start" class="small">空闲：等全部 rollout 完成</text><rect class="seg-b" x="420" y="260" width="60" height="36"/><text x="450.0" y="283.0" text-anchor="middle" class="small">参考前向</text><rect class="seg-b" x="480" y="260" width="76" height="36"/><text x="518.0" y="283.0" text-anchor="middle" class="small">旧策略前向</text><rect class="seg-b" x="556" y="260" width="134" height="36"/><text x="623.0" y="283.0" text-anchor="middle" class="small">优势 A → μ 轮训练</text><path d="M310 136 V180" class="arrow"/><text x="316" y="162.0" text-anchor="start" class="small">样本：token、log π_old、结束原因</text><path d="M420 216 V260" class="arrow"/><text x="426" y="242.0" text-anchor="start" class="small">样本 + reward</text><path d="M690 260 V136" class="arrow"/><text x="696" y="242.0" text-anchor="start" class="mono">θ_{t+1}</text><line x1="310" y1="94" x2="310" y2="302" stroke="#d79a45" stroke-width="1.4" stroke-dasharray="5 4"/><text x="310" y="318" text-anchor="middle" class="small">墙 ①：训练器等最后一条 rollout</text><line x1="690" y1="94" x2="690" y2="302" stroke="#d79a45" stroke-width="1.4" stroke-dasharray="5 4"/><text x="698" y="318" text-anchor="end" class="small">墙 ②：推理引擎等新权重</text><path d="M719.0 100 V64 H203.0 V97" class="arrow"/><text x="461.0" y="56" text-anchor="middle" class="small">下一步（t0'）</text>
</svg>
