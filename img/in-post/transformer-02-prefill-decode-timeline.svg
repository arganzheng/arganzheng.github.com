<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="450" y="24" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">一次请求的时间线（示意，不按比例）：prefill 一大块算完 prompt，之后每个 decode 只算 1 个 token</text><line x1="60" y1="150" x2="860" y2="150" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/><text x="862" y="154" fill="#888" font-size="10.5" text-anchor="start" font-weight="normal">时间</text><rect x="60" y="90" width="260" height="44" fill="#eaf5ea" stroke="#4d9a5c" stroke-width="1.4" rx="4"/><text x="190" y="109" fill="#222" font-size="11.5" text-anchor="middle" font-weight="600">prefill：T 个 prompt token 一次前向</text><text x="190" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">计算密集：一次读权重、算 T 个位置</text><rect x="326" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="361" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">decode 1</text><text x="361" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="323" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">mat</text><line x1="323" y1="82" x2="323" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><rect x="402" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="437" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">decode 2</text><text x="437" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="399" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">because</text><line x1="399" y1="82" x2="399" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><rect x="478" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="513" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">decode 3</text><text x="513" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="475" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">it</text><line x1="475" y1="82" x2="475" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><rect x="554" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="589" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">decode 4</text><text x="589" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="551" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">was</text><line x1="551" y1="82" x2="551" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><rect x="630" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="665" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">decode 5</text><text x="665" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="627" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">tired</text><line x1="627" y1="82" x2="627" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><rect x="706" y="90" width="70" height="44" fill="#fff4e0" stroke="#c98a00" stroke-width="1.2" rx="4"/><text x="741" y="109" fill="#222" font-size="11" text-anchor="middle" font-weight="600">…</text><text x="741" y="125" fill="#555" font-size="10" text-anchor="middle" font-weight="normal">1 个 token</text><text x="703" y="78" fill="#8a6bd1" font-size="11" text-anchor="middle" font-weight="600">…</text><line x1="703" y1="82" x2="703" y2="92" stroke="#8a6bd1" stroke-width="1" marker-end="url(#ar)"/><text x="320" y="60" fill="#8a6bd1" font-size="10.5" text-anchor="middle" font-weight="normal">每段结束吐出一个 token（紫色）</text><line x1="60" y1="172" x2="323" y2="172" stroke="#c0392b" stroke-width="1.3" marker-end="url(#ar)"/><line x1="323" y1="172" x2="60" y2="172" stroke="#c0392b" stroke-width="1.3" marker-end="url(#ar)"/><text x="191" y="190" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">TTFT：用户等第一个字的时间</text><line x1="326" y1="172" x2="399" y2="172" stroke="#1f6fb2" stroke-width="1.3" marker-end="url(#ar)"/><line x1="399" y1="172" x2="326" y2="172" stroke="#1f6fb2" stroke-width="1.3" marker-end="url(#ar)"/><text x="363" y="190" fill="#1f6fb2" font-size="11" text-anchor="middle" font-weight="600">TPOT</text><text x="480" y="190" fill="#1f6fb2" font-size="10.5" text-anchor="start" font-weight="normal">每个字之间的间隔：访存密集，每步都要把全部权重读一遍</text><text x="60" y="222" fill="#333" font-size="11" text-anchor="start" font-weight="normal">「第一个字慢、后面快」：prefill 要把整个 prompt 算完才能出第一个字；之后每步只算 1 个 token，但每步都要读一遍全部参数。</text>
</svg>
