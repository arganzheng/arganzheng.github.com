<svg xmlns="http://www.w3.org/2000/svg" width="750" height="279" viewBox="0 0 750 279" role="img" aria-labelledby="title desc">
<title id="title">三种多 agent 模式</title><desc id="desc">三个并排的小图。orchestrator-workers：主 agent 分出 worker A、B、C 三路，结果汇到主综合；主 agent 分解、派发、综合。handoff：agent A 把控制权移交给 agent B，或者直接移交给 agent C，B 也可以再交给 C；控制权在 agent 间流动。层级：主 agent 委派给三个子 agent，第一个子 agent 再委派给两个子子 agent；树状委派，每层综合下一层。</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB",sans-serif;font-size:13px;font-weight:600;fill:#111}
.title{font-size:17px;font-weight:700}.ptitle{font-size:15px;font-weight:700}.cap{font-size:13px;fill:#333}
.mono{font-family:"Noto Sans Mono CJK SC",ui-monospace,monospace;font-size:12px}
.box{stroke:#536273;stroke-width:1.2}.dash{stroke:#536273;stroke-width:1.2;stroke-dasharray:5 4}
.line{fill:none;stroke:#536273;stroke-width:1.4}.arrow{fill:none;stroke:#536273;stroke-width:1.4;marker-end:url(#ah)}
.darrow{fill:none;stroke:#536273;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#ah)}
.axis{fill:none;stroke:#888;stroke-width:1.2;marker-end:url(#ax)}.sep{stroke:#d5dbe2;stroke-width:1}</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#536273"/></marker>
<marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#888"/></marker></defs>
<rect width="750" height="279" fill="#fff"/>
<text x="20.0" y="30.0" class="title" text-anchor="start">三种多 agent 模式</text>
<path d="M48,152.0 H61.0 M61.0,112.0 V192.0" class="line"/>
<path d="M61.0,112.0 H74" class="arrow"/>
<path d="M61.0,152.0 H74" class="arrow"/>
<path d="M61.0,192.0 H74" class="arrow"/>
