<text class="m" x="16" y="302" text-anchor="start">4 个核心，每个核心真正做算术的 ALU 只占一角；</text>
<text class="m" x="16" y="318" text-anchor="start">缓存几十 MB。</text>
<text class="m" x="16" y="334" text-anchor="start">目标：让一条指令流等得尽量短（延迟优化）。</text>
<text class="m" x="392" y="302" text-anchor="start">108 个 SM，每个 64 FP32 + 4 Tensor Core +</text>
<text class="m" x="392" y="318" text-anchor="start">256 KB 寄存器 + 192 KB L1/shared；</text>
<text class="m" x="392" y="334" text-anchor="start">没有分支预测与乱序。目标：总吞吐，用海量线程把延迟藏起来。</text>
