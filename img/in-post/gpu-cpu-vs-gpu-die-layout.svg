<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 361" width="760" height="361" role="img" aria-labelledby="title desc">
  <title id="title">CPU 与 GPU 芯片版图的对比</title>
  <desc id="desc">左侧展示四个 CPU 核心及共享 L3 缓存；右侧展示 A100 的 108 个 SM、共享 L2 和 HBM。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f1f3f6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c5d0dc" stroke-width="2"/>
    </pattern>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
.head { font-size: 15px; font-weight: 700; }
.body { font-size: 14px; }
.small { font-size: 13px; }
.tick { font-family: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 12px; fill: #40566f; }
.axis { stroke: #40566f; stroke-width: 1.5; fill: none; }
.grid { stroke: #e3e9ef; stroke-width: 1; fill: none; }
.guide { stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.arrow { stroke: #40566f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
.frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.3; }
.cpu { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
.gpu { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
.idle { fill: url(#hatch); stroke: #9aa8b6; stroke-width: 1.2; }

text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243447; }
.t { font-size: 12px; font-weight: 700; fill: #222; }
.m { font-size: 11px; fill: #666; }
.core-label { font-size: 10px; fill: #666; }
.sm-label { font-size: 11px; fill: #1d4ed8; }
.panel { fill: #fafafa; stroke: #999; }
.core { fill: #fff; stroke: #555; }
.ctl { fill: #fef3c7; stroke: #b45309; }
.alu, .sm { fill: #dbeafe; stroke: #1d4ed8; }
.cache, .l2 { fill: #ede9fe; stroke: #7e22ce; }
.hbm { fill: #dcfce7; stroke: #15803d; }
</style>
  </defs>
  <rect x="0" y="0" width="760" height="361" fill="#fff"/>
<rect x="0" y="0" width="760" height="361" fill="#fff"/>
<text class="t" x="16" y="22" text-anchor="start">CPU 芯片：几个大核心，大部分面积是控制逻辑与缓存</text>
<g transform="translate(16,34)">
<rect x="0" y="0" width="360" height="250" class="panel"/>
<g id="core"><rect x="10" y="10" width="164" height="100" class="core"/><rect x="16" y="16" width="152" height="30" class="ctl"/><text class="core-label" x="92" y="35" text-anchor="middle">分支预测 · 乱序调度 · 重命名</text><rect x="16" y="50" width="74" height="26" class="ctl"/><text class="m" x="53" y="67" text-anchor="middle">取指 / 译码</text><rect x="94" y="50" width="74" height="26" class="alu"/><text class="m" x="131" y="67" text-anchor="middle">ALU（小）</text><rect x="16" y="80" width="152" height="24" class="cache"/><text class="m" x="92" y="97" text-anchor="middle">私有 L1 / L2 缓存</text></g>
<use href="#core" x="174" y="0"/>
<use href="#core" x="0" y="110"/>
<use href="#core" x="174" y="110"/>
<rect x="10" y="222" width="340" height="22" class="cache"/>
<text class="m" x="180" y="237" text-anchor="middle">共享 L3 缓存：几十 MB</text>
</g>
<text class="t" x="392" y="22" text-anchor="start">GPU 芯片（A100）：108 个小 SM 铺满，缓存很小</text>
