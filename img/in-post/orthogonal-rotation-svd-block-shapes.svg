<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="380" y="22" fill="#222" font-size="14" text-anchor="middle" font-weight="600">W = U Σ Vᵀ：三个因子的形状（m ≥ n，本图 m = 6、n = 4）</text><rect x="40" y="60" width="88" height="132" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.5" rx="3"/><text x="84.0" y="52" fill="#222" font-size="12" text-anchor="middle" font-weight="600">W  [m × n]</text><text x="84.0" y="208" fill="#666" font-size="10.5" text-anchor="middle" font-weight="normal">任意矩阵</text><text x="84.0" y="131" fill="#1f6fb2" font-size="18" text-anchor="middle" font-weight="600">W</text><text x="144" y="131" fill="#333" font-size="18" text-anchor="middle" font-weight="normal">=</text><rect x="180" y="60" width="88" height="132" fill="#fff" stroke="#1f6fb2" stroke-width="1.5" rx="3"/><text x="191.0" y="97.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="191.0" y="119.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">u1</text><text x="191.0" y="141.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="213.0" y="97.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="213.0" y="119.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">u2</text><text x="213.0" y="141.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="235.0" y="97.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="235.0" y="119.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">u3</text><text x="235.0" y="141.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="257.0" y="97.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="257.0" y="119.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">u4</text><text x="257.0" y="141.0" fill="#1f6fb2" font-size="10" text-anchor="middle" font-weight="normal">|</text><text x="224.0" y="52" fill="#222" font-size="12" text-anchor="middle" font-weight="600">U  [m × n]</text><text x="224.0" y="208" fill="#666" font-size="10.5" text-anchor="middle" font-weight="normal">列 u₁…uₙ：互相垂直、长 1</text><text x="284" y="131" fill="#333" font-size="18" text-anchor="middle" font-weight="normal">·</text><rect x="300" y="60" width="88" height="88" fill="#fff" stroke="#c98a00" stroke-width="1.5" rx="3"/><text x="311.0" y="75.0" fill="#c98a00" font-size="10" text-anchor="middle" font-weight="normal">σ1</text><text x="333.0" y="97.0" fill="#c98a00" font-size="10" text-anchor="middle" font-weight="normal">σ2</text><text x="355.0" y="119.0" fill="#c98a00" font-size="10" text-anchor="middle" font-weight="normal">σ3</text><text x="377.0" y="141.0" fill="#c98a00" font-size="10" text-anchor="middle" font-weight="normal">σ4</text><text x="344.0" y="52" fill="#222" font-size="12" text-anchor="middle" font-weight="600">Σ  [n × n]</text><text x="344.0" y="164" fill="#666" font-size="10.5" text-anchor="middle" font-weight="normal">对角 σ₁ ≥ … ≥ σₙ ≥ 0</text><text x="333.0" y="75.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="355.0" y="75.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="377.0" y="75.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="311.0" y="97.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="355.0" y="97.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="377.0" y="97.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="311.0" y="119.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="333.0" y="119.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="377.0" y="119.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="311.0" y="141.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="333.0" y="141.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="355.0" y="141.0" fill="#ccc" font-size="9" text-anchor="middle" font-weight="normal">0</text><text x="404" y="109" fill="#333" font-size="18" text-anchor="middle" font-weight="normal">·</text><rect x="440" y="60" width="88" height="88" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="3"/><text x="484.0" y="52" fill="#222" font-size="12" text-anchor="middle" font-weight="600">Vᵀ  [n × n]</text><text x="484.0" y="164" fill="#666" font-size="10.5" text-anchor="middle" font-weight="normal">行 v₁ᵀ…vₙᵀ：互相垂直、长 1</text><text x="484" y="75.0" fill="#c0392b" font-size="10" text-anchor="middle" font-weight="normal">── v1ᵀ ──</text><text x="484" y="97.0" fill="#c0392b" font-size="10" text-anchor="middle" font-weight="normal">── v2ᵀ ──</text><text x="484" y="119.0" fill="#c0392b" font-size="10" text-anchor="middle" font-weight="normal">── v3ᵀ ──</text><text x="484" y="141.0" fill="#c0392b" font-size="10" text-anchor="middle" font-weight="normal">── v4ᵀ ──</text><text x="575" y="68" fill="#333" font-size="12" text-anchor="start" font-weight="600">另一种读法：</text><text x="575" y="90" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">W = σ₁ u₁v₁ᵀ + σ₂ u₂v₂ᵀ + … + σₙ uₙvₙᵀ</text><text x="575" y="110" fill="#333" font-size="11" text-anchor="start" font-weight="normal">n 个秩 1 矩阵的加权和，</text><text x="575" y="126" fill="#333" font-size="11" text-anchor="start" font-weight="normal">权重就是奇异值：σ 大的方向贡献大。</text><text x="575" y="152" fill="#333" font-size="11" text-anchor="start" font-weight="normal">秩 = 非零奇异值的个数。</text><text x="575" y="178" fill="#333" font-size="11" text-anchor="start" font-weight="normal">低秩近似（第五章）：只留前 r 项，</text><text x="575" y="194" fill="#333" font-size="11" text-anchor="start" font-weight="normal">U、Σ、Vᵀ 都只保留前 r 列 / 行。</text><line x1="40" y1="232" x2="720" y2="232" stroke="#ddd" stroke-width="1"/><text x="40" y="254" fill="#333" font-size="11.5" text-anchor="start" font-weight="normal">作用在向量上读：Wx = U ( Σ ( Vᵀ x ) )　→　先 Vᵀ 旋转（不改长度），再 Σ 沿各坐标轴拉伸（第 i 轴拉 σᵢ 倍），再 U 旋转到输出空间。</text><text x="40" y="274" fill="#666" font-size="11" text-anchor="start" font-weight="normal">m 是输出维、n 是输入维；U 的每一列是输出空间里的一个方向，Vᵀ 的每一行是输入空间里的一个方向，</text><text x="40" y="292" fill="#666" font-size="11" text-anchor="start" font-weight="normal">σᵢ 说的是"输入沿 vᵢ 的分量被放大多少倍、送到 uᵢ 方向去"。</text>
</svg>
