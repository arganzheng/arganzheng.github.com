<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="760" height="420" fill="#ffffff"/>
  <!-- plot area: x 70..690, y 40..320; left axis ms 0..120 (2.333 px/ms); right axis GB 0..20 (14 px/GB) -->
  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="70" y1="226.7" x2="690" y2="226.7"/>
    <line x1="70" y1="133.3" x2="690" y2="133.3"/>
    <line x1="70" y1="40" x2="690" y2="40"/>
  </g>
  <!-- axes -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="70" y1="320" x2="690" y2="320"/>
    <line x1="70" y1="40" x2="70" y2="320"/>
    <line x1="690" y1="40" x2="690" y2="320"/>
  </g>
  <!-- left ticks (ms) -->
  <g fill="#2e6da4" text-anchor="end">
    <text x="62" y="324">0</text>
    <text x="62" y="230.7">40</text>
    <text x="62" y="137.3">80</text>
    <text x="62" y="44">120</text>
  </g>
  <text x="18" y="180" fill="#2e6da4" font-size="13" text-anchor="middle" transform="rotate(-90 18 180)">step 时间（ms，柱）</text>
  <!-- right ticks (GB) -->
  <g fill="#c0392b" text-anchor="start">
    <text x="698" y="324">0</text>
    <text x="698" y="254">5</text>
    <text x="698" y="184">10</text>
    <text x="698" y="114">15</text>
    <text x="698" y="44">20</text>
  </g>
  <text x="742" y="180" fill="#c0392b" font-size="13" text-anchor="middle" transform="rotate(90 742 180)">峰值显存（GB，折线）</text>

  <!-- bars: width 44, centers 121.7 225 328.3 431.7 535 638.3 -->
  <g fill="#cfe0f3" stroke="#2e6da4" stroke-width="1.2">
    <rect x="99.7" y="207.5" width="44" height="112.5"/>
    <rect x="203" y="44.7" width="44" height="275.3"/>
    <rect x="306.3" y="201" width="44" height="119"/>
    <rect x="409.7" y="231.3" width="44" height="88.7"/>
    <rect x="513" y="252.3" width="44" height="67.7"/>
    <rect x="616.3" y="236" width="44" height="84" fill="#f4f4f4" stroke-dasharray="4 3"/>
  </g>
  <!-- bar value labels -->
  <g fill="#2e6da4" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="121.7" y="200">48.2</text>
    <text x="225" y="80" fill="#ffffff">118</text>
    <text x="328.3" y="194">51</text>
    <text x="431.7" y="224">38</text>
    <text x="535" y="245">29</text>
    <text x="638.3" y="229" fill="#777">36</text>
  </g>

  <!-- memory line -->
  <polyline points="121.7,276.6 225,45.6 328.3,140.8 431.7,153.4 535,202.4" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="535" y1="202.4" x2="638.3" y2="262.6" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4"/>
  <g fill="#c0392b" stroke="#fff" stroke-width="1.5">
    <circle cx="121.7" cy="276.6" r="5"/>
    <circle cx="225" cy="45.6" r="5"/>
    <circle cx="328.3" cy="140.8" r="5"/>
    <circle cx="431.7" cy="153.4" r="5"/>
    <circle cx="535" cy="202.4" r="5"/>
    <circle cx="638.3" cy="262.6" r="5" fill="#fff" stroke="#c0392b"/>
  </g>
  <g fill="#c0392b" font-size="11">
    <text x="150" y="281">3.1 GB</text>
    <text x="252" y="50">19.6 GB</text>
    <text x="355" y="145">12.8 GB</text>
    <text x="458" y="158">11.9 GB</text>
    <text x="562" y="207">8.4 GB</text>
    <text x="656" y="285" text-anchor="middle">4.1 GB</text>
  </g>

  <!-- x labels: two lines + throughput -->
  <g fill="#333" font-size="12" text-anchor="middle">
    <text x="121.7" y="340">基线</text>
    <text x="121.7" y="356" font-size="11">batch=8 fp32 eager</text>
    <text x="225" y="340">① batch→64</text>
    <text x="225" y="356" font-size="11">fp32 eager</text>
    <text x="328.3" y="340">② bf16 autocast</text>
    <text x="328.3" y="356" font-size="11">eager</text>
    <text x="431.7" y="340">③ torch.compile</text>
    <text x="431.7" y="356" font-size="11">Kernel 2100→640</text>
    <text x="535" y="340">④ SDPA</text>
    <text x="535" y="356" font-size="11">不物化 score</text>
    <text x="638.3" y="340" fill="#777">⑤ checkpoint</text>
    <text x="638.3" y="356" font-size="11" fill="#777">未采用</text>
  </g>
  <g fill="#1e8449" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="121.7" y="378">166 samples/s</text>
    <text x="225" y="378">542</text>
    <text x="328.3" y="378">1255</text>
    <text x="431.7" y="378">1684</text>
    <text x="535" y="378">2207</text>
    <text x="638.3" y="378" fill="#777" font-weight="normal">batch=128 时 1882</text>
  </g>
  <text x="380" y="404" fill="#555" font-size="12" text-anchor="middle">① 让 step 变长但吞吐 ×3.3（消灭 launch-bound）；②③④ 在 batch=64 下把 step 从 118 ms 压到 29 ms</text>
</svg>
