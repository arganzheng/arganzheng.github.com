<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 500" width="758" height="500" role="img" aria-labelledby="t d">
  <title id="t">显存到对端显存的三条路径：TCP、RDMA、RDMA + GDR</title>
  <desc id="d">三组 U 形路径。路径 A：发送端 GPU HBM 经 PCIe 到主机内存 staging，CPU memcpy 到内核 socket buffer，NIC DMA 上网线；接收端反向。每端 2 次拷贝，CPU 处理每个包。路径 B：GPU HBM 经 PCIe 到主机 pinned buffer，NIC DMA 上网线；接收端反向。每端 1 次拷贝，CPU 只下发请求、轮询完成。路径 C：网卡经 PCIe switch 直接 DMA 读写两端 GPU HBM，0 次拷贝，主机内存不在数据面上。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2d3d; }
      .head { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .bold { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .monob { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
      .muted { font-size: 12px; fill: #46586b; }
      .frame { fill: #f8fafc; stroke: #9fb3c8; stroke-width: 1.4; }
      .box { fill: #fff; stroke: #7f97b2; stroke-width: 1.4; }
      .cell { fill: #fff; stroke: #9fb3c8; stroke-width: 1.2; }
      .hcell { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .arrow { stroke: #40566f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .c-gpu { fill: #d9ead3; stroke: #6a9a5b; stroke-width: 1.4; }
      .c-host { fill: #fde8e8; stroke: #b94a48; stroke-width: 1.4; }
      .c-kern { fill: #fff0c2; stroke: #b08a1e; stroke-width: 1.4; }
      .c-wire { fill: #e8f0fd; stroke: #3a7bd5; stroke-width: 1.4; }
      .c-recv { fill: #cfe2f3; stroke: #3a6ea5; stroke-width: 1.2; }
      .c-send { fill: #fde0b8; stroke: #b9772a; stroke-width: 1.2; }
      .c-st { fill: #eef3f8; stroke: #40566f; stroke-width: 1.4; }
      .l0 { fill: #f3f6fa; stroke: #7f97b2; stroke-width: 1.4; }
      .l1 { fill: #e8eff7; stroke: #7f97b2; stroke-width: 1.4; }
      .l2 { fill: #dce7f3; stroke: #7f97b2; stroke-width: 1.4; }
      .axis { stroke: #40566f; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
<text x="12.0" y="26.0" class="head">路径 A：TCP/IP</text>
<text x="12.0" y="62.0" class="muted">发送端</text>
<text x="12.0" y="108.0" class="muted">接收端</text>
<rect x="698.0" y="42.0" width="48.0" height="76.0" class="c-wire"/>
<text x="722.0" y="85.0" class="bold" text-anchor="middle">网线</text>
<rect x="64.0" y="42.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="62.0" class="body" text-anchor="middle">GPU HBM</text>
<rect x="64.0" y="88.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="108.0" class="body" text-anchor="middle">GPU HBM</text>
<rect x="240.0" y="42.0" width="146.0" height="30.0" class="c-host"/>
<text x="313.0" y="62.0" class="body" text-anchor="middle">主机内存(staging)</text>
<rect x="240.0" y="88.0" width="146.0" height="30.0" class="c-host"/>
<text x="313.0" y="108.0" class="body" text-anchor="middle">主机内存(staging)</text>
<rect x="482.0" y="42.0" width="146.0" height="30.0" class="c-kern"/>
<text x="555.0" y="62.0" class="body" text-anchor="middle">内核 socket buffer</text>
<rect x="482.0" y="88.0" width="146.0" height="30.0" class="c-kern"/>
<text x="555.0" y="108.0" class="body" text-anchor="middle">内核 socket buffer</text>
<line x1="154.0" y1="57.0" x2="240.0" y2="57.0" class="arrow"/>
<text x="197.0" y="51.0" class="small" text-anchor="middle">PCIe</text>
<line x1="240.0" y1="103.0" x2="154.0" y2="103.0" class="arrow"/>
<text x="197.0" y="119.0" class="small" text-anchor="middle">PCIe</text>
<line x1="386.0" y1="57.0" x2="482.0" y2="57.0" class="arrow"/>
<text x="434.0" y="51.0" class="small" text-anchor="middle">CPU memcpy</text>
<line x1="482.0" y1="103.0" x2="386.0" y2="103.0" class="arrow"/>
<text x="434.0" y="119.0" class="small" text-anchor="middle">CPU memcpy</text>
<line x1="628.0" y1="57.0" x2="698.0" y2="57.0" class="arrow"/>
<text x="663.0" y="51.0" class="small" text-anchor="middle">NIC DMA</text>
<line x1="698.0" y1="103.0" x2="628.0" y2="103.0" class="arrow"/>
<text x="663.0" y="119.0" class="small" text-anchor="middle">NIC DMA</text>
<text x="12.0" y="156.0" class="body">拷贝：每端 2 次（PCIe 拷贝 + CPU 拷贝）　CPU：协议栈 + 拷贝，每个包都参与</text>
<text x="12.0" y="190.0" class="head">路径 B：RDMA，不开 GPUDirect</text>
<text x="12.0" y="226.0" class="muted">发送端</text>
<text x="12.0" y="272.0" class="muted">接收端</text>
<rect x="698.0" y="206.0" width="48.0" height="76.0" class="c-wire"/>
<text x="722.0" y="249.0" class="bold" text-anchor="middle">网线</text>
<rect x="64.0" y="206.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="226.0" class="body" text-anchor="middle">GPU HBM</text>
<rect x="64.0" y="252.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="272.0" class="body" text-anchor="middle">GPU HBM</text>
<rect x="240.0" y="206.0" width="146.0" height="30.0" class="c-host"/>
<text x="313.0" y="226.0" class="body" text-anchor="middle">主机 pinned buffer</text>
<rect x="240.0" y="252.0" width="146.0" height="30.0" class="c-host"/>
<text x="313.0" y="272.0" class="body" text-anchor="middle">主机 pinned buffer</text>
<line x1="154.0" y1="221.0" x2="240.0" y2="221.0" class="arrow"/>
<text x="197.0" y="215.0" class="small" text-anchor="middle">PCIe</text>
<line x1="240.0" y1="267.0" x2="154.0" y2="267.0" class="arrow"/>
<text x="197.0" y="283.0" class="small" text-anchor="middle">PCIe</text>
<line x1="386.0" y1="221.0" x2="698.0" y2="221.0" class="arrow"/>
<text x="542.0" y="215.0" class="small" text-anchor="middle">NIC DMA(PCIe)</text>
<line x1="698.0" y1="267.0" x2="386.0" y2="267.0" class="arrow"/>
<text x="542.0" y="283.0" class="small" text-anchor="middle">NIC DMA(PCIe)</text>
<text x="12.0" y="320.0" class="body">拷贝：每端 1 次（GPU↔主机的 PCIe 拷贝）　CPU：只下发请求、轮询完成，不碰数据</text>
<text x="12.0" y="354.0" class="head">路径 C：RDMA + GPUDirect RDMA</text>
<text x="12.0" y="390.0" class="muted">发送端</text>
<text x="12.0" y="436.0" class="muted">接收端</text>
<rect x="698.0" y="370.0" width="48.0" height="76.0" class="c-wire"/>
<text x="722.0" y="413.0" class="bold" text-anchor="middle">网线</text>
<rect x="64.0" y="370.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="390.0" class="body" text-anchor="middle">GPU HBM</text>
<rect x="64.0" y="416.0" width="90.0" height="30.0" class="c-gpu"/>
<text x="109.0" y="436.0" class="body" text-anchor="middle">GPU HBM</text>
<line x1="154.0" y1="385.0" x2="698.0" y2="385.0" class="arrow"/>
<text x="426.0" y="379.0" class="small" text-anchor="middle">NIC DMA(经 PCIe switch)</text>
<line x1="698.0" y1="431.0" x2="154.0" y2="431.0" class="arrow"/>
<text x="426.0" y="447.0" class="small" text-anchor="middle">NIC DMA(经 PCIe switch)</text>
<text x="12.0" y="484.0" class="body">拷贝：0 次　主机内存：不在数据面上　CPU：只下发请求、轮询完成</text>
</svg>
