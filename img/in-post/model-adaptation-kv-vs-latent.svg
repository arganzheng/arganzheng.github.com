<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img" aria-labelledby="t d">
  <title id="t">传统 KV Cache 与 MLA latent cache</title>
  <desc id="d">左边传统 KV Cache 每层保存 K_cache、V_cache 两块 [batch, seq, num_heads, head_dim]，右边 MLA 每层只保存一块窄的 latent_cache [batch, seq, latent_dim]，需要时经上投影展开成 K、V；底部给出 DeepSeek-V2 配置下每 token 每层的数值对比。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="272" y="30" text-anchor="middle" class="bold">传统 KV Cache（每层）</text><text x="650" y="30" text-anchor="middle" class="bold">MLA latent cache（每层）</text><line x1="34" y1="50" x2="34" y2="190" class="arrow"/><text transform="translate(28 120.0) rotate(-90)" text-anchor="middle" class="small">sequence_length</text><rect class="seg-kv" x="50" y="50" width="215" height="140"/><text x="157" y="125.0" text-anchor="middle" class="bold">K_cache</text><rect class="seg-kv" x="280" y="50" width="215" height="140"/><text x="387" y="125.0" text-anchor="middle" class="bold">V_cache</text><path class="brk" d="M50 198 V204 H265 V198"/><text x="157.5" y="221" text-anchor="middle" class="small">num_heads × head_dim</text><path class="brk" d="M280 198 V204 H495 V198"/><text x="387.5" y="221" text-anchor="middle" class="small">num_heads × head_dim</text><text x="272" y="242" text-anchor="middle" class="bold">K_cache、V_cache 两块</text><text x="272" y="262" text-anchor="middle" class="mono">[batch, seq, num_heads, head_dim]</text><text x="272" y="282" text-anchor="middle" class="body">每 token 每层：2 × num_heads × head_dim 个值</text><line x1="530" y1="16" x2="530" y2="300" class="line" style="stroke-dasharray:4 4"/><line x1="570" y1="50" x2="570" y2="190" class="arrow"/><text transform="translate(564 120.0) rotate(-90)" text-anchor="middle" class="small">sequence_length</text><rect class="seg-d" x="590" y="50" width="36" height="140"/><path class="brk" d="M590 198 V204 H626 V198"/><text x="608.0" y="221" text-anchor="middle" class="small">latent_dim</text><line x1="626" y1="120.0" x2="660" y2="120.0" class="arrow"/><rect class="seg-freefrag" x="660" y="86" width="88" height="68" style="stroke-dasharray:4 3"/><text x="704" y="108" text-anchor="middle" class="small">K、V</text><text x="704" y="126" text-anchor="middle" class="small">上投影</text><text x="704" y="144" text-anchor="middle" class="small">按需展开</text><text x="645" y="242" text-anchor="middle" class="bold">latent_cache 一块</text><text x="645" y="262" text-anchor="middle" class="mono">[batch, seq, latent_dim]</text><text x="645" y="282" text-anchor="middle" class="body">每 token 每层：latent_dim 个值</text><text x="380" y="312" text-anchor="middle" class="small">以 DeepSeek-V2 的配置为例：2 × 128 × 128 = 32768 对 512 + 64 = 576，约 1/57（图中宽度为示意，未按比例）</text>
</svg>
