<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <rect width="700" height="440" fill="#ffffff"/>
  <!-- plot area: x 70..660 (log10 I: -1..3, 147.5 px/decade), y 30..370 (log10 TFLOPS: -1..2, 113.3 px/decade) -->
  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="70" y1="370" x2="660" y2="370"/>
    <line x1="70" y1="256.7" x2="660" y2="256.7"/>
    <line x1="70" y1="143.4" x2="660" y2="143.4"/>
    <line x1="70" y1="30" x2="660" y2="30"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
    <line x1="217.5" y1="30" x2="217.5" y2="370"/>
    <line x1="365" y1="30" x2="365" y2="370"/>
    <line x1="512.5" y1="30" x2="512.5" y2="370"/>
    <line x1="660" y1="30" x2="660" y2="370"/>
  </g>
  <!-- axes -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="70" y1="370" x2="660" y2="370"/>
    <line x1="70" y1="30" x2="70" y2="370"/>
  </g>
  <!-- x ticks -->
  <g fill="#333" text-anchor="middle">
    <text x="70" y="388">0.1</text>
    <text x="217.5" y="388">1</text>
    <text x="365" y="388">10</text>
    <text x="512.5" y="388">100</text>
    <text x="660" y="388">1000</text>
    <text x="365" y="412" font-size="13">算术强度 I（FLOP/byte，对 HBM）</text>
  </g>
  <!-- y ticks -->
  <g fill="#333" text-anchor="end">
    <text x="62" y="374">0.1</text>
    <text x="62" y="260.7">1</text>
    <text x="62" y="147.4">10</text>
    <text x="62" y="34">100</text>
  </g>
  <text x="18" y="200" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 18 200)">可达性能（TFLOPS）</text>

  <!-- roofline: bandwidth slope P = 2.0 * I  from I=0.1 (P=0.2) to ridge (9.75, 19.5) -->
  <line x1="70" y1="335.9" x2="363.4" y2="110.5" stroke="#c0392b" stroke-width="2.5"/>
  <!-- compute roof -->
  <line x1="363.4" y1="110.5" x2="660" y2="110.5" stroke="#1e8449" stroke-width="2.5"/>
  <!-- ridge marker -->
  <line x1="363.4" y1="110.5" x2="363.4" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="363.4" y="362" fill="#555" font-size="11" text-anchor="start" dx="4">ridge ≈ 10</text>
  <text x="150" y="215" fill="#c0392b" font-size="12" transform="rotate(-37.5 150 215)">HBM 2.0 TB/s</text>
  <text x="520" y="102" fill="#1e8449" font-size="12" text-anchor="middle">FP32 CUDA Core 19.5 TFLOPS</text>

  <!-- vertical guide at I = 32 (v3/v4/v5 share x) -->
  <line x1="439.5" y1="110.5" x2="439.5" y2="150" stroke="#2e6da4" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- points -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="128.7" cy="301.8" r="6" fill="#c0392b"/>
    <circle cx="350.7" cy="202.6" r="6" fill="#c0392b"/>
    <circle cx="439.5" cy="143.4" r="6" fill="#b9770e"/>
    <circle cx="439.5" cy="132.4" r="6" fill="#b9770e"/>
    <circle cx="439.5" cy="125.1" r="6" fill="#1e8449"/>
    <circle cx="402.6" cy="115.8" r="6" fill="#1e8449"/>
    <circle cx="635.6" cy="110.5" r="6" fill="#2e6da4"/>
  </g>
  <!-- labels -->
  <g fill="#333" font-size="11">
    <text x="140" y="306">v1 naive  I=0.25, ~2%</text>
    <text x="283" y="222" text-anchor="end">v2 smem 32×32  I=8, ~15%</text>
    <text x="452" y="162">v3 寄存器分块  I=32, ~50%</text>
    <text x="452" y="147">v4 float4 + 转置  ~63%</text>
    <text x="452" y="132">v5 cp.async 流水  ~75%</text>
    <text x="396" y="98" text-anchor="end">cuBLAS ~90%</text>
    <text x="650" y="98" text-anchor="end">理论 I=683，19.5 TFLOPS</text>
  </g>
  <!-- path arrows v1 -> v2 -> v3 -> v4 -> v5 -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <g stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="3 3">
    <path d="M136,297 Q 240,260 342,207"/>
    <path d="M357,198 Q 400,175 432,149"/>
  </g>
  <text x="240" y="245" fill="#666" font-size="11">分块：向右走（提高 I）</text>
  <text x="452" y="178" fill="#666" font-size="11">流水线：向上走（贴近 roof）</text>
</svg>
