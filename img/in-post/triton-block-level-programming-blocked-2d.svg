<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 459" width="760" height="459" role="img" aria-labelledby="t d">
  <title id="t">sizePerThread=[1,8], threadsPerWarp=[8,4] 在 [128,32] tile 上的铺法</title>
  <desc id="d">#blocked&lt;{sizePerThread=[1,8], threadsPerWarp=[8,4], warpsPerCTA=[4,1], order=[1,0]}&gt; 作用在 [128, 32] 的 BF16 A tile 上。每格是 1 个线程的 8 个连续 BF16 = 16 B = 一条 128 bit load。列分成 0-7、8-15、16-23、24-31 四段。warp 0 铺行 0-7：行 r 的四段依次是 t(4r) 到 t(4r+3)，行 0 是 t0 t1 t2 t3，行 7 是 t28 t29 t30 t31；warp 0 覆盖 8 行 × 32 列。warp 1 铺行 8-15，warp 2 铺行 16-23，warp 3 铺行 24-31，4 个 warp 一轮铺 32 行；行 32-127 再走 3 轮，每线程共持有 4 × 8 = 32 个元素。同一行的 4 个线程各取连续 16 B，一行 64 B 一次合并访问；行与行之间隔 K × 2 B，warp 0 的一条 load 是 8 段各 64 B。</desc>
