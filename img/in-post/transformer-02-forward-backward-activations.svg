<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="450" y="24" fill="#222" font-size="13.5" text-anchor="middle" font-weight="600">前向沿路把激活值存下来，反向从 loss 出发沿原路走回去、边用边释放，每个参数得到 .grad</text><rect x="30" y="60" width="115" height="40" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="87.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">wte + wpe</text><line x1="145" y1="80" x2="173" y2="80" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><rect x="30" y="124" width="115" height="48" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="4" stroke-dasharray="4 2"/><text x="87.5" y="142" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">token 向量</text><line x1="87.5" y1="100" x2="87.5" y2="122" stroke="#c98a00" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="30" y="210" width="115" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1" rx="4"/><text x="87.5" y="229" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">.grad</text><line x1="87.5" y1="172" x2="87.5" y2="208" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)"/><rect x="175" y="60" width="115" height="40" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="232.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">block0</text><line x1="290" y1="80" x2="318" y2="80" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><rect x="175" y="124" width="115" height="48" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="4" stroke-dasharray="4 2"/><text x="232.5" y="142" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">LN 输入、Q/K/V、</text><text x="232.5" y="156" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">attention 权重、4d 中间量</text><line x1="232.5" y1="100" x2="232.5" y2="122" stroke="#c98a00" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="175" y="210" width="115" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1" rx="4"/><text x="232.5" y="229" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">.grad</text><line x1="232.5" y1="172" x2="232.5" y2="208" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)"/><rect x="320" y="60" width="115" height="40" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="377.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">block1</text><line x1="435" y1="80" x2="463" y2="80" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><rect x="320" y="124" width="115" height="48" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="4" stroke-dasharray="4 2"/><text x="377.5" y="142" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">LN 输入、Q/K/V、</text><text x="377.5" y="156" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">attention 权重、4d 中间量</text><line x1="377.5" y1="100" x2="377.5" y2="122" stroke="#c98a00" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="320" y="210" width="115" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1" rx="4"/><text x="377.5" y="229" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">.grad</text><line x1="377.5" y1="172" x2="377.5" y2="208" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)"/><rect x="465" y="60" width="115" height="40" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="522.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">ln_f</text><line x1="580" y1="80" x2="608" y2="80" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><rect x="465" y="124" width="115" height="48" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="4" stroke-dasharray="4 2"/><text x="522.5" y="142" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">LN 输入</text><line x1="522.5" y1="100" x2="522.5" y2="122" stroke="#c98a00" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="465" y="210" width="115" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1" rx="4"/><text x="522.5" y="229" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">.grad</text><line x1="522.5" y1="172" x2="522.5" y2="208" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)"/><rect x="610" y="60" width="115" height="40" fill="#eef4fb" stroke="#1f6fb2" stroke-width="1.3" rx="6"/><text x="667.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">lm_head</text><line x1="725" y1="80" x2="753" y2="80" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#ar)"/><rect x="610" y="124" width="115" height="48" fill="#fff4e0" stroke="#c98a00" stroke-width="1" rx="4" stroke-dasharray="4 2"/><text x="667.5" y="142" fill="#333" font-size="9.5" text-anchor="middle" font-weight="normal">ln_f 输出</text><line x1="667.5" y1="100" x2="667.5" y2="122" stroke="#c98a00" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3 2"/><rect x="610" y="210" width="115" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="1" rx="4"/><text x="667.5" y="229" fill="#c0392b" font-size="11" text-anchor="middle" font-weight="600">.grad</text><line x1="667.5" y1="172" x2="667.5" y2="208" stroke="#c0392b" stroke-width="1" marker-end="url(#ar)"/><rect x="755" y="60" width="115" height="40" fill="#fdeeee" stroke="#c0392b" stroke-width="1.3" rx="6"/><text x="812.5" y="85" fill="#222" font-size="12" text-anchor="middle" font-weight="600">loss</text><path d="M812.5,100 L812.5,264 L87.5,264 L87.5,244" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/><text x="818.5" y="190" fill="#c0392b" font-size="10.5" text-anchor="start" font-weight="normal">反向起点</text><text x="392.5" y="280" fill="#c0392b" font-size="10.5" text-anchor="middle" font-weight="normal">反向：loss → lm_head → ln_f → block1 → block0 → wte / wpe</text><text x="30" y="304" fill="#333" font-size="11" text-anchor="start" font-weight="normal">橙框（激活值）：前向时存下、反向用到才释放；它的大小 ∝ B × T，参数量与 B × T 无关——所以上下文越长，激活值越可能比参数本身还大。</text><text x="30" y="322" fill="#333" font-size="11" text-anchor="start" font-weight="normal">红线（反向）：顺序与前向相反，lm_head → ln_f → block1 → block0 → wte / wpe；每一站用自己存下的激活值算出本站参数的 .grad。</text>
</svg>
