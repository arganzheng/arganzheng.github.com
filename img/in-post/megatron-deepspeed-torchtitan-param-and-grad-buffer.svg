<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">_ParamAndGradBuffer：param_data、grad_data 与 bucket</title>
  <desc id="d">三条并排的内存条：bf16 的 param_data 与 fp32 的 grad_data 按反向顺序放 W_L、b_L、W_L-1、pad 等参数并分成 bucket 0 / bucket 1；下面是每个 bucket 按 dp_size=4 等分的 shard_buffer，rank 的分片边界用虚线穿过上面两条，表示它不与参数边界对齐。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#40566f"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .bold { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .frame { fill: #f8fafc; stroke: #bcc9d6; stroke-width: 1.4; rx: 12; }
      .card { fill: #fff; stroke: #c5d0dc; stroke-width: 1.2; rx: 8; }
      .request { fill: #e9f4ee; stroke: #70a582; stroke-width: 1.2; rx: 8; }
      .compute { fill: #eef5ff; stroke: #5880b4; stroke-width: 1.2; rx: 8; }
      .memory { fill: #eff9f4; stroke: #4b9477; stroke-width: 1.2; rx: 8; }
      .waiting { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .seg-a { fill: #dbe8fb; stroke: #40566f; stroke-width: 1.2; }
      .seg-b { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-wait { fill: #fff; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .seg-free { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-mark { fill: #fff5e6; stroke: #d79a45; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .axis { stroke: #7a8b9c; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .seg-used { fill: #5880b4; stroke: #40566f; stroke-width: 1.2; }
      .seg-reserved { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-freefrag { fill: #fff; stroke: #40566f; stroke-width: 1.2; }
      .seg-hash { fill: #fff5e6; stroke: #40566f; stroke-width: 1.2; }
      .seg-q { fill: #eef5ff; stroke: #40566f; stroke-width: 1.2; }
      .seg-kv { fill: #e3f1e8; stroke: #40566f; stroke-width: 1.2; }
      .seg-c { fill: #e8edf2; stroke: #40566f; stroke-width: 1.2; }
      .seg-d { fill: #f5e9f7; stroke: #40566f; stroke-width: 1.2; }
      .brk { stroke: #40566f; stroke-width: 1.4; fill: none; }
      .white { fill: #fff; }
    </style>
  </defs>
<text x="380" y="20" text-anchor="middle" class="small">一个 _ParamAndGradBuffer：同一 (param_dtype, grad_dtype) 组的全部参数</text><text x="380" y="37" text-anchor="middle" class="small">按反向顺序排列（最后一层在最前）；dp_size = 4，每个 bucket 的 shard_buffer 切 4 份</text><path class="brk" d="M150 66 V72 H534 V66"/><text x="342.0" y="89" text-anchor="middle" class="small"></text><text x="342.0" y="64" text-anchor="middle" class="bold">bucket 0</text><path class="brk" d="M534 66 V72 H710 V66"/><text x="622.0" y="89" text-anchor="middle" class="small"></text><text x="622.0" y="64" text-anchor="middle" class="bold">bucket 1</text><text x="20" y="120.0" text-anchor="start" class="mono">param_data</text><text x="20" y="135.0" text-anchor="start" class="small">(bf16)</text><rect class="seg-a" x="150" y="100" width="144.0" height="40"/><text x="222.0" y="125.0" text-anchor="middle" class="mono">W_L</text><rect class="seg-a" x="294.0" y="100" width="48.0" height="40"/><text x="318.0" y="125.0" text-anchor="middle" class="mono">b_L</text><rect class="seg-a" x="342.0" y="100" width="120.0" height="40"/><text x="402.0" y="125.0" text-anchor="middle" class="mono">W_L-1</text><rect class="seg-free" x="462.0" y="100" width="72.0" height="40"/><text x="498.0" y="125.0" text-anchor="middle" class="mono">pad</text><rect class="seg-a" x="534.0" y="100" width="88" height="40"/><text x="578.0" y="125.0" text-anchor="middle" class="mono">W_L-2</text><rect class="seg-free" x="622.0" y="100" width="44" height="40"/><text x="644.0" y="125.0" text-anchor="middle" class="mono">…</text><rect class="seg-free" x="666.0" y="100" width="44" height="40"/><text x="688.0" y="125.0" text-anchor="middle" class="mono">pad</text><text x="20" y="178.0" text-anchor="start" class="mono">grad_data</text><text x="20" y="193.0" text-anchor="start" class="small">(fp32)</text><rect class="seg-b" x="150" y="158" width="144.0" height="40"/><text x="222.0" y="183.0" text-anchor="middle" class="mono">dW_L</text><rect class="seg-b" x="294.0" y="158" width="48.0" height="40"/><text x="318.0" y="183.0" text-anchor="middle" class="mono">db_L</text><rect class="seg-b" x="342.0" y="158" width="120.0" height="40"/><text x="402.0" y="183.0" text-anchor="middle" class="mono">dW_L-1</text><rect class="seg-free" x="462.0" y="158" width="72.0" height="40"/><text x="498.0" y="183.0" text-anchor="middle" class="mono">pad</text><rect class="seg-b" x="534.0" y="158" width="88" height="40"/><text x="578.0" y="183.0" text-anchor="middle" class="mono">dW_L-2</text><rect class="seg-free" x="622.0" y="158" width="44" height="40"/><text x="644.0" y="183.0" text-anchor="middle" class="mono">…</text><rect class="seg-free" x="666.0" y="158" width="44" height="40"/><text x="688.0" y="183.0" text-anchor="middle" class="mono">pad</text><text x="20" y="234.0" text-anchor="start" class="mono">shard_buffer</text><text x="20" y="250.0" text-anchor="start" class="small">(每 bucket 切</text><text x="20" y="264.0" text-anchor="start" class="small"> dp_size=4 份)</text><rect class="seg-c" x="150" y="216" width="96" height="40"/><text x="198.0" y="241.0" text-anchor="middle" class="mono">rank0</text><rect class="seg-c" x="246" y="216" width="96" height="40"/><text x="294.0" y="241.0" text-anchor="middle" class="mono">rank1</text><rect class="seg-c" x="342" y="216" width="96" height="40"/><text x="390.0" y="241.0" text-anchor="middle" class="mono">rank2</text><rect class="seg-c" x="438" y="216" width="96" height="40"/><text x="486.0" y="241.0" text-anchor="middle" class="mono">rank3</text><rect class="seg-c" x="534" y="216" width="44" height="40"/><text x="556.0" y="241.0" text-anchor="middle" class="mono">r0</text><rect class="seg-c" x="578" y="216" width="44" height="40"/><text x="600.0" y="241.0" text-anchor="middle" class="mono">r1</text><rect class="seg-c" x="622" y="216" width="44" height="40"/><text x="644.0" y="241.0" text-anchor="middle" class="mono">r2</text><rect class="seg-c" x="666" y="216" width="44" height="40"/><text x="688.0" y="241.0" text-anchor="middle" class="mono">r3</text><line x1="246" y1="92" x2="246" y2="216" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="246" y="88" text-anchor="middle" style="font:10px ui-monospace,Menlo,monospace;fill:#d9822b">rank0|rank1</text><line x1="342" y1="92" x2="342" y2="216" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="342" y="88" text-anchor="middle" style="font:10px ui-monospace,Menlo,monospace;fill:#d9822b">rank1|rank2</text><line x1="438" y1="92" x2="438" y2="216" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="438" y="88" text-anchor="middle" style="font:10px ui-monospace,Menlo,monospace;fill:#d9822b">rank2|rank3</text><text x="342.0" y="284" text-anchor="middle" class="small">分片边界 ≠ 参数边界：W_L 前 8 个元素归 rank0、后 4 个归 rank1（橙色虚线是各 rank 段的边界）</text>
</svg>
