t-size="9" text-anchor="middle" font-weight="normal">5</text><text x="60" y="130" fill="#333" font-size="11" text-anchor="start" font-weight="600">x：shape=(2, 3)，stride=(3, 1)　offset = i·3 + j</text><rect x="100" y="148" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="140.0" y="166.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,0)→0</text><rect x="180" y="148" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="220.0" y="166.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,1)→1</text><rect x="260" y="148" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="300.0" y="166.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(0,2)→2</text><text x="94" y="166.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=0</text><rect x="100" y="176" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="140.0" y="194.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,0)→3</text><rect x="180" y="176" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="220.0" y="194.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,1)→4</text><rect x="260" y="176" width="80" height="28" fill="#fff" stroke="#1f6fb2" stroke-width="1.2" rx="0"/><text x="300.0" y="194.0" fill="#222" font-size="11" text-anchor="middle" font-weight="normal">(1,2)→5</text><text x="94" y="194.0" fill="#666" font-size="10" text-anchor="end" font-weight="normal">i=1</text><text x="140.0" y="142" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=0</text><text x="220.0" y="142" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=1</text><text x="300.0" y="142" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=2</text><text x="350" y="166" fill="#666" 