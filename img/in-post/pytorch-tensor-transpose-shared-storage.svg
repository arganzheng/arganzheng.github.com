/text><text x="220.0" y="244" fill="#666" font-size="10" text-anchor="middle" font-weight="normal">j=1</text><text x="280" y="268" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">读第 0 行：idx 0, 3</text><text x="280" y="296" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">读第 1 行：idx 1, 4</text><text x="280" y="324" fill="#666" font-size="10.5" text-anchor="start" font-weight="normal">读第 2 行：idx 2, 5</text><text x="470" y="270" fill="#333" font-size="11" text-anchor="start" font-weight="600">x 按逻辑顺序遍历访问的 storage 下标：</text><text x="470" y="288" fill="#1f6fb2" font-size="12" text-anchor="start" font-weight="600">0 1 2 3 4 5（连续）</text><text x="470" y="314" fill="#333" font-size="11" text-anchor="start" font-weight="600">y 按逻辑顺序遍历访问的 storage 下标：</text><text x="470" y="332" fill="#c0392b" font-size="12" text-anchor="start" font-weight="600">0 3 1 4 2 5（跳跃）</text>
